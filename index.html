o put into A Geosynchronous Transfer Orbit (GTO) (which is used to efficiently place satellites into geosynchronous orbit (~35,786 km altitude)."},{"h":"Why:","t":"Going directly to such a high orbit would require huge amounts of rocket fuel, so GTO saves energy."}],"v":"35c469"},{"id":"space-economy-significance:key-projects-technologies-related-to-spa#2","path":["KEY PROJECTS & TECHNOLOGIES RELATED TO SPACE"],"part":[2,4],"rows":[{"h":"How:","t":"The rocket first puts the satellite into a long, oval-shaped orbit where the low point (perigee) is close to Earth and the high point (apogee) reaches geosynchronous height. When the satellite reaches apogee, it fires its own engine to raise the low point and make the orbit circular."},{"h":"For what:","t":"Mostly for communication, weather, and navigation satellites that need to stay fixed relative to one spot on Earth.)"},{"h":"main problem of manned missions in microgravity :","t":"Astronaut Health: NASA observes weight-bearing bone loss of 1% to 1.5% per month in microgravity"},{"t":"BAS is India’s planned space station for scientific research which will orbit around 400-450 km above the Earth’s surface, It will have five modules and will be built in phases, Targets: operationalized by 2035."},{"t":"The Space Docking Experiment (SPADEX) is an ISRO mission to demonstrate autonomous docking between two spacecraft in orbit."},{"t":"It involves a chaser and a target satellite, where the chaser approaches, aligns, and connects with the target without human control."},{"t":"This technology is vital for future projects like assembling large structures in space, refueling satellites, and supporting the Indian Space Station. The experiment also helps India build capabilities for long-duration human space missions."},{"t":"An indigenous tech called A GNSS-based RODP (Novel Relative Orbit Determination and Propagation (RODP) ) processor is a small onboard computer that figures out, in real time, where the chaser spacecraft is relative to the target (position) and how fast it’s moving relative to it (velocity)."}],"v":"a990e8"},{"id":"space-economy-significance:key-projects-technologies-related-to-spa#3","path":["KEY PROJECTS & TECHNOLOGIES RELATED TO SPACE"],"part":[3,4],"rows":[{"t":"ISRO’s Third Launch Pad (TLP) at Sriharikota is being developed to handle heavier and more frequent launches, including Gaganyaan human spaceflight missions."},{"t":"It will have advanced crew access towers, emergency escape systems, and upgraded fueling and integration facilities."},{"t":"The pad is designed to support future heavy-lift rockets beyond LVM-3 and support Next generation launch vehicles (NGLV) (Current PSLV/GSLV use a mix of solid, earth-storable liquid, and cryogenic stages and now NGLV will use semi-cryogenic engines (LOX + kerosene) for the core stage → cleaner, cheaper, and more efficient with higher thrust), improve turnaround time between launches, and enhance safety by separating human-rated missions from routine commercial or scientific launches."},{"t":"Light doesn’t just have brightness (how strong it is), it also has a “vibration direction” called polarisation. Polarimetry means studying this direction of vibration. Why useful? Because when light passes through gas, dust, or strong magnetic fields in space, its polarisation changes. By measuring that change, scientists can learn about what the light has passed through and the nature of stars, black holes, and galaxies. Example: Two stars may look the same brightness, but polarimetry can show one is surrounded by dust while the other isn’t."},{"t":"NISAR (ISRO + NASA) (sun-synchronous satellite) (NASA provided L-BAND (GPS, High rate telecomm sys, solid state recorder and 12 meter deployable antenna) ISRO contirb (S Band; spacecraft bus, GSLV-F16 launch vehicle)"},{"h":"SweepSAR (Swept Synthetic Aperture Radar):","t":"Produces high-resolution, wide-swath images across a broad range of terrain."},{"t":"In SAR, an instrument sends out a pulse of energy and then records the amount of that energy reflected back after it interacts with Earth."}],"v":"3cf608"},{"id":"space-economy-significance:key-projects-technologies-related-to-spa#4","path":["KEY PROJECTS & TECHNOLOGIES RELATED TO SPACE"],"part":[4,4],"rows":[{"h":"Repeat Cycle:","t":"Provides high-resolution data every 12 days to monitor land changes across Earth."},{"h":"Antenna and Resolution:","t":"The satellite features a large, 12-metre diameter common unfurlable reflector antenna."},{"h":"Open-Data Policy:","t":"Information collected will be freely available to global scientific communit"},{"img":10},{"t":"<span class=\"lst\"><span class=\"li\">INSAT D/3DR (provide weather forecasting resource satelitte)<\/span><br><span class=\"li\">ISRO’s HOPE (himalyan outpost for planetary exploration) (Tso kar valley)<\/span><\/span>"},{"t":"A specially designed Habitat Module for crew living and a Utility Module for operations and support systems which are interconnected for seamless workflow"},{"t":"ASTROSAT (to study celestial objects across X-rays, ultravoilet, optical wavelength simulatenously and launched via PSLV-C30 from sriharikota)"}],"v":"b79e7f"},{"id":"space-economy-significance:key-projects-technologies-related-to-spa/technology-demonstrator-satellitte-01-an#1","path":["KEY PROJECTS & TECHNOLOGIES RELATED TO SPACE","Technology demonstrator satellitte 01 and high thrust electric propulsion"],"part":[1,2],"rows":[{"t":"Currently, when a rocket drops a communication satellite into space, the satellite is not yet in its final resting place. It has to travel from a temporary transfer orbit up to a Geostationary Orbit (about 36,000 km high). Once there, it has to constantly fire small thrusters to maintain its position against the gravitational pull of the moon and the sun (a process called \"station-keeping\")."},{"t":"<b>Chemical rockets<\/b> do this by mixing heavy liquid fuels and oxidizers, setting them on fire, and blowing the resulting explosion out the back."},{"t":"Because chemical combustion is highly inefficient in space, a standard 4-ton satellite requires about <b>2 to 2.5 tons<\/b> of heavy liquid fuel just to survive its 15-year lifespan. You are essentially spending millions of dollars to launch a giant, floating gas tank."},{"h":"solution = Electric Propulsion :","t":"Electric propulsion completely abandons fire and combustion. Instead, it relies on electricity and electromagnetism to generate thrust. ISRO's system specifically uses a <b>Stationary Plasma Thruster (SPT)<\/b>."}],"v":"2b0cec"},{"id":"space-economy-significance:key-projects-technologies-related-to-spa/technology-demonstrator-satellitte-01-an#2","path":["KEY PROJECTS & TECHNOLOGIES RELATED TO SPACE","Technology demonstrator satellitte 01 and high thrust electric propulsion"],"part":[2,2],"rows":[{"sec":"Here is the step-by-step mechanism:"},{"h":"<b>The Fuel:<\/b>","t":"Instead of heavy liquid chemicals, the satellite carries a small amount of an inert gas, like <b>Argon<\/b> or <b>Xenon<\/b> (roughly 200 kg)."},{"h":"<b>The Power:<\/b>","t":"The satellite's massive solar panels capture sunlight and convert it into high-voltage electricity."},{"h":"<b>Ionization:<\/b>","t":"This electricity is used to strip electrons away from the Argon gas atoms, turning the neutral gas into a highly charged \"plasma\" of positive ions."},{"h":"<b>The Thrust:<\/b>","t":"The engine uses powerful electromagnetic fields to accelerate these charged ions out the back of the engine at mind-boggling speeds (up to 30 to 50 kilometers <i>per second<\/i>—vastly faster than the exhaust of a chemical rocket)."},{"t":"Why 2 Tons Drops to 200 Kg (The Concept of Specific Impulse)"},{"t":"In rocket science, fuel efficiency is measured by <b>Specific Impulse (Isp)<\/b>. It measures how much thrust you get out of every single drop of fuel. Because electric thrusters shoot particles out at such extreme velocities, their specific impulse is <b>5 to 6 times higher<\/b> than chemical rockets. You are getting vastly more momentum out of a single atom of Argon than you would from a massive drop of liquid fuel. Therefore, you simply do not need to carry as much physical mass to do the same amount of work in space."},{"h":"adv :","t":"cost and capacity and lifespan"},{"h":"disadv :","t":"LOW THRUST (A chemical thruster provides a massive, violent push that gets a satellite to its final orbit in roughly <b>one week<\/b>. An electric thruster provides a gentle, continuous push. It will take the TDS-01 <b>up to three months)<\/b>"}],"v":"2d73ac"},{"id":"space-economy-significance:key-projects-technologies-related-to-spa/radioisotope-thermoelectric-generators-r","path":["KEY PROJECTS & TECHNOLOGIES RELATED TO SPACE","Radioisotope Thermoelectric Generators - RTG"],"rows":[{"h":"<b>The Problem:<\/b>","t":"Solar panels are great for Earth-orbiting satellites. However, if you want to send a mission to the dark side of the Moon, to deep space (like Jupiter), or survive the freezing 14-day Lunar Night (which effectively \"froze\" the Chandrayaan-3 rover), solar power is useless."},{"h":"<b>The Solution:<\/b>","t":"ISRO, in collaboration with the Bhabha Atomic Research Centre (BARC), is developing RTGs. These are essentially nuclear batteries. They do not use fission like a power plant; instead, they use the natural heat released by the decay of a radioactive material (like Plutonium-238). Thermocouples then convert this heat directly into electricity."},{"h":"<b>Why it matters:<\/b>","t":"It provides a reliable, continuous power source for decades, independent of sunlight. This technology is absolutely essential for India's upcoming deep planetary missions and for sustaining the future Bharatiya Antariksh Station."}],"v":"f12d4e"},{"id":"space-economy-significance:key-projects-technologies-related-to-spa/problems-of-crewed-mission","path":["KEY PROJECTS & TECHNOLOGIES RELATED TO SPACE","problems of crewed mission"],"rows":[{"t":"Life support system (must ensure air regeneration), beyond LEO (Radiation protection), During re-entry, spacecraft face temperatures up to 7,000°F, Human-rated rockets must meet stricter safety standards, Manned space missions incur higher costs, Training and selection of astronauts"}],"v":"dd04fe"},{"id":"space-economy-significance:key-projects-technologies-related-to-spa/artemis-ii","path":["KEY PROJECTS & TECHNOLOGIES RELATED TO SPACE","Artemis II"],"rows":[{"t":"Crewed Lunar Flyby Mission under the NASA’s Artemis Program(to return to moon)"},{"h":"Launch Vehicle:","t":"Space Launch System (SLS)"},{"h":"objectives :","t":"1) crew flight 2) emergency system capabilities 3) go to moon"},{"h":"signifiacene :","t":"1) yay moon 2) safety in deep space 3) woman + 1st non american (Canadian Space Agency's Jeremy Hansen) 4) geological observation of the moon (lava flows and carters) 5) Astronaut Health Studies: ARCHeR (to monitor astronauts' well-being, activity, and sleep), AVATAR (Uses organ-on-a-chip devices to study the effects of microgravity and increased radiation on the health of the crew)."}],"v":"b1fc0a"},{"id":"space-economy-significance:launch-vehicles#1","path":["LAUNCH VEHICLES"],"part":[1,5],"rows":[{"h":"PSLV -","t":"Four-stage workhorse for placing small-to-medium payloads in polar/SSO/LEO; highly reliable but not for heavy GTO missions."},{"h":"NGLV -","t":"Future modular, semi-cryogenic, partially reusable rocket for heavier, cheaper, and faster-turnaround launches."},{"h":"GSLV Mk I -","t":"Early three-stage GTO launcher using a Russian cryogenic upper stage; limited payload and low success rate."},{"h":"GSLV Mk II -","t":"Improved Mk I with an indigenous CE-7.5 cryogenic engine; ~2.5 t to GTO capability."},{"h":"GSLV Mk III -","t":"Now called LVM-3; India’s most powerful operational launcher, heavy-lift with CE-20 cryogenic stage."}],"v":"4d7191"},{"id":"space-economy-significance:launch-vehicles#2","path":["LAUNCH VEHICLES"],"part":[2,5],"rows":[{"h":"SSLV -","t":"Small Satellite Launch Vehicle for quick, low-cost launches of payloads up to ~500 kg to LEO; minimal infrastructure."},{"h":"LVM-3 -","t":"New name for GSLV Mk III, used for Chandrayaan-2/3 and planned for Gaganyaan human spaceflight. (Max capacity : 4000 kg ) (a new navy related GSAT-7R will replace GSAT-7 for navy)"},{"h":"SLV-3 -","t":"India’s first experimental orbital launcher developed in the 1970s (small lift ~40 kg )."},{"h":"ASLV (Augmented SLV) -","t":"Improved SLV predecessor to PSLV (upgraded solid stages)."},{"h":"LMLV -","t":"New super-heavy launch vehicle for crewed lunar missions / deep-space (~80 t to LEO) - announced in Aug 2025. improved version of next gen launch vehicle"}],"v":"43b76e"},{"id":"space-economy-significance:launch-vehicles#3","path":["LAUNCH VEHICLES"],"part":[3,5],"rows":[{"sec":"These are under development or demonstrators:"},{"h":"HRLV (Human Rated Launch Vehicle) -","t":"Human-rated variant of LVM-3 (for Gaganyaan)."},{"h":"Reusable Launch Vehicle -","t":"Technology Demonstrator (RLV-TD) - Winged spaceplane testbed (not a full orbital rocket)."},{"h":"VIKRAM -1 Developer:","t":"Skyroot Aerospace — a private Indian space-startup based in Hyderabad"},{"t":"India’s new private orbital-class launch vehicle."},{"h":"What does G stand for ?","t":"A geostationary satellite is a satellite that orbits the Earth at the same speed that the Earth rotates, so it appears to stay fixed over one point on the equator.<br>It orbits at an altitude of about 35,786 km and takes 24 hours to complete one revolution - exactly the same time the Earth takes to rotate once."},{"t":"Geosynchronous satellite means a satellite that orbits the Earth once every 24 hours, matching the Earth’s rotation period. Because its orbital period is the same as Earth’s rotation, it always stays above the same longitude but not necessarily the same spot - if its orbit is tilted or elliptical, it appears to move in a figure-8 pattern in the sky. So, while it’s “synchronized” with Earth’s rotation (geo + synchronous), it isn’t “stationary.”"}],"v":"ce3ef6"},{"id":"space-economy-significance:launch-vehicles#4","path":["LAUNCH VEHICLES"],"part":[4,5],"rows":[{"t":"Geosynchronous Transfer Orbit (GTO) is an elliptical orbit used to move a satellite from low Earth orbit (LEO) to a geosynchronous or geostationary orbit.<br>Here’s how it works"},{"t":"A rocket first places the satellite into LEO (a few hundred km above Earth)."},{"t":"Then it gives a boost to place it in an elliptical orbit - the GTO where:"},{"t":"The perigee (closest point to Earth) is near LEO,<br>The apogee (farthest point) reaches geostationary altitude (~35,786 km)."},{"t":"When the satellite reaches the apogee, its onboard thrusters fire to circularize the orbit, converting the GTO into a geosynchronous (or geostationary) orbit."},{"img":11},{"h":"What is polar sun synchronous ?","t":"A Polar Sun-Synchronous Satellite (often just called a Sun-synchronous satellite) orbits the Earth in such a way that it:"}],"v":"14642d"},{"id":"space-economy-significance:launch-vehicles#5","path":["LAUNCH VEHICLES"],"part":[5,5],"rows":[{"t":"Moves nearly over the poles (North and South) - that’s the polar part."},{"t":"Crosses the same region of Earth at the same local solar time each day - that’s the sun-synchronous part. So, it combines a polar orbit + sun-synchronous timing → allowing consistent sunlight conditions for observation. How it moves:"},{"t":"The satellite travels north-south while the Earth rotates east-west beneath it."},{"t":"Over time, the satellite passes over every part of the Earth as the planet spins."},{"t":"<span class=\"lst\"><span class=\"li\">Its orbit is tilted at about 98° to the equator (slightly retrograde).<\/span><br><span class=\"li\">It orbits at an altitude of around 600-800 km<\/span><\/span>"}],"v":"571c10"},{"id":"space-economy-significance:solar-mission-orbital-mechanics","path":["SOLAR MISSION & ORBITAL MECHANICS"],"rows":[{"t":"Aditya L1 (1st ever image of solar kernel) (study suns corona (outermost layer) + solar emissions + coronal mass ejections (A coronal mass ejection (CME) is a massive explosion of plasma and magnetic fields from the Sun’s outer atmosphere, known as the corona.) at L1 ( Lagrange point 1 : A Lagrange point is one of five unique points of gravitational equilibrium in a two-body system, such as the Sun-Earth system. At these points (labeled L1 through L5), the gravitational pulls of the two large bodies and the centripetal force required to orbit with them perfectly balance. This makes them excellent “parking spots” for spacecraft because they require very little fuel for station-keeping to remain in a fixed position relative to the two larger bodies"},{"h":"Halo orbit :","t":"A spacecraft in Lagrange point like L1 or L2 is indeed in equilibrium, but a precarious one. It’s like balancing a pencil on its tip. It will remain there if everything is perfect, but the slightest disturbance will cause it to fall. So, while the Lagrange point offers a “parking spot” with a favorable gravitational balance, the halo orbit around it, maintained by minimal fuel use, provides a stable and continuous presence. (Useful for 3 body system)"},{"img":12}],"v":"640d33"},{"id":"space-economy-significance:private-sector-innovations","path":["PRIVATE SECTOR INNOVATIONS"],"rows":[{"t":"Indian private space-tech company Pixels launched India’s first private satellite constellation ‘Firefly’ (Pixxel’s flagship Hyperspectral Imaging_(HSI). satellite constellation)."},{"t":"HSI analyses a wide spectrum of light instead of just assigning primary colours (red, green, blue) to each pixel, effectively spectrally fingerprinting the Earth. While a typical satellite can identify a forest from space, HSI can distinguish between different types of trees and determine health of each individual tree. Applications include : water recycling and sorting, agriculture, soil mapping, environmental monitoring, mineral explosion."}],"v":"ced66d"},{"id":"space-economy-significance:space-governance-debris-management","path":["SPACE GOVERNANCE & DEBRIS MANAGEMENT"],"rows":[{"h":"Governance :","t":"The foundation of modern space law is the Outer Space Treaty of 1967. Other key international agreements include the Registration Convention and the Rescue and Return Agreement."},{"t":"In recent times, new frameworks have emerged to address modern challenges, such as NASA’s Artemis Accords, which India is a signatory to. The accords, though nonbinding, establish principles for cooperation in lunar and planetary exploration."},{"t":"Additionally, to manage the increasing issue of space debris, a Zero Debris Charter (Space debris objects larger than 1 cm in size (Large enough to be capable of causing catastrophic damage) is estimated to be over 1.2 million (ESA Space Environment Report 2025)"},{"t":"+ The unchecked growth of debris could lead to a self-sustaining cascade of collisions known as the Kessler syndrome."},{"t":"To address this, global initiatives include the Inter-Agency Debris Coordination Committee (IADC) and the UN’s Space Debris Mitigation Guidelines. India is also taking action with its Debris Free Space Missions (DFSM) 2030 and the ISRO System for Safe and Sustainable Operations Management (IS4OM).) has been signed by 12 countries."},{"t":"(Mitigation tech : ClearSpace-1 (ESA) Set for launch in 2025, this mission aims to actively remove an existing debris object using a robotic arm-marking the first commercial demonstration of such ADR (Active Debris Removal) capability."},{"t":"Startups Orbital Lasers (Japan) and InspeCity (India) are exploring satellites with onboard lasers that vaporize parts of debris to slow its spin, making it easier to capture. And project NETRA of india Phased-array radars, telescopes, and control centers for independent debris tracking and collision alerts)"}],"v":"7d398b"},{"id":"space-economy-significance:space-surveillance","path":["SPACE SURVEILLANCE"],"rows":[{"h":"Space surveillance :","t":"Space-based surveillance (SBS) uses satellites and other space assets to monitor activities on Earth and in space, with components that include various types of satellites like those with synthetic aperture radar (e.g., RISAT series), ground control stations eg NASA’s deep space network, space surveillance networks eg Russia’s Korona radar, and tracking and telemetry systems."},{"t":"This technology is significant for national security e.g., EMISAT provides for intercepting signals, space traffic management (e.g., ISRO’s NETRA), asset protection (defend satellites (e.g., Mission Shakti ASAT test), and environmental monitoring."},{"t":"However, concerns exist about dual-use risks, potential militarization like arms race, and privacy issues."},{"t":"In India, the recently approved SBS-3 project will use a fleet of 52 AI -based satellites in both LEO and GEO to gather geointelligence for land, sea, and air missions, building on previous phases that focused on basic and maritime surveillance."}],"v":"3bb482"},{"id":"space-economy-significance:indian-space-policy-2023","path":["INDIAN SPACE POLICY 2023"],"rows":[{"t":"The <b>Indian Space Policy 2023<\/b> is a landmark document that officially transitions India's space sector from a tightly controlled, government-monopolized model into a liberalized, commercially driven ecosystem."},{"h":"The Four-Pillar Institutional Framework :","t":"ISRO (Indian Space Research Organisation), IN-SPACe (Indian National Space Promotion and Authorisation Centre): NSIL (NewSpace India Limited), Department of Space (DoS) (The overarching nodal department responsible for implementing the policy,)"},{"sec":"Unlocking the Private Sector (NGEs)"},{"t":"The policy officially categorizes private companies as Non-Governmental Entities (NGEs) and allows them to undertake <b>end-to-end space activities<\/b>."},{"t":"can build/own/operate/Establish private ground stations, tracking centers, and spaceports/ Offer national and international space-based services/Engage in the commercial recovery of asteroids"},{"t":"Freely access and disseminate satellite data. Images with a Ground Sample Distance (GSD) greater than 5 meters are freely available, while higher-resolution images (less than 30 cm) require IN-SPACe authorization for national security reasons."},{"h":"not part of policy but in 2024 :","t":"FDI Liberalization now 100% (<b>Up to 100% under Automatic Route:<\/b> For the manufacturing , <b>Up to 74% under Automatic Route:<\/b> For satellite manufacturing and operations, <b>Up to 49% under Automatic Route:<\/b> For launch vehicles"}],"v":"4b690d"}]},{"id":"satellite-internet","subj":"s08","name":"SATELLITE INTERNET","cards":[{"id":"satellite-internet:main","path":[],"rows":[{"sec":"Satellite internet:"},{"t":"provides a wireless connection via communication satellites orbiting Earth, differing from land-based services like fiber or cable. The infrastructure comprises three segments: the space segment with satellites that relay signals, the ground segment with control networks and gateway stations, and the user segment with communication terminals. Notable global projects include Amazon’s Project Kuiper and SpaceX’s Starlink, which recently received a five-year license to operate commercially in India."},{"t":"Significance Satellite internet is crucial for bridging the digital divide by connecting rural and underserved areas. It provides connectivity during emergencies and disasters. The technology also supports the digital economy and offers strategic autonomy, as it is less vulnerable to disruptions"},{"t":"Concerns include internal security risks, as satellite phones may be used by terrorists. Satellite internet has higher latency compared to wired connections because of the long distance data must travel. Additionally, atmospheric changes caused by satellite launches, such as the production of alumina, could deplete the ozone layer. Other issues are its high cost, susceptibility to weather, and the contribution to space junk"},{"t":"Another eg. Qianfan constellation: Qianfan is a planned Chinese low-Earth orbit satellite internet megaconstellation"},{"t":"Implications of many satellites by space X and amazon’s blue origin : Kessler Syndrome occurs because collisions between space objects generate debris that increases collision probability, creating a selfsustaining cascade of orbital debris. (Because each collision increases debris, and increased debris increases collision probability, creating a runaway positive feedback loop)"}],"v":"36a35e"}]},{"id":"geospatial-technology","subj":"s08","name":"GEOSPATIAL TECHNOLOGY","cards":[{"id":"geospatial-technology:main","path":[],"rows":[{"sec":"GEOSPATIAL :"},{"t":"Geospatial technology is a collection of technologies that provide information about the Earth to aid in resource management and sustainable development. It includes Remote Sensing, Global Positioning Systems (GPS), and Geographic Information Systems (GIS)"},{"t":"Applications The technology has wide-ranging applications across various sectors. In environmental monitoring, it is used by tools like M-STRIPES for patrolling tiger habitats. For water resources, the India-WRIS Web GIS provides data and information on water bodies. In agriculture, the KrishiDecision Support System (Krishi-DSS) uses geospatial data to provide realtime information on crop conditions and soil health. For land records management, the NAKSHA platform (National Geospatial Knowledge-based Land Survey of Urban Habitations) is an example. It is also used in mineral mapping by the GSI using ASTER multispectral remote sensing data"},{"h":"Initiatives and Concerns:","t":"India has several initiatives to promote this technology, such as the National Geospatial Data Repository and the Integrated Geospatial Data Sharing Interface (GDI)."},{"t":"The National Geospatial Policy 2022 aims to position India as a global leader in the sector."},{"t":"However, the sector faces challenges like high costs for technologies such as LIDAR(light detection and ranging: scans ground and light is sent to the ground (Pulses) and gets a return to see its height or elevation also in iPhone to map a 3D model because it can perceive height) and drones, limited availability of high-resolution data due to a lack of detailed maps , and low awareness and adoption among local bodies like Panchayats. There are also surveillance concerns, as seen with location tracking during the COVID-19 lockdown."},{"t":"Way Forward To advance geospatial technology, India should integrate it with AI and Big Data, offer training to local bodies like Panchayats, provide open-access, high-resolution maps, and invest in indigenous, low-cost alternatives like miniaturized satellites"}],"v":"873d44"}]},{"id":"space-observation-research","subj":"s08","name":"SPACE OBSERVATION & RESEARCH","cards":[{"id":"space-observation-research:fundamental-cosmology","path":["Fundamental Cosmology"],"rows":[{"h":"Hubble Constant:","t":"This states that the universe is expanding at a rate of 67-68 kilometers per second per megaparsec (1 megaparsec means 3.26 million light years)"},{"h":"Dark Matter and Dark Energy:","t":"Dark matter is a hypothesized invisible form of matter that is inferred to exist based on its gravitational effects. Dark energy is a hypothetical form of energy that explains why the universe’s expansion is accelerating"},{"h":"Redshift:","t":"The light from distant galaxies is “redshifted,” meaning their wavelengths are stretched, which indicates they are moving away from us Observation Tools"},{"h":"Important Space Telescopes:","t":"Hubble Space Telescope (1990): Helped understand the universe, Chandra X-ray Observatory (1999): Detects X-ray emissions from hot regions of the universe like exploded stars and black holes., James Webb Space Telescope (JWST) (2022): Studies every phase of the universe, from the Big Bang to the formation of solar systems"},{"sec":"Key Research Areas"},{"h":"Exoplanet Exploration:","t":"Telescopes like Hubble and Spitzer have helped capture early evidence of gases in the atmospheres of distant worlds"},{"h":"Galaxy Formation:","t":"Hubble has captured images of majestic spiral galaxies, such as NGC 3344"},{"t":"Star Life Cycle"}],"v":"43bfdd"},{"id":"space-observation-research:indian-contributions","path":["Indian Contributions"],"rows":[{"h":"Ladakh as Astronomical Hub:","t":"Ladakh has emerged as a major hub for astronomical observatories and space-related research in India, earning the name “Astronomical Hub of India” due to its unique environmental features."},{"t":"The Hanle Valley is home to the Indian Astronomical Observatory (IAO), with its optical infrared telescope. Its high altitude, dry and cold desert climate, and lack of clouds and atmospheric water vapor make it an ideal location for optical, infrared, and other wavelength observations."},{"t":"The region has also been designated as the Hanley Dark Sky Reserve to promote astro-tourism. Recently, the Major Atmospheric Cherenkov Experiment (MACE) Observatory, Asia’s largest imaging Cherenkov telescope, was inaugurated in Hanle to observe high-energy gamma rays from phenomena like supernovae and black holes."},{"t":"Furthermore, scientists are considering Ladakh as a potential site for a Martian or Lunar analogue research station due to its geological, geochemical, and exobiological similarities to early Mars and the Moon"}],"v":"506f44"},{"id":"space-observation-research:black-hole-research","path":["Black Hole Research"],"rows":[{"h":"Black Hole Discovery:","t":"The recent discovery of gravitational waves from the merger of two black holes has brought them into focus. Previously, India’s Devasthal Optical Telescope (DOT) detected an Intermediate-Mass Black Hole (IMBH)."},{"t":"A black hole is a region in space with immense mass packed into a tiny volume, creating a gravitational pull so strong that even light cannot escape. They are classified into three types: Stellar-Mass, Intermediate-Mass (IMBH), and Supermassive black holes, which differ in mass and how they grow."},{"t":"Because they do not emit or reflect light, black holes are detected by their effects on their surroundings, such as accretion disks or the gravitational waves they create when they merge. Studying black holes is important for testing fundamental theories of the universe, like the General Theory of Relativity and Quantum Physics, and for understanding the universe’s origin"},{"t":"The international LIGO-Virgo-KAGRA (LVK) collaboration of gravitational wave observatories has recently detected the merger of two exceptionally massive black holes named GW231123. (Challenges the current understanding of black hole formation,"}],"v":"2520bc"},{"id":"space-observation-research:black-hole-research/ligo-india-facility","path":["Black Hole Research","LIGO-india facility"],"rows":[{"t":"Larsen & Toubro Wins Department of Atomic Energy Contract to Build LIGO-India Facility in Hingoli district,<br>Maharashtra."},{"t":"LIGO is the world’s largest gravitational-wave observatory that detects ripples in space-time using laser interferometry.  Uses laser interferometers with two 4-km-long arms arranged in an L-shape to measure extremely tiny distortions in space-time."},{"t":"Two main observatories located about 3000 km apart at Hanford (Washington) and Livingston (Louisiana) in the USA."},{"h":"Global Network:","t":"Works with detectors such as the Virgo detector (Italy), the KAGRA (Japan) and GEO600 (in Germany)."},{"h":"LIGO-India :","t":"InDIGO (the Indian Initiative in Gravitational-wave Observations): An initiative to set up advanced experimental facilities; Objective: Improve the detection accuracy and 59ocalization of gravitational-wave sources"}],"v":"e3c6bb"},{"id":"space-observation-research:space-weather-phenomena","path":["Space Weather Phenomena"],"rows":[{"h":"Geomagnetic Storms:","t":"A geomagnetic storm is a major disturbance of Earth’s magnetosphere caused by the interaction of charged particles from the Sun. These storms are primarily triggered by Coronal Mass Ejections (CMEs), which are massive expulsions of plasma and magnetic fields from the Sun’s corona, and solar flares, which are intense bursts of radiation. The intensity of these events is classified from G1 (Minor) to G5 (Extreme). If a storm is Earth-directed, it can cause the failure of GPS systems, damage power grids, interrupt radio communications, and disturb satellite orbits."}],"v":"eaf15c"}]},{"id":"navigation-systems-and-defence","subj":"s09","name":"NAVIGATION SYSTEMS and DEFENCE","cards":[{"id":"navigation-systems-and-defence:main","path":[],"rows":[{"t":"NavIC, formerly known as the Indian Regional Navigation Satellite System (IRNSS), is India’s homegrown satellite navigation system developed by ISRO, making India the only developing country with such a system. The system provides accurate Position, Velocity, and Timing (PVT) services within India and up to 1,500 km beyond its borders."},{"t":"Its constellation consists of seven satellites, with three in geostationary orbit and four in inclined geosynchronous orbit. These satellites use dual-band signals (L5 and S-band) and provide both a civilian Standard Position Service (SPS) and an encrypted Restricted Service (RS) for strategic users."},{"t":"The system offers India strategic independence from foreign navigation systems, like the GPS denial of use by USA during the 1999 Kargil War. With its encrypted military channel and high accuracy, NavIC is also intended to be the digital backbone for India’s Defence Space Agency and to guide future hypersonic glide vehicles"}],"v":"f4a8b6"},{"id":"navigation-systems-and-defence:hypersonic-glide-vehicles-and-all-missle#1","path":["Hypersonic glide vehicles and all missles tech"],"part":[1,5],"rows":[{"t":"An HGV is a type of warhead design that combines extreme speed with the maneuverability of an aircraft, making it nearly impossible for current air defense systems to intercept."},{"h":"<b>The Speed:<\/b>","t":"It travels at hypersonic speeds, defined as anything faster than <b>Mach 5<\/b> (five times the speed of sound, or roughly 6,100 km/h). Some HGVs can exceed Mach 20."},{"h":"<b>The Flight Profile (Boost-Glide):<\/b>","t":"Unlike a standard missile that flies entirely on its own engine, an HGV is placed on top of a traditional rocket (like a ballistic missile). The rocket \"boosts\" the HGV to the very edge of the Earth's atmosphere."},{"h":"<b>The Glide:<\/b>","t":"Once it reaches that high altitude, the HGV detaches from the rocket. It does not go into space. Instead, it \"surfs\" or glides along the upper atmosphere unpowered, using its aerodynamic shape to maintain hypersonic speeds as it falls toward its target."},{"t":"A Glide bomb after launch steer towards the target using highly accurate hybrid navigation scheme"}],"v":"447106"},{"id":"navigation-systems-and-defence:hypersonic-glide-vehicles-and-all-missle#2","path":["Hypersonic glide vehicles and all missles tech"],"part":[2,5],"rows":[{"sec":"<u>Other missles <\/u>"},{"h":"<b>Ballistic Missiles (e.g., Agni-V):<\/b>","t":"Follow a fixed, predictable, parabolic arch into space and back down (like throwing a stone). Because the path is predictable, advanced defense systems can calculate where it will land and shoot it down."},{"h":"<b>Hypersonic Cruise Missiles (HCMs):<\/b>","t":"Powered by an air-breathing \"Scramjet\" engine for the entire flight. They fly at lower altitudes and can maneuver, but rely on constant engine thrust."},{"h":"<b>Hypersonic Glide Vehicles (HGVs):<\/b>","t":"Unpowered after the initial rocket boost. Their biggest advantage over ballistic missiles is <b>maneuverability<\/b>. As they glide, they can erratically change direction mid-flight, flying below the radar horizon of ballistic missile early-warning systems and completely confusing interceptors."},{"t":"(<b>The LR-AShM (Unveiled Republic Day 2026):<\/b> DRDO officially unveiled the Long-Range Anti-Ship Hypersonic Missile at the 77th Republic Day parade)"},{"h":"<b>Project Dhvani:<\/b>","t":"This is India's dedicated HGV program aimed at striking land and sea targets at massive ranges (estimated between 6,000–10,000 km)"},{"h":"<b>The Global Players:<\/b>","t":"Russia already has deployed HGVs (the <i>Avangard<\/i>), and China has heavily invested in them (the <i>DF-ZF<\/i> or DF-17). The US is actively testing systems like the <i>Dark Eagle<\/i>."},{"h":"Directed Energy Weapons (DEWs):","t":"Instead of firing a physical projectile (like a bullet or a missile), a DEW fires highly concentrated energy at the speed of light. This usually comes in two forms: <b>High-Energy Lasers (HEL)<\/b> to physically burn through a target, or <b>High-Power Microwaves (HPM)<\/b> to fry the electronic circuits of an incoming threat"},{"t":"The \"cost-per-shot\" of a laser is essentially just the cost of electricity, whereas a traditional interceptor missile costs millions of dollars. Furthermore, because lasers travel at the speed of light, they are theoretically the only weapon fast enough to consistently shoot down a hypersonic glide vehicle or a massive swarm of cheap drones."}],"v":"ca5780"},{"id":"navigation-systems-and-defence:hypersonic-glide-vehicles-and-all-missle#3","path":["Hypersonic glide vehicles and all missles tech"],"part":[3,5],"rows":[{"h":"<b>India's Position:<\/b>","t":"The DRDO is actively developing project <b>DURGA-2<\/b> (Directionally Unrestricted Ray-Gun Array), a 100-kilowatt lightweight directed energy weapon meant to be integrated into land, sea, and air platforms."},{"t":"DRDO successfully conducted a trial of an Mk-II (A) LASER- Directed Energy Weapon (DEW) system at the National Open-Air Range (NOAR) in Andhra Pradesh."},{"h":"<b>Drone Swarms:<\/b>","t":"This is not just a group of drones being flown by multiple pilots. A true \"swarm\" uses Artificial Intelligence so that dozens or hundreds of drones communicate with each other and act as a single, coordinated organism. If one drone is shot down, the rest of the swarm instantly reconfigures to complete the mission."},{"h":"<b>Loitering Munitions (\"Kamikaze Drones\"):<\/b>","t":"A hybrid between a cruise missile and a drone. It is launched into an area where it \"loiters\" in the air for hours, waiting for a target (like an enemy radar or tank) to reveal itself. Once a target is spotted, it crashes into it and detonates."},{"h":"<b>India's Position:<\/b>","t":"The Indian Army has already begun inducting indigenous swarm drone systems for high-altitude operations. The DRDO and private startups are also developing systems like <b>ALFA-S<\/b> (Air-Launched Flexible Asset - Swarm)."},{"h":"Anti-Satellite (ASAT) Weapons and Space Militarization:","t":"Since modern militaries rely entirely on satellites for GPS, communication, and drone piloting, blinding the enemy's satellites is the first step in a modern war."},{"h":"<b>The Concept:<\/b>","t":"ASAT weapons are designed to physically destroy or electronically disable a country's satellites in orbit. These can be kinetic (launching a missile from Earth to smash the satellite) or non-kinetic (using lasers to blind the satellite's cameras or cyberattacks to hijack its controls)."},{"h":"<b>India's Position:<\/b>","t":"India proved its kinetic ASAT capability in 2019 with <b>Mission Shakti<\/b>, successfully destroying one of its own live satellites in Low Earth Orbit (LEO). Following this, India established the <b>Defence Space Agency (DSA)<\/b> to command the space assets of the Army, Navy, and Air Force, acknowledging space as the fourth domain of warfare."}],"v":"0d6228"},{"id":"navigation-systems-and-defence:hypersonic-glide-vehicles-and-all-missle#4","path":["Hypersonic glide vehicles and all missles tech"],"part":[4,5],"rows":[{"sec":"STRATOSPHERIC AIRSHIP PLATFORM"},{"t":"A high-altitude, unmanned airship designed to operate in the stratosphere, typically between 17 to 22 kilometers above Earth."},{"t":"Functions as a High-Altitude Pseudo-Satellite (HAPS) that can remain airborne for extended durations."},{"t":"HAPS can be classified as aerodynamic (or heavier-than-air, e.g. fixed wing/airplanes) and aerostatic (or lighter-than-air, e.g. balloons and airships)."},{"h":"Lift Mechanism:","t":"Uses helium for buoyancy"},{"h":"Power Source:","t":"Generally powered by solar energy with onboard batteries for night-time operation."},{"h":"Strategic Advantages:","t":"They can carry imaging sensors, radar, and telecom payloads, making them useful for border monitoring, disaster response, and intelligence missions."},{"t":"They bridge the gap between drones and satellites, providing space-like coverage with faster deployment, lower costs, and more flexibilit"}],"v":"f26f48"},{"id":"navigation-systems-and-defence:hypersonic-glide-vehicles-and-all-missle#5","path":["Hypersonic glide vehicles and all missles tech"],"part":[5,5],"rows":[{"sec":"ADVANCED MEDIUM COMBAT AIRCRAFT (AMCA)"},{"t":"Defence Minister approved Fifth-Generation Fighter Jet Execution Model through Industry Tie-Up."},{"t":"Currently only the US (F-22 and F-35), Russia (Sukhoi Su-57), and China (Chengdu J-20) have developed operational fifth generation aircraft."},{"sec":"Key Features of 5th Generation Fighters"},{"h":"Powered by Twin-engine:","t":"Provides higher level of air safety and survivability in the event of failure of one engine especially at night."},{"h":"Stealth Capabilities:","t":"Harder to detect by enemy radar."},{"h":"Other:","t":"High maneuverability, fly at supersonic speeds, etc"},{"sec":"RUDRASTRA"},{"t":"Successful Trial of the Hybrid Unmanned Aerial Vehicle (UAV) Rudrastra Conducted at Pokhran,<br>A Hybrid Vertical Take-Off and Landing (VTOL) UAV manufactured by Solar Defence and Aerospace Limited (SDAL)."},{"t":"VTOL UAVs can take off and land vertically, eliminating the need for runways, and providing manoeuvrability and versatility in operations."},{"t":"BHARGAVASTRA (A low-cost, 'hard kill' anti-drone system designed to neutralize threats from drone swarms)"}],"v":"ff640f"}]},{"id":"ramjet-scramjet-engine","subj":"s09","name":"RAMJET/SCRAMJET ENGINE","cards":[{"id":"ramjet-scramjet-engine:main","path":[],"rows":[{"sec":"Technology Comparison"},{"t":"Normal engine has a turbine and a compressor but ramjet because of the high speed does not need both of those components because the combustion can happen automatically if we slow the speed down in the engine to sub sonic (e slow the air down to low subsonic inside the combustor so the fuel can burn fully and stably at high pressure. That lets the nozzle later turn that hot, high-pressure gas into a much faster jet, which is what gives you big thrust.) ramjet cannot start at 0 speed, only 3 to 6 and produces too high temp,"},{"h":"Normal engine :","t":"only till mach 3.5 (mach means 3.5 speed of object relative to speed of sound in atmosphere, its around 295 at higher altitutdes so 3,700)"},{"img":13},{"t":"<b><u>ramjet <\/u><\/b>cannot start at 0 speed, only 3 to 6 and produces too high temp so good combustion halters flow, so we need to lower the temp, so we only need a little slowing down of the flow of fuel in combustion and then can happen only when we keep burning fuel as we fly and this is what is done by scramjet"},{"img":14},{"t":"<b><u>Scramjet <\/u><\/b>(vehicle must be travelling above mach 3) and can travel mach 6 to mach 11, 12, 13, 14. (High-energy fuels, high initial costs, integration issues, active cooling systems, and heat-resistant materials are all significant challenges in scramjet development.) (follows newton 3rd law of motion : for every. Action there’s an equal and opposite reaction)"},{"img":15},{"h":"<b><u>Cryogenic engine<\/u><\/b> :","t":"rocket engine that uses a cryogenic (liquid h2 or O2) or oxidiser (Developed by: The Liquid Propulsion Systems Centre (LPSC), Valiamala, Kerala), the fuel is liquified gases (Generally liquid hydrogen liquefied at -253° Celsius is used as fuel and liquid oxygen liquefied at -183° Celsius)"},{"h":"adv:","t":"ISRO’s PSLV Vikas engine burns 3.4 kg/sec, while cryogenic engines need only 2 kg/sec for the same thrust, Eco-Friendly Technology: Hydrogen-oxygen combustion emits only steam, Heavy Payloads & Space Missions: Ideal for heavy payloads and long missions like Gaganyaan"},{"h":"and problems Complex Systems:","t":"Extremely low-temperature propellants create thermal and structural issues, Thermal Stress: Risks of cracks, High Pressure: Requires strong superalloys, Temperature Control: Balancing performance with coolant"},{"img":16}],"v":"99d37c"}]},{"id":"rotating-detonation-engine-rde-detonatio","subj":"s09","name":"ROTATING DETONATION ENGINE (RDE) & DETONATION PROPULSION","cards":[{"id":"rotating-detonation-engine-rde-detonatio:main","path":[],"rows":[{"sec":"Technology Comparison"},{"h":"<b>Traditional Engine vs. RDE Combustion:<\/b>","t":"Normal engines use <i>deflagration<\/i> (subsonic burning where the flame travels slower than sound at a constant pressure, allowing the mixture to expand and lose energy as heat). RDEs use <i>detonation<\/i> (supersonic shock waves traveling faster than sound at a constant volume, instantly compressing unburned fuel and turning more chemical energy into high pressure instead of heat)."},{"h":"<b>Efficiency and Fuel Savings:<\/b>","t":"By replacing constant-pressure deflagration with constant-volume detonation, RDEs yield <b>10% to 25% higher thermodynamic efficiency<\/b>. This translates theoretically to roughly <b>17% less fuel usage<\/b> for the same output, allowing weight savings to be directly shifted to a heavy payload (satellites or warheads)."},{"sec":"<b>Pulse Detonation Engine (PDE) vs. Rotating Detonation Engine (RDE):<\/b>"},{"h":"<b>PDE (Intermittent):<\/b>","t":"Uses a long tube where a detonation wave fires down the length, after which the tube <b>must be actively purged<\/b> with air before the next cycle. This creates discrete pulses and mechanical/valve fatigue."},{"h":"<b>RDE (Continuous):<\/b>","t":"Uses an <b>annular chamber<\/b> (two concentric cylinders with a narrow ring gap) where one or more detonation waves race continuously in a circle thousands of times per second, with fresh fuel fed continuously just ahead of the wave."},{"h":"<b>Operational Versatility (vs. Ramjets/Scramjets):<\/b>","t":"Unlike ramjets/scramjets—which cannot start from 0 speed and require high forward speeds (Mach 3 to 6) to function—RDEs can operate statically from a dead stop (acting like a rocket engine carrying its own oxidizer) or integrate with atmospheric air-breathing streams for high-speed missiles."},{"h":"<b>Extreme Engineering Challenges:<\/b>","t":"RDE development was bottlenecked for decades because materials must survive temperatures over <b>2,000° C<\/b>, pressures fluctuating between <b>10 to 100 atmospheres<\/b> at thousands of cycles per second, and detonation speeds exceeding <b>1,500 m/s<\/b>. Practical models required major leaps in high-speed computing, diagnostics, and advanced manufacturing."}],"v":"2b9feb"}]},{"id":"nuclear-energy","subj":"s10","name":"NUCLEAR ENERGY","cards":[{"id":"nuclear-energy:general","path":["General"],"rows":[{"img":17},{"sec":"Current Status & Goals"},{"h":"Installed Capacity & Target:","t":"India’s current nuclear energy capacity is 8.78 GW , with plans to triple it by 2031-32 (22,480 MW)"},{"sec":"Strategic Importance"},{"h":"Significance:","t":"Provides low-carbon energy (critical for Net Zero 2070), applications in medicine (eg radioactive iodine is used to treat thyroid cancer), agriculture (Fallout Radio Nuclide technique using radioactive traces in soil to measure how much soil is being eroded or deposited), and industry (radiotracers help in tracing leakages (like in pipes because of the vast network of it)."},{"sec":"Government Initiatives"},{"h":"Initiatives:","t":"Key steps include the Atomic Energy (Amendment) Act, 2015 enables Nuclear power corporation of india limited to join with other PSU, Three-Stage Nuclear Power Programme (first Presurrized heavy water reactors then move to fast breeder reactor and then to throrium reactors) , Nuclear Energy Mission ( 100 GW by 2047), setting up of world’s first thorium-based plant Bhavini (U-233, Kalpakkam), and commissioning of KAPS 3 & 4 (700 MWe PHWR)."},{"h":"recent initiative :","t":"MAHI BANSWARA RAJASTHAN ATOMIC POWER PROJECT (4 NUCLEAR UNITS OF PWHR) DEV BY ANUSHAKTI VIDHUJEET NIGAM (JV B/W NPCIL AND NTPC)"},{"h":"SHANTI Act, 2025 :","t":"private sector participation (plant operations, power generation and equipment manuf) but enrichment is strictly under gov control; Atomic energy regulatory board (statutory made), if theres a problem it introduces a liability fund (eg. large plants private will pay max rs 3000 crore rest all thru fund (earlier in CLND act it was 100% private laibility) + Atomic energy dispute redressal forum will be made"},{"h":"intro private will :","t":"Increasing share of Nuclear Power in energy gen +  Private participation expands capital availability and attrsct investment + less delays (eg. kalapakkam scheduled originally for 2010) + Advanced technology access + Facilitating Clean energy transition: To meet the national target of 100 GW"},{"sec":"Implementation Challenges"},{"h":"Challenges:","t":"Safety concerns (Chernobyl, Fukushima), land acquisition issues, import dependence on uranium, and high upfront costs."},{"sec":"Future Strategy"},{"h":"Way Forward:","t":"Structured waste management, building societal awareness, optimal regulatory regime, and public-private partnership for expansion."}],"v":"a11b30"},{"id":"nuclear-energy:heavy-water-reactors","path":["Heavy Water Reactors"],"rows":[{"h":"Heavy water reactors :","t":"These reactors use natural uranium as fuel and heavy water (normal water is H 20 but we know hydrogen’s isotope(isotope means same protons but different number of neutron) and the isotope with I neutron is deuterium and when deuterium and oxygen are there then it is called heavy water ) both as a moderator to slow down neutrons and as a coolant to carry away heat."},{"t":"Because heavy water doesn’t absorb many neutrons, it allows even low-grade natural uranium to sustain a chain reaction. Most of India’s current reactors are PHWRs since the country has uranium and is the world’s largest producer of heavy water. Apart from generating electricity, PHWRs also produce plutonium-239 as a by-product, which is very useful for the next stage of India’s nuclear programme."},{"t":"( Introduced through Indo-Canadian nuclear cooperation in the 1960s., First 220 MW reactor built at Rajasthan Atomic Power Station (RAPS-1), After Pokhran-1 (1974), Canada withdrew support, leading India to indigenously develop and standardize the 220 MW PHWR design"}],"v":"f62120"},{"id":"nuclear-energy:fast-breeder-reactors","path":["Fast Breeder Reactors"],"rows":[{"t":"Fast Breeder Reactor (FBR). These use plutonium-239 mixed with uranium as fuel and liquid sodium as coolant, since water would slow down neutrons."},{"t":"In an FBR, fast neutrons cause fission in plutonium while the surrounding uranium-238 absorbs some neutrons and turns into more plutonium-239. This means the reactor produces more fissile material than it consumes, which is why it is called a “breeder.”"},{"t":"India is building its Prototype Fast Breeder Reactor (PFBR) at Kalpakkam, Tamil Nadu. The purpose of FBRs is to multiply India’s limited uranium resources and create enough fuel for the future."},{"t":"(In 2003, government established Bharatiya Nabhikiya Vidyut Nigam Limited (BHAVINI) to construct and operate Prototype Fast Breeder Reactor (PFBR))"},{"t":"HALEU (High-Assay Low-Enriched Uranium) is nuclear fuel enriched so that 5% to 20% of its uranium is the fissile isotope Uranium-235 making it more concentrated than standard power-plant fuel (3–5%), while remaining below weapons-grade levels (above 20%). (its cleaner and of high efficeincy) (Its high energy density allows engineers to shrink reactor core sizes, making it the required fuel for next-generation <b>Advanced Reactors<\/b> and <b>Small Modular Reactors (SMRs)<\/b>.) (Commercial HALEU production is currently dominated by <b>Russia<\/b> and <b>China)<\/b>"}],"v":"ce0a9b"},{"id":"nuclear-energy:thorium-based-systems","path":["Thorium-Based Systems"],"rows":[{"t":"Thorium Reactors, also called Advanced Heavy Water Reactors (AHWR).<br>Thorium-232 is not itself fissile, but when it absorbs a neutron it converts into Uranium-233, which can sustain fission."},{"t":"In these reactors, thorium acts as the fertile material, while a small amount of plutonium or uranium is used to start the chain reaction. Over time, thorium gradually breeds U-233, which becomes the main fuel."},{"t":"India has the world’s largest thorium reserves ( Kerala and Odisha have rich reserves of monazite, which contains about 8-10% thorium, Monazite is also prominent in Andhra Pradesh, Tamil Nadu, West Bengal and Jharkhand) so this stage would allow the country to run almost entirely on its own resources in a clean and sustainable way."},{"t":"(World’s first thorium molten salt nuclear power station will be launched in Gobi Desert by China in 2025), Its reactor does not need water for cooling because it utilizes liquid salt or carbon dioxide to transfer heat and make electricity (reduces the chances of meltdowns.) + Chemically safe, due to higher melting point, better thermal conductivity, better fuel performance characteristics + Environmentally safe, generates lesser toxic"}],"v":"0fb2c7"},{"id":"nuclear-energy:small-reactor-technologies","path":["Small Reactor Technologies"],"rows":[{"h":"Bharat small reactors :","t":"Unlike SMRs, which are an entirely new concept involving factory-made, easily assembled reactors, BSRs are based on India’s existing Pressurized Heavy Water Reactor technology will be built with help of private sector (a historic shift in India’s nuclear policy, as the Atomic Energy Act of 1962 did not permit private sector participation in nuclear energy generation). They can enhance the contribution of nuclear energy in India’s energy basket (current share of nuclear energy is 1.6%)"},{"t":"Small Modular Reactors (SMRs) are compact nuclear reactors, typically producing less than 300 MWe ( 1/3rd of traditonal), designed as modular units that can be factory-built and transported to sites for quick installation."},{"t":"Unlike traditional large reactors, SMRs are cheaper, faster to construct, and allow flexible scaling by adding modules as demand grows. They also incorporate advanced passive safety systems, enabling automatic shutdown and cooling without external power, making them safer and more reliable."},{"t":"Because of their size, they are especially suitable for remote regions, islands, or military bases where large plants are impractical."},{"t":"Globally, projects like the NuScale design in the US, Russia’s floating Akademik Lomonosov, and China’s inland SMRs and Suitable for electricity and thermal needs like seawater desalination (e.g., South Korea’s SMART). highlight the technology’s potential. India too is exploring SMRs as a complement to its larger reactors and renewables, with the aim of providing clean, decentralized power while reducing carbon emissions."}],"v":"bf57e6"},{"id":"nuclear-energy:nuclear-fusion#1","path":["NUCLEAR FUSION"],"part":[1,4],"rows":[{"sec":"Fundamental Concepts"},{"sec":"Fusion vs. Fission"},{"h":"<b>Nuclear Fusion:<\/b>","t":"Occurs when light nuclei, like deuterium (D) and tritium (T), fuse to form helium and a neutron, releasing a massive amount of energy."},{"h":"<b>Fuel Used:<\/b>","t":"Hydrogen isotopes (Deuterium and Tritium)."},{"h":"<b>Nuclear Fission:<\/b>","t":"The splitting of a heavy nucleus, like uranium-235, into lighter nuclei, releasing neutrons and energy."},{"h":"<b>Fuel Used:<\/b>","t":"Heavy elements like Uranium and Plutonium."},{"sec":"Indian Research & Facilities"},{"t":"India has made significant strides in nuclear and plasma research through several key initiatives:"},{"h":"<b>ADITYA Tokamak (Ahmedabad):<\/b>","t":"India's domestically developed machine for plasma physics research."},{"h":"<b>SST-1:<\/b>","t":"Designed for <b>steady-state plasma<\/b> studies. (Steady-state means the hot, ionized plasma is maintained continuously for a long time without dying out or becoming unstable)."},{"h":"<b>Indus Synchrotron Radiation Facility:<\/b>","t":"Features the INDUS 1 and INDUS 2 particle accelerators."}],"v":"b0be92"},{"id":"nuclear-energy:nuclear-fusion#2","path":["NUCLEAR FUSION"],"part":[2,4],"rows":[{"sec":"Core Technologies Explained"},{"sec":"<b>1. Tokamaks & Plasma Confinement<\/b>"},{"h":"<b>The Concept:<\/b>","t":"A tokamak is a device designed to achieve nuclear fusion (not fission) by heating hydrogen isotopes to star-core temperatures."},{"h":"<b>The Mechanism:<\/b>","t":"It confines the resulting <b>plasma<\/b>—the 4th state of matter, created when ionized gas is heated until electrons are stripped away—using powerful magnetic fields generated by solenoids inside a doughnut-shaped chamber (a <i>torus<\/i>)."},{"h":"<b>Advancements:<\/b>","t":"The Joint European Torus (JET) currently holds the world record for fusion power. A newer variant, the <b>spherical tokamak<\/b>, reshapes the chamber into a compact, cored-apple shape. This design offers stronger magnetic fields, better heat retention, fewer instabilities, and lowers external energy needs. Private companies like Tokamak Energy are developing these high-field magnet designs to make fusion commercially viable."},{"sec":"<b>2. Synchrotron Radiation<\/b>"},{"h":"<b>The Process:<\/b>","t":"An electron gun emits electrons into steel tubes connected to a booster ring, where microwave energy accelerates them to near light-speed."},{"h":"<b>The Output:<\/b>","t":"The beam is injected into a storage ring where powerful magnets bend the electrons' path. This bending emits an intensely bright light called <b>synchrotron radiation<\/b>."},{"h":"<b>The Application:<\/b>","t":"This light is directed through beamlines onto various samples. The interaction between the light and the sample's molecules allows scientists to generate highly detailed, molecular-level images."}],"v":"e64e8f"},{"id":"nuclear-energy:nuclear-fusion#3","path":["NUCLEAR FUSION"],"part":[3,4],"rows":[{"sec":"Global Collaborations"},{"sec":"Major international projects are pushing the boundaries of fusion technology:"},{"h":"<b>EAST Tokamak:<\/b>","t":"China (<b>1. The EAST (Experimental Advanced Superconducting Tokamak) <\/b>world's first <i>fully superconducting<\/i> tokamak."},{"h":"<b>Joint European Torus (JET):<\/b>","t":"United Kingdom"},{"h":"<b>KSTAR:<\/b>","t":"South Korea"},{"h":"<b>ITER (International Thermonuclear Experimental Reactor):<\/b>","t":"The world's largest fusion project located in France. It aims to demonstrate fusion as a safe, carbon-free energy source. It is a 30-nation collaboration where the European Union contributes 45% of the funding, and other partners (including India, since 2005) contribute 9% each."},{"sec":"The HL-2M (Also known as HL-3)"},{"h":"<b>Location:<\/b>","t":"Chengdu, China (Operated by the Southwestern Institute of Physics under the China National Nuclear Corporation)."},{"h":"<b>The Claim to Fame:<\/b>","t":"It is China's largest and most advanced tokamak in terms of the raw parameters and heat fluxes it can handle."},{"h":"<b>Primary Goal:<\/b>","t":"<b> Raw Power and Current.<\/b> While EAST focuses on how <i>long<\/i> the reaction can run, the HL-2M is largely focused on pushing the limits of high temperatures, high plasma density, and massive electrical currents (such as its milestone of exceeding 1 million amperes)."},{"sec":"Technical Hurdles & Solutions"},{"t":"Achieving commercially viable fusion energy requires overcoming several massive engineering challenges."}],"v":"cd8c9c"},{"id":"nuclear-energy:nuclear-fusion#4","path":["NUCLEAR FUSION"],"part":[4,4],"rows":[{"sec":"The Challenges"},{"h":"<b>Extreme Heat:<\/b>","t":"Sustaining temperatures upwards of 100 million degrees Celsius."},{"h":"<b>Plasma Confinement:<\/b>","t":"Using magnets to keep plasma stable and at a steady state is an incredibly complex process."},{"h":"<b>Radiation:<\/b>","t":"High-energy neutron radiation can escape and travel tens of centimeters, degrading surrounding materials."},{"h":"<b>Experimental Nature:<\/b>","t":"The technology is still largely in the research and development phase."},{"sec":"The Way Forward"},{"t":"<span class=\"lst\"><span class=\"li\">Fostering deep <b>international cooperation<\/b> (like ITER).<\/span><br><span class=\"li\">Securing heavy <b>R&D investment<\/b>.<\/span><br><span class=\"li\">Developing highly accurate <b>plasma modeling<\/b> through advanced computing.<\/span><br><span class=\"li\">Encouraging <b>private sector participation<\/b> to accelerate innovation and commercial viability.<\/span><\/span>"}],"v":"3b39ff"},{"id":"nuclear-energy:thorium-molten-salt-reactor-tmsr","path":["THORIUM MOLTEN SALT REACTOR (TMSR)"],"rows":[{"t":"It is fourth-generation advanced nuclear energy system that uses high-temperature molten salt as a coolant."},{"t":"China’s TMSR is currently the only operational molten-salt reactor in the world."},{"h":"Key Features:","t":"Cool without water, run at atmospheric pressure, deliver a high temperature output, etc."},{"sec":"Key Advantages:"},{"h":"Passive Safety Features:","t":"If an MSR is too hot, a salt plug melts, stopping the reaction."},{"h":"Small High-Level Nuclear Waste Footprint:","t":"Thorium generates fewer long-lived minor actinides (radioactive metallic elements) than plutonium fuels."},{"h":"Other:","t":"Extract more energy from fuel, etc."},{"t":"Thorium has to be converted to Uranium-233 in a reactor before it can be used as fuel."},{"t":"Thorium-232 is the only naturally occurring isotope of thorium"}],"v":"f8f351"},{"id":"nuclear-energy:fusion-fission-reactor-china","path":["FUSION-FISSION REACTOR CHINA"],"rows":[{"t":"China aims to construct the World’s First Hybrid Fusion-Fission Nuclear Plant, named Xinghuo."},{"t":"Contains a nuclear fusion reactor core where deuterium and tritium nuclei are fused to form helium and a fast neutron<br>then uses high intensity neutron flux produced by a fusion reactor to drive a nuclear fission reaction, and breed fissile fuel from fertile materials<br>the inner fusion core is surrounded by a blanket of fertile material for fission (like uranium-238 or thorium-232)."}],"v":"9044b2"}]},{"id":"battery-energy-storage-system-bess","subj":"s11","name":"BATTERY ENERGY STORAGE SYSTEM (BESS)","cards":[{"id":"battery-energy-storage-system-bess:main#1","path":[],"part":[1,2],"rows":[{"sec":"Definition & Types"},{"h":"Definition & Types:","t":"BESS is an electrochemical device that stores renewable energy (solar, wind) for later use; storage systems can be Mechanical (pumped hydro, flywheel) to Electrochemical (lead-acid, zincbromine), or Chemical (fuel cells)."},{"sec":"Strategic Importance"},{"h":"Significance:","t":"Helps minimize greenhouse gas emissions (pachamrit target of net zero by 2070), reduce energy costs during peak hours, improve grid stability and reduce dependency, and cater to future demand ( 236 GWh BESS required by 2031-32 acc to National electricity pan)."},{"sec":"Policy Initiatives"},{"h":"Initiatives:","t":"Viability Gap Funding for 4,000 MWh BESS by 2030-31, legal status as Generator/Transmission/Distribution element (MoP, 2022) (they can participate in electricity markets, receive regulated treatment, and be integrated into the grid like conventional power assets), Production Linked Incentive for Advanced Chemistry Cell storage, and National Framework (2023) for promoting energy systems."},{"sec":"Implementation Challenges"},{"h":"Concerns:","t":"Extremely low reserves of key raw materials (lithium, cobalt, nickel and graphite), policy uncertainty (loss of tax benefits can happen), high maintenance needs, and lack of quality R&D, EV/storage policies, and financing."}],"v":"667a81"},{"id":"battery-energy-storage-system-bess:main#2","path":[],"part":[2,2],"rows":[{"sec":"Future Strategy"},{"h":"Way Forward:","t":"Create demand via soft loans (favourable terms) facility for discoms, phased manufacturing programme, GST redesign for imports, and push recycling/sustainability through Extended Producer Responsibility and circular economy in BESS."},{"t":"DPIIT = sodium-ion battery (SIB) that can charge up to 80% in just six minutes and last over 3000 charge cycles,SIBs are a type of rechargeable battery similar to lithium batteries, but carry the charge using sodium ions (Na+) instead of lithium ions (Li+)."},{"t":"Batteries store and provide electricity by using chemical reactions where metals lose electrons (oxidation) and other substances gain them (reduction). The first battery was made by Volta in the 1780s after experiments with frogs and metals by him and Galvani. Modern batteries, whether disposable or rechargeable, work on the same principle: rechargeable ones can reverse the reaction to be used again."},{"t":"Over time, batteries lose capacity because repeated charging causes tiny imperfections inside them. Today’s batteries can last thousands of cycles, and future designs might last even hundreds of thousands. For now, the best way to keep batteries healthy is to charge them using a wall outlet."},{"h":"Adv :","t":"15-20% cheaper, sodium abundant and lithium is rare, better suited for wider temp variations and can be shipped at 0 voltage with 0 risk"},{"h":"new advancement :","t":"VANADIUM REDOX FLOW BATTERY"},{"img":18}],"v":"834546"}]},{"id":"electric-vehicles","subj":"s11","name":"ELECTRIC VEHICLES","cards":[{"id":"electric-vehicles:main","path":[],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">keywords<\/span><br><span class=\"li\">FAME<\/span><\/span>"}],"v":"0c7b67"},{"id":"electric-vehicles:fame-i-and-ii","path":["FAME I and II"],"rows":[{"sec":"FAME I (2015)"},{"sec":"Focused on:"},{"t":"EV technology<br>pilot projects"},{"sec":"FAME II (2019-2024)"},{"h":"Budget:","t":"<b>₹10,000 crore<\/b>"},{"sec":"Targets included:"},{"t":"<span class=\"lst\"><span class=\"li\">7,000 e-buses<\/span><br><span class=\"li\">5 lakh e-3-wheelers<\/span><br><span class=\"li\">10 lakh e-2-wheelers<\/span><br><span class=\"li\">55,000 electric cars.<\/span><\/span>"}],"v":"985696"},{"id":"electric-vehicles:pm-e-drive-scheme-2024","path":["PM E-DRIVE Scheme (2024)"],"rows":[{"h":"Budget:","t":"<b>₹10,900 crore<\/b>"},{"sec":"Focus:"},{"t":"electric buses<br>trucks<br>ambulances<br>charging infrastructure<br>battery manufacturing."}],"v":"a921d4"},{"id":"electric-vehicles:pli-for-advanced-chemistry-cell-batterie","path":["PLI for Advanced Chemistry Cell Batterie"],"rows":[{"sec":"Goal:"},{"t":"build <b>50 GWh battery manufacturing capacity<\/b>."}],"v":"70296f"},{"id":"electric-vehicles:pli-for-advanced-chemistry-cell-batterie/what-are-acc","path":["PLI for Advanced Chemistry Cell Batterie","what are ACC"],"rows":[{"t":"<b>Advanced Chemistry Cell (ACC) batteries<\/b> are <b>next-generation rechargeable batteries that store electrical energy using advanced chemical technologies<\/b>."},{"t":"<span class=\"lst\"><span class=\"li\">Lithium-Ion Batteries (Most Common)<\/span><br><span class=\"li\">Solid-State Batteries (Next Generation)<\/span><br><span class=\"li\">Sodium-Ion Batteries<\/span><br><span class=\"li\">Lithium-Sulfur Batteries<\/span><br><span class=\"li\">Metal-Air Batteries<\/span><\/span>"}],"v":"b1d4f3"}]},{"id":"hydrogen-production","subj":"s11","name":"HYDROGEN PRODUCTION","cards":[{"id":"hydrogen-production:main","path":[],"table":1,"head":["Hydrogen Type","Source Material","Production Process","Carbon Emissions"],"rows":[{"h":"<b>Green<\/b>","t":"<span class=\"th\">Source Material<\/span> Water<br><span class=\"th\">Production Process<\/span> Electrolysis (Renewable power)<br><span class=\"th\">Carbon Emissions<\/span> Zero"},{"h":"<b>Blue<\/b>","t":"<span class=\"th\">Source Material<\/span> Natural Gas<br><span class=\"th\">Production Process<\/span> SMR + Carbon Capture (CCS)<br><span class=\"th\">Carbon Emissions<\/span> Low"},{"h":"<b>Grey<\/b>","t":"<span class=\"th\">Source Material<\/span> Natural Gas<br><span class=\"th\">Production Process<\/span> Steam Methane Reforming (SMR)<br><span class=\"th\">Carbon Emissions<\/span> High"},{"h":"<b>Black/Brown<\/b>","t":"<span class=\"th\">Source Material<\/span> Coal / Lignite<br><span class=\"th\">Production Process<\/span> Gasification<br><span class=\"th\">Carbon Emissions<\/span> Very High"},{"h":"<b>Pink<\/b>","t":"<span class=\"th\">Source Material<\/span> Water<br><span class=\"th\">Production Process<\/span> Electrolysis (Nuclear power)<br><span class=\"th\">Carbon Emissions<\/span> Zero"},{"h":"<b>Turquoise<\/b>","t":"<span class=\"th\">Source Material<\/span> Natural Gas<br><span class=\"th\">Production Process<\/span> Methane Pyrolysis<br><span class=\"th\">Carbon Emissions<\/span> Solid Carbon (No $CO_2$)"}],"v":"7a7fd6"}]},{"id":"hyperloop-technology","subj":"s11","name":"HYPERLOOP TECHNOLOGY","cards":[{"id":"hyperloop-technology:main","path":[],"rows":[{"sec":"Technology Overview"},{"t":"he technology significantly builds on “gravity vacuum tube,” “gravity vacuum transit,” or “high-speed tube transportation. meaning : there’s a magnetic levitation (maglev) train system that uses one set of magnets to repel cars so that they hover above a track and another set of magnets to propel them forward over the track."},{"t":"It enables the theoretical speed of 1,200 km/h."},{"img":19},{"sec":"Advantages"},{"h":"Adv :","t":"High Speed: Over 1000 km/h, Eliminates human error, 10-30 sec intervals arrival, Less affected by weather, Easier tunnels, smaller stations, Carries large containers, cuts truck emissions, 2-3 times more efficient, uses maglev and low-pressure design, stores electricity"},{"sec":"Implementation Challenges"},{"h":"Issues :","t":"~$25-$27 million per mile (excluding land costs) as per NASA, Fire inside pods is a major risk despite fire-resistant tubes, Vacuum Maintenance, Lateral/vertical acceleration >2 m/s² can cause motion sickness."}],"v":"4b286a"}]},{"id":"desalination-technology","subj":"s11","name":"DESALINATION TECHNOLOGY","cards":[{"id":"desalination-technology:main","path":[],"rows":[{"sec":"IIT Bombay Innovation"},{"h":"IIT Madras graphene-based tech:","t":"Recently IIT Madra developed a graphene based desalination tech : Freshwater scarcity is a growing global issue, with less than 0.05% of water easily accessible, making desalination an important solution."},{"t":"IIT Bombay researchers have developed a DualSided Superhydrophobic Laser-Induced Graphene (DSLIG) Evaporator that improves solar desalination by combining solar and electric heating to maintain consistent temperatures and using superhydrophobic surfaces to prevent salt buildup, enhancing efficiency. Made from a layered polymer and laser-engraved graphene, DSLIG can treat highly saline water and industrial wastewater, with performance improving when multiple evaporators are stacked."},{"t":"Its low carbon footprint, cost-effectiveness, and durability make it promising for large-scale sustainable desalination, though further field testing and funding are needed before industrial deployment."},{"sec":"General Approaches"},{"h":"General Desalination:","t":"Desalination converts seawater or brackish water into fresh water, addressing the global shortage where only 0.06% of water is easily accessible."},{"t":"IIT Bombay scientists developed a lotus leaf-inspired hydrophobic graphene solar evaporator that uses sunlight to efficiently evaporate water."},{"h":"Two main approaches exist:","t":"thermal methods (flash or multi-effect evaporation) heat water to collect vapor, effective for highsalinity seawater but costly, and membrane methods (reverse osmosis, electrodialysis) filter water, are eco-friendlier, but may face fouling and incomplete TDS removal. Examples include Lakshadweep’s Low Temperature Thermal Desalination and Nemmeli RO Plant, Tamil Nadu."},{"t":"Scalable deployment, supportive policies, and ongoing research are key to ensuring equitable access to clean water."}],"v":"2acfe4"}]},{"id":"biochemical-oxygen-demand","subj":"s11","name":"BIOCHEMICAL OXYGEN DEMAND","cards":[{"id":"biochemical-oxygen-demand:main","path":[],"rows":[{"t":"Biochemical Oxygen Demand (BOD) is a measure of the amount of dissolved oxygen that aerobic bacteria (microorganisms that need oxygen to live) consume to break down organic matter in a sample of water. BOD is one of the most common ways to gauge the quality of water, especially in rivers, lakes, and wastewater treatment plants."},{"h":"High BOD (Bad):","t":"A high BOD level means there is a lot of organic pollution (like sewage, manure, or industrial waste) in the water. Bacteria will multiply rapidly to feed on this waste, consuming a large amount of the water’s dissolved oxygen in the process. This “robs” fish, plants, and other aquatic organisms of the oxygen they need to survive, which can lead to “dead zones.”"},{"h":"Low BOD (Good):","t":"A low BOD level indicates that the water is clean and contains little organic waste. This means there is more dissolved oxygen available for a healthy, balanced aquatic ecosystem"}],"v":"e05bb8"}]},{"id":"intellectual-property-rights-ipr","subj":"s12","name":"Intellectual Property Rights (IPR)","cards":[{"id":"intellectual-property-rights-ipr:main#1","path":[],"part":[1,6],"rows":[{"h":"Definition:","t":"IPR are the rights given to persons over the creations of their minds. They usually give the creator an exclusive right over the use of his/her creation for a certain period of time."},{"t":"8 types of IPR are covered under IPR Policy Management (IPRPM) framework: (i) Patents, (ii) Trade mark, (iii) Industrial Designs, (iv) Copyrights, (v) Geographical Indications, (vi) Semiconductor Integrated Circuit Layout Design, (vii) Trade Secret, and (viii) Plant Varieties."},{"h":"Administered by:","t":"Controller General of Patents, Designs and Trademarks which is under the control of the Department of Industrial Policy and Promotion (DIPP), Ministry of Commerce and Industry."},{"t":"Act on Layout-Design of Integrated Circuits is administered by Ministry of Electronics and Information Technology (MeitY)."},{"t":"Ministry of Agriculture administers the Act on Plant Variety"},{"sec":"IPR"},{"h":"Why in the news?","t":"<br>India’s Intellectual Property (IP) filings rose by 44% in the last 5 years, led by a 380% surge in Geographical Indications."}],"v":"36c433"},{"id":"intellectual-property-rights-ipr:main#2","path":[],"part":[2,6],"rows":[{"sec":"Reasons for Increase in IP Boom"},{"t":"Legal & Procedural Simplification of IP laws & rules: E.g. Patent examination timeline reduced from 48 months to 31 months and mandatory e-submission for patent documents."},{"h":"Modernisation of IP Offices:","t":"IP offices have been digitised with a comprehensive e-filing system, leading to over 95% of applications being filed online."},{"h":"International standards:","t":"E.g. adoption of international classification under Locarno Agreement for Industrial Designs."},{"t":"Locarno Agreement is an international agreement under the World Intellectual Property Organisation (WIPO) signed in 1968."},{"h":"Awareness & Capacity Building:","t":"E.g. SPRIHA Scheme aims to integrate IPR education into higher learning institutions across the country."},{"h":"National Intellectual Property (IP) Awards:","t":"To recognise and reward the top achievers for their IP creations and commercialisation."},{"h":"Other:","t":"Fee Concessions ( 10% fee reduction for online filings), Digital initiatives (IP Sarthi Chatbot for applicant support and IP Dashboard to provide real-time IP data), and use of AI and Machine Learning, etc."},{"t":"Details of legal and regulatory considerations for different IP areas:"}],"v":"ddb62b"},{"id":"intellectual-property-rights-ipr:main#3","path":[],"part":[3,6],"table":1,"head":["IPR Area","Subject","Legal Provision","Term of Protection"],"rows":[{"h":"Geographical Indication (GI)","t":"<span class=\"th\">Subject<\/span> Goods      bearing       unique characteristics     due     to geographical linkage - agricultural goods, natural goods, manufactured goods, handicrafts and foodstuff.<br><span class=\"th\">Legal Provision<\/span> Geographical Indications Act 1999 & GI Rules 2002 amended in 2020.<br><span class=\"th\">Term of Protection<\/span> 10 years, Renewed for 10 years on payment of additional fees"},{"h":"Design","t":"<span class=\"th\">Subject<\/span> New or original designs<br>(Ornamental / visual appearance discernible to the human eye) which can be replicated industrially.<br><span class=\"th\">Legal Provision<\/span> The Design Act, 2000 & Designs (Amendment) Rules 2021<br><span class=\"th\">Term of Protection<\/span> 10 + 5 years"},{"h":"Patents","t":"<span class=\"th\">Subject<\/span> Must qualify requirements of being novel, Inventive and having industrial utility.<br><span class=\"th\">Legal Provision<\/span> The Patents Act, 1970 & Patent Rules, 2003 (Amended in 2014, 2016, 2017, 2019, 2020 and 2021)<br><span class=\"th\">Term of Protection<\/span> 20 years"},{"h":"Copyright","t":"<span class=\"th\">Subject<\/span> Creative, artistic, literary, Musical and audio-visual works<br><span class=\"th\">Legal Provision<\/span> The Copyrights Act, 1957 &Copyrights Rules 2013 amended in 2021.<br><span class=\"th\">Term of Protection<\/span> Author- Lifetime+ 60 years;<br>Producers - 60 years<br>Performers- 50 years;"},{"h":"Trademarks","t":"<span class=\"th\">Subject<\/span> Protects    brand    name, logo, and design for a business or commercial enterprise.<br><span class=\"th\">Legal Provision<\/span> The Trade Marks Act, 1999 & Trademark Rules 2017<br><span class=\"th\">Term of Protection<\/span> 10 years; renewed for 10 years  on payment      of additional fees"},{"h":"Semiconductor Integrated Circuits Layout-Designs (SICLD)","t":"<span class=\"th\">Subject<\/span> A layout of transistors and other circuitry elements including lead wires connecting such elements and expressed in any manner in semiconductor integrated circuits.<br><span class=\"th\">Legal Provision<\/span> The Semiconductor Integrated Circuits Layout- Design Act, 2000 & Rules, 2001.<br><span class=\"th\">Term of Protection<\/span> 10 years"},{"h":"Trade Secret","t":"<span class=\"th\">Subject<\/span> Confidential information having commercial value.<br><span class=\"th\">Legal Provision<\/span> Common Law approach (covered through Contract Act, IP Act, and Copyright etc.)<br><span class=\"th\">Term of Protection<\/span> Till the time confidentiality is safeguarded."},{"h":"Plant Varieties","t":"<span class=\"th\">Subject<\/span> Traditional varieties and landraces, all developed varieties (non-traditional and non-landrace) in trade/use for older than 1 year and not older than 15 years or 18 years (in case of trees and vines), and new plant varieties.<br><span class=\"th\">Legal Provision<\/span> Protection of Plant Varieties and Farmers Rights Act (PPVFRA), 2001<br><span class=\"th\">Term of Protection<\/span> 6-10 years."}],"v":"d4add4"},{"id":"intellectual-property-rights-ipr:main#4","path":[],"part":[4,6],"rows":[{"img":20},{"sec":"Challenges related to IPR in India:"},{"h":"Low Research and Development (R&D) Spending:","t":"India spends a mere 0.7% of its GDP on R&D, significantly lower than countries like China (2.1%) and Brazil (1.3%)."},{"h":"Patent Disputes and Evergreening:","t":"The pharmaceutical sector often faces issues related to patent evergreening, where companies make minor modifications to existing drugs to extend their pat
