 and Analytics Platform etc.)"}],"v":"1f42dd"},{"id":"big-data:main#2","path":[],"part":[2,3],"rows":[{"sec":"Practical Implementations and Applications:"},{"h":"Logistics:","t":"Swiggy in India leverages big data to assign delivery partners,"},{"h":"Marketing and Advertising:","t":"Netflix and Amazon use big data to drive personalization,"},{"h":"Smart Cities:","t":"Resource management, improved infrastructure planning,"},{"h":"Education:","t":"Personalized learning,"},{"h":"Earth Sciences:","t":"Climate and earth studies"},{"h":"health :","t":"big data can help anyalze which medicines work on what part of genome type and dna and part"},{"h":"Technical Hurdles and Challenges :","t":"Traditional storage can’t handle petabytes + Handling Diverse Data Types + Rising threats of breaches and strict regulations (GDPR) + scalability + jobs in data sector obsolete"}],"v":"abf1bc"},{"id":"big-data:main#3","path":[],"part":[3,3],"rows":[{"sec":"OMICS (personalised medicine) (zooming in very much)"},{"t":"It is simply a discipline, that does measuring of cells at a molecular level, its our DNA, RNA, microbiome, a complete picture of human health, also understand what various external stimuli do to health like going to space. Being sick, what make on other sick and not another person."},{"h":"Use:","t":"uses big data : for understanding, prevention, better manage health basically help answer the question what to eat, what to exercise etc. , data driven, Resolving Heterogeneity: Identifies rare cell types (e.g., “stemlike” cancer cells) that are usually hidden in bulk samples."},{"h":"Problems :","t":"too much data (A single experiment can generate terabytes of data.), ethical, too long from culmination,"},{"h":"sol :","t":"Foundation Models (Generative AI for Biology)"},{"h":"Def of Spatial Transcriptomics (ST):","t":"Maps that gene expression data back onto their original 2D/3D physical locations within a tissue slice. It provides the “GPS coordinates” for cellular activity."}],"v":"5e350f"}]},{"id":"supercomputers","subj":"s02","name":"SUPERCOMPUTERS","cards":[{"id":"supercomputers:main","path":[],"rows":[{"sec":"Definition & Metrics"},{"t":"High-performance computing systems with exceptional processing power, measured in FLOPS (floating-point operations per second), unlike normal computers.<br>National Achievements"},{"h":"India’s Milestones -","t":"First: PARAM 8000 (1991); largest AI supercomputer AIRAWAT ( 13,170 teraflops) ranked 75th globally in 2023; new PARAM Rudra systems and HPC for weather research launched under the National Supercomputing Mission (NSM)."},{"h":"India’s first 32-bit processor –","t":"Vikram3201 – presented to the PM at Semicon India 2025"},{"sec":"Strategic Mission"},{"h":"National Supercomputing Mission (NSM) -","t":"Launched 2015 by DST & MeitY; aims for 45 PetaFLOPS capacity, a National Supercomputing Grid, and an HPC-skilled workforce ( High-Performance Computing)"},{"sec":"Sectoral Impact"},{"h":"Applications -","t":"Quantum research (PARAM Pravega), governance (Digital India Bhashini model), weather forecasting (<u>Pratyush<\/u>), internal security (benami SIM detection via analysis of large dataset by AIRAWAT), healthcare (cancer receptor screening PARAM SHAKTI), and disaster management (PARAM GANGA)(cloudburst studies)."},{"sec":"Challenges & Solutions"},{"h":"Challenges & Way Forward -","t":"Hurdles include huge data storage needs, high energy/cooling demands, massive capital costs, skilled manpower shortage, and semiconductor import dependency;"},{"t":"solutions include domestic chip manufacturing, more R&D funding, academia-industry partnerships Estb training at IIT, green supercomputing ( Invest in energyefficient technologies and cooling systems), and global collaborations (Europe’s EuroHPC)"}],"v":"7ede51"},{"id":"supercomputers:national-supercomputing-mission","path":["<u>National supercomputing mission<\/u>"],"rows":[{"t":"Launched in 2015, the NSM is a visionary initiative aimed at establishing a grid of high-performance computing (HPC) facilities across academic and research institutions in India."},{"h":"<b>Nodal Agencies:<\/b>","t":"Jointly steered by the Ministry of Electronics and IT (MeitY) and the Department of Science and Technology (DST)."},{"h":"<b>Implementing Agencies:<\/b>","t":"Centre for Development of Advanced Computing (C-DAC), Pune, and the Indian Institute of Science (IISc), Bengaluru."},{"h":"<b>Objective:<\/b>","t":"To empower researchers, reduce technological import dependence, and position India globally among the top nations in supercomputing."}],"v":"e18e46"}]},{"id":"web-3-0","subj":"s02","name":"WEB 3.0","cards":[{"id":"web-3-0:main","path":[],"rows":[{"t":"Web 3.0 is the concept of a new, decentralized iteration of the internet that shifts power from large tech corporations (which dominate Web 2.0) to individual users."},{"t":"Often called the “read/write/own” web, its foundation is built on blockchain technology, which enables key features like trustlessness (allowing peer-to-peer interactions without an intermediary), transparency, and user ownership of data, digital identity, and assets (like cryptocurrencies and NFTs)."},{"t":"This framework supports decentralized applications (dApps) that are not controlled by any single entity and aims to create a more intelligent, “semantic” web where machines can understand the context and meaning of information, leading to a more open, secure, and user-centric online experience."}],"v":"50c441"}]},{"id":"connectivity-5g-and-6g","subj":"s02","name":"CONNECTIVITY (5G AND 6G)","cards":[{"id":"connectivity-5g-and-6g:main","path":[],"rows":[{"t":"LAUNCH OF 1ST INDIGENOUS 4G (5G READY) BY BSNL (COLLAB WITH C-DOT, TEJAS, TCS) + 100 5G LABS IN ACADEMIC"},{"h":"FOR 6G :","t":"BHARAT 6G VISION"}],"v":"a3274b"}]},{"id":"bluetooth-mesh-network","subj":"s02","name":"BLUETOOTH MESH NETWORK","cards":[{"id":"bluetooth-mesh-network:main","path":[],"rows":[{"t":"Relies on Bluetooth clusters or Mesh network created by devices in a range. Mesh network, also known as “multi-hop network”, is a networking topology."},{"t":"<span class=\"lst\"><span class=\"li\">In it, data can travel from any device to all others, achieving many-to-many communication.<\/span><br><span class=\"li\">Even if one device fails, the network keeps working.<\/span><br><span class=\"li\">Messages are broadcast and relayed by nodes until they reach the intended destination.<\/span><\/span>"},{"sec":"Potential Benefits:"},{"h":"No central database:","t":"Messages are stored entirely on users’ devices and are deleted after a short period."},{"t":"This design is created to priorities users’ privacy. Also, Messages are end-to-end encrypted and do not leave the network."},{"h":"No registration required:","t":"Users are not required to create accounts using their email or phone number, making the communication anonymous."}],"v":"149e55"}]},{"id":"what-is-the-unified-lending-interface-ul","subj":"s02","name":"What is the Unified Lending Interface (ULI)","cards":[{"id":"what-is-the-unified-lending-interface-ul:main","path":[],"rows":[{"sec":"Digital Public Infrastructure for Lending"},{"t":"ULI is a Digital Public Infrastructure (DPI) designed to bring technology, data, and policy together into a seamless platform for credit delivery. It aims to democratize access to credit, especially for rural borrowers, small businesses, MSMEs, and other underserved segments."}],"v":"ee6a8c"}]},{"id":"robotics","subj":"s03","name":"ROBOTICS","cards":[{"id":"robotics:main","path":[],"rows":[{"sec":"Definition & Status"},{"h":"Definition & Status -","t":"Robotics involves the design, construction, and operation of robots capable of sensing their environment and making decisions; India ranks 7th globally in annual robot installations (World Robotics 2024)."},{"sec":"Sectoral Applications"},{"h":"Key Applications -","t":"Used in education (Manav humanoid), healthcare (SSI Mantra surgical robot), agriculture (TartanSense BrijBot), space exploration (ISRO’s Vyom Mitra), and defence (DRDO’s Daksha ROV)."},{"sec":"Government Initiatives"},{"h":"Promotion Initiatives -","t":"Draft National Strategy on Robotics 2023 (Robotics Innovation Unit), AI & Robotics Technology Park (ARTPARK) at IISc, Center for Advanced Manufacturing for Robotics and Autonomous Systems (CAMRAS), and iHub for Robotics at IISc."},{"sec":"Challenges & Strategy"},{"h":"Challenges & Way Forward -","t":"Barriers include high costs, low R&D output, lack of robotics legislation, limited prototyping/testing facilities, and ethical concerns (job loss, misuse)."},{"t":"Solutions include a National Robotics Policy, robotics clusters, focus on autonomous and adaptive intelligence, and “moonshot” research projects."}],"v":"f5f3f6"},{"id":"robotics:draft-national-strategy-on-robotics-2023","path":["draft national strategy on robotics 2023"],"rows":[{"sec":"It prioritizes four core sectors for robotic automation:"},{"t":"<span class=\"lst\"><span class=\"li\"><b>Manufacturing<\/b> (Industry 4.0, smart factories, collaborative robots)<\/span><br><span class=\"li\"><b>Healthcare<\/b> (Surgical robotics, sanitization, and patient monitoring)<\/span><br><span class=\"li\"><b>Agriculture<\/b> (Precision spraying, drone scouting, automated harvesting)<\/span><br><span class=\"li\"><b>National Security<\/b> (Unmanned ground vehicles, surveillance, and disaster response)<\/span><\/span>"}],"v":"ce88f4"},{"id":"robotics:autonomous-intelligence","path":["autonomous intelligence"],"rows":[{"t":"Autonomous intelligence is a system's ability to achieve specific goals and execute complex tasks without human oversight"}],"v":"03cb47"},{"id":"robotics:adaptive-intelligence","path":["adaptive intelligence"],"rows":[{"t":"Adaptive intelligence is a system’s ability to learn from past experiences, process new data, and adjust its methods to improve performance or survive in changing conditions. It doesn't just follow a script; it rewrites the script based on reality."}],"v":"1c649d"}]},{"id":"neuralink-s-brain-computer-interface","subj":"s03","name":"Neuralink’s Brain-Computer Interface","cards":[{"id":"neuralink-s-brain-computer-interface:main","path":[],"rows":[{"t":"Neuralink’s ‘Blindsight’ , a Brain-Computer Interface (BCI) implant (BCI DIAGRAM BELOW),"},{"sec":"Types:"},{"h":"Invasive BCIs:","t":"Implanted directly in the brain (e.g., Neuralink implant)."},{"h":"Non-invasive BCIs:","t":"Use EEG sensors on scalp,"},{"h":"Partially invasive BCls:","t":"Electrodes placed on brain surface (e.g., Electrocorticography - ECoG),"},{"h":"<u>Uses <\/u>:","t":"Wider uses in human-machine interaction, assistive technologies, medical rehabilitation and gamings but concerns about limited ability to interpret brain signals, medical risks (nerve damage) + ethical ( Privacy invasion (brain tapping)., Behaviour manipulation (stimuli attacks), “Cyborgization” - integrating humans with artificial components, Consent issues in trials."},{"t":"Stanford scientists have created password-protected mind reading Brain-Computer Interface (BCI)."},{"img":4}],"v":"9e1d6e"},{"id":"neuralink-s-brain-computer-interface:brain-co-processors","path":["BRAIN CO PROCESSORS"],"rows":[{"sec":"Moonshot Project"},{"t":"IISc and Pratiksha Trust launched Moonshot project on Brain Co-processors."},{"t":"The project aims to develop both implantable and non-invasive brain co-processors capable of decoding neural activity from brain recordings, processing and re-encoding the signals back into the brain using neural stimulation."},{"sec":"About Brain Co-processors"},{"t":"They are AI-powered, bidirectional neural interfaces that decode, analyze, and re-encode brain signals."},{"t":"Unlike conventional BCIs (Brain-Computer Interface), they target the full cognitive loop i.e., perception, attention, decision-making, and motor control."},{"t":"A conventional BCI lets your thoughts move an <b>external robotic hand via brain sensors<\/b>, whereas a brain co-processor bridges stroke-damaged wiring inside your brain so your <b>own paralyzed hand can feel and grab a cup again<\/b>. (so in co-processors the thought inside your brain comes and talk to you, which usually doesnt happen in BCI)"},{"h":"Primary goal:","t":"Restore reach and grasp in stroke survivors."}],"v":"7599e7"}]},{"id":"3d-printing","subj":"s03","name":"3D PRINTING","cards":[{"id":"3d-printing:main","path":[],"rows":[{"sec":"Technology Definition"},{"h":"Definition & Process -","t":"3D printing (additive manufacturing) creates three-dimensional objects from a digital file by adding material layer-by-layer until the final form is achieved."},{"sec":"Industry Applications"},{"h":"Aerospace:","t":"Agnikul Cosmos’ world’s first single-piece 3D-printed rocket engine (SOrTeD)."},{"h":"Automotive:","t":"Mahindra Group uses AM for prototype development."},{"h":"Construction:","t":"Amaze 28, Kerala’s first 3D-printed building."},{"h":"Healthcare:","t":"Osteo3D makes 3D-printed medical models."},{"h":"Consumer goods:","t":"Tanishq produces complex jewellery designs."},{"sec":"Government Support"},{"h":"Promotion Initiatives -","t":"National Strategy for Additive Manufacturing 2022 (MeitY) - aims for 5% of global AM market share and +US$1Bn GDP by 2025; 3D printing labs at NIELIT Aurangabad; National Centre for Additive Manufacturing (MeitY-Telangana, 2023); IISc Centre of Excellence for high-performance alloys."},{"sec":"Limitations"},{"h":"Challenges -","t":"Heavy import dependency for printers/raw materials, high equipment cost, limited material variety, restricted build size, and layer-by-layer structural weaknesses under stress."},{"h":"Way Forward -","t":"Promote joint R&D (academia-industry), domestic manufacturing of printers/materials, sustainable practices (biodegradable/ recyclable materials), and governance mechanisms for setting standards and regulation."}],"v":"f65a32"},{"id":"3d-printing:national-strategy-for-additive-maufactur#1","path":["national strategy for additive maufacturing"],"part":[1,2],"rows":[{"t":"The 2022 strategy set ambitious targets to hit by 2025, including capturing 5% of the global 3D printing market, adding $1 billion to the GDP, creating 50 India-specific technologies, and establishing 100 new startups. Through the National Centre for Additive Manufacturing (NCAM) in Hyderabad, the government has spent the last year evaluating these targets, successfully incubating multiple domestic startups, and focusing on reducing the heavy reliance on imported 3D printing hardware and materials."},{"sec":"2. Transition to NSAM 2.0 (2025–2026)"},{"t":"With the 2025 timeline reached, the Ministry of Electronics and Information Technology (MeitY) has begun drafting and discussing <b>NSAM 2.0<\/b>. This updated strategy shifts the focus from basic ecosystem-building to:"},{"h":"<b>Accelerated IPR Generation:<\/b>","t":"Pushing Indian companies to create and patent their own additive manufacturing (AM) technologies rather than just importing machines."},{"h":"<b>Global Competitiveness:<\/b>","t":"Driving down the costs of domestic machines and materials through dedicated manufacturing clusters."},{"h":"<b>SDG Integration:<\/b>","t":"Launching pilot programs that use 3D printing to advance Sustainable Development Goals (e.g., affordable healthcare prosthetics and reducing industrial waste)."},{"sec":"3. National Additive Manufacturing Symposium (NAMS) 2026"},{"t":"Just days ago, on <b>March 13, 2026<\/b>, MeitY hosted the second NAMS in New Delhi. This was a massive update for the sector, featuring:"},{"t":"<span class=\"lst\"><span class=\"li\">The release of the highly anticipated <b>\"India and Global Additive Manufacturing Ecosystem 2026\"<\/b> report.<\/span><br><span class=\"li\">Inter-ministerial panel discussions specifically dedicated to finalizing the policy frameworks for NSAM 2.0.<\/span><\/span>"}],"v":"0b7e4c"},{"id":"3d-printing:national-strategy-for-additive-maufactur#2","path":["national strategy for additive maufacturing"],"part":[2,2],"rows":[{"sec":"4. Strategic & Defense Integration"},{"t":"A major shift observed over the last year is the aggressive integration of AM into India's strategic sectors:"},{"h":"<b>Defense & \"Combat Force Regeneration\":<\/b>","t":"At the March 2026 symposium, the Indian Army highlighted plans to use 3D printing for forward-area manufacturing. This allows the military to print replacement parts directly at the battlefield edge rather than waiting on long supply chains."},{"h":"<b>Space Sector:<\/b>","t":"By early 2026, domestic companies (like Wipro 3D) successfully partnered with ISRO to produce critical, metal 3D-printed components that were used in the hot-fire tests of new high-thrust rocket engines."},{"h":"<b>Standardization:<\/b>","t":"A major bottleneck for 3D printing has been certifying that printed parts are safe for critical use. NCAM is now actively working with bodies like CEMILAC (Centre for Military Airworthiness & Certification) to create strict standards for 3D-printed aerospace and defense components."}],"v":"28e31b"}]},{"id":"4d-printing","subj":"s03","name":"4D PRINTING","cards":[{"id":"4d-printing:main","path":[],"rows":[{"video":"https://www.youtube.com/watch?v=MyK4BzbxcdU"},{"sec":"Core Innovation"},{"h":"Definition:","t":"4D printing evolves from 3D printing by adding the dimension of time ( can change shape or function over time in response to environmental stimuli )"},{"h":"Medical Application:","t":"Drug delivery"},{"h":"Aerospace:","t":"By enabling low-cost, durable parts that adapt to extreme conditions. E.g. <u>Nitinol alloy manufacturing<\/u>, <u>sensors and Flexible electronics<\/u>, <u>active origami art.<\/u>"}],"v":"4ffcd8"}]},{"id":"bio-tech","subj":"s04","name":"BIO TECH","cards":[{"id":"bio-tech:main#1","path":[],"part":[1,4],"rows":[{"t":"Biotechnology is a multidisciplinary field that harnesses cellular, genetic and bio-molecular processes-often combined with engineering -to develop targeted technologies and products that solve complex problems in health, agriculture, industry and the environment."},{"t":"For a clear, exam-ready answer start with this core definition, then organise the body using the globally recognised “colour” branches:"},{"t":"<span class=\"lst\"><span class=\"li\"><u>Green<\/u> (agriculture & environment - e.g., GM crops, biofertilisers, carbon-sequestering plants)<\/span><br><span class=\"li\"><u>Red <\/u>(medical - vaccines, gene therapy, CRISPR, regenerative medicine)<\/span><\/span>"},{"t":"<u>White<\/u> (industrial - enzyme catalysts, biodegradable plastics, biofuels),<br><u>Blue <\/u>(marine - pharmaceuticals and micro algae biofuels),<br><u>Grey <\/u>(environmental conservation bioremediation, waste management)"},{"t":"<u>Yellow <\/u>(food & nutrition fortified foods, fermentation, lab-grown proteins )."},{"h":"Market Status :","t":"Definition & Status - India’s bio-economy grew from $10 Bn (2014) to $165.7 Bn (2024) with a $300 Bn target by 2030, contributing 4.25% to GDP (India Bio-economy Report 2025)."},{"h":"Applications -","t":"Health & Medicine: Recombinant DNA tech → drugs like insulin, human growth hormone, It has enabled India’s biopharma sector to rapidly develop affordable vaccines, biosimilars, and advanced therapies, boost R&D, and expand exports worldwide, Agriculture: Bio-fortified rice (Chhattisgarh income rose 40-50% )., Bioenergy: UNATI Clean tech converts waste to fuel, Space biotech: Microgravity research in Axiom-4 & Gaganyaan"}],"v":"5b4dfd"},{"id":"bio-tech:main#2","path":[],"part":[2,4],"rows":[{"sec":"VACCINES"},{"h":"<b>1st Generation:<\/b>","t":"Whole-pathogen vaccines (Live-attenuated like Polio/Sabin or Inactivated like Covaxin)."},{"h":"<b>2nd Generation:<\/b>","t":"Subunit/Recombinant vaccines (Hepatitis B, HPV). Focus on <b>Recombinant DNA technology<\/b>."},{"h":"<b>3rd Generation:<\/b>","t":"DNA/RNA vaccines (ZyCoV-D, Pfizer/Moderna). Focus on how they use the body's own cells as a \"factory.\""},{"h":"<b>4th Generation (Emerging):<\/b>","t":"Viral Vector vaccines (Covishield) and Nasal vaccines (iNCOVACC)."}],"v":"074ea7"},{"id":"bio-tech:main#3","path":[],"part":[3,4],"rows":[{"sec":"Cleaner fuel and biotech (gold biotech):"},{"h":"Advanced Biofuels ( 2G and 3G):","t":"Transitioning beyond FirstGeneration ( 1 G ) biofuels (derived from edible crops like sugarcane and corn) is vital for food security."},{"h":"Second-Generation (2G):","t":"Focuses on lignocellulosic biomassconverting agricultural residues (like paddy stubble) into ethanol and Third-Generation ( 3G ): Utilizes genetically engineered microalgae. Algae yield exceptionally high lipid content for biodiesel synthesis, grow rapidly, and do not compete with agriculture for arable land or freshwater."},{"h":"Biogas and Bio-CNG (CBG):","t":"Under initiatives like the SATAT scheme, biotechnology is used to optimize anaerobic digestion. By utilizing specific methanogenic bacteria, municipal solid waste, cattle dung, and press mud are efficiently converted into Compressed Biogas (CBG), which can directly replace fossil CNG in commercial transport and industries."},{"h":"Biorefineries and Sustainable Aviation Fuel (SAF):","t":"Heavy-duty transport and aviation require high energy-density liquid fuels. Synthetic biology allows scientists to engineer yeasts and bacteria that can ferment biomass into higher alcohols (like bio-butanol) and drop-in hydrocarbon fuels that are perfectly compatible with existing jet engines"},{"h":"<u>What is space biotech :<\/u>","t":"Space biotechnology is the application of biological research and technology in space environments to study how microgravity and radiation affect living systems and to develop innovations useful for space missions and life on Earth.<br><u>What is microgravity <\/u>: - Microgravity is a condition in which objects experience an extremely weak gravitational force and appear weightless. It occurs when an object is in continuous free fall under gravity, such as in an orbiting spacecraft where both the craft and everything inside it fall toward Earth at the same rate. This creates the sensation of weightlessness even though gravity still acts on them."},{"t":"Microgravity allows scientists to study how living organisms, materials, and physical processes behave without the influence of weight, enabling experiments in medicine, materials science, and space research that cannot be done under normal gravity on Earth."}],"v":"3e5399"},{"id":"bio-tech:main#4","path":[],"part":[4,4],"rows":[{"sec":"Policy Initiatives"},{"h":"Promotion Initiatives -","t":"Biotechnology Ignition Grant (BIG) (₹ 50 L for startups), National Biotechnology Development Strategy 2021-25 (to make india globally competitive and be $150 billion bioeconomy by 2025), <u>National Speed Breeding Crop Mission at Agri-Food Biotechnology Institute (Mohali)<\/u>. + Biotechnology Industry Research Assistance Council (BIRAC)"},{"h":"BioPharma Shakti :","t":"Develop India into a global biopharmaceutical manufacturing hub, the government is betting on that future medicine is in biologics  and biosimilars rather than chemical compound based medicine (10,000 crore for 5 years)"},{"t":"use the money for strengthening NIPERS (national institute of pharmaceutical education and research) and also 3 more NIPERS (only for biopharma as core strength)"},{"t":"test bhi krna hai so 1000 pre-designated clinical trails connected via one network (called test beds) but biologic has special needs) (research to treatment timeline will be reduced) and innovation will be reached to the consumer in a faster manner<br>the manufacturing of india is accustomed to generics but this scheme will enable that transformtion needed for targetted medicines<br>regulatory system is for classic pharma and has to be reimagined (and improved)"},{"h":"Challenges & Way Forward -","t":"Low R&D (&lt;1% GDP), strict IPR norms, biosafety/biosecurity risks, biopiracy, genomic data security;"},{"h":"solutions :","t":"need PLI-like schemes, stronger IP regime, gov-industry-academia collaboration, and AI-driven biotech tools for drug discovery (e.g., Elucidata)."}],"v":"f676a1"},{"id":"bio-tech:adeno-associated-viral-vectors","path":["ADENO ASSOCIATED VIRAL VECTORS"],"rows":[{"h":"<b>What they are:<\/b>","t":"Engineered, non-pathogenic (harmless) viruses used as <b>delivery vehicles (\"vectors\")<\/b> to transport therapeutic genetic material or gene-editing tools into specific human cells."},{"h":"<b>Why they are used:<\/b>","t":"Naturally, AAVs do not cause disease in humans and are exceptionally good at crossing into specific tissues—including neurons in the central nervous system."},{"h":"<b>The Risk:<\/b>","t":"At <b>high doses<\/b>, the human immune system can recognize the viral shell as a foreign invader, triggering severe systemic inflammation, toxicity, or fatal vascular complications."}],"v":"c64b3a"},{"id":"bio-tech:otarmeni","path":["Otarmeni"],"rows":[{"t":"Otarmeni is the first-ever dual adeno-associated virus (AAV) vector-based gene therapy, so it's a real-world example of the ADENO ASSOCIATED VIRAL VECTORS"},{"t":"Otarmeni is made by Regeneron Pharmaceuticals was approved by United States Food and Drug<br>Administration under National Priority Voucher Program."},{"t":"First-Ever Gene Therapy for Treatment of Genetic Hearing Loss called Otarmeni approved."},{"h":"OTOF Gene Mutation:","t":"Therapy is designed to treat hearing loss caused by OTOF gene mutations."},{"t":"OTOF Gene codes for a protein called otoferlin, needed by inner ear cells to translate vibrations into signals interpreted by brain."}],"v":"c490c5"}]},{"id":"gmo","subj":"s04","name":"GMO","cards":[{"id":"gmo:main","path":[],"rows":[{"sec":"Definition & Engineering"},{"t":"(A plant, animal, or microbe whose genome has been altered using genetic engineering to change its characteristics.)"},{"h":"Process of GMO:","t":"(The creation of a GMO involves identifying a desired trait and isolating the corresponding gene, then inserting that gene into the recipient organism’s DNA using tools like Agrobacterium tumefaciens or a gene gun or Electroporation (electric pulses to introduce DNA) or Microinjection (direct DNA injection into cells), followed by cultivating and testing the modified organism for safety, efficacy, and stability."},{"img":5},{"sec":"Beneficial Applications"},{"h":"Use to produce :","t":"human insulin (Diabetes prevents the body from making or using insulin properly, causing high blood sugar, and producing human insulin using genetic engineering provides safe, identical insulin in large quantities, effectively managing blood sugar and replacing animal-derived insulin.) ; producing fermented beverages (Modern biotech can engineer yeasts or bacteria to: Improve flavor, aroma, or alcohol yield)<br>Regulatory Framework"},{"h":"Regulations :","t":"Governed by the Environment Protection Act, 1986 and overseen by the Genetic Engineering Appraisal Committee (GEAC) (Responsible for approving commercial cultivation of GM), along with provisions under the Biological Diversity Act, 2002 (To ensure benefits arising from with local communities), Codex Alimentarius (Responsible for developing international food code), and the Cartagena Protocol on Biosafety (Deals with the trans boundary movement of living modified organisms.)<br>Indian Examples & Concerns"},{"t":"Eg. in India : Bt Cotton and GM Mustard Crop (DMH-11): cross pollination between two mustard varieties (‘Varuna’ and East European ‘Early Heera-2’)."},{"t":"Challenges related to GMO (Ecological Concerns: E.g., Bt Corn potentially harms Monarch butterflies feeding on wild milkweed + ethical About inequitable access and benefits of GMOs. + Issues related to Seed Sovereignty, impact on traditional farming practices+ GM crops are controlled by corporations with IP rights (eg monsato)"}],"v":"f1877c"}]},{"id":"genome-sequencing","subj":"s04","name":"GENOME SEQUENCING","cards":[{"id":"genome-sequencing:main#1","path":[],"part":[1,2],"rows":[{"sec":"Technical Process."},{"video":"https://www.youtube.com/watch?v=2JUu1WqidC4&t=70s"},{"t":"(is a process of analysis of DNA taken from a sample of blood, within every cells are 23 pair of chromosomes, these chromosomes house DNA (DNA’s structure is double helix), double helix can be unwound into ladder, and they are made of bases (huge in number), 4 Types : A , T and G and C (and both pairs join with each other only), now this base broken by high frequency sounds is put on a slide after being cut up to process Bases more precisely and the genome sequencer creates copies (100’s. Of thousands) of it making the cluster of the same DNA and tries to figure out the sequence and then a powerful machine is use to piece these up and then the DNA sequence is achieved and identifies which can medicinally benefit the individual."},{"sec":"Practical Applications"},{"h":"Uses :","t":"It is used in disease diagnosis such as BRCA1 and BRCA2 gene sequencing to assess breast and ovarian cancer risk; anthropology to understand human migration and ancestry; agriculture where the International Wheat Genome Sequencing Consortium has improved disease resistance; livestock with the Unified Genomic Chip for genomic profiling and evaluation of Indian cattle breeds; and vaccine development, as during"},{"t":"COVID-19 when INSACOG used it to detect and monitor emerging variants like Delta and Omicron.<br>Global Initiatives & Hurdles"},{"h":"Initiatives & Challenges -","t":"Major initiatives include the IndiGen program for sequencing thousands of Indians from diverse ethnic groups; the One Day One Genome initiative to make microbial genomics data more accessible; the Human Genome Project (HGP) to map and sequence the human genome; the Genome India Project (2020) to catalogue Indian genetic diversity; and the International HapMap Project to identify genetic links to diseases"},{"t":"Challenges include data accuracy issues in long-read sequencing, privacy risks from genetic information, lack of regulatory frameworks, massive data storage needs ( ~200 GB per genome), and possible discrimination in healthcare or insurance based on genetic data.<br>Strategic Recommendations"},{"h":"Way Forward -","t":"Recommendations include <u>upgrading biotechnology<\/u> labs with next-generation sequencing (NGS) technology for rapid, large-scale DNA/RNA sequencing; establishing national bioethics committees for oversight and public engagement; adopting global best practices such as the US Genetic Information Non-discrimination Act (GINA);"}],"v":"4757c3"},{"id":"genome-sequencing:main#2","path":[],"part":[2,2],"rows":[{"sec":"<b><u>META BARCODING<\/u><\/b>"},{"h":"<b>The Scope:<\/b>","t":"Metabarcoding does not care about the whole genome. Scientists intentionally ignore 99.9% of the DNA. Instead, they use chemicals to target and extract one very tiny, specific, standardized gene (the \"barcode\")."},{"h":"<b>The Goal:<\/b>","t":"The only goal is <b>identification<\/b>. It is used to figure out <i>what species<\/i> are present in a mixed environment, not how their biology works."},{"h":"<b>The Process:<\/b>","t":"As we discussed, it is done on a bulk environmental sample (like dirt or water) containing the DNA of hundreds of different species mixed together."},{"sec":"application :"},{"h":"<b>Agriculture and Soil Health:<\/b>","t":"<b> A single soil sample can reveal the entire microbiome<\/b>"},{"h":"<b>Wildlife Conservation:<\/b>","t":"It is used to detect rare, elusive, or endangered species wihout tracking them"},{"h":"<b>Biosecurity and Invasive Species:<\/b>","t":"Ports and agricultural borders use water sampling to detect the eDNA of invasive aquatic species"},{"h":"<b>Dietary Analysis:<\/b>","t":"Biologists can sequence the feces of an animal to figure out exactly what it has been eating, mapping out complex food webs."},{"h":"<b>Cost and Data:<\/b>","t":"It is much cheaper and faster because you are only reading a tiny snippet of DNA, but you are doing it for hundreds of organisms at exactly the same time."},{"sec":"<b><u>DNA Fingerprinting (Profiling):<\/u><\/b>"},{"t":"Used to identify a specific <b>individual<\/b> within a species (e.g., matching a suspect's blood at a crime scene or determining paternity). It looks at highly variable, repetitive sequences in a person's \"junk DNA.\""}],"v":"1e8de4"},{"id":"genome-sequencing:genome-india-project","path":["Genome india project"],"rows":[{"t":"DBT-led initiative (January 2020) to sequence <b>10,000 genomes across 99 communities<\/b>, creating an India-specific genetic reference for precision healthcare and biotechnology."},{"h":"<b>Progress (May 2026):<\/b>","t":"19,000+ blood samples banked; 5,750 samples analysed; rare Indian population-specific variants identified."},{"h":"applications :","t":"<b>Precision Medicine, Pharmacogenomics (<\/b>Drug and dosage optimisation<b>), Preventive Genomics, Drug Discovery, <\/b><b>Beyond Healthcare:<\/b> Agricultural genomics, microbial research, AMR and bioactive enzymes."}],"v":"c0a516"}]},{"id":"gene-editing","subj":"s04","name":"GENE EDITING","cards":[{"id":"gene-editing:main#1","path":[],"part":[1,2],"rows":[{"t":"Definition & Classification<br>(A technique to modify DNA by inserting, deleting, or altering specific sequences - from single bases to entire genes) (two types : Somatic Genome Editing - Alters non-reproductive (body) cells; changes not inherited by offspring + Germline Genome Editing - Alters reproductive cells or embryos; changes are heritable.)"},{"t":"CRISPR is a precise gene-editing tool often used to modify T cells genetically so CAR-T cell therapies are more effective, safer, and sometimes “universal.”"},{"t":"NEXCAR19 is therapy developed by IMMUNOACT (IIT bOMB + tata Memorial hospital) (supported by DBT + BIRAC) (india’s 1st indigenous car t-cell)<br>Editing Techniques"},{"h":"Techniques :","t":"Major Techniques ZFNs (Zinc Finger Nucleases): Protein “fingers” target specific DNA sequences, linked to Fok 1 enzyme for cutting;"},{"h":"TALENs (Transcription Activator-Like Effector Nucleases):","t":"TALE proteins for targeting + Fokl enzyme difference from ZFN is that this can identify individual bases but ZFN can only identify triplets;"},{"h":"CRISPR-Cas9:","t":"Guide RNA targets the sequence + Cas9 enzyme cuts it. (Derived from how organisms fight viruses)"},{"t":"+ Meganucleases (Homing Endonucleases)<br>(Structure: Natural enzymes that recognize very long DNA sequences ( 14-40 base pairs). How it works: They cut DNA at specific, rare sites. Because these long sequences rarely repeat in the genome, meganucleases are extremely specific but hard to re-engineer for new targets. Pros: Very accurate and Cons: Difficult to customize limited use compared to CRISPR.)"}],"v":"10f823"},{"id":"gene-editing:main#2","path":[],"part":[2,2],"rows":[{"t":"<u>\"Gene drive\"<\/u> is a genetic engineering technology that alters the rules of inheritance, ensuring a specific engineered gene is passed on to nearly 100% of offspring."},{"t":"EG. BIRSA-101 (1st indigenous CRISPR therapy to treat sickle cell disease)"},{"t":"TnPB based plant genome editing developed by ICAR-CRRI (TnPB is small transposon associated molecular scissors (transposons are DNA sequences that can move from one place ro another within the genome a.k.a jumping genes)"},{"t":"Glow Cas9 (glows) (by Bose institute kolkata)"},{"sec":"Innovative Applications"},{"h":"Uses :","t":"Example: India’s first CRISPR genome-edited rice varieties: DRR Rice 100 (Kamla) and Pusa DST Rice → higher yields, better stress resistance + NASA experiments for DNA repair assessment in microgravity (long-term space missions) + bioterrorism + deextinction (Colossal Biosciences working to bring back the Dire Wolf using cloning + gene editing.) + Genetically modified silkworms producing spider silk stronger than steel + Human gene editing can enhance physical and neural traits, enabling seamless integration with bionic devices and cybernetic systems for superhuman capabilities.<br>CRISPR-Cas9 diagram"},{"img":6}],"v":"0b9477"},{"id":"gene-editing:new-technique-base-editing-therapy","path":["NEW TECHNIQUE (BASE EDITING THERAPY)"],"rows":[{"sec":"<b>Base-Editing Therapy (\"CRISPR 2.0\")<\/b>"},{"h":"<b>What it is:<\/b>","t":"A newer, more precise molecular gene-editing technique that allows scientists to chemically change a <b>single nucleotide base<\/b> (A, C, G, or T) in DNA or RNA without making double-stranded cuts in the DNA helix."},{"h":"<b>How it differs from traditional CRISPR-Cas9:<\/b>","t":"Standard CRISPR-Cas9 acts like \"molecular scissors\" that break both strands of the DNA ladder, relying on the cell’s repair mechanisms to fix the cut (which can introduce accidental mutations). Base editing acts like a <b>\"molecular pencil\"<\/b>—it directly rewrites one letter to another (e.g., changing a <b>C–G<\/b> base pair into a <b>T–A<\/b> base pair) without cutting the double helix."},{"h":"<b>Prelims Relevance:<\/b>","t":"Offers higher precision and lower risk of off-target chromosomal damage compared to first-generation CRISPR."}],"v":"407782"},{"id":"gene-editing:new-technique-prime-editing#1","path":["NEW TECHNIQUE (PRIME EDITING)"],"part":[1,3],"rows":[{"sec":"What is Prime Editing? (\"CRISPR 3.0\")"},{"t":"<b>Prime Editing<\/b> is a next-generation genome-editing technology developed in 2019 by David Liu’s laboratory at the Broad Institute. Often described as a <b>\"molecular word processor,\"<\/b> it can perform \"search-and-replace\" operations on DNA with unprecedented precision."},{"t":"Unlike traditional CRISPR-Cas9 (which breaks both strands of DNA) or Base Editing (which can only chemically swap certain single letters), Prime Editing can:"},{"t":"<span class=\"lst\"><span class=\"li\">Perform <b>all 12 possible base-to-base conversions<\/b> (A, C, G, T to any other base).<\/span><br><span class=\"li\">Insert new DNA sequences (up to ~44 base pairs).<\/span><br><span class=\"li\">Delete unwanted DNA sequences (up to ~80 base pairs).<\/span><\/span>"},{"t":"Do all of the above <b>without making double-strand breaks (DSBs)<\/b> or requiring separate donor DNA templates."}],"v":"5cdd71"},{"id":"gene-editing:new-technique-prime-editing#2","path":["NEW TECHNIQUE (PRIME EDITING)"],"part":[2,3],"rows":[{"sec":"The Three Molecular Components"},{"sec":"Prime Editing merges three distinct tools into a single functional machine:"},{"h":"<b>Cas9 Nickase:<\/b>","t":"A modified version of the Cas9 enzyme whose \"molecular scissors\" have been dulled so that it <b>nicks only one strand<\/b> of the DNA double helix instead of cutting both. This avoids the chaotic repair processes triggered by double-strand breaks."},{"h":"<b>Reverse Transcriptase (RT):<\/b>","t":"An enzyme fused directly to the Cas9 nickase. Reverse transcriptase reads an RNA template and <b>writes new DNA<\/b> directly onto the nicked DNA strand."},{"h":"<b>pegRNA (Prime Editing Guide RNA):<\/b>","t":"An engineered guide RNA that serves a dual purpose:"},{"h":"<b>The Search Function:<\/b>","t":"Locates the specific target sequence in the genome."},{"h":"<b>The Replace Function:<\/b>","t":"Carries an extra RNA loop (an <i>extension template<\/i>) containing the exact genetic edit that needs to be copied into the DNA."}],"v":"eb60cd"},{"id":"gene-editing:new-technique-prime-editing#3","path":["NEW TECHNIQUE (PRIME EDITING)"],"part":[3,3],"rows":[{"h":"Step-by-Step:","t":"How It Works"},{"h":"<b>Target Recognition & Nicking:<\/b>","t":"The <b>pegRNA<\/b> guides the Cas9 nickase-RT fusion protein to the target gene. The Cas9 nickase cuts only one strand of the DNA ladder."},{"h":"<b>Writing New DNA:<\/b>","t":"The reverse transcriptase (RT) uses the pegRNA’s built-in RNA template to synthesize a new, edited single strand of DNA right at the site of the nick."},{"h":"<b>Flap Removal:<\/b>","t":"The newly written DNA strand competes with the original, unedited strand—creating a temporary \"flap.\" The cell's natural endonucleases snip away the old unedited flap and seal the new edited sequence into place."},{"h":"<b>Strand Synchronization:<\/b>","t":"To ensure both strands of the double helix match, a secondary guide RNA prompts the cell to use the newly edited strand as a template to fix the unedited opposite strand."}],"v":"2b9905"}]},{"id":"gene-tech-some-def","subj":"s04","name":"GENE TECH SOME DEF","cards":[{"id":"gene-tech-some-def:gene-drive-technology-gdt","path":["GENE-DRIVE TECHNOLOGY (GDT)"],"rows":[{"t":"A type of genetic engineering technique that modifies genes to alter Mendelian inheritance (Normal)."},{"t":"Mendelian inheritance refers to certain patterns of how traits are passed from parents to offspring."},{"t":"Increases the likelihood that a particular suite of genes will be passed onto the next generation."},{"t":"can stop insects from spreading vector borne diseases (mosquitoes) and pests that attack plants."}],"v":"d78dfe"},{"id":"gene-tech-some-def:rna-silencing#1","path":["RNA SILENCING"],"part":[1,3],"rows":[{"h":"The Context:","t":"Saving Banana Crops"},{"h":"<b>The Threat:<\/b>","t":"The Cucumber Mosaic Virus (CMV) is a major agricultural threat, destroying 25-30% of banana yields."},{"h":"<b>The Breakthrough:<\/b>","t":"German researchers have developed a new way to protect these plants using a genetic technique called <b>RNA silencing<\/b>."}],"v":"3e9bb3"},{"id":"gene-tech-some-def:rna-silencing#2","path":["RNA SILENCING"],"part":[2,3],"rows":[{"sec":"What is RNA Silencing? (The \"Mute Button\" for Genes)"},{"t":"To understand RNA silencing, it helps to look at how a virus normally works inside a cell:"},{"t":"<span class=\"lst\"><span class=\"li\">The virus’s DNA acts as an <b>instruction manual<\/b>.<\/span><br><span class=\"li\">It creates a temporary photocopy of these instructions called <b>mRNA<\/b> (messenger RNA).<\/span><\/span>"},{"t":"The mRNA travels to the cell's \"factory\" to build viral <b>proteins<\/b>, which make the plant sick."},{"t":"<b>RNA silencing<\/b> is the plant's defense system intercepting that process. It uses tiny, specialized RNA molecules (like siRNA or miRNA) to act as \"search and destroy\" teams."},{"t":"When these tiny RNA molecules find the virus's mRNA photocopy, they do one of two things:"},{"h":"<b>Shred it:<\/b>","t":"They physically destroy the mRNA before it reaches the factory."},{"h":"<b>Block it:<\/b>","t":"They attach themselves to the mRNA, making it impossible for the factory to read the instructions."},{"h":"<i>The result?<\/i>","t":"<i> The viral proteins are never built, and the virus is effectively \"silenced\" or neutralized.<\/i>"}],"v":"4ee3bd"},{"id":"gene-tech-some-def:rna-silencing#3","path":["RNA SILENCING"],"part":[3,3],"rows":[{"sec":"How is it Applied to Plants?"},{"t":"The researchers used two main techniques to deliver this silencing defense to the banana plants:"},{"h":"<b>HIGS (Host-Induced Gene Silencing):<\/b>","t":"The plant itself is genetically modified to produce these \"search and destroy\" RNA molecules internally."},{"h":"<b>SIGS (Spray-Induced Gene Silencing):<\/b>","t":"A non-GMO approach where the silencing RNA is simply sprayed directly onto the crop's leaves, which absorb it and use it to fight off the virus."}],"v":"b9bd53"},{"id":"gene-tech-some-def:pangenome#1","path":["PANGENOME"],"part":[1,2],"rows":[{"h":"Think of this topic in two parts:","t":"<b>The \"What\"<\/b> (Pangenome) and <b>The \"How\"<\/b> (HiFi Sequencing)."},{"sec":"1. The \"What\": Genome vs. Pangenome"},{"t":"To understand a <i>Pangenome<\/i>, you first have to understand a standard <i>Genome<\/i>."},{"h":"<b>A Standard Genome (The Single Book):<\/b>","t":"Historically, when scientists mapped a species' DNA (like the original Human Genome Project), they essentially mapped the DNA of <i>one<\/i> individual or a very small group. It is like taking one person's family recipe book and saying, \"This represents all Indian food.\" It misses the massive diversity that exists across different regions."},{"h":"<b>A Pangenome (The Entire Library):<\/b>","t":"A Pangenome is the entire collection of genetic data from <i>many<\/i> different individuals of the same species. It captures the \"core\" genes that every single Asian rice plant shares, <i>plus<\/i> all the unique, variable genes found only in specific regional varieties."},{"sec":"2. The \"How\": What is PacBio HiFi Sequencing?"},{"t":"Sequencing DNA is basically reading the genetic code (A, C, T, G). But DNA strands are incredibly long, so machines have to break them into smaller pieces to read them, and then stitch the data back together."},{"h":"<b>Traditional (Short-Read) Sequencing:<\/b>","t":"Imagine taking a document, shredding it into tiny 1-inch strips, and trying to tape it back together. It works, but it is highly prone to errors, especially if there are repeating words."},{"h":"<b>HiFi Long-Read Sequencing:<\/b>","t":"This new technology is like tearing the document into whole pages or chapters instead of tiny strips. Because the machine reads much longer, continuous strands of DNA in real-time, it makes assembling the final genetic puzzle significantly faster and incredibly accurate."}],"v":"3dcbc4"},{"id":"gene-tech-some-def:pangenome#2","path":["PANGENOME"],"part":[2,2],"rows":[{"sec":"Why This Matters (The Exam Application)"},{"t":"Understanding the entire genetic library of a species unlocks massive potential for the future:"},{"h":"<b>In Agriculture (The Rice Breakthrough):<\/b>","t":"By looking at the Pangenome, scientists can find a specific gene in a rare, wild variety of Asian rice that makes it survive extreme droughts or resist a specific pest. They can then introduce that \"hidden\" trait into mainstream crops to ensure food security against climate shocks."},{"h":"<b>In Precision Medicine:<\/b>","t":"The Human Pangenome allows doctors to see genetic variations specific to certain ethnicities or populations. This helps in understanding why certain groups are more prone to specific diseases and allows for highly targeted, personalized medical treatments."}],"v":"04d3a9"},{"id":"gene-tech-some-def:shukr-gene#1","path":["SHUKR GENE"],"part":[1,2],"rows":[{"sec":"1. The Context: Darwin’s \"Abominable Mystery\""},{"t":"To understand the importance of this discovery, you first have to understand the mystery it helps solve."},{"t":"When Charles Darwin was studying the fossil record, he noticed something that deeply frustrated him. According to his theory of evolution, species should evolve slowly and gradually over millions of years. However, <b>flowering plants (angiosperms)<\/b> seemed to suddenly appear out of nowhere in the fossil record and rapidly took over the planet, outcompeting older plants like ferns and conifers. Darwin famously called this sudden, explosive success an \"abominable mystery.\""},{"sec":"2. The Breakthrough: The SHUKR Gene"},{"t":"Researchers at the CCMB in Hyderabad discovered a specific gene in plants and named it <b>SHUKR<\/b> (which translates to sperm or seed in Sanskrit)."},{"t":"This gene acts as a \"Master Controller\" for plant reproduction."},{"h":"<b>The F-Box Genes (The Quality Control Team):<\/b>","t":"The SHUKR gene controls a family of genes known as F-box genes. Think of F-box genes as the quality control inspectors in a factory. Their job is to manage proteins and get rid of the \"junk\" proteins that are no longer needed."},{"h":"<b>Healthy Pollen:<\/b>","t":"By strictly managing these proteins, the F-box genes ensure that the plant produces incredibly healthy, viable pollen (the plant's male reproductive cells)."}],"v":"99a94f"},{"id":"gene-tech-some-def:shukr-gene#2","path":["SHUKR GENE"],"part":[2,2],"rows":[{"sec":"3. Solving the Mystery: The Evolutionary Fast-Track"},{"t":"So, how does finding a gene that makes healthy pollen solve Darwin's 150-year-old mystery?"},{"t":"The researchers discovered that the SHUKR gene and its associated F-box genes <b>evolve and mutate incredibly fast<\/b>."},{"t":"Because the \"machinery\" controlling plant reproduction could change and adapt so quickly, flowering plants were able to rapidly develop new ways to reproduce, survive in different climates, and attract different pollinators (like bees and birds). This highly adaptable, fast-evolving reproductive system gave them a massive evolutionary advantage, allowing them to rapidly spread across the globe and dominate the Earth's flora."}],"v":"4be5a3"},{"id":"gene-tech-some-def:dna-profiling-red-fort-blast#1","path":["DNA PROFILING (RED FORT BLAST)"],"part":[1,2],"rows":[{"sec":"The Core Concept: Why \"Non-Coding\" DNA?"},{"t":"To understand DNA profiling, you first need to know that <b>99.9% of the DNA in all humans is exactly the same<\/b> (it's what gives us two arms, a heart, a brain, etc.)."},{"t":"To identify a specific individual, forensic scientists do not look at these common genes. Instead, they look at <b>non-coding regions<\/b> (sometimes colloquially called \"junk DNA\"). These are parts of the DNA that don't build proteins, but they contain short sequences of genetic code that repeat over and over again."},{"t":"<span class=\"lst\"><span class=\"li\">This is where <b>VNTRs (Variable Number of Tandem Repeats)<\/b> come in.<\/span><br><span class=\"li\">Imagine a sequence of DNA letters like \"C-A-T\".<\/span><br><span class=\"li\">In Person A, \"C-A-T\" might repeat 5 times in a row.<\/span><br><span class=\"li\">In Person B, \"C-A-T\" might repeat 15 times in a row.<\/span><\/span>"},{"t":"Because the <i>number of repeats<\/i> is highly variable and unique to every individual, it acts as a genetic \"fingerprint.\""},{"sec":"The 4 Key Methods (And When to Use Them)"},{"t":"Forensic teams choose different profiling methods depending on the condition of the evidence (like at a heavily damaged blast site)."},{"sec":"<b>1. STR (Short Tandem Repeat) - The Standard Method<\/b>"},{"h":"<b>What it is:<\/b>","t":"The most common profiling method. It looks at very short, repeating sequences in the nucleus of the cell."},{"h":"<b>When it's used:<\/b>","t":"When investigators have a good, relatively intact sample of blood, saliva, or tissue. It is fast and incredibly accurate."}],"v":"683c7c"},{"id":"gene-tech-some-def:dna-profiling-red-fort-blast#2","path":["DNA PROFILING (RED FORT BLAST)"],"part":[2,2],"rows":[{"sec":"<b>2. mtDNA (Mitochondrial DNA) - The Survival Method<\/b>"},{"h":"<b>What it is:<\/b>","t":"Mitochondria are the \"powerhouses\" of the cell, and they contain their own separate loop of DNA, inherited exclusively from the mother."},{"h":"<b>When it's used:<\/b>","t":"Because a single cell has thousands of mitochondria (but only one nucleus), mtDNA survives extreme heat, explosions, or severe degradation much better. It is used when nuclear DNA is destroyed, like identifying victims in fires or old skeletal remains."},{"sec":"<b>3. Y-Chromosome Analysis - The Paternal Trace<\/b>"},{"h":"<b>What it is:<\/b>","t":"Looks exclusively at the STRs on the Y chromosome, which is only present in males and is passed directly from father to son almost unchanged."},{"h":"<b>When it's used:<\/b>","t":"To identify male victims or suspects by comparing the sample against their male relatives (a father, brother, or paternal uncle). It is also highly useful in sexual assault cases to isolate male DNA from a mixed sample."},{"sec":"<b>4. SNPs (Single Nucleotide Polymorphisms) - The Micro-Detail<\/b>"},{"h":"<b>What it is:<\/b>","t":"Instead of looking at repeating chunks, SNPs look at a difference in just a <b>single base letter<\/b> (like an 'A' swapped for a 'G') at a specific point in the genome."},{"h":"<b>When it's used:<\/b>","t":"For extremely precise matching. Because it looks at such tiny variations, it is highly effective when matching trace evidence from a crime scene to an item heavily used by the victim, like a toothbrush or a hairbrush."}],"v":"0751ea"},{"id":"gene-tech-some-def:jumping-genes#1","path":["JUMPING GENES"],"part":[1,2],"rows":[{"sec":"1. The Core Concept: What are \"Jumping Genes\"?"},{"t":"Officially known as <b>Transposable Elements (TEs)<\/b>, these are mischievous sequences of DNA that refuse to stay in one place."},{"t":"Unlike standard genes that have a fixed, permanent address on a chromosome, jumping genes have the unique ability to physically move or replicate themselves and insert themselves into completely new locations across the genome."},{"t":"Remarkably, these wandering sequences make up <b>over 50% of the human genome<\/b>."},{"sec":"2. The Two Mechanisms: How Do They \"Jump\"?"},{"t":"Jumping genes alter the genetic landscape using two primary methods, which you can think of as simple computer keyboard commands:"},{"h":"<b>The \"Cut and Paste\" Method (DNA Transposons):<\/b>","t":"The gene physically excises (cuts) itself out of its original location and inserts itself into a new spot. The overall size of the genome stays the same, but the sequence changes."},{"h":"<b>The \"Copy and Paste\" Method (Retrotransposons):<\/b>","t":"The gene leaves the original sequence intact but makes a copy of itself (often using an RNA intermediate) and inserts that new copy somewhere else. This mechanism actively <i>increases<\/i> the total amount of DNA in the cell over time. <b>LINE-1<\/b>, mentioned in the study, is a classic example of this type."}],"v":"9f6b25"},{"id":"gene-tech-some-def:jumping-genes#2","path":["JUMPING GENES"],"part":[2,2],"rows":[{"sec":"3. The Impact: The Good, The Bad, and The Evolutionary"},{"t":"When a gene jumps into a new location, it acts as a massive genetic disruptor."},{"h":"<b>The Bad (Mutations & Disease):<\/b>","t":"If a jumping gene lands right in the middle of a crucial, healthy gene, it can break that gene's instructions, potentially leading to diseases like hemophilia or certain cancers."},{"h":"<b>The Good (Evolutionary Innovation):<\/b>","t":"Over millions of years, these genetic reshufflings have created new gene combinations and regulatory networks. They are a massive driver of evolutionary change and genetic diversity."},{"sec":"4. The Application: Why the ICAR Patent Matters"},{"t":"This is where the topic becomes highly relevant for current affairs."},{"t":"Scientists have realized that the proteins which allow these genes to \"jump\" (like <b>TnpB<\/b>) act like highly precise microscopic scissors."},{"t":"The Indian Council of Agricultural Research (ICAR) has patented a technology using these TnpB proteins to perform targeted <b>Genome Editing<\/b>. Instead of letting the gene jump randomly, scientists can program these \"scissors\" to cut DNA at specific, desired locations to remove disease-causing traits or insert beneficial ones (like drought resistance) into crops."}],"v":"498af9"},{"id":"gene-tech-some-def:biochemical-markers","path":["BIOCHEMICAL MARKERS"],"rows":[{"h":"Meaning:","t":"They are small molecules (like sugars, amino acids, lipids) produced during metabolic processes in the body and are used by doctors for ascertaining disease risks."},{"t":"For e.g., cholesterol tests are used to assess heart disease risk."},{"h":"Components for identifying <u>kidney<\/u> complication:","t":"arabitol, myo-inositol, ribothymidine, etc"}],"v":"a5c804"},{"id":"gene-tech-some-def:deep-project#1","path":["DEEP PROJECT"],"part":[1,2],"rows":[{"sec":"1. The Core Concept: What is Epigenetics?"},{"t":"If your DNA is the <b>hardware<\/b> of a computer, your epigenome is the <b>software<\/b>."},{"h":"<b>Genetics (The Hardware):<\/b>","t":"Your DNA sequence (the A, C, T, G letters) is fixed from birth. It is the instruction manual for your body. If a genetic mutation occurs, the actual text in the manual is rewritten."},{"h":"<b>Epigenetics (The Software):<\/b>","t":"Epigenetics literally means \"above genetics.\" It refers to chemical tags that attach to your DNA. They do not change the genetic code itself; instead, they act like <b>volume dials or on/off switches<\/b>. They tell the body <i>how<\/i> to read the manual—which genes should be turned up, turned down, or completely silenced."},{"h":"<b>The crucial exam point:<\/b>","t":"Unlike genetic mutations, epigenetic changes are <b>reversible<\/b> and are heavily influenced by your <b>environment and lifestyle<\/b> (e.g., diet, stress, pollution, exercise, and aging)."},{"sec":"2. The DEEP Project: Why It Matters"},{"t":"The <b>Diverse Epigenetic Epidemiology Partnership (DEEP)<\/b> is a 5-year global collaboration (notably involving India's CSIR-CCMB)."},{"t":"Historically, the vast majority of global genetic and epigenetic databases have been overwhelmingly based on people of European descent. The DEEP project aims to fix this massive blind spot by studying <b>genomic and environmental diversity<\/b> across different global populations, including India."}],"v":"8ba2dc"},{"id":"gene-tech-some-def:deep-project#2","path":["DEEP PROJECT"],"part":[2,2],"rows":[{"sec":"Here is why this is strategically important:"},{"h":"<b>Understanding Disease Risk:<\/b>","t":"A diet or environmental pollutant in India might trigger a specific epigenetic \"switch\" that leads to diabetes or heart disease in South Asians, but might not have the same effect on Europeans. DEEP studies these specific population-environment interactions."},{"h":"<b>Precision Public Health:<\/b>","t":"By understanding how the unique Indian environment (our diets, climate, and localized stressors) alters our gene expression, the government can design highly targeted, preventative healthcare policies rather than relying on western-centric health data."},{"h":"<b>Drug Development:<\/b>","t":"It paves the way for medicines tailored to the specific epigenetic profiles of diverse populations."}],"v":"236438"},{"id":"gene-tech-some-def:chromatin-remodelling#1","path":["CHROMATIN REMODELLING"],"part":[1,2],"rows":[{"sec":"What is Chromatin Remodeling?"},{"t":"<b>Chromatin Remodeling<\/b> is the biological process by which a cell dynamically rearranges how tightly or loosely its DNA is packaged inside the nucleus. This structural reshaping is the primary mechanism cells use to <b>turn genes \"ON\" or \"OFF\"<\/b> (gene regulation) without changing the underlying genetic code itself."},{"sec":"The Core Concept: Why DNA Must Be \"Remodeled\""},{"t":"In human cells, roughly <b>2 meters of DNA<\/b> must be folded and packed into a microscopic nucleus. To fit:"},{"t":"<span class=\"lst\"><span class=\"li\">DNA strands are wrapped around spool-like proteins called <b>histones<\/b>.<\/span><br><span class=\"li\">A complex of DNA + histones is called a <b>nucleosome<\/b>.<\/span><br><span class=\"li\">Stringed nucleosomes fold together into a condensed substance called <b>chromatin<\/b>.<\/span><\/span>"},{"sec":"The Problem vs. The Solution"},{"h":"<b>The Problem:<\/b>","t":"When DNA is tightly packed, the cellular machinery that reads genes (like <b>RNA Polymerase<\/b> and transcription factors) physically cannot access the genetic code."},{"h":"<b>The Solution (Chromatin Remodeling):<\/b>","t":"Specialized enzymes act like \"librarians\"—they slide, eject, or loosen the histone spools to expose specific genes so they can be read, or condense them so they are silenced."},{"sec":"How Cells Remodel Chromatin: Two Main Mechanisms"},{"sec":"1. ATP-Dependent Remodeling Complexes (The <i>CHD3<\/i> Connection)"},{"h":"<b>How it works:<\/b>","t":"Specialized protein complexes use cellular energy (<b>ATP<\/b>) to physically slide nucleosomes along the DNA strand, twist the DNA, or eject histones entirely to expose a target gene."},{"h":"<b>Why <\/b><i><b>CHD3<\/b><\/i><b> matters:<\/b>","t":"The <b>CHD3 gene<\/b> (mentioned in the China clinical trial case) produces an ATP-dependent chromatin remodeling enzyme. If <i>CHD3<\/i> is mutated, the brain's developing neurons cannot open or close the correct genes at the right times—causing disorders like <b>Snijders Blok-Campeau syndrome<\/b>."}],"v":"4fa5b6"},{"id":"gene-tech-some-def:chromatin-remodelling#2","path":["CHROMATIN REMODELLING"],"part":[2,2],"rows":[{"sec":"2. Histone Chemical Modifications (The \"Epigenetic\" Switches)"},{"t":"Enzymes attach or remove chemical tags on the tails of histone proteins, altering how tightly DNA clings to them:"},{"h":"<b>Histone Acetylation (Turns Genes ON):<\/b>","t":"Adding acetyl groups relaxes the magnetic attraction between histones and DNA. The chromatin opens up into <b>euchromatin<\/b>, activating gene expression."},{"h":"<b>Histone Deacetylation (Turns Genes OFF):<\/b>","t":"Removing acetyl groups causes DNA to clamp tightly back around histones, condensing into <b>heterochromatin<\/b> and silencing the gene."},{"h":"<b>Histone Methylation:<\/b>","t":"Can either turn genes ON or OFF depending on which specific amino acid on the histone tail receives the methyl group."},{"sec":"UPSC Prelims High-Yield Takeaways"},{"h":"<b>Link to Epigenetics:<\/b>","t":"Chromatin remodeling is a foundational mechanism of <b>epigenetics<\/b>—heritable changes in gene activity and cellular phenotype that do <i>not<\/i> involve alterations to the underlying DNA sequence."},{"h":"<b>Cellular Differentiation:<\/b>","t":"Every cell in your body (brain cell, skin cell, liver cell) contains the <b>exact same DNA<\/b>. Chromatin remodeling is what makes them different—by keeping \"brain genes\" open in neurons while locking \"liver genes\" shut in those same neurons."},{"h":"<b>Cancer & Therapeutics:<\/b>","t":"Faulty chromatin remodeling can accidentally turn off <b>tumor-suppressor genes<\/b> or turn on <b>oncogenes<\/b> (cancer-causing genes). Several modern cancer drugs (like HDAC inhibitors) work by reversing abnormal chromatin remodeling."}],"v":"5ac2ad"},{"id":"gene-tech-some-def:helicase-the-dna-seperator#1","path":["Helicase : THE DNA seperator"],"part":[1,2],"rows":[{"sec":"The Foundation: DNA Structure and Cell Division"},{"t":"To understand what helicase does, we first have to understand the structure of DNA. DNA is normally a <b>double helix<\/b>. Imagine a twisted ladder: there are two long side-strands held together by \"rungs,\" which are chemical bonds between bases on each strand."},{"t":"When a cell is preparing to divide, it must create an exact copy of its genetic information so that the new cell has a complete instruction manual. To copy the DNA, those two spiraling strands must be pulled apart."},{"sec":"The Role of Helicase"},{"t":"<b>Helicase<\/b> is the specific enzyme (a specialized protein that speeds up chemical reactions in the body) responsible for unwinding and separating those two strands of DNA. Here is the step-by-step mechanics of how it accomplishes this:"},{"h":"<b>Attachment:<\/b>","t":"The helicase enzyme attaches itself to a specific starting region on the DNA molecule."},{"h":"<b>Energy Consumption:<\/b>","t":"Doing physical work at a molecular level requires energy. Helicase uses <b>ATP<\/b> (Adenosine Triphosphate), which is essentially the primary chemical battery or energy currency of the cell."},{"h":"<b>Shape Shifting and Separation:<\/b>","t":"By using the energy from ATP, the helicase changes its own physical shape. This shape-shifting provides the mechanical force needed to move along the DNA molecule and violently break the chemical bonds holding the two strands together."},{"h":"<b>The Replication Fork:<\/b>","t":"As helicase travels along the DNA, breaking bonds, it creates a Y-shaped opening called the <b>replication fork<\/b>. The article makes a highly accurate comparison here: it is exactly like pulling down a zipper on a jacket, where the closed track splits into two separate sides."}],"v":"d45b1a"},{"id":"gene-tech-some-def:helicase-the-dna-seperator#2","path":["Helicase : THE DNA seperator"],"part":[2,2],"rows":[{"sec":"The Complication: Mechanical Tension"},{"t":"There is a mechanical problem with unwinding a twisted structure. If you take two strings that are twisted together and pull them apart in the middle, the twisting ahead of where you are pulling gets tighter and tighter."},{"t":"The same thing happens to DNA. As helicase moves forward, the DNA ahead of the replication fork tends to become increasingly twisted and tightly coiled. If left unchecked, the tension would become so great that the DNA molecule would tangle or snap."},{"sec":"The Solution: Topoisomerases"},{"t":"To prevent the DNA from breaking due to this tension, the cell uses a different set of enzymes called <b>topoisomerases<\/b>. These enzymes travel ahead of the helicase, temporarily cutting the DNA strands to relieve the twisting tension, and then gluing them back together, ensuring the DNA remains intact while being unzipped."},{"sec":"The Final Step and New Discoveries"},{"t":"Once the helicase has successfully exposed the two single strands, other cellular \"machinery\" steps in. They use those exposed single strands as templates to build new, complementary strands, eventually resulting in two identical double-helix DNA molecules."}],"v":"64c934"}]},{"id":"rna-editing","subj":"s04","name":"RNA EDITING","cards":[{"id":"rna-editing:main#1","path":[],"part":[1,2],"rows":[{"sec":"What is RNA?"},{"t":"RNA carries out the instructions given by DNA and ensures those instructions are accurately implemented. Because DNA changes can be permanent, RNA is seen as an alternative target for manipulation since it is constantly made and destroyed. (Eg. COVID vaccines used mRNA to fight the virus.)"},{"sec":"Process"},{"h":"RNA has four building blocks:","t":"A (Adenine), G (Guanine), U (Uracil), and C (Cytosine)."},{"sec":"In RNA, each nucleotide has:"},{"t":"a base (A, U, G, or C),<br>a ribose sugar, and<br>a phosphate group."},{"t":"The ribose connects the phosphate and the base - forming a long chain (the RNA strand). So, it literally holds the RNA molecule together."},{"sec":"Key Mechanism"},{"t":"ADAR (Adenosine Deaminase Acting on RNA) is like a “letter swapper” in RNA - similar in concept to how Cas9 edits genes."},{"sec":"ADAR action (detail)"},{"t":"When A is attached to ribose it’s called adenosine, not adenine."},{"t":"The ADAR technique performs a reaction called deamination - it removes an -NH2 (amino group) from the adenine base (as part of adenosine) inside RNA. After that small chemical tweak, the molecule becomes inosine."},{"t":"<span class=\"lst\"><span class=\"li\">Cell detects Inosine in Adenosine’s position, triggering cellular response to correct the mismatch.<\/span><br><span class=\"li\">The process thus restores mRNA’s original function, and cell starts making normal proteins.<\/span><\/span>"}],"v":"cd0cbb"},{"id":"rna-editing:main#2","path":[],"part":[2,2],"rows":[{"sec":"Technical Hurdles"},{"h":"Challenges in RNA editing:","t":"lack of specificity, the transient nature of RNA, and the nascent stage of development."},{"sec":"RNA Varieties"},{"sec":"Types:"},{"t":"mRNA - messenger RNA that carries coding information for proteins."},{"t":"tRNA - transports the correct amino acids to the ribosome so the protein matches the mRNA instructions."},{"t":"rRNA (ribosomal RNA) - helps form the ribosome (the cell’s protein-making factory), binds mRNA and tRNA to the ribosome, and directs translation of mRNA into proteins."},{"t":"gRNA - short RNA molecules that guide the editing process by matching specific parts of mRNA to show where changes should be made."}],"v":"7c278d"}]},{"id":"synthetic-biology","subj":"s04","name":"SYNTHETIC BIOLOGY","cards":[{"id":"synthetic-biology:main","path":[],"rows":[{"t":"Unlike traditional biotech (which modifies existing traits), SynBio uses a bottom-up approach. It treats DNA as “code” and biological parts (genes, enzymes) as “hardware” to build entirely new biological systems."},{"t":"basically using genetic engineering to create an orgnaism that never exsisted before by manipulatiing genome of an organism<br>precise as DNA is there<br>hyper carbon absorbing plants, cancer killing cells, anything really,"},{"video":"https://www.youtube.com/watch?v=J-x5phDjWzw"},{"sec":"Why It Matters (The “So-What” for Mains)"},{"h":"Economic Transformation:","t":"Projected to contribute $30 trillion to global output by 2030."},{"h":"Sustainability:","t":"Enables Carbon Capture via synthetic algae and creates biodegradable “leather” from mycelium (e.g., used by brands like Hermes)."},{"h":"Low-Cost Diagnostics:","t":"Cell-free systems allow for paper-based sensors (like the FELUDA test logic) that don’t require cold chains or complex labs."}],"v":"3a6817"}]},{"id":"cell-free-systems","subj":"s04","name":"CELL-FREE SYSTEMS","cards":[{"id":"cell-free-systems:main","path":[],"rows":[{"t":"Taking the “machinery” (ribosomes, enzymes) out of the cell to perform reactions in a test tube."},{"h":"Analogy:","t":"If SynBio is like upgrading a car’s engine while it’s running, CFS is like taking the engine out and running it on a workbench-it’s faster, safer, and not limited by the “survival needs” of a living cell."}],"v":"01a011"}]},{"id":"microbiome-and-live-biotherapeutics","subj":"s04","name":"Microbiome and live biotherapeutics","cards":[{"id":"microbiome-and-live-biotherapeutics:main","path":[],"rows":[{"h":"<b>Microbiome:<\/b>","t":"The community of microorganisms (bacteria, fungi, viruses, etc.) living in a particular environment such as the human gut, skin, or soil."},{"h":"<b>Live Biotherapeutics:<\/b>","t":"Medicinal products containing <b>live microorganisms<\/b> that are used to <b>prevent, treat, or cure diseases<\/b> by modifying the body’s microbiome."},{"h":"Concept (simple):","t":"manipulating microbial communities (gut, soil) for health or agricultural benefits."},{"h":"Applications:","t":"fecal microbiota therapy, next-gen probiotics, soil microbiome for crop resilience."},{"h":"Trend:","t":"translational movement from association studies to mechanistic and clinical trials; regulatory frameworks evolving."},{"h":"Exam keywords:","t":"microbiome modulation, live biotherapeutics, gutbrain axis."}],"v":"16e986"}]},{"id":"new-drug-modalities-targeted-protein-deg","subj":"s04","name":"New drug modalities - targeted protein degradation, radioligand therapy, gene silencing","cards":[{"id":"new-drug-modalities-targeted-protein-deg:main","path":[],"rows":[{"sec":"Concepts:"},{"h":"<b>Targeted Protein Degradation:<\/b>","t":"A therapeutic approach that <b>selectively destroys harmful proteins inside cells<\/b> using engineered molecules."},{"h":"<b>Radioligand Therapy:<\/b>","t":"A treatment where a <b>radioactive molecule is attached to a targeting ligand<\/b> (A molecule that <b>binds specifically to a receptor or target protein) <\/b>to deliver radiation directly to specific diseased cells (e.g., cancer)."},{"h":"<b>Gene Silencing:<\/b>","t":"A technique that <b>turns off or suppresses the expression of a specific gene<\/b> to prevent the production of harmful proteins."},{"h":"Trend:","t":"TPD and radioligand therapies moved closer to wider clinical use in 2025-26."}],"v":"830c4a"}]},{"id":"transgenics","subj":"s04","name":"Transgenics","cards":[{"id":"transgenics:main","path":[],"rows":[{"t":"The stable insertion of a “foreign” gene (DNA from a different species) into a plant’s genome to provide a specific advantage (e.g., Cry1Ac gene from soil bacteria into cotton for bollworm resistance)."},{"h":"Example:","t":"A cotton plant that is both Bt (pest resistant) AND HT (Herbicide Tolerant)."},{"h":"The Goal:","t":"Provides a “one-stop” solution for farmers, reducing the need for multiple chemical sprays (insecticides + weedicides)."}],"v":"56bc1f"}]},{"id":"department-of-biotechnology-new-guidelin","subj":"s04","name":"Department of biotechnology new guidelines on Stacked GE Plants (August 2025)","cards":[{"id":"department-of-biotechnology-new-guidelin:main#1","path":[],"part":[1,2],"rows":[{"sec":"The “Big Picture” Definition"},{"t":"A Stacked GE plant contains two or more Genetically Engineered traits combined together."},{"h":"Single Trait:","t":"A cotton plant with only the Bt gene (pest resistance)."},{"h":"Stacked Trait:","t":"A cotton plant with Bt (pest resistance) + HT (Herbicide Tolerance) + Drought Tolerance."},{"h":"Methods covered:","t":"Stacking via conventional breeding (crossing two GM parents) or genetic transformation (re-transformation or cotransformation)."},{"h":"T<u>he Reform:<\/u>","t":"<u> Streamlined Biosafety Assessment<\/u>"},{"sec":"The 2025 guidelines introduce a “Tiered Evaluation” logic:"},{"h":"The “Efficiency” Rule:","t":"If the individual traits (parent events) have already been cleared for environmental release/commercial use, the stacked version does not require a full de novo biosafety study."},{"h":"Focus Area:","t":"The Review Committee on Genetic Manipulation (RCGM) now focuses primarily on “Interactions”:"},{"t":"<span class=\"lst\"><span class=\"li\">Does the presence of Gene A affect the expression or safety of Gene B?<\/span><br><span class=\"li\">Is the genetic stability maintained across generations?<\/span><br><span class=\"li\">Is there any synergistic toxicity or allergenicity?<\/span><\/span>"}],"v":"72932b"},{"id":"department-of-biotechnology-new-guidelin:main#2","path":[],"part":[2,2],"rows":[{"sec":"Why This Matters for India (2026 Context)"},{"h":"The “illegal HT-Bt” Problem:","t":"Since 2015, farmers (especially in Punjab and Maharashtra) have used unapproved HT-Bt cotton. This policy provides a legal, regulated pathway for such “Next-Gen” seeds to reach the market safely."},{"h":"BioE3 Policy Linkage:","t":"These guidelines are a core pillar of the BioE3 Policy (Biotechnology for Economy, Environment, and Employment), aiming for a $300 billion bioeconomy by 2030. ( India’s first National Biofoundry Network was launched in August 2025, which also marked the first anniversary of India’s BioE3 Policy."},{"t":"Biofoundry is an automated facility that rapidly designs, builds, and optimizes engineered organisms by integrating DNA synthesis, gene editing, and high-throughput biomanufacturing workflows."},{"h":"Reducing R&D Costs:","t":"Shorter approval timelines (by 2-3 years) incentivize domestic seed companies and public institutes (like ICAR/ PAU) to innovate."}],"v":"5b1563"}]},{"id":"proteins","subj":"s04","name":"PROTEINS","cards":[{"id":"proteins:main","path":[],"rows":[{"sec":"BIOLOGICAL ROLE"},{"t":"Proteins are molecules made of amino acids that perform vital jobs in the body (enzymes, hormones, antibodies, structure, transport), and in nutrition the word refers to protein-rich foods whose molecules are digested into amino acids for building the body’s own proteins - the same substance, seen once as a biological worker and once as a dietary source."},{"sec":"Structure-Function Relationship"},{"t":"Proteins are major biomolecules made of long chains of 20 different building blocks called amino acids, joined end-to-end by peptide bonds; the exact order of these amino acids (the sequence) makes the chain fold into specific shapes through layers of structure - primary (sequence), secondary (local patterns like helices and sheets), tertiary (the full 3D fold) and sometimes quaternary (several chains together) - and that final shape determines what the protein can do."},{"t":"Cells make proteins by reading genes (DNA → mRNA → ribosome → amino-acid chain), and once folded they perform almost every job in the body: give cells and tissues strength (actin, collagen), speed up chemical reactions as enzymes (amylase), carry signals as hormones (insulin), recognise and neutralise invaders as antibodies Immunoglobulin G ( (IgG), and move or store small molecules (transporters like GLUT proteins, carriers like haemoglobin, storage proteins like ferritin)."},{"t":"Proteins are sensitive to their environment - heat, pH or chemicals can unfold them (denaturation) and stop them working - which is why both their sequence and their shape are crucial; in short, “sequence → shape → function,” and without proteins life cannot run."}],"v":"d0d661"}]},{"id":"recombinant-dna","subj":"s04","name":"RECOMBINANT DNA","cards":[{"id":"recombinant-dna:main","path":[],"rows":[{"sec":"Definition & Technique"},{"h":"Recombinant DNA (rDNA) -","t":"Artificially constructed DNA made by combining genetic material from two or more different sources, often from different species, to create new genetic combinations vs Gene-Edited DNA - DNA whose existing sequence has been directly modified at specific locations"},{"t":"rDNA - Uses molecular cloning techniques such as restriction enzymes, ligases, and vectors (plasmids, viruses) to splice genes from one organism into another. Example: inserting human insulin gene into E. coli bacteria"}],"v":"ca90bf"}]},{"id":"mitochondrial-transplantation","subj":"s04","name":"MITOCHONDRIAL TRANSPLANTATION","cards":[{"id":"mitochondrial-transplantation:main#1","path":[],"part":[1,3],"rows":[{"sec":"Concept & Purpose"},{"h":"Meaning :","t":"It involves transporting healthy mitochondria to damaged cells, tissues, or organs. The aim is to restore mitochondrial function in diseased cells, particularly in conditions linked to mtDNA-related disorders (mitochondrial DNA defects).<br>Therapeutic Potential"},{"h":"Applications -","t":"Potential Therapeutic Uses"}],"v":"8956be"},{"id":"mitochondrial-transplantation:main#2","path":[],"part":[2,3],"table":1,"head":["System","Conditions"],"rows":[{"h":"Neural","t":"<span class=\"th\">Conditions<\/span> Parkinson’s disease, Stroke"},{"h":"Dermatologic","t":"<span class=\"th\">Conditions<\/span> Skin atrophy, Ecchymosis, Striae, Acne, Hirsutism, Hair loss, Impaired wound healing"},{"h":"Musculoskeletal","t":"<span class=\"th\">Conditions<\/span> Osteoporosis, Bone fracture healing, Myopathies"},{"h":"Cardiovascular","t":"<span class=\"th\">Conditions<\/span> Heart failure, Pulmonary hypertension"},{"h":"Ophthalmologic","t":"<span class=\"th\">Conditions<\/span> Cataracts, Glaucoma"},{"h":"Reproductive","t":"<span class=\"th\">Conditions<\/span> Infertility, Diminished ovarian reserve"}],"v":"425e24"},{"id":"mitochondrial-transplantation:main#3","path":[],"part":[3,3],"rows":[{"sec":"<b><u>Limitations & Ethics<\/u><\/b>"},{"t":"Mitochondrial transplantation faces storage constraints (viable only 1-2 hrs on ice), high-tech equipment needs, risks of rejection of the transplanted mitochondria and uncertain long-term functionality. Ethical concerns include its classification as germline gene therapy and the genetic modification status of resulting offspring."}],"v":"167997"},{"id":"mitochondrial-transplantation:mitochondrial-replacement-therapy-in-ivf","path":["Mitochondrial replacement therapy in IVF"],"rows":[{"sec":"Mitochondrial Replacement Therapy (MRT) in IVF = Germline"},{"t":"When people ask about this, they are usually referring to <b>Mitochondrial Replacement Therapy (MRT)<\/b>, famously known as the \"three-parent baby\" technique."},{"h":"<b>How it works:<\/b>","t":"Healthy mitochondria from a donor woman's egg are used to replace the defective mitochondria in the mother's egg or the resulting embryo."},{"h":"<b>Classification:<\/b>","t":"This is considered a <b>germline<\/b> modification."}],"v":"5b5ad3"},{"id":"mitochondrial-transplantation:mitochondrial-transplant-in-regenerative","path":["mitochondrial transplant in regenerative medicine"],"rows":[{"sec":"Mitochondrial Transplantation in Regenerative Medicine = Somatic"},{"t":"There is also a newer, experimental medical procedure physically called \"mitochondrial transplantation\" used to treat damaged adult organs."},{"h":"<b>How it works:<\/b>","t":"Doctors take healthy mitochondria from a patient's own healthy tissue (like muscle) and inject them directly into damaged tissue (like a heart muscle that has suffered a heart attack or an ischemic stroke) to help the cells recover and survive."},{"h":"<b>Classification:<\/b>","t":"This is cons
