LG Polymers, Vizag)<\/span><\/span>","h":"Pushback :"}],"table":1,"head":["","2006","Draft 2020"],"id":"2006-vs-draft-2020-pyq-2020:tbl-main","v":"e9eb3d","q":"How does the draft EIA 2020 differ from EIA 2006, and how did people push back?"}],"pyq":["<b>2020 Q7 (10 marks):<\/b> How does the draft Environment Impact Assessment (EIA) Notification, 2020 differ from the existing EIA Notification, 2006?"],"group":"EIA notes"},{"id":"problems","subj":"s06","name":"Problems","cards":[{"path":[],"roles":["issue"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\"><mark>incomplete, false data<\/mark> (no central data bank)<\/span><br><span class=\"li\">single season data<\/span><br><span class=\"li\"><mark>bulky, technical, only in English<\/mark><\/span><\/span>","h":"Reports :"},{"t":"<span class=\"lst\"><span class=\"li\"><mark>consultant paid by proponent<\/mark><\/span><br><span class=\"li\"><mark>doubtful expertise<\/mark> (Odisha: Reliance project EIA by Berhampur Univ, no Olive Ridley expertise; Mithivirdi nuclear EIA questioned by Greenpeace)<\/span><br><span class=\"li\">copy-paste reports (Sterlite)<\/span><\/span>","cont":1},{"t":"<span class=\"lst\"><span class=\"li\">many exemptions (now critical minerals too)<\/span><br><span class=\"li\"><mark>opinions ignored<\/mark><\/span><br><span class=\"li\"><mark>low literacy in tribal areas<\/mark> (Niyamgiri palli sabha)<\/span><\/span>","h":"Public hearing :"},{"t":"<span class=\"lst\"><span class=\"li\"><mark>documents late<\/mark><\/span><br><span class=\"li\"><mark>minutes lack fidelity<\/mark><\/span><br><span class=\"li\"><mark>local admin sides with project<\/mark><\/span><\/span>","cont":1},{"t":"<span class=\"lst\"><span class=\"li\">for Category A and B1<\/span><br><span class=\"li\">public hearing near the site<\/span><br><span class=\"li\">written responses → run by SPCB/UTPCC → proceedings to the regulator within 45 days<\/span><\/span>","h":"Public consultation (EIA 2006):"},{"t":"now exempt: mining of atomic, critical, strategic minerals (thorium from monazite, rare earths for defence)","cont":1},{"t":"<span class=\"lst\"><span class=\"li\">concerns: weakens Art 21 and 48A<\/span><br><span class=\"li\">Silkyara tunnel (Char Dham) was exempt and collapsed in 2023<\/span><br><span class=\"li\">Sterlite<\/span><br><span class=\"li\">Aarhus Convention 1998<\/span><\/span>","cont":1}],"id":"problems:issue-main","v":"4543ea","q":"What&#x27;s wrong with EIA reports and public hearings?"},{"path":[],"roles":["issue"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">site work starts before EIA<\/span><br><span class=\"li\"><mark>clearance despite objection, no reasons given<\/mark><\/span><br><span class=\"li\">closed-door after hearing<\/span><br><span class=\"li\"><mark>~238 days delay<\/mark><\/span><\/span>","h":"Clearance :"},{"t":"<span class=\"lst\"><span class=\"li\">MoEF regional offices <mark>lax in monitoring<\/mark> (people don't know the standards, SPCB has its own)<\/span><br><span class=\"li\">weak follow-up (Vizhinjam)<\/span><br><span class=\"li\">appeals: <mark>NEAA heard only ~15 cases in 8 yrs<\/mark> (NEAA replaced by NGT, 2010)<\/span><\/span>","h":"After clearance :"},{"t":"<span class=\"lst\"><span class=\"li\"><mark>Vanashakti 2025 ban on post-facto clearance recalled<\/mark> (May 2025 struck down ex-post ECs → Nov 2025 recalled 2:1 on review → Vanashakti III, Jul 2026: prior EC mandatory + 2017 one-time window upheld + 2021 OM quashed for the future, old ex-post ECs stay)<\/span><br><span class=\"li\"><mark>land before EIA for non-coal mining<\/mark> (Dec 2025)<\/span><br><span class=\"li\">Aravalli 100 m definition<\/span><br><span class=\"li\">no transboundary EIA (India not in Espoo 1991)<\/span><\/span>","h":"Dilution now :"}],"id":"problems:issue-main-2","v":"6c217b","q":"What goes wrong at clearance and after it, and how is EIA being diluted now?"}],"group":"EIA notes"},{"id":"way-forward","subj":"s06","name":"Way forward","cards":[{"path":[],"roles":["fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\"><mark>Independent EIA authority<\/mark> (judicial officers + civil society, env't, scientists)<\/span><br><span class=\"li\">central fund deposited by developers<\/span><br><span class=\"li\">accredited list of consultants<\/span><\/span>"},{"t":"<span class=\"lst\"><span class=\"li\"><mark>explaining → discussing → voting<\/mark><\/span><br><span class=\"li\">video recording<\/span><br><span class=\"li\">true minutes<\/span><br><span class=\"li\">local language<\/span><\/span>","h":"Public hearing in 3 phases :"},{"t":"<span class=\"lst\"><span class=\"li\"><mark>Reasons for approval/rejection in clear terms<\/mark><\/span><br><span class=\"li\">expert meeting minutes public<\/span><br><span class=\"li\">balanced expert committee (env't experts, sociologists)<\/span><\/span>"}],"id":"way-forward:fix-main","v":"3914e3","q":"How do we fix EIA&#x27;s institutions and public hearings?"},{"path":[],"roles":["fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\"><mark>MoEF regional offices with experts<\/mark><\/span><br><span class=\"li\">local communities in monitoring<\/span><br><span class=\"li\">info desk on clearance status<\/span><br><span class=\"li\"><mark>capacity building<\/mark> of communities, NGOs, judges<\/span><\/span>"},{"t":"<span class=\"lst\"><span class=\"li\"><mark>Trim exemptions<\/mark><\/span><br><span class=\"li\">no rapid EIA<\/span><br><span class=\"li\"><mark>assess biodiversity<\/mark><\/span><br><span class=\"li\"><mark>disaster plan<\/mark><\/span><\/span>"},{"t":"<span class=\"lst\"><span class=\"li\"><mark>Strategic Env't Assessment<\/mark> (sector-wide)<\/span><br><span class=\"li\">cumulative, regional EIA<\/span><br><span class=\"li\">standalone EIA law<\/span><br><span class=\"li\">independent post-clearance audit (UK model)<\/span><\/span>","cont":1}],"id":"way-forward:fix-main-2","v":"d1b5c8","q":"Better monitoring after clearance, and reforms to the EIA system itself?"}],"group":"EIA notes"},{"id":"cases","subj":"s06","name":"Cases","cards":[{"path":[],"roles":["fact"],"rows":[{"t":"MC Mehta 1986 (<mark>absolute liability<\/mark>)"},{"t":"Godavarman 1995","cont":1},{"t":"Vellore Citizens 1996 (<mark>polluter pays, precautionary principle<\/mark>)","cont":1},{"t":"MC Mehta v Kamal Nath 1996 (<mark>public trust<\/mark>)","cont":1},{"t":"Arts 21, 48A, 51A(g)","cont":1}],"id":"cases:fact-main","v":"c211b6","q":"The key environmental cases and constitutional provisions behind EIA?"}],"group":"EIA notes"},{"id":"ngos-and-activists-pyq-2024","subj":"s06","name":"NGOs and activists (PYQ 2024)","cards":[{"path":[],"roles":["eg"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">translate reports<\/span><br><span class=\"li\">bring people to hearings<\/span><br><span class=\"li\">file objections<\/span><br><span class=\"li\">go to NGT/SC<\/span><br><span class=\"li\">expose copy-paste reports and violations<\/span><\/span>","h":"Role :"},{"t":"KSSP campaign → Kunthipuzha dam dropped → National Park 1984","h":"<mark>Silent Valley<\/mark> :"},{"t":"Dongria Kondh vs Vedanta bauxite → SC let gram sabhas decide → <mark>all 12 said no<\/mark>","h":"<mark>Niyamgiri 2013<\/mark> :"},{"t":"exposed illegal iron-ore mining (Shah Commission) → SC cancelled 88 lease renewals (2018)","h":"<mark>Goa Foundation<\/mark> :"},{"t":"NGT 2016 suspended Nyamjang Chhu hydro clearance (black-necked crane site ignored)","h":"<mark>Save Mon Region Federation<\/mark> :"}],"id":"ngos-and-activists-pyq-2024:eg-main","v":"dd85d9","q":"What do NGOs and activists do in EIA, with four examples?"}],"pyq":["<b>2024 Q8 (10 marks):<\/b> What role do environmental NGOs and activists play in influencing Environmental Impact Assessment (EIA) outcomes for major projects in India? Cite four examples with all important details."],"group":"EIA notes"},{"id":"coal-pithead-plants-pyq-2014","subj":"s06","name":"Coal pithead plants (PYQ 2014)","cards":[{"path":[],"roles":["issue"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Plant at the mine (no rail haul) but <mark>pollution piles up in one place<\/mark> (Singrauli, Korba)<\/span><br><span class=\"li\">fly-ash dyke breaches (Sasan 2020)<\/span><br><span class=\"li\">SO₂, NOx, PM, mercury<\/span><\/span>"},{"t":"<span class=\"lst\"><span class=\"li\">heavy water use, hot water discharge<\/span><br><span class=\"li\">forest and farmland lost<\/span><br><span class=\"li\">fluorosis, lung disease<\/span><\/span>","cont":1},{"t":"<span class=\"lst\"><span class=\"li\">2015 emission norms (scrubber deadlines extended → Jul 2025: Category C plants, ~78%, away from big cities and critically polluted areas, exempted from FGD; only stack height)<\/span><br><span class=\"li\"><mark>Fly Ash Notification 2021 (100% use)<\/mark><\/span><br><span class=\"li\">cumulative EIA<\/span><br><span class=\"li\">green belts<\/span><\/span>","cont":1}],"id":"coal-pithead-plants-pyq-2014:issue-main","v":"edf316","q":"Environmental impacts of coal pithead plants, and the rules and fixes?"}],"pyq":["<b>2014 Q15 (12.5 marks):<\/b> Environmental Impact Assessment studies are increasingly undertaken before a project is cleared by the Government. Discuss the environmental impacts of coal-fired thermal plants located at coal pitheads."],"group":"EIA notes"},{"id":"rehabilitation-pyq-2016","subj":"s06","name":"Rehabilitation (PYQ 2016)","cards":[{"path":[],"roles":["issue","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\"><mark>Tribals ~40% of people displaced<\/mark> by projects (Ken-Betwa ~20,000, Hasdeo Arand, Mumbai Coastal Road)<\/span><br><span class=\"li\">land, community ties, livelihood lost<\/span><\/span>"},{"t":"<span class=\"lst\"><span class=\"li\"><mark>RFCTLARR 2013<\/mark>: social impact assessment<\/span><br><span class=\"li\">consent (80% private, 70% PPP)<\/span><br><span class=\"li\">compensation up to 4x rural, 2x urban<\/span><\/span>","cont":1},{"t":"<span class=\"lst\"><span class=\"li\"><mark>land for land<\/mark><\/span><br><span class=\"li\">job or annuity<\/span><br><span class=\"li\">skill training<\/span><br><span class=\"li\">resettle whole village together<\/span><br><span class=\"li\">gram sabha consent (PESA, FRA)<\/span><\/span>","cont":1}],"id":"rehabilitation-pyq-2016:issue-main","v":"78f3a1","q":"Who gets displaced by projects, what they lose, and what RFCTLARR 2013 promises?"}],"pyq":["<b>2016 Q14 (12.5 marks):<\/b> Rehabilitation of human settlements is one of the important environmental impacts which always attracts controversy while planning major projects. Discuss the measures suggested for mitigation of this impact while proposing major developmental projects."],"group":"EIA notes"},{"id":"sdgs","subj":"s06","name":"SDGs","cards":[{"path":[],"roles":["fact"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">17 goals, 169 targets → <mark>only 17% on track<\/mark> (SDR 2025), India 99th<\/span><br><span class=\"li\">~$4 tn a year finance gap → <mark>Sevilla Commitment<\/mark> (FfD4, 2025)<\/span><\/span>"}],"id":"sdgs:fact-main","v":"3d09e8","q":"How are the SDGs doing, India&#x27;s rank, and the finance gap?"}],"group":"EIA notes"}],"pin":{"kw":"<b>ENVIRONMENT<\/b> (keywords to use : circular economy, Resource Decoupling, Extended Producer Responsibility (EPR), Cradle-to-Cradle, Common But Differentiated Responsibilities, Just Transition, Bioremediation: Using microorganisms to clean env, Keystone Species (species on which other depend), Blended Finance (PPP for green capital), Greenwashing, greenium, compensatory afforestation), Phytoremediation (t uses living green plants, to absorb, degrade, or stabilize toxic pollutants, environmental supplement plan ( undertake project to benefit environment because broke 2006 rules)","cm":{"k0":"Airshed = the whole area that shares the same air (e.g. Delhi + Haryana + UP + Punjab for NCR), since pollution doesn't stop at city borders."},"keys":[["PINCH-FC · causes and fixes","<ul class=\"keys\"><li><span class=\"lt\">P<\/span><span>Policy: weak laws, low penalties → better implementation + higher penalties + treat it as a prerequisite, not one more scheme<\/span><\/li><li><span class=\"lt\">I<\/span><span>Innovation + Information: old tech, too little data (few monitors, weak forecasts) → new tech as the norm + sensors, satellites, real-time data<\/span><\/li><li><span class=\"lt\">N<\/span><span>Nature: disasters, inversion, low wind make it worse → forecast-based action + nature-based fixes + plan by nature's units (basin, airshed, landscape)<\/span><\/li><li><span class=\"lt\">C<\/span><span>Community (people at ground level): careless habits (littering, burning, overuse) + people left out or displaced → awareness, behaviour change, community-led action<\/span><\/li><li><span class=\"lt\">H<\/span><span>Human activity + capacity: industry, vehicles, farms, power plants, cities + too few staff and facilities → clean the source + build capacity · rule: households and villagers = C, industry, cities and the state machine = H<\/span><\/li><li><span class=\"lt\">F<\/span><span>Finance: polluting is cheaper, clean tech costs more → blended finance + greening of CSR + circular economy<\/span><\/li><li><span class=\"lt\">C<\/span><span>Collaboration: pollution crosses borders, many agencies → Centre, states, industry and citizens act together<\/span><\/li><li><span><b>Effects<\/b>: Health · Environment · Economy · Governance · Society (poor, children, outdoor workers hit hardest)<\/span><\/li><li><span><b>Schemes<\/b> (same letters): P design flaw · I no outcome data · N ignores the basin, <span class=\"cm\" data-c=\"k0\">airshed or<\/span> aquifer · C community left out · H no staff or capacity · F funds unspent or leaking · C no coordination<\/span><\/li><\/ul>"],["Pollution · how to think","<ul class=\"keys\"><li><span>Impact Thinking Framework: EEH (Environment, Economy, Health) Solutions: Recover, Recycle, Reuse, Finance, Governance Calculation: Green GDP = Net Domestic Product - (Cost of Depletion of Natural Resources + Cost of Degradation of Ecosystem)<\/span><\/li><\/ul>"],["PARFREII · DM solutions","<ul class=\"keys\"><li><span class=\"lt\">P<\/span><span>Preparation through monitoring (safe infrastructure)<\/span><\/li><li><span class=\"lt\">A<\/span><span>Awareness<\/span><\/li><li><span class=\"lt\">R<\/span><span>Risk assessment<\/span><\/li><li><span class=\"lt\">F<\/span><span>Finance<\/span><\/li><li><span class=\"lt\">R<\/span><span>Response + Recovery<\/span><\/li><li><span class=\"lt\">E<\/span><span>Early warning<\/span><\/li><li><span class=\"lt\">I<\/span><span>Inter-agency coordination<\/span><\/li><li><span class=\"lt\">I<\/span><span>Implementation via capacity building<\/span><\/li><li><span>Causes use PINCH-FC (top of Pollution) · Effects: Health · Environment · Economy · Governance · Society<\/span><\/li><\/ul>"],["DM · meaning, cycle, NDMA pillars","<ul class=\"keys\"><li><span>(It is a planned, coordinated effort to reduce risk, build resilience, and protect lives and livelihoods.) (any disaster strategies : PARFREII (preparation thru monitoring (safe infra), awareness, risk assessment , finance, recovery, early warning, inter agency coordination, implementation via capacity building )<\/span><\/li><li><span><b>DM cycle<\/b>: before (prevention, mitigation → preparedness) → during (response) → after (recovery = rehabilitation + reconstruction) → build back better feeds the next round<\/span><\/li><li><span><b>NDMA's 6 pillars<\/b> (every hazard guideline): risk mapping · safe construction and retrofitting · regulation and enforcement · awareness and preparedness (early warning) · capacity building · response. Each NDMA toggle below adds only that hazard's extras<\/span><\/li><\/ul>"]]},"notion":"https://app.notion.com/p/4221111b206d80b0a97fe118421fe6d8","title":"Environment &amp; DM","subtitle":"GS3 · 6 sections · 47 topics · one big card per topic (EIA: 14 cards)","img":{"0":"img/env/00.jpg","1":"img/env/01.jpg","2":"img/env/02.jpg","3":"img/env/03.jpg","4":"img/env/04.jpg","5":"img/env/05.jpg","6":"img/env/06.jpg","7":"img/env/07.jpg","8":"img/env/08.jpg"}}};

<script>
(function(){
"use strict";
let DK="st"; try{ if(DECKS.env&&localStorage.getItem("deckpick.v1")==="env") DK="env"; }catch(e){}
const DECK=DECKS[DK], ENV=DK==="env";
const KEY=ENV?"envdeck.v1":"stdeck.v1";
const CIRC={g:"🟢",y:"🟡",w:"⚪"}, UNIT=ENV?"section":"subject";
const BUILD="updated 28 Nov";
const $=s=>document.querySelector(s);
const SUBJ={}; DECK.subjects.forEach(s=>SUBJ[s.id]=s.name);
const IMG=DECK.img||{};

/* ---------- deck switch: each deck keeps its own place, progress and schedule ---------- */
(function deckbar(){
  const el=$("#deckbar"); if(!DECKS.env){ el.style.display="none"; return; }
  if(ENV) document.title="Environment & DM Flashcards";
  el.querySelectorAll("button").forEach(b=>{ b.classList.toggle("on",b.dataset.d===DK);
    b.onclick=()=>{ if(b.dataset.d===DK) return; try{localStorage.setItem("deckpick.v1",b.dataset.d);}catch(e){} location.reload(); }; });
})();
/* ---------- pinned box (word for word from the notes) ---------- */
const PINKEY=ENV?"envpin.v1":"stpin.v1";
(function pin(){
  const P=DECK.pin, el=$("#pin");
  if(ENV){ $("#pinOne").textContent="Keywords · PINCH-FC · PARFREII";
    $("#pinIn").innerHTML=`<div class="kw">${P.kw}</div>`+(P.keys||[]).map(k=>`<div class="keyh">${k[0]}</div>${k[1]}`).join("")+(P.pf?`<div class="vd">${P.pf}</div>`:""); }
  else{
  $("#pinOne").textContent=P.heads.join(", ");
  $("#pinIn").innerHTML=`<div class="lead">${P.lead}</div><ul>${P.heads.map(h=>`<li>${h}</li>`).join("")}</ul><div class="niche">${P.niche}</div><div class="vd">${P.vd}</div>`;
  }
  let open=null; try{open=localStorage.getItem(PINKEY);}catch(e){}
  el.open=open===null?false:open==="1";
  const PW=ENV?"(min-width:1400px)":"(min-width:1060px)";
  el.addEventListener("toggle",()=>{ if(matchMedia(PW).matches) return; try{localStorage.setItem(PINKEY,el.open?"1":"0");}catch(e){} });
  const wide=()=>{ if(matchMedia(PW).matches) el.open=true; else{ let o=null; try{o=localStorage.getItem(PINKEY);}catch(e){} el.open=o==="1"; } };
  wide(); matchMedia(PW).addEventListener("change",wide);
})();

/* ---------- build cards ---------- */
const cards={}, groups=[];
DECK.topics.forEach(t=>{
  const g={key:t.id,subj:t.subj,name:t.name,ids:[],circle:t.circle||null,pyq:(t.pyq||[]).length};
  t.cards.forEach(c=>{
    const nrow=c.rows.filter(r=>"t" in r).length;
    cards[c.id]={id:c.id,topic:t,payload:c,count:nrow};
    g.ids.push(c.id);
  });
  groups.push(g);
});

/* ---------- state ---------- */
let S=load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.v===1) return s;}catch(e){}
  return {v:1,subj:"all",topic:"all",mode:"order",missed:false,queue:null,pos:0,st:{},back:false};
}
let lastSig=null;
const placeSig=()=>[S.subj,S.topic,S.mode,S.missed,S.pos,S.round,(S.queue||[]).length,(S.queue||[])[0],(S.queue||[])[S.pos]].join("|");
function save(){const sig=placeSig(); if(sig!==lastSig){ if(lastSig!==null){S.at=Date.now(); setTimeout(()=>{try{queueSync();}catch(e){}},0);} lastSig=sig; }
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const isMissed=id=>S.st[id]&&S.st[id].s==="m";
function circOK(g){ if(!ENV||!g.circle) return true; return !(S.circ&&S.circ[g.circle]===false); }   /* topics with no circle always show */
function scopeGroups(){ return groups.filter(g=>(S.subj==="all"||g.subj===S.subj)&&(S.topic==="all"?circOK(g):g.key===S.topic)); }
function filteredGroups(){ return scopeGroups().map(g=>{let ids=g.ids; if(S.missed) ids=ids.filter(isMissed); return {key:g.key,ids};}).filter(g=>g.ids.length); }
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
/* Smart order: weakest first, then cards due for review, new cards mixed in, well-known cards last.
   A known card comes due again after 1, 3, 7, 14, 30 or 60 days, longer the more often you've got it right. */
const DAY=864e5, GAPS=[1,3,7,14,30,60];
function smartQueue(ids){
  const now=Date.now(), weak=[], due=[], fresh=[], later=[];
  ids.forEach(id=>{const o=S.st[id];
    if(!o||!o.s){ fresh.push(id); return; }
    if(o.s==="m"){ weak.push([id,-(o.miss/Math.max(1,o.seen)),o.t||0]); return; }
    const strength=Math.max(1,(o.seen-o.miss)-o.miss), gap=GAPS[Math.min(strength,GAPS.length)-1]*DAY, over=(now-(o.t||0))/gap;
    (over>=1?due:later).push([id,-over]); });
  weak.sort((a,b)=>a[1]-b[1]||a[2]-b[2]); due.sort((a,b)=>a[1]-b[1]); later.sort((a,b)=>a[1]-b[1]);
  const rev=weak.concat(due).map(x=>x[0]), q=[]; let i=0,j=0;
  while(i<rev.length||j<fresh.length){ for(let k=0;k<2&&i<rev.length;k++) q.push(rev[i++]); if(j<fresh.length) q.push(fresh[j++]); }
  S.dueN=q.length; return q.concat(later.map(x=>x[0]));
}
function buildQueue(){
  let gs=filteredGroups(), q;
  if(S.mode==="order"){ q=gs.flatMap(g=>g.ids); }
  else if(S.mode==="topics"){
    gs=shuffle(gs); const miss=gs.filter(g=>g.ids.some(isMissed)), rest=gs.filter(g=>!g.ids.some(isMissed));
    q=miss.concat(rest).flatMap(g=>g.ids);
  } else if(S.mode==="smart"){ q=smartQueue(gs.flatMap(g=>g.ids)); }
  else { const all=shuffle(gs.flatMap(g=>g.ids)); q=all.filter(isMissed).concat(all.filter(i=>!isMissed(i))); }
  if(S.mode!=="smart") S.dueN=null;
  S.queue=q; S.round=1; S.pos=0; S.back=false; save();
}
function validQueue(){return Array.isArray(S.queue)&&S.queue.every(id=>cards[id]);}
if(Array.isArray(S.queue)&&S.queue.length&&!validQueue()){ /* cards removed in a deck update: skip them, keep your place */
  const gone=S.queue.slice(0,S.pos).filter(id=>!cards[id]).length;
  S.queue=S.queue.filter(id=>cards[id]); S.pos=Math.max(0,Math.min(S.pos-gone,S.queue.length));
}
if(S.subj!=="all"&&!SUBJ[S.subj]){S.subj="all";S.topic="all";}
if(S.topic!=="all"&&!groups.some(g=>g.key===S.topic)) S.topic="all";
if(!validQueue()||!S.queue.length) buildQueue();

/* ---------- reveal state ---------- */
let R=null;
function resetReveal(c){
  const rows=c.payload.rows, idx=[]; rows.forEach((r,i)=>{ if("t" in r) idx.push(i); });
  R={id:c.id,idx,steps:idx.map(()=>0),pre:idx.map(()=>false),marks:idx.map(()=>null),flag:idx.map(()=>false)};
  const rec=S.st[c.id], r=rec&&rec.r&&(!rec.v||rec.v===c.payload.v)&&rec.v?rec.r:null;
  if(r&&r.some(x=>x===0)){ R.part=true; r.forEach((x,i)=>{ if(x===1&&i<R.steps.length){ R.steps[i]=1; R.pre[i]=true; } if(x===0&&i<R.steps.length) R.flag[i]=true; }); }
}
const allDone=()=>!R||R.steps.every(s=>s>=1);

/* ---------- render ---------- */
function counts(ids){let k=0,m=0; ids.forEach(id=>{const s=S.st[id]; if(s&&s.s==="k")k++; else if(s&&s.s==="m")m++;}); return {k,m,n:ids.length-k-m,t:ids.length};}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function render(){
  $("#title").innerHTML=DECK.title; $("#subtitle").textContent=DECK.subtitle+" · "+BUILD;
  document.querySelectorAll("#modeSeg button").forEach(b=>b.classList.toggle("on",b.dataset.v===S.mode));
  if(ENV){ document.querySelector(".selrow").style.display="none"; $("#envNav").style.display=""; renderNavBar(); }
  else{
  const ss=$("#subjSel"); ss.innerHTML='<option value="all">All subjects</option>'+DECK.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join(""); ss.value=S.subj;
  const tops=S.subj==="all"?[]:groups.filter(g=>g.subj===S.subj);
  const ts=$("#topicSel"); ts.innerHTML='<option value="all">All topics</option>'+tops.map(g=>`<option value="${g.key}">${esc(g.name.replace(/<[^>]+>/g,""))}</option>`).join(""); ts.value=S.topic; ts.disabled=tops.length<2; ts.style.display=tops.length<2?"none":"";
  }
  const scopeIds=scopeGroups().flatMap(g=>g.ids); const c0=counts(scopeIds);
  $("#nk").textContent=c0.k;$("#nm").textContent=c0.m;$("#nn").textContent=c0.n;
  $("#pk").style.width=(c0.t?c0.k/c0.t*100:0)+"%"; $("#pm").style.width=(c0.t?c0.m/c0.t*100:0)+"%";
  const mt=$("#missTgl"); mt.classList.toggle("on",S.missed); mt.textContent=S.missed?"Missed only ✓":"Missed only"; mt.disabled=!S.missed&&c0.m===0;
  const stage=$("#stage");
  sidePYQ(); if(ENV){ hideTip(); renderHSP(); }
  if(!S.queue.length){ stage.innerHTML=`<div class="card"><div class="done"><h2>No cards here</h2><p>${S.missed?"Nothing is marked missed in this selection.":"Pick another subject or topic."}</p></div></div>`; actions([]); return; }
  if(S.pos>=S.queue.length){ renderDone(stage); return; }
  const c=cards[S.queue[S.pos]];
  if(!R||R.id!==c.id) resetReveal(c);
  const kick=`<div class="kicker"><span>${esc(SUBJ[c.topic.subj])}</span><span>${S.pos+1} / ${S.queue.length}</span></div>`;
  if(!S.back){
    stage.innerHTML=`<div class="card"><div class="front" id="front">${kick}${frontHTML(c)}
      <div class="hint"><span>Recall it first, then tap</span><span>Space</span></div></div></div>`;
    $("#front").onclick=flip; bindStar(c);
    actions([["ghost","‹","prev"],["primary","Show answer","flip"],["ghost","›","next"]]);
  } else {
    stage.innerHTML=`<div class="card back${c.payload.big?" big":""}" id="backcard">${kick}${backHTML(c)}<div class="fliphint">${R.steps.length?(c.payload.big?"Tap a point to open it, then its highlighted word for the hot-spot. Dotted words explain themselves.<br>Forgot an open point? Tap it to turn it red.<br>":"Forgot an open point? Tap it to turn it red. Tap again to undo.<br>"):""}<button class="flipback" id="flipBack">↺ Flip back</button></div></div>`;
    bindRows(); bindStar(c); if(ENV) markHS();
    $("#flipBack").onclick=e=>{e.stopPropagation(); unflip();};
    const done=allDone();
    actions([["ghost","‹","prev"]].concat(R.steps.length&&!done?[["ghost","Show all","all"]]:[]).concat([[anyRed()?"miss sug":"miss","Missed <kbd>1</kbd>","miss"],["got","Got it <kbd>2</kbd>","got"],["ghost","›","next"]]));
    if(anyRed()){const g=document.querySelector('#actions [data-a="got"]'); if(g){g.disabled=true; g.title="A point is red, so this card counts as missed";}}
  }
}
const ROLE={def:["What it is","def"],how:["How it works","how"],use:["Uses & significance","use"],issue:["Challenges","issue"],fix:["Way forward","fix"],gov:["Initiatives","gov"],news:["In the news","news"],fact:["Key facts","fact"],tbl:["Table","tbl"],pic:["Your notes","pic"],eg:["Examples","eg"],cause:["Causes","cause"],effect:["Effects","effect"]};
function titles(c){
  const p=c.payload, path=p.path||[], tn=(ENV&&c.topic.circle?CIRC[c.topic.circle]+" ":"")+c.topic.name;
  let big, crumbs;
  if(p.title){ big=p.title; crumbs=[tn].concat(path); if(crumbs.length>1&&crumbs[crumbs.length-1]===p.title) crumbs.pop(); }
  else if(path.length){ big=path[path.length-1]; crumbs=[tn].concat(path.slice(0,-1)); }
  else { big=tn; crumbs=[]; }
  if(ENV&&c.topic.group) crumbs=[c.topic.group].concat(crumbs);
  return {big,crumbs};
}
function chip(c){
  const p=c.payload;
  const roles=(p.roles||[]).map(r=>`<span class="chip role ${ROLE[r][1]}">${ROLE[r][0]}</span>`).join("");
  const n=p.table?`${c.count} row${c.count===1?"":"s"}`:c.count?`${c.count} point${c.count===1?"":"s"}`+(p.big&&p.hs&&p.hs.length?` · ${p.hs.length} hot-spot${p.hs.length===1?"":"s"}`:""):"picture";
  const q=ENV&&c.topic.pyq&&c.topic.pyq.length?` <button class="star" data-pyq>★ PYQ ${c.topic.pyq.length}</button>`:"";
  return `<span class="chiprow">${roles}<span class="cnt">${n}</span>${q}</span>`;
}
const strip=s=>String(s).replace(/<br>/g," ").replace(/<[^>]+>/g,"").trim();
function cueLine(c){
  const rows=c.payload.rows;
  let secs=rows.filter(r=>"sec" in r).map(r=>r.sec);
  if(!secs.length) secs=rows.filter(r=>r.h&&!r.cont).map(r=>r.h);   /* no headings: Perry's labels are the cue */
  const own=ENV;   /* Environment & DM: never show the answer's first words as a cue */
  if(!secs.length&&!c.payload.table&&!own){ const f=rows.find(r=>"t" in r); if(f){ const w=strip(f.t).split(/\s+/); secs=[esc(w.slice(0,7).join(" "))+(w.length>7?" …":"")]; } }
  if(ENV){ const b=strip(titles(c).big); secs=secs.filter(x=>strip(x)!==b); }
  if(!secs.length) return "";
  const show=secs.slice(0,4).join('<span class="dot"> · </span>')+(secs.length>4?'<span class="dot"> · …</span>':"");
  return `<div class="cueline">${show}</div>`;
}
function frontHTML(c){
  const T=titles(c);
  if(ENV&&c.payload.q){   /* question front: the card's own title moves up into the small line */
    const cr=T.crumbs.concat([T.big]);
    const rd=c.payload.read?`<a class="readn" href="${DECK.notion}" target="_blank" rel="noopener" onclick="event.stopPropagation()">📖 Long notes: give this a quick read in Notion</a>`:"";
    return chip(c)+`<div class="crumb">${cr.join('<span class="sep">›</span>')}</div><div class="ttl q">${c.payload.q}</div>`+rd;
  }
  const crumb=T.crumbs.length?`<div class="crumb">${T.crumbs.join('<span class="sep">›</span>')}</div>`:`<div class="crumb">&nbsp;</div>`;
  return chip(c)+crumb+`<div class="ttl q">${T.big}</div>`+cueLine(c);
}
function backHTML(c){
  const p=c.payload, T=titles(c);
  const crumb=T.crumbs.length?`<div class="topicname">${T.crumbs.join(' › ')}</div>`:"";
  const head=`<div class="backhead">${chip(c)}${crumb}<div class="ttl">${T.big}</div></div>`;
  const th=(p.table&&p.head)?`<div class="headrow">Columns: ${p.head.map(esc).join(" · ")}</div>`:"";
  let k=-1;
  const body=p.rows.map(r=>{
    if("sec" in r) return `<div class="sec${r.tg?" tg":""}">${r.sec}</div>`;
    if("img" in r){ const f=IMG[r.img]; return f?`<div class="pic${c.count?"":" big"}"><img src="${f}" alt="" loading="lazy" onerror="this.parentNode.style.display='none'"></div>`:""; }
    if("video" in r) return `<a class="vid" href="${esc(r.video)}" target="_blank" rel="noopener">▶ Video</a>`;
    k++; return p.big?bigRow(r,k):rowHTML(r,k,!!p.table);
  }).join("");
  const hint=(!R.steps.length||allDone())?"":(p.big&&R.part)?`<div class="recall">Green: known last time · red edge: missed last time. Recall the closed ones.</div>`:R.part?`<div class="recall">Green points: you knew them last time. Recall the closed ones.</div>`:`<div class="recall">Say each point aloud, then tap it to check.</div>`;
  return head+th+hint+`<div class="rows">${body}</div>`;
}
function rowHTML(r,i,tb){
  const st=R.steps[i];
  const firstHidden=R.steps.findIndex(s=>s<1);
  const hc="hd"+(tb?" tb":"");
  if(st===0) return r.h?`<div class="rw s0 ${i===firstHidden?"next":""}${r.cont?" cont":""}" data-i="${i}"><div class="n">${i+1}</div><div class="body hb"><div class="${hc}">${r.h}</div></div></div>`
                       :`<div class="rw s0 ${i===firstHidden?"next":""}${r.cont?" cont":""}" data-i="${i}"><div class="n">${i+1}</div><div class="body" style="--w:${45+((i*37)%40)}%"></div></div>`;
  const h=(r.h?`<div class="${hc}">${r.h}</div>`:"")+`<div class="ln">${r.t}</div>`;
  const cls=(isRed(i)?" fg":(R.pre[i])?" kn":"")+(r.cont?" cont":"");
  return `<div class="rw s2${cls}" data-i="${i}"><div class="n">${i+1}</div><div class="body">${h}</div></div>`;
}
function bigRow(r,i){   /* Environment & DM big card: the letter is the cue, hot-spots and hard words sit inside the point */
  const st=R.steps[i], firstHidden=R.steps.findIndex(s=>s<1);
  const lt=r.lt?`<span class="lt">${r.h}</span>`:"";
  if(st===0) return `<div class="rw s0${i===firstHidden?" next":""}${R.flag[i]?" flag":""}" data-i="${i}"><div class="n"></div>${lt}<div class="body${!r.lt&&r.h?" hb":""}" style="--w:${45+((i*37)%40)}%">${!r.lt&&r.h?`<div class="hd">${r.h}</div>`:""}</div></div>`;
  const cls=(isRed(i)?" fg":(R.pre[i])?" kn":"");
  return `<div class="rw s2${cls}" data-i="${i}"><div class="n"></div>${lt}<div class="body"><div class="ln">${r.t}</div></div></div>`;
}
function bindRows(){
  document.querySelectorAll(".rw").forEach(el=>el.onclick=e=>{ if(e.target.closest("a")) return;
    const hb=e.target.closest(".hs"); if(hb){ e.stopPropagation(); openHS(+hb.dataset.h); return; }
    const cm=e.target.closest(".cm"); if(cm&&el.classList.contains("s2")){ e.stopPropagation(); showTip(cm); return; } const i=+el.dataset.i; if(el.classList.contains("s2")) toggleRed(i); else step(i);});
  document.querySelectorAll(".pic img").forEach(im=>im.onclick=e=>{e.stopPropagation(); $("#lbImg").src=im.src; $("#lightbox").classList.add("on");});
}
$("#lightbox").onclick=()=>$("#lightbox").classList.remove("on");
function curId(){return S.queue[S.pos];}
function isRed(i){return !!(R&&R.marks&&R.marks[i]===0);}
const anyRed=()=>!!(R&&R.steps&&R.steps.some((_,i)=>isRed(i)));
function toggleRed(i){const id=curId(), o=S.st[id]||(S.st[id]={seen:0,miss:0}); const r=(o.r||[]).slice();
  R.marks[i]=R.marks[i]===0?(R.pre[i]?1:null):0; r[i]=R.marks[i]; o.r=r; o.v=cards[id].payload.v; o.t=Date.now(); save(); queueSync(); render();}
function step(i){ if(R.steps[i]<1){R.steps[i]=1; render();
  const target=document.querySelector('.rw[data-i="'+i+'"]'); if(target) target.scrollIntoView({block:'nearest',behavior:'smooth'}); } }
function nextStep(){ const i=R.steps.findIndex(s=>s<1); if(i<0) return false; step(i); return true; }
function showAll(){ R.steps=R.steps.map(()=>1); render(); }
function renderDone(stage){
  const missed=[...new Set(S.queue)].filter(isMissed), rn=S.round||1, tot=new Set(S.queue).size;
  stage.innerHTML=`<div class="card"><div class="done"><div class="kicker" style="justify-content:center"><span>Round ${rn} complete</span></div>
    <h2>${missed.length?missed.length+" of "+tot+" card"+(tot>1?"s":"")+" still missed":"Every card known"}</h2>
    <p>${missed.length?"Go through only the missed cards now, or start a new round.":"Start a new round, or shuffle to test recall out of order."}</p>
    <div class="row">${missed.length?'<button class="btn miss" style="flex:0 0 auto" id="revMiss">Review missed</button>':""}<button class="btn" id="newRound">New round</button></div></div></div>`;
  if(missed.length) $("#revMiss").onclick=()=>{S.queue=shuffle(missed.slice()); S.round=rn+1; S.pos=0; S.back=false; save(); render();};
  $("#newRound").onclick=()=>{buildQueue(); render();};
  actions([]);
}
function actions(list){
  const el=$("#actions"); el.innerHTML=list.map(([cls,txt,act])=>`<button class="btn ${cls}" data-a="${act}">${txt}</button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>act(b.dataset.a));
  const p=el.querySelector('[data-a="prev"]'); if(p) p.disabled=S.pos===0;
}
function act(a){({flip,prev,next,all:showAll,miss:()=>grade("m"),got:()=>grade("k")})[a]();}
function unflip(){const card=document.querySelector(".card"); if(card) card.classList.add("flipping"); setTimeout(()=>{S.back=false; R=null; save(); render();},120);}
function dueCheck(){ if(S.mode==="smart"&&S.dueN&&S.pos===S.dueN&&S.pos<S.queue.length) setTimeout(()=>toast("Due cards done · the rest you know well"),200); }
function next(){ if(S.pos<S.queue.length){S.pos++; dueCheck(); S.back=false; R=null; save(); render(); window.scrollTo(0,0);} }
function flip(){const card=document.querySelector(".card"); if(card) card.classList.add("flipping"); setTimeout(()=>{S.back=true; save(); render();},120);}
function prev(){ if(S.pos>0){S.pos--; S.back=false; R=null; save(); render(); window.scrollTo(0,0);} }
function grade(s){
  if(s==="k"&&anyRed()) s="m";
  const id=S.queue[S.pos], o=S.st[id]||{seen:0,miss:0};
  if(R&&R.steps.length){o.r=R.steps.map((st,i)=>R.marks[i]===0?0:st>0?1:null);}
  o.seen++; o.s=s; o.t=Date.now(); o.v=cards[id].payload.v; if(s==="m") o.miss++;
  S.st[id]=o; S.pos++; dueCheck(); S.back=false; R=null; save(); queueSync(); render(); window.scrollTo(0,0);
}

const SK=ENV?"envsync.v1":"stsync.v1", PFX=ENV?"env-dev-":"st-dev-", GDESC="GS3 flashcards progress (used by the flashcard site; do not delete)";
let SY=null; try{SY=JSON.parse(localStorage.getItem(SK));}catch(e){}
if(!SY){ for(const k of (ENV?["stsync.v1","gs3sync.v3","gs3sync.v1"]:["gs3sync.v3","gs3sync.v1"])){ try{const o=JSON.parse(localStorage.getItem(k)); if(o&&o.token){ SY={token:o.token,gist:o.gist||null,dev:Math.random().toString(36).slice(2,8),dirty:true}; localStorage.setItem(SK,JSON.stringify(SY)); break; }}catch(e){} } }
if(SY&&!SY.dev){SY.dev=Math.random().toString(36).slice(2,8); SY.dirty=false; try{localStorage.setItem(SK,JSON.stringify(SY));}catch(e){}}
const saveSY=()=>{try{SY?localStorage.setItem(SK,JSON.stringify(SY)):localStorage.removeItem(SK);}catch(e){}};
function toCompact(st){const o={}; Object.entries(st).forEach(([id,x])=>{ if(x.s||(x.r&&x.r.some(v=>v===0||v===1))) o[id]=[x.s||"",x.seen||0,x.miss||0,x.t||0,(x.r||[]).map(v=>v===1?"1":v===0?"0":"_").join(""),x.v||""]; }); return o;}
function fromCompact(c){const out={}; Object.entries(c||{}).forEach(([id,a])=>{const o={seen:a[1],miss:a[2]}; if(a[0]) o.s=a[0]; if(a[3]) o.t=a[3]; if(a[4]) o.r=[...a[4]].map(ch=>ch==="1"?1:ch==="0"?0:null); if(a[5]) o.v=a[5]; out[id]=o;}); return out;}
function mergeIn(data){
  const rz=data.resetAt||0;
  if(rz>(S.resetAt||0)){ Object.keys(S.st).forEach(id=>{ if((S.st[id].t||0)<rz) delete S.st[id]; }); S.resetAt=rz; }
  Object.entries(fromCompact(data.st)).forEach(([id,o])=>{ if((o.t||0)<(S.resetAt||0)) return; const l=S.st[id];
    if(!l||(o.t||0)>(l.t||0)||(!(o.t||l.t)&&(o.seen||0)>(l.seen||0))) S.st[id]=o; });
  const a=data.at;
  if(a&&a.t>(S.at||0)&&Array.isArray(a.queue)){ const q=a.queue.filter(id=>cards[id]);
    if(q.length){ const cur=a.queue[a.pos]; let pos=q.indexOf(cur); if(pos<0) pos=Math.min(a.pos,q.length);
      const moved=JSON.stringify([S.subj,S.topic,S.queue&&S.queue[S.pos]])!==JSON.stringify([a.subj,a.topic,cur]);
      Object.assign(S,{subj:a.subj||"all",topic:a.topic||"all",mode:a.mode,missed:!!a.missed,queue:q,pos,round:a.round||1,dueN:a.dueN,back:false,at:a.t}); R=null; lastSig=placeSig();
      if(moved) setTimeout(()=>toast("Continuing from your other device"),300); } }
  save();
}
async function gh(path,opt){opt=opt||{};
  const r=await fetch("https://api.github.com"+path,{cache:"no-store",method:opt.method||"GET",body:opt.body?JSON.stringify(opt.body):undefined,
    headers:Object.assign({Authorization:"Bearer "+SY.token,Accept:"application/vnd.github+json"},opt.body?{"Content-Type":"application/json"}:{})});
  if(!r.ok){const e=new Error("HTTP "+r.status); e.status=r.status; throw e;} return r.json();}
const myFile=()=>PFX+SY.dev+".json";
async function readDocs(g){ const out=[];
  for(const [name,f] of Object.entries(g.files||{})){ if(!(name.startsWith(PFX)&&name.endsWith(".json"))) continue;
    try{ const txt=f.truncated?await (await fetch(f.raw_url,{cache:"no-store"})).text():f.content; const d=JSON.parse(txt); d._own=(name===myFile()); out.push(d); }catch(e){} }
  return out; }
function newestOther(docs){ let best=null; docs.forEach(d=>{ if(!d._own&&d.at&&Array.isArray(d.at.queue)&&(!best||d.at.t>best.t)) best=d.at; }); return best; }
async function findGist(){
  for(let p=1;p<=5;p++){const list=await gh("/gists?per_page=100&page="+p); const g=list.find(x=>x.description===GDESC); if(g) return g.id; if(list.length<100) break;}
  const g=await gh("/gists",{method:"POST",body:{description:GDESC,public:false,files:{[myFile()]:{content:JSON.stringify({v:1,resetAt:S.resetAt||0,st:{}})}}}}); return g.id;
}
let syncing=false, again=false, st8="", sTimer=null;
function syncLabel(t){st8=t; const b=$("#syncBtn"); if(b) b.textContent=t;}
const hhmm=d=>d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
let edits=0;
function queueSync(){ if(!SY) return; edits++; SY.dirty=true; saveSY(); clearTimeout(sTimer); syncLabel("Saving…"); sTimer=setTimeout(syncNow,2500); }
let remoteAt=null;
async function syncNow(){
  if(!SY) return; if(syncing){again=true; return;} syncing=true; clearTimeout(sTimer);
  try{
    if(!SY.gist){SY.gist=await findGist(); saveSY();}
    const g=await gh("/gists/"+SY.gist); const docs=await readDocs(g); remoteAt=newestOther(docs);
    if(!docs.some(d=>d._own)) SY.dirty=true;
    const rz=Math.max(0,...docs.map(d=>d.resetAt||0));
    const before=JSON.stringify(S.st)+placeSig();
    docs.forEach(d=>mergeIn(Object.assign({},d,{resetAt:rz,at:d._own?null:d.at})));
    if(JSON.stringify(S.st)+placeSig()!==before){ if(R&&!S.back) R=null; render(); }
    const e0=edits;
    if(SY.dirty) await gh("/gists/"+SY.gist,{method:"PATCH",body:{files:{[myFile()]:{content:JSON.stringify({v:1,resetAt:S.resetAt||0,st:toCompact(S.st),at:{t:S.at||0,dev:SY.dev,subj:S.subj,topic:S.topic,mode:S.mode,missed:S.missed,queue:S.queue,pos:S.pos,round:S.round,dueN:S.dueN}})}}}});
    if(SY.dirty&&edits===e0) SY.dirty=false;
    SY.last=Date.now(); saveSY(); syncLabel("Synced "+hhmm(new Date()));
  }catch(e){
    if(e.status===404&&SY.gist){SY.gist=null; saveSY(); again=true;}
    syncLabel(e.status===401?"Sync key stopped working: tap to fix":"Not synced: tap to retry");
  }
  syncing=false; sTimer=null; if(again){again=false; syncNow();}
}

const closeSync=()=>$("#smodal").classList.remove("on");

   <ol><li>Open <a href="https://github.com/settings/tokens/new?scopes=gist&description=Flashcards%20sync" target="_blank" rel="noopener">this GitHub page</a> and sign in.</li>
   <li>Set <b>Expiration</b> to <b>No expiration</b>. Leave only <b>gist</b> ticked.</li>
   <li>Press <b>Generate token</b> at the bottom and copy the key (starts with <b>ghp_</b>).</li>
   <li>Paste it below. Do this once on each device, using the same key. (If the GS3 deck already syncs on this device, this deck picks the key up by itself.)</li></ol>

   ${err?`<div class="err">${err}</div>`:""}
   <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="sClose">Cancel</button><button class="btn got" style="flex:0 0 auto" id="sGo">Connect</button></div>`);

  };

function jumpTo(a){ const q=a.queue.filter(id=>cards[id]); if(!q.length) return; let pos=q.indexOf(a.queue[a.pos]); if(pos<0) pos=Math.min(a.pos,q.length-1);
  Object.assign(S,{subj:a.subj||"all",topic:a.topic||"all",mode:a.mode,missed:!!a.missed,queue:q,pos,round:a.round||1,dueN:a.dueN,back:false}); R=null; save(); render(); window.scrollTo(0,0); toast("Moved to card "+(pos+1)); }

}

$("#resetBtn").onclick=()=>$("#modal").classList.add("on");
$("#mCancel").onclick=()=>$("#modal").classList.remove("on");
$("#mOk").onclick=()=>{const keep={subj:S.subj,topic:S.topic,mode:S.mode}; S={v:1,...keep,missed:false,queue:null,pos:0,st:{},back:false,resetAt:Date.now()}; queueSync(); buildQueue(); R=null; $("#modal").classList.remove("on"); render(); toast("Progress reset");};
let tt; function toast(m){const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),1600);}
document.addEventListener("keydown",e=>{
  if($("#lightbox").classList.contains("on")){ if(e.key==="Escape"||e.key===" "||e.key==="Enter"){e.preventDefault(); $("#lightbox").classList.remove("on");} return; }
  if(e.key==="Escape"){ hideTip(); if($("#hmodal").classList.contains("on")){ $("#hmodal").classList.remove("on"); return; } }
  if($("#hmodal").classList.contains("on")) return;
  if($("#modal").classList.contains("on")||$("#pmodal").classList.contains("on")||$("#smodal").classList.contains("on")||$("#qmodal").classList.contains("on")) return;
  if(e.target.tagName==="SELECT"||e.target.tagName==="INPUT"||e.target.tagName==="SUMMARY") return;
  if(!S.queue.length||S.pos>=S.queue.length) return;
  if(e.key===" "||e.key==="Enter"){e.preventDefault(); if(!S.back) flip(); else if(!nextStep()) unflip(); }
  else if(S.back&&(e.key==="1"||e.key==="m")) grade("m");
  else if(S.back&&(e.key==="2"||e.key==="g")) grade("k");
  else if(S.back&&e.key==="a") showAll();
  else if(e.key==="ArrowLeft") prev();
  else if(e.key==="ArrowRight") next();
});
/* ---------- Environment & DM: section list (tap a section to open its topics), circle filter, PYQ star ---------- */
let OPEN=null;
function navLabel(){ if(S.topic!=="all"){ const g=groups.find(x=>x.key===S.topic); if(g) return (g.circle?CIRC[g.circle]+" ":"")+strip(g.name); }
  return S.subj==="all"?"All sections":SUBJ[S.subj]; }
function renderNavBar(){
  $("#navLbl").textContent=navLabel();
  document.querySelectorAll("#circRow button").forEach(b=>b.classList.toggle("on",!(S.circ&&S.circ[b.dataset.c]===false)));
  if($("#navPanel").classList.contains("on")) renderNav();
}
function renderNav(){
  const all=groups.filter(circOK).reduce((n,g)=>n+g.ids.length,0);
  const rows=[`<div class="nv all${S.subj==="all"?" cur":""}" data-a="all"><span>All sections</span><small>${all} cards</small></div>`];
  DECK.subjects.forEach(s=>{
    const ts=groups.filter(g=>g.subj===s.id&&circOK(g)), open=OPEN===s.id;
    rows.push(`<div class="nv sec${open?" open":""}${S.subj===s.id&&S.topic==="all"?" cur":""}" data-s="${s.id}"><span>${esc(s.name)}</span><small>${ts.length} topics</small><i>${open?"▲":"▼"}</i></div>`);
    if(open) rows.push(`<div class="nv tp whole${S.subj===s.id&&S.topic==="all"?" cur":""}" data-w="${s.id}"><span>Whole section</span><small>${ts.reduce((n,g)=>n+g.ids.length,0)}</small></div>`);
    if(open) ts.forEach(g=>rows.push(`<div class="nv tp${S.topic===g.key?" cur":""}" data-t="${g.key}"><span>${g.circle?CIRC[g.circle]+" ":""}${esc(strip(g.name))}${g.pyq?' <b class="st">★</b>':""}</span><small>${g.ids.length}</small></div>`));
  });
  const p=$("#navPanel"); p.innerHTML=rows.join("");
  p.querySelectorAll(".nv").forEach(el=>el.onclick=e=>{ e.stopPropagation();
    if(el.dataset.a){ closeNav(); S.subj="all"; S.topic="all"; rebuild("All sections"); }
    else if(el.dataset.s){ OPEN=OPEN===el.dataset.s?null:el.dataset.s; renderNav();   /* tap opens the topics, tap again folds them */
      if(OPEN) p.querySelector('[data-s="'+OPEN+'"]').scrollIntoView({block:"nearest"}); }
    else if(el.dataset.w){ closeNav(); S.subj=el.dataset.w; S.topic="all"; rebuild(SUBJ[S.subj]); }
    else if(el.dataset.t){ const g=groups.find(x=>x.key===el.dataset.t); closeNav(); S.subj=g.subj; S.topic=g.key; rebuild(strip(g.name)); }
  });
}
function closeNav(){ $("#navPanel").classList.remove("on"); }
if(ENV){
  $("#navBtn").onclick=e=>{ e.stopPropagation(); const p=$("#navPanel"); if(p.classList.contains("on")){ closeNav(); return; }
    OPEN=S.subj==="all"?null:S.subj; renderNav(); p.classList.add("on"); };
  document.addEventListener("click",e=>{ if(!e.target.closest("#envNav")) closeNav(); });
  document.querySelectorAll("#circRow button").forEach(b=>b.onclick=()=>{ const c=b.dataset.c; S.circ=Object.assign({g:true,y:true,w:true},S.circ||{});
    if(S.circ[c]&&["g","y","w"].filter(k=>S.circ[k]).length===1){ toast("Keep at least one"); return; }
    S.circ[c]=!S.circ[c]; rebuild("Showing "+["g","y","w"].filter(k=>S.circ[k]).map(k=>CIRC[k]).join(" ")); });
}
const pyqHTML=t=>`<h3>★ PYQs · ${esc(strip(t.name))}</h3><ul class="pq">${t.pyq.map(q=>`<li>${q}</li>`).join("")}</ul>`;
const WIDEQ="(min-width:1400px)";
function bindStar(c){ document.querySelectorAll("[data-pyq]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); openPYQ(c.topic); }); }
function openPYQ(t){
  if(matchMedia(WIDEQ).matches){ S.pyqSide=true; save(); sidePYQ(); return; }
  $("#qbox").innerHTML=pyqHTML(t)+`<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn ghost" id="qClose">Close</button></div>`;
  $("#qmodal").classList.add("on"); $("#qClose").onclick=()=>$("#qmodal").classList.remove("on");
}
function sidePYQ(){
  const el=$("#pyqSide"); if(!ENV){ el.style.display="none"; return; }
  const c=S.queue&&S.pos<S.queue.length?cards[S.queue[S.pos]]:null, t=c&&c.topic;
  const show=!!(S.pyqSide!==false&&matchMedia(WIDEQ).matches&&t&&t.pyq&&t.pyq.length);
  el.style.display=show?"block":"none"; if(!show) return;
  el.innerHTML=`<button class="x" id="qx" aria-label="Close">×</button>`+pyqHTML(t);
  $("#qx").onclick=()=>{ S.pyqSide=false; save(); sidePYQ(); };
}
$("#qmodal").onclick=e=>{ if(e.target.id==="qmodal") $("#qmodal").classList.remove("on"); };
matchMedia(WIDEQ).addEventListener("change",sidePYQ);
/* ---------- Environment & DM: hot-spot panel (right) / bottom sheet (phone), tap-to-explain words, left column ---------- */
let HSI=null, HSCARD=null;
const HSWIDE="(min-width:1060px)";
function curBig(){ const c=S.queue&&S.pos<S.queue.length?cards[S.queue[S.pos]]:null; return c&&c.payload.big?c:null; }
function hsHTML(c,i){ const h=c.payload.hs[i]; return `<div class="from">${strip(c.topic.name)} · hot-spot</div><h3>${h.t}</h3><div class="hsb">${h.b}</div>`; }
function openHS(i){ const c=curBig(); if(!c) return; hideTip(); HSI=i; HSCARD=c.id;
  if(matchMedia(HSWIDE).matches){ renderHSP(); const el=$("#hsp"); el.scrollTop=0; }
  else{ $("#hbox").innerHTML=hsHTML(c,i)+`<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn ghost" id="hClose">Close</button></div>`;
    $("#hmodal").classList.add("on"); $("#hClose").onclick=()=>$("#hmodal").classList.remove("on"); bindTips($("#hbox")); bindPics($("#hbox")); }
  document.querySelectorAll(".hs").forEach(b=>b.classList.toggle("on",+b.dataset.h===i));
}
function renderHSP(){
  const el=$("#hsp"); if(!ENV) return;
  const c=curBig(), show=!!(c&&S.back);
  el.classList.toggle("on",show); if(!show){ el.innerHTML=""; return; }
  if(HSCARD!==c.id){ HSI=null; HSCARD=c.id; }
  el.innerHTML=HSI===null?`<div class="from">Hot-spots</div><div class="empty">Open a point, then tap its highlighted word. The hot-spot opens here.<br><br>This card has ${c.payload.hs.length}.</div>`:hsHTML(c,HSI);
  bindTips(el); bindPics(el);
}
function markHS(){ document.querySelectorAll(".rows .hs").forEach(b=>b.classList.toggle("on",+b.dataset.h===HSI)); bindTips(document.querySelector(".rows")||document.body); }
function bindPics(root){ root.querySelectorAll(".pic img").forEach(im=>im.onclick=e=>{e.stopPropagation(); $("#lbImg").src=im.src; $("#lightbox").classList.add("on");}); }
function bindTips(root){ root.querySelectorAll(".cm").forEach(x=>x.onclick=e=>{ e.stopPropagation(); showTip(x); }); }
let TIPEL=null;
function showTip(x){ const c=curBig(), src=x.closest("#pin")?(DECK.pin||{}).cm:(c&&c.payload.cm); const tx=src&&src[x.dataset.c]; if(!tx) return;
  const t=$("#tip"); if(TIPEL===x&&t.classList.contains("on")){ hideTip(); return; }
  TIPEL=x; t.innerHTML=tx; t.classList.add("on");
  const r=x.getBoundingClientRect(), w=t.offsetWidth, h=t.offsetHeight;
  let left=Math.min(Math.max(12,r.left),window.innerWidth-w-12), top=r.bottom+6; if(top+h>window.innerHeight-90) top=Math.max(8,r.top-h-6);
  t.style.left=left+"px"; t.style.top=top+"px"; }
function hideTip(){ $("#tip").classList.remove("on"); TIPEL=null; }
if(ENV){
  document.body.classList.add("env");
  document.addEventListener("click",e=>{ if(!e.target.closest(".cm")) hideTip(); });
  window.addEventListener("scroll",hideTip,{passive:true}); $("#hsp").addEventListener("scroll",hideTip,{passive:true}); $("#hbox").addEventListener("scroll",hideTip,{passive:true});
  $("#hmodal").onclick=e=>{ if(e.target.id==="hmodal") $("#hmodal").classList.remove("on"); };
  const pinHome=$("#pin").previousElementSibling, place=()=>{ const lc=$("#leftcol");
    if(matchMedia(WIDEQ).matches){ lc.appendChild($("#pyqSide")); lc.appendChild($("#pin")); }
    else{ pinHome.after($("#pin")); document.body.appendChild($("#pyqSide")); } };
  place(); matchMedia(WIDEQ).addEventListener("change",place); bindTips($("#pinIn"));
  $("#pin").addEventListener("scroll",hideTip,{passive:true}); $("#leftcol").addEventListener("scroll",hideTip,{passive:true});
  matchMedia(HSWIDE).addEventListener("change",()=>{ $("#hmodal").classList.remove("on"); renderHSP(); });
}
$("#progBtn").textContent="Progress by "+UNIT;
render();
})();
</script>
</body>
</html>
