<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S&amp;T Flashcards</title>
<style>

:root{
  --bg:#f4f2ed; --card:#ffffff; --ink:#1c1c1e; --ink2:#55565c; --ink3:#8a8b91;
  --line:#e6e3dc; --strip:#eeebe4; --strip2:#e4e0d7;
  --accent:#2f4bb5; --accent-soft:#e8ecfa;
  --for:#2b7a58; --for-soft:#e5f2ec;
  --against:#b0502a; --against-soft:#f8ebe4;
  --value:#6b4fae; --value-soft:#efeaf8;
  --define:#3f5568; --define-soft:#e8edf1;
  --data:#8a6516; --data-soft:#f6efdc;
  --say:#2f4bb5; --say-soft:#e8ecfa;
  --draw:#0f766e; --draw-soft:#e1f2ef;
  --fig:#1c1c1e; --fig-bg:#f3e7c4;
  --warn:#9a6a00;
  --good:#2b7a58; --bad:#b0502a;
  --shadow:0 1px 2px rgba(20,20,30,.05),0 8px 28px rgba(20,20,30,.07);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121315; --card:#1b1d20; --ink:#ececee; --ink2:#b3b5bb; --ink3:#7f828a;
    --line:#2b2e33; --strip:#24272c; --strip2:#2c3036;
    --accent:#8ea2f2; --accent-soft:#232a44;
    --for:#6cc79e; --for-soft:#1c2e27;
    --against:#ec9a76; --against-soft:#33231c;
    --value:#b7a2ee; --value-soft:#2a2440;
    --define:#a9bccb; --define-soft:#232a30;
    --data:#e2bd67; --data-soft:#30291a;
    --say:#8ea2f2; --say-soft:#232a44;
    --draw:#5fd0c0; --draw-soft:#1a2e2b;
    --fig:#f4ead0; --fig-bg:#4a3f22;
    --warn:#e2bd67;
    --good:#6cc79e; --bad:#ec9a76;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus{outline:none}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rw,.cue{scroll-margin-bottom:120px;scroll-margin-top:16px}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom))}

/* header */
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:4px 2px 14px}
header h1{font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:.2px;margin:0}
header .sub{font-size:13px;color:var(--ink3)}
.controls{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--strip);border-radius:10px;padding:3px;gap:2px;flex:1 1 auto}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 10px;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
select{font:inherit;font-size:13.5px;border:0;background:var(--strip);color:var(--ink);border-radius:10px;padding:8px 10px}
.progress{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink3);margin:2px 2px 0}
.bar{flex:1;height:5px;border-radius:5px;background:var(--strip);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .k{background:var(--good)} .bar .m{background:var(--bad)}
.legend b{color:var(--ink2);font-weight:600}

/* card */
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line);padding:22px 22px 18px;min-height:340px;position:relative;transition:transform .18s ease,opacity .18s ease}
.card.flipping{transform:scale(.985);opacity:.4}
.kicker{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:14px}
.front{display:flex;flex-direction:column;min-height:290px;cursor:pointer}
.front .ttl{font-family:var(--serif);font-size:30px;line-height:1.2;font-weight:600;margin:28px 0 14px}
.front .plain{font-family:var(--serif);font-size:24px;line-height:1.35;margin:26px 0 14px}
.front .plain:before{content:"“"} .front .plain:after{content:"”"}
.front .hint{margin-top:auto;font-size:13px;color:var(--ink3);display:flex;justify-content:space-between;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650;letter-spacing:.03em;padding:4px 10px;border-radius:999px;width:max-content}
.chip.define{color:var(--define);background:var(--define-soft)}
.chip.for{color:var(--for);background:var(--for-soft)}
.chip.against{color:var(--against);background:var(--against-soft)}
.chip.value{color:var(--value);background:var(--value-soft)}
.chip.data{color:var(--data);background:var(--data-soft)}
.chip.say{color:var(--say);background:var(--say-soft)}
.chip.draw{color:var(--draw);background:var(--draw-soft)}
.dg{position:relative;margin:6px 0 4px;padding:4px 0}
.dg .lv{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:0 0 30px}
.dg .lv:last-of-type{margin-bottom:4px}
.dg .nd{background:var(--card);border:1.5px solid var(--draw);color:var(--ink);border-radius:10px;padding:7px 11px;font-size:14px;line-height:1.3;text-align:center;max-width:46%;position:relative;z-index:1;animation:in .25s ease}
.dg .lv.one .nd{max-width:80%}
.dg .lv.many{flex-wrap:nowrap;gap:6px}
.dg .lv.many .nd{flex:1 1 0;max-width:none;font-size:12.5px;padding:6px 5px}
.dg svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.dg svg path{fill:none;stroke:var(--ink3);stroke-width:1.4}
.dg svg text{font-size:11px;fill:var(--ink2);font-family:var(--sans)}
.drawhint{font-size:12.5px;color:var(--ink3);margin:2px 0 10px}
.subtitle{font-size:14px;color:var(--ink2);margin-top:6px}
.topicname{font-size:13px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-top:22px}
.backhead .topicname{margin-top:4px}
.front .ttl.q{margin-top:8px;font-size:27px}
.draft{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.chiprow{display:flex;align-items:center;gap:8px;width:max-content}

.backhead{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.backhead .ttl{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.25}
.deftext{font-size:17px;line-height:1.6}

/* rows */
.rows{display:flex;flex-direction:column;gap:8px}
.rw{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:10px 12px;background:transparent;border:1px solid transparent;transition:background .2s}
.rw .n{flex:0 0 24px;height:24px;border-radius:50%;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;background:var(--strip2);color:var(--ink2);margin-top:1px;font-variant-numeric:tabular-nums}
.rw .body{flex:1;min-width:0}
.rw.s0{background:var(--strip);cursor:pointer}
.rw.s0 .body{height:24px;border-radius:6px;position:relative;overflow:hidden}
.rw.s0 .body:after{content:"";position:absolute;left:0;top:7px;height:10px;border-radius:5px;background:var(--strip2);width:var(--w,70%)}
.rw.s1{cursor:pointer;border-color:var(--line)}
.rw.s1 .more{margin-top:6px;height:8px;width:55%;border-radius:4px;background:var(--strip)}
.rw.s2{border-color:var(--line)}
.rw.s2{cursor:pointer}
.rw.fg{background:color-mix(in srgb,var(--bad) 8%,transparent);border-color:color-mix(in srgb,var(--bad) 32%,var(--line))}
.rw.kn{background:color-mix(in srgb,var(--good) 8%,transparent);border-color:color-mix(in srgb,var(--good) 26%,var(--line))}
.rw.kn .body{opacity:.6}
.btn.miss.sug{background:color-mix(in srgb,var(--bad) 10%,var(--card));border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.sync input{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);margin:0 0 12px}
.sync ol{margin:0 0 14px;padding-left:20px;font-size:14px;color:var(--ink2);line-height:1.5}
.sync a{color:var(--accent)}
.sync .err{color:var(--bad);font-size:13.5px;margin:-4px 0 12px}
.sync textarea{width:100%;height:70px;font-size:11px;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--bg);color:var(--ink2);margin:0 0 12px;resize:none}
.sync .row{gap:8px;flex-wrap:wrap}
.lbl{font-weight:650;font-size:16px;line-height:1.35;animation:in .22s ease}
.mean{font-size:13px;line-height:1.45;color:var(--ink3);margin-top:5px;animation:in .25s ease}
.ln{font-size:15px;line-height:1.55;color:var(--ink2);margin-top:4px;animation:in .25s ease}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;animation:in .25s ease}
.src{font-size:11.5px;color:var(--ink3);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.unl{font-size:11.5px;color:var(--ink3);font-style:italic}
.fix{font-size:14.5px;margin-top:6px;color:var(--for);animation:in .25s ease}
.fix:before{content:"→ ";font-weight:700}
.note{font-size:12.5px;margin-top:6px;color:var(--warn);animation:in .25s ease}
.note:before{content:"⚑ "}
.fig{font-variant-numeric:tabular-nums;font-weight:650;color:var(--fig);background:var(--fig-bg);padding:0 4px;border-radius:4px;white-space:nowrap}
.rw.s0.next{outline:2px solid var(--accent-soft)}
@keyframes in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

.recall{font-size:12.5px;color:var(--ink3);margin:2px 2px 10px}
.cue{margin-top:16px;border-radius:12px;background:var(--accent-soft);padding:12px 14px;animation:in .35s ease}
.cue .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.cue .t{font-family:var(--serif);font-size:17px;line-height:1.45;margin-top:3px}
.cue .h{font-size:13px;letter-spacing:.04em;color:var(--ink2);margin-top:6px;font-weight:600}

/* say card back */
.term{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.2;margin:4px 0 8px;color:var(--say)}
.meaning{font-size:17px;line-height:1.55}
.exam{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.exam .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:4px}
.exam .t{font-size:16px;line-height:1.55}

/* action bar */
.actions{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
.actions .in{max-width:680px;margin:0 auto;display:flex;gap:6px}
.btn{white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;font-size:15px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--ink2);flex:0 0 auto}
.btn.primary{flex:1;background:var(--ink);color:var(--card);border-color:var(--ink)}
.btn.miss{flex:1;color:var(--bad)}
.btn.got{flex:1;color:var(--good)}
.btn:disabled{opacity:.35;cursor:default}
.btn kbd{font:inherit;font-size:11px;opacity:.5;margin-left:6px;font-weight:500}

.card.back{cursor:pointer}
.fliphint{margin-top:16px;font-size:12.5px;color:var(--ink3);text-align:center}
.flipback{margin-top:10px;font:inherit;font-size:13px;color:var(--ink2);background:none;border:1px solid var(--line,#ddd);border-radius:999px;padding:6px 14px;cursor:pointer}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12px;color:var(--ink3);gap:8px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--ink3);text-decoration:underline;text-underline-offset:3px;font-size:12px;padding:4px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--card);font-size:13px;padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:.95}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:8;padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--card);border-radius:16px;padding:20px;max-width:360px;width:100%;box-shadow:var(--shadow)}
.modal h3{margin:0 0 6px;font-family:var(--serif)}
.modal p{margin:0 0 16px;color:var(--ink2);font-size:14.5px}
.modal .row{justify-content:flex-end}
.done{text-align:center;padding:30px 10px}
.done h2{font-family:var(--serif);margin:10px 0 6px}
.done p{color:var(--ink2);margin:0 0 20px}
.done .row{justify-content:center}
@media (max-width:520px){
  .btn kbd{display:none}
  .btn{padding:13px 10px}
  .btn.ghost{padding:13px 12px}
}
@media (max-width:420px){
  .front .ttl{font-size:26px}.front .plain{font-size:21px}.term{font-size:26px}
  .card{padding:18px 16px 16px}.seg button{padding:7px 6px;font-size:12.5px}
}

.selrow{display:flex;gap:8px}
.selrow select{flex:1 1 0;min-width:0;text-overflow:ellipsis}
.toggle{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;white-space:nowrap}
.toggle.on{background:var(--against-soft);color:var(--bad);border-color:transparent}
.toggle:disabled{opacity:.4;cursor:default}
.progress .legend{white-space:nowrap}
.sheet h3{margin:0 0 12px;font-family:var(--serif)}
.pl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.pl:first-of-type{border-top:0}
.pl .nm{font-size:14px;font-weight:600}
.pl .nm small{display:block;font-weight:400;color:var(--ink3);font-size:12px}
.pl .ct{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;text-align:right}
.pl .bar{grid-column:1 / -1}
.modal .box.wide{max-width:440px;max-height:82vh;overflow:auto}
.chip .ct{opacity:.7;font-weight:600}
.ktitle{font-size:13px;color:var(--ink2);margin-top:2px}
.rw .hd{font-size:11px;letter-spacing:.5px;text-transform:uppercase;font-weight:700;color:var(--against);margin-bottom:2px}
.rw.s0 .body.hb{height:auto}
.rw.s0 .body.hb:after{display:none}
.rw.s0 .body.hb .hd{margin:3px 0 0}
.rw .hd.pb{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:600;color:var(--ink3)}
.heads{display:flex;gap:6px;margin-top:12px}
.heads span{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--ink3);background:var(--strip2);opacity:.45}
.heads span.on{opacity:1;color:var(--against);background:var(--against-soft)}

/* ---------- S&T additions ---------- */
:root{--st:#0f6e78;--st-soft:#e0f0f1;--sec:#55565c}
@media (prefers-color-scheme: dark){:root{--st:#62c6cf;--st-soft:#17302f;--sec:#b3b5bb}}
.chip.st{color:var(--st);background:var(--st-soft)}
.chip.tbl{color:var(--data);background:var(--data-soft)}
.crumb{font-size:12.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-top:22px;line-height:1.4}
.crumb .sep{opacity:.6;margin:0 4px}
.front .ttl.q{margin-top:6px}
.partline{font-size:13.5px;color:var(--ink2);margin-top:2px}
.partline b{font-weight:600}
.sec{font-size:13px;font-weight:700;color:var(--sec);letter-spacing:.01em;margin:10px 2px 0;line-height:1.4}
.sec:first-child{margin-top:0}
.rw .hd{color:var(--st);text-transform:none;letter-spacing:0;font-size:14px;font-weight:650}
.rw .hd.tb{color:var(--data)}
.rw.s0 .body.hb .hd{margin:1px 0 0}
.ln .th{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink3);margin-right:4px}
.pic{margin:6px 0 2px;text-align:center}
.pic.big img{max-height:none}
.pic img{max-width:100%;max-height:420px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:zoom-in}
.vid{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;margin:4px 2px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;z-index:20;padding:16px;cursor:zoom-out}
.lightbox.on{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;background:#fff}
.lst{display:block}.lst>br{display:none}
.lst .li{display:block;position:relative;padding:2px 0 2px 14px}
.lst .li:before{content:"";position:absolute;left:2px;top:.78em;width:5px;height:5px;border-radius:50%;background:var(--ink3)}
.lst .li2{margin-left:16px}
.headrow{font-size:12px;color:var(--ink3);margin:-4px 0 10px}

/* pinned issue heads from the page title */
.pin{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin:0 0 14px;font-size:14px;line-height:1.5}
.pin summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;gap:8px;align-items:baseline}
.pin summary::-webkit-details-marker{display:none}
.pin summary .one{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.pin summary .tw{flex:0 0 auto;font-size:12px;color:var(--ink3)}
.pin[open] summary .one{display:none} .pin[open] summary{justify-content:flex-end}
.pin[open] summary .tw:after{content:"hide"} .pin:not([open]) summary .tw:after{content:"show"}
.pin .in{padding:0 16px 14px}
.pin .lead{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.35;color:var(--ink)}
.pin ul{margin:8px 0 0;padding:0;list-style:none}
.pin li{padding:6px 0 6px 14px;border-top:1px solid var(--line);position:relative;font-size:15px;font-weight:600;color:var(--ink)}
.pin li:first-child{border-top:0}
.pin li:before{content:"";position:absolute;left:0;top:14px;width:6px;height:6px;border-radius:50%;background:var(--st)}
.pin .niche{margin-top:8px;padding:9px 11px;border-radius:10px;background:var(--st-soft);color:var(--ink);font-size:14px}
.pin .vd{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink3);line-height:1.5}
.pin .vd b{color:var(--ink2)}
/* wide screens: the box sits beside the card and stays on screen */
@media (min-width:1060px){
  .wrap{max-width:none;width:680px;margin-left:calc(50vw - 530px);margin-right:0}
  .actions .in{max-width:648px;margin-left:calc(50vw - 530px)}
  .pin{position:fixed;top:64px;left:calc(50vw + 190px);width:340px;max-height:calc(100vh - 150px);overflow:auto;margin:0}
  .pin summary{display:none}
  .pin .in{padding:16px 18px 16px}
}
@media (min-width:1400px){
  .wrap{margin-left:auto;margin-right:auto}
  .actions .in{margin-left:auto;margin-right:auto}
  .pin{left:calc(50vw + 370px);width:min(380px,calc(50vw - 400px))}
}
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="title">S&amp;T Flashcards</h1><span class="sub" id="subtitle"></span></header>
  <div class="controls">
    <div class="selrow">
      <select id="subjSel" aria-label="Subject"></select>
      <select id="topicSel" aria-label="Topic"></select>
    </div>
    <div class="row">
      <div class="seg" id="modeSeg">
        <button data-v="order">In order</button><button data-v="topics">Shuffle topics</button><button data-v="all">Shuffle all</button><button data-v="smart">Smart</button>
      </div>
    </div>
    <div class="progress">

<script>
const DECK={"subjects":[{"id":"s01","name":"Quantum and fundamental physics"},{"id":"s02","name":"Digital tech and AI"},{"id":"s03","name":"Robotics, BCI and new manufacturing"},{"id":"s04","name":"Biotech and genetics"},{"id":"s05","name":"Health and medicine"},{"id":"s06","name":"Infections and public health"},{"id":"s07","name":"Nanotech and materials"},{"id":"s08","name":"Space"},{"id":"s09","name":"Defence and propulsion"},{"id":"s10","name":"Nuclear"},{"id":"s11","name":"Energy, transport and environment tech"},{"id":"s12","name":"IPR"},{"id":"s13","name":"Awards and Nobels"}],"topics":[{"id":"quantum-mechanics","subj":"s01","name":"QUANTUM MECHANICS","cards":[{"id":"quantum-mechanics:core-principles#1","path":["Core Principles"],"part":[1,3],"rows":[{"sec":"Transcript: explain The Rules of Quantum Mechanics :"},{"h":"What is quantum mechanics?","t":"so assume the space as a room and “In quantum mechanics, an atom at a given point in a room is described by a wavefunction (thats the measurement) that gives the probability of finding it at any other point. In principle, it can be at infinitely many points simultaneously, though some locations are far more likely than others)."},{"t":"Quantum is a state that depends upon energy, at low energy some particles may behave like a single entity and other times they are individual, it is abundantly clear when we see bosons (they behave like a single entity when at extremely low temp), so this what is meant by the phrase”to find the atom at another point in the room” because eventually because of this behaviour they are changing their behaviour (usually tracked by a term called spin)x"},{"h":"Brian Cox:","t":"Well, the most basic version I know of is Feynman’s version. Essentially, it says particles are particles, and they hop from place to place with a particular probability."},{"t":"The probability that a particle at some place will be at a different place later is given by a very simple rule. It uses a quantity called the Action (Action is a physical quantity derived from a particle’s mass, time, and distance, which is calculated for every possible path and summed up to determine the probability of the particle moving from one location to another.) You basically calculate these little quantities related to the Action and add them up."},{"t":"So, if I start with an electron in one corner of the room and ask, “What’s the probability that at some time later it will be somewhere else?”, you can assign a probability to every point in the room that it will be there at a later point using one simple rule. And that’s it. This is called a Path Integral Formulation of quantum mechanics. That underlies everything else; you can get the rest from that. It is a simple rule that asks, “What’s the probability a particle moves from A to B?” That’s it."},{"h":"<u>What is quantum computing?<\/u>","t":"Quantum computing uses qubits in superposition (Classical physics: a system has one definite state (coin = heads or tails, bit = 0 or 1), quantum superposition: like a spinning coin, a quantum system exists in multiple states (0 and 1) at once until measurement forces a single outcome.) to explore many possibilities simultaneously. This gives a huge advantage for problems with exponentially many options, like factoring huge numbers, searching large databases, or simulating molecules. Classical computers check possibilities one by one, while quantum computers process them all at once and extract the correct answer efficiently."}],"v":"737c30"},{"id":"quantum-mechanics:core-principles#2","path":["Core Principles"],"part":[2,3],"rows":[{"sec":"What is quantum entanglement?"},{"t":"Now imagine we have two atoms, Atom 1 in your room (Point A) and Atom 2 somewhere else (maybe another room). If they are entangled, their quantum states are linked. This means the probability cloud of one atom depends on the state of the other, even if they are far apart."},{"t":"Eg Think of a simple property, spin, which can be up ( ↑ ) or down (↓) (think of spin like an atom having two blurry states one up and one down or it can be both ) Two atoms are entangled in a “singlet” state: Atom 1 is ↑ → Atom 2 must be ↓ Atom 1 is ↓ → Atom 2 must be ↑ Before measurement: Each atom is in a superposition of ↑ and ↓ like your atom being at all points at once."},{"h":"When you measure Atom 1’s spin:","t":"Its wavefunction collapses to ↑ or ↓.Instantly, Atom 2’s spin collapses to the correlated state, no matter how far apart it is."},{"t":"recebtly DRDO and IIT delhi demonstrated quantum entanglement over free space of 1 km"},{"h":"Micius (QUESS) :","t":"What is it? The world’s first quantum-enabled satellite, launched by China. Function: It established a quantumencrypted link between satellite and ground stations, proving that quantum communication is possible over long distances (space-to-earth)."},{"t":"QpiAI (startup selected under National Quantum Mission (NQM)) launched 25 qubit superconducting quantum computer (QpiAI-Indus) on occasion of World Quantum Day."},{"t":"<span class=\"lst\"><span class=\"li\">QpiAI has also developed India’s first quantum computing chip “25-qubit QPU”.<\/span><br><span class=\"li\">Google quantum processor “Willow” outperforms the fastest supercomputers<\/span><br><span class=\"li\">The team detected “Quantum Echoes algorithm” of scrambled data, proving information retention through entanglement.<\/span><\/span>"}],"v":"e16d5b"},{"id":"quantum-mechanics:core-principles#3","path":["Core Principles"],"part":[3,3],"rows":[{"sec":"About Quantum information Scrambling"},{"h":"Definition:","t":"Refers to the rapid spread of information across a quantum system, making it inaccessible to local measurements."},{"h":"Mechanism:","t":"Distributes quantum data among particles through entanglement, hiding information globally rather than erasing it."},{"h":"Analogy:","t":"Like a drop of dye dispersing in water, information initially stored in one qubit gets distributed among many qubits."},{"h":"Significance:","t":"Demonstrates a verifiable quantum advantage and enhances understanding of quantum technologi"},{"sec":"QSIP (Quantum Random Number Generator System in Package)"},{"t":"It is quantum security chip."},{"t":"QSIP provides quantum-certified randomness (random numbers from a quantum computer) that is used in cryptographic algorithms.<br>o It ensures defence against cyber threats and future quantum attacks."},{"t":"<u>Majorana Zero Modes.<\/u> What are they? A unique type of particle that is its own antiparticle. Why relevant? Researchers (including Microsoft) are trying to use them to build “Topological Quantum Computers.” They are considered more stable and less prone to errors (decoherence) than standard qubits."}],"v":"fdca44"},{"id":"quantum-mechanics:how-did-quantum-mechanics-come-about","path":["How did quantum mechanics come about :"],"rows":[{"h":"Step 1:","t":"The situation<br>Imagine you heat an iron rod - it first glows red, then orange, then white as it gets hotter. That glowing is called blackbody radiation - the hot object is giving off energy as light.<br>Scientists wanted to know:"},{"t":"Why does it glow in certain colors depending on temperature? How is energy being given off?<br> Step 2: What scientists thought before Planck Before quantum theory, people believed that atoms could vibrate and emit any amount of energy -like a dimmer switch where brightness changes smoothly. So they said: “Energy can take any value – 1.1, 1.11, 1.111, etc.” That’s what continuous energy distribution means. There are no gaps, no fixed jumps - energy can vary smoothly."},{"h":"Step 3:","t":"The problem When they used this idea to calculate how much light should come out at each color (wavelength), the math said that the object should release infinite energy in ultraviolet light that’s obviously wrong. This was called the ultraviolet catastrophe."},{"h":"Step 4:","t":"Planck’s bigidea (the birth of quantum theory) Max Planck in 1900 said: “Maybe energy is not continuous. Maybe atoms can only emit or absorb energy in small packets, not any random amount.” He called these packets quanta (singular: quantum). And each quantum has energy: E = hν where E = energy of one packet, h = Planck’s constant, and ν (nu) = frequency of the light."},{"h":"Step 5:","t":"What this means If the frequency (color) of light is higher, each packet carries more energy. So, atoms don’t release energy smoothly, they release it in jumps, like stepping stones, not a slide. You can think of it like this Continuous energy → smooth ramp (you can stand anywhere). Quantized energy → staircase (you can stand only on steps)."},{"h":"Step 6:","t":"The result When Planck used this “energy in packets” idea, the calculations matched exactly what experiments showed! No more infinite energy. And that was the beginning of quantum mechanics -the science of how energy and matter behave in very small (atomic) scales.so basically infinte energy ek baar toh nahi hai possible, so the alternative explanation energy is released one by one and not ek saath"}],"v":"34ba81"},{"id":"quantum-mechanics:applications-challenges","path":["Applications & Challenges"],"rows":[{"t":"Quantum technology applications include simulations for healthcare and quantum chemistry, secure communication via QKD (quantum key distribution), precision sensing, quantum chips, and advanced AI models."},{"t":"Challenges in India are high costs, scalability, cooling needs, low R&D, and tech gaps, while initiatives like the National Quantum Mission and QuEST aim to build infrastructure, research capabilities, and industry-academia collaboration."},{"t":"QUANTUM KEY DISTRIBUTION ( don’t worry about technical parts in this video just understand how hackers are prevented )"},{"img":0},{"video":"https://www.youtube.com/watch?v=cWpqlgF7uEA"}],"v":"d452d9"},{"id":"quantum-mechanics:quantum-tunneling","path":["QUANTUM TUNNELING"],"rows":[{"sec":"Classical view:"},{"t":"A particle needs enough energy to cross a barrier.<br>→ If energy is less than barrier height, crossing is impossible (ball hits wall and comes back)."},{"sec":"Quantum view:"},{"t":"Particles (electrons, protons, alpha particles) behave as waves.<br>→ A wave does not stop abruptly at a barrier; it spreads into and across it."},{"sec":"What tunnelling means:"},{"t":"Even when a particle’s energy is lower than the barrier, there is a finite probability that it will appear on the other side.<br>→ It does not break or jump over the barrier; it passes through it."},{"sec":"Why it is important (examples)"},{"sec":"Radioactive alpha decay:"},{"t":"Alpha particle tunnels out of nucleus → explains nuclear decay."},{"sec":"Josephson Junctions (Nobel 2025):"},{"t":"Cooper pairs tunnel through an insulating layer, causing current/ voltage even when classically forbidden."},{"img":1}],"v":"676d75"},{"id":"quantum-mechanics:national-quantum-mission/funding-objectives","path":["NATIONAL QUANTUM MISSION","Funding & Objectives"],"rows":[{"h":"Fund:","t":"Rs. 6003.65 crore (2023-24 to 2030-31), approved by Union Cabinet on 19th April 2023, to seed, nurture, and scale scientific and industrial R&D in Quantum Technology."},{"h":"Function:","t":"Develop 50-1000 qubit quantum computers (superconducting/ photonic), enable secure quantum communications (satellite-based 2000 km, inter-city QKD, long-distance international links, multi-node networks with quantum memories), build high-sensitivity atomic magnetometers and atomic clocks, design and fabricate quantum materials and devices (superconductors, novel semiconductors, topological materials, single and entangled photon sources), with applications in communication, healthcare, finance, energy, space, security, supporting initiatives like Digital India, Make in India, Skill India, Start-up India, and SDGs."},{"h":"FAQ:","t":"what is a spectrometer: Spectrophotometer - a device that measures how much light of different wavelengths a substance absorbs or transmits. Scientists use it to study materials, solutions, or reactions by shining light through them and recording how the light changes"}],"v":"b2d4ce"},{"id":"quantum-mechanics:national-quantum-mission/implementation-framework","path":["NATIONAL QUANTUM MISSION","Implementation Framework"],"rows":[{"h":"Functionaries:","t":"Four Thematic Hubs (T-Hubs) in top academic and National R&D institutes covering Quantum Computing, Quantum Communication, Quantum Sensing & Metrology, and Quantum Materials & Devices, tasked with generating new knowledge through basic and applied research and promoting R&D in their respective domains."},{"t":"Under the National Quantum Mission, the foundation stone of the Quantum Valley project was recently laid in Amaravati, Andhra Pradesh."},{"t":"It is an example of a 'Triple Helix Model' involving a tripartite alliance between the Government, industry leaders (IBM, TCS, L&T), and academia"}],"v":"524500"}]},{"id":"heisenberg-uncertainty-principle","subj":"s01","name":"HEISENBERG UNCERTAINTY PRINCIPLE","cards":[{"id":"heisenberg-uncertainty-principle:main","path":[],"rows":[{"h":"<b>Scientist:<\/b>","t":"Werner Heisenberg (1927)"},{"h":"<b>The Core Concept:<\/b>","t":"It is fundamentally impossible to determine both the <b>exact position<\/b> and the <b>exact momentum<\/b>(mass × velocity) of a microscopic particle (like an electron) simultaneously with absolute precision."},{"h":"<b>The Trade-off:<\/b>","t":"The more accurately you measure a particle's position, the less accurately you can know its momentum, and vice versa."},{"h":"<b>The Mathematical Expression:<\/b>","t":"Δx⋅Δp≥4πh <i>(Where Δx is the uncertainty in position, Δp is the uncertainty in momentum, and h is Planck's constant).<\/i>"},{"sec":"Crucial Additions for Your Notes (The \"Why\" and \"Impact\")"},{"h":"<b>It is NOT a Measurement Flaw:<\/b>","t":"This is the most common trap in exam questions. The uncertainty is not because our microscopes or measuring instruments are weak. It is a fundamental law of nature. The very act of observing a quantum particle (which requires hitting it with a photon of light to \"see\" it) physically alters its momentum."},{"h":"<b>The Macroscopic vs. Microscopic Rule:<\/b>","t":"You do not experience this with a moving car or a cricket ball. Because everyday objects have such massive weight compared to an electron, the mathematical uncertainty value becomes so unimaginably small that it is practically zero. This principle only governs the quantum (subatomic) world."},{"h":"<b>The Death of Determinism:<\/b>","t":"Before Heisenberg, classical physics (Newtonian physics) argued that if you knew the exact starting position and speed of every particle in the universe, you could predict the entire future perfectly. Heisenberg proved that at a foundational level, the universe operates on probability, not absolute certainty."}],"v":"41824b"}]},{"id":"wave-particle-duality","subj":"s01","name":"WAVE-PARTICLE DUALITY","cards":[{"id":"wave-particle-duality:main#1","path":[],"part":[1,2],"rows":[{"sec":"Wave-Particle Duality"},{"h":"<b>The Core Concept:<\/b>","t":"Every elementary particle or quantic entity (like light, electrons, and protons) exhibits the properties of <i>both<\/i> particles and waves. Depending on how you measure it, it will behave like one or the other, but never both at the exact same time."},{"sec":"1. Proving the \"Wave\" Nature"},{"h":"<b>The Experiment:<\/b>","t":"Thomas Young’s Double-Slit Experiment (1801)."},{"h":"<b>What Happened:<\/b>","t":"When light was shone through two parallel slits onto a screen, it did not just create two distinct bands of light. Instead, it created an <b>interference pattern<\/b> (multiple alternating bands of light and dark)."},{"h":"<b>The Conclusion:<\/b>","t":"Only waves can interfere with each other (amplifying in some places, canceling out in others). Therefore, light must be a wave."},{"sec":"2. Proving the \"Particle\" Nature"},{"h":"<b>The Experiment:<\/b>","t":"The Photoelectric Effect (explained by Albert Einstein in 1905, for which he won the Nobel Prize)."},{"h":"<b>What Happened:<\/b>","t":"When shining high-frequency light onto a piece of metal, electrons are knocked off the metal's surface. However, increasing the <i>brightness<\/i> (intensity) of the light did not knock off faster electrons; only increasing the <i>frequency<\/i> (color) did."},{"h":"<b>The Conclusion:<\/b>","t":"Light does not travel as a continuous wave of energy, but rather as a stream of distinct, individual energy packets called <b>photons<\/b>. One photon knocks loose one electron, acting exactly like two billiard balls colliding."}],"v":"1451d8"},{"id":"wave-particle-duality:main#2","path":[],"part":[2,2],"rows":[{"sec":"3. De Broglie’s Hypothesis (The Big Twist)"},{"t":"In 1924, scientist Louis de Broglie flipped the concept upside down. He argued that if light (which we thought was a wave) can act like a physical particle, then <b>physical matter (like an electron) must be able to act like a wave.<\/b>"},{"t":"He introduced the concept of \"Matter Waves,\" proving that every moving object has a wavelength."},{"h":"<b>The Mathematical Expression:<\/b>","t":"λ=ph=mvh <i>(Where λ is wavelength, h is Planck's constant, p is momentum, m is mass, and v is velocity).<\/i>"},{"h":"<b>The Macroscopic Rule:<\/b>","t":"Just like Heisenberg's principle, if you plug a heavy object (like a cricket ball) into this equation, its wavelength is so unimaginably small that it cannot be detected. We only observe wave-like behavior in subatomic particles like electrons."},{"sec":"Exam Application: Why Does This Matter?"},{"t":"Examiners often want to see if you know how these theoretical physics concepts apply to modern technology. The direct practical application of Wave-Particle Duality is the <b>Electron Microscope<\/b>."},{"t":"Traditional optical microscopes use visible light waves to see things, but they cannot see anything smaller than the wavelength of light itself (like a virus)."},{"t":"Because de Broglie proved that electrons travel in waves, and because the wavelength of an electron is thousands of times smaller than a wave of visible light, scientists shoot beams of electrons at objects to resolve incredibly tiny structures—from viruses to individual atoms."}],"v":"74523a"}]},{"id":"hawking-radiation","subj":"s01","name":"HAWKING RADIATION","cards":[{"id":"hawking-radiation:main","path":[],"rows":[{"t":"Predicted by<br>Stephen Hawking"},{"sec":"Near a black hole:"},{"t":"<span class=\"lst\"><span class=\"li\">Quantum physics says <b>particle pairs constantly appear and disappear<\/b>.<\/span><br><span class=\"li\">Near the <b>event horizon<\/b>, one particle falls into the black hole.<\/span><br><span class=\"li\">The other escapes.<\/span><br><span class=\"li\">This escaping particle becomes <b>radiation<\/b>.<\/span><\/span>"},{"sec":"Result:"},{"t":"<span class=\"lst\"><span class=\"li\">They <b>slowly lose mass<\/b><\/span><br><span class=\"li li2\">Black holes <b>emit radiation<\/b><\/span><br><span class=\"li\">Eventually they <b>evaporate<\/b><\/span><\/span>"}],"v":"38595c"}]},{"id":"neutrino","subj":"s01","name":"NEUTRINO","cards":[{"id":"neutrino:main#1","path":[],"part":[1,2],"rows":[{"sec":"1. The Core Concept: Why are they \"Ghost Particles\"?"},{"t":"Imagine a particle so small, fast, and indifferent to its surroundings that it could travel through a block of solid lead a lightyear thick without hitting a single atom. That is a neutrino."},{"t":"Right now, trillions of them (mostly originating from the Sun) are passing through your body every second, and you don't feel a thing."},{"sec":"Here is why they behave like ghosts:"},{"h":"<b>No Electrical Charge:<\/b>","t":"Because they are neutral, they don't care about the electromagnetic force. This means magnetic fields in space do not bend or alter their path. They travel in a perfectly straight line from their source (like a dying star or a black hole) straight to Earth."},{"h":"<b>Weak Interaction:<\/b>","t":"They only interact with matter through the <b>weak nuclear force<\/b> and gravity. Because they don't interact with regular matter, they don't get absorbed or deflected."},{"h":"<b>Tiny Mass:<\/b>","t":"For decades, the Standard Model of physics assumed they had zero mass (like photons). The discovery that they actually possess a remarkably tiny, almost immeasurable mass was a recent Nobel Prize-winning breakthrough."}],"v":"523970"},{"id":"neutrino:main#2","path":[],"part":[2,2],"rows":[{"sec":"2. The JUNO Observatory: How do you catch a ghost?"},{"t":"If neutrinos pass through everything, how is China's <b>Jiangmen Underground Neutrino Observatory (JUNO)<\/b> detecting them?"},{"t":"You have to build a massive, highly sensitive trap."},{"h":"<b>Going Deep Underground:<\/b>","t":"JUNO is built nearly 700 meters underground. Why? Because the surface of the Earth is bombarded by other cosmic radiation that would create \"noise\" for the sensors. The thick layer of earth blocks out everything <i>except<\/i> the unstoppable neutrinos."},{"h":"<b>The Giant Sphere:<\/b>","t":"The detector is a massive acrylic sphere filled with 20,000 tons of a specially formulated liquid."},{"h":"<b>The Flash:<\/b>","t":"On the incredibly rare occasion that a \"ghost\" actually collides head-on with an atom inside that liquid, it creates a tiny, faint flash of light. Thousands of ultra-sensitive photo-tubes lining the walls of the sphere capture that flash, finally proving the neutrino was there."},{"sec":"3. The Exam Application: Why does this matter?"},{"h":"Why are countries spending billions to detect these ghosts?","t":"Because they travel in straight lines across the universe without being altered, they are the ultimate <b>\"cosmic messengers.\"<\/b> Studying them helps scientists answer the biggest questions in physics:"},{"t":"<span class=\"lst\"><span class=\"li\">Understanding what exactly happened moments after the Big Bang.<\/span><br><span class=\"li\">Unlocking the secrets of Dark Matter.<\/span><br><span class=\"li\">Understanding the internal nuclear reactions of our Sun and other stars.<\/span><\/span>"}],"v":"d4d3ef"}]},{"id":"matter-antimatter-asymmetry","subj":"s01","name":"MATTER-ANTIMATTER ASYMMETRY","cards":[{"id":"matter-antimatter-asymmetry:main","path":[],"rows":[{"sec":"1. The Core Mystery: The Big Bang's \"Accounting Error\""},{"t":"According to the standard model of physics, the Big Bang should have acted like a perfectly balanced equation, creating exactly equal amounts of <b>Matter<\/b> (what we are made of) and <b>Antimatter<\/b>."},{"h":"<b>What is Antimatter?<\/b>","t":"It is exactly like regular matter, but with an opposite electrical charge. For example, the antimatter twin of a negatively charged electron is a positively charged \"positron.\""},{"h":"<b>The Annihilation Rule:<\/b>","t":"If a particle of matter and a particle of antimatter ever touch, they instantly destroy each other in a flash of pure energy."},{"h":"<b>The Asymmetry (The Imbalance):<\/b>","t":"If the universe created a perfect 1:1 ratio, all matter and antimatter should have annihilated each other billions of years ago. The universe should be completely empty, containing nothing but light."},{"t":"However, we exist. Stars, planets, and you exist. This means there was a tiny, miraculous imbalance: for every one billion particles of antimatter created, there were roughly <b>one billion and one<\/b> particles of matter. The billions destroyed each other, but that single leftover matter particle survived to build the observable universe. This imbalance is the <b>Matter-Antimatter Asymmetry<\/b>."},{"sec":"2. The Breakthrough: What is \"CP Violation\"?"},{"t":"For decades, scientists have been trying to figure out <i>why<\/i> that tiny imbalance existed. To find out, they look for particles breaking the rules of symmetry."},{"h":"<b>The Rule (CP Symmetry):<\/b>","t":"The universe is supposed to be perfectly fair. \"CP Symmetry\" dictates that if you swap a particle for its antimatter twin (Charge) and look at it in a mirror (Parity), the laws of physics should apply to it in the exact same way."},{"h":"<b>The Rule Breaker (CP Violation):<\/b>","t":"Scientists at CERN recently observed <b>baryons<\/b> (heavy particles, like the building blocks of protons and neutrons) breaking this exact rule. When they observed the antimatter version of these baryons, they behaved slightly differently and decayed at different rates than their regular matter counterparts."},{"sec":"3. Why This Discovery Matters"},{"t":"Finding this <b>CP Violation<\/b> in baryons is a massive milestone. It is the physical proof that matter and antimatter do <i>not<\/i>behave identically. This tiny difference in behavior—this \"violation\" of the universe's symmetry—is the smoking gun that explains why regular matter won the cosmic battle right after the Big Bang, allowing everything we know to exist."}],"v":"12d38f"}]},{"id":"bose-einstein-condensate","subj":"s01","name":"BOSE EINSTEIN CONDENSATE","cards":[{"id":"bose-einstein-condensate:main#1","path":[],"part":[1,8],"rows":[{"sec":"UNDERSTANDING THE ABOVE PHENOMENA"},{"sec":"<b>Step 1: What are “particles” in physics?<\/b>"},{"t":"Everything in the universe — light, air, water, even you — is made of tiny particles. These can be 2 types In quantum world (microscopic world): 1) Matter particles (like electrons, protons, neutrons), and 2) Force particles (like photons — the particles of light). These particles follow special “rules” about how they can exist and move. Those rules are what we call <b>quantum statistics<\/b>."},{"sec":"<b>Step 2: What are “statistics” here?<\/b>"},{"t":"“Statistics” in physics just means the pattern in which a group of particles spread out over energy levels — i.e., how they occupy space and energy. Imagine you have a building with many floors (energy levels) and many particles (people). The question is — how do the people distribute themselves among the floors? That’s what quantum statistics answers. Different types of particles follow different crowding rules."}],"v":"db4ba4"},{"id":"bose-einstein-condensate:main#2","path":[],"part":[2,8],"table":1,"head":["Type","Spin","Obey which statistics","Behavior"],"rows":[{"sec":"<b>Step 3: Two kinds of particles, two different rules<\/b>"},{"h":"<b>Fermions<\/b>","t":"<span class=\"th\">Spin<\/span> Half-integer spin (½, 3/2...)<br><span class=\"th\">Obey which statistics<\/span> Fermi–Dirac statistics<br><span class=\"th\">Behavior<\/span> Anti-social — each particle wants its own space (can’t share the same state)."},{"h":"<b>Bosons<\/b>","t":"<span class=\"th\">Spin<\/span> Integer spin (0, 1, 2...)<br><span class=\"th\">Obey which statistics<\/span> Bose–Einstein statistics<br><span class=\"th\">Behavior<\/span> Social — they love to share the same energy state."}],"v":"2d37e7"},{"id":"bose-einstein-condensate:main#3","path":[],"part":[3,8],"rows":[{"t":"So, <b>Bose–Einstein statistics<\/b> is the rulebook for bosons."},{"sec":"<b>Step 4: What does Bose–Einstein statistics actually say?<\/b>"},{"h":"It says:","t":"When you have many identical bosons, they can all occupy the same energy level — especially when it’s cold — and they’ll naturally tend to bunch up in the lowest energy state."},{"t":"This is completely opposite to fermions (like electrons), which cannot share the same energy level (<b>Pauli exclusion principle<\/b>)."},{"sec":"<b>Step 5: What happens at very low temperatures?<\/b>"},{"sec":"When you cool bosons to near absolute zero (0 K):"},{"t":"<span class=\"lst\"><span class=\"li\">Their individual energy differences become tiny.<\/span><br><span class=\"li\">Many of them collapse into the same lowest energy state.<\/span><br><span class=\"li\">They behave as one single quantum entity — like a single “super-atom.”<\/span><\/span>"},{"t":"This state is called a <b>Bose–Einstein Condensate (BEC)<\/b> —<br>a new state of matter discovered in 1995."},{"t":"(It is a state of matter created when particles are cooled to near absolute zero (-273.15 degrees Celsius / 0 Kelvin))."},{"sec":"<b>Step 6: Real-world example of Bose–Einstein statistics<\/b>"},{"sec":"<b>Photons in a laser beam:<\/b>"},{"t":"All photons have the same energy, direction, and phase → they’re in the same quantum state."},{"t":"That’s why laser light is so sharp and coherent — a direct application of Bose–Einstein behavior."}],"v":"8d44c2"},{"id":"bose-einstein-condensate:main#4","path":[],"part":[4,8],"rows":[{"sec":"<b>Helium-4 superfluid:<\/b>"},{"t":"When cooled below 2.17 K, liquid helium flows without friction → its atoms behave like a single giant wave."}],"v":"b6011c"},{"id":"bose-einstein-condensate:main#5","path":[],"part":[5,8],"rows":[{"sec":"<b>Properties of BEC include<\/b>:"},{"h":"Super fluidity:","t":"BEC has zero viscosity and can flow without resistance."},{"h":"Super conductivity:","t":"The zero resistance leads to optimal conductivity."},{"h":"Coherence:","t":"All particles in the BEC are in the same quantum state behaving as a single entity."},{"h":"Macroscopic Occupation:","t":"It means that all the particles in the system (like in a BEC) act together as one single giant quantum wave, instead of behaving separately"},{"h":"Super solid :","t":"n a Bose–Einstein Condensate (BEC), particles act like one single wave — they flow without any friction or viscosity."},{"t":"So, if you poured a BEC, it would flow forever without slowing down. That’s called superfluidity.  Now — what’s a supersolid? It’s something mind-blowing — a state of matter that behaves like both a solid and a superfluid at the same time. That means: Like a solid, its particles are arranged in a regular, repeating pattern (an ordered structure). Like a superfluid, the particles can still flow smoothly through that structure without resistance."}],"v":"ec563e"},{"id":"bose-einstein-condensate:main#6","path":[],"part":[6,8],"rows":[{"t":"A Bose–Einstein condensate (BEC) exists at higher temperatures also in materials hosting bosonic quasiparticles such as magnons, excitons and polaritons."},{"t":"(<b>Magnons<\/b> – waves in magnetism: Okay, imagine a row of tiny bar magnets (these represent atomic spins) all pointing the same way inside a magnet."},{"t":"Now if you tap one of them, it tilts a little — and that disturbance travels down the row like a wave. That traveling wave of “spin disturbance” is called a magnon. So, a magnon is basically a small wave of magnetic energy moving through a material. Think: like a wave moving through a line of dominoes, but here it’s tiny magnetic spins wobbling."},{"h":"<b>EXCITONS<\/b>:","t":"- Step 1: Inside every material, Every solid (like metal, plastic, or silicon) is made of atoms, and each atom has electrons. These electrons can have different amounts of energy — some are tightly bound to the atom, and some can move around freely."},{"t":"In solids, we talk about these energies in bands: Valence band → where electrons normally stay (low energy zone). Conduction band → where electrons are free to move (high energy zone). Band gap → the “forbidden” space between them — electrons need extra energy to cross it."},{"h":"Step 2:","t":"What happens when light hits: When light falls on a semiconductor like silicon, each particle of light (called a photon) carries energy."}],"v":"723dcc"},{"id":"bose-einstein-condensate:main#7","path":[],"part":[7,8],"rows":[{"t":"If the photon has enough energy, it can knock an electron out of its usual place in the valence band and send it to the conduction band. So now: You have a free electron (negative charge) up in the conduction band. And an empty spot (where that electron was) left behind in the valence band."},{"h":"Step 3:","t":"What is that empty spot? That empty spot behaves like a positive charge, because it’s missing one negative electron. We call that spot a hole. It’s not a real particle — it’s more like a “space” that can move as nearby electrons fill it. So now you have: A negative electron (in the conduction band), and A positive hole (in the valence band)"},{"h":"<i>Step 4<\/i>:","t":"Attraction between them Opposite charges attract — right? So the free electron (–) and the hole (+) pull each other with electric force. Instead of staying far apart, they can bind together like a tiny pair, moving through the material as one unit. This pair is called an exciton."},{"h":"<b>Polaritons<\/b> –","t":"light mixed with matter"},{"t":"Now, imagine light (a photon) entering a material. If it meets an exciton (that electron-hole pair), they can combine — like they “merge” into a single new particle that behaves partly like light and partly like matter. <b>That hybrid particle is called a polariton. <\/b>Because it’s half photon (light) and half exciton (matter), it can move very fast like light but also interact with other particles like matter Think: like light dressing up as matter — a photon wearing an exciton coat.)"}],"v":"f092e9"},{"id":"bose-einstein-condensate:main#8","path":[],"part":[8,8],"rows":[{"sec":"<b>GOD PARTICLE<\/b> :"},{"h":"What is the “God Particle”?","t":"The Higgs Boson is a tiny subatomic particle that was discovered in 2012 at CERN (in the Large Hadron Collider). It’s called the “God Particle” (a nickname, not a scientific term) because it explains why things have mass — basically, why matter exists the way it does."},{"t":"🌌 2. The invisible field behind it — the Higgs Field Scientists believe that all of space — even what looks like “empty space” — is filled with an invisible energy field called the Higgs Field. Every particle in the universe moves through this field. Some particles interact strongly with this field → they become heavy (like protons, neutrons). Some interact weakly → they stay light (like electrons). Some don’t interact at all → they have no mass (like photons). So, the Higgs Field gives mass to particles — it’s like a “cosmic syrup” that slows some particles down more than others."},{"t":"💥 3. Then what is the Higgs Boson itself? The Higgs Boson is like a tiny ripple or disturbance in the Higgs Field. When the field gets excited (like plucking a string), that vibration shows up as a Higgs Boson particle — which scientists detected in experiments. So, finding the Higgs Boson proved that the Higgs Field is real."},{"t":"🧮 4. How Bose–Einstein Statistics connects The Higgs Boson belongs to a family of particles called bosons (named after S.N. Bose — the Indian physicist — and Einstein). Bosons are special because: They can all occupy the same quantum state (unlike fermions, which can’t). They follow Bose–Einstein statistics, the same principles behind Bose–Einstein Condensate (BEC). That’s why the Higgs Boson is said to be based on “scientific principles rooted in Bose–Einstein statistics.”"}],"v":"4e16c3"},{"id":"bose-einstein-condensate:large-hadron-collider-and-xi-cc-plus","path":["LARGE HADRON COLLIDER and XI-cc-plus"],"rows":[{"t":"The Large Hadron Collider (LHC) at CERN has discovered a new particle named Xi-cc-plus, marking its 80th particle discovery"},{"t":"It is made up of two charm quarks and one down quark similar to proton ( Quarks are fundamental building blocks of matter and come in six flavours (types): up, down, charm, strange, top and bottom. )"},{"t":"The replacement of up quarks with charm quarks makes its mass four times heavier than proton."},{"t":"Large Hadron Collider (LHC)<br>• It is the world’s largest and most powerful particle accelerator which operates in a tunnel 100 metres underground at CERN (European Organization for Nuclear Research).<br>• Structure: It consists of a 27-kilometre ring of superconducting magnets with a number of accelerating structures to boost the energy of the particles along the way.<br>• Function: Inside the accelerator, two high-energy particle beams of protons or ions travel at close to the speed of light before they are made to collide.<br>• Significance: These collisions produce particles and fields necessary for fundamental understanding of nature such as mass, dark energy and dark matter etc.<br>• Other Discoveries by LHC: Higgs Boson (2012); Exotic hadrons (Particles composed of four or five quarks);<br>Rare B- meson decay; etc."}],"v":"8c58dd"}]},{"id":"supersolid","subj":"s01","name":"SUPERSOLID","cards":[{"id":"supersolid:main","path":[],"rows":[{"sec":"Scientific Breakthrough"},{"t":"For the first time, researchers have successfully transformed light into a super solid, a rare and intriguing state of matter that simultaneously exhibits properties of both solids and liquids. Super solids are quantum mechanical phases (This dual behavior is impossible in classical physics and only occurs due to the superposition and coherence principles of quantum mechanics) where particles arrange themselves into a crystalline solid structure while maintaining the ability to flow without viscosity, a characteristic typical of liquids."},{"t":"Historically, super solids have only been observed in Bose-Einstein condensates composed of ultra-cold atoms near absolute zero temperatures."},{"t":"However, this groundbreaking achievement was realized by directing laser light onto a specially engineered semiconductor made of gallium arsenide with microscopic ridges."},{"t":"The interaction between the laser and the semiconductor generated hybrid light-matter particles known as polaritons."},{"t":"These polaritons condensed into an ordered crystalline structure while preserving fluid-like motion, thereby creating a super solid."},{"t":"This discovery opens new avenues for exploring quantum interactions free from thermal noise and holds significant promise for advancing quantum computing, material science, and energy storage technologies."}],"v":"8377a4"}]},{"id":"iot","subj":"s02","name":"IOT","cards":[{"id":"iot:main","path":[],"rows":[{"sec":"Definition & Scope"},{"h":"Definition & Scope:","t":"IoT connects physical devices, vehicles, appliances, etc., with sensors and network connectivity, enabling data collection and sharing, and forms part of the 4th Industrial Revolution alongside AI, AR/VR, and additive manufacturing."},{"sec":"Sectoral Applications"},{"h":"Applications:","t":"Used in healthcare (remote monitoring, wearable devices eg Apple Watch), agriculture (precision farming), transportation (smart traffic/ FASTag), and energy/utilities (smart meters, energy optimization)."},{"sec":"Key Challenges"},{"h":"Challenges:","t":"Includes security & privacy risks, data overload, high power consumption, non-interoperability, and environmental issues like e-waste. Strategic Direction"},{"h":"Way Forward:","t":"Expand network reach (e.g., BharatNet), manage data effectively, encourage IoT startups like Stellapps (dairy IOT), and create national IoT standards for compatibility, security, and data exchange."}],"v":"48e9aa"},{"id":"iot:4th-industrial-revolution","path":["4th industrial revolution"],"rows":[{"t":"WEF announced five new ‘Fourth Industrial Revolution (IR 4.0) Centre globally. One of the Centre will be built in in Andhra Pradesh, India. It will be 3rd such centre in India after Mumbai and Telangana"},{"t":"The term was coined by Klaus Schwab"},{"t":"IR 4.0 describes the current era in which digital, physical and biological technologies converge such as AI, robotics, the Internet of Things (IoT)"},{"t":"basically machines ability to talk to each other, automated to autonomous, AI, IoT & Biotech comes under it,"},{"h":"how it works :","t":"imagine a central nervous system, the senses are sensed by sensor that turn everyday reality like hot/warm/how to do it into information (IOT), <b>The Memory (Cloud Computing & Big Data):<\/b> Massive server networks store and share this continuous flood of data across machines, factories, and continents in real time , The Brain (Artificial Intelligence & Machine Learning), The Hands (Advanced Robotics, 3D Printing & Biotech)"},{"t":"it counts as a revolution because of velocity (unpreceddented speed), previous rev only in one sector this covers all, For the first time, technology is not just changing <i>what we make<\/i> or <i>how we work<\/i>—it is changing <i>who we are<\/i>, extending into gene editing, brain-computer interfaces, and algorithmic governance."}],"v":"f8dece"},{"id":"iot:digital-twin","path":["Digital twin"],"rows":[{"t":"V.O. Chidambaranar Port Authority in Tamil Nadu became the first port in India to launch Digital Twin initiative and it can also be created for cities<br>it is visual duplicate of the real life structure by using real time data<br>enables remote monitoring, experiments by simultion and analysis enables improved efficiency and better predictions in policy and aid in urban planning"},{"h":"use cases include :","t":"Digital twins enable custom design, validation, and tracking in <b>manufacturing<\/b> & <b>aerospace/auto<\/b>, project/safety control in <b>construction<\/b>, <b>utility<\/b> grid efficiency, <b>smart farming<\/b>, <b>healthcare<\/b> diagnosis/drug development, <b>retail<\/b> supply chain/fleet optimization, and <b>mining<\/b> productivity/simulation."}],"v":"58158a"},{"id":"iot:kavach","path":["Kavach"],"rows":[{"t":"automated train protection system, works by commiunicating between Trains and their trackside systems, they stay in continuous real-time contact using secure Ultra High Frequency radio antennas and track-mounted RFID tags."},{"h":"adv :","t":"Detection and prevention of <u>Signal Passing at Danger (SPAD) (<\/u><b>Signal Passing at Danger (SPAD)<\/b> occurs when a train crosses a stop signal (a red aspect) without authorization. Because railway tracks restrict lateral movement and heavy trains require long braking distances, a SPAD event creates an immediate risk of collisions or derailments.)"},{"t":"<span class=\"lst\"><span class=\"li\">Cab signaling with display of movement authority<\/span><br><span class=\"li\">Automatic horn activation<\/span><br><span class=\"li\">Emergency Stop-on-Sight (SoS)<\/span><br><span class=\"li\">Centralized live monitoring of train movements through the Network Management System (NMS).<\/span><\/span>"}],"v":"313df4"}]},{"id":"blockchain","subj":"s02","name":"BLOCKCHAIN","cards":[{"id":"blockchain:main","path":[],"rows":[{"sec":"Definition & Core Features"},{"t":"Blockchain is simply put a system that facilitates trust and maintains records or ledgers like traditional banks without any middleman and the popular cryptocurrencies are built on top of that eg bitcoin & ethereum. (More formally: It is distributed ledger technology that enables secure, transparent, and tamper-proof recording of transactions across multiple computers without a central authority. It uses cryptography and consensus mechanisms to ensure data integrity and trust.)"},{"video":"https://www.youtube.com/watch?v=SSo_EIwHSd4"},{"sec":"Technical Components"},{"sec":"Key Components"},{"t":"It consists of blocks of data linked chronologically in a chain, each containing previous block hash, data, and a cryptographic hash of the previous block, ensuring immutability and traceability."},{"sec":"Practical Applications"},{"sec":"Applications"},{"t":"Blockchain is applied in finance (cryptocurrencies, payments), supply chain management, healthcare for secure records, governance (e-voting), and digital identity verification. It fosters transparency, efficiency, and reduces fraud."},{"sec":"Challenges & Future"},{"sec":"Challenges & Way Forward"},{"t":"Challenges include scalability issues, high energy consumption (especially in Proof-of-Work), regulatory uncertainties, and privacy concerns. Future directions focus on developing energy-efficient consensus algorithms, enhancing interoperability (eg. <b><u>MH’s Sandbox AI <\/u><\/b>for land records and agriculture), and creating clear regulations to harness blockchain’s full potential."},{"img":2}],"v":"b0b2d3"}]},{"id":"stable-coins","subj":"s02","name":"STABLE COINS","cards":[{"id":"stable-coins:main","path":[],"rows":[{"t":"Stablecoins are a type of cryptocurrency whose value is linked to that of another currency, commodity, or financial instrument. E.g., Tether (USDT), is pegged to the US dollar."},{"t":"They have the potential to bring efficiencies to payments."},{"h":"There are primarily three types of stablecoins:","t":"fiat-collateralized, crypto-collateralized, and noncollateralized (algorithmic)."},{"h":"Concerns:","t":"Risk of mass withdrawal of holdings simultaneously, fail the test of elasticity (cannot expand quickly to provide additional liquidity in case of high demand), risk of money laundering,"}],"v":"00f3d5"}]},{"id":"ai-foundational-concepts","subj":"s02","name":"AI  Foundational Concepts","cards":[{"id":"ai-foundational-concepts:1-definition-core-technologies","path":["1. Definition & Core Technologies"],"rows":[{"video":"https://www.youtube.com/watch?v=qYNweeDHiyU"},{"t":"AI enables machines to simulate or surpass human intelligence (which is defined by the ability to read, summarize, learn, problem-solving, including learning, reasoning, decision-making, and language understanding)."},{"t":"Al is forecast to add $1trillion to India’s economy by 2035 and raise growth by 1.3% annually. Machine learning is providing the AI with data to predict and analyse patterns. Deep learning uses neural networks (made of artificial neurone that process and then pass info to the next layer; very high in number) just like a brain does, the output can not always be predicted like a normal brain. learning is called deep because the numerous neural networks."},{"t":"GenerativeAI include large language modules (just like autocomplete feature on the phone but instead of predicting the next word, it predicts the next, sentence, paragraph) and similarly audio models and music models and video models (eg. deepfakes) (deep fakes are using generative adversary tech eg It’s like a counterfeiter (Generator) making fake money and a detective (Adversary) spotting the fakes. Each time the detective catches a flaw, the counterfeiter learns to make the fake money look more real-until the fakes are nearly impossible to detect.) (eg. USA enacted the take it down act)"},{"img":3}],"v":"59eca1"},{"id":"ai-foundational-concepts:2-applications","path":["2. Applications"],"rows":[{"t":"AI finds critical use in generative content creation (text, images, audio, video, code), healthcare (medical imaging, pathology analysis), education (OMR exam systems), manufacturing (predictive maintenance), energy forecasting (e.g., NTPC for solar/wind), and agriculture (smart drones, weather forecasting, automated farming bots)."}],"v":"7e3484"},{"id":"ai-foundational-concepts:2-applications/healthcare-innovations","path":["2. Applications","Healthcare Innovations"],"rows":[{"h":"Health :","t":"X ray (image analyse) (eg. Tata elxsi) + R&D (ProteinSGM Generative AI model for protein designing) + Health assistant (eg. practo multilingual ai for telemedicine) + startups (Wadhwani AI - AI interventions for TB patient care.) + iOncology.ai (AIIMS Delhi) - Cancer detection. AIIMS MAdhuNEtrAI (frugal tech to high precision diagnostic systems)"}],"v":"37fcf0"},{"id":"ai-foundational-concepts:2-applications/agricultural-transformation","path":["2. Applications","Agricultural Transformation"],"rows":[{"h":"Agriculture :","t":"<br><i>Uses : Al used for pest management (National Pest Surveillance System), data-driven agritech (use of ai andhra pradesh’s sriakkulam district increased incomes by 20-30 %), soil health (Fasal, Cropin cutting input costs by 20% ), and precision farming (AI-based irrigation/fertilisation in Karnataka villages). Promoted via National egov plan + Niti aayogs AI for agriculture.<\/i>"},{"h":"Intiatives :","t":"Promotion Initiatives - <u>NITI Aayog’s AI for Agriculture<\/u>, WEF’s AI4AI, <u>Kisan-eMitra chatbot under PM-KISAN<\/u>, and <u>National e-Governance Plan<\/u> in <u>Agriculture (NeGPA) for AI, ML,<\/u> and analytics adoption."}],"v":"fb39b0"},{"id":"ai-foundational-concepts:3-promotion-initiatives-and-policy-initi","path":["3. Promotion Initiatives and Policy Initiatives"],"rows":[{"t":"Key government-led programs include the IndiaAI Mission (democratise and catalyse the use of AI via PPP), National AI Portal (joint initiative by Meity, NeGD (national e gov division), NASSCOM), Al Research Analytics and Knowledge Platform (AIRAWAT)(common compute platform for AI research), National AI Skilling Program, and BharatGen Programme focused on building generative AI in Indian languages, BHASHINI"},{"t":"Ministry of Science & Technology launched ‘Bharat Gen’ at the BharatGen Summit.<br><b><u>About Bharat Gen<\/u><\/b>"},{"t":"India’s first-of-its-kind, indigenously developed AI-based Multimodal LLM for Indian languages."}],"v":"28d589"},{"id":"ai-foundational-concepts:3-promotion-initiatives-and-policy-initi/regulatory-landscape","path":["3. Promotion Initiatives and Policy Initiatives","Regulatory Landscape"],"rows":[{"h":"Regulation of AI:","t":"India lacks specific deepfake laws but uses the IT Act 2000 (covers AI-generated information) and IT Rules 2021 (allows online grievance appeals). CERT-In issues safety advisories, I4C coordinates cybercrime cases, and the 1930 helpline reports incidents. Globally, the EU’s AI Act regulates AI use, and Italy bans unauthorized use of a person’s likeness."}],"v":"ea506d"},{"id":"ai-foundational-concepts:3-promotion-initiatives-and-policy-initi/global-governance-efforts","path":["3. Promotion Initiatives and Policy Initiatives","Global Governance Efforts"],"rows":[{"h":"Intiatives :","t":"National Strategy for AI (NSAI) - “#AlforAll”, by NITI Aayog, emphasises inclusive growth and responsible AI in governance, agriculture, healthcare, and education.; Responsible AI Principles - Guidelines to ensure AI systems work for societal benefit + Digital Personal Data Protection Act, 2023 - Strengthens privacy and security compliance + G7 + IT intermediary guidelines 2025 to regulate AI"},{"h":"Hiroshima Al Process (2023) -","t":"Consensus among G7 nations on opportunities and risks of AI + Bletchley Declaration - 28 countries + EU agreement to cooperate on safe and trustworthy AI development + Hiroshima AI ( G7 nations will see where AI could lead us) + EU AI code of practice for general purpose"},{"h":"india AI conference :","t":"For example, the Indian startup Sarvam officially released its 30-billion and 105-billion parameter multilingual models under an open-source license."},{"h":"7 pillars :","t":"India AI compute, India AI innovation centre, India AI startup financing, safe & trusted ai, india Ai dataset platform, india ai developement intiatives, india ai future skills"},{"t":"Over 90 signatories (including the EU, US, and UK) signed a declaration pushing for the democratisation of AI resources"},{"h":"issues :","t":"Low fund utilization (32% Revised Estimate in FY25–26), costly/delayed GPU infrastructure, heavy data-center power/water use, sovereign AI challenges, and R&D funding restricted to premier institutes."}],"v":"8b13c2"},{"id":"ai-foundational-concepts:3-promotion-initiatives-and-policy-initi/global-governance-efforts/bletchley-conference#1","path":["3. Promotion Initiatives and Policy Initiatives","Global Governance Efforts","bletchley conference"],"part":[1,2],"rows":[{"t":"The <b>Bletchley Declaration<\/b> is a landmark international agreement focused on the safe and responsible development of Artificial Intelligence. It was signed on November 1, 2023, during the first-ever global AI Safety Summit held at Bletchley Park in the United Kingdom."},{"t":"The declaration is historically significant because it marks the first major multilateral effort to officially recognize and address the existential and societal risks posed by advanced AI systems. It was signed by 28 countries—including major geopolitical rivals like the United States and China—as well as the European Union and India."},{"t":"Here is a breakdown of its core components, its strategic significance, and India's position on it."},{"sec":"Key Highlights of the Declaration"},{"h":"<b>Focus on \"Frontier AI\":<\/b>","t":"The document specifically targets \"frontier AI\"—highly capable, general-purpose AI foundation models (like advanced versions of ChatGPT or Claude) that can perform a wide variety of tasks and could possess dangerous capabilities that are not fully understood even by their creators."},{"h":"<b>Identification of Severe Risks:<\/b>","t":"The signatories explicitly acknowledged that AI poses potential risks in areas such as cybersecurity, biotechnology, and the spread of disinformation. It also noted the potential for \"serious, even catastrophic, harm, either deliberate or unintentional.\""},{"h":"<b>Pro-Innovation but Safety-First:<\/b>","t":"The declaration balances the need for regulation with economic growth. It emphasizes that AI should be designed, developed, deployed, and used in a manner that is safe, human-centric, trustworthy, and responsible."},{"h":"<b>Commitment to Global Cooperation:<\/b>","t":"It establishes that no single country can manage AI risks alone. The agreement calls for an internationally inclusive network of scientific research on AI safety to build an evidence-based understanding of the risks."}],"v":"5c27d9"},{"id":"ai-foundational-concepts:3-promotion-initiatives-and-policy-initi/global-governance-efforts/bletchley-conference#2","path":["3. Promotion Initiatives and Policy Initiatives","Global Governance Efforts","bletchley conference"],"part":[2,2],"rows":[{"sec":"Strategic and Geopolitical Significance"},{"h":"<b>Bridging the Divide:<\/b>","t":"The most notable achievement of the Bletchley Declaration was bringing the US, the EU, and China to the same table. Despite an ongoing tech war and export controls on semiconductors, these powers agreed on the baseline need for AI safety."},{"h":"<b>Shifting the Narrative:<\/b>","t":"Prior to this summit, international discourse primarily focused on the economic race to develop AI. The declaration formally shifted the global conversation toward safety, risk mitigation, and the necessity of \"guardrails.\""},{"h":"<b>A Precursor to Hard Law:<\/b>","t":"While the declaration is a non-binding political commitment (soft law), it lays the foundational groundwork and common vocabulary needed for future, legally binding international treaties or domestic regulatory frameworks."},{"sec":"India's Stance and Role"},{"t":"India was a key signatory to the declaration, which aligns closely with its broader diplomatic and technological strategy:"},{"h":"<b>Balancing Safety with Digital Public Infrastructure (DPI):<\/b>","t":"India has consistently advocated for a balanced approach. While acknowledging the risks (especially deepfakes and algorithmic bias affecting democratic processes), India emphasizes that regulations should not stifle the use of AI for socio-economic development, welfare delivery, and DPI."},{"h":"<b>Global South Representation:<\/b>","t":"As a leading voice for the Global South, India's presence ensures that the AI safety discourse does not just reflect Western priorities, but also addresses how AI impacts developing nations (e.g., economic disruption, language bias, and access to tech)."},{"h":"<b>Mission Digital ShramSetu:<\/b>","t":"NITI Aayog proposed this mission to harness AI to empower and upskill informal workers, bridging the digital divide."}],"v":"1b9e04"},{"id":"ai-foundational-concepts:4-challenges-way-forward-ethical-regulat","path":["4. Challenges & Way Forward (Ethical & Regulatory Framework)"],"rows":[{"h":"Main challenges:","t":"ethical issues (bias, exclusion), data privacy and security risks, lack of AI transparency (“black box” models) (countered by deep seek), intellectual property concerns (eg. artist works reproduced like ghibli style creator’s life’s work gone in seconds), and accountability (e.g., for autonomous vehicles)."},{"t":"Solutions include investing in explainable AI (XAI), inclusive AI design reflecting India’s diversity, promoting “Responsible AI for AII” strategies, and strengthening data protection laws (like the Digital Personal Data Protection Act 2023) (eg. EU AI code of practice for general purpose)"}],"v":"275662"},{"id":"ai-foundational-concepts:nobel-recognition-research","path":["Nobel Recognition & Research"],"rows":[{"t":"Nobel Physics price 2024 to John J. Hopfield (hop filed network (type of neural network that can store and reconstruct info) + Geography Hinton : Before Hinton, humans had to define features for neural networks (e.g., edges, shapes, objects in images), but his Boltzmann machine let networks discover patterns automatically."}],"v":"cd66f1"},{"id":"ai-foundational-concepts:recent-news","path":["Recent news"],"rows":[{"t":"Al alliance network (17 counteries)"}],"v":"ab9785"},{"id":"ai-foundational-concepts:small-language-models-slms","path":["SMALL LANGUAGE MODELS (SLMS)"],"rows":[{"t":"Generate text like LLM but use fewer parameters (AI's stored knowledge and intuition encoded as numbers) (eg. Anthropic (1 trillion + parameters) vs microsoft phi series (14 billion)"},{"h":"Adv :","t":"Fewer parameters mean fewer calculations so faster response, less CO2 emmissions, could be run on device (its own set of positives : privacy, no internet, personal ai agent), focus is on doing few tasks but doing them best,"},{"h":"<b>Robotics is a use case:<\/b>","t":"Local models embedded directly inside robot hardware to enable instant, low-latency physical actions"},{"h":"disadv :","t":"only can do a few tasks, smaller datasets mean a bias is more likely to creep in, Lower Accuracy on Long-Context Tasks, risk of overfitting as data is less, Hallucinations: SLMs can sometimes generate incorrect or nonsensical information"}],"v":"dbc95b"},{"id":"ai-foundational-concepts:google","path":["google"],"rows":[{"t":"AlphaGenome • Launched by Google DeepMind to predict how individual mutations in human DNA affect their functions and impact our health. It is builds upon Google DeepMind's earlier genomics model, Enformer, and complements to AlphaMissense, which specializes in categorizing the effects of variants within protein-coding regions."},{"t":"AlphaFold • Developed by Google DeepMind, predicts a protein’s 3D structure from its amino acid sequence."},{"t":"Nobel laureates Demis Hassabis and John Jumper used AlphaFold2 for predicting protein’s complex structures i.e., how proteins fold into shapes that determine their functions."},{"sec":"C2S-SCALE (CELL2SENTENCE-SCALE 27B)"},{"t":"Developed by Google DeepMind and Yale University has been designed to understand the language of individual cells and interpret complex biological interactions."},{"t":"Project Suncatcher • Launched by Google to explore AI computing in space using solarpowered satellites in low-Earth orbit."},{"t":"Ironwood • Google’s 7th-generation Tensor Processing Unit (TPU), designed to enhance performance of AI models."}],"v":"b51846"},{"id":"ai-foundational-concepts:jevons-paradox-and-solow-paradox","path":["JEVONS PARADOX AND SOLOW PARADOX"],"rows":[{"h":"Jevons Paradox:","t":"Technological progress that makes a resource cheaper or more efficient to use often leads to an increase in demand for that resource."},{"h":"Solow Paradox:","t":"Describes the phenomenon where extensive use of advanced technology, such as computers, does not result in an expected increase in productivity."}],"v":"83e63e"}]},{"id":"big-data","subj":"s02","name":"BIG DATA","cards":[{"id":"big-data:main#1","path":[],"part":[1,3],"rows":[{"t":"Big data refers to collection of data that is too large to be processed or analyzed by traditional computing systems."},{"sec":"Core Characteristics"},{"t":"(3 V’s : volume, variety and velocity (new uploads) eg. YouTube (Major Initiatives for Big Data in India: Establishment of Centre of Excellence, National Data
