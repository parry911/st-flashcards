,{"path":[],"roles":["effect","gov","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">deaths mostly of farmers and labourers in open fields<\/span><br><span class=\"li\">livestock lost<\/span><br><span class=\"li\">power and telecom damage<\/span><\/span>","h":"<b>Effects<\/b>:"},{"t":"Indians initiative : India has developed a lightning <mark>early warning<\/mark> system, providing forecasts from five days to three hours in advance, Public Awareness Campaigns e.g., avoiding open fields, not sheltering under trees), Lightning Action Plans, Damini App: Developed by IITM, this mobile app provides location-specific lightning warnings within a 20–40 km radius, valid for 40 minutes","h":"<b>Scheme<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">now a notified disaster (16th FC) → SDRF money for lightning arresters and shelters<\/span><br><span class=\"li\">last-mile Damini alerts<\/span><br><span class=\"li\">awareness in Bihar, UP villages<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"lightning:effect-main","v":"f95dc8","q":"Who dies from lightning, India&#x27;s warning system, and the way forward?"}],"circle":"y"},{"id":"cyclone","subj":"s05","name":"Cyclone","cards":[{"path":[],"roles":["def","cause"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">India exposed to 10% of the world’s tropical cyclones<\/span><br><span class=\"li\">Over 8,000 km of India's coastline, spanning both east and west, faces the hazards of tropical cyclones, storm surges, and heavy rainfall<\/span><\/span>","h":"<b>Extent<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">warm sea (above ~26.5°C)<\/span><br><span class=\"li\">Coriolis force<\/span><br><span class=\"li\">low wind shear<\/span><br><span class=\"li\">the IPCC AR6 Report, which states that the proportion of intense tropical cyclones (Category 4-5) and their peak wind speeds will increase globally with warming.<\/span><\/span>","h":"<b>Causes<\/b>:"}],"id":"cyclone:def-main","v":"a84414","q":"How exposed is India to cyclones, and what makes them form and grow stronger?"},{"path":[],"roles":["effect","eg"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\"><mark>storm surge<\/mark>, high winds and floods → deaths, homes and crops lost<\/span><br><span class=\"li\">farmland salinised<\/span><br><span class=\"li\">coastal erosion<\/span><br><span class=\"li\">power and ports hit<\/span><\/span>","h":"<b>Effects<\/b>:"},{"t":"Recent occurrences: cyclone Dana (2024) (Odisha), cyclone Fengal (2024) (Tamil Nadu) and Puducherry cyclone Remal (2024)","h":"<b>Examples<\/b>:"},{"sec":"Cyclone Montha (October 2025):"},{"t":"Cyclone Shakti (October 2025)"},{"sec":"Cyclone Ditwah (November–December 2025):"}],"id":"cyclone:effect-main","v":"774309","q":"What do cyclones do, and the recent ones?"},{"path":[],"roles":["gov","fix"],"rows":[{"t":"India follows a multi-sectoral approach to mitigate cyclone risks. The NDMA Guidelines (2008) focus on <mark>early warning<\/mark> systems via IMD’s satellite (colour coding) and Doppler radar networks, aircraft probing for cyclone cores, structural safety with shelters, roads, and <mark>bio-shields<\/mark>, and a four-color warning code (Green to Red).","h":"<b>NDMA guideline / scheme<\/b>:"},{"t":"The National Cyclone Risk Mitigation Project (NCRMP) targets 13 cyclone-prone states/UTs, implementing both structural and non-structural measures with coordination between NDMA, state governments, NIDM, and partial World Bank funding. These measures aim to protect lives, infrastructure, and coastal ecosystems.","cont":1},{"t":"Odisha is the first state to establish state disaster management authority"},{"t":"<span class=\"lst\"><span class=\"li\">Odisha's zero-casualty model everywhere<\/span><br><span class=\"li\">mangrove bio-shields<\/span><br><span class=\"li\">cyclone-resilient housing and shelters<\/span><br><span class=\"li\">last-mile warnings<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"cyclone:gov-main","v":"8e2171","q":"NDMA&#x27;s cyclone approach, Odisha&#x27;s role, and the way forward?"}],"circle":"y"},{"id":"drought","subj":"s05","name":"Drought","cards":[{"path":[],"roles":["def","cause"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Defined as area where rainfall deficiency is more than or equal to 26%<\/span><br><span class=\"li\">Around 68% of India's land is prone to drought in varying degrees. Over 500 of India’s 718 districts report meteorological drought conditions, ranging from mildly to extremely dry<\/span><\/span>","h":"<b>Definition & extent<\/b>:"},{"t":"Drought: prolonged rainfall deficit, persistent high-pressure/blocked circulation, El Niño/large-scale climate modes, over-extraction of groundwater, deforestation/land-use change, poor water management. (El Niño / La Niña → see 🟡 Extreme Weather Events)","h":"<b>Causes<\/b>:"},{"t":"Cherrapunji paradox (The Cherrapunji Paradox (often called the \"Scarcity in Abundance\" paradox) refers to the ironic situation where the world’s wettest place on Earth—Cherrapunji (Sohra) and nearby Mawsynram—suffers from acute drinking water shortages and drought-like conditions during the non-monsoon months.)"}],"id":"drought:def-main","v":"53fe46","q":"How is drought defined, how drought-prone is India, its causes and the Cherrapunji paradox?"},{"path":[],"roles":["effect","eg"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">crop failure → farm distress and debt<\/span><br><span class=\"li\">drinking water and fodder shortage<\/span><br><span class=\"li\">distress migration<\/span><br><span class=\"li\">more groundwater pumping<\/span><\/span>","h":"<b>Effects<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Recent examples: Rayalaseema (Andhra Pradesh 2024), South American drought (2024), Europe (2022)<\/span><br><span class=\"li\">two to name in India: 2015–16 Marathwada (Latur got drinking water by train)<\/span><br><span class=\"li\">2002 all-India drought (monsoon ~19% short, El Niño year)<\/span><\/span>","h":"<b>Examples<\/b>:"}],"id":"drought:effect-main","v":"5e5c13","q":"What does drought do, with examples?"},{"path":[],"roles":["gov","fix"],"rows":[{"t":"The NDMA Guidelines focus on state-level Drought Monitoring Cells, real-time vulnerability mapping, and ICT-based control rooms. Measures include watershed development, automatic weather stations, cloud seeding policies (Cloud seeding: silver iodide or dry ice sprayed into clouds → droplets form → rain (IIT Kanpur trial, Delhi) → risks: floods, toxic silver iodide, unclear cost), drought insurance, short-duration seeds, fodder banks, and market support.","h":"<b>NDMA guideline / scheme<\/b>:"},{"t":"Afforestation with suitable species and biodiesel plantations are encouraged. Capacity building programs target PRIs and ULBs for effective drought management. The Drought Prone Area Development Programme (DPAP), launched in 1973–74, uses a watershed-based approach to restore ecological balance, improve socio-economic conditions of vulnerable communities, and enhance agricultural productivity through soil, water, and vegetation management","cont":1},{"t":"reactive (emergency food and drink), proactive (<mark>early warning<\/mark> systems, de-stocking of food), prospective dating with it (Climate smart agriculture systems + DRR strategies).","h":"<b>Way forward<\/b>:"}],"id":"drought:gov-main","v":"26aa58","q":"NDMA&#x27;s drought measures and the way forward?","read":1}],"circle":"g","pyq":["<b>2014 Q14 (12.5 marks):<\/b> Drought has been recognized as a disaster in view of its spatial expanse, temporal duration, slow onset and lasting effects on vulnerable sections. With a focus on the September 2010 guidelines from the National Disaster Management Authority (NDMA), discuss the mechanisms for preparedness to deal with likely El Nino and La Nina fallouts in India."]},{"id":"wildfires","subj":"s05","name":"Wildfires","cards":[{"path":[],"roles":["def","cause"],"rows":[{"t":"More than 36% of the country’s forest cover has been estimated to be prone to frequent forest fires. Nearly 4% of the country’s forest cover is extremely prone to fire, whereas 6% of forest cover is found to be very highly fire prone. In 16 years to 2021, forest fires in India rose.","h":"<b>Extent<\/b>:"},{"t":"Causes: Wildfires are primarily triggered by human activities (like field burning or unattended campfires), dry weather and climate change, flammable invasive species (e.g., lantana camara, pine), and poor forest management (absence of firebreaks, unmaintained forest floors). Shifting cultivation (slash and burn, burn gets outta hand)","h":"<b>Causes<\/b>:"},{"t":"lightning strikes, human ignition (campfires, arson, agricultural burning), prolonged drought and heatwaves, strong winds, fuel accumulation (dead biomass), poor land/forest management.","h":"Wildfires:"}],"id":"wildfires:def-main","v":"c647bf","q":"How fire-prone are India&#x27;s forests, and what starts wildfires?"},{"path":[],"roles":["effect","eg"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">biodiversity and <mark>carbon sink<\/mark> lost<\/span><br><span class=\"li\">smoke and haze<\/span><br><span class=\"li\">soil erosion<\/span><br><span class=\"li\">forest livelihoods hit<\/span><\/span>","h":"<b>Effects<\/b>:"},{"t":"Uttarakhand forest fires (2024)","h":"<b>Examples<\/b>:"}],"id":"wildfires:effect-main","v":"2742b7","q":"What do wildfires do, with an example?"},{"path":[],"roles":["gov","fix"],"rows":[{"t":"Mitigation: India focuses on prevention, <mark>early warning<\/mark>, and response. Key initiatives include the Forest Fire Prevention & Management Scheme (community participation and awareness), FSI’s Pre-Warning Alert System, and the Large Forest Fire Monitoring Programme (2019) using SNPP-VIIRS data for real-time alerts. The Burnt Area Assessment uses IRS AWiFS data to map affected zones and guide response measures. National Action Plan on Forest Fires (NAPFF, 2018)","h":"<b>Scheme<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">firebreaks<\/span><br><span class=\"li\">community fire watchers<\/span><br><span class=\"li\">clear lantana and pine litter<\/span><br><span class=\"li\">early alerts to the last village<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"wildfires:gov-main","v":"01741a","q":"India&#x27;s forest fire measures and the way forward?"}],"circle":"y"},{"id":"industrial-accidents","subj":"s05","name":"Industrial Accidents","cards":[{"path":[],"roles":["def","cause"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">The National Disaster Management Authority (NDMA) highlights industrial accidents involving chemical, biological, and radioactive materials as significant hazards.<\/span><br><span class=\"li\">India has approximately 1861 Major Accident Hazard (MAH) sites<\/span><\/span>","h":"<b>Extent<\/b>:"},{"t":"Causes: Inadequate safety regulations and enforcement (Factories Act 1948), human error, lack of training, poor maintenance of equipment (2019 Visakhapatnam gas leak), insufficient investment in safety infrastructure.","h":"<b>Causes<\/b>:"}],"id":"industrial-accidents:def-main","v":"8400b6","q":"How big is the industrial accident risk in India, and the causes?"},{"path":[],"roles":["effect","eg"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">deaths and long-term illness<\/span><br><span class=\"li\">air, water and soil contamination<\/span><br><span class=\"li\">economic loss<\/span><\/span>","h":"<b>Effects<\/b>:"},{"t":"Key industrial disasters: Gujarat Factory Fire (2025), Thane Chemical Unit Explosion (2024), Korba Chimney Collapse (2009)","h":"<b>Examples<\/b>:"},{"t":"methyl isocyanate leak from Union Carbide → thousands dead, ~5 lakh affected","h":"<mark>Bhopal<\/mark>, Dec 1984:"},{"t":"<span class=\"lst\"><span class=\"li\">styrene vapour leak during COVID restart → 12 dead<\/span><br><span class=\"li\">plant ran without valid environmental clearance → NGT interim fine ₹50 cr<\/span><\/span>","h":"Vizag LG Polymers, May 2020:"}],"id":"industrial-accidents:effect-main","v":"fd4816","q":"What do industrial accidents do, with key examples?"},{"path":[],"roles":["gov","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">absolute liability (MC Mehta, Oleum gas leak 1986)<\/span><br><span class=\"li\">EPA 1986<\/span><br><span class=\"li\"><mark>MSIHC<\/mark> Rules 1989<\/span><br><span class=\"li\">Public Liability Insurance Act 1991<\/span><br><span class=\"li\">NDMA Chemical Disaster Guidelines 2007<\/span><\/span>","h":"<b>Law / scheme<\/b>:"},{"t":"Solutions: same as above (no changes allowed)","h":"<b>Way forward<\/b>:"}],"id":"industrial-accidents:gov-main","v":"6ae433","q":"The law on industrial accidents, and the way forward?"}],"circle":"y"},{"id":"stampedes","subj":"s05","name":"Stampedes","cards":[{"path":[],"roles":["def","cause"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Over 79% of stampedes in India occur at religious events, where terrain, infrastructure, and crowd management are particularly challenging e.g., 340 deaths at Mandhardevi temple (MH), 250 deaths at Chamunda Devi temple (Jodhpur, RJ)<\/span><br><span class=\"li\">~4,000 stampedes in the last 3 decades (UNDRR: surge of people when danger or loss of space is felt)<\/span><\/span>","h":"<b>Extent<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Causes: Overcrowding (events like Maha Kumbh Mela and RCB celebration), poor crowd management, inadequate infrastructure, panic triggers (rumors or accidents)<\/span><br><span class=\"li\"><mark>Chinnaswamy<\/mark>, Bengaluru (Jun 2025: ~2.5 lakh people vs 34,600 capacity + free-pass post without police coordination)<\/span><br><span class=\"li\">Mintz (cooperation breaks) and Smelser (craze) theories<\/span><br><span class=\"li\">little tech (crowd-density analytics)<\/span><\/span>","h":"<b>Causes<\/b>:"}],"id":"stampedes:def-main","v":"754456","q":"How common are stampedes, where, and why do they happen?"},{"path":[],"roles":["effect","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">deaths by crushing and asphyxia<\/span><br><span class=\"li\">injuries<\/span><br><span class=\"li\">loss of trust in event management<\/span><\/span>","h":"<b>Effects<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">NDMA guide on Managing Crowd at Events and Venues of Mass Gathering (2014) → stampede = man-made disaster; capacity planning<\/span><br><span class=\"li\">risk and vulnerability analysis<\/span><br><span class=\"li\"><mark>FMEA<\/mark> (severity, frequency, detection)<\/span><br><span class=\"li\">Art 19(1)(b)<\/span><br><span class=\"li\">Police Act 1861<\/span><\/span>","h":"<b>NDMA guideline<\/b>:"}],"id":"stampedes:effect-main","v":"736c66","q":"What do stampedes do, and NDMA&#x27;s crowd guidelines?"},{"path":[],"roles":["fix"],"rows":[{"t":"Solutions: <mark>FIST Model<\/mark> (Crowd Behaviour Analysis): Fruin, a renowned theorist, proposed the <mark>FIST model<\/mark> to understand crowd behavior and stampede causes. F: Crowd Force, I: Information upon which the crowd acts, S: Physical Space involved, T: Time. Utility: This model helps in developing proactive strategies by addressing these four elements during event risk management planning.","h":"<b>Way forward<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">crowd-density norms per sq m (New York: trained crowd managers for 1,000+)<\/span><br><span class=\"li\">wide, multiple exits<\/span><br><span class=\"li\">RFID/IoT (Kumbh, Vaishno Devi), AI CCTV and drones (Hajj)<\/span><br><span class=\"li\">learn from Mumbai's 2024 T20 roadshow<\/span><\/span>","cont":1}],"title":"<b>Way forward<\/b>:","id":"stampedes:fix-way-forward","v":"97ed5b","q":"What is the FIST model, and other crowd-safety fixes?"}],"circle":"y"},{"id":"heatwaves","subj":"s05","name":"Heatwaves","cards":[{"path":[],"roles":["def","cause"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Criteria by IMD: plains max temp 40°C, coastal 37°C and 30°C in hills → heatwave if departure from normal is 4.5–6.4°C (severe: above 6.4°C) or actual max is 45°C+ (severe: 47°C+)<\/span><br><span class=\"li\">must hold at 2 stations in a sub-division for 2 days in a row (declared on day 2)<\/span><br><span class=\"li\">13 to 15% of population is highly vulnerable, though latest estimates show over 57% of Indian districts (roughly 75% of the population) face high to very-high heat risk<\/span><br><span class=\"li\">heat stress = body temp above 37°C; <mark>heat risk<\/mark> = chance of illness or death (intensity + exposure + vulnerability) (CEEW, 734 districts)<\/span><\/span>","h":"<b>Definition & extent<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Causes: Anticyclonic conditions<\/span><br><span class=\"li\">absence of moisture and cloudless sky, reasons for increasing heatwaves (El Nino, <mark>urban heat island<\/mark> effect, climate change, westerly winds from Iran/Pakistan), plus rising incidence of very warm nights and relative humidity reducing the body’s recovery ability<\/span><br><span class=\"li\">warm nights rising faster than warm days (2012–22)<\/span><br><span class=\"li\">N India humidity 30–40% → 40–50%<\/span><\/span>","h":"<b>Causes<\/b>:"}],"id":"heatwaves:def-main","v":"0fa1e7","q":"How does IMD declare a heatwave, who is vulnerable, and why are heatwaves rising?"},{"path":[],"roles":["effect","eg"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">10k people dead (2000–2020) though current health surveillance misses the wider burden of heart, lung, and kidney conditions worsened by heat, high energy demand due to cooling facilities, 5.8 work hours lost because of it<\/span><br><span class=\"li\">93% of species' ranges exposed by 2085<\/span><br><span class=\"li\">rice and wheat at risk (Ganga, Indus basins)<\/span><br><span class=\"li\">up to 40% fall in work capacity (wet-bulb extremes)<\/span><\/span>","h":"<b>Effects<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Examples: Andhra Pradesh + Telangana, May 2015 (~2,000+ deaths)<\/span><br><span class=\"li\">North India, May–June 2024 (Churu 50.5°C, 40,000+ suspected heatstroke cases)<\/span><\/span>","h":"<b>Examples<\/b>:"}],"id":"heatwaves:effect-main","v":"031397","q":"What do heatwaves do, with examples?"},{"path":[],"roles":["gov","fix"],"rows":[{"t":"Initiatives: IMD (green, yellow, orange, red), heat action plans by IMD, heat index launched by IMD, newly added as India’s 14th notified natural calamity (removing the 10% SDRF cap and unlocking full State Disaster Response/Mitigation Funds), 16th Finance Commission increased disaster funds by 28% • •","h":"<b>Scheme<\/b>:"},{"t":"NDMA guidelines: same as all, mandated <mark>Heat Action Plans<\/mark> (HAPs) which need expansion from the current 300 cities to 4,800 urban local bodies, requirement to convert HAPs into fundable projects, link solutions to development schemes, and utilize pre-agreed <mark>parametric insurance<\/mark> (automatic payouts on temperature thresholds)","h":"<b>NDMA guideline → way forward<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">plan for warm nights too<\/span><br><span class=\"li\">MHA: heatwaves eligible for SDMF projects<\/span><br><span class=\"li\">declare heat a disaster where >50% districts face high risk<\/span><br><span class=\"li\">National HAP Repository<\/span><br><span class=\"li\">heat-tolerant crops and breeds<\/span><\/span>","cont":1}],"id":"heatwaves:gov-main","v":"803478","q":"India&#x27;s heatwave measures, and the way forward?"}],"circle":"y"},{"id":"glacier-lake-outburst-flood-glof","subj":"s05","name":"Glacier Lake Outburst Flood (GLOF)","cards":[{"path":[],"roles":["def","cause"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Definition: Sudden release of large water volume retained in glacier<\/span><br><span class=\"li\">>31,000 glacial lakes growing in High Mountain Asia (IIT Roorkee)<\/span><br><span class=\"li\">34 of 100 lakes over 10 ha growing (CWC)<\/span><br><span class=\"li\">since 1990 lake number / area / volume up 53% / 51% / 48%<\/span><\/span>","h":"<b>Definition<\/b>:"},{"t":"Causes: Rapid glacier advance; moraine/ice dam failure, seismic activity; human activities (urbanisation, mining, deforestation, hydropower, GHGs)","h":"<b>Causes<\/b>:"}],"id":"glacier-lake-outburst-flood-glof:def-main","v":"3c0fea","q":"What is a GLOF, how fast are glacial lakes growing, and the causes?"},{"path":[],"roles":["effect","eg"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Vulnerability: >9M people in High Mountain Asia at risk; glaciers may lose 30–50% volume (2015–2100, <mark>ICIMOD<\/mark>)<\/span><br><span class=\"li\">flash floods and debris wipe out villages, roads and hydel dams downstream (Chungthang dam, 2023)<\/span><br><span class=\"li\">HKH (8 nations): 70–80% of glacier volume may go by 2100 at high emissions (ICIMOD)<\/span><br><span class=\"li\">7,500 lakes above 4,500 m, hard to monitor<\/span><br><span class=\"li\">IHR ~100 mn tourists a year<\/span><\/span>","h":"<b>Effects<\/b>:"},{"t":"Examples: Uttarkashi (2025), South Lhonak–Sikkim (2023), Kedarnath (2013), Chamoli (2021)","h":"<b>Examples<\/b>:"},{"t":"Update the Chamoli (2021) was  a Sturzstrom / Rock-Ice Avalanche that transformed into a debris flood, distinguishing it from moraine-dammed breach GLOFs (like South Lhonak, 2023)."}],"id":"glacier-lake-outburst-flood-glof:effect-main","v":"683ed0","q":"Who is at risk from GLOFs, what they do, and examples?"},{"path":[],"roles":["gov","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Mitigation: NDMA 2020 guidelines; structural (reservoirs, depressions, embankments); <mark>early warning<\/mark> at 56 at-risk lakes; CEA hydro slope stability guidelines; risk projects in HP, UK, Sikkim, Arunachal<\/span><br><span class=\"li\">National GLOF Risk Mitigation Project (same 4 states)<\/span><br><span class=\"li\"><mark>CWC monitors 900+ lakes<\/mark><\/span><br><span class=\"li\">risk-indexing criteria<\/span><\/span>","h":"<b>NDMA guideline<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">NRSC 24x7 lake watch<\/span><br><span class=\"li\">GSI landslide mapping<\/span><br><span class=\"li\">ICIMOD HKH cryosphere initiative<\/span><\/span>","cont":1},{"t":"Way Forward: Latest research (Himalayas, Alps, Tian Shan, Andes); collaboration among experts/policymakers; structural + non-structural measures (breaching, siphoning, outlet structures); advanced monitoring & early warning via satellites, GIS, remote sensing","h":"<b>Way forward<\/b>:"},{"t":"Sturzstrom → see 🟡 Sturzstrom heading","h":"<b>Related<\/b>:"}],"id":"glacier-lake-outburst-flood-glof:gov-main","v":"298097","q":"India&#x27;s GLOF measures, and the way forward?"}],"circle":"y"},{"id":"fire-safety","subj":"s05","name":"Fire Safety","cards":[{"path":[],"roles":["def","cause"],"rows":[{"t":"Status (2022): 7,435 deaths in 7,500+ fires (NCRB). → <mark>5,888 deaths<\/mark> (2024, NCRB)","h":"<b>Extent<\/b>:"},{"t":"Causes – Non-compliance (examples: Delhi coaching centres, Kumbakonam School 2004, AMRI Hospital 2011)","h":"<b>Causes<\/b>:"}],"id":"fire-safety:def-main","v":"366da9","q":"How many die in fires in India, and why?"},{"path":[],"roles":["effect","eg"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">most deaths from smoke<\/span><br><span class=\"li\">crowded buildings become traps (hospitals, coaching centres)<\/span><br><span class=\"li\">economic loss<\/span><\/span>","h":"<b>Effects<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Recent: Rajkot gaming zone, Harda firecracker factory, Delhi hospital<\/span><br><span class=\"li\">Kochi Brahmapuram waste fire (2023)<\/span><br><span class=\"li\">Mukherjee Nagar coaching centre (2023)<\/span><br><span class=\"li\">Cuttack hospital and Delhi building fires (2026)<\/span><br><span class=\"li\">North Goa night club<\/span><\/span>","h":"<b>Examples<\/b>:"}],"id":"fire-safety:effect-main","v":"322daf","q":"What makes fires deadly, with recent examples?"},{"path":[],"roles":["gov","issue","fix"],"rows":[{"t":"Standards – Fire service: state subject; NBC (BIS) central standard; states must adopt. Also: Model Building Bye Laws 2016, Fire & Life Safety guidelines, Model Bill 2019","h":"<b>Law / standards<\/b>:"},{"t":"No uniform law; NBC advisory; staff/equipment shortage (2019: 5,191 stations, 5,03,365 staff); urban issues (Kamala Mills fire 2017)","h":"Challenges –"},{"t":"<span class=\"lst\"><span class=\"li\">Fire services = Art 243W, 12th Schedule (ULBs)<\/span><br><span class=\"li\">NBC 2016 (BIS)<\/span><br><span class=\"li\">SFAC (MHA)<\/span><br><span class=\"li\">Scheme for Expansion & Modernisation of Fire Services (15th FC)<\/span><\/span>"},{"t":"<span class=\"lst\"><span class=\"li\">Way Forward (NDMA) – <mark>State Fire Act<\/mark>; outreach to block/GP level; district-level fire chiefs; indigenous low-water tech R&D<\/span><br><span class=\"li\">third-party fire audits before NOCs<\/span><br><span class=\"li\">AI-based HIRA<\/span><br><span class=\"li\">fire tax<\/span><br><span class=\"li\">community fire prevention (China)<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"fire-safety:gov-main","v":"4256d9","q":"Fire-safety law and standards, the gaps, and the way forward?"}],"circle":"y"},{"id":"dams","subj":"s05","name":"Dams","cards":[{"path":[],"roles":["def","cause"],"rows":[{"t":"India is the 3rd largest dam-owning nation with 6,628 specified dams (Maharashtra most), after the USA and China","h":"<b>Extent<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Ageing infrastructure: 80% of Indian dams are over 25 years old, raising safety concerns (about 26% over 50 years)<\/span><br><span class=\"li\">Also: reservoirs lost about 19% storage to silt, average age 42 years (CWC)<\/span><br><span class=\"li\">GLOF risk (Chungthang dam, Sikkim 2023)<\/span><\/span>","h":"<b>Causes of failure<\/b>:"},{"t":"Indian dams can be vulnerable to earthquakes (e.g., Bhuj, 2001)","h":"Seismic vulnerability:"}],"id":"dams:def-main","v":"ecb7d9","q":"How many dams India has, and why they can fail?"},{"path":[],"roles":["effect","eg"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">sudden flood wave downstream → deaths, towns wiped out<\/span><br><span class=\"li\">farmland, power and water supply lost<\/span><\/span>","h":"<b>Effects<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Major dam failures: 1975 (Banqiao dam in China), 1979 (Macchchu dam in Morbi GJ), 2023 (Derna dam, Libya)<\/span><br><span class=\"li\">South Fork (USA 1889)<\/span><\/span>","h":"<b>Examples<\/b>:"}],"id":"dams:effect-main","v":"712290","q":"What does a dam failure do, with examples?"},{"path":[],"roles":["gov","fix"],"rows":[{"t":"Dam rehab and improvement, Dam health and rehab monitoring; The <mark>Dam Safety Act<\/mark>, 2021 established a 4-tier institutional mechanism at central and state levels","h":"<b>Law / scheme<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">NRLD<\/span><br><span class=\"li\">DRIP<\/span><br><span class=\"li\">SHAISYS<\/span><br><span class=\"li\">DHARMA app<\/span><\/span>","h":"Tools:"},{"t":"<span class=\"lst\"><span class=\"li\">National Centre for Earthquake Safety of Dams (MNIT Jaipur) → next: sediment bypass (Japan)<\/span><br><span class=\"li\">lifecycle management<\/span><br><span class=\"li\">IoT sensors<\/span><\/span>","cont":1},{"t":"Way forward: advanced technologies like ROVs and drones for underwater inspections, integrated water management, considering alternatives to large dams","h":"<b>Way forward<\/b>:"}],"id":"dams:gov-main","v":"d8c1ce","q":"The Dam Safety Act and dam-safety tools, and the way forward?"}],"circle":"g","pyq":["<b>2023 Q7 (10 marks):<\/b> Dam failures are always catastrophic, especially on the downstream side, resulting in a colossal loss of life and property. Analyze the various causes of dam failures. Give two examples of large dam failures."]},{"id":"new-technology-for-disaster-management","subj":"s05","name":"New Technology for Disaster Management","cards":[{"path":[],"roles":["gov","eg"],"rows":[{"t":"India uses tech-driven disaster measures for cyclone, flood, lightning, and GLOF preparedness through risk mapping tools (Web-DCRA, Flood Hazard Atlas, Glacial Lake Dataset), IMD forecasting with satellites and apps (Damini, Mausam), and integrated <mark>early warning<\/mark> systems — Common Alerting Protocol (CAP) for multi-channel alerts, National Cyclone Risk Mitigation Project (NCRMP) for cyclone-prone coastal states, and <mark>SACHET<\/mark> dashboard/app for localized multilingual alerts"},{"t":"NDRF & ERSS-112 ensure rapid rescue during emergencies, while public drills build awareness"},{"t":"Global leadership includes G20 DRR, tsunami warning systems, and humanitarian aid under Vasudhaiva Kutumbakam"},{"t":"Operation Brahma — India's HADR mission to Myanmar following the 2025 earthquake — in the spirit of Vasudhaiva Kutumbakam Press Information Bureau (add alongside the existing Operation Dost mention for Turkiye/Syria)."},{"t":"<span class=\"lst\"><span class=\"li\">Wayanad 2024 (worked: Army built a 190-ft Bailey bridge in about a day and a half for rescue)<\/span><br><span class=\"li\"><mark>cell broadcast<\/mark> alert tests across India (2023)<\/span><\/span>","h":"<b>Examples<\/b>:"}],"id":"new-technology-for-disaster-management:gov-main","v":"65582f","q":"How does India use technology and global leadership in disasters, with examples?","read":1},{"path":[],"roles":["gov"],"rows":[{"sec":"16th Finance Commission (Chair: Arvind Panagariya) — Disaster Management Recommendations"},{"sec":"Total Corpus — Big Increase"},{"t":"Total corpus of ₹2,04,401 crore recommended for SDRF + SDMF for 2026-31. Press Information Bureau This is a 27% increase over the 15th FC's ₹1,60,153 crore."},{"sec":"Landmark: Heatwaves and Lightning Added to Notified Disasters"},{"t":"The Commission recommended adding heatwaves and lightning to India's national list of notified disasters, citing rising deaths and climate change."}],"id":"new-technology-for-disaster-management:gov-main-2","v":"576b1c","q":"What did the 16th Finance Commission recommend on disaster funds?"},{"path":[],"roles":["fact","issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">DRR financing (GP2025: India showed the world's largest DRR finance system): 15th FC (2021–26) allocations over ₹2.32 lakh cr (~$28 bn)<\/span><br><span class=\"li\"><mark>Disaster Risk Index<\/mark> (hazard 70 + vulnerability 30, BPL as proxy) to share funds<\/span><br><span class=\"li\">NDMF/SDMF (mitigation), NDRF (100% Centre, \"severe\" calamity), SDRF (75:25; 90:10 Himalayan & NE)<\/span><\/span>"},{"t":"<span class=\"lst\"><span class=\"li\">only 2% of aid goes to DRR<\/span><br><span class=\"li\">losses doubled in 20 years<\/span><br><span class=\"li\">$1 on DRR saves $15<\/span><\/span>","h":"GAR 2025:"},{"t":"<span class=\"lst\"><span class=\"li\">DRI one-size (misses hilly, coastal)<\/span><br><span class=\"li\">\"severe\" not defined in DM Act<\/span><br><span class=\"li\">₹4 lakh per death unchanged for a decade<\/span><br><span class=\"li\">slow, step-by-step release<\/span><\/span>","h":"Issues:"},{"t":"<span class=\"lst\"><span class=\"li\">blended finance, debt-for-resilience swaps<\/span><br><span class=\"li\">layered financing<\/span><br><span class=\"li\">adaptive DRI / NDMA composite index<\/span><br><span class=\"li\">FEMA-style per-capita thresholds<\/span><br><span class=\"li\">review every 5 years<\/span><\/span>","h":"Way forward:"}],"id":"new-technology-for-disaster-management:fact-main","v":"efdd80","q":"How does India finance DRR, what&#x27;s wrong with it, and the way forward?"}],"circle":"g","pyq":["<b>2020 Q18 (15 marks):<\/b> Discuss the recent measures initiated in disaster management by the Government of India departing from the earlier reactive approach."]},{"id":"meaning","subj":"s06","name":"Meaning","cards":[{"path":[],"roles":["def"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">assessment of +ve and -ve impact of a proposed project on env't, social & economic costs (UNEP)<\/span><br><span class=\"li\">process of <mark>identifying, predicting, evaluating and mitigating<\/mark> its effects before decisions are taken and commitments made (IAIA)<\/span><\/span>","h":"EIA :"},{"t":"<span class=\"lst\"><span class=\"li\">NEPA 1970 (USA) → India: <mark>EIA Notification 2006 under EPA 1986<\/mark><\/span><br><span class=\"li\">makes policy makers justify decisions on studies and public comments<\/span><\/span>","h":"Origin :"},{"t":"<mark>Rapid EIA<\/mark> (1 season data, not monsoon) vs <mark>Comprehensive EIA<\/mark> (all 4 seasons)","h":"Types :"},{"t":"<span class=\"lst\"><span class=\"li\">A → Centre clears (Expert Appraisal Committee)<\/span><br><span class=\"li\">B → state SEIAA (B1 needs EIA, B2 exempt)<\/span><br><span class=\"li\">exempt: border highways within 100 km, solar, wind, hydro &lt;25 MW<\/span><\/span>","h":"Categories :"}],"id":"meaning:def-main","v":"17b7f8","q":"What is EIA, where does it come from, its types and its project categories?"}],"pyq":["<b>2019 Q17 (15 marks):<\/b> Define the concept of carrying capacity of an ecosystem as relevant to an environment. Explain how understanding this concept is vital while planning for sustainable development of a region."],"group":"EIA notes"},{"id":"process-with-drawback-of-each-stage","subj":"s06","name":"Process (with drawback of each stage)","cards":[{"path":[],"roles":["how","issue"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">clears projects unlikely to harm, by size/location (school no EIA vs coal mining must) → drawback: even small industrial units (rubber) harm<\/span><br><span class=\"li\"><mark>no study shows projects below a limit are harmless<\/mark><\/span><\/span>","h":"Screening :"},{"t":"<span class=\"lst\"><span class=\"li\">if screening doesn't clear → review available data<\/span><br><span class=\"li\">key impacts<\/span><br><span class=\"li\">predict extent → <mark>early warning system<\/mark><\/span><\/span>","h":"Preliminary assessment :"},{"t":"<span class=\"lst\"><span class=\"li\">formed by developer → drawback: no social scientists, anthropologists, ecologists<\/span><br><span class=\"li\"><mark>conflict of interest<\/mark><\/span><\/span>","h":"EIA team :"},{"t":"<span class=\"lst\"><span class=\"li\">study covers all important issues after talking to govt, experts, civil society, locals → drawback: <mark>public comments ignored<\/mark><\/span><br><span class=\"li\">only major impacts covered<\/span><\/span>","h":"Scoping :"}],"id":"process-with-drawback-of-each-stage:how-main","v":"4e53bf","q":"EIA stages from screening to scoping, and the drawback at each?"},{"path":[],"roles":["how","issue"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Identification (what will happen?)<\/span><br><span class=\"li\">Prediction (how much change?)<\/span><br><span class=\"li\">Evaluation (does it matter? local acceptance, consultation, standards)<\/span><br><span class=\"li\">Mitigation (what can be done?)<\/span><br><span class=\"li\">Documentation (report for decision makers: exec summary, impacts, mitigation measures, gaps + summary for public)<\/span><\/span>","h":"Main EIA (5 questions) :"},{"t":"<span class=\"lst\"><span class=\"li\">unreliable data<\/span><br><span class=\"li\">local knowledge ignored<\/span><\/span>","h":"Identification → drawback:"},{"t":"<span class=\"lst\"><span class=\"li\">maths models → drawback: method not disclosed<\/span><br><span class=\"li\">uncertainty<\/span><\/span>","h":"Prediction :"},{"t":"<span class=\"lst\"><span class=\"li\">change site/route/process/raw material<\/span><br><span class=\"li\">pollution control<\/span><br><span class=\"li\">restoration, money to displaced, CSR<\/span><br><span class=\"li\">compare alternatives (cost-benefit, matrix) → drawback: <mark>stays on paper<\/mark><\/span><\/span>","h":"Mitigation :"},{"t":"<span class=\"lst\"><span class=\"li\">some kept confidential (nuclear)<\/span><br><span class=\"li\">community left out<\/span><br><span class=\"li\">no disaster plan (Uttarakhand floods)<\/span><\/span>","cont":1}],"title":"Main EIA (5 questions) :","id":"process-with-drawback-of-each-stage:how-main-eia-5-questions","v":"b07712","q":"The five questions of the main EIA, and the drawbacks of each step?"},{"path":[],"roles":["how"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">panel = SPCB rep<\/span><br><span class=\"li\">DC<\/span><br><span class=\"li\">state env't ministry rep<\/span><\/span>","h":"Public hearing :"},{"t":"<span class=\"lst\"><span class=\"li\">project's ministry rep<\/span><br><span class=\"li\">≤3 local body reps (PRI/ULB)<\/span><br><span class=\"li\">≤3 senior citizens picked by DC<\/span><\/span>","cont":1},{"t":"<mark>exempt: mining ≤25 ha, highway widening, irrigation modernisation, SEZ/EPZ units<\/mark>","cont":1},{"t":"EIA → SPCB review → public hearing → IAA (MoEF) → Expert Appraisal Committee (site visit if needed) → MoEF final review → clearance (<mark>too many layers of bureaucracy<\/mark>)","h":"Appraisal :"},{"img":8},{"t":"<mark>Environment Audit Rules 2025<\/mark> → certified, randomly assigned third-party auditors check compliance (EIA = before project, audit = after it starts)","h":"After clearance :"}],"id":"process-with-drawback-of-each-stage:how-main-2","v":"22409a","q":"Who sits on a public hearing, the appraisal chain, and what happens after clearance?"}],"group":"EIA notes"},{"id":"2006-vs-draft-2020-pyq-2020","subj":"s06","name":"2006 vs Draft 2020 (PYQ 2020)","cards":[{"path":[],"roles":["tbl"],"rows":[{"h":"Public hearing","t":"<span class=\"th\">2006<\/span> 30 days<br><span class=\"th\">Draft 2020<\/span> 20 days"},{"h":"Post-facto clearance","t":"<span class=\"th\">2006<\/span> Not allowed<br><span class=\"th\">Draft 2020<\/span> Allowed"},{"h":"Compliance reports","t":"<span class=\"th\">2006<\/span> Twice a year<br><span class=\"th\">Draft 2020<\/span> Once a year"},{"h":"Exemptions","t":"<span class=\"th\">2006<\/span> Few<br><span class=\"th\">Draft 2020<\/span> Many (highways, defence, \"strategic\")"},{"t":"<span class=\"lst\"><span class=\"li\">UN Special Rapporteurs objected<\/span><br><span class=\"li\"><mark>courts rejected post-facto clearance<\/mark> (LG Polymers, Vizag)<\/span><\/span>","h":"Pushback :"}],"table":1,"head":["","2006","Draft 2020"],"id":"2006-vs-draft-2020-pyq-2020:tbl-main","v":"e9eb3d","q":"How does the draft EIA 2020 differ from EIA 2006, and how did people push back?"}],"pyq":["<b>2020 Q7 (10 marks):<\/b> How does the draft Environment Impact Assessment (EIA) Notification, 2020 differ from the existing EIA Notification, 2006?"],"group":"EIA notes"},{"id":"problems","subj":"s06","name":"Problems","cards":[{"path":[],"roles":["issue"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\"><mark>incomplete, false data<\/mark> (no central data bank)<\/span><br><span class=\"li\">single season data<\/span><br><span class=\"li\"><mark>bulky, technical, only in English<\/mark><\/span><\/span>","h":"Reports :"},{"t":"<span class=\"lst\"><span class=\"li\"><mark>consultant paid by proponent<\/mark><\/span><br><span class=\"li\"><mark>doubtful expertise<\/mark> (Odisha: Reliance project EIA by Berhampur Univ, no Olive Ridley expertise; Mithivirdi nuclear EIA questioned by Greenpeace)<\/span><br><span class=\"li\">copy-paste reports (Sterlite)<\/span><\/span>","cont":1},{"t":"<span class=\"lst\"><span class=\"li\">many exemptions (now critical minerals too)<\/span><br><span class=\"li\"><mark>opinions ignored<\/mark><\/span><br><span class=\"li\"><mark>low literacy in tribal areas<\/mark> (Niyamgiri palli sabha)<\/span><\/span>","h":"Public hearing :"},{"t":"<span class=\"lst\"><span class=\"li\"><mark>documents late<\/mark><\/span><br><span class=\"li\"><mark>minutes lack fidelity<\/mark><\/span><br><span class=\"li\"><mark>local admin sides with project<\/mark><\/span><\/span>","cont":1},{"t":"<span class=\"lst\"><span class=\"li\">for Category A and B1 → public hearing near the site<\/span><br><span class=\"li\">written responses → run by SPCB/UTPCC → proceedings to the regulator within 45 days<\/span><br><span class=\"li\">now exempt: mining of atomic, critical, strategic minerals (thorium from monazite, rare earths for defence) → concerns: weakens Art 21 and 48A<\/span><\/span>","h":"Public consultation (EIA 2006):"},{"t":"<span class=\"lst\"><span class=\"li\">Silkyara tunnel (Char Dham) was exempt and collapsed in 2023<\/span><br><span class=\"li\">Sterlite<\/span><br><span class=\"li\">Aarhus Convention 1998<\/span><\/span>","cont":1}],"id":"problems:issue-main","v":"df7cd6","q":"What&#x27;s wrong with EIA reports and public hearings?"},{"path":[],"roles":["issue"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">site work starts before EIA<\/span><br><span class=\"li\"><mark>clearance despite objection, no reasons given<\/mark><\/span><br><span class=\"li\">closed-door after hearing<\/span><br><span class=\"li\"><mark>~238 days delay<\/mark><\/span><\/span>","h":"Clearance :"},{"t":"<span class=\"lst\"><span class=\"li\">MoEF regional offices <mark>lax in monitoring<\/mark> (people don't know the standards, SPCB has its own)<\/span><br><span class=\"li\">weak follow-up (Vizhinjam)<\/span><br><span class=\"li\">appeals: <mark>NEAA heard only ~15 cases in 8 yrs<\/mark> (NEAA replaced by NGT, 2010)<\/span><\/span>","h":"After clearance :"},{"t":"<span class=\"lst\"><span class=\"li\"><mark>Vanashakti 2025 ban on post-facto clearance recalled<\/mark> (May 2025 struck down ex-post ECs → Nov 2025 recalled 2:1 on review → Vanashakti III, Jul 2026: prior EC mandatory + 2017 one-time window upheld + 2021 OM quashed for the future, old ex-post ECs stay)<\/span><br><span class=\"li\"><mark>land before EIA for non-coal mining<\/mark> (Dec 2025)<\/span><br><span class=\"li\">Aravalli 100 m definition<\/span><br><span class=\"li\">no transboundary EIA (India not in Espoo 1991)<\/span><\/span>","h":"Dilution now :"}],"id":"problems:issue-main-2","v":"6c217b","q":"What goes wrong at clearance and after it, and how is EIA being diluted now?"}],"group":"EIA notes"},{"id":"way-forward","subj":"s06","name":"Way forward","cards":[{"path":[],"roles":["fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\"><mark>Independent EIA authority<\/mark> (judicial officers + civil society, env't, scientists)<\/span><br><span class=\"li\">central fund deposited by developers<\/span><br><span class=\"li\">accredited list of consultants<\/span><\/span>"},{"t":"<span class=\"lst\"><span class=\"li\"><mark>explaining → discussing → voting<\/mark><\/span><br><span class=\"li\">video recording<\/span><br><span class=\"li\">true minutes<\/span><br><span class=\"li\">local language<\/span><\/span>","h":"Public hearing in 3 phases :"},{"t":"<span class=\"lst\"><span class=\"li\"><mark>Reasons for approval/rejection in clear terms<\/mark><\/span><br><span class=\"li\">expert meeting minutes public<\/span><br><span class=\"li\">balanced expert committee (env't experts, sociologists)<\/span><\/span>"}],"id":"way-forward:fix-main","v":"3914e3","q":"How do we fix EIA: an independent authority, better hearings, reasons on record?"},{"path":[],"roles":["fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\"><mark>MoEF regional offices with experts<\/mark><\/span><br><span class=\"li\">local communities in monitoring<\/span><br><span class=\"li\">info desk on clearance status<\/span><br><span class=\"li\"><mark>capacity building<\/mark> of communities, NGOs, judges<\/span><\/span>"},{"t":"<span class=\"lst\"><span class=\"li\"><mark>Trim exemptions<\/mark><\/span><br><span class=\"li\">no rapid EIA<\/span><br><span class=\"li\"><mark>assess biodiversity<\/mark><\/span><br><span class=\"li\"><mark>disaster plan<\/mark><\/span><\/span>"},{"t":"<span class=\"lst\"><span class=\"li\"><mark>Strategic Env't Assessment<\/mark> (sector-wide)<\/span><br><span class=\"li\">cumulative, regional EIA<\/span><br><span class=\"li\">standalone EIA law<\/span><br><span class=\"li\">independent post-clearance audit (UK model)<\/span><\/span>","cont":1}],"id":"way-forward:fix-main-2","v":"d1b5c8","q":"Better monitoring after clearance, and reforms to the EIA system itself?"}],"group":"EIA notes"},{"id":"cases","subj":"s06","name":"Cases","cards":[{"path":[],"roles":["fact"],"rows":[{"t":"MC Mehta 1986 (<mark>absolute liability<\/mark>)"},{"t":"Godavarman 1995","cont":1},{"t":"Vellore Citizens 1996 (<mark>polluter pays, precautionary principle<\/mark>)","cont":1},{"t":"MC Mehta v Kamal Nath 1996 (<mark>public trust<\/mark>)","cont":1},{"t":"Arts 21, 48A, 51A(g)","cont":1}],"id":"cases:fact-main","v":"c211b6","q":"The key environmental cases and constitutional provisions behind EIA?"}],"group":"EIA notes"},{"id":"ngos-and-activists-pyq-2024","subj":"s06","name":"NGOs and activists (PYQ 2024)","cards":[{"path":[],"roles":["eg"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">translate reports<\/span><br><span class=\"li\">bring people to hearings<\/span><br><span class=\"li\">file objections<\/span><br><span class=\"li\">go to NGT/SC<\/span><br><span class=\"li\">expose copy-paste reports and violations<\/span><\/span>","h":"Role :"},{"t":"KSSP campaign → Kunthipuzha dam dropped → National Park 1984","h":"<mark>Silent Valley<\/mark> :"},{"t":"Dongria Kondh vs Vedanta bauxite → SC let gram sabhas decide → <mark>all 12 said no<\/mark>","h":"<mark>Niyamgiri 2013<\/mark> :"},{"t":"exposed illegal iron-ore mining (Shah Commission) → SC cancelled 88 lease renewals (2018)","h":"<mark>Goa Foundation<\/mark> :"},{"t":"NGT 2016 suspended Nyamjang Chhu hydro clearance (black-necked crane site ignored)","h":"<mark>Save Mon Region Federation<\/mark> :"}],"id":"ngos-and-activists-pyq-2024:eg-main","v":"dd85d9","q":"What do NGOs and activists do in EIA, with four examples?"}],"pyq":["<b>2024 Q8 (10 marks):<\/b> What role do environmental NGOs and activists play in influencing Environmental Impact Assessment (EIA) outcomes for major projects in India? Cite four examples with all important details."],"group":"EIA notes"},{"id":"coal-pithead-plants-pyq-2014","subj":"s06","name":"Coal pithead plants (PYQ 2014)","cards":[{"path":[],"roles":["issue"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Plant at the mine (no rail haul) but <mark>pollution piles up in one place<\/mark> (Singrauli, Korba)<\/span><br><span class=\"li\">fly-ash dyke breaches (Sasan 2020)<\/span><br><span class=\"li\">SO₂, NOx, PM, mercury<\/span><br><span class=\"li\">heavy water use, hot water discharge<\/span><br><span class=\"li\">forest and farmland lost<\/span><\/span>"},{"t":"<span class=\"lst\"><span class=\"li\">fluorosis, lung disease → 2015 emission norms (scrubber deadlines extended → Jul 2025: Category C plants, ~78%, away from big cities and critically polluted areas, exempted from FGD; only stack height)<\/span><br><span class=\"li\"><mark>Fly Ash Notification 2021 (100% use)<\/mark><\/span><br><span class=\"li\">cumulative EIA<\/span><br><span class=\"li\">green belts<\/span><\/span>","cont":1}],"id":"coal-pithead-plants-pyq-2014:issue-main","v":"f41b6f","q":"Environmental impacts of coal pithead plants, and the norms on them?"}],"pyq":["<b>2014 Q15 (12.5 marks):<\/b> Environmental Impact Assessment studies are increasingly undertaken before a project is cleared by the Government. Discuss the environmental impacts of coal-fired thermal plants located at coal pitheads."],"group":"EIA notes"},{"id":"rehabilitation-pyq-2016","subj":"s06","name":"Rehabilitation (PYQ 2016)","cards":[{"path":[],"roles":["issue","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\"><mark>Tribals ~40% of people displaced<\/mark> by projects (Ken-Betwa ~20,000, Hasdeo Arand, Mumbai Coastal Road)<\/span><br><span class=\"li\">land, community ties, livelihood lost → <mark>RFCTLARR 2013<\/mark>: social impact assessment<\/span><br><span class=\"li\">consent (80% private, 70% PPP)<\/span><br><span class=\"li\">compensation up to 4x rural, 2x urban → <mark>land for land<\/mark><\/span><\/span>"},{"t":"<span class=\"lst\"><span class=\"li\">job or annuity<\/span><br><span class=\"li\">skill training<\/span><br><span class=\"li\">resettle whole village together<\/span><br><span class=\"li\">gram sabha consent (PESA, FRA)<\/span><\/span>","cont":1}],"id":"rehabilitation-pyq-2016:issue-main","v":"e914ab","q":"Who gets displaced by projects, what they lose, and what RFCTLARR 2013 promises?"}],"pyq":["<b>2016 Q14 (12.5 marks):<\/b> Rehabilitation of human settlements is one of the important environmental impacts which always attracts controversy while planning major projects. Discuss the measures suggested for mitigation of this impact while proposing major developmental projects."],"group":"EIA notes"},{"id":"sdgs","subj":"s06","name":"SDGs","cards":[{"path":[],"roles":["fact"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">17 goals, 169 targets → <mark>only 17% on track<\/mark> (SDR 2025), India 99th<\/span><br><span class=\"li\">~$4 tn a year finance gap → <mark>Sevilla Commitment<\/mark> (FfD4, 2025)<\/span><\/span>"}],"id":"sdgs:fact-main","v":"3d09e8","q":"How are the SDGs doing, India&#x27;s rank, and the finance gap?"}],"group":"EIA notes"}],"pin":{"kw":"<b>ENVIRONMENT<\/b> (keywords to use : circular economy, Resource Decoupling, Extended Producer Responsibility (EPR), Cradle-to-Cradle, Common But Differentiated Responsibilities, Just Transition, Bioremediation: Using microorganisms to clean env, Keystone Species (species on which other depend), Blended Finance (PPP for green capital), Greenwashing, greenium, compensatory afforestation), Phytoremediation (t uses living green plants, to absorb, degrade, or stabilize toxic pollutants, environmental supplement plan ( undertake project to benefit environment because broke 2006 rules)","pf":"(It is a planned, coordinated effort to reduce risk, build resilience, and protect lives and livelihoods.) (any disaster strategies : <b>PARFREII<\/b> (preparation thru monitoring (safe infra), awareness, risk assessment , finance, recovery, early warning, inter agency coordination, implementation via capacity building )"},"notion":"https://app.notion.com/p/4221111b206d80b0a97fe118421fe6d8","title":"Environment &amp; DM","subtitle":"GS3 · 6 sections · 136 topics · 391 cards","img":{"0":"img/env/00.jpg","1":"img/env/01.jpg","2":"img/env/02.jpg","3":"img/env/03.jpg","4":"img/env/04.jpg","5":"img/env/05.jpg","6":"img/env/06.jpg","7":"img/env/07.jpg","8":"img/env/08.jpg"}}};

<script>
(function(){
"use strict";
let DK="st"; try{ if(DECKS.env&&localStorage.getItem("deckpick.v1")==="env") DK="env"; }catch(e){}
const DECK=DECKS[DK], ENV=DK==="env";
const KEY=ENV?"envdeck.v1":"stdeck.v1";
const CIRC={g:"🟢",y:"🟡",w:"⚪"}, UNIT=ENV?"section":"subject";
const BUILD="updated 24 Nov";
const $=s=>document.querySelector(s);
const SUBJ={}; DECK.subjects.forEach(s=>SUBJ[s.id]=s.name);
const IMG=DECK.img||{};

/* ---------- deck switch: each deck keeps its own place, progress and schedule ---------- */
(function deckbar(){
  const el=$("#deckbar"); if(!DECKS.env){ el.style.display="none"; return; }
  if(ENV) document.title="Environment & DM Flashcards";
  el.querySelectorAll("button").forEach(b=>{ b.classList.toggle("on",b.dataset.d===DK);
    b.onclick=()=>{ if(b.dataset.d===DK) return; try{localStorage.setItem("deckpick.v1",b.dataset.d);}catch(e){} location.reload(); }; });
})();
/* ---------- pinned box (word for word from the notes) ---------- */
const PINKEY=ENV?"envpin.v1":"stpin.v1";
(function pin(){
  const P=DECK.pin, el=$("#pin");
  if(ENV){ $("#pinOne").textContent="Keywords to use · PARFREII";
    $("#pinIn").innerHTML=`<div class="kw">${P.kw}</div><div class="vd">${P.pf}</div>`; }
  else{
  $("#pinOne").textContent=P.heads.join(", ");
  $("#pinIn").innerHTML=`<div class="lead">${P.lead}</div><ul>${P.heads.map(h=>`<li>${h}</li>`).join("")}</ul><div class="niche">${P.niche}</div><div class="vd">${P.vd}</div>`;
  }
  let open=null; try{open=localStorage.getItem(PINKEY);}catch(e){}
  el.open=open===null?false:open==="1";
  el.addEventListener("toggle",()=>{ if(matchMedia("(min-width:1060px)").matches) return; try{localStorage.setItem(PINKEY,el.open?"1":"0");}catch(e){} });
  const wide=()=>{ if(matchMedia("(min-width:1060px)").matches) el.open=true; else{ let o=null; try{o=localStorage.getItem(PINKEY);}catch(e){} el.open=o==="1"; } };
  wide(); matchMedia("(min-width:1060px)").addEventListener("change",wide);
})();

/* ---------- build cards ---------- */
const cards={}, groups=[];
DECK.topics.forEach(t=>{
  const g={key:t.id,subj:t.subj,name:t.name,ids:[],circle:t.circle||null,pyq:(t.pyq||[]).length};
  t.cards.forEach(c=>{
    const nrow=c.rows.filter(r=>"t" in r).length;
    cards[c.id]={id:c.id,topic:t,payload:c,count:nrow};
    g.ids.push(c.id);
  });
  groups.push(g);
});

/* ---------- state ---------- */
let S=load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.v===1) return s;}catch(e){}
  return {v:1,subj:"all",topic:"all",mode:"order",missed:false,queue:null,pos:0,st:{},back:false};
}
let lastSig=null;
const placeSig=()=>[S.subj,S.topic,S.mode,S.missed,S.pos,S.round,(S.queue||[]).length,(S.queue||[])[0],(S.queue||[])[S.pos]].join("|");
function save(){const sig=placeSig(); if(sig!==lastSig){ if(lastSig!==null){S.at=Date.now(); setTimeout(()=>{try{queueSync();}catch(e){}},0);} lastSig=sig; }
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const isMissed=id=>S.st[id]&&S.st[id].s==="m";
function circOK(g){ if(!ENV||!g.circle) return true; return !(S.circ&&S.circ[g.circle]===false); }   /* topics with no circle always show */
function scopeGroups(){ return groups.filter(g=>(S.subj==="all"||g.subj===S.subj)&&(S.topic==="all"?circOK(g):g.key===S.topic)); }
function filteredGroups(){ return scopeGroups().map(g=>{let ids=g.ids; if(S.missed) ids=ids.filter(isMissed); return {key:g.key,ids};}).filter(g=>g.ids.length); }
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
/* Smart order: weakest first, then cards due for review, new cards mixed in, well-known cards last.
   A known card comes due again after 1, 3, 7, 14, 30 or 60 days, longer the more often you've got it right. */
const DAY=864e5, GAPS=[1,3,7,14,30,60];
function smartQueue(ids){
  const now=Date.now(), weak=[], due=[], fresh=[], later=[];
  ids.forEach(id=>{const o=S.st[id];
    if(!o||!o.s){ fresh.push(id); return; }
    if(o.s==="m"){ weak.push([id,-(o.miss/Math.max(1,o.seen)),o.t||0]); return; }
    const strength=Math.max(1,(o.seen-o.miss)-o.miss), gap=GAPS[Math.min(strength,GAPS.length)-1]*DAY, over=(now-(o.t||0))/gap;
    (over>=1?due:later).push([id,-over]); });
  weak.sort((a,b)=>a[1]-b[1]||a[2]-b[2]); due.sort((a,b)=>a[1]-b[1]); later.sort((a,b)=>a[1]-b[1]);
  const rev=weak.concat(due).map(x=>x[0]), q=[]; let i=0,j=0;
  while(i<rev.length||j<fresh.length){ for(let k=0;k<2&&i<rev.length;k++) q.push(rev[i++]); if(j<fresh.length) q.push(fresh[j++]); }
  S.dueN=q.length; return q.concat(later.map(x=>x[0]));
}
function buildQueue(){
  let gs=filteredGroups(), q;
  if(S.mode==="order"){ q=gs.flatMap(g=>g.ids); }
  else if(S.mode==="topics"){
    gs=shuffle(gs); const miss=gs.filter(g=>g.ids.some(isMissed)), rest=gs.filter(g=>!g.ids.some(isMissed));
    q=miss.concat(rest).flatMap(g=>g.ids);
  } else if(S.mode==="smart"){ q=smartQueue(gs.flatMap(g=>g.ids)); }
  else { const all=shuffle(gs.flatMap(g=>g.ids)); q=all.filter(isMissed).concat(all.filter(i=>!isMissed(i))); }
  if(S.mode!=="smart") S.dueN=null;
  S.queue=q; S.round=1; S.pos=0; S.back=false; save();
}
function validQueue(){return Array.isArray(S.queue)&&S.queue.every(id=>cards[id]);}
if(Array.isArray(S.queue)&&S.queue.length&&!validQueue()){ /* cards removed in a deck update: skip them, keep your place */
  const gone=S.queue.slice(0,S.pos).filter(id=>!cards[id]).length;
  S.queue=S.queue.filter(id=>cards[id]); S.pos=Math.max(0,Math.min(S.pos-gone,S.queue.length));
}
if(S.subj!=="all"&&!SUBJ[S.subj]){S.subj="all";S.topic="all";}
if(S.topic!=="all"&&!groups.some(g=>g.key===S.topic)) S.topic="all";
if(!validQueue()||!S.queue.length) buildQueue();

/* ---------- reveal state ---------- */
let R=null;
function resetReveal(c){
  const rows=c.payload.rows, idx=[]; rows.forEach((r,i)=>{ if("t" in r) idx.push(i); });
  R={id:c.id,idx,steps:idx.map(()=>0),pre:idx.map(()=>false),marks:idx.map(()=>null)};
  const rec=S.st[c.id], r=rec&&rec.r&&(!rec.v||rec.v===c.payload.v)&&rec.v?rec.r:null;
  if(r&&r.some(x=>x===0)){ R.part=true; r.forEach((x,i)=>{ if(x===1&&i<R.steps.length){ R.steps[i]=1; R.pre[i]=true; } }); }
}
const allDone=()=>!R||R.steps.every(s=>s>=1);

/* ---------- render ---------- */
function counts(ids){let k=0,m=0; ids.forEach(id=>{const s=S.st[id]; if(s&&s.s==="k")k++; else if(s&&s.s==="m")m++;}); return {k,m,n:ids.length-k-m,t:ids.length};}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function render(){
  $("#title").innerHTML=DECK.title; $("#subtitle").textContent=DECK.subtitle+" · "+BUILD;
  document.querySelectorAll("#modeSeg button").forEach(b=>b.classList.toggle("on",b.dataset.v===S.mode));
  if(ENV){ document.querySelector(".selrow").style.display="none"; $("#envNav").style.display=""; renderNavBar(); }
  else{

  };
}
function jumpTo(a){ const q=a.queue.filter(id=>cards[id]); if(!q.length) return; let pos=q.indexOf(a.queue[a.pos]); if(pos<0) pos=Math.min(a.pos,q.length-1);
  Object.assign(S,{subj:a.subj||"all",topic:a.topic||"all",mode:a.mode,missed:!!a.missed,queue:q,pos,round:a.round||1,dueN:a.dueN,back:false}); R=null; save(); render(); window.scrollTo(0,0); toast("Moved to card "+(pos+1)); }
async function onSheet(){
  syncSheet(`<h3>Sync is on</h3><p>Checking…</p>`);
  try{ const g=await gh("/gists/"+SY.gist); remoteAt=newestOther(await readDocs(g)); }catch(e){}
  const other=!!(remoteAt&&Array.isArray(remoteAt.queue));
  const where=other?`Your other device was last on <b>card ${remoteAt.pos+1}</b>${remoteAt.t>1e12?" at "+hhmm(new Date(remoteAt.t)):""}.`:"Your other device hasn't saved a place yet. Open the site there once.";
  syncSheet(`<h3>Sync is on</h3><p>Progress and your place in the deck save to your private GitHub gist.${SY.last?" Last synced "+hhmm(new Date(SY.last))+".":""}</p><p>${where}</p>
   ${other?'<div class="row" style="justify-content:flex-end;margin-bottom:10px"><button class="btn got" style="flex:0 0 auto" id="sJump">Go to that card</button></div>':""}
   <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="sOff">Turn off here</button><button class="btn ghost" id="sClose">Close</button><button class="btn" style="flex:0 0 auto" id="sNow">Sync now</button></div>`);
  $("#sClose").onclick=closeSync;
  $("#sNow").onclick=async()=>{closeSync(); await syncNow();};
  if(other) $("#sJump").onclick=()=>{closeSync(); jumpTo(remoteAt);};
  $("#sOff").onclick=()=>{SY=null; saveSY(); closeSync(); syncLabel("Sync across devices"); toast("Sync off on this device");};
}
$("#syncBtn").onclick=()=>{ if(!SY) setupSheet(); else if(/fix/.test(st8)) setupSheet(); else if(/retry/.test(st8)) syncNow(); else onSheet(); };
$("#smodal").onclick=e=>{if(e.target.id==="smodal") closeSync();};
document.addEventListener("visibilitychange",()=>{ if(!SY) return; if(document.visibilityState==="visible") syncNow(); else if(sTimer) syncNow(); });
syncLabel(SY?"Syncing…":"Sync across devices"); if(SY) syncNow();
setInterval(()=>{ if(SY&&document.visibilityState==="visible"&&!sTimer&&!syncing) syncNow(); },20000);
$("#pmodal").onclick=e=>{if(e.target.id==="pmodal") $("#pmodal").classList.remove("on");};
$("#resetBtn").onclick=()=>$("#modal").classList.add("on");
$("#mCancel").onclick=()=>$("#modal").classList.remove("on");
$("#mOk").onclick=()=>{const keep={subj:S.subj,topic:S.topic,mode:S.mode}; S={v:1,...keep,missed:false,queue:null,pos:0,st:{},back:false,resetAt:Date.now()}; queueSync(); buildQueue(); R=null; $("#modal").classList.remove("on"); render(); toast("Progress reset");};
let tt; function toast(m){const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),1600);}
document.addEventListener("keydown",e=>{
  if($("#lightbox").classList.contains("on")){ if(e.key==="Escape"||e.key===" "||e.key==="Enter"){e.preventDefault(); $("#lightbox").classList.remove("on");} return; }
  if($("#modal").classList.contains("on")||$("#pmodal").classList.contains("on")||$("#smodal").classList.contains("on")||$("#qmodal").classList.contains("on")) return;
  if(e.target.tagName==="SELECT"||e.target.tagName==="INPUT"||e.target.tagName==="SUMMARY") return;
  if(!S.queue.length||S.pos>=S.queue.length) return;
  if(e.key===" "||e.key==="Enter"){e.preventDefault(); if(!S.back) flip(); else if(!nextStep()) unflip(); }
  else if(S.back&&(e.key==="1"||e.key==="m")) grade("m");
  else if(S.back&&(e.key==="2"||e.key==="g")) grade("k");
  else if(S.back&&e.key==="a") showAll();
  else if(e.key==="ArrowLeft") prev();
  else if(e.key==="ArrowRight") next();
});
/* ---------- Environment & DM: section list (tap a section to open its topics), circle filter, PYQ star ---------- */
let OPEN=null;
function navLabel(){ if(S.topic!=="all"){ const g=groups.find(x=>x.key===S.topic); if(g) return (g.circle?CIRC[g.circle]+" ":"")+strip(g.name); }
  return S.subj==="all"?"All sections":SUBJ[S.subj]; }
function renderNavBar(){
  $("#navLbl").textContent=navLabel();
  document.querySelectorAll("#circRow button").forEach(b=>b.classList.toggle("on",!(S.circ&&S.circ[b.dataset.c]===false)));
  if($("#navPanel").classList.contains("on")) renderNav();
}
function renderNav(){
  const all=groups.filter(circOK).reduce((n,g)=>n+g.ids.length,0);
  const rows=[`<div class="nv all${S.subj==="all"?" cur":""}" data-a="all"><span>All sections</span><small>${all} cards</small></div>`];
  DECK.subjects.forEach(s=>{
    const ts=groups.filter(g=>g.subj===s.id&&circOK(g)), open=OPEN===s.id;
    rows.push(`<div class="nv sec${open?" open":""}${S.subj===s.id&&S.topic==="all"?" cur":""}" data-s="${s.id}"><span>${esc(s.name)}</span><small>${ts.length} topics</small><i>${open?"▲":"▼"}</i></div>`);
    if(open) rows.push(`<div class="nv tp whole${S.subj===s.id&&S.topic==="all"?" cur":""}" data-w="${s.id}"><span>Whole section</span><small>${ts.reduce((n,g)=>n+g.ids.length,0)}</small></div>`);
    if(open) ts.forEach(g=>rows.push(`<div class="nv tp${S.topic===g.key?" cur":""}" data-t="${g.key}"><span>${g.circle?CIRC[g.circle]+" ":""}${esc(strip(g.name))}${g.pyq?' <b class="st">★</b>':""}</span><small>${g.ids.length}</small></div>`));
  });
  const p=$("#navPanel"); p.innerHTML=rows.join("");
  p.querySelectorAll(".nv").forEach(el=>el.onclick=e=>{ e.stopPropagation();
    if(el.dataset.a){ closeNav(); S.subj="all"; S.topic="all"; rebuild("All sections"); }
    else if(el.dataset.s){ OPEN=OPEN===el.dataset.s?null:el.dataset.s; renderNav();   /* tap opens the topics, tap again folds them */
      if(OPEN) p.querySelector('[data-s="'+OPEN+'"]').scrollIntoView({block:"nearest"}); }
    else if(el.dataset.w){ closeNav(); S.subj=el.dataset.w; S.topic="all"; rebuild(SUBJ[S.subj]); }
    else if(el.dataset.t){ const g=groups.find(x=>x.key===el.dataset.t); closeNav(); S.subj=g.subj; S.topic=g.key; rebuild(strip(g.name)); }
  });
}
function closeNav(){ $("#navPanel").classList.remove("on"); }
if(ENV){
  $("#navBtn").onclick=e=>{ e.stopPropagation(); const p=$("#navPanel"); if(p.classList.contains("on")){ closeNav(); return; }
    OPEN=S.subj==="all"?null:S.subj; renderNav(); p.classList.add("on"); };
  document.addEventListener("click",e=>{ if(!e.target.closest("#envNav")) closeNav(); });
  document.querySelectorAll("#circRow button").forEach(b=>b.onclick=()=>{ const c=b.dataset.c; S.circ=Object.assign({g:true,y:true,w:true},S.circ||{});
    if(S.circ[c]&&["g","y","w"].filter(k=>S.circ[k]).length===1){ toast("Keep at least one"); return; }
    S.circ[c]=!S.circ[c]; rebuild("Showing "+["g","y","w"].filter(k=>S.circ[k]).map(k=>CIRC[k]).join(" ")); });
}
const pyqHTML=t=>`<h3>★ PYQs · ${esc(strip(t.name))}</h3><ul class="pq">${t.pyq.map(q=>`<li>${q}</li>`).join("")}</ul>`;
const WIDEQ="(min-width:1400px)";
function bindStar(c){ document.querySelectorAll("[data-pyq]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); openPYQ(c.topic); }); }
function openPYQ(t){
  if(matchMedia(WIDEQ).matches){ S.pyqSide=true; save(); sidePYQ(); return; }
  $("#qbox").innerHTML=pyqHTML(t)+`<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn ghost" id="qClose">Close</button></div>`;
  $("#qmodal").classList.add("on"); $("#qClose").onclick=()=>$("#qmodal").classList.remove("on");
}
function sidePYQ(){
  const el=$("#pyqSide"); if(!ENV){ el.style.display="none"; return; }
  const c=S.queue&&S.pos<S.queue.length?cards[S.queue[S.pos]]:null, t=c&&c.topic;
  const show=!!(S.pyqSide&&matchMedia(WIDEQ).matches&&t&&t.pyq&&t.pyq.length);
  el.style.display=show?"block":"none"; if(!show) return;
  el.innerHTML=`<button class="x" id="qx" aria-label="Close">×</button>`+pyqHTML(t);
  $("#qx").onclick=()=>{ S.pyqSide=false; save(); sidePYQ(); };
}
$("#qmodal").onclick=e=>{ if(e.target.id==="qmodal") $("#qmodal").classList.remove("on"); };
matchMedia(WIDEQ).addEventListener("change",sidePYQ);
$("#progBtn").textContent="Progress by "+UNIT;
render();
})();
</script>
</body>
