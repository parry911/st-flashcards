ywords FAME"},{"sec":"FAME I (2015)"},{"sec":"Focused on:"},{"t":"<span class=\"lst\"><span class=\"li\">EV technology<\/span><br><span class=\"li\">pilot projects<\/span><\/span>"},{"sec":"FAME II (2019-2024)"},{"t":"<b>₹10,000 crore<\/b>","h":"Budget:"},{"sec":"Targets included:"},{"t":"<span class=\"lst\"><span class=\"li\">7,000 e-buses<\/span><br><span class=\"li\">5 lakh e-3-wheelers<\/span><br><span class=\"li\">10 lakh e-2-wheelers<\/span><br><span class=\"li\">55,000 electric cars.<\/span><\/span>"}],"title":"FAME I and II","id":"electric-vehicles:gov-fame-i-and-ii","v":"f5fa62"},{"path":["PM E-DRIVE Scheme (2024)"],"roles":["gov"],"rows":[{"t":"<b>₹10,900 crore<\/b>","h":"Budget:"},{"sec":"Focus:"},{"t":"<span class=\"lst\"><span class=\"li\">electric buses<\/span><br><span class=\"li\">trucks<\/span><br><span class=\"li\">ambulances<\/span><br><span class=\"li\">charging infrastructure<\/span><br><span class=\"li\">battery manufacturing.<\/span><\/span>"},{"sec":"PLI for Advanced Chemistry Cell Batterie","tg":1},{"sec":"Goal:"},{"t":"build <b>50 GWh battery manufacturing capacity<\/b>."},{"sec":"what are ACC","tg":1},{"t":"<b>Advanced Chemistry Cell (ACC) batteries<\/b> are <b>next-generation rechargeable batteries that store electrical energy using advanced chemical technologies<\/b>."},{"t":"<span class=\"lst\"><span class=\"li\">Lithium-Ion Batteries (Most Common)<\/span><br><span class=\"li\">Solid-State Batteries (Next Generation)<\/span><br><span class=\"li\">Sodium-Ion Batteries<\/span><br><span class=\"li\">Lithium-Sulfur Batteries<\/span><br><span class=\"li\">Metal-Air Batteries<\/span><\/span>"}],"title":"PM E-DRIVE Scheme (2024)","id":"electric-vehicles:gov-pm-e-drive-scheme-2024","v":"556bc8"}]},{"id":"hydrogen-production","subj":"s11","name":"HYDROGEN PRODUCTION","cards":[{"path":[],"roles":["tbl"],"rows":[{"h":"<b>Green<\/b>","t":"<span class=\"th\">Source Material<\/span> Water<br><span class=\"th\">Production Process<\/span> Electrolysis (Renewable power)<br><span class=\"th\">Carbon Emissions<\/span> Zero"},{"h":"<b>Blue<\/b>","t":"<span class=\"th\">Source Material<\/span> Natural Gas<br><span class=\"th\">Production Process<\/span> SMR + Carbon Capture (CCS)<br><span class=\"th\">Carbon Emissions<\/span> Low"},{"h":"<b>Grey<\/b>","t":"<span class=\"th\">Source Material<\/span> Natural Gas<br><span class=\"th\">Production Process<\/span> Steam Methane Reforming (SMR)<br><span class=\"th\">Carbon Emissions<\/span> High"},{"h":"<b>Black/Brown<\/b>","t":"<span class=\"th\">Source Material<\/span> Coal / Lignite<br><span class=\"th\">Production Process<\/span> Gasification<br><span class=\"th\">Carbon Emissions<\/span> Very High"},{"h":"<b>Pink<\/b>","t":"<span class=\"th\">Source Material<\/span> Water<br><span class=\"th\">Production Process<\/span> Electrolysis (Nuclear power)<br><span class=\"th\">Carbon Emissions<\/span> Zero"},{"h":"<b>Turquoise<\/b>","t":"<span class=\"th\">Source Material<\/span> Natural Gas<br><span class=\"th\">Production Process<\/span> Methane Pyrolysis<br><span class=\"th\">Carbon Emissions<\/span> Solid Carbon (No $CO_2$)"}],"table":1,"head":["Hydrogen Type","Source Material","Production Process","Carbon Emissions"],"id":"hydrogen-production:tbl-main","v":"7a7fd6"}]},{"id":"hyperloop-technology","subj":"s11","name":"HYPERLOOP TECHNOLOGY","cards":[{"path":[],"roles":["def","how"],"rows":[{"t":"he technology significantly builds on “gravity vacuum tube,” “gravity vacuum transit,” or “high-speed tube transportation. meaning : there’s a magnetic levitation (maglev) train system that uses one set of magnets to repel cars so that they hover above a track and another set of magnets to propel them forward over the track."},{"t":"It enables the theoretical speed of 1,200 km/h."},{"img":19}],"title":"Technology Overview","id":"hyperloop-technology:def-technology-overview","v":"054333"},{"path":[],"roles":["use","issue"],"rows":[{"t":"High Speed: Over 1000 km/h, Eliminates human error, 10-30 sec intervals arrival, Less affected by weather, Easier tunnels, smaller stations, Carries large containers, cuts truck emissions, 2-3 times more efficient, uses maglev and low-pressure design, stores electricity","h":"Adv :"},{"sec":"Implementation Challenges"},{"t":"~$25-$27 million per mile (excluding land costs) as per NASA, Fire inside pods is a major risk despite fire-resistant tubes, Vacuum Maintenance, Lateral/vertical acceleration >2 m/s² can cause motion sickness.","h":"Issues :"}],"title":"Advantages","id":"hyperloop-technology:use-advantages","v":"b282f4"}]},{"id":"desalination-technology","subj":"s11","name":"DESALINATION TECHNOLOGY","cards":[{"path":[],"roles":["news","how"],"rows":[{"t":"Recently IIT Madra developed a graphene based desalination tech : Freshwater scarcity is a growing global issue, with less than 0.05% of water easily accessible, making desalination an important solution.","h":"IIT Madras graphene-based tech:"},{"t":"IIT Bombay researchers have developed a DualSided Superhydrophobic Laser-Induced Graphene (DSLIG) Evaporator that improves solar desalination by combining solar and electric heating to maintain consistent temperatures and using superhydrophobic surfaces to prevent salt buildup, enhancing efficiency. Made from a layered polymer and laser-engraved graphene, DSLIG can treat highly saline water and industrial wastewater, with performance improving when multiple evaporators are stacked."},{"t":"Its low carbon footprint, cost-effectiveness, and durability make it promising for large-scale sustainable desalination, though further field testing and funding are needed before industrial deployment."}],"title":"IIT Bombay Innovation","id":"desalination-technology:news-iit-bombay-innovation","v":"3f6367"},{"path":[],"roles":["how","fix"],"rows":[{"t":"Desalination converts seawater or brackish water into fresh water, addressing the global shortage where only 0.06% of water is easily accessible.","h":"General Desalination:"},{"t":"IIT Bombay scientists developed a lotus leaf-inspired hydrophobic graphene solar evaporator that uses sunlight to efficiently evaporate water."},{"t":"thermal methods (flash or multi-effect evaporation) heat water to collect vapor, effective for highsalinity seawater but costly, and membrane methods (reverse osmosis, electrodialysis) filter water, are eco-friendlier, but may face fouling and incomplete TDS removal. Examples include Lakshadweep’s Low Temperature Thermal Desalination and Nemmeli RO Plant, Tamil Nadu.","h":"Two main approaches exist:"},{"t":"Scalable deployment, supportive policies, and ongoing research are key to ensuring equitable access to clean water."}],"title":"General Approaches","id":"desalination-technology:how-general-approaches","v":"4519df"}]},{"id":"biochemical-oxygen-demand","subj":"s11","name":"BIOCHEMICAL OXYGEN DEMAND","cards":[{"path":[],"roles":["def"],"rows":[{"t":"Biochemical Oxygen Demand (BOD) is a measure of the amount of dissolved oxygen that aerobic bacteria (microorganisms that need oxygen to live) consume to break down organic matter in a sample of water. BOD is one of the most common ways to gauge the quality of water, especially in rivers, lakes, and wastewater treatment plants."},{"t":"A high BOD level means there is a lot of organic pollution (like sewage, manure, or industrial waste) in the water. Bacteria will multiply rapidly to feed on this waste, consuming a large amount of the water’s dissolved oxygen in the process. This “robs” fish, plants, and other aquatic organisms of the oxygen they need to survive, which can lead to “dead zones.”","h":"High BOD (Bad):"},{"t":"A low BOD level indicates that the water is clean and contains little organic waste. This means there is more dissolved oxygen available for a healthy, balanced aquatic ecosystem","h":"Low BOD (Good):"}],"id":"biochemical-oxygen-demand:def-main","v":"83dfa3"}]},{"id":"intellectual-property-rights-ipr","subj":"s12","name":"Intellectual Property Rights (IPR)","cards":[{"path":[],"roles":["def"],"rows":[{"t":"IPR are the rights given to persons over the creations of their minds. They usually give the creator an exclusive right over the use of his/her creation for a certain period of time.","h":"Definition:"},{"t":"8 types of IPR are covered under IPR Policy Management (IPRPM) framework: (i) Patents, (ii) Trade mark, (iii) Industrial Designs, (iv) Copyrights, (v) Geographical Indications, (vi) Semiconductor Integrated Circuit Layout Design, (vii) Trade Secret, and (viii) Plant Varieties."},{"t":"Controller General of Patents, Designs and Trademarks which is under the control of the Department of Industrial Policy and Promotion (DIPP), Ministry of Commerce and Industry.","h":"Administered by:"},{"t":"Act on Layout-Design of Integrated Circuits is administered by Ministry of Electronics and Information Technology (MeitY)."},{"t":"Ministry of Agriculture administers the Act on Plant Variety"}],"id":"intellectual-property-rights-ipr:def-main","v":"7e7ab1"},{"path":[],"roles":["news"],"rows":[{"t":"India’s Intellectual Property (IP) filings rose by 44% in the last 5 years, led by a 380% surge in Geographical Indications.","h":"Why in the news?"},{"sec":"Reasons for Increase in IP Boom"},{"t":"Legal & Procedural Simplification of IP laws & rules: E.g. Patent examination timeline reduced from 48 months to 31 months and mandatory e-submission for patent documents."},{"t":"IP offices have been digitised with a comprehensive e-filing system, leading to over 95% of applications being filed online.","h":"Modernisation of IP Offices:"},{"h":"International standards:","t":"E.g. adoption of international classification under Locarno Agreement for Industrial Designs. Locarno Agreement is an international agreement under the World Intellectual Property Organisation (WIPO) signed in 1968."},{"t":"E.g. SPRIHA Scheme aims to integrate IPR education into higher learning institutions across the country.","h":"Awareness & Capacity Building:"},{"t":"To recognise and reward the top achievers for their IP creations and commercialisation.","h":"National Intellectual Property (IP) Awards:"},{"t":"Fee Concessions ( 10% fee reduction for online filings), Digital initiatives (IP Sarthi Chatbot for applicant support and IP Dashboard to provide real-time IP data), and use of AI and Machine Learning, etc.","h":"Other:"},{"img":20}],"title":"IPR","id":"intellectual-property-rights-ipr:news-ipr","v":"72573c"},{"path":[],"roles":["tbl"],"rows":[{"t":"Details of legal and regulatory considerations for different IP areas:"},{"h":"Geographical Indication (GI)","t":"<span class=\"th\">Subject<\/span> Goods      bearing       unique characteristics     due     to geographical linkage - agricultural goods, natural goods, manufactured goods, handicrafts and foodstuff.<br><span class=\"th\">Legal Provision<\/span> Geographical Indications Act 1999 & GI Rules 2002 amended in 2020.<br><span class=\"th\">Term of Protection<\/span> 10 years, Renewed for 10 years on payment of additional fees"},{"h":"Design","t":"<span class=\"th\">Subject<\/span> New or original designs<br>(Ornamental / visual appearance discernible to the human eye) which can be replicated industrially.<br><span class=\"th\">Legal Provision<\/span> The Design Act, 2000 & Designs (Amendment) Rules 2021<br><span class=\"th\">Term of Protection<\/span> 10 + 5 years"},{"h":"Patents","t":"<span class=\"th\">Subject<\/span> Must qualify requirements of being novel, Inventive and having industrial utility.<br><span class=\"th\">Legal Provision<\/span> The Patents Act, 1970 & Patent Rules, 2003 (Amended in 2014, 2016, 2017, 2019, 2020 and 2021)<br><span class=\"th\">Term of Protection<\/span> 20 years"},{"h":"Copyright","t":"<span class=\"th\">Subject<\/span> Creative, artistic, literary, Musical and audio-visual works<br><span class=\"th\">Legal Provision<\/span> The Copyrights Act, 1957 &Copyrights Rules 2013 amended in 2021.<br><span class=\"th\">Term of Protection<\/span> Author- Lifetime+ 60 years;<br>Producers - 60 years<br>Performers- 50 years;"},{"h":"Trademarks","t":"<span class=\"th\">Subject<\/span> Protects    brand    name, logo, and design for a business or commercial enterprise.<br><span class=\"th\">Legal Provision<\/span> The Trade Marks Act, 1999 & Trademark Rules 2017<br><span class=\"th\">Term of Protection<\/span> 10 years; renewed for 10 years  on payment      of additional fees"},{"h":"Semiconductor Integrated Circuits Layout-Designs (SICLD)","t":"<span class=\"th\">Subject<\/span> A layout of transistors and other circuitry elements including lead wires connecting such elements and expressed in any manner in semiconductor integrated circuits.<br><span class=\"th\">Legal Provision<\/span> The Semiconductor Integrated Circuits Layout- Design Act, 2000 & Rules, 2001.<br><span class=\"th\">Term of Protection<\/span> 10 years"},{"h":"Trade Secret","t":"<span class=\"th\">Subject<\/span> Confidential information having commercial value.<br><span class=\"th\">Legal Provision<\/span> Common Law approach (covered through Contract Act, IP Act, and Copyright etc.)<br><span class=\"th\">Term of Protection<\/span> Till the time confidentiality is safeguarded."},{"h":"Plant Varieties","t":"<span class=\"th\">Subject<\/span> Traditional varieties and landraces, all developed varieties (non-traditional and non-landrace) in trade/use for older than 1 year and not older than 15 years or 18 years (in case of trees and vines), and new plant varieties.<br><span class=\"th\">Legal Provision<\/span> Protection of Plant Varieties and Farmers Rights Act (PPVFRA), 2001<br><span class=\"th\">Term of Protection<\/span> 6-10 years."}],"table":1,"head":["IPR Area","Subject","Legal Provision","Term of Protection"],"id":"intellectual-property-rights-ipr:tbl-main","v":"efe1f7"},{"path":[],"roles":["issue"],"rows":[{"t":"India spends a mere 0.7% of its GDP on R&D, significantly lower than countries like China (2.1%) and Brazil (1.3%).","h":"Low Research and Development (R&D) Spending:"},{"h":"Patent Disputes and Evergreening:","t":"The pharmaceutical sector often faces issues related to patent evergreening, where companies make minor modifications to existing drugs to extend their patent life. Section 3(d) of the Patents Act, 1970, prevents this, leading to disputes with multinational corporations."},{"h":"Compulsory Licensing Concerns:","t":"In the pharmaceutical sector, the government can allow the production of patented products (e.g., medicines) without the patent holder’s consent While this ensures access to essential medicines, it has led to tensions with global pharmaceutical companies."},{"h":"IP Financing in Nascent Stage:","t":"Due to lack of awareness, complexities in IP valuation, reliance on traditional tangible assets, and vulnerability of IP as collateral. IP financing is the use of IP assets (trade marks, design rights, patents and copyright) to gain access to credit."},{"t":"Unlike countries like the USA, India lacks a clear provision for marking products as “patent pending,” which could deter competitors and act as a marketing tool.","h":"Ambiguity of “Patent Pending” Status:"},{"t":"Delays in IPR Granting and Backlog, Weak Enforcement of IPR Laws, Commercialization Gap (High filings don’t guarantee successful market-ready products) etc.","h":"Other:"}],"title":"Challenges related to IPR in India:","id":"intellectual-property-rights-ipr:issue-challenges-related-to-ipr-in-india","v":"086b8b"},{"path":[],"roles":["fix"],"rows":[{"t":"To address new and emerging trends in innovation, identify implementation gaps, and incorporate changes for expanding innovation ecosystem and IP financing.","h":"Holistic Review of National IPR Policy:"},{"t":"To formulate and implement their own IPR policies, focusing on awareness, innovation in educational institutions, establishing State-level Innovation Councils, and curbing IP crimes.","h":"Strengthen State Government Participation:"},{"t":"Improve coordination between law enforcement, customs, and IP offices and provide specialized IPR training. Establish more specialized IPR courts with technically trained judges.","h":"Strengthening Enforcement Mechanisms:"},{"t":"Establish a dedicated IP fund to support initiatives fostering IP culture in remote and traditional knowledge-rich regions, such as tribal belts, hilly, and North-East states.","h":"Create IP Fund:"},{"t":"Enhancing International Collaboration e.g. Cooperate with global IP bodies (e.g., WIPO) and adopt best practices."},{"t":"Ensuring that trade agreement’s IP provisions balance innovation, public health, and national interest."},{"t":"Promoting Innovation & Research through R&D incentives (tax breaks, grants), Strengthening Cyber security & Digital IPR Protection to combat online piracy, enhance IP awareness through educational initiatives etc.","h":"Other:"}],"title":"Way Forward","id":"intellectual-property-rights-ipr:fix-way-forward","v":"fe10fc"}]},{"id":"2024-nobel-medicine","subj":"s13","name":"2024 NOBEL MEDICINE","cards":[{"path":[],"roles":["news"],"rows":[{"t":"In 2024, the Nobel Prize in Medicine went to Victor Ambrose and Gary Ruvkun for discovering microRNAs-tiny RNA molecules that control gene expression after transcription (when DNA is copied into mRNA) but before translation (when mRNA is used to make proteins)."},{"t":"By binding to specific mRNAs, microRNAs block protein production, adding a new layer of control to the usual DNA → transcription → mRNA → translation → protein process. They help explain how cells with the same DNA can become different types (like muscle or skin), and when they malfunction, they can cause diseases like cancer."},{"t":"This discovery has opened the door to treatments that target or mimic these molecules, offering hope for curing illnesses and aiding tissue regeneration.<br>Key Processes"},{"t":"Transcription → The process where a gene’s DNA sequence is copied into messenger RNA (mRNA)."},{"t":"Translation → The process where mRNA is read by ribosomes to build a protein."}],"title":"Discovery Overview","id":"2024-nobel-medicine:news-discovery-overview","v":"902a93"}]},{"id":"2024-nobel-chemistry","subj":"s13","name":"2024 NOBEL CHEMISTRY","cards":[{"path":[],"roles":["news"],"rows":[{"t":"Proteins are chains of amino acids that fold into specific 3-dimensional shapes - and those shapes decide what the protein does in the body.","h":"David Baker’s finding :"},{"t":"David Baker showed that instead of waiting for nature, we can design useful proteins from scratch: use computer models to pick an amino-acid sequence that should fold into a desired shape, write the matching artificial gene, put that gene into bacteria to produce the protein, then test and refine it in the lab (1st one was ‘Top7’ in 2003.)."},{"t":"His approach (using computational design tools like Rosetta plus experimental validation) turned computer blueprints into real molecules and produced entirely new enzymes, therapeutic candidates, vaccine components, nanomaterials and biosensors that didn’t exist in nature and use in industries like healthcare, pharmacy etc."},{"t":"Knowing a protein’s 3D shape is crucial because structure = function, but finding that shape from the sequence used to be slow and difficult. Demis Hassabis and John Jumper built AlphaFold 2, a deep-learning AI that learned how sequences map to shapes by training on thousands of known structures; given just an aminoacid sequence it now predicts the protein’s 3D structure with nearexperimental accuracy in hours or minutes.","h":"Demis Hassabis and John Jumper :"},{"t":"That dramatic speed and accuracy lets researchers find structures for millions of proteins, accelerate drug and vaccine work, and, together with design methods like Baker’s, both read nature’s designs and write new ones","cont":1}],"title":"Protein Design Breakthrough","id":"2024-nobel-chemistry:news-protein-design-breakthrough","v":"ff6ad5"}]},{"id":"2025-nobel-medicine","subj":"s13","name":"2025 NOBEL MEDICINE","cards":[{"path":[],"roles":["pic"],"rows":[{"t":"to Mary E. Brunkow, Fred Ramsdell and shimon sakaguchi"},{"img":21}],"id":"2025-nobel-medicine:pic-main","v":"34eba5"}]},{"id":"2025-nobel-physics","subj":"s13","name":"2025 NOBEL PHYSICS","cards":[{"path":[],"roles":["pic"],"rows":[{"img":22}],"id":"2025-nobel-physics:pic-main","v":"559ba5"}]},{"id":"2025-nobel-chemistry","subj":"s13","name":"2025 NOBEL CHEMISTRY","cards":[{"path":[],"roles":["pic"],"rows":[{"img":23}],"id":"2025-nobel-chemistry:pic-main","v":"0a26bf"}]},{"id":"2026-fields-medal","subj":"s13","name":"2026 Fields medal","cards":[{"path":[],"roles":["news"],"rows":[{"t":"For over a century, mathematicians and physicists sought to mathematically connect the microscopic behavior of individual molecules (such as gas particles bouncing off each other) to the large-scale fluid equations used in engineering. This ties back to David Hilbert's famous list of 23 problems meant to define 20th-century mathematics.","h":"<b>The Problem:<\/b>"},{"t":"Deng provided a rigorous mathematical derivation of the <b>Boltzmann equation<\/b> <i>(the foundational mathematical equation that describes how the physical properties of a gas, such as temperature, pressure, and velocity, change when its microscopic particles collide)<\/i> directly from the mechanics of hard-sphere particle collisions in <b>rarefied gases<\/b> <i>(a gas that is at a very low pressure or density, meaning its molecules are widely spaced apart and rarely interact except when colliding)<\/i>. His work builds a firm bridge between probability, particle interactions, and macroscopic fluid flows.","h":"<b>The Breakthrough:<\/b>"},{"sec":"2. John Pardon: Counting Curves and Unlocking Geometry"},{"t":"<b>Symplectic geometry<\/b> <i>(a branch of mathematics that studies spaces equipped with a mathematical structure used to measure areas and volumes, particularly useful in classical mechanics)<\/i> describes how physical systems move and change over time (such as planets orbiting stars or rocks rolling down hills).","h":"<b>The Problem:<\/b>"},{"t":"A major challenge in modern geometry and string theory involved finding reliable ways to count geometric curves on complex multi-dimensional spaces known as <b>Calabi–Yau 3-folds<\/b> <i>(special six-dimensional geometric shapes used in theoretical physics and string theory to describe the hidden dimensions of space)<\/i>.","cont":1},{"t":"Pardon successfully proved the 20-year-old <b>MNOP conjecture<\/b> <i>(a specific mathematical prediction or educated guess regarding how to count curves on Calabi–Yau spaces using two entirely different advanced frameworks)<\/i>, demonstrating that two completely different methods used by physicists and mathematicians to count these curves yield the exact same result.","h":"<b>The Breakthrough:<\/b>"},{"t":"His novel approaches to <b>virtual fundamental cycles<\/b> <i>(a sophisticated algebraic tool used to properly measure and count geometric objects when the standard ways of measuring break down or intersect poorly)<\/i> and spaces of geometric structures also advanced <b>knot theory<\/b> <i>(the mathematical study of closed, tangled loops in three-dimensional space)<\/i> and <b>manifold topology<\/b> <i>(the study of the properties of geometrical shapes that are preserved through continuous deformations, like stretching or bending, without tearing)<\/i>."}],"title":"1. Yu Deng: Connecting Microscopic Particles to Macroscopic Physics","id":"2026-fields-medal:news-1-yu-deng-connecting-microscopic-particl","v":"b1875d"},{"path":[],"roles":["news"],"rows":[{"t":"Number theory studies the fundamental properties of whole numbers, while <b>algebraic geometry<\/b> <i>(a branch of mathematics that studies geometric shapes defined by polynomial equations, bridging algebra and geometry)<\/i> uses geometric shapes to analyze equations. Translating insights between these fields is notoriously difficult because many geometric shapes are jagged, wild, or structurally incompatible with standard calculus and arithmetic.","h":"<b>The Problem:<\/b>"},{"t":"Tsimerman made history by importing <b>o-minimality<\/b> <i>(a framework from mathematical logic designed to eliminate infinite, wild, or pathological sets by ensuring shapes can be broken down into a finite number of well-behaved, smooth pieces)<\/i> into arithmetic and complex algebraic geometry.","h":"<b>The Breakthrough:<\/b>"},{"t":"Using this framework, he played a central role in proving several major structural hypotheses, most notably <b>Griffiths' conjecture<\/b> <i>(a famous mathematical prediction about how geometric shapes change and vary systematically across families of equations)<\/i> and the <b>André-Oort conjecture<\/b> <i>(a major prediction in number theory about where special points lie on complex algebraic curves and surfaces)<\/i>.","cont":1},{"sec":"4. Hong Wang: Solving the 3D Kakeya Conjecture"},{"t":"The <b>Kakeya problem<\/b> <i>(a famous geometric puzzle first posed by Japanese mathematician Soichi Kakeya in 1917 concerning the smallest space needed to reverse the direction of a line segment)<\/i> asks a deceptively simple question: Imagine a needle lying on a flat surface; what is the absolute minimum amount of area required to rotate that needle so that it ends up pointing in every single direction?","h":"<b>The Problem:<\/b>"},{"t":"While solved for 2D planes decades ago, extending the puzzle to 3D space proved exceptionally difficult, lacking a full solution for half a century.","cont":1},{"t":"Alongside Joshua Zahl, Wang published a massive 127-page solution resolving the three-dimensional Kakeya conjecture. Her deep contributions to <b>harmonic analysis<\/b> <i>(an advanced branch of mathematics that studies how complex functions can be broken down into simpler wave-like components, extending the ideas of Fourier series)<\/i> and <b>geometric measure theory<\/b> <i>(the study of the geometric properties of subsets of space, such as their length, area, and volume, using advanced calculus)<\/i> provide crucial analytical tools used across signal processing, image reconstruction, and advanced spatial mathematics.","h":"<b>The Breakthrough:<\/b>"}],"title":"3. Jacob Tsimerman: \"Taming\" Wild Shapes in Number Theory","id":"2026-fields-medal:news-3-jacob-tsimerman-taming-wild-shapes-in","v":"7eee3c"}]},{"id":"deepak-dhar-and-the-dirac-medal","subj":"s13","name":"Deepak Dhar and the Dirac Medal","cards":[{"path":[],"roles":["news"],"rows":[{"t":"The Dirac Medal.","h":"<b>The Award:<\/b>"},{"t":"The International Centre for Theoretical Physics (ICTP) in Trieste, Italy, announced annually on the birthday of British physicist Paul A.M. Dirac.","h":"<b>Awarded By:<\/b>"},{"t":"Given to physicists for outstanding contributions to theoretical physics, specifically excluding existing Nobel laureates, Fields Medallists, or Wolf Prize laureates.","h":"<b>Purpose:<\/b>"},{"t":"Deepak Dhar (shared with Bernard Derrida, Marc Mézard, and Haim Sompolinsky). He is the second Indian to win this medal, following string theorist Ashoke Sen in 2012.","h":"<b>The Winner:<\/b>"}],"title":"Award & Recognition Overview","id":"deepak-dhar-and-the-dirac-medal:news-award-recognition-overview","v":"9ec606"},{"path":[],"roles":["news"],"rows":[{"t":"Statistical Physics & Abelian Sandpiles","h":"The Core Science:"},{"t":"Dhar's work centers on statistical mechanics, which studies how the collective behavior of vast numbers of particles creates large-scale patterns.","h":"<b>The Field:<\/b>"},{"t":"Proposed in the late 1980s, this principle describes systems that naturally organize into a delicately balanced critical state where tiny nudges can trigger effects of any size (like earthquakes, forest fires, or species extinction).","h":"<b>Self-Organized Criticality:<\/b>"},{"sec":"<b>The Abelian Sandpile Model:<\/b>"},{"t":"Developed by Dhar and his collaborators as a mathematical framework for self-organized criticality."},{"t":"No matter what sequence grains topple and cascade in, the sandpile always settles into the exact same final shape.","h":"<b>What 'Abelian' means:<\/b>"},{"t":"Dhar’s key insight allowed physicists to calculate exact answers and predict the final shape of these unstable systems.","h":"<b>Significance:<\/b>"},{"t":"Used to model earthquakes, forest fires, neural network bursts in the brain, and financial market fluctuations.","h":"<b>Real-World Applications:<\/b>"}],"title":"The Core Science:","id":"deepak-dhar-and-the-dirac-medal:news-the-core-science","v":"f8ba36"}]}],"pin":{"lead":"any new tech would have these problems :","heads":["Adaptability","digital divide","tech savvy","interoperability","risk (social, privacy, power etc.)"],"niche":"if tech is really niche then ethical concerns especially if biotech related","vd":"<b>The Vigyan Dhara Scheme<\/b>, approved by the Union Cabinet, unifies three umbrella schemes to strengthen India’s Science, Technology, and Innovation (STI) ecosystem. It aims to build human resources, expand R&D capacity, and promote gender parity in science and technology. Running from 2021-22 to 2025-26, it supports indigenous innovation, international collaboration, and India’s goal to be a global STI leader."},"title":"S&amp;T Flashcards","subtitle":"Science and Tech · 13 subjects · 79 topics","img":{"0":"img/00.jpg","1":"img/01.png","2":"img/02.jpg","3":"img/03.jpg","4":"img/04.jpg","5":"img/05.jpg","6":"img/06.jpg","7":"img/07.png","8":"img/08.jpg","9":"img/09.jpg","10":"img/10.jpg","11":"img/11.jpg","12":"img/12.jpg","13":"img/13.png","14":"img/14.png","15":"img/15.png","16":"img/16.png","17":"img/17.jpg","18":"img/18.jpg","19":"img/19.jpg","20":"img/20.jpg","21":"img/21.jpg","22":"img/22.jpg","23":"img/23.jpg"}},env:{"subjects":[{"id":"s01","name":"1. Conservation"},{"id":"s02","name":"2. Climate Change"},{"id":"s03","name":"3. Pollution"},{"id":"s04","name":"4. Renewable Energy"},{"id":"s05","name":"5. Disaster Management"},{"id":"s06","name":"6. EIA"}],"topics":[{"id":"b-biodiversity-loss","subj":"s01","name":"Biodiversity loss","cards":[{"id":"b-biodiversity-loss:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"wildlife down 73% since 1970 (<span class=\"cm\" data-c=\"0\">Living Planet Report<\/span>) · India: 3,682 tigers (&gt;70% of world), 22,446 elephants, but protected areas only 5.71% of land <button class=\"hs chipx\" data-h=\"0\">Why India varies<\/button><button class=\"hs chipx\" data-h=\"1\">Carrying capacity<\/button>"},{"sec":"Causes"},{"t":"laws diluted: jail → fines for minor offences <button class=\"hs chipx\" data-h=\"2\">Jan Vishwas Act 2023<\/button>","h":"P","lt":1},{"t":"weak <span class=\"cm\" data-c=\"3\">monitoring + many BMCs exist only on paper<\/span>","h":"I","lt":1},{"t":"invasive species (<span class=\"cm\" data-c=\"4\">Lantana<\/span>) + climate change (coral bleaching)","h":"N","lt":1},{"t":"poaching and wildlife trade (rhinos, pangolins worst hit, 2024; 100+ birds and turtles seized in Jalaun) + communities left out","h":"C","lt":1},{"t":"habitat lost to infrastructure and mining (≈77% of world's mines within 50 km of <span class=\"cm\" data-c=\"5\">Key Biodiversity Areas<\/span>) <button class=\"hs chipx\" data-h=\"3\">Great Nicobar<\/button>","h":"H","lt":1},{"t":"finance gap (≈$700 billion a year worldwide; India's NBSAP needs ₹81,664 crore a year)","h":"F","lt":1},{"t":"Centre–state fights (Kerala wants power to declare \"<span class=\"cm\" data-c=\"8\">vermin\"<\/span>)","h":"C","lt":1},{"sec":"Effects"},{"t":"Environment: lost pollination, clean water, carbon storage · Economy: forests support ≈275 million livelihoods · Health: <span class=\"cm\" data-c=\"9\">zoonoses<\/span> (Nipah)","h":"Environment · Economy · Health"},{"t":"Society: <button class=\"hs\" data-h=\"4\">human–wildlife conflict<\/button>","h":"Society"},{"sec":"Solutions"},{"t":"strong laws <button class=\"hs chipx\" data-h=\"5\">WPA 1972<\/button><button class=\"hs chipx\" data-h=\"6\">BD Act 2002<\/button><button class=\"hs chipx\" data-h=\"7\">Eco-sensitive zones<\/button>","h":"P","lt":1},{"t":": <span class=\"cm\" data-c=\"23\">DNA lab at WII<\/span> + drones + <span class=\"cm\" data-c=\"24\">eco-bridges<\/span> (1.4 km underpass on the MP–Maharashtra border)","h":"I","lt":1},{"t":"species recovery: Project Tiger (1973), Elephant (1992), Cheetah (2022, many deaths) + corridors beyond the 5% PAs + landscape approach (<span class=\"cm\" data-c=\"25\">NWAP<\/span>, but non-binding)","h":"N","lt":1},{"t":"communities as guardians: 1.4 lakh BMCs + People's Biodiversity Registers <button class=\"hs chipx\" data-h=\"8\">People's movements<\/button>","h":"C","lt":1},{"t":"<span class=\"cm\" data-c=\"26\">BIOFIN + CSR money<\/span> + Cali Fund + <span class=\"cm\" data-c=\"27\">BRSR (top 1,000<\/span> listed firms report their environmental impact)","h":"F","lt":1},{"t":"global deals + IBCA (India-led big-cat alliance, 2023) <button class=\"hs chipx\" data-h=\"9\">KMGBF + COP16<\/button><button class=\"hs chipx\" data-h=\"10\">NBSAP + national report<\/button><button class=\"hs chipx\" data-h=\"11\">Other conventions<\/button><button class=\"hs chipx\" data-h=\"12\">High Seas Treaty<\/button>","h":"C","lt":1}],"hs":[{"t":"Why India varies","b":"<ul><li>Latitude 8°–37°N (tropical Kerala → temperate J&amp;K) + rainfall 100 mm → 11,000 mm (Cherrapunji); wet Western Ghats vs dry Deccan only ≈100 km apart<\/li><li>Long coast, big rivers + cut-off islands → endemism (Andamans, Lakshadweep) + old Gondwana block → long time to evolve<\/li><li>Northeast = meeting point of 3 realms (Indian, Indo-Malayan, Indo-Chinese)<\/li><li>Hotspot criteria: at least 1,500 endemic vascular plants + lost at least 70% of original habitat<\/li><\/ul>"},{"t":"Carrying capacity","b":"<ul><li>The most individuals (or resource use) an area can support for ever without degrading its resources<\/li><li>Exceeded → aquifers, rivers, grass run down + sudden population crash + overshoot lowers future capacity (an overfished lake never gets its fish back)<\/li><li>In planning: carrying-capacity studies for hill towns (SC asked Himalayan states, 2023) + caps on tourists and vehicles + basis for EIA and master plans<\/li><li>Failed: Joshimath sinking 2023 = capacity ignored<\/li><\/ul>"},{"t":"Jan Vishwas Act 2023","b":"<ul><li>Amends 42 central laws (incl. EPA 1986, Air Act 1981): jail → penalties for minor offences, <span class=\"cm\" data-c=\"1\">decided by adjudicating officers<\/span><\/li><li>Fines go into an <span class=\"cm\" data-c=\"2\">Environment Protection Fund<\/span> (EPA Section 15: ₹10,000 to ₹15 lakh)<\/li><li>Criticism: SC calls it \"toothless\" + harm continues (Futala Lake, illegal quarrying in Kerala forests) → fix: fines that deter + keep jail for serious harm<\/li><\/ul>"},{"t":"Great Nicobar","b":"<ul><li>Transshipment port (Galathea Bay) + airport + 450 MW power plant + township, near the Malacca, Sunda, Lombok straits → cargo + defence<\/li><li>Concerns: Shompen (<span class=\"cm\" data-c=\"6\">PVTG) and<\/span> Nicobarese displaced + leatherback turtle nesting + ≈9.6 lakh trees cut + mangroves lost + sits on the 2004 <span class=\"cm\" data-c=\"7\">tsunami megathrust<\/span><\/li><li>Forest rights not settled under FRA (A&amp;N says its 1956 Aboriginal Tribes law, under which the administration alone can divert land, is enough; FRA needs Gram Sabha consent) · NGT 2023 upheld clearances → committee cleared the port again (Feb 2026)<\/li><li>Way forward: phased, ecologically sensitive, community-inclusive<\/li><\/ul>"},{"t":"Human–wildlife conflict","b":"<ul><li>1,630 people killed by animals (<span class=\"cm\" data-c=\"10\">ADSI 2024) + Kerala declared it<\/span> a state-specific disaster + elephant conflict rising (Jharkhand, West Bengal) + crop loss, retaliatory killing<\/li><li>Why: more animals, same 5% protected-area network → they spill into farms and towns (langurs misused in Gurugram)<\/li><li>Fix: National HWC Mitigation <span class=\"cm\" data-c=\"11\">Strategy 2021–26 + SOPs (tiger<\/span>, leopard, elephant) + early warnings (SMS, sensors, GPS collars) + bee-hive and solar fences + crops elephants avoid (chilli, citrus, ginger)<\/li><li>SC: ₹10 lakh for each human death + <span class=\"cm\" data-c=\"12\">landscape approach + corridors<\/span><\/li><\/ul>"},{"t":"WPA 1972","b":"<ul><li>2022 amendment: 6 schedules → 4 (I highest protection, II high, III plants, IV CITES species)<\/li><li>Protected areas: National Parks (no human use) → Sanctuaries (some rights) → Conservation Reserves (buffers, corridors) → Community Reserves (local land)<\/li><li>Bodies: <span class=\"cm\" data-c=\"13\">NBWL (PM chairs)<\/span> + NTCA (tigers) + WCCB (wildlife crime) + CZA (zoos)<\/li><li>Base: Art 48A (DPSP) + Art 51A(g) + forests and wild animals on the Concurrent List (42nd Amendment, 1976)<\/li><li>Worked: Kaziranga (zero rhino poaching 2022) + <span class=\"cm\" data-c=\"14\">TX2 met<\/span> in 2018 · Failed: Great Indian Bustard (Schedule I since 1972, ≈130 left)<\/li><\/ul>"},{"t":"BD Act 2002","b":"<ul><li>Regulates access to biological resources, <span class=\"cm\" data-c=\"15\">stops biopiracy<\/span>, shares benefits · 3 tiers: NBA → State Biodiversity Boards → BMCs (1.4 lakh, keep People's Biodiversity Registers)<\/li><li><span class=\"cm\" data-c=\"16\">Biodiversity Heritage Sites<\/span> (Kaya Kalp Vriksh, Punjab; Arittapatti, Madurai → tungsten mine cancelled 2025)<\/li><li>2023 amendment + 2025 rules: jail → fines + <span class=\"cm\" data-c=\"17\">AYUSH exempt<\/span> + <span class=\"cm\" data-c=\"18\">digital sequence data covered<\/span> + benefit share 0.2–0.6% (5%+ high value), 60–75% to local communities<\/li><li>Worked: Kani tribe, Kerala (Jeevani drug, royalty shared) · Failed: Bt brinjal biopiracy case (2011, dragged for years)<\/li><li>Traditional knowledge: <span class=\"cm\" data-c=\"19\">TKDL<\/span> + <span class=\"cm\" data-c=\"20\">PPVFR Act 2001 + GI Act 1999<\/span> → problems: biopiracy, poor records → pay TK holders + benefit <span class=\"cm\" data-c=\"21\">sharing under Nagoya<\/span><\/li><\/ul>"},{"t":"Eco-sensitive zones","b":"<ul><li>Buffers around protected areas under EPA 1986: prohibited (mining, polluting industry) / regulated (tree felling, hotels) / permitted (local farming)<\/li><li><span class=\"cm\" data-c=\"22\">Worked: Mahabaleshwar<\/span>–Panchgani (2001) · Mixed: SC's 1-km ESZ round every PA (2022) relaxed in 2023 · Failed: Netala bypass, Bhagirathi ESZ (2025)<\/li><\/ul>"},{"t":"People's movements","b":"<ul><li>Chipko (1973, Uttarakhand): non-violent hugging of trees → commercial logging banned in the Himalaya<\/li><li>Appiko (1983, Karnataka) + Silent Valley (1984: dam dropped → National Park) + Anti-Tehri Dam + Narmada Bachao Andolan (1985–)<\/li><li>NGOs and rehabilitation PYQs (2024, 2016) → see EIA<\/li><\/ul>"},{"t":"<span class=\"cm\" data-c=\"28\">KMGBF + COP16<\/span>","b":"<ul><li>KMGBF (CBD COP15, 2022): 23 targets by 2030: protect 30% of land and sea <span class=\"cm\" data-c=\"29\">(30x30)<\/span> + restore 30% + halve invasive species + cut $500 billion harmful subsidies + raise $200 billion a year<\/li><li>Replaced the <span class=\"cm\" data-c=\"30\">Aichi targets<\/span> (none of 20 fully met by 2020) · <span class=\"cm\" data-c=\"31\">Protected Planet 2024<\/span>: 17.6% land, 8.4% ocean protected<\/li><li>COP16, Cali (2024): Cali Fund (companies using digital sequence data pay 1% of profits or 0.1% of revenue, voluntary) + permanent body for Indigenous peoples · ran out of quorum, resumed in Rome 2025<\/li><li>Gaps: Cali Fund voluntary (first private payment only Nov 2025) + ≈700 billion dollars a year finance gap → fix: <span class=\"cm\" data-c=\"32\">binding DSI payments + Kunming Biodiversity Fund<\/span><\/li><\/ul>"},{"t":"NBSAP + national report","b":"<ul><li><span class=\"cm\" data-c=\"33\">NBSAP 2024–30: 23<\/span> national targets matched to KMGBF + whole-of-government (23 ministries) + whole-of-society · released at Cali, one of 44 countries on time<\/li><li>Runs through NBA → SBB → BMC + BIOFIN (₹81,664 crore a year needed)<\/li><li><span class=\"cm\" data-c=\"34\">7th national report to<\/span> the CBD: forest + tree cover 25.1% + 24.1 million ha restored (Bonn pledge 26) + 100 Ramsar sites + first counts of snow leopards (718) and river dolphins (6,327)<\/li><\/ul>"},{"t":"Other conventions","b":"<ul><li><span class=\"cm\" data-c=\"35\">CITES (1973)<\/span>: controls trade in endangered species (India got star tortoise, otter into Appendix I, 2019)<\/li><li><span class=\"cm\" data-c=\"36\">CMS (1979)<\/span>: migratory species (India hosted COP13, Gandhinagar 2020; GIB added) + <span class=\"cm\" data-c=\"37\">MAB (1971)<\/span>: 18 biosphere reserves<\/li><li><span class=\"cm\" data-c=\"38\">ITPGRFA (2001)<\/span>: shares 64 crops (≈80% of plant diet) · India guards sovereign rights + digital sequence data = digital biopiracy risk<\/li><li>Gaps: weak enforcement (illegal wildlife trade) + targets not binding (Aichi missed) → fix: WPA Schedule IV mirrors CITES + finance for the South<\/li><\/ul>"},{"t":"High Seas Treaty","b":"<ul><li><span class=\"cm\" data-c=\"39\">BBNJ<\/span>: share benefits from high-seas genetic finds + high-seas marine protected areas + EIA for high-seas projects + help for developing countries<\/li><li>In force Jan 2026 after 60 ratifications; first COP Jan 2027 · India signed (Sep 2024), needs a domestic law to ratify<\/li><li>Issues: not universal + no punishing body + weak technology transfer → fix: ratify + build deep-sea research capacity<\/li><\/ul>"}],"cm":{"0":"Living Planet Report = WWF's report tracking how fast wild animal populations are shrinking worldwide.","1":"Adjudicating officer = a government officer (not a court) who decides the fine for a violation, so cases end faster.","2":"Environment Protection Fund = a pot where all the environmental fines go, to be spent on environmental work.","3":"BMC = Biodiversity Management Committee: a village- or town-level body under the BD Act that records local biodiversity and decides on its use.","4":"Lantana = a fast-spreading invasive shrub from South America that chokes native plants; it covers about half of India's forests and scrubland.","5":"Key Biodiversity Areas = sites mapped globally as the most important places for species survival.","6":"PVTG = Particularly Vulnerable Tribal Group: the most isolated, smallest tribes, like the Shompen.","7":"Megathrust = the giant fault where one tectonic plate dives under another; it causes the biggest earthquakes and tsunamis.","8":"Vermin = an animal the Centre declares a pest (WPA Section 62) so it can be legally killed for a period, e.g. wild boar raiding crops.","9":"Zoonoses = diseases that jump from animals to humans (Nipah, COVID-19, rabies).","10":"ADSI = Accidental Deaths and Suicides in India, NCRB's yearly report.","11":"SOP = standard operating procedure: a fixed step-by-step drill for officials when, say, a tiger enters a village.","12":"Landscape approach = plan for the whole area animals move through (forests, farms, villages), not just the fenced park.","13":"NBWL = National Board for Wildlife (chaired by PM): clears projects inside protected areas. NTCA = National Tiger Conservation Authority (runs tiger reserves). WCCB = Wildlife Crime Control Bureau. CZA = Central Zoo Authority.","14":"TX2 = the global goal (2010) to double wild tigers by 2022; India did it in 2018, four years early.","15":"Biopiracy = companies patenting or profiting from a country's plants or traditional knowledge without permission or sharing benefits (e.g. the neem and turmeric patent fights).","16":"Biodiversity Heritage Site = a small, rich area a state notifies under the BD Act for protection with local people (e.g. Arittapatti, Madurai).","17":"AYUSH = Ayurveda, Yoga, Unani, Siddha, Homoeopathy. The 2023 amendment freed these practitioners from asking NBA before using plants.","18":"Digital sequence data (DSI) = genetic code of plants or animals stored online; companies can use it without touching the physical plant, so it's a new route for biopiracy.","19":"TKDL = Traditional Knowledge Digital Library: India's database of traditional remedies in patent-office languages, so foreigners can't patent them as new. PPVFR Act = protects new seed varieties and farmers' right to save and share seeds. GI Act = protects products tied to a place (Darjeeling tea).","20":"PPVFR Act 2001 (Protection of Plant Varieties and Farmers' Rights): registers new plant varieties for breeders + farmers keep the right to save, use, share and sell seed (not branded). GI Act 1999: Geographical Indication tag for products tied to a place (Darjeeling tea, Basmati).","21":"Nagoya Protocol (2010) = CBD agreement that whoever uses another country's genetic resources must get permission and share the benefits (access and benefit sharing, ABS).","22":"Eco-sensitive zone = a buffer belt around a national park or sanctuary where harmful activities are banned or controlled.","23":"WII = Wildlife Institute of India (Dehradun); its DNA lab identifies seized animal parts to prosecute poachers.","24":"Eco-bridge = an overpass or underpass built for animals to cross highways and railways safely.","25":"NWAP = National Wildlife Action Plan (2017–31): India's wildlife roadmap (landscape approach, climate, people-centric), but not legally binding.","26":"BIOFIN = Biodiversity Finance Initiative (UNDP): helps countries work out how much conservation costs and where the money can come from. Cali Fund = companies that profit from digital genetic data pay into it; money goes to Indigenous and local communities.","27":"BRSR = Business Responsibility and Sustainability Report: SEBI makes the top 1,000 listed companies disclose ESG data (energy, emissions, water, waste).","28":"KMGBF = Kunming-Montreal Global Biodiversity Framework: the 'Paris Agreement for nature' with 23 targets for 2030.","29":"30x30 = protect 30% of land and 30% of oceans by 2030.","30":"Aichi targets = 20 biodiversity goals set in 2010 for 2020; none was fully met.","31":"Protected Planet Report = UN report on how much of Earth's land and sea is protected.","32":"DSI = digital sequence information (genetic data stored online, used by pharma and biotech). Kunming Biodiversity Fund = China-backed fund launched at COP16 to help developing countries meet KMGBF targets.","33":"NBSAP = National Biodiversity Strategy and Action Plan: each country's plan for meeting the CBD targets.","34":"National report = the progress report every CBD member must submit (Article 26); India's 7th says all 23 targets are on track.","35":"CITES = Convention on International Trade in Endangered Species: Appendix I species can't be traded commercially at all.","36":"CMS = Convention on Migratory Species (Bonn): protects animals that cross borders (birds, elephants, turtles).","37":"MAB = UNESCO's Man and Biosphere programme: biosphere reserves where conservation and local livelihoods coexist (core, buffer, transition zones).","38":"ITPGRFA = International Treaty on Plant Genetic Resources for Food and Agriculture: countries share seeds of key crops for research and breeding.","39":"BBNJ = Biodiversity Beyond National Jurisdiction: the treaty for the high seas, the ocean beyond any country's 200-nautical-mile zone (about two-thirds of the ocean)."},"v":"5a4726"}],"circle":"g","pyq":["<b>2019 Q17 (15 marks):<\/b> Define the concept of carrying capacity of an ecosystem as relevant to an environment. Explain how understanding this concept is vital while planning for sustainable development of a region.","<b>2018 Q17 (15 marks):<\/b> How does biodiversity vary in India? How is the Biological Diversity Act,2002 helpful in conservation of flora and fauna?"]},{"id":"b-forests","subj":"s01","name":"Forests","cards":[{"id":"b-forests:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"forest 21% of area + forest and tree cover 25.17% (<span class=\"cm\" data-c=\"0\">ISFR 2023<\/span>) + 9th in forest area, 3rd in net gain (FAO 2025) + supports ≈275 million livelihoods"},{"sec":"Causes"},{"t":"laws diluted (2023 amendment narrowed \"forest\" → ≈28% of actual forest, unrecorded, loses cover)","h":"P","lt":1},{"t":"warming → more forest fires (36% of forest cover fire-prone)","h":"N","lt":1},{"t":"encroachment (10,000+ acres of Odisha's reserved forests) + field-burning fires + Gram Sabhas bypassed in diversions (MP, Odisha)","h":"C","lt":1},{"t":"diversion for mining (<span class=\"cm\" data-c=\"1\">Hasdeo Arand<\/span>) + plantations (oil palm in the NE) + 3.3% lost 2001–2022","h":"H","lt":1},{"t":"forest finance gap $216 billion to 2030 (UNEP)","h":"F","lt":1},{"sec":"Effects"},{"t":"Environment: forest carbon stock ≈7,285 million t (55% in soil) + shield against storms and floods · Economy: timber, minor forest produce, ≈275 million livelihoods · Society: tribals lose land and forest rights","h":"Environment · Economy · Society"},{"sec":"Solutions"},{"t":"forest laws <button class=\"hs chipx\" data-h=\"0\">Indian Forest Act 1927<\/button><button class=\"hs chipx\" data-h=\"1\">FCA 1980 + CAMPA<\/button><button class=\"hs chipx\" data-h=\"2\">2023 amendment + 2025 rules<\/button>","h":"P","lt":1},{"t":"geo-tagging + <span class=\"cm\" data-c=\"11\">FSI fire alerts<\/span> + digital forest records","h":"I","lt":1},{"t":"<span class=\"cm\" data-c=\"12\">Green India Mission (+5<\/span> million ha) + <span class=\"cm\" data-c=\"13\">Bonn Challenge (24<\/span>.1 of 26 million ha done) + native species with survival audits (<span class=\"cm\" data-c=\"14\">Miyawaki<\/span>)","h":"N","lt":1},{"t":"<span class=\"cm\" data-c=\"15\">Joint Forest Management<\/span> (Sukhomajri model) + forest rights <button class=\"hs chipx\" data-h=\"3\">FRA 2006<\/button><button class=\"hs chipx\" data-h=\"4\">Sacred groves<\/button>","h":"C","lt":1},{"t":"<span class=\"cm\" data-c=\"18\">REDD+ payments<\/span> for standing forests + Japan's Forest Environment Tax","h":"F","lt":1}],"hs":[{"t":"Indian Forest Act 1927","b":"<ul><li><span class=\"cm\" data-c=\"2\">Colonial law for timber revenue<\/span>: Reserved, Protected, Village, Private forests + punishes unauthorised use<\/li><li>Worked: 2017 amendment (bamboo outside forests freed from transit permits) · Failed: 2019 draft (arms for forest officers) withdrawn after tribal protests<\/li><li>Fix: align with FRA (Gram Sabha say) + digitise records<\/li><\/ul>"},{"t":"FCA 1980 + CAMPA","b":"<ul><li>Centre must approve diverting forest land + compensatory afforestation (<span class=\"cm\" data-c=\"3\">CA) for every diversion<\/span><\/li><li><span class=\"cm\" data-c=\"4\">Godavarman (1996)<\/span>: \"forest\" = dictionary meaning → FCA covers all forests, recorded or not<\/li><li>Failed: Kancha Gachibowli, Hyderabad (2025): urban project vs green <span class=\"cm\" data-c=\"5\">lung near KBR<\/span> National Park → SC put ecology over convenience<\/li><li><span class=\"cm\" data-c=\"6\">CAF Act 2016 (CAMPA<\/span> funds): 85% of CA target met (2019–24) · problems: poor sapling survival, late plans, misuse → geo-tag CA <span class=\"cm\" data-c=\"7\">sites (e-Green Watch<\/span>, PARIVESH 2.0)<\/li><\/ul>"},{"t":"2023 amendment + 2025 rules","b":"<ul><li>Van (Sanrakshan Evam Samvardhan) Adhiniyam: only forest recorded on/after 25 Oct 1980 protected → ≈28% of actual forest (unrecorded) loses cover + exempts land within 100 km of borders for strategic projects + zoos, safaris = \"forestry\"<\/li><li>SC interim order (Feb 2024): keep the dictionary meaning <span class=\"cm\" data-c=\"8\">till deemed-forest records<\/span> are ready<\/li><li>2025 rules: work can start <span class=\"cm\" data-c=\"9\">after Stage-I<\/span> + critical-mineral mines exempt from public hearing + CA land need not be notified Protected Forest<\/li><li>Border exemption: a 100 km line swallows almost all of the NE, high Himalaya and A&amp;N → hotspots open to projects without EIA<\/li><li>Fix: notify CA land as Protected Forest + <span class=\"cm\" data-c=\"10\">all approvals on PARIVESH + no net loss<\/span> of forest (as SC asked)<\/li><\/ul>"},{"t":"FRA 2006","b":"<ul><li>Restores individual and community forest rights of tribals and forest dwellers; Gram Sabha manages and conserves; overrides the 1927 Act<\/li><li>Worked: Mendha Lekha (first <span class=\"cm\" data-c=\"16\">community forest rights, 1,800<\/span> ha, zero deforestation) + Niyamgiri 2013 (all 12 Gram Sabhas rejected Vedanta)<\/li><li>Gaps: community claims pending in 65% of eligible villages (2025) + Gram Sabhas bypassed (Assam oil palm) + SC eviction order 2019 (stayed)<\/li><li>Step: FRA cells in tribal districts to clear <span class=\"cm\" data-c=\"17\">pending claims (Dharti Aaba<\/span> Janjatiya Gram Utkarsh Abhiyan, 2024)<\/li><li>Fix: time-bound claims + legal literacy + Gram Sabha consent before any diversion<\/li><\/ul>"},{"t":"Sacred groves","b":"<ul><li>Community-protected forest patches (Khasi, Garo hills; 1,200+ mapped by Kerala, 2025)<\/li><li>MoEFCC (2025) considering them as community reserves under WPA + nominated to UNESCO as a traditional conservation landscape (2025) + Tribal Ministry wants them counted in India's carbon-sink goal (NDC)<\/li><\/ul>"}],"cm":{"0":"ISFR = India State of Forest Report, published every 2 years by the Forest Survey of India.","1":"Hasdeo Arand = a dense forest in Chhattisgarh being cleared for coal mines despite Gram Sabha protests.","2":"Reserved forest = strictest (no rights unless granted); Protected forest = some rights allowed; Village forest = given to a village to manage.","3":"Compensatory afforestation = whoever cuts a forest for a project must pay to plant an equal (or double) area elsewhere.","4":"Godavarman case (1996) = SC said 'forest' means any forest in the dictionary sense, whether or not it's in government records.","5":"KBR = Kasu Brahmananda Reddy National Park, Hyderabad.","6":"CAF Act = Compensatory Afforestation Fund Act: puts the CA money (CAMPA funds) into national and state funds for planting.","7":"e-Green Watch = online portal tracking CA plantations; PARIVESH = online single-window portal for environment and forest clearances.","8":"Deemed forest = land that looks and works like forest but isn't recorded as forest in government papers.","9":"Stage-I = the Centre's in-principle approval for forest diversion; Stage-II = final approval after conditions (like CA) are met.","10":"PARIVESH = online single-window portal (2018) for environment, forest, wildlife and CRZ clearances; 2.0 adds tracking of each proposal.","11":"FSI = Forest Survey of India (Dehradun, under MoEFCC): publishes the 2-yearly forest report (ISFR) + sends satellite fire alerts to forest staff.","12":"Green India Mission (2014): one of the 8 NAPCC missions; grow forest and tree cover on 5 million ha + improve the quality of another 5 million ha.","13":"Bonn Challenge = global pledge to restore degraded land; India pledged 26 million ha by 2030.","14":"Miyawaki method = planting dense, native mini-forests that grow about 10x faster (Japanese technique).","15":"Joint Forest Management = forest department and village share forest protection and its produce (started from Sukhomajri, Haryana).","16":"Community forest rights (CFR) = the whole village's right to use, protect and manage its traditional forest, not just individual plots.","17":"Dharti Aaba Janjatiya Gram Utkarsh Abhiyan (2024): Centre's mission to bring basic services (houses, water, roads, health) to ≈63,000 tribal-majority villages; sets up FRA cells to settle forest-rights claims.","18":"REDD+ = UN scheme that pays developing countries for keeping forests standing and cutting deforestation emissions."},"v":"860e41"}],"circle":"y"},{"id":"b-fragile-ecosystems","subj":"s01","name":"Fragile ecosystems","cards":[{"id":"b-fragile-ecosystems:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"carbon stores + storm shields + biodiversity hubs: wetlands 6% of land but 40% of species · mangroves store 3x the carbon of forests · corals hold 25% of marine species · peat holds 5x forest carbon per sq m"},{"sec":"Threats"},{"t":"protection stuck (<span class=\"cm\" data-c=\"0\">Western Ghats ESA draft<\/span> reissued 6 times since 2014)","h":"P","lt":1},{"t":"warming → bleaching, sea-level rise, algal blooms + invasive species (water hyacinth)","h":"N","lt":1},{"t":"encroachment (India lost 2 of every 5 wetlands in 30 years) + plastic and sewage","h":"C","lt":1},{"t":"shrimp farms, reclamation (Mumbai's mangroves), quarrying, coastal building","h":"H","lt":1},{"t":"their services are unpriced, so they look like \"wasteland\"","h":"F","lt":1},{"sec":"Fixes"},{"t":"notify and enforce (Wetland Rules 2017, <span class=\"cm\" data-c=\"1\">CRZ, ESA<\/span>)","h":"P","lt":1},{"t":"map and <span class=\"cm\" data-c=\"2\">monitor (INCOIS Coastal Vulnerability<\/span> Index + digital wetland inventories)","h":"I","lt":1},{"t":"<span class=\"cm\" data-c=\"3\">restore (MISHTI<\/span>, artificial reefs) + keep them as bio-shields in coastal plans","h":"N","lt":1},{"t":"community-led use (<span class=\"cm\" data-c=\"4\">Mission Sahbhagita<\/span>, SAIME)","h":"C","lt":1},{"t":"blue carbon credits to pay for protection","h":"F","lt":1},{"sec":"Ecosystems"},{"t":"<button class=\"hs\" data-h=\"0\">Wetlands<\/button>"},{"t":"<button class=\"hs\" data-h=\"1\">Mangroves<\/button>"},{"t":"Coral reefs <button class=\"hs chipx\" data-h=\"2\">Coral bleaching<\/button>"},{"t":"<button class=\"hs\" data-h=\"3\">Western Ghats<\/button>"},{"t":"Peatlands + marine protected areas <button class=\"hs chipx\" data-h=\"4\">Peatlands + MPAs<\/button>"}],"hs":[{"t":"Wetlands","b":"<ul><li>India: ≈7 lakh wetlands, 16 million ha (4.86% of area) + lost 2 of every 5 in 30 years · J&amp;K: 74% of lakes vanished or shrank since 1967 (CAG)<\/li><li>Ramsar Convention (1971, Ramsar, Iran; India joined 1982): 100 sites (oldest Chilika, Keoladeo 1981; most in Tamil Nadu) + <span class=\"cm\" data-c=\"5\">Montreux Record of<\/span> threatened sites (Loktak, Keoladeo) + <span class=\"cm\" data-c=\"6\">Wetland Cities<\/span> (Indore, Udaipur)<\/li><li>Wise use = keep a wetland's ecological character while people use it (national plans + laws + management + public education)<\/li><li>National Wetland Conservation Programme (1985–86) → merged with lake plan into <span class=\"cm\" data-c=\"7\">NPCA (2013) + Wetland<\/span> Rules 2017 (State Wetland Authorities, inventories, no reclamation) + Wetland Wise Use framework 2024 + Mission Sahbhagita<\/li><li>India at Ramsar COP15 (2025): \"Sustainable Lifestyles for Wetlands\" resolution (linked to LiFE), backed by 172 countries<\/li><\/ul>"},{"t":"Mangroves","b":"<ul><li>Salt-tolerant trees of the tide zone: 0.15% of India's area · 3x forest carbon (<span class=\"cm\" data-c=\"8\">blue carbon<\/span>) + cut flood depth 15–20%<\/li><li>Worked: Sundarbans during Amphan 2020 (bio-shield) · Failed: Mumbai lost mangroves to reclamation → Bombay HC (2018) made all mangroves protected forest<\/li><li>Threats: shrimp farms + coastal building + oil spills, plastic + sea-level rise → half the world's mangroves at risk<\/li><li>India: MISHTI (2023) + <span class=\"cm\" data-c=\"9\">SAIME (shrimp<\/span> farming inside mangroves, Sundarbans pilot) → fix: shrimp farms outside mangroves + blue carbon credits<\/li><\/ul>"},{"t":"Coral bleaching","b":"<ul><li>Corals live with algae (zooxanthellae) that feed them → heat stress → coral expels the algae → turns white · needs clean water + 23–29°C<\/li><li>India: Gulf of Kachchh + Gulf of Mannar and Palk Bay + Lakshadweep + Andaman &amp; Nicobar<\/li><li>Failed: Lakshadweep hit by the 4th global bleaching (2024) · Worked: Vaan island artificial reefs slowed erosion<\/li><li>India: WPA Schedule I + ban on coral and <span class=\"cm\" data-c=\"10\">sand in construction + ICRI member<\/span> → fix: cut runoff + coral cryobank + <span class=\"cm\" data-c=\"11\">Biorock<\/span> (Gulf of Kutch)<\/li><\/ul>"},{"t":"Western Ghats","b":"<ul><li>Biodiversity hotspot (endemics: Nilgiri tahr) + UNESCO site (2012) + water tower of the south (Godavari, Krishna, Kaveri)<\/li><li><span class=\"cm\" data-c=\"12\">Gadgil Committee (2011)<\/span> vs Kasturirangan (2013: 37% as ESA) → Karnataka rejected → ESA draft reissued 6 times, still not final<\/li><li>Failed: Wayanad 2024 (quarrying in the Gadgil-flagged zone) · Worked: Silent Valley 1984<\/li><li>Fix: finalise the ESA with states on board + no quarrying on steep slopes + <span class=\"cm\" data-c=\"13\">Western Ghats Ecology Authority<\/span><\/li><\/ul>"},{"t":"Peatlands + MPAs","b":"<ul><li>Peat = plant matter that hasn't rotted for centuries (no oxygen) → 5x forest carbon per sq m; drained peat burns (Indonesia fires) → UNEP Global Peatlands Initiative (UNFCCC COP22, Marrakech)<\/li><li>Marine protected areas: Gulf of Mannar marine park, Gahirmatha (Odisha), Lothian island (WB)<\/li><\/ul>"}],"cm":{"0":"ESA = Ecologically Sensitive Area, notified under EPA 1986: mining, quarrying, big building and red-category industry banned inside it.","1":"CRZ = Coastal Regulation Zone (first 1991, now the CRZ 2019 notification under EPA): limits building and industry near the high-tide line + No Development Zones on the coast.","2":"INCOIS Coastal Vulnerability Index: maps how exposed each stretch of India's coast is to sea-level rise, erosion and storm surges.","3":"MISHTI = Mangrove Initiative for Shoreline Habitats &amp; Tangible Incomes (Budget 2023): plant mangroves on about 540 sq km in 9 states + 4 UTs, using MGNREGS and CAMPA money.","4":"Mission Sahbhagita = 'participation' mission: gets local people to protect and use wetlands wisely.","5":"Montreux Record = Ramsar's list of sites whose health is getting worse and need urgent attention.","6":"Wetland City Accreditation = Ramsar title for cities that protect their wetlands (Indore, Udaipur).","7":"NPCA = National Plan for Conservation of Aquatic Ecosystems: one scheme for lakes and wetlands (merged 2013).","8":"Blue carbon = carbon stored by coastal and marine ecosystems: mangroves, seagrass, salt marshes.","9":"SAIME = Sustainable Aquaculture In Mangrove Ecosystem: shrimp farming that keeps mangroves standing (Sundarbans pilot).","10":"ICRI = International Coral Reef Initiative: a partnership of countries and groups working to protect coral reefs; India is a member.","11":"Biorock = steel frames with a weak electric current that grow limestone, giving corals a base to regrow. Cryobank = freezing coral cells to revive species later.","12":"Gadgil (2011) wanted most of the Western Ghats protected with local say; Kasturirangan (2013) cut it to 37%, focusing on natural landscape only.","13":"Western Ghats Ecology Authority = a body Gadgil proposed to manage the whole range across all 6 states."},"v":"308b8f"}],"circle":"y","pyq":["<b>2023 Q17 (15 marks):<\/b> Comment on the National Wetland Conservation Programme initiated by the Government of India and name a few India’s wetlands of international importance included in the Ramsar Sites.","<b>2018 Q7 (10 marks):<\/b> What is wetland? Explain the Ramsar concept of ‘wise use’ in the context of wetland conservation. Cite two examples of Ramsar sites from India."]},{"id":"b-mining","subj":"s01","name":"Mining","cards":[{"id":"b-mining:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"minerals drive the economy, but ≈77% of the world's mines sit within 50 km of Key Biodiversity Areas · sand is the 2nd most used resource after water; India's gap ≈300 million t a year"},{"sec":"Causes"},{"t":"sand is a \"<span class=\"cm\" data-c=\"0\">minor mineral\"<\/span> (MMDR Act 1957) → states regulate loosely + Go/No-Go diluted","h":"P","lt":1},{"t":"illegal mining hard to track (Goa, Bellary iron ore)","h":"I","lt":1},{"t":"sand mafia: low entry barrier, high profits","h":"C","lt":1},{"t":"urbanisation → demand for concrete and minerals","h":"H","lt":1},{"t":"mineral revenue vs ecology","h":"F","lt":1},{"t":"each state its own definition and rules (Aravallis)","h":"C","lt":1},{"sec":"Effects"},{"t":"Forest and land lost + <span class=\"cm\" data-c=\"1\">acid mine drainage<\/span>, heavy metals in water + groundwater falls + dust → lung disease + subsidence and underground fires (Jharia) + <span class=\"cm\" data-c=\"2\">tailings dams burst<\/span> + tribals displaced"},{"t":"Cases: Goa and Bellary iron ore (illegal mining, SC bans) + Jharia coal fires","h":"Cases"},{"sec":"Solutions"},{"t":": <span class=\"cm\" data-c=\"3\">EIA + District Survey Reports<\/span> + Sustainable Sand Mining Guidelines 2016 + Enforcement Guidelines 2020 (mine only what rivers refill) + Deepak Kumar case (2012: clearance even for small sand mines) <button class=\"hs chipx\" data-h=\"0\">Go / No-Go zones<\/button>","h":"P","lt":1},{"t":"drones (Telangana; Punjab with IIT Ropar) + GPS-tracked trucks + digital sand tracking + satellite checks","h":"I","lt":1},{"t":"mine closure plans + reclaim and afforest mined land","h":"N","lt":1},{"t":"Punjab model: farmers legally mine up to 3 ft on their land + registered crusher sites → starves illegal cartels","h":"C","lt":1},{"t":"<span class=\"cm\" data-c=\"7\">M-Sand<\/span> (crushed rock) + recycle construction waste","h":"H","lt":1},{"t":"<span class=\"cm\" data-c=\"8\">DMF/PMKKKY<\/span> money for affected people + star rating of mines","h":"F","lt":1},{"sec":"Cases"},{"t":"<button class=\"hs\" data-h=\"1\">Aravallis<\/button>"},{"t":"Sand mining <button class=\"hs chipx\" data-h=\"2\">River sand mining<\/button><button class=\"hs chipx\" data-h=\"3\">Coastal sand mining + erosion<\/button>"}],"hs":[{"t":"Go / No-Go zones","b":"<ul><li>MoEF + Coal Ministry (2009–10): coal blocks split into \"Go\" (mining allowed) and \"No-Go\" (dense forest: &gt;30% gross or &gt;10% <span class=\"cm\" data-c=\"4\">weighted forest cover) → about<\/span> a third No-Go → later diluted (\"<span class=\"cm\" data-c=\"5\">inviolate forest\"<\/span>)<\/li><li>Revived: SC in <span class=\"cm\" data-c=\"6\">Saranda (2025) ordered<\/span> a mining plan with Go/No-Go zones from geo-referenced ecological maps → same model asked for the Aravallis<\/li><\/ul>"},{"t":"Aravallis","b":"<ul><li>Oldest fold mountains (≈692 km, Delhi → Haryana → Rajasthan → Gujarat): wall against the Thar + groundwater + Khetri copper<\/li><li>Definition row: SC (Nov 2025) accepted \"hill = 100 m above surroundings, range = 2+ hills within 500 m\" → low hills lose protection → protests → SC stayed it (Dec 2025) + Centre banned new leases (except critical minerals)<\/li><li>Fix: one continuous ridge, one definition + Aravalli Green Wall (5 km buffer, 4 states) + Go/No-Go mining plan<\/li><li>Worked: Save Aravalli movement (Rajendra Singh → SC halted Sariska mining, 1990) + Mangar Bani no-construction zone<\/li><\/ul>"},{"t":"River sand mining","b":"<ul><li>Riverbed mining changes river flow + lowers groundwater + kills river life + sand mafia violence<\/li><li>Fix: replenishment studies (SC) + M-Sand + drones + national aggregates body<\/li><\/ul>"},{"t":"Coastal sand mining + erosion","b":"<ul><li>Coastal mining → beach and dune erosion + seawater into aquifers and farms + Olive Ridley nesting beaches lost (Odisha) + fish breeding grounds hit · Alappad, Kerala (mineral sand, \"Save Alappad\" 2019) · CRZ bans it<\/li><li>Coastal erosion: 33.6% of India's coast eroding (West Bengal 63%, Puducherry 57%, Kerala 45%) + coastline re-measured 7,500 → 11,098 km<\/li><li>Causes: sea-level rise + stronger cyclones + mangroves lost + sand mining, dredging + ports and seawalls <span class=\"cm\" data-c=\"9\">block sand drift<\/span> + dams cut river silt<\/li><li>Fix: mangroves + sand nourishment + <span class=\"cm\" data-c=\"10\">Shoreline Management Plans<\/span> + CRZ 2019 <span class=\"cm\" data-c=\"11\">No Development Zones + World<\/span> Bank K-SHORE (Karnataka) + <span class=\"cm\" data-c=\"12\">ICZMP (Odisha, West Bengal) + CMIS<\/span><\/li><\/ul>"}],"cm":{"0":"Minor mineral = sand, gravel, stone etc. under the MMDR Act; states, not the Centre, give and police these leases, so control is weaker.","1":"Acid mine drainage = rain hits exposed rock in mines, turns acidic and carries heavy metals into rivers and groundwater.","2":"Tailings dam = a dam holding toxic sludge left after processing ore; when it breaks it floods villages with waste.","3":"District Survey Report = each district maps where sand can be mined and how much the rivers refill each year.","4":"Weighted forest cover = forest area adjusted for how dense it is, so thick forest counts more.","5":"Inviolate forest = forest that should never be opened to mining; the 2010s replacement for No-Go, applied far more loosely.","6":"Saranda = Asia's largest sal forest, in Jharkhand's iron-ore belt; SC made the state declare a sanctuary and plan mining by zones.","7":"M-Sand = manufactured sand, made by crushing hard rock; replaces river sand in concrete.","8":"DMF = District Mineral Foundation: mining companies pay a share of royalty for welfare of mine-affected people (PMKKKY scheme).","9":"Sand drift (longshore drift) = waves move sand along the coast; ports and seawalls block it, so beaches beyond them starve and erode.","10":"Shoreline Management Plan = a coast-wide plan deciding where to protect, let nature act, or retreat.","11":"No Development Zone (CRZ) = a strip from the high-tide line where new construction is banned. K-SHORE = Karnataka Strengthening Coastal Resilience and Economy: ₹840 crore, 7-year World Bank project for erosion control, mangroves, dunes and keeping plastic out of the sea (part of the World Bank's SHORE programme with Tamil Nadu).","12":"ICZMP = Integrated Coastal Zone Management Project (World Bank-backed): plans the coast as one unit (hazard lines, mangroves, livelihoods). CMIS = Coastal Management Information System: data network that tracks shoreline change."},"v":"ed602f"}],"circle":"g","pyq":["<b>2025 Q17 (15 marks):<\/b> Mineral resources are fundamental to the country’s economy and these are exploited by mining. Why is mining considered an environmental hazard? Explain the remedial measures required to reduce the environmental hazard due to mining.","<b>2025 Q8 (10 marks):<\/b> Seawater intrusion in the coastal aquifers is a major concern in India. What are the causes of seawater intrusion and the remedial measures to combat this hazard?","<b>2022 Q18 (15 marks):<\/b> Explain the causes and effects of coastal erosion in India. What are the available coastal management techniques for combating the hazard ?","<b>2019 Q7 (10 marks):<\/b> Coastal sand mining, whether legal or illegal, poses one of the biggest threats to our environment. Analyze the impact of sand mining along the Indians coasts, citing specific examples.","<b>2013 Q19 (10 marks):<\/b> What are the consequences of Illegal mining? Discuss the Ministry of Environment and Forest’s concept of GO AND NO GO zones for coal mining sector."]},{"id":"b-climate-change-the-problem","subj":"s02","name":"Climate change (the problem)","cards":[{"id":"b-climate-change-the-problem:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"Earth ≈1.1°C warmer than 1850 (<span class=\"cm\" data-c=\"0\">IPCC AR6) + 2024<\/span> the warmest year and first calendar year above 1.5°C (WMO) + CO₂ 424.6 ppm at Mauna Loa (2024, record) + warming rate up from 0.18 to 0.26°C (1990–2015 vs 2015–2025) + doubling CO₂ → 2.5–4°C (IPCC AR6) + every extra 0.5°C → more heat extremes, heavy rain, droughts (<span class=\"cm\" data-c=\"1\">IPCC SR1.5<\/span>) + <span class=\"cm\" data-c=\"2\">remaining<\/span> <mark>carbon budget<\/mark> for 1.5°C nearly used up"},{"sec":"Causes"},{"t":"policies lag pledges (≈8% gap between current policies and NDCs) + fossil subsidies","h":"P","lt":1},{"t":"<span class=\"cm\" data-c=\"3\">hard-to-abate sectors lack<\/span> clean tech: steel ≈12% of India's CO₂, cement ≈6%, aluminium ≈2.8% + <span class=\"cm\" data-c=\"4\">MSMEs run on<\/span> fossil fuels (≈135 Mt CO₂ in 2022) + India's share of world emissions 2.5% (1990) → 8.2% (2023) (Mains 365)","h":"I","lt":1},{"t":"<button class=\"hs\" data-h=\"0\">natural causes<\/button> explain past ice ages, not the fast warming since 1950 (IPCC AR6: unequivocally human-caused)","h":"N","lt":1},{"t":"consumption-heavy lifestyles (answer: <span class=\"cm\" data-c=\"6\">Mission LiFE<\/span>)","h":"C","lt":1},{"t":"fossil fuels (coal ≈71% of India's power generation) + land-use change + methane from rice, livestock, landfills + NITI net-zero report: fossil fuels still <span class=\"cm\" data-c=\"7\">87% of primary energy<\/span> + ≈1.3 Gt still emitted in 2070 (farms, cement, heavy industry) + 150+ districts live off coal and thermal power (Mains 365) <button class=\"hs chipx\" data-h=\"1\">Greenhouse gases<\/button>","h":"H","lt":1},{"t":"≈$250 billion a year needed till 2047 (NITI) + island states got only $1 billion of the $100 billion pledged","h":"F","lt":1},{"t":"weak global cooperation: pledges unmet + trade fights (<span class=\"cm\" data-c=\"9\">CBAM<\/span>) → see Climate negotiations","h":"C","lt":1},{"sec":"Effects"},{"t":"Health: 2.5 lakh extra deaths a year (2030–50, WHO) + heat, disease spread <button class=\"hs chipx\" data-h=\"2\">IPCC impacts<\/button>","h":"Health"},{"t":"Environment: glaciers, <button class=\"hs\" data-h=\"4\">oceans<\/button>, <button class=\"hs\" data-h=\"5\">AMOC<\/button>, extreme weather, <button class=\"hs\" data-h=\"7\">ozone<\/button> <button class=\"hs chipx\" data-h=\"3\">Glaciers + Himalaya<\/button><button class=\"hs chipx\" data-h=\"6\">Extreme weather + ENSO<\/button>","h":"Environment"},{"t":"Economy: <span class=\"cm\" data-c=\"24\">farm yields fall<\/span> + <mark>adaptation gap<\/mark>: finance far below need <button class=\"hs chipx\" data-h=\"8\">Economic + farm impacts<\/button>","h":"Economy"},{"t":"Governance: relief burden + <mark>climate litigation<\/mark> <span class=\"cm\" data-c=\"25\">grows (MK Ranjitsinh<\/span> 2024: right against climate change under Arts 14, 21)","h":"Governance"},{"t":"Society: climate pushes people into poverty: floods and droughts trap farmers in debt + tribals hit hardest + a 1-unit rise in the services share of state GDP cuts poverty odds ≈1.9% → fix: district-level plans + non-farm jobs + social protection","h":"Society"},{"t":"Society: coasts drown, people move <button class=\"hs chipx\" data-h=\"9\">Sea-level rise + coasts<\/button><button class=\"hs chipx\" data-h=\"10\">Migration<\/button>","h":"Society"},{"sec":"Solutions"},{"t":"<span class=\"cm\" data-c=\"32\">NAPCC (9 missions) + State<\/span> Action Plans on Climate Change + <span class=\"cm\" data-c=\"33\">National Adaptation Plan<\/span> + a carbon market <button class=\"hs chipx\" data-h=\"11\">Carbon markets<\/button>","h":"P","lt":1},{"t":"capture and new removal tech <button class=\"hs chipx\" data-h=\"12\">CCUS<\/button>","h":"I","lt":1},{"t":"also <span class=\"cm\" data-c=\"40\">enhanced rock weathering<\/span> (basalt on fields) + methane feed additives for cattle (<span class=\"cm\" data-c=\"41\">3-NOP<\/span>, red seaweed: cut 30–80%) + <span class=\"cm\" data-c=\"42\">Direct Ocean Capture<\/span> (seawater holds ≈140x more CO₂ per volume than air)","h":"I","lt":1},{"t":"grow the <mark>carbon sink<\/mark> (2.29 billion t added by 2021) + <span class=\"cm\" data-c=\"43\">MISHTI<\/span> mangroves + adapt: climate-resilient crops (<span class=\"cm\" data-c=\"44\">NICRA<\/span>, <span class=\"cm\" data-c=\"45\">DBW-187 wheat<\/span>), <span class=\"cm\" data-c=\"46\">sponge cities<\/span>, heat and flood plans in every district + <span class=\"cm\" data-c=\"47\">Early Warnings for All<\/span> (UN, by 2027) + <span class=\"cm\" data-c=\"48\">Mission Mausam<\/span>","h":"N","lt":1},{"t":"remove carbon through land <button class=\"hs chipx\" data-h=\"13\">LBCR<\/button>","h":"N","lt":1},{"t":"Mission LiFE + direct-seeded rice + landfill methane to bio-CNG (ISRO hotspots: Pirana, Deonar, Ghazipur) + <span class=\"cm\" data-c=\"51\">Kerala's Pachathuruthu mini-forests<\/span>","h":"C","lt":1},{"t":"clean the source: renewables (see Renewable Energy) + green hydrogen (5 million t a year by 2030) + green steel + <span class=\"cm\" data-c=\"52\">refuse-derived fuel in<\/span> cement","h":"H","lt":1},{"t":"municipal green bonds (Ahmedabad) + <span class=\"cm\" data-c=\"53\">blended finance<\/span> + <span class=\"cm\" data-c=\"54\">climate budget tagging<\/span> (Odisha) + <mark>parametric insurance<\/mark> <span class=\"cm\" data-c=\"55\">for climate losses<\/span>","h":"F","lt":1},{"t":"global deals → see Climate negotiations + <span class=\"cm\" data-c=\"56\">ISA<\/span> + CDRI","h":"C","lt":1}],"hs":[{"t":"Natural causes","b":"<ul><li>Milankovitch cycles: Earth's orbit, tilt and wobble shift sunlight over ≈100,000 years → ice ages<\/li><li>Solar variability: few sunspots in the <span class=\"cm\" data-c=\"5\">Maunder Minimum<\/span> (1645–1715) → Little Ice Age<\/li><li>Volcanoes: Pinatubo 1991 aerosols → ≈0.5°C cooling for about two years<\/li><li>Also: ocean currents + plate tectonics, continental drift<\/li><\/ul>"},{"t":"Greenhouse gases","b":"<ul><li>CO₂ + methane + nitrous oxide + CFCs; methane traps ≈84x the heat of CO₂ over 20 years (lives ≈12 years) and caused ≈30% of warming since the Industrial Revolution (IEA 2025) + India not in the Global Methane Pledge (−30% by 2030)<\/li><li>Land-use change: forest cleared for farms absorbs more sunlight (south-east Amazon became a net carbon source, 2021)<\/li><li>Aerosols: scatter sunlight and change clouds (Indo-Gangetic winter haze)<\/li><li>Fossil CO₂ record 10.2 <span class=\"cm\" data-c=\"8\">GtC in<\/span> 2024; India 3rd largest emitter but low per capita (2.9 t vs world 6.7 t)<\/li><li>War: militaries ≈5.5% of global emissions (reporting voluntary under Paris) + Ukraine clean-up ≈34.6 billion dollars + Agent Orange stripped Vietnam's forests → Rome Statute: severe war damage to nature = war crime<\/li><\/ul>"},{"t":"IPCC impacts","b":"<ul><li>Species: up to 54% of land and sea species threatened at 2–3°C · corals: 70–90% die at 1.5°C<\/li><li>Systems: permafrost loses 15% by 2100 at 2°C (36–67 billion t of carbon released) + many ecosystems near the limits of adaptation<\/li><li>Society: each 1°C → 4.7% more intimate partner violence (UN 2025) + schools shut by heat<\/li><li>Belem Health Action Plan (COP30): first health adaptation plan (300 million dollars; 1 in 12 hospitals at risk of climate shutdown)<\/li><\/ul>"},{"t":"Glaciers + Himalaya","b":"<ul><li>Hindu Kush Himalaya warming 0.2°C per decade + 30–67% of glaciers may vanish by 2100 + melt rate doubled since 2000 (Ganga basin −21%, <span class=\"cm\" data-c=\"10\">ICIMOD<\/span>) + Nepal's Yala glacier declared dead + Gangotri retreating ≈20 m a year<\/li><li>Why faster: warming fastest at 4,500–6,000 m + black carbon + less seasonal snow<\/li><li>Effects: <span class=\"cm\" data-c=\"11\">GLOFs<\/span> and debris flows (Chamoli 2021, Sikkim 2023) + <span class=\"cm\" data-c=\"12\">less albedo<\/span> → more warming + rivers fed less in summer later<\/li><li><span class=\"cm\" data-c=\"13\">India: NMSHE + Himansh station + National GLOF Risk Mitigation Programme · World<\/span>: 2025 Year of Glaciers' Preservation<\/li><\/ul>"},{"t":"Oceans","b":"<ul><li>Absorb 90% of excess heat + ≈30% of human CO₂ · 2025: record extra 23 zettajoules of heat<\/li><li>4th global coral bleaching (2024) + warmer Arabian Sea → stronger west-coast cyclones (Tauktae 2021, Biparjoy 2023)<\/li><li><span class=\"cm\" data-c=\"14\"><mark>Ocean acidification<\/mark><\/span> + oxygen loss + <mark>marine heatwaves<\/mark> 34% more <span class=\"cm\" data-c=\"15\">frequent s
