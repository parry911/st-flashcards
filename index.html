rescent lamp, the curly tube bulb that came before LEDs.","5":"BESS = Battery Energy Storage System: big battery banks that store solar or wind power and release it when needed (at night, at peak).","6":"DISCOM = state power distribution company that buys power and sells it to homes; most are in debt, so they pay generators late.","7":"Stranded assets = coal plants and mines that become unprofitable before they're paid off because cheaper clean power takes over.","8":"Renewable Energy Management Centres = control rooms that forecast solar and wind output and balance the grid in real time.","9":"Green Energy Open Access = big consumers (100 kW+) can buy green power directly from any producer instead of only their DISCOM. Status: Karnataka HC struck the central Rules down in Jan 2025 (only state commissions can make open-access rules) → states now notify their own green open access regulations (Haryana, Rajasthan 2025; Delhi 2026).","10":"ACC = Advanced Chemistry Cell (lithium-ion and newer batteries); PLI = Production Linked Incentive, cash rewards for making them in India. Pumped storage = pump water uphill when power is spare, release it through turbines when needed: a giant water battery.","11":"Methanol = a liquid fuel made from coal, gas or captured CO₂; it can be blended in petrol or used in ships.","12":"Coal gasification = turning coal into gas (syngas) for fuels and chemicals instead of burning it, so pollutants are easier to capture.","13":"OSOWOG = One Sun One World One Grid: link solar grids across countries so the sun is always shining somewhere. GGI = Green Grids Initiative, its launch platform.","14":"PLI = Production Linked Incentive: the government pays makers a share of their extra sales for 4–6 years, to build factories in India (solar modules, batteries, electrolysers).","15":"PMKKKY = Pradhan Mantri Khanij Kshetra Kalyan Yojana (2015): spends District Mineral Foundation money on the people and areas hit by mining.","16":"JETP = Just Energy Transition Partnership: rich countries' finance package to help a country move off coal (South Africa, Indonesia, Vietnam). Green bonds = loans raised from investors only for green projects."},"v":"c3c907"}],"circle":"g","pyq":["<b>2025 Q6 (10 marks):<\/b> How can India achieve energy independence through clean technology by 2047? How can biotechnology play a crucial role in this endeavour?","<b>2022 Q12 (15 marks):<\/b> Do you think India will meet 50 percent of its energy needs from renewable energy by 2030 ? Justify your answer. How will the shift of subsidies from fossil fuels to renewables help achieve the above objective ? Explain.","<b>2018 Q1 (10 marks):<\/b> “Access to affordable, reliable, sustainable and modern energy is the sine qua non to achieve Sustainable Development Goals (SDGs)”.Comment on the progress made in India in this regard.","<b>2016 Q11 (12.5 marks):<\/b> Give an account of the current status and the targets to be achieved pertaining to renewable energy sources in the country. Discuss in brief the importance of National Programme on Light Emitting Diodes (LEDs).","<b>2013 Q11 (10 marks):<\/b> Write a note on India’s green energy corridor to alleviate the problem of conventional energy."]},{"id":"b-solar","subj":"s04","name":"Solar","cards":[{"id":"b-solar:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"150 GW (Mar 2026), 3rd in the world (Rajasthan, Gujarat, Tamil Nadu top) + potential ≈3,343 GW, rooftop alone 750 GW + ≈300 sunny days a year"},{"t":"Benefits: no fuel to import + no emissions + sits on rooftops and farms + fastest to build","h":"Benefits"},{"t":"Examples: Bhadla, Rajasthan (≈2.2 GW on desert land) + Modhera, Gujarat (first 24x7 solar village, 2022)","h":"Examples"},{"sec":"Barriers"},{"t":"lag in latest cells (<span class=\"cm\" data-c=\"0\">PERC, bifacial<\/span>, thin-film)","h":"I","lt":1},{"t":"no power after sunset → storage needed","h":"N","lt":1},{"t":"households slow to put up rooftop panels (PM Surya Ghar target: 1 crore homes; upfront ₹40,000–70,000 per kW)","h":"C","lt":1},{"t":"≈80% of modules from China (≈35 million imported in FY25) + mining for solar minerals scars land (Economic Survey 2023–24)","h":"H","lt":1},{"t":"weak DISCOM finances","h":"F","lt":1},{"sec":"Fixes"},{"t":"protect domestic makers <button class=\"hs chipx\" data-h=\"0\">ALMM + PLI<\/button>","h":"P","lt":1},{"t":"move to PERC and bifacial cells","h":"I","lt":1},{"t":"one cross-border grid so the sun is always shining somewhere <button class=\"hs chipx\" data-h=\"1\">GGI–OSOWOG<\/button>","h":"N","lt":1},{"t":"solar for homes and farms <button class=\"hs chipx\" data-h=\"2\">PM Surya Ghar<\/button><button class=\"hs chipx\" data-h=\"3\">PM-KUSUM<\/button>","h":"C","lt":1},{"t":"reverse auctions keep tariffs low → now cheaper than coal <button class=\"hs chipx\" data-h=\"4\">Solar cost fall<\/button>","h":"F","lt":1}],"hs":[{"t":"ALMM + PLI","b":"<ul><li><span class=\"cm\" data-c=\"1\">ALMM<\/span>: only approved (mostly domestic) modules for government projects<\/li><li>PLI for solar PV + <span class=\"cm\" data-c=\"2\">National Solar Mission, 2010<\/span> + <span class=\"cm\" data-c=\"3\">Solar Park Scheme<\/span><\/li><\/ul>"},{"t":"GGI–OSOWOG","b":"<ul><li>Launched by India + UK at <span class=\"cm\" data-c=\"4\">COP26 (2 Nov 2021), run by ISA<\/span> with the World Bank → round-the-clock clean power, less storage needed<\/li><li>First floated by the PM at ISA's First Assembly, Oct 2018<\/li><li>Phases: India linked to Middle East, South Asia, South-East Asia → African power pools → global grid<\/li><li>Backed by 80+ ISA members (One Sun Declaration)<\/li><\/ul>"},{"t":"PM Surya Ghar","b":"<ul><li>Rooftop solar + 300 free units a month<\/li><li>1 crore families save ≈₹15,000 crore a year<\/li><\/ul>"},{"t":"PM-KUSUM","b":"<ul><li>Solar pumps for farmers + grid-connected solar on barren land<\/li><\/ul>"},{"t":"Solar cost fall","b":"<ul><li>Why: Chinese mass production + better cells + <span class=\"cm\" data-c=\"5\">reverse auctions<\/span> + solar parks with ready land and lines (new)<\/li><li>For thermal plants: run fewer hours, old units become stranded assets, coal shifts to backup role (new)<\/li><\/ul>"}],"cm":{"0":"PERC = a cheaper, more efficient solar cell design; bifacial panels catch sunlight on both sides; thin-film = flexible, lightweight panels.","1":"ALMM = Approved List of Models and Manufacturers: only listed (mostly Indian) solar panels can be used in government-backed projects.","2":"National Solar Mission (2010): one of the 8 NAPCC missions; first target 20 GW of solar by 2022, raised to 100 GW in 2015.","3":"Solar Park = a big plot with ready land, roads and grid lines where developers plug in solar plants cheaply.","4":"ISA = International Solar Alliance: India–France-led group of sunny countries (launched at COP21, 2015) to spread solar power; HQ in Gurugram. One Sun Declaration (COP26) = 80+ countries backing the one-world-grid idea.","5":"Reverse auction = developers bid the lowest price per unit to win a project, which pushed solar tariffs down."},"v":"5af3f1"}],"circle":"g","pyq":["<b>2021 Q6 (10 marks):<\/b> Explain the purpose of the Green Grid Initiative launched at World Leaders Summit of the COP26 UN Climate Change Conference in Glasgow in November, 2021. When was this idea first floated in the International Solar Alliance (ISA) ?","<b>2020 Q16 (15 marks):<\/b> Describe the benefits of deriving electric energy from sunlight in contrast to the conventional energy generation. What are the initiatives offered by our Government for this purpose?","<b>2015 Q9 (12.5 marks):<\/b> To what factors can be the recent dramatic fall in equipment cost and tariff of solar energy be attributed? What implications does the trend have for thermal power producers and related industry?"]},{"id":"b-wind","subj":"s04","name":"Wind","cards":[{"id":"b-wind:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"≈56 GW (2026; 21 GW in 2014), 4th in the world + offshore potential ≈36 GW off Gujarat and Tamil Nadu"},{"t":"Benefits: 70–80% of components made in India → less import dependence than solar","h":"Benefits"},{"t":"Example: Muppandal, Tamil Nadu (India's largest wind cluster)","h":"Example"},{"sec":"Barriers"},{"t":"<span class=\"cm\" data-c=\"0\">big minimum project size<\/span>","h":"P","lt":1},{"t":"offshore turbines are noisy for marine life","h":"N","lt":1},{"t":"land acquisition delays + power lines kill Great Indian Bustards (Thar, Kutch)","h":"H","lt":1},{"t":"offshore costly (salt corrosion)","h":"F","lt":1},{"t":"states slow on intra-state transmission lines","h":"C","lt":1},{"sec":"Fixes"},{"t":"<span class=\"cm\" data-c=\"1\">Green Open Access Rules 2022<\/span>","h":"P","lt":1},{"t":"<span class=\"cm\" data-c=\"2\">repower old low-height turbines<\/span>","h":"I","lt":1},{"t":"wind-solar hybrids (<span class=\"cm\" data-c=\"3\">Hybrid Policy 2018<\/span>)","h":"N","lt":1},{"t":"<span class=\"cm\" data-c=\"4\">viability gap funding for<\/span> offshore <button class=\"hs chipx\" data-h=\"0\">Offshore wind<\/button>","h":"F","lt":1}],"hs":[{"t":"Offshore wind","b":"<ul><li><span class=\"cm\" data-c=\"5\">National Offshore Wind Energy Policy 2015<\/span> + offshore VGF<\/li><li>≈36 GW potential off Gujarat and Tamil Nadu<\/li><li>India–UK offshore wind taskforce<\/li><\/ul>"}],"cm":{"0":"Big minimum project size = central auctions and direct grid connection need large utility-scale wind farms, typically 50 MW or more.","1":"Green Energy Open Access Rules 2022: any consumer with 100 kW+ load (earlier 1 MW) can buy wind or solar power directly from a producer through the grid, not only from its DISCOM. Why it matters: factories and offices can go green on their own → demand for wind and solar grows beyond government auctions and weak DISCOMs + no surcharges for green hydrogen + offshore wind waiver till 2032. Status: Karnataka HC struck the central Rules down (Jan 2025: only state commissions can make open-access rules) → states now make their own green open access regulations.","2":"Repowering = replacing old small wind turbines with taller, stronger ones on the same site to get more power.","3":"Wind-solar hybrid = wind and solar at the same site sharing one grid line; wind blows at night, sun in the day.","4":"VGF (viability gap funding) = a one-time government grant that covers the part of a project's cost the market won't pay.","5":"National Offshore Wind Energy Policy 2015: opens India's sea, up to 200 nautical miles (EEZ), to wind farms; NIWE, Chennai, is the nodal agency that allots blocks."},"v":"c6cb31"}],"circle":"y"},{"id":"b-hydro","subj":"s04","name":"Hydro","cards":[{"id":"b-hydro:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"hydro gives flexible power that balances solar and wind; pumped storage works as a giant battery <button class=\"hs chipx\" data-h=\"0\">Run-of-river<\/button>"},{"t":"Barriers: <b>N<\/b> fragile Himalaya (Chamoli 2021 hit the Tapovan project; Sikkim 2023 broke the Chungthang dam) + <b>C<\/b> displacement and local protests","h":"Barriers"},{"t":"Fixes: minimum e-flow + careful siting + pumped storage for RE","h":"Fixes"}],"hs":[{"t":"Run-of-river","b":"<ul><li><span class=\"cm\" data-c=\"0\">Uses the river's natural flow with little<\/span> or no reservoir: water diverted through a tunnel to turbines, then returned downstream (new)<\/li><li>vs storage dam: a big reservoir stores water and generates on demand; run-of-river output rises and falls with river flow (new)<\/li><li>Pros: less submergence and displacement · Cons: dry stretch between intake and outlet + weak in the lean season (new)<\/li><\/ul>"}],"cm":{"0":"Run-of-river = a hydro plant that uses the river's natural flow without a big dam or reservoir."},"v":"6bda2f"}],"circle":"g","pyq":["<b>2013 Q17b (5 marks):<\/b> What do you understand by Run-of-river hydroelectricity project? How is it different from any other hydroelectricity project?"]},{"id":"b-nuclear","subj":"s04","name":"Nuclear","cards":[{"id":"b-nuclear:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"8.18 GW (Jan 2025) → 22.48 GW by 2031–32 → <mark>100 GW by 2047<\/mark> (<span class=\"cm\" data-c=\"0\">Nuclear Energy Mission<\/span>, Budget 2025–26)"},{"t":"Benefits: large thorium reserves + low pollution + little land + 24x7 power","h":"Benefits"},{"t":"Examples: Kudankulam (largest plant, <span class=\"cm\" data-c=\"1\">Russian VVERs<\/span>) · Jaitapur (planned since 2010, stuck on liability, cost, protests)","h":"Examples"},{"t":"Three-stage programme <button class=\"hs chipx\" data-h=\"0\">3-stage + FBR<\/button>"},{"t":"<button class=\"hs\" data-h=\"1\">Facts vs fears<\/button>"},{"t":"Fusion <button class=\"hs chipx\" data-h=\"2\">ITER<\/button>"},{"sec":"Barriers"},{"t":"liability law (<span class=\"cm\" data-c=\"8\">CLNDA 2010<\/span>) kept suppliers away now shanti act introduced","h":"P","lt":1},{"t":"uranium shortfall + extraction needs sulphuric acid","h":"N","lt":1},{"t":"locals not consulted → protests (Kudankulam)","h":"C","lt":1},{"t":"high cost, long delays (PFBR ≈16 years late)","h":"F","lt":1},{"sec":"Fixes"},{"t":"<span class=\"cm\" data-c=\"9\">SHANTI Act<\/span> + amendments to Atomic Energy Act 1962 and CLNDA 2010 for private participation","h":"P","lt":1},{"t":"<span class=\"cm\" data-c=\"10\">Bharat Small Reactors<\/span> + at least 5 SMRs by 2033","h":"I","lt":1},{"t":"put reactors on retiring coal-plant sites","h":"H","lt":1}],"hs":[{"t":"3-stage + FBR","b":"<ul><li>Stage 1: <span class=\"cm\" data-c=\"2\">heavy-water reactors<\/span> on natural uranium → plutonium · Stage 2: fast breeders burn plutonium <span class=\"cm\" data-c=\"3\">(MOX)<\/span> and breed more fuel than they use · Stage 3: thorium<\/li><li><span class=\"cm\" data-c=\"4\">PFBR, Kalpakkam<\/span> (500 MWe, <span class=\"cm\" data-c=\"5\">BHAVINI<\/span>): first criticality 6 Apr 2026 → India enters stage 2 (new, PIB)<\/li><li>Advantage: unlocks India's thorium + fuel security<\/li><li>But: ≈16 years late, cost more than doubled (new)<\/li><\/ul>"},{"t":"Facts vs fears","b":"<ul><li>Facts: 24x7 low-carbon power + little land + thorium future<\/li><li>Fears: accidents (Fukushima 2011) + long-lived waste + liability + delays and cost (PFBR) + local protests (Jaitapur, Kudankulam)<\/li><\/ul>"},{"t":"ITER","b":"<ul><li>ITER, France: 7 members (EU, US, Russia, China, Japan, Korea, India); India's share ≈9%, given in kind (new)<\/li><li>India built the 3,850-tonne <span class=\"cm\" data-c=\"6\">cryostat<\/span> (its largest of 14 packages) + in-wall shielding, cooling water and cryogenic systems, diagnostics (new, ITER)<\/li><li>Domestic base: <span class=\"cm\" data-c=\"7\">Aditya tokamak<\/span> at the Institute for Plasma Research<\/li><li>If it works: near-limitless fuel from seawater, no long-lived waste, no meltdown risk, but commercial power is decades away<\/li><\/ul>"}],"cm":{"0":"Nuclear Energy Mission = Budget 2025–26 push for 100 GW of nuclear power by 2047, incl. small reactors and private players.","1":"VVER = Russian-design pressurised water reactor, used at Kudankulam.","2":"Heavy-water reactor (PHWR) = India's main reactor type, runs on natural uranium and uses heavy water to slow neutrons.","3":"MOX = mixed oxide fuel: uranium plus plutonium. Fast breeder = a reactor that makes more fuel than it burns.","4":"PFBR = Prototype Fast Breeder Reactor: India's first fast breeder (500 MWe) at Kalpakkam; makes more fuel than it burns.","5":"BHAVINI = Bharatiya Nabhikiya Vidyut Nigam, the PSU that built and runs the Kalpakkam fast breeder.","6":"Cryostat = the giant steel vacuum shell that keeps ITER's magnets super-cold.","7":"Tokamak = a doughnut-shaped machine that holds super-hot plasma with magnets for fusion. Aditya = India's first, at IPR Gandhinagar.","8":"CLNDA = Civil Liability for Nuclear Damage Act 2010: lets the operator sue suppliers after an accident, which scared foreign suppliers away.","9":"SHANTI Act = the new nuclear law opening the sector to private players and reworking the liability rules.","10":"Bharat Small Reactor = 220 MW Indian reactor for captive use by industry. SMR = small modular reactor, factory-built and easy to place."},"v":"b49225"}],"circle":"g","pyq":["<b>2025 Q5 (10 marks):<\/b> The fusion energy programme in India has steadily evolved over the past few decades. Mention India’s contributions to the international fusion energy project – International Thermonuclear Experimental Reactor (ITER). What will be the implications of the success of this project for the future of global energy?","<b>2018 Q16 (15 marks):<\/b> With growing energy needs should India keep on expanding its nuclear energy programme? Discuss the facts and fears associated with nuclear energy.","<b>2017 Q16 (15 marks):<\/b> Give an account of the growth and development of nuclear science and technology in India. What is the advantage of fast breeder reactor programme in India?"]},{"id":"b-hydrogen","subj":"s04","name":"Hydrogen","cards":[{"id":"b-hydrogen:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"India uses ≈6.5 million t of hydrogen a year, mostly grey"},{"t":"Benefits: <span class=\"cm\" data-c=\"0\">cleans hard-to-abate sectors (steel<\/span>, cement, fertiliser, refineries) + energy security + 3x the energy of petrol per kg","h":"Benefits"},{"t":"Examples: Leh green-hydrogen buses (NTPC, 2023) + NTPC Kawas, Gujarat (hydrogen blended into piped gas, 2023) <button class=\"hs chipx\" data-h=\"0\">Hydrogen colours<\/button>","h":"Examples"},{"sec":"Barriers"},{"t":"storage and safety (flammable)","h":"I","lt":1},{"t":"up to 9 litres of water per kg","h":"N","lt":1},{"t":"most hydrogen still grey","h":"H","lt":1},{"t":"$4–7 per kg, still costly","h":"F","lt":1},{"sec":"Fixes"},{"t":"demand mandates for fertiliser and refineries <button class=\"hs chipx\" data-h=\"1\">NGHM<\/button>","h":"P","lt":1},{"t":"cheaper electrolysers (PLI)","h":"H","lt":1},{"t":"green hydrogen hubs","h":"C","lt":1}],"hs":[{"t":"Hydrogen colours","b":"<ul><li>Grey: from natural gas, CO₂ released<\/li><li>Blue: from gas, CO₂ captured (CCUS); bridge fuel, cheaper now<\/li><li><span class=\"cm\" data-c=\"1\">Green: electrolysis<\/span> of water with RE, zero carbon<\/li><li>Pink: electrolysis with nuclear power, 24x7 (BARC research)<\/li><\/ul>"},{"t":"NGHM","b":"<ul><li>National Green Hydrogen Mission (2023): 5 million t of green hydrogen a year by 2030 + 1 lakh crore cut in fossil fuel imports  + 50 MMT of GHG averted + 125 GW capacity will be added<\/li><li><span class=\"cm\" data-c=\"2\">SIGHT incentives<\/span> + hydrogen hubs + certification scheme<\/li><li>Pilots: GAIL blending in CNG and PNG (Indore) + first hydrogen train coach (ICF) + Kandla port plant + Varanasi fuel-cell boat<\/li><\/ul>"}],"cm":{"0":"Hard-to-abate = heavy industries (steel, cement, fertiliser) whose emissions can't be cut easily just by switching to renewable power.","1":"Electrolysis = splitting water into hydrogen and oxygen using electricity.","2":"SIGHT = Strategic Interventions for Green Hydrogen Transition: incentives for making electrolysers and green hydrogen in India."},"v":"73a92d"}],"circle":"y"},{"id":"b-bioenergy","subj":"s04","name":"Bioenergy","cards":[{"id":"b-bioenergy:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"bioenergy ≈11.6 GW (Nov 2025) + waste-to-energy ≈0.85 GW + modern bioenergy = 13% of final energy use"},{"t":"Benefits: farm waste becomes energy + less stubble burning + farmer income (Annadata to Urjadata) + forex saved <button class=\"hs chipx\" data-h=\"0\">Biofuel generations<\/button>","h":"Benefits"},{"sec":"Barriers"},{"t":"ethanol policy leans on cane and grain (1st gen) → food vs fuel","h":"P","lt":1},{"t":"2G plants run well below capacity (<span class=\"cm\" data-c=\"0\">Panipat 2G refinery<\/span>)","h":"I","lt":1},{"t":"cane is water-heavy → more blending = more cane = more water + biomass has competing uses (fodder, manure)","h":"N","lt":1},{"t":"mixed wet waste burns poorly → waste-to-energy plants underrun + emissions near homes (Okhla, NGT fine 2017)","h":"C","lt":1},{"t":"weak straw supply chain + no organised biomass market (<i>fragmented human coordination<\/i>—individual smallholders lack the labour, baling capacity, and market intermediaries to aggregate paddy straw.)","h":"H","lt":1},{"t":"low private investment","h":"F","lt":1},{"sec":"Fixes"},{"t":"blending mandates <button class=\"hs chipx\" data-h=\"1\">E20 / EBP<\/button>","h":"P","lt":1},{"t":"2G ethanol (<span class=\"cm\" data-c=\"3\">PM JI-VAN<\/span>) + online emission monitoring at waste-to-energy plants","h":"I","lt":1},{"t":"villages run their own biogas from dung and farm waste (GOBARdhan) + segregation at source so waste-to-energy plants get only dry waste (SWM Rules 2026) + biomethanation for wet waste <button class=\"hs chipx\" data-h=\"2\">SATAT + GOBARdhan<\/button>","h":"C","lt":1},{"t":"<span class=\"cm\" data-c=\"8\"><b>H<\/b><\/span>: <span class=\"cm\" data-c=\"9\">FPO-run biomass depots<\/span> + national biomass repository + GIS maps of biomass + plants near the feedstock"},{"t":"viability gap funding <button class=\"hs chipx\" data-h=\"3\">Biotech role<\/button>","h":"F","lt":1}],"hs":[{"t":"Biofuel generations","b":"<ul><li>1st: edible crops (sugarcane, wheat, corn) → food vs fuel<\/li><li>2nd: non-edible parts (straw, grass, wood)<\/li><li>3rd: algae · 4th: waste to fuel (pyrolysis)<\/li><\/ul>"},{"t":"E20 / EBP","b":"<ul><li><span class=\"cm\" data-c=\"1\">EBP (2003) → E20 met in 2025, 5 years early<\/span>; E20 mandatory with <span class=\"cm\" data-c=\"2\">RON 95<\/span> from 1 Apr 2026<\/li><li>₹1.84 lakh crore forex saved + ₹1.58 lakh crore to farmers + maize share 0% → 42%<\/li><li>Cane / maize ethanol cut GHG 65% / 50% vs petrol (NITI)<\/li><li>National Policy on Biofuels 2018 (rev. 2022): E20 by 2025 + 2G ethanol, biodiesel, bio-CNG + non-food feedstock<\/li><li>Support: Ethanol Interest Subvention + GST 18% → 5%<\/li><li>Concerns: food diverted + water-heavy cane + 3–7% lower mileage in older vehicles<\/li><\/ul>"},{"t":"SATAT + GOBARdhan","b":"<ul><li>Lehragaga, Sangrur, Punjab: India's largest <span class=\"cm\" data-c=\"4\">compressed biogas plant<\/span> on paddy straw <span class=\"cm\" data-c=\"5\">(SATAT, 2022)<\/span><\/li><li>Indore <span class=\"cm\" data-c=\"6\">GOBARdhan<\/span>: wet waste → Bio-CNG for city buses (2022)<\/li><li><span class=\"cm\" data-c=\"7\">National Bioenergy Programme<\/span> (2022, ₹1,715 crore)<\/li><\/ul>"},{"t":"Biotech role","b":"<ul><li>Enzymes break straw into 2G ethanol + algae for 3rd-gen fuel + microbes for biogas and bio-CNG (new)<\/li><li>Turns waste into fuel → less oil import, the path to energy independence by 2047 (new)<\/li><\/ul>"}],"cm":{"0":"2G ethanol = ethanol made from crop waste (straw, stalks) instead of food crops.","1":"EBP = Ethanol Blended Petrol programme; E20 = 20% ethanol in petrol.","2":"RON 95 = octane rating of petrol; higher octane needed for E20 to run smoothly in engines.","3":"PM JI-VAN = scheme giving viability gap funding to build 2G ethanol plants.","4":"Compressed biogas (CBG) = biogas cleaned and compressed to work like CNG in vehicles.","5":"SATAT = Sustainable Alternative Towards Affordable Transportation (2018): oil companies promise to buy compressed biogas from new plants that run on farm waste, dung and city waste.","6":"GOBARdhan = scheme turning cattle dung and farm waste into biogas and manure in villages.","7":"National Bioenergy Programme (MNRE, 2022–26): funds waste-to-energy, biomass (briquettes, pellets) and biogas plants.","8":"H = human collectives (FPOs running collection depots) with decision-support tools (GIS maps that show planners and FPOs where surplus biomass is).","9":"FPO = Farmer Producer Organisation: a farmers' company that can collect and sell straw in bulk."},"v":"cdc1aa"}],"circle":"g","pyq":["<b>2025 Q6 (10 marks):<\/b> How can India achieve energy independence through clean technology by 2047? How can biotechnology play a crucial role in this endeavour?"]},{"id":"b-evs","subj":"s04","name":"EVs","cards":[{"id":"b-evs:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"EV share 7.6% (2024) → 30% by 2030 (NITI) + <span class=\"cm\" data-c=\"0\">India Electric Mobility Index<\/span>: Delhi 1st"},{"t":"Benefits: ≈3x less CO₂ even on today's grid + ≈60% energy efficiency vs ≈20% for petrol + 30% EVs by 2030 saves ≈₹1.1 lakh crore of oil imports a year","h":"Benefits"},{"sec":"Barriers"},{"t":": <span class=\"cm\" data-c=\"1\">inverted GST<\/span> (18% on inputs, 5% on EVs)","h":"P","lt":1},{"t":"battery minerals (lithium, cobalt) imported","h":"N","lt":1},{"t":"e-buses and e-trucks cost 2–3x + public charging ≈4x the cost of home charging","h":"F","lt":1},{"sec":"Fixes"},{"t":"battery recycling under EPR (2022 rules) + National Critical Mineral Mission for lithium","h":"P","lt":1},{"t":"EVs as grid batteries <button class=\"hs chipx\" data-h=\"0\">V2G<\/button>","h":"I","lt":1},{"t":"subsidies for EVs and charging <button class=\"hs chipx\" data-h=\"1\">PM E-DRIVE<\/button>","h":"F","lt":1}],"hs":[{"t":"V2G","b":"<ul><li><span class=\"cm\" data-c=\"2\">Vehicle-to-grid<\/span>: EVs send power back to the grid → owner earns, battery lasts longer, helps meet peak demand<\/li><\/ul>"},{"t":"PM E-DRIVE","b":"<ul><li>2024, <span class=\"cm\" data-c=\"3\">replaced FAME-II<\/span>: subsidies for EVs and charging<\/li><li>PM e-Bus Sewa (38,000+ buses) + 5% GST on EVs<\/li><\/ul>"}],"cm":{"0":"India Electric Mobility Index: NITI Aayog + WRI India ranking of states on EV adoption, charging readiness and EV research; 1st edition Aug 2025, 2nd Sep 2026 (Delhi top both times).","1":"Inverted GST = parts (batteries, components) are taxed at 18% but the finished EV only at 5%, so makers can't recover the extra tax paid.","2":"Vehicle-to-grid = parked EVs feed power back to the grid at peak times.","3":"FAME-II = the earlier EV subsidy scheme (2019–24), replaced by PM E-DRIVE."},"v":"74c526"}],"circle":"g"},{"id":"b-dm-spine","subj":"s05","name":"DM spine","cards":[{"id":"b-dm-spine:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"India is multi-hazard: 59% of land quake-prone + 12% (40 million ha) flood-prone + 5,700 of 7,500 km coast exposed to cyclones and tsunamis + 68% of farmland drought-prone + 5.4 million displaced in 2024 (<span class=\"cm\" data-c=\"0\">IDMC<\/span>) <button class=\"hs chipx\" data-h=\"0\">Risk formula<\/button>"},{"sec":"Causes"},{"t":"building codes poorly enforced + expert warnings ignored (Joshimath: <span class=\"cm\" data-c=\"3\">Mishra Committee warned in 1976<\/span>)","h":"P","lt":1},{"t":"flash floods and cloudbursts hard to forecast, no local warning (Dharali, Uttarkashi 2025)","h":"I","lt":1},{"t":"the hazard itself + climate change makes extremes more frequent","h":"N","lt":1},{"t":"lakes and floodplains encroached (Chennai 2015) communities, and forest and tribals specially vulnerable (assam floods)","h":"C","lt":1},{"t":"building on unstable slopes + deforestation + mining + hydel projects (Himachal 2023)","h":"H","lt":1},{"t":"insurance covers only ≈3.7%, most losses uninsured","h":"F","lt":1},{"t":"agencies poorly coordinated (Kerala 2018 dam releases, Kedarnath 2013)","h":"C","lt":1},{"sec":"Effects"},{"t":"Health: deaths and injuries · Environment: ecosystems wrecked · Economy: losses doubled in 20 years <span class=\"cm\" data-c=\"4\">(GAR 2025)<\/span> · Governance: providing relief burden on states · Society: poor, women, disabled hit hardest","h":"Health · Environment · Economy · Governance · Society"},{"sec":"Solutions"},{"t":"retrofit schools and hospitals first + <span class=\"cm\" data-c=\"5\">safe infrastructure (CDRI)<\/span> · $1 on DRR saves $15 (GAR 2025)","h":"P","lt":1},{"t":"disaster lessons in NCERT Classes 8–10 + mock drills (<span class=\"cm\" data-c=\"6\">Exercise Suraksha Chakra 2025<\/span>: 55 sites, 18 districts in NCR)","h":"A","lt":1},{"t":"<span class=\"cm\" data-c=\"7\">hazard maps + Disaster Risk Index<\/span> for sharing funds","h":"R","lt":1},{"t":"disaster funds + risk transfer <button class=\"hs chipx\" data-h=\"1\">Disaster finance<\/button><button class=\"hs chipx\" data-h=\"2\">Insurance<\/button>","h":"F","lt":1},{"t":"<span class=\"cm\" data-c=\"15\">response: NDRF (16 battalions)<\/span> + <span class=\"cm\" data-c=\"16\">Incident Response System<\/span> + <span class=\"cm\" data-c=\"17\">ERSS-112 + golden hour<\/span> (Silkyara 2023: 41 rescued after 17 days) · recovery: <span class=\"cm\" data-c=\"18\">post-disaster needs assessment<\/span> + <mark>build back better<\/mark> (Bhuj 2001: owner-driven rebuilding)","h":"R","lt":1},{"t":"<button class=\"hs\" data-h=\"3\">early warning<\/button> to the last mile (Pacific tsunami warning costs ≈4 million dollars a year vs ≈8 billion dollars of aid after 2004)","h":"E","lt":1},{"t":"inter-agency coordination: National Executive Committee + Incident Response Teams + CDRI abroad","h":"I","lt":1},{"t":"capacity building: <span class=\"cm\" data-c=\"24\">Aapda Mitra volunteers<\/span> + tech tools + <span class=\"cm\" data-c=\"25\">IUINDRR-NIDM network of 330+ universities<\/span> <button class=\"hs chipx\" data-h=\"4\">New tech for DM<\/button>","h":"I","lt":1}],"hs":[{"t":"Risk formula","b":"<ul><li>Risk = Hazard × Vulnerability × Exposure (lower with more capacity) · hazard = event that can harm → disaster = when it overwhelms a community's capacity to cope<\/li><li>Vulnerability, 4 types: physical (weak houses on slopes) + social (age, gender, caste, disability) + economic (poverty, no insurance) + environmental (degraded ecosystems)<\/li><li><span class=\"cm\" data-c=\"1\">Exposure: people and assets<\/span> in the hazard zone (Joshimath 2023: town on old landslide debris)<\/li><li><span class=\"cm\" data-c=\"2\">Cascading risk<\/span>: one hazard sets off another (Chamoli 2021: rock-ice avalanche → flood → Tapovan tunnel · Sikkim 2023: GLOF → Chungthang dam breach)<\/li><\/ul>"},{"t":"Disaster finance","b":"<ul><li>16th FC: ₹2.04 lakh crore for <span class=\"cm\" data-c=\"8\">SDRF + SDMF<\/span> (2026–31), up 27% + heatwaves and lightning added to notified disasters<\/li><li>SDRF 75:25 (90:10 Himalayan and NE) · <span class=\"cm\" data-c=\"9\">NDRF 100% Centre<\/span>, for \"severe\" calamities · NDMF/SDMF for mitigation<\/li><li>Issues: one-size Disaster Risk Index misses hilly and coastal states + \"severe\" undefined + ₹4 lakh per death unchanged for a decade + index weights: hazard 70, vulnerability 30<\/li><li>Fix: blended finance + <span class=\"cm\" data-c=\"10\">debt-for-resilience swaps<\/span> + review the index every 5 years<\/li><\/ul>"},{"t":"Insurance","b":"<ul><li>Only ≈1% protection; most disaster losses uninsured<\/li><li>Worked: Nagaland (2024), first state with <span class=\"cm\" data-c=\"11\">parametric insurance<\/span> (auto-payout when rain crosses a threshold) · Mixed: <span class=\"cm\" data-c=\"12\">PMFBY<\/span> (late claims, states left in 2020)<\/li><li>India: <span class=\"cm\" data-c=\"13\">Sabka Bima Sabki Raksha Act<\/span> (Dec 2025) + \"Insurance for All by 2047\" (<span class=\"cm\" data-c=\"14\">IRDAI<\/span>) + GST on insurance cut to 0%<\/li><\/ul>"},{"t":"Early warning","b":"<ul><li>SACHET (<span class=\"cm\" data-c=\"19\">Common Alerting Protocol<\/span>) + <span class=\"cm\" data-c=\"20\">cell-broadcast alerts in<\/span> local languages<\/li><li><span class=\"cm\" data-c=\"21\">Mission Mausam<\/span> (2024, ₹2,000 crore): 50 Doppler radars + AI forecasts · Bharat Forecast System: 6 km grid, <span class=\"cm\" data-c=\"22\">village-level nowcasts<\/span><\/li><li>Worked: <span class=\"cm\" data-c=\"23\">INCOIS tsunami centre<\/span> (alerts in minutes) · Failed: Dharali 2025 (no local warning)<\/li><li>UN Early Warnings for All by 2027<\/li><\/ul>"},{"t":"New tech for DM","b":"<ul><li>Risk tools: <span class=\"cm\" data-c=\"26\">Web-DCRA<\/span>, Flood Hazard Atlas, Glacial Lake Dataset<\/li><li>Warnings: SACHET, Damini (lightning), Mausam app, NCRMP for coastal states + <span class=\"cm\" data-c=\"27\">Odisha's SATARK platform<\/span><\/li><li><span class=\"cm\" data-c=\"28\">HADR abroad<\/span>: <span class=\"cm\" data-c=\"29\">Operation Dost<\/span> (Türkiye, Syria) + Operation Brahma (Myanmar 2025)<\/li><li>Worked: Wayanad 2024 (Army built a 190-ft <span class=\"cm\" data-c=\"30\">Bailey bridge in ≈<\/span>1.5 days)<\/li><\/ul>"}],"cm":{"0":"IDMC = Internal Displacement Monitoring Centre, a Geneva body that counts people forced from homes inside their own country.","1":"Exposure = how many people and how much property sit in the hazard's path. Same quake, empty desert = low exposure; crowded city = high.","2":"Cascading risk = one disaster triggers the next, like dominoes (avalanche → flood → dam breach).","3":"Mishra Committee (1976) = panel that warned Joshimath sits on old landslide debris and asked for curbs on heavy construction; ignored.","4":"GAR = UN Global Assessment Report on Disaster Risk Reduction (by UNDRR), published every few years.","5":"CDRI = Coalition for Disaster Resilient Infrastructure: India-led global body (2019) helping countries build roads, power and hospitals that survive disasters.","6":"Exercise Suraksha Chakra = large mock drill for an earthquake in Delhi-NCR (2025) run by NDMA with the Army.","7":"Disaster Risk Index = a score for each state's hazard + exposure + vulnerability; the Finance Commission uses it to share disaster funds.","8":"SDRF = State Disaster Response Fund (money for relief after a disaster); SDMF = State Disaster Mitigation Fund (money to cut risk before one). NDRF / NDMF = the national versions.","9":"Here NDRF = National Disaster Response Fund (DM Act, s.46), not the National Disaster Response Force.","10":"Debt-for-resilience swap = a lender forgives part of a country's debt if the money saved is spent on disaster-proofing.","11":"Parametric insurance = pays out automatically when a measured trigger is crossed (rain above X mm, wind above Y km/h), no loss survey needed.","12":"PMFBY = Pradhan Mantri Fasal Bima Yojana, crop insurance for farmers at low premiums.","13":"Sabka Bima Sabki Raksha Act (Dec 2025) = insurance law amendment allowing 100% FDI in insurers and easing rules to widen cover.","14":"IRDAI = Insurance Regulatory and Development Authority of India, the insurance regulator.","15":"NDRF here = National Disaster Response Force, the specialist rescue force. Don't mix it up with the NDRF fund (National Disaster Response Fund).","16":"Incident Response System = a fixed chain of command at a disaster site: who leads, who handles operations, logistics and planning, so nobody waits for orders.","17":"ERSS-112 = Emergency Response Support System: one number, 112, for police, fire, ambulance. Golden hour = the first hour or so after a disaster, when rescue saves the most lives.","18":"PDNA (post-disaster needs assessment) = a survey after a disaster of damage, losses and what it will cost to rebuild.","19":"SACHET / Common Alerting Protocol = one standard format for disaster alerts so the same warning goes out on SMS, TV, radio and apps at once.","20":"Cell broadcast = an alert pushed to every phone in an area at once, even without the number on a list.","21":"Mission Mausam (2024) = IMD programme to make India weather-ready: more radars, supercomputers, AI forecasts.","22":"Nowcast = a forecast for the next few hours, very local (thunderstorm in the next 3 hours over this block).","23":"INCOIS = Indian National Centre for Ocean Information Services, Hyderabad; runs India's tsunami warning centre.","24":"Aapda Mitra = NDMA scheme training local volunteers in first response (search, rescue, first aid) in disaster-prone districts.","25":"IUINDRR-NIDM = Indian Universities and Institutions Network for Disaster Risk Reduction, run by NIDM: links 330+ universities for disaster research and teaching.","26":"Web-DCRA = web-based Dynamic Composite Risk Atlas: NDMA's online risk map that combines hazards, people and assets.","27":"SATARK = Odisha's web platform (OSDMA) that sends warnings for many hazards (lightning, heat, floods, drought) to officials and people.","28":"HADR = Humanitarian Assistance and Disaster Relief: armed forces sent abroad after a disaster (rescue teams, field hospitals, supplies).","29":"Operation Dost = India's rescue and relief mission after the Türkiye–Syria earthquake (2023).","30":"Bailey bridge = a prefabricated steel bridge the Army can assemble quickly by hand."},"v":"71185b"}],"circle":"g","group":"DM core","pyq":["<b>2024 Q17 (15 marks):<\/b> What is disaster resilience? How is it determined? Describe various elements of a resilience framework. Also mention the global targets of Sendai Framework for Disaster Risk Reduction (2015-2030).","<b>2019 Q8 (10 marks):<\/b> Vulnerability is an essential element for defining disaster impacts and its threat to people. How and in what ways can vulnerability to disasters be characterized? Discuss different types of vulnerability with reference to disasters.","<b>2018 Q18 (15 marks):<\/b> Describe various measures taken in India for Disaster Risk Reduction (DRR) before and after signing ‘Sendai Framework for DRR (2015-2030)’. How is this framework different from ‘Hyogo Framework for Action, 2005’?","<b>2013 Q18 (10 marks):<\/b> How important are vulnerability and risk assessment for pre-disaster management? As an administrator, what are key areas that you would focus on in a Disaster Management System?"]},{"id":"b-india-s-dm-framework","subj":"s05","name":"India's DM framework","cards":[{"id":"b-india-s-dm-framework:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"DM = planned, coordinated effort to reduce risk, build resilience and protect lives and livelihoods"},{"t":"Shift: relief-centric → zero-casualty, proactive <button class=\"hs chipx\" data-h=\"0\">Reactive → proactive<\/button>","h":"Shift"},{"t":"The law <button class=\"hs chipx\" data-h=\"1\">DM Act 2005<\/button><button class=\"hs chipx\" data-h=\"2\">DM Amendment Act 2025<\/button><button class=\"hs chipx\" data-h=\"3\">NDMP 2019<\/button>"},{"t":"Global frameworks <button class=\"hs chipx\" data-h=\"4\">Sendai vs Hyogo<\/button><button class=\"hs chipx\" data-h=\"5\">Resilience<\/button>"},{"t":"Local level <button class=\"hs chipx\" data-h=\"6\">Community DRR<\/button>"},{"sec":"Gaps"},{"t":"\"severe calamity\" undefined + sector laws scattered (EPA 1986, Factories Act 1948, <span class=\"cm\" data-c=\"5\">Epidemic Diseases Act 1897<\/span>) + no fixed liability for officials","h":"P","lt":1},{"t":"disaster databases only from 2025","h":"I","lt":1},{"t":"member vacancies + many states still relief-heavy","h":"H","lt":1},{"t":"mitigation money under-used (CAG)","h":"F","lt":1},{"sec":"Fixes"},{"t":"Enforce the 2025 amendments + DRR in every development plan + social audits of relief + regular Parliament review of NDMA + courts enforce duties (SC, Gaurav Kumar Bansal 2021: ex gratia for COVID deaths)"}],"hs":[{"t":"Reactive → proactive","b":"<ul><li>Relief after the event → risk reduction before it: DM Act 2005 covers the whole cycle<\/li><li>NDMP 2019 + DM Amendment Act 2025 + 16th FC disaster funds + Mission Mausam<\/li><li>Worked: Odisha, Phailin 2013 (≈10 lakh evacuated, ≈44 deaths vs ≈10,000 in the 1999 super cyclone)<\/li><li>Sendai + Paris + SDGs (all 2015) read together: NDMP aligns all three<\/li><\/ul>"},{"t":"DM Act 2005","b":"<ul><li>3 tiers: NDMA (PM) → SDMA (CM) → DDMA (Collector) + <span class=\"cm\" data-c=\"0\">National Executive Committee (Home Secretary)<\/span><\/li><li>NDRF (force) + <span class=\"cm\" data-c=\"1\">NIDM (training)<\/span> + plans mandatory at every level + NDRF/SDRF funds<\/li><li>Used: COVID-19 lockdown (first nationwide use) · Failed: Uttarakhand 2013 (state authority had barely met)<\/li><\/ul>"},{"t":"DM Amendment Act 2025","b":"<ul><li>Urban DM Authorities in every municipal corporation (except Delhi, Chandigarh), headed by the Commissioner<\/li><li>National and state disaster databases + NDMA sets minimum relief standards and audits plans + SDRF in every state<\/li><li>Gaps: NDMA still under MHA + member vacancies + vague urban plans<\/li><\/ul>"},{"t":"NDMP 2019","b":"<ul><li>Aligns with Sendai, SDGs, Paris + <span class=\"cm\" data-c=\"2\">PM's 10-point agenda<\/span>; first plan 2016<\/li><li>Themes: understanding risk + inter-agency coordination + risk governance + capacity development + preparedness and response + recovery<\/li><li>Goals for 2022, 2027, 2030 + risk matrices for 20+ hazards + nodal ministry for each<\/li><li>Worked: Ahmedabad Heat Action Plan 2013 · Cyclone Fani 2019 (SOPs, NDRF pre-positioned)<\/li><\/ul>"},{"t":"Sendai vs Hyogo","b":"<ul><li>Sendai 2015–30, 7 targets: reduce deaths + people affected + economic loss + infrastructure damage · increase DRR strategies (by 2020) + international support + early warning access<\/li><li>4 priorities: understand risk + strengthen risk governance + invest in <span class=\"cm\" data-c=\"3\">DRR + preparedness and build back better<\/span><\/li><li><span class=\"cm\" data-c=\"4\">Hyogo 2005–15<\/span> (5 priorities) managed disasters; Sendai manages risk: prevention over response + DRR in every sector + local ownership<\/li><li>India before Sendai: DM Act 2005, NDMA, NDRF · after: NDMP 2016/2019, 10-point agenda, CDRI 2019<\/li><\/ul>"},{"t":"Resilience","b":"<ul><li>Anticipate + absorb + adapt + recover, and \"bounce forward\" (build back better)<\/li><li>Measured by: early warning and risk info (anticipate) + strong infrastructure and safety nets (absorb) + flexible institutions (adapt) + fast, inclusive rebuilding (recover)<\/li><li>Worked: Odisha, Fani 2019 (≈12 lakh evacuated, ≈64 deaths) · Failed: Chennai 2015 (lakes built over)<\/li><\/ul>"},{"t":"Community DRR","b":"<ul><li>National Project for Community-Based DRR in PRIs (₹507 crore, MoPR + NDMA): 20 states, 81 districts<\/li><li>Pozhuthana panchayat, Kerala 2018 (risk maps, village response teams) + Tampara wetland, Odisha (eco-DRR)<\/li><li>Aapda Mitra + SACHET alerts<\/li><\/ul>"}],"cm":{"0":"National Executive Committee = NDMA's working arm, chaired by the Union Home Secretary; turns NDMA policy into action.","1":"NIDM = National Institute of Disaster Management: trains officials and does DM research.","2":"PM's 10-point agenda (2016) = India's DRR priorities: DRR in all development, risk cover for all, women's leadership, risk mapping, tech, local capacity, etc.","3":"Build back better = rebuild stronger and safer than before, not just as it was.","4":"Hyogo Framework (2005–15) = earlier UN DRR plan, focused on managing disasters; replaced by Sendai (2015–30), which focuses on managing risk.","5":"Epidemic Diseases Act 1897 = colonial law letting governments take special measures in epidemics (used in COVID-19)."},"v":"68f395"}],"circle":"g","group":"DM core","pyq":["<b>2020 Q18 (15 marks):<\/b> Discuss the recent measures initiated in disaster management by the Government of India departing from the earlier reactive approach.","<b>2018 Q18 (15 marks):<\/b> Describe various measures taken in India for Disaster Risk Reduction (DRR) before and after signing ‘Sendai Framework for DRR (2015-2030)’. How is this framework different from ‘Hyogo Framework for Action, 2005’?"]},{"id":"b-earthquakes","subj":"s05","name":"Earthquakes","cards":[{"id":"b-earthquakes:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"59% of land in Zones II–V <span class=\"cm\" data-c=\"0\">(IS 1893:2016)<\/span> · BIS 2025 code added Zone VI, withdrawn Mar 2026 → 2016 code back"},{"sec":"Causes"},{"t":"building codes not enforced + most houses non-engineered","h":"P","lt":1},{"t":"earthquake early warning only a pilot (Uttarakhand)","h":"I","lt":1},{"t":"Indian plate pushing into Eurasia (Himalaya, NE) + intraplate stress (Latur 1993)","h":"N","lt":1},{"t":"low awareness, little drill culture","h":"C","lt":1},{"t":"dense cities on soft soil + <span class=\"cm\" data-c=\"1\">reservoir-induced quakes<\/span> (dams, mining)","h":"H","lt":1},{"sec":"Effects"},{"t":"buildings kill, not the shaking + <span class=\"cm\" data-c=\"2\">liquefaction<\/span>, landslides, tsunamis + roads, power, hospitals cut"},{"sec":"Solutions"},{"t":"<b>NDMA guideline<\/b> <button class=\"hs chipx\" data-h=\"0\">NDMA Earthquakes<\/button>"},{"t":"retrofit schools and hospitals first","h":"P","lt":1},{"t":"drills (Exercise Suraksha Chakra 2025, NCR)","h":"A","lt":1},{"t":"Earthquake Disaster Risk Index for 50 cities","h":"R","lt":1},{"t":"seismic observatories 80 (2014) → 168 (2025) + BhooKamp and India Quake apps","h":"E","lt":1},{"t":"NDRF: 16 battalions, 1,149 personnel each","h":"I","lt":1},{"t":"Cases <button class=\"hs chipx\" data-h=\"1\">Major earthquakes<\/button>"}],"hs":[{"t":"NDMA Earthquakes","b":"<ul><li>Earthquake-resistant new construction + selective retrofitting of schools and hospitals<\/li><li>Enforce codes (IS 1893, National Building Code) + Incident Command System and Emergency Operations Centres<\/li><li><span class=\"cm\" data-c=\"3\">National Earthquake Risk Mitigation Project<\/span> + National Centre for Seismology<\/li><\/ul>"},{"t":"Major earthquakes","b":"<ul><li>Latur 1993 (≈10,000 dead, on the \"stable\" Deccan plate)<\/li><li>Bhuj 2001 (M7.7, ≈20,000 dead) → Gujarat rebuilt <span class=\"cm\" data-c=\"4\">with GSDMA<\/span> + owner-driven reconstruction (worked)<\/li><li>Kashmir 2005 (M7.6) · Sikkim 2011 (M6.9) · Nepal 2015 (M7.8, Bihar hit) · Imphal 2016 (M6.7)<\/li><li>World: Pacific Ring of Fire (≈90% of earthquakes, ≈75% of active volcanoes) → Kamchatka M8.8 (2025) sent tsunami waves to Russia and Japan<\/li><\/ul>"}],"cm":{"0":"IS 1893 = BIS code that maps India into seismic zones (II = low to V = highest) and sets how buildings must resist quakes.","1":"Reservoir-induced quake = the weight and water pressure of a big dam's lake triggers quakes (Koyna 1967).","2":"Liquefaction = during shaking, wet sandy soil loses strength and behaves like liquid, so buildings sink or tilt.","3":"National Earthquake Risk Mitigation Project: NDMA plan for safer buildings (codes, retrofitting, training engineers and masons). National Centre for Seismology (MoES): records every quake and issues alerts.","4":"GSDMA = Gujarat State Disaster Management Authority, set up after Bhuj 2001."},"v":"aadd8c"}],"circle":"g","group":"Hazards","pyq":["<b>2021 Q8 (10 marks):<\/b> Discuss about the vulnerability of India to earthquake related hazards. Give examples including the salient features of major disasters caused by earthquakes in different parts of India during the last three decades.","<b>2015 Q16 (12.5 marks):<\/b> The frequency of earthquakes appears to have increased in the Indian subcontinent. However, India’s preparedness for mitigating their impact has significant gaps. Discuss various aspects."]},{"id":"b-tsunamis","subj":"s05","name":"Tsunamis","cards":[{"id":"b-tsunamis:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"13 tsunamis in the Indian Ocean in 300 years; 2004 the most destructive to hit India"},{"sec":"Causes"},{"t":"<span class=\"cm\" data-c=\"0\">undersea megathrust quakes<\/span> (2004: M9.1 Sumatra–Andaman, Indian plate under Burma plate) + submarine landslides, volcanic collapse","h":"N","lt":1},{"t":"building in coastal no-development zones + mangroves cleared","h":"H","lt":1},{"sec":"Effects"},{"t":"2004: ≈2.3 lakh dead in 14 countries, India ≈10,700 (Nagapattinam, A&amp;N worst) + boats, harbours, fishing livelihoods lost + farmland salinised + tourism hit"},{"sec":"Solutions"},{"t":"<b>NDMA guideline<\/b> <button class=\"hs chipx\" data-h=\"0\">NDMA Tsunami 2010<\/button>"},{"t":"mangrove bio-shields (Pichavaram reduced 2004 damage) + CRZ no-development zones","h":"P","lt":1},{"t":"regular coastal drills","h":"A","lt":1},{"t":"Indian Tsunami Early Warning System (INCOIS, Hyderabad, 2007): detects Indian Ocean quakes in under 10 minutes + last-mile alerts (SACHET)","h":"E","lt":1}],"hs":[{"t":"NDMA Tsunami 2010","b":"<ul><li>Inundation and hazard maps + monitoring networks<\/li><li><span class=\"cm\" data-c=\"1\">Bio-shields<\/span> (mangroves, shelterbelts) + built barriers + safe coastal construction (CRZ)<\/li><li>Coastal drills + capacity building<\/li><\/ul>"}],"cm":{"0":"Megathrust quake = the biggest kind of quake, where one tectonic plate slides under another along a huge fault.","1":"Bio-shield = a belt of mangroves or coastal trees that breaks the force of waves and wind."},"v":"767373"}],"circle":"g","group":"Hazards","pyq":["<b>2017 Q18 (15 marks):<\/b> On December 2004, tsumani brought havoc on 14 countries including India. Discuss the factors responsible for occurrence of Tsunami and its effects on life and economy. In the light of guidelines of NDMA (2010) describe the mechanisms for preparedness to reduce the risk during such events."]},{"id":"b-floods","subj":"s05","name":"Floods","cards":[{"id":"b-floods:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"12% of land (40 million ha) flood-prone + 85% of the 1,200 mm rain falls in 3–4 months"},{"sec":"Causes"},{"t":"no city flood plan + 52% of towns have no master plan","h":"P","lt":1},{"t":"extreme rain, cyclones, snowmelt","h":"N","lt":1},{"t":"drains and wetlands encroached (Mumbai's Mithi river)","h":"C","lt":1},{"t":"concrete stops infiltration + deforestation, siltation + embankment breaches","h":"H","lt":1},{"t":"city own revenue only ≈1% of GDP","h":"F","lt":1},{"sec":"Effects"},{"t":"deaths, homes and crops lost + water-borne disease + transport and power cut"},{"sec":"Solutions"},{"t":"<b>NDMA guideline<\/b> <button class=\"hs chipx\" data-h=\"0\">NDMA Floods + Urban Floods 2010<\/button>"},{"t":"flood-plain zoning + sponge cities","h":"P","lt":1},{"t":"Flood Hazard <span class=\"cm\" data-c=\"0\">Atlas + Climate Smart Cities Assessment<\/span> Framework","h":"R","lt":1},{"t":"<span class=\"cm\" data-c=\"1\">C-FLOOD forecasting<\/span>","h":"E","lt":1},{"t":"devolve urban planning to ULBs (74th Amendment)","h":"I","lt":1},{"t":"<button class=\"hs\" data-h=\"1\">Urban floods<\/button>"}],"hs":[{"t":"NDMA Floods + Urban Floods 2010","b":"<ul><li>Structural: reservoirs, embankments, desilting, catchment treatment<\/li><li>Non-structural: flood-plain zoning, flood forecasting, community preparedness (Aapda Mitra)<\/li><li>Urban Flood Guidelines 2010 + AMRUT stormwater drains + sponge-city ideas<\/li><\/ul>"},{"t":"Urban floods","b":"<ul><li>Mumbai, 26 July 2005: ≈944 mm in 24 hours + Mithi river encroached + drains built for 25 mm/hour → ≈1,000 dead<\/li><li>Chennai, Dec 2015: extreme rain + sudden release from Chembarambakkam lake + lakes and Adyar floodplain built over → ≈340+ dead<\/li><li>Urban flood risk 3.6–7x by 2070 (World Bank) + urban people 480 million (2020) → 951 million (2050)<\/li><\/ul>"}],"cm":{"0":"Climate Smart Cities Assessment Framework (MoHUA, 2019): scores cities on climate readiness, incl. flood and water management, green cover, energy and mobility.","1":"C-FLOOD = a web platform (CWC + C-DAC) giving village-level flood inundation forecasts up to 2 days ahead. 74th Amendment (next line) = gave urban local bodies constitutional status and listed their functions (12th Schedule)."},"v":"187247"}],"circle":"g","group":"Hazards","pyq":["<b>2024 Q18 (15 marks):<\/b> Flooding in urban areas is an emerging climate-induced disaster. Discuss the causes of this disaster. Mention the features of two such major floods in the last two decades in India. Describe the policies and frameworks in India that aim at tackling such floods.","<b>2016 Q15:<\/b> The frequency of urban floods due to high intensity rainfall is increasing over the years. Discussing the reasons for urban floods, highlight the mechanisms for preparedness to reduce the risk during such events."]},{"id":"b-landslides","subj":"s05","name":"Landslides","cards":[{"id":"b-landslides:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"12.6–15% of land (0.42 million sq km): Himalaya, Western Ghats, NE hills, Nilgiris"},{"sec":"Causes"},{"t":"building on steep slopes unregulated (Aizawl, Sikkim)","h":"P","lt":1},{"t":"intense rain + quakes + weak geology (Western Ghats: basalt + steep slopes)","h":"N","lt":1},{"t":"slopes levelled for farming (Malin 2014)","h":"C","lt":1},{"t":"road cutting, deforestation, mining, blasting, hydel projects","h":"H","lt":1},{"sec":"Effects"},{"t":"homes buried + roads, power, hydel cut + debris dams rivers → flash floods downstream"},{"sec":"Solutions"},{"t":"<b>NDMA guideline<\/b> <button class=\"hs chipx\" data-h=\"0\">NDMA Landslides + NLRMS 2019<\/button>"},{"t":"retaining walls, bunds, terrace farming, afforestation","h":"P","lt":1},{"t":"hazard <button class=\"hs\" data-h=\"1\">zonation mapping<\/button>","h":"R","lt":1},{"t":"slope sensors + rain-threshold warnings","h":"E","lt":1},{"t":"Related <button class=\"hs chipx\" data-h=\"2\">Land subsidence<\/button>"},{"t":"Cases: Wayanad, 30 July 2024 (200+ dead) · Malin, Pune 2014 (≈150, slopes levelled for farming) · Joshimath 2023","h":"Cases"}],"hs":[{"t":"NDMA Landslides + <span class=\"cm\" data-c=\"0\">NLRMS 2019<\/span>","b":"<ul><li>No construction on slopes of 30° or more + settlements and roads kept out of high-risk zones, farming in valleys<\/li><li>National Landslide Risk Management Strategy (2019): hazard mapping (GSI) + monitoring and early warning + awareness + capacity building + mountain zone rules + stabilisation (Landslide Risk Mitigation Scheme)<\/li><li><span class=\"cm\" data-c=\"1\">Bhusanket portal<\/span> + landslide insurance<\/li><\/ul>"},{"t":"Zonation mapping","b":"<ul><li>Divide hill terrain into zones by how likely landslides are<\/li><li>Inputs: slope + geology + soil + drainage + land use + rainfall + past landslides; made with GIS, satellites, field checks<\/li><li>Scales: 1:50,000 (GSI national) → 1:10,000 (town planning) → site level<\/li><li>Use: where not to build + road and dam alignment + where to put early warning sensors<\/li><\/ul>"},{"t":"Land subsidence","b":"<ul><li>Ground sinks as soil or rock below is compressed: groundwater pumping + mining + building<\/li><li>Delhi worst (51 mm a year, 2,000+ buildings at risk) + Joshimath, Mussoorie<\/li><li>Fix: <span class=\"cm\" data-c=\"2\">aquifer recharge + InSAR satellite monitoring<\/span><\/li><\/ul>"}],"cm":{"0":"NLRMS = National Landslide Risk Management Strategy (2019).","1":"Bhusanket = GSI portal sharing landslide susceptibility maps and early warnings.","2":"InSAR = satellite radar that compares images over time to spot the ground moving by millimetres."},"v":"157998"}],"circle":"g","group":"Hazards","pyq":["<b>2021 Q18 (15 marks):<\/b> Describe the various causes and the effects of landslides. Mention the important components of the National Landslide Risk Management Strategy.","<b>2019 Q18 (15 marks):<\/b> Disaster preparedness is the first step in any disaster management process. Explain how hazard zonation mapping will help disaster mitigation in the case of landslides."]},{"id":"b-cloudburst","subj":"s05","name":"Cloudburst","cards":[{"id":"b-cloudburst:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"≥10 cm of rain in an hour over ≈20–30 sq km <button class=\"hs chipx\" data-h=\"0\">Mechanism<\/button>"},{"sec":"Causes"},{"t":"hard to forecast, no local warning (Dharali 2025)","h":"I","lt":1},{"t":"orographic lift + stalled convective systems","h":"N","lt":1},{"t":"pilgrim and tourist crowds in risky valleys (Kedarnath 2013)","h":"C","lt":1},{"t":"settlements, roads and hydel projects in narrow valleys","h":"H","lt":1},{"sec":"Effects"},{"t":"flash floods + debris flows + roads, bridges, hydel projects washed away + pilgrims trapped"},{"sec":"Solutions"},{"t":"<b>NDMA guideline<\/b> <button class=\"hs chipx\" data-h=\"1\">NDMA Cloudburst<\/button>"},{"t":"amend building by-laws for risk-sensitive planning + better storm-water drainage","h":"P","lt":1},{"t":"landslide hazard zonation","h":"R","lt":1},{"t":"multi-hazard insurance","h":"F","lt":1},{"t":"last-mile warnings","h":"E","lt":1},{"t":"Centre–state coordination on rules and standards","h":"I","lt":1},{"t":"Cases: Kedarnath 2013 · Mandi, Himachal 2025 · Chasoti, Kishtwar, Aug 2025 (≈65 dead on the Machail yatra route)","h":"Cases"}],"hs":[{"t":"Mechanism","b":"<ul><li><span class=\"cm\" data-c=\"0\">Orographic lift<\/span> pushes warm, moist air up the <span class=\"cm\" data-c=\"1\">Himalaya → tall cumulonimbus clouds<\/span><\/li><li>Constant moisture inflow, the cloud can't release it gradually → sudden, localised downpour → flash floods<\/li><li>Warming: air holds more moisture → shorter, more intense bursts<\/li><\/ul>"},{"t":"NDMA Cloudburst","b":"<ul><li>Settle on hard rock or firm ground + regulate construction<\/li><li>Control water infiltration + surface and sub-surface drainage<\/li><li>Bioengineering with local vegetation to hold slopes<\/li><\/ul>"}],"cm":{"0":"Orographic lift = moist air forced up a mountain cools and dumps rain.","1":"Cumulonimbus = towering thunderstorm cloud that brings heavy rain, lightning and hail."},"v":"f8df89"}],"circle":"g","group":"Hazards","pyq":["<b>2022 Q8 (10 marks):<\/b> Explain the mechanism and occurrence of cloudburst in the context of the Indian subcontinent. Discuss two recent examples.","<b>2016 Q16 (12.5 marks):<\/b> With reference to National Disaster Management Authority (NDMA) guidelines, discuss the measures to be adopted to mitigate the impact of recent incidents of cloudbursts in many places of Uttarakhand."]},{"id":"b-cyclone","subj":"s05","name":"Cyclone","cards":[{"id":"b-cyclone:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"India faces ≈10% of the world's tropical cyclones"},{"sec":"Causes"},{"t":"sea above ≈26.5°<span class=\"cm\" data-c=\"0\">C + Coriolis force<\/span> + <span class=\"cm\" data-c=\"1\">low wind shear<\/span> · warming → more Category 4–5 storms (IPCC AR6)","h":"N","lt":1},{"t":"mangroves cleared","h":"H","lt":1},{"sec":"Effects"},{"t":"storm surge, winds, floods + farmland salinised + coastal erosion + ports and power hit"},{"sec":"Solutions"},{"t":"<b>NDMA guideline<\/b> <button class=\"hs chipx\" data-h=\"0\">NDMA Cyclone 2008<\/button>"},{"t":"multipurpose shelters + cyclone-resilient housing + mangrove bio-shields","h":"P","lt":1},{"t":"Odisha's zero-casualty model everywhere (<span class=\"cm\" data-c=\"2\">OSDMA<\/span>, first state DM authority, 1999)","h":"R","lt":1},{"t":"IMD four-colour warnings to the last mile","h":"E","lt":1},{"t":"Cases: Phailin 2013 (≈44 deaths vs ≈10,000 in 1999) · Fani 2019 (≈12 lakh evacuated) · recent: Dana, Fengal, Remal (2024), Montha, Ditwah (2025)","h":"Cases · recent"}],"hs":[{"t":"NDMA Cyclone 2008","b":"<ul><li>IMD satellites + Doppler radars + four-colour warning code (green to red)<\/li><li>Cyclone shelters + roads + mangrove bio-shields<\/li><li>National Cyclone Risk Mitigation Project: 13 cyclone-prone states and UTs (World Bank-supported)<\/li><\/ul>"}],"cm":{"0":"Coriolis force = the Earth's spin deflects winds, which makes cyclones spin; too weak near the equator, so cyclones don't form there.","1":"Wind shear = winds changing speed or direction with height; low shear lets a cyclone grow tall without being torn apart.","2":"OSDMA = Odisha State Disaster Management Authority, India's first state DM authority (1999, after the super cyclone)."},"v":"41fbf3"}],"circle":"y","group":"Hazards"},{"id":"b-drought","subj":"s05","name":"Drought","cards":[{"id":"b-drought:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"rainfall deficiency of 26% or more + 68% of land drought-prone"},{"sec":"Causes"},{"t":"poor water management (Cherrapunji paradox: wettest place, dry in winter)","h":"P","lt":1},{"t":"rainfall deficit + El Niño","h":"N","lt":1},{"t":"groundwater over-extraction + deforestation","h":"H","lt":1},{"sec":"Effects"},{"t":"crop failure, debt + drinking water and fodder shortage + distress migration"},{"sec":"Solutions"},{"t":"<b>NDMA guideline<\/b> <button class=\"hs chipx\" data-h=\"0\">NDMA Drought 2010<\/button>"},{"t":"watershed development (<span class=\"cm\" data-c=\"0\">DPAP since<\/span> 1973–74)","h":"P","lt":1},{"t":"real-time vulnerability maps (State Drought Monitoring Cells)","h":"R","lt":1},{"t":"drought insurance","h":"F","lt":1},{"t":"El Niño and La Niña forecasts","h":"E","lt":1},{"t":"Cases: Marathwada 2015–16 (Latur got water by train) · 2002 (monsoon ≈19% short, El Niño year) · Rayalaseema, Andhra 2024","h":"Cases"}],"hs":[{"t":"NDMA Drought 2010","b":"<ul><li>State Drought Monitoring Cells + real-time vulnerability maps + ICT control rooms<\/li><li>Watershed development + automatic weather stations + short-duration seeds + fodder banks<\/li><li>Drought insurance + market support + capacity building of PRIs and ULBs<\/li><li>Approach: reactive (relief) → proactive (early warning, stocks) → prospective (climate-smart farming)<\/li><\/ul>"}],"cm":{"0":"DPAP = Drought Prone Areas Programme: watershed and soil-water conservation in drought districts."},"v":"edb9a6"}],"circle":"g","group":"Hazards","pyq":["<b>2014 Q14 (12.5 marks):<\/b> Drought has been recognized as a disaster in view of its spatial expanse, temporal duration, slow onset and lasting effects on vulnerable sections. With a focus on the September 2010 guidelines from the National Disaster Management Authority (NDMA), discuss the mechanisms for preparedness to deal with likely El Nino and La Nina fallouts in India."]},{"id":"b-heatwaves","subj":"s05","name":"Heatwaves","cards":[{"id":"b-heatwaves:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"IMD: plains ≥40°C and ≥4.5°C above normal (severe &gt;6.4°C), or ≥45°C (severe ≥47°C) · 57% of districts (≈75% of people) at high heat risk (CEEW)"},{"sec":"Causes"},{"t":"anticyclones + clear skies + El Niño + hot westerlies · warm nights rising faster than warm days","h":"N","lt":1},{"t":"<span class=\"cm\" data-c=\"0\">urban heat island<\/span> + rising humidity (north India 30–40% → 40–50%)","h":"H","lt":1},{"sec":"Effects"},{"t":"≈10,000 dead (2000–2020) + work capacity down up to 40% + crop losses + power demand spikes"},{"sec":"Solutions"},{"t":"<b>NDMA guideline<\/b> <button class=\"hs chipx\" data-h=\"0\">NDMA Heat Action Plans<\/button>"},{"t":"IMD heat index","h":"R","lt":1},{"t":"heatwaves now a notified disaster (16th FC) → full SDRF use + parametric insurance","h":"F","lt":1},{"t":"IMD colour-coded warnings","h":"E","lt":1},{"t":"Cases: Andhra + Telangana 2015 (≈2,000+ dead) · North India 2024 (Churu 50.5°C)","h":"Cases"}],"hs":[{"t":"NDMA Heat Action Plans","b":"<ul><li>Heat Action Plans: expand from ≈300 cities to 4,800 ULBs + turn them into fundable projects + plan for warm nights<\/li><li>Model: Ahmedabad HAP 2013, first in South Asia<\/li><li>National HAP Repository<\/li><\/ul>"}],"cm":{"0":"Urban heat island = cities stay hotter than the countryside because concrete and roads soak up heat and release it at night."},"v":"17d1ea"}],"circle":"y","group":"Hazards"},{"id":"b-lightning","subj":"s05","name":"Lightning","cards":[{"id":"b-lightning:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"Mar–Apr 2025: 160+ dead in 12 states, up 184% on 2024 (Bihar, UP worst)"},{"t":"Causes: <b>N<\/b> pre-monsoon heat + moisture → tall cumulonimbus clouds, more as the climate warms","h":"Causes"},{"t":"Effects: deaths mostly of farmers in open fields + livestock lost","h":"Effects"},{"t":"Solutions: <b>E<\/b> Damini app (20–40 km, 40 minutes ahead) + forecasts 5 days to 3 hours ahead · <b>F<\/b> notified disaster (16th FC) → SDRF for arresters and shelters · <b>A<\/b> awareness in Bihar, UP villages + Lightning Action Plans","h":"Solutions"}],"hs":[],"cm":{},"v":"8d90c9"}],"circle":"y","group":"Hazards"},{"id":"b-wildfires","subj":"s05","name":"Wildfires","cards":[{"id":"b-wildfires:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"36% of forest cover fire-prone (4% extremely, 6% very highly)"},{"t":"Causes: <b>N<\/b> drought, heat, wind, lightning + lantana and pine litter · <b>C<\/b> field burning, campfires, shifting cultivation","h":"Causes"},{"t":"Effects: biodiversity and carbon sink lost + smoke + soil erosion + forest livelihoods hit <button class=\"hs chipx\" data-h=\"0\">NAPFF 2018<\/button>","h":"Effects"},{"t":"Solutions: <b>P<\/b> firebreaks + clear lantana and pine litter · <b>A<\/b> community fire watchers · <b>E<\/b> alerts to the last village","h":"Solutions"},{"t":"Case: Uttarakhand 2024","h":"Case"}],"hs":[{"t":"<span class=\"cm\" data-c=\"0\">NAPFF 2018<\/span>","b":"<ul><li>National Action Plan on Forest Fires (2018) + Forest Fire Prevention &amp; Management Scheme (community participation)<\/li><li>FSI pre-warning alerts + Large Forest Fire Monitoring (<span class=\"cm\" data-c=\"1\">SNPP-VIIRS<\/span> satellite) + burnt-area maps (AWiFS)<\/li><\/ul>"}],"cm":{"0":"NAPFF = National Action Plan on Forest Fires (2018).","1":"SNPP-VIIRS = a NASA-NOAA satellite sensor that spots active fires from space."},"v":"710d6c"}],"circle":"y","group":"Hazards"},{"id":"b-himalayan-hazards-glof-sturzstrom","subj":"s05","name":"Himalayan hazards (GLOF + Sturzstrom)","cards":[{"id":"b-himalayan-hazards-glof-sturzstrom:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"GLOF = sudden release of water held by a <span class=\"cm\" data-c=\"0\">glacier or moraine dam<\/span> · since 1990 glacial lake number / area / volume up 53% / 51% / 48% · 7,500 lakes above 4,500 m <button class=\"hs chipx\" data-h=\"0\">Sturzstrom<\/button>"},{"sec":"Causes"},{"t":"glacier melt + moraine or ice dam failure + quakes + permafrost thaw","h":"N","lt":1},{"t":"hydropower, roads, tourism (≈100 million tourists a year in the Himalaya)","h":"H","lt":1},{"sec":"Effects"},{"t":"&gt;9 million at risk in High Mountain Asia + villages, roads and hydel dams wiped out (Chungthang 2023)"},{"sec":"Solutions"},{"t":"<b>NDMA guideline<\/b> <button class=\"hs chipx\" data-h=\"1\">NDMA GLOF 2020<\/button>"},{"t":"<span class=\"cm\" data-c=\"2\">CEA slope-stability guidelines<\/span> for hydro projects","h":"P","lt":1},{"t":": <span class=\"cm\" data-c=\"3\">CWC monitors<\/span> 900+ lakes + risk indexing","h":"R","lt":1},{"t":"<span class=\"cm\" data-c=\"4\">ICIMOD cooperation<\/span> across the Hindu Kush Himalaya","h":"I","lt":1},{"t":"Cases: South Lhonak, Sikkim 2023 · Chamoli 2021 · Kedarnath 2013","h":"Cases"}],"hs":[{"t":"Sturzstrom","b":"<ul><li>Huge rock-ice collapse that travels very far: friction melts ice → water lubricates the base → debris flow within minutes<\/li><li>Chamoli 2021: ≈25 million m³ of rock and ice = rock-ice avalanche, not a moraine-dam GLOF (South Lhonak 2023 was)<\/li><li>Warning gap: minutes of lead time → needs SAR/InSAR, permafrost mapping, local sirens<\/li><\/ul>"},{"t":"NDMA GLOF 2020","b":"<ul><li>Lower risky lakes: siphoning, controlled breaching, outlet structures + embankments<\/li><li>Early warning at 56 at-risk <span class=\"cm\" data-c=\"1\">lakes + NRSC 24x7<\/span> lake watch<\/li><li>National GLOF Risk Mitigation Project: HP, Uttarakhand, Sikkim, Arunachal<\/li><\/ul>"}],"cm":{"0":"Moraine = loose rock and debris left by a glacier; a lake dammed by a moraine can burst suddenly (GLOF).","1":"NRSC = National Remote Sensing Centre (ISRO, Hyderabad): satellite maps for disasters (floods, glacial lakes, fires).","2":"CEA = Central Electricity Authority: its guidelines make hydro projects check slope stability and glacial-lake risk before building.","3":"CWC = Central Water Commission: apex technical body for rivers and dams; runs India's flood forecasts and watches glacial lakes.","4":"ICIMOD = International Centre for Integrated Mountain Development, Kathmandu: 8-country body on the Hindu Kush Himalaya."},"v":"430e9f"}],"circle":"y","group":"Hazards"},{"id":"b-dams","subj":"s05","name":"Dams","cards":[{"id":"b-dams:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"India is the 3rd largest dam owner: 6,628 specified dams (Maharashtra most)"},{"sec":"Causes of failure"},{"t":"floods beyond design (overtopping) + quakes (Bhuj 2001) + GLOFs (Chungthang 2023)","h":"N","lt":1},{"t":"ageing: 80% over 25 years, ≈26% over 50 + silt has cut storage ≈19% + poor maintenance and monitoring","h":"H","lt":1},{"sec":"Effects"},{"t":"sudden flood wave downstream → deaths, towns wiped out + farmland, power and water supply lost"},{"sec":"Solutions"},{"t":"IoT sensors + drones and <span class=\"cm\" data-c=\"0\">underwater ROVs<\/span> for inspection + sediment bypass (Japan) + lifecycle management","h":"P","lt":1},{"t":"<button class=\"hs\" data-h=\"0\">Dam Safety Act 2021<\/button> (4-tier institutions = inter-agency)","h":"I","lt":1},{"t":"Cases <button class=\"hs chipx\" data-h=\"1\">Dam failures<\/button>"}],"hs":[{"t":"Dam Safety Act 2021","b":"<ul><li>4-tier institutions at Centre and states for surveillance, inspection, maintenance<\/li><li>DRIP (rehabilitation) + <span class=\"cm\" data-c=\"1\">DHARMA app<\/span> + National Register of Large Dams + National Centre for Earthquake Safety of Dams (MNIT Jaipur)<\/li><\/ul>"},{"t":"Dam failures","b":"<ul><li>Machchhu dam, Morbi, Gujarat (1979)<\/li><li>Banqiao, China (1975) · Derna, Libya (2023)<\/li><\/ul>"}],"cm":{"0":"ROV = remotely operated vehicle: a small robot submarine for inspecting dams underwater.","1":"DRIP = Dam Rehabilitation and Improvement Project (World Bank-backed); DHARMA = Dam Health and Rehabilitation Monitoring Application, the online database of dam health."},"v":"8a8826"}],"circle":"g","group":"Hazards","pyq":["<b>2023 Q7 (10 marks):<\/b> Dam failures are always catastrophic, especially on the downstream side, resulting in a colossal loss of life and property. Analyze the various causes of dam failures. Give two examples of large dam failures."]},{"id":"b-human-made-disasters","subj":"s05","name":"Human-made disasters","cards":[{"id":"b-human-made-disasters:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Causes"},{"t":"weak enforcement (Factories Act 1948; Vizag LG Polymers ran without valid clearance) + National Building Code only advisory","h":"P","lt":1},{"t":"little crowd-density tech + old equipment","h":"I","lt":1},{"t":"rules ignored + panic and rumours (79% of stampedes at religious events)","h":"C","lt":1},{"t":"human error + poor maintenance + overcrowding + too few fire stations (5,191 in 2019)","h":"H","lt":1},{"t":"little investment in safety","h":"F","lt":1},{"t":"organisers and police don't coordinate (Chinnaswamy, Bengaluru 2025) <button class=\"hs chipx\" data-h=\"0\">Industrial accidents<\/button><button class=\"hs chipx\" data-h=\"1\">Fire safety<\/button><button class=\"hs chipx\" data-h=\"2\">Stampedes<\/button>","h":"C","lt":1}],"hs":[{"t":"Industrial accidents","b":"<ul><li>≈1,861 <span class=\"cm\" data-c=\"0\">Major Accident Hazard sites<\/span><\/li><li>Bhopal 1984 (methyl isocyanate, ≈5 lakh affected) · Vizag LG Polymers 2020 (styrene, 12 dead, no valid clearance, NGT ₹50 crore)<\/li><li>Law: absolute liability (MC Mehta, Oleum gas 1986) + EPA 1986 + <span class=\"cm\" data-c=\"1\">MSIHC Rules 1989 + Public Liability Insurance Act 1991<\/span> + NDMA Chemical Disaster Guidelines 2007<\/li><\/ul>"},{"t":"Fire safety","b":"<ul><li>5,888 deaths in 2024 (NCRB) · causes: non-compliance (coaching centres, hospitals, Rajkot gaming zone)<\/li><li>Fire services = State subject <span class=\"cm\" data-c=\"2\">(Art 243W, 12th Schedule)<\/span> + National Building Code only advisory + staff shortage<\/li><li>Fix (NDMA): State Fire Act + third-party fire audits before NOCs + district fire chiefs<\/li><\/ul>"},{"t":"Stampedes","b":"<ul><li>79% at religious events · Chinnaswamy, Bengaluru 2025: ≈2.5 lakh people vs 34,600 capacity<\/li><li>NDMA crowd guide 2014: capacity planning + risk analysis + <span class=\"cm\" data-c=\"3\">failure-mode analysis<\/span><\/li><li><span class=\"cm\" data-c=\"4\">FIST model (Fruin)<\/span>: Force, Information, Space, Time<\/li><li>Tech: RFID (Kumbh, Vaishno Devi) + AI CCTV and drones (Hajj)<\/li><\/ul>"}],"cm":{"0":"Major Accident Hazard unit = a factory storing enough hazardous chemicals that an accident could hit people outside the gate.","1":"MSIHC Rules 1989 = Manufacture, Storage and Import of Hazardous Chemicals Rules: safety reports, on-site emergency plans, informing the public. Public Liability Insurance Act 1991 = factories handling hazardous substances must carry insurance to give quick relief to accident victims, no proof of fault needed.","2":"Art 243W + 12th Schedule = municipalities' powers and functions list; fire services is one item, so it's local/state work.","3":"Failure-mode analysis = list every way an event can go wrong (gate jams, rumour, power cut) and plan for each in advance.","4":"FIST = Force, Information, Space, Time: crowds turn deadly with too much pushing force, wrong information, too little space, for too long."},"v":"ce91c4"}],"circle":"y","group":"Hazards"},{"id":"meaning","subj":"s06","name":"Meaning","cards":[{"path":[],"roles":["def"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">assessment of +ve and -ve impact of a proposed project on env't, social & economic costs (UNEP)<\/span><br><span class=\"li\">process of <mark>identifying, predicting, evaluating and mitigating<\/mark> its effects before decisions are taken and commitments made (IAIA)<\/span><\/span>","h":"EIA :"},{"t":"<span class=\"lst\"><span class=\"li\">NEPA 1970 (USA) → India: <mark>EIA Notification 2006 under EPA 1986<\/mark><\/span><br><span class=\"li\">makes policy makers justify decisions on studies and public comments<\/span><\/span>","h":"Origin :"},{"t":"<mark>Rapid EIA<\/mark> (1 season data, not monsoon) vs <mark>Comprehensive EIA<\/mark> (all 4 seasons)","h":"Types :"},{"t":"<span class=\"lst\"><span class=\"li\">A → Centre clears (Expert Appraisal Committee)<\/span><br><span class=\"li\">B → state SEIAA (B1 needs EIA, B2 exempt)<\/span><br><span class=\"li\">exempt: border highways within 100 km, solar, wind, hydro &lt;25 MW<\/span><\/span>","h":"Categories :"}],"id":"meaning:def-main","v":"17b7f8","q":"What is EIA, where does it come from, its types and its project categories?"}],"pyq":["<b>2019 Q17 (15 marks):<\/b> Define the concept of carrying capacity of an ecosystem as relevant to an environment. Explain how understanding this concept is vital while planning for sustainable development of a region."],"group":"EIA notes"},{"id":"process-with-drawback-of-each-stage","subj":"s06","name":"Process (with drawback of each stage)","cards":[{"path":[],"roles":["how","issue"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">clears projects unlikely to harm, by size/location (school no EIA vs coal mining must)<\/span><br><span class=\"li\">drawback: even small industrial units (rubber) harm<\/span><br><span class=\"li\"><mark>no study shows projects below a limit are harmless<\/mark><\/span><\/span>","h":"Screening :"},{"t":"<span class=\"lst\"><span class=\"li\">if screening doesn't clear<\/span><br><span class=\"li\">review available data<\/span><br><span class=\"li\">key impacts<\/span><br><span class=\"li\">predict extent<\/span><br><span class=\"li\"><mark>early warning system<\/mark><\/span><\/span>","h":"Preliminary assessment :"},{"t":"<span class=\"lst\"><span class=\"li\">formed by developer<\/span><br><span class=\"li\">drawback: no social scientists, anthropologists, ecologists<\/span><br><span class=\"li\"><mark>conflict of interest<\/mark><\/span><\/span>","h":"EIA team :"},{"t":"<span class=\"lst\"><span class=\"li\">study covers all important issues after talking to govt, experts, civil society, locals<\/span><br><span class=\"li\">drawback: <mark>public comments ignored<\/mark><\/span><br><span class=\"li\">only major impacts covered<\/span><\/span>","h":"Scoping :"}],"id":"process-with-drawback-of-each-stage:how-main","v":"e9e5dc","q":"EIA stages from screening to scoping, and the drawback at each?"},{"path":[],"roles":["how","issue"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Identification (what will happen?)<\/span><br><span class=\"li\">Prediction (how much change?)<\/span><br><span class=\"li\">Evaluation (does it matter? local acceptance, consultation, standards)<\/span><br><span class=\"li\">Mitigation (what can be done?)<\/span><br><span class=\"li\">Documentation (report for decision makers: exec summary, impacts, mitigation measures, gaps + summary for public)<\/span><\/span>","h":"Main EIA (5 questions) :"},{"t":"<span class=\"lst\"><span class=\"li\">unreliable data<\/span><br><span class=\"li\">local knowledge ignored<\/span><\/span>","h":"Identification → drawback:"},{"t":"<span class=\"lst\"><span class=\"li\">maths models<\/span><br><span class=\"li\">drawback: method not disclosed<\/span><br><span class=\"li\">uncertainty<\/span><\/span>","h":"Prediction :"},{"t":"<span class=\"lst\"><span class=\"li\">change site/route/process/raw material<\/span><br><span class=\"li\">pollution control<\/span><br><span class=\"li\">restoration, money to displaced, CSR<\/span><br><span class=\"li\">compare alternatives (cost-benefit, matrix)<\/span><\/span>","h":"Mitigation :"},{"t":"<span class=\"lst\"><span class=\"li\">drawback: <mark>stays on paper<\/mark><\/span><br><span class=\"li\">some kept confidential (nuclear)<\/span><br><span class=\"li\">community left out<\/span><br><span class=\"li\">no disaster plan (Uttarakhand floods)<\/span><\/span>","cont":1}],"title":"Main EIA (5 questions) :","id":"process-with-drawback-of-each-stage:how-main-eia-5-questions","v":"f6299e","q":"The five questions of the main EIA, and the drawbacks of each step?"},{"path":[],"roles":["how"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">panel = SPCB rep<\/span><br><span class=\"li\">DC<\/span><br><span class=\"li\">state env't ministry rep<\/span><br><span class=\"li\">project's ministry rep<\/span><\/span>","h":"Public hearing :"},{"t":"<span class=\"lst\"><span class=\"li\">≤3 local body reps (PRI/ULB)<\/span><br><span class=\"li\">≤3 senior citizens picked by DC<\/span><\/span>","cont":1},{"t":"<mark>exempt: mining ≤25 ha, highway widening, irrigation modernisation, SEZ/EPZ units<\/mark>","cont":1},{"t":"EIA → SPCB review → public hearing → IAA (MoEF) → Expert Appraisal Committee (site visit if needed) → MoEF final review → clearance (<mark>too many layers of bureaucracy<\/mark>)","h":"Appraisal :"},{"img":8},{"t":"<mark>Environment Audit Rules 2025<\/mark> → certified, randomly assigned third-party auditors check compliance (EIA = before project, audit = after it starts)","h":"After clearance :"}],"id":"process-with-drawback-of-each-stage:how-main-2","v":"d91af3","q":"Who sits on a public hearing and who is exempt, the appraisal chain, and what happens after clearance?"}],"group":"EIA notes"},{"id":"2006-vs-draft-2020-pyq-2020","subj":"s06","name":"2006 vs Draft 2020 (PYQ 2020)","cards":[{"path":[],"roles":["tbl"],"rows":[{"h":"Public hearing","t":"<span class=\"th\">2006<\/span> 30 days<br><span class=\"th\">Draft 2020<\/span> 20 days"},{"h":"Post-facto clearance","t":"<span class=\"th\">2006<\/span> Not allowed<br><span class=\"th\">Draft 2020<\/span> Allowed"},{"h":"Compliance reports","t":"<span class=\"th\">2006<\/span> Twice a year<br><span class=\"th\">Draft 2020<\/span> Once a year"},{"h":"Exemptions","t":"<span class=\"th\">2006<\/span> Few<br><span class=\"th\">Draft 2020<\/span> Many (highways, defence, \"strategic\")"},{"t":"<span class=\"lst\"><span class=\"li\">UN Special Rapporteurs objected<\/span><br><span class=\"li\"><mark>courts rejected post-facto clearance<\/mark> (
