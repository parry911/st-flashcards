t the expression or safety of Gene B?<\/span><br><span class=\"li\">Is the genetic stability maintained across generations?<\/span><br><span class=\"li\">Is there any synergistic toxicity or allergenicity?<\/span><\/span>"}],"title":"T<u>he Reform:<\/u>","id":"department-of-biotechnology-new-guidelin:gov-the-reform","v":"b7bf7d"},{"path":[],"roles":["use"],"rows":[{"t":"Since 2015, farmers (especially in Punjab and Maharashtra) have used unapproved HT-Bt cotton. This policy provides a legal, regulated pathway for such “Next-Gen” seeds to reach the market safely.","h":"The “illegal HT-Bt” Problem:"},{"t":"These guidelines are a core pillar of the BioE3 Policy (Biotechnology for Economy, Environment, and Employment), aiming for a $300 billion bioeconomy by 2030. ( India’s first National Biofoundry Network was launched in August 2025, which also marked the first anniversary of India’s BioE3 Policy.","h":"BioE3 Policy Linkage:"},{"t":"Biofoundry is an automated facility that rapidly designs, builds, and optimizes engineered organisms by integrating DNA synthesis, gene editing, and high-throughput biomanufacturing workflows."},{"t":"Shorter approval timelines (by 2-3 years) incentivize domestic seed companies and public institutes (like ICAR/ PAU) to innovate.","h":"Reducing R&D Costs:"}],"title":"Why This Matters for India (2026 Context)","id":"department-of-biotechnology-new-guidelin:use-why-this-matters-for-india-2026-context","v":"e2fdab"}]},{"id":"proteins","subj":"s04","name":"PROTEINS","cards":[{"path":[],"roles":["def"],"rows":[{"t":"Proteins are molecules made of amino acids that perform vital jobs in the body (enzymes, hormones, antibodies, structure, transport), and in nutrition the word refers to protein-rich foods whose molecules are digested into amino acids for building the body’s own proteins - the same substance, seen once as a biological worker and once as a dietary source."},{"sec":"Structure-Function Relationship"},{"t":"Proteins are major biomolecules made of long chains of 20 different building blocks called amino acids, joined end-to-end by peptide bonds; the exact order of these amino acids (the sequence) makes the chain fold into specific shapes through layers of structure - primary (sequence), secondary (local patterns like helices and sheets), tertiary (the full 3D fold) and sometimes quaternary (several chains together) - and that final shape determines what the protein can do."},{"t":"Cells make proteins by reading genes (DNA → mRNA → ribosome → amino-acid chain), and once folded they perform almost every job in the body: give cells and tissues strength (actin, collagen), speed up chemical reactions as enzymes (amylase), carry signals as hormones (insulin), recognise and neutralise invaders as antibodies Immunoglobulin G ( (IgG), and move or store small molecules (transporters like GLUT proteins, carriers like haemoglobin, storage proteins like ferritin)."},{"t":"Proteins are sensitive to their environment - heat, pH or chemicals can unfold them (denaturation) and stop them working - which is why both their sequence and their shape are crucial; in short, “sequence → shape → function,” and without proteins life cannot run."}],"title":"BIOLOGICAL ROLE","id":"proteins:def-biological-role","v":"1d9dea"}]},{"id":"recombinant-dna","subj":"s04","name":"RECOMBINANT DNA","cards":[{"path":[],"roles":["def","how"],"rows":[{"t":"Artificially constructed DNA made by combining genetic material from two or more different sources, often from different species, to create new genetic combinations vs Gene-Edited DNA - DNA whose existing sequence has been directly modified at specific locations","h":"Recombinant DNA (rDNA) -"},{"t":"rDNA - Uses molecular cloning techniques such as restriction enzymes, ligases, and vectors (plasmids, viruses) to splice genes from one organism into another. Example: inserting human insulin gene into E. coli bacteria"}],"title":"Definition & Technique","id":"recombinant-dna:def-definition-technique","v":"75eee4"}]},{"id":"mitochondrial-transplantation","subj":"s04","name":"MITOCHONDRIAL TRANSPLANTATION","cards":[{"path":[],"roles":["def","use"],"rows":[{"t":"It involves transporting healthy mitochondria to damaged cells, tissues, or organs. The aim is to restore mitochondrial function in diseased cells, particularly in conditions linked to mtDNA-related disorders (mitochondrial DNA defects).<br>Therapeutic Potential","h":"Meaning :"},{"t":"Potential Therapeutic Uses","h":"Applications -"},{"h":"Neural","t":"<span class=\"th\">Conditions<\/span> Parkinson’s disease, Stroke"},{"h":"Dermatologic","t":"<span class=\"th\">Conditions<\/span> Skin atrophy, Ecchymosis, Striae, Acne, Hirsutism, Hair loss, Impaired wound healing"},{"h":"Musculoskeletal","t":"<span class=\"th\">Conditions<\/span> Osteoporosis, Bone fracture healing, Myopathies"},{"h":"Cardiovascular","t":"<span class=\"th\">Conditions<\/span> Heart failure, Pulmonary hypertension"},{"h":"Ophthalmologic","t":"<span class=\"th\">Conditions<\/span> Cataracts, Glaucoma"},{"h":"Reproductive","t":"<span class=\"th\">Conditions<\/span> Infertility, Diminished ovarian reserve"}],"title":"Concept & Purpose","table":1,"head":["System","Conditions"],"id":"mitochondrial-transplantation:def-concept-purpose","v":"34a6c0"},{"path":[],"roles":["issue"],"rows":[{"t":"Mitochondrial transplantation faces storage constraints (viable only 1-2 hrs on ice), high-tech equipment needs, risks of rejection of the transplanted mitochondria and uncertain long-term functionality. Ethical concerns include its classification as germline gene therapy and the genetic modification status of resulting offspring."}],"title":"<b><u>Limitations & Ethics<\/u><\/b>","id":"mitochondrial-transplantation:issue-limitations-ethics","v":"14e312"},{"path":["Mitochondrial replacement therapy in IVF"],"roles":["how"],"rows":[{"sec":"Mitochondrial Replacement Therapy (MRT) in IVF = Germline"},{"t":"When people ask about this, they are usually referring to <b>Mitochondrial Replacement Therapy (MRT)<\/b>, famously known as the \"three-parent baby\" technique."},{"t":"Healthy mitochondria from a donor woman's egg are used to replace the defective mitochondria in the mother's egg or the resulting embryo.","h":"<b>How it works:<\/b>"},{"t":"This is considered a <b>germline<\/b> modification.","h":"<b>Classification:<\/b>"},{"sec":"mitochondrial transplant in regenerative medicine","tg":1},{"sec":"Mitochondrial Transplantation in Regenerative Medicine = Somatic"},{"t":"There is also a newer, experimental medical procedure physically called \"mitochondrial transplantation\" used to treat damaged adult organs."},{"t":"Doctors take healthy mitochondria from a patient's own healthy tissue (like muscle) and inject them directly into damaged tissue (like a heart muscle that has suffered a heart attack or an ischemic stroke) to help the cells recover and survive.","h":"<b>How it works:<\/b>"},{"t":"This is considered <b>somatic<\/b> therapy.","h":"<b>Classification:<\/b>"}],"title":"Mitochondrial replacement therapy in IVF","id":"mitochondrial-transplantation:how-mitochondrial-replacement-therapy-in-ivf","v":"389705"}]},{"id":"health-and-tech","subj":"s05","name":"HEALTH AND TECH","cards":[{"path":[],"roles":["use"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">About 80% people use some form of traditional medicine<\/span><br><span class=\"li\">40% of Pharma products have natural basis ( eg. aspirin)<\/span><br><span class=\"li\"><u>Affordability is more of Trad<\/u> methods<\/span><\/span>"}],"title":"Traditional Medicine Landscape","id":"health-and-tech:use-traditional-medicine-landscape","v":"22f290"},{"path":[],"roles":["gov","issue"],"rows":[{"t":"traditional knowledge digital library + National Ayush mission + Ayush mark certification + WHO global centre for trad medicine (in Jamnagar)","h":"Intiatives to promote trad medicine :"},{"t":"But trad medicine no sci backing, limited collaboration between trad and allopathic medicine + category of herbal medicines vary in different mechanisms + biopiracy (patent without due recognition) so we have to","h":"Challenges:"},{"t":"Second WHO Global Summit on Traditional Medicine held in New Delhi, India"}],"title":"Policy Support & Challenges","id":"health-and-tech:gov-policy-support-challenges","v":"55332d"}]},{"id":"stem-cells","subj":"s05","name":"STEM CELLS","cards":[{"path":[],"roles":["def"],"rows":[{"t":"Stem cells are the body’s “master cells.” They are special, unspecialized cells that have a unique ability to develop into many different types of specialized cells in the body."},{"t":"Think of them as “blank” cells that haven’t decided what they want to be when they grow up. They are a fundamental part of our bodies, acting as an internal repair system."},{"sec":"A stem cell has two unique properties:"},{"t":"It can divide and make endless copies of itself, creating more stem cells.","h":"Self-Renewal:"},{"t":"It can be “activated” and change (differentiate) into a specialized cell with a specific job, such as a muscle cell, a red blood cell, a brain cell, or a skin cell.","h":"Differentiation:"}],"id":"stem-cells:def-main","v":"bbbb71"},{"path":[],"roles":["def"],"rows":[{"t":"There are two main types, which are different based on their origin and their abilities."},{"t":"Origin: These cells come from embryos that are 3 to 5 days old. Power: They are pluripotent (pluri = many). This is their most important feature. It means they can turn into any type of cell in the entire body. Use: This incredible flexibility makes them extremely valuable for research into how to grow new, healthy tissues to repair or replace damaged ones","h":"Embryonic Stem Cells :"},{"t":"Origin: These cells are found in small numbers in most adult tissues, such as your bone marrow, fat, and skin. Power: They are multipotent (multi = several). This means they are more limited.","h":"Adult Stem Cells :"},{"t":"They can only turn into a few types of cells, usually those found in the tissue they come from. Example: An adult stem cell from your bone marrow can become any type of blood cell (red, white, or platelet), but it cannot become a brain cell or a skin cell.","cont":1},{"t":"The Supreme Court (SC) has categorically barred medical practitioners from offering stem cell therapy (SCT) as a treatment for autism spectrum disorder (ASD)."}],"title":"What Are the Main Types of Stem Cells?","id":"stem-cells:def-what-are-the-main-types-of-stem-cells","v":"4d45a0"},{"path":[],"roles":["use"],"rows":[{"t":"The ability of stem cells to differentiate into new, healthy tissue is what makes them a “holy grail” for medical research. This field is called regenerative medicine. The main goal is to use stem cells to repair or replace tissues and organs damaged by disease."},{"t":"By watching stem cells mature into, for example, heart cells, scientists can learn how heart disease develops and test new drugs on those cells in a lab.","h":"Understanding Disease:"},{"t":"This is the most famous application. The idea is to guide stem cells to become the specific cells a patient needs.","h":"Tissue Regeneration:"},{"t":"Grow new brain cells that produce dopamine.<br>ஒ Type 1 Diabetes: Grow new insulin-producing cells for the pancreas.","h":"Parkinson’s Disease:"},{"h":"Heart Disease:","t":"<span class=\"lst\"><span class=\"li\">Repair heart muscle damaged by a heart attack.<\/span><br><span class=\"li\">Burn Victims: Grow new, healthy skin for grafting.<\/span><\/span>"},{"t":"The only stem cell therapy that is widely and currently in use is the bone marrow transplant. In this procedure, the patient’s diseased blood stem cells (in the bone marrow) are replaced with healthy ones, which then go on to rebuild the body’s entire blood and immune system."}],"title":"Why Are Stem Cells So Important in Medicine?","id":"stem-cells:use-why-are-stem-cells-so-important-in-medic","v":"66f9eb"},{"path":[],"roles":["tbl"],"rows":[{"h":"Ophthalmology","t":"<span class=\"th\">Development / Application<\/span> CALEC Therapy:  Cultivated Autologous Limbal Epithelial Cells for corneal repair.<br><span class=\"th\">2025-26 High-Value Fact<\/span> March 2025: Phase 1/2 trials reported >90% success in restoring sight for irreversible corneal damage."},{"h":"Diabetes","t":"<span class=\"th\">Development / Application<\/span> Islet Cell Transplants: Using iPSCs to create insulin-producing $ $-cells.<br><span class=\"th\">2025-26 High-Value Fact<\/span> World First (2025): Successful autologous iPSC-islet transplant in a Type-1 patient reported functional cure signals."},{"h":"Oncology","t":"<span class=\"th\">Development / Application<\/span> Off-the-shelf CAR-T: iPSC-derived immune cells for cancer.<br><span class=\"th\">2025-26 High-Value Fact<\/span> Move toward Allogeneic (universal) products, reducing costs and wait times compared to traditional CAR-T."},{"h":"Neurology","t":"<span class=\"th\">Development / Application<\/span> Dopaminergic Neurons: Replacing cells lost in Parkinson’s.<br><span class=\"th\">2025-26 High-Value Fact<\/span> Multiple Phase-1 trials (e.g., BlueRock, Aspen) advanced in 2025 for Parkinson’s and Spinal Cord injuries."},{"h":"Organoids","t":"<span class=\"th\">Development / Application<\/span> “Organ-on-a-chip”: 3D mini-organs.<br><span class=\"th\">2025-26 High-Value Fact<\/span> Used as the primary toxicology screen in 2026, significantly reducing reliance on animal testing for new drugs."}],"table":1,"head":["Field","Development / Application","2025-26 High-Value Fact"],"id":"stem-cells:tbl-main","v":"60b0b1"},{"path":[],"roles":["gov"],"rows":[{"t":"National Guidelines for Stem Cell Research (NGSCR) 2025: Jointly updated by ICMR and DBT."},{"t":"Dissolution of the National Apex Committee (NAC-SCRT). Oversight is now centralized under the CDSCO (Drugs Controller General) for clinical trials and Institutional Ethics Committees.","h":"Major Structural Shift:"},{"t":"Human germline editing and reproductive cloning remain strictly banned.","h":"The “Prohibited” List:"},{"t":"Stem cell manufacturing is now a pillar of the Biomanufacturing Hubs initiative to make India a “Bio-factory” for regenerative medicine.","h":"BioE3 Policy Connection:"}],"title":"Regulatory & Policy Landscape (India 2026)","id":"stem-cells:gov-regulatory-policy-landscape-india-2026","v":"a57ecd"},{"path":[],"roles":["issue"],"rows":[{"t":"The risk that pluripotent cells might form tumors (Teratomas) if not fully differentiated.","h":"Tumorigenicity:"},{"t":"Even with iPSCs, “immune evasion” engineering is needed for universal (allogeneic) grafts.","h":"Immune Rejection:"},{"t":"The rise of unproven, expensive clinics claiming cures for autism or anti-aging without scientific backing remains a major regulatory headache.","h":"“Stem Cell Tourism”:"}],"title":"Constraints & Ethics","id":"stem-cells:issue-constraints-ethics","v":"f1012c"}]},{"id":"organ-transplantation-and-tissue","subj":"s05","name":"ORGAN TRANSPLANTATION and TISSUE","cards":[{"path":[],"roles":["def","gov"],"rows":[{"t":"grafting a human organ from a living or deceased person into another living person for therapy + Organ (kidney, liver, heart, lung, pancreas, intestine) vs Tissue (cornea, skin, bone, heart valves, blood vessels)"},{"t":"THOTA 1994 (Transplantation of Human Organs and Tissues Act) via 3 tier structure (Nat, St, Dist)"},{"t":"National Organ Transplant Program (NOTP) (central sector programme, access for needy citizens)"}],"id":"organ-transplantation-and-tissue:def-main","v":"d9ada4"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"deceased donation &lt; 1 per million population (Spain 52.6 pmp in 2024) + slow growth (donors incl. deceased 6,916 in 2014 → ~18,911 in 2024, NOTTO) + supply-demand mismatch (waitlist 89,839 as on 3 March 2026) + brain stem death is defined only in THOTA for organ donation, not in Registration of Births and Deaths Act 1969 + organ trafficking + family veto + few male donors (70-75% of donors are women)","h":"Challenges :"},{"t":"opt-out model (presumed consent : deceased is presumed to have consented to organ removal) (England, Singapore) + Kerala model (1st state with clear clinical protocols for brain death certification) + digital registry for transparent allocation + faster transport (flight notes telling ATC an organ is on board, so the flight gets priority take-off & landing)","h":"way forward :"}],"id":"organ-transplantation-and-tissue:issue-main","v":"0e18f7"}]},{"id":"organ-on-chip-technology","subj":"s05","name":"Organ-on-Chip Technology","cards":[{"path":[],"roles":["def","use","gov"],"rows":[{"t":"Definition & Working - basically a human organ by replicating its cells and using a membrane on a chip, aka (“New Approach Methods”) that mimic organ environment/disease in a chip-sized device; cells grow into 3D structures in micro-fluidic channels, with sensing for function evaluation.","h":"ORGAN ON CHIP TECHNOLOGY :"},{"t":"More accurate than 2D cultures/animal tests for drug efficacy, precision therapeutics, human physiology simulation, and studying disease mechanisms. Key Components - Microfluidics (channelled cell delivery), Living cell tissues (arranged to mimic function), Drug delivery signals, and Sensing (track chip performance).","h":"Advantages & Uses -"},{"t":"Changes in New Drugs & Clinical Trials Rules 2019 to allow OoCs; initiatives like Phenome India Project (National Biobank inaugurated at the CSIR-Institute of Genomics and Integrative Biology (IGIB).) and Indian Cancer Genome Atlas for advancing precision medicine -promising in drug discovery and healthcare innovation.","h":"Indian Steps & Significance -"}],"id":"organ-on-chip-technology:def-main","v":"acad01"}]},{"id":"drug-quality","subj":"s05","name":"DRUG QUALITY","cards":[{"path":[],"roles":["news","gov"],"rows":[{"sec":"<b>Why in the news?<\/b>"},{"t":"Central Drugs Standard Control Organisation (CDSCO) directed manufacturers of 49 medicines to recall their products after samples were found to be “not of standard quality”."},{"t":"It regulates the quality, safety, and efficacy of drugs, medical devices, and cosmetics in India under the Drugs & Cosmetics Act, 1940 and Drugs and Cosmetics Rules, 1945.","h":"<b>CDSCO<\/b>:"},{"t":"It regulates the import, manufacturing, sale, and distribution of drugs in India.","h":"<b>Drugs and Cosmetics Act (DCA), 1940<\/b>:"},{"t":"Responsible for licensing manufacturing establishments and surveillance over the sale of spurious drugs.","h":"<b>State Drug Regulatory Authorities (SDRAs)<\/b>:"},{"t":"It revises the prices of controlled bulk drugs and also monitors the availability of drugs, identifies shortages.","h":"<b>National Pharmaceutical Pricing Authority (NPPA)<\/b>:"}],"title":"<b>Regulation of drugs in India<\/b>","id":"drug-quality:news-regulation-of-drugs-in-india","v":"394748"},{"path":[],"roles":["issue"],"rows":[{"t":"SLAs face challenges like ill-equipped testing labs, a paucity of drug inspectors, and poor understanding of rules.","h":"<b>State-Level Authorities (SLAs)<\/b>:"},{"t":"In 2023, just about 2,000 out of 10,500 manufacturing units were found to be compliant with WHO-Good Manufacturing Practices (GMP) standards.","h":"<b>Non-Compliance with Standards<\/b>:"},{"t":"Due to non-mention of time frame for completion of regulation stages, no centralised record keeping, and absence of a national database of manufacturers.","h":"<b>Information Asymmetry<\/b>:"},{"t":"Limited outreach among patients as well as healthcare professionals, with little or no information about measures taken after adverse drug reports.","h":"<b>Limited reach of Pharmacovigilance<\/b>:"}],"title":"<b>Issues with drug quality in India<\/b>","id":"drug-quality:issue-issues-with-drug-quality-in-india","v":"f9d9a2"},{"path":[],"roles":["gov"],"rows":[{"t":"It envisages strengthening the laboratory infrastructure and up-gradation of existing State Drug Controller offices in states.","h":"<b>‘Strengthening of States’ Drug Regulatory System (SSDRS)<\/b>:"},{"t":"Drugs & Cosmetics (Amendment) Act 2008 provides stringent penalties for the manufacture of spurious and adulterated drugs.","h":"<b>Amendment to DCA 1940<\/b>:"},{"t":"Making inspection of manufacturing establishments mandatory by Central and State Drug Inspectors before the grant of a manufacturing license.","h":"<b>Amendments to Drugs and Cosmetics Rules, 1945<\/b>:"},{"t":"The government has extended eligibility to all pharmaceutical manufacturing units with a turnover below ₹500 crore.","h":"<b>Revamping Pharmaceuticals Technology Upgradation Assistance Scheme (PTUAS)<\/b>:"}],"title":"<b>Measures taken to ensure quality of Drugs<\/b>","id":"drug-quality:gov-measures-taken-to-ensure-quality-of-drug","v":"ec1004"},{"path":["<b>New Drugs and Clinical Trials (Amendment) Rules, 2026<\/b>,"],"roles":["gov"],"rows":[{"t":"<b>1. The \"Prior Intimation\" System (Replacing Test Licenses)<\/b>"},{"t":"Manufacturers had to wait for a formal \"Test License\" to manufacture small quantities of a new drug or unapproved Active Pharmaceutical Ingredient (API) for clinical trials, research, or testing.","h":"<b>Earlier:<\/b>"},{"t":"For most low-risk drugs, this license requirement is replaced with a \"Prior Intimation\" mechanism. Manufacturers submit an online form (via the SUGAM portal) and, once acknowledged, can immediately proceed with manufacturing for research purposes.","h":"<b>Now:<\/b>"},{"t":"High-risk categories (narcotics, cytotoxic drugs, sex hormones, beta-lactams, and biologics with live microorganisms) still require strict prior permission.","h":"<i>Exception:<\/i>"},{"t":"<b>2. Slashed Approval Timelines<\/b>"},{"t":"For applications that still require formal regulatory approval from the Central Licensing Authority, the statutory processing time has been cut in half—from <b>90 working days down to 45 working days<\/b>."}],"title":"<b>New Drugs and Clinical Trials (Amendment) Rules, 2026<\/b>,","id":"drug-quality:gov-new-drugs-and-clinical-trials-amendment","v":"e53ca3"},{"path":["<b>New Drugs and Clinical Trials (Amendment) Rules, 2026<\/b>,"],"roles":["gov"],"rows":[{"t":"<b>3. Streamlined BA/BE Studies<\/b>"},{"t":"Certain low-risk Bioavailability/Bioequivalence (BA/BE) studies no longer require prior permission to initiate. They have been shifted to the notification/intimation system. The government expects this single move to reduce the number of license applications by roughly 50%."},{"t":"<b>4. Post-Approval Quality Changes (G.S.R. 97(E))<\/b>"},{"t":"The 2026 draft introduces a globally recognized, risk-based classification system for modifying a drug's manufacturing process after it has already been approved:"},{"t":"Require prior regulatory approval.","h":"<b><u>Level I (Major) & Level II (Moderate)<\/u><\/b><b>:<\/b>"},{"t":"Can be implemented without prior approval and simply reported in an annual submission.","h":"<b><u>Level III (Minor)<\/u><\/b><b>:<\/b>"},{"t":"<b>5. Faster Ethics Committee Registration (G.S.R. 98(E))<\/b>"},{"t":"The <u>procedural step<\/u> of granting a \"Provisional Certificate\" for Ethics Committees has been omitted. The <u>CDSCO<\/u> can now grant direct final registration upon satisfactory scrutiny of the application, removing a major administrative bottleneck."}],"title":"<b>New Drugs and Clinical Trials (Amendment) Rules, 2026<\/b>,","id":"drug-quality:gov-new-drugs-and-clinical-trials-amendment-2","v":"70b500"}]},{"id":"fixed-dose-combination-drugs","subj":"s05","name":"FIXED DOSE COMBINATION DRUGS","cards":[{"path":[],"roles":["def"],"rows":[{"t":"FDCs refer to products containing two or more active ingredients, also referred to as cocktail drugs, used for a particular indication (as per Drugs & Cosmetics Rule 1945).","h":"<b>Definition<\/b>:"},{"t":"The biologically active component of a drug product (tablet, capsule, cream, injectable) that produces the intended effects.","h":"<b>Active Ingredient<\/b>:"},{"t":"Mostly FDCs are in combinations of cough, cold, and fever preparations; antimicrobials; vitamins and minerals, etc.","h":"<b>Common Combinations<\/b>:"},{"img":7}],"title":"<b>What are FDCs Drugs?<\/b>","id":"fixed-dose-combination-drugs:def-what-are-fdcs-drugs","v":"ee039b"},{"path":[],"roles":["fix"],"rows":[{"t":"As suggested by the<u> Mashelkar Committee <\/u>(for regulatory infrastructure and the problem of spurious/substandard drugs) against those involved in drug-related cases of corruption.","h":"<b>Strong Punitive Action<\/b>:"},{"t":"Require robust scientific evidence of FDC efficacy and safety to prevent unjustifiable combinations and enhance regulatory scrutiny.","h":"<b>Evidence-Driven Authorisation<\/b>:"},{"t":"Establish vigilant post-market monitoring mechanisms for prompt detection and resolution of FDC-related adverse effects, prioritising public safety.","h":"<b>Surveillance Systems<\/b>:"},{"t":"Harmonise export policies with domestic regulations to prohibit the overseas export of domestically banned or restricted FDCs.","h":"<b>Export Control Stringency<\/b>:"}],"title":"<b>Way Forward<\/b>","id":"fixed-dose-combination-drugs:fix-way-forward","v":"85d2a1"}]},{"id":"how-macrolides-work-mechanism-of-action","subj":"s05","name":"How Macrolides Work (Mechanism of Action)","cards":[{"path":[],"roles":["def","how"],"rows":[{"t":"Macrolides are a class of antibiotics used to treat a wide range of bacterial infections. They are a common alternative for people who are allergic to penicillin."},{"t":"a large “macrocyclic” lactone ring.","h":"Their name comes from their chemical structure:"},{"t":"Macrolides stop bacteria from multiplying by interfering with their ability to make proteins."},{"t":"They target the bacteria’s ribosome (specifically, the 50S ribosomal subunit), which is the “factory” that builds proteins.","h":"Target:"},{"t":"The antibiotic binds to this factory and blocks the exit tunnel.","h":"Action:"},{"t":"New proteins can’t be completed, and the protein “assembly line” grinds to a halt.<br>Without the ability to create new proteins, the bacteria can’t grow, repair themselves, or reproduce. This makes them bacteriostatic (they stop bacterial growth), allowing your body’s immune system to clear the infection. At very high doses, they can sometimes be bactericidal (they kill the bacteria).","h":"Result:"}],"title":"MACROLIDES antibiotics","id":"how-macrolides-work-mechanism-of-action:def-macrolides-antibiotics","v":"964a01"}]},{"id":"oral-rehydration-therapy","subj":"s05","name":"ORAL REHYDRATION THERAPY","cards":[{"path":[],"roles":["def","how"],"rows":[{"t":"<b>ORT is the administration of appropriate solutions (glucose, sodium chloride, sodium bicarbonate, and potassium chloride or citrate) by mouth to prevent or correct dehydration.<\/b>"},{"sec":"<b>ORT consists of:<\/b>"},{"t":"Water and electrolytes are administered to replace losses.","h":"<b>Rehydration:<\/b>"},{"t":"To take care of ongoing losses once rehydration is achieved (along with appropriate nutrition).","h":"<b>Maintenance fluid therapy:<\/b>"},{"sec":"<b>How ORT works?<\/b>"},{"t":"<b>ORT works because of the molecular mechanisms that govern sugar and sodium absorption inside the gut.<\/b>"},{"t":"<b>The cells that make up the lining of the gut have special receptors on their surfaces that allow them to actively absorb sugar molecules.<\/b>"},{"t":"<b>The increase in sugar and sodium inside the cells leads to increased absorption of water and chloride ions.<\/b>"}],"title":"<b>About Oral Rehydration Therapy (ORT)<\/b>","id":"oral-rehydration-therapy:def-about-oral-rehydration-therapy-ort","v":"bdea7d"},{"path":[],"roles":["use"],"rows":[{"t":"ORT has significantly reduced deaths from diarrheal diseases, with child mortality declining by two-thirds since 1990.","h":"<b>Diarrhoea:<\/b>"},{"t":"ORT is highly effective in reducing mortality from over 50% to less than 0.2% in cholera patients.","h":"<b>Cholera:<\/b>"},{"sec":"<b>Efficacy in Adults:<\/b>"},{"t":"The patients receiving the oral solution required 80% less intravenous fluids for cure in comparison to other techniques."},{"t":"It demonstrated that this low-cost intervention could effectively and safely reduce intravenous fluid needs."}],"title":"<b>Treatment for:<\/b>","id":"oral-rehydration-therapy:use-treatment-for","v":"cd8088"},{"path":[],"roles":["gov"],"rows":[{"t":"Launched to promote the use of ORT to combat child mortality due to diarrhoea.","h":"<b>National Oral Rehydration Therapy Programme (1985):<\/b>"},{"t":"ORT is a critical component of NHM programs targeting childhood illnesses like diarrhoea and dehydration.","h":"<b>National Health Mission (NHM):<\/b>"},{"t":"<b>STOP Diarrhoea Campaign<\/b>"},{"sec":"<b>Global Initiatives<\/b>"},{"t":"<b>Oral rehydration solution (ORS) and zinc are recommended by the WHO and UNICEF to be used collectively to ensure the effective treatment of diarrhoea.<\/b>"},{"t":"Roadmap 2030.","h":"<b>Global Task Force on Cholera Control (GTFCC):<\/b>"},{"t":"GAVI supports initiatives to prevent and treat diarrheal diseases, including the promotion of ORT.","h":"<b>GAVI, the Vaccine Alliance:<\/b>"}],"title":"<b>Indian Initiatives<\/b>","id":"oral-rehydration-therapy:gov-indian-initiatives","v":"d62b26"}]},{"id":"common-infections-and-preventive-measure","subj":"s06","name":"COMMON INFECTIONS AND PREVENTIVE MEASURES","cards":[{"path":[],"roles":["fact"],"rows":[{"t":"World Health Organization, Centers for Disease Control and Prevention, Ministry of Health and Family Welfare, National Centre for Disease Control.","h":"<b>Authoritative guidance:<\/b>"},{"t":"<span class=\"lst\"><span class=\"li\"><b>Upper respiratory infections (common cold, influenza, RSV)<\/b> — highly transmissible via droplets/fomites.<\/span><br><span class=\"li\"><b>COVID-19 / SARS-CoV-2 variants<\/b> — still cause occasional outbreaks and need targeted responses.<\/span><\/span>"},{"t":"<b>Tuberculosis (TB)<\/b> — airborne, long-term public-health priority in India. (WHO Global TB Report 2025, India’s TB incidence (new cases emerging each year) reduced by 21%.)"},{"h":"Pulmonary TB:","t":"<span class=\"lst\"><span class=\"li\">Most common form affecting the lungs<\/span><br><span class=\"li\">Extrapulmonary TB: Occurs outside the lungs,<\/span><br><span class=\"li\">Spinal TB (Pott’s disease): Affects the spine and can cause severe back pain<\/span><\/span>"},{"t":"<b>Diarrhoeal diseases (rotavirus, cholera, typhoid, viral gastroenteritis, food-poisoning bacteria)<\/b> — faeco-oral transmission; major child morbidity/mortality driver."},{"t":"<span class=\"lst\"><span class=\"li\"><b>Vector-borne (malaria, dengue, chikungunya, JE)<\/b> — climate & breeding-site dependent.<\/span><br><span class=\"li\"><b>Sexually-transmitted infections (HIV, syphilis, chlamydia, gonorrhoea)<\/b> — sexual contact / vertical transmission risks.<\/span><br><span class=\"li\"><b>Urinary tract infections (UTI)<\/b> — common, esp. females and catheterised patients.<\/span><\/span>"}],"title":"<b>1) Common infections (one-line each) — what to remember<\/b>","id":"common-infections-and-preventive-measure:fact-1-common-infections-one-line-each-what-t","v":"531123"},{"path":[],"roles":["def"],"rows":[{"t":"A virus that attacks the body’s immune system, infecting and destroying CD4 cells (CD4 T lymphocytes), a type of white blood cells.","h":"HIV -"},{"t":"Lenacapavir is an antiretroviral medicine that is used for HIV prevention as a Pre-Exposure Prophylaxis or PrEP."},{"t":"PrEP is a medication that can reduce the risk of HIV infection for individuals who are HIV-negative but are at risk of contracting the virus."}],"title":"HIV -","id":"common-infections-and-preventive-measure:def-hiv","v":"387aa3"},{"path":[],"roles":["def"],"rows":[{"t":"eye disease caused by the bacterium Chlamydia trachomatis.","h":"Trachoma -"},{"t":"It is categorized as a Neglected Tropical Disease by the WHO."},{"t":"Irreversible blindness","h":"Impact:"},{"t":"Personal contact or through flies","h":"Spread:"},{"t":"Trachoma control program integrated under the National Program for Control of Blindness and Visual Impairment (NPCBVI)","h":"Indian Initiative:"}],"title":"Trachoma -","id":"common-infections-and-preventive-measure:def-trachoma","v":"d060cd"},{"path":[],"roles":["def","gov"],"rows":[{"t":"Viral hepatitis (types A, B, C, D, and E) are major causes of acute liver infection."},{"t":"However, only hepatitis B, C, and D can lead to chronic infections with a higher risk of liver cirrhosis, failure or cancer."},{"h":"Vaccine Availability","t":"There is no vaccine for Hepatitis C virus."},{"t":"Hepatitis B vaccines provide protection from HDV infection."},{"t":"Havisure is India’s first indigenous Hepatitis A vaccine."}],"title":"HEPATITIS","id":"common-infections-and-preventive-measure:def-hepatitis","v":"6e576d"},{"path":[],"roles":["def"],"rows":[{"t":"Viral zoonotic disease caused by Monkeypox virus (Orthopoxvirus genus).","h":"Type:"},{"t":"Close contact with infected people, animals, or contaminated objects.","h":"Transmission:"},{"t":"Fever, headache, muscle aches, fatigue, swollen lymph nodes","h":"Symptoms:"},{"t":"Declared a Public Health Emergency of International Concern (PHEIC) by WHO.","h":"Global Concern:"},{"t":"There is no proven treatment for Mpox."},{"t":"RT-PCR (Reverse Transcription Polymerase Chain Reaction)","h":"Diagnostic Test:"}],"title":"MONKEYPOX","id":"common-infections-and-preventive-measure:def-monkeypox","v":"4ce81f"},{"path":[],"roles":["def"],"rows":[{"t":"A common sexually transmitted infection which can affect the skin, genital area and throat."},{"t":"In most cases the immune system clears HPV from the body."},{"t":"Persistent infection with high-risk HPV can cause abnormal cells to develop, which go on to become cancer."},{"t":"Cervical cancer is the most common type of cancer caused by HPV and only one preventable via vaccine."},{"t":"There is currently no treatment for HPV infection.","h":"Treatment:"}],"title":"HUMAN PAPILLOMAVIRUS (HPV)","id":"common-infections-and-preventive-measure:def-human-papillomavirus-hpv","v":"785c06"},{"path":[],"roles":["fact"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\"><b>Skin & wound infections (Staphylococcus aureus, fungal infections)<\/b> — contact or opportunistic.<\/span><br><span class=\"li\"><b>Hospital-acquired infections (CLABSI, VAP, CAUTI, MRSA, C. difficile)<\/b> — facility-linked risks.<\/span><\/span>"}],"id":"common-infections-and-preventive-measure:fact-main","v":"df5c8e"},{"path":[],"roles":["tbl"],"rows":[{"h":"<b>Type of organism<\/b>","t":"<span class=\"th\">Bacteria<\/span> <i>Living<\/i>, single-celled microorganisms<br><span class=\"th\">Viruses<\/span> <i>Non-living<\/i>infectious particles"},{"h":"<b>Cell structure<\/b>","t":"<span class=\"th\">Bacteria<\/span> Have a cell wall, cell membrane, cytoplasm, DNA (free-floating)<br><span class=\"th\">Viruses<\/span> No cell wall, no cell structure; just DNA or RNA inside a protein coat."},{"h":"<b>Reproduction<\/b>","t":"<span class=\"th\">Bacteria<\/span> Multiply<b>on their own<\/b>by cell division<br><span class=\"th\">Viruses<\/span> Can<b>only reproduce inside a living host cell<\/b>"},{"h":"<b>Examples<\/b>","t":"<span class=\"th\">Bacteria<\/span> Tuberculosis, Typhoid, Cholera, Pneumonia<br><span class=\"th\">Viruses<\/span> Flu (Influenza), COVID-19, Common Cold, HIV, Dengue"}],"table":1,"head":["Feature","Bacteria","Viruses"],"id":"common-infections-and-preventive-measure:tbl-main","v":"61911f"},{"path":[],"roles":["fix"],"rows":[{"t":"follow the national schedule for children/pregnant women and recommended adult vaccines (influenza, TT/Td, hepatitis where indicated). Vaccines reduce incidence/severity and interrupt transmission.","h":"<b>Vaccination (primary prevention):<\/b>"},{"t":"regular handwashing with soap or alcohol hand-rub, cover coughs/sneezes, stay home when ill — single most effective community measure.","h":"<b>Hand hygiene & respiratory etiquette:<\/b>"},{"t":"treat drinking water, safe food handling, toilets and sewage management to prevent diarrhoeal and enteric infections. (WASH underpins cholera/typhoid control.)","h":"<b>Safe water, sanitation & food hygiene (WASH):<\/b>"},{"t":"remove stagnant water, insecticide-treated nets, IRS, community mobilisation to prevent malaria/dengue.","h":"<b>Vector control & environmental management:<\/b>"},{"t":"condoms, testing/treatment, antenatal screening to prevent mother-to-child transmission.","h":"<b>Safe sex & STI control:<\/b>"},{"t":"rational antibiotic use (prescription only), diagnostics-led therapy to slow AMR.","h":"<b>Antimicrobial stewardship:<\/b>"},{"t":"standard precautions (hand hygiene, PPE when indicated), sterilisation, safe injection practices, isolation of infectious patients and biomedical waste management. Essential to prevent HAIs.","h":"<b>Infection prevention & control (IPC) in healthcare:<\/b>"},{"t":"improve ventilation, use masks in high-risk settings during outbreaks; cleaner indoor air reduces airborne spread.","h":"<b>Ventilation & air quality (respiratory pathogens):<\/b>"}],"title":"<b>2) Core preventive measures (universal / cross-cutting)<\/b>","id":"common-infections-and-preventive-measure:fix-2-core-preventive-measures-universal-cro","v":"0faaa2"},{"path":[],"roles":["fix"],"rows":[{"t":"Keep routine immunisations up to date (children & pregnant women)."},{"t":"before eating, after toilet, after contact with sick people, after surface contact in public places.","h":"Wash hands:"},{"t":"Use ORS and zinc for childhood diarrhoea; seek care for danger signs. (Prevents mortality.)"},{"t":"nets, larval source reduction, community campaigns during monsoon.","h":"Use mosquito control:"},{"t":"Don’t self-medicate with antibiotics; complete prescribed courses and dispose of unused antibiotics safely."},{"t":"follow IPC checklists, immunise HCWs (hepatitis B, influenza where recommended) and monitor compliance.","h":"In hospitals:"}],"title":"<b>3) Practical, exam-friendly “do’s” (what to advise communities/patients)<\/b>","id":"common-infections-and-preventive-measure:fix-3-practical-exam-friendly-do-s-what-to-a","v":"c9e259"},{"path":[],"roles":["fix"],"rows":[{"t":"early detection (symptom screening + rapid molecular tests), complete treatment, household contact tracing and BCG for neonates in high-risk settings.","h":"<b>TB:<\/b>"},{"t":"rotavirus vaccine for infants, safe water, ORS + zinc, cholera vaccine in outbreaks/at-risk populations.","h":"<b>Diarrhoeal diseases:<\/b>"},{"t":"vaccine where available, mask/use respiratory hygiene in outbreaks, genomic surveillance for variants.","h":"<b>Respiratory outbreaks (influenza/COVID/RSV):<\/b>"},{"t":"integrated vector management, early case detection (malaria RDTs), community clean-ups.","h":"<b>Vector-borne:<\/b>"},{"t":"condoms, testing-and-treat, PPTCT (prevention of parent-to-child transmission) services.","h":"<b>STIs/HIV:<\/b>"}],"title":"<b>4) Priority measures for specific infections (short bullets)<\/b>","id":"common-infections-and-preventive-measure:fix-4-priority-measures-for-specific-infecti","v":"2a1e74"},{"path":[],"roles":["gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Strengthen routine immunisation (supply chains, session sites, catch-up campaigns).<\/span><br><span class=\"li\">Expand lab & genomic surveillance capacity (IDSP + genomic hubs) for early detection & variant tracking.<\/span><br><span class=\"li\">Implement national IPC core components in all health facilities (training, supplies, monitoring).<\/span><br><span class=\"li\">Run AMR stewardship and One-Health programmes linking human, animal and environment sectors.<\/span><\/span>"}],"title":"<b>5) Systems & policy measures (what govt/health system must ensure)<\/b>","id":"common-infections-and-preventive-measure:gov-5-systems-policy-measures-what-govt-heal","v":"a252f9"},{"path":["Human Papillomavirus (HPV) vaccination campaign"],"roles":["news"],"rows":[{"t":"free vaccines to approximately 1.15 crore 14-year-old girls."},{"t":"India's national program relies on Gardasil-4, a quadrivalent vaccine targeting types 6, 11, 16, and 18."},{"t":"India has also indigenously developed Cervavac, manufactured by the Serum Institute of India (SII),"},{"t":"The intensive campaign runs for 90 days, after which the vaccine will be available on routine immunization day"},{"t":"Prime Minister Shri Narendra Modi lauded National HPV Vaccination campaign as it achieves historic milestone of crossing 1 crore HPV vaccine doses, in less than nine months, covering nearly 87% of annual cohort of eligible girls."}],"title":"Human Papillomavirus (HPV) vaccination campaign","id":"common-infections-and-preventive-measure:news-human-papillomavirus-hpv-vaccination-cam","v":"0bfbbb"}]},{"id":"preventive-measures-during-outbreaks","subj":"s06","name":"PREVENTIVE MEASURES DURING OUTBREAKS","cards":[{"path":[],"roles":["fix"],"rows":[{"t":"concise, exam-ready guidance","h":"Preventive measures during outbreaks -"},{"t":"During an outbreak, combine rapid detection & surveillance, immediate non-pharmaceutical interventions (NPIs), targeted vaccination/testing/isolation, strong health-system preparedness, clear risk communication, and One-Health actions to stop transmission, protect vulnerable groups and maintain essential services.","h":"Short summary (one line):"},{"sec":"<i><b><u>6-line PCS/GS-3 answer template (use in exam)<\/u><\/b><\/i>","tg":1},{"t":"Outbreak control requires rapid detection, interruption of transmission, protection of health systems and clear communication.","h":"Intro (1 line):"},{"t":"testing, isolation/quarantine, vaccination where available, hand hygiene, masking and targeted NPIs (microcontainment).","h":"Key public measures (2 lines):"},{"t":"triage/isolation, IPC, oxygen/bed surge and staff protection.","h":"Health-system measures (1 line):"},{"t":"strengthen genomic surveillance and link with animal health for zoonoses.","h":"Surveillance & One-Health (1 line):"},{"t":"combine evidence-based NPIs, equitable social support and transparent communication to ensure effective, rightsrespecting outbreak control.","h":"Conclusion (1 line):"}],"id":"preventive-measures-during-outbreaks:fix-main","v":"146ea4"},{"path":["<u>Immediate actions (first 72 hours)<\/u>"],"roles":["fix"],"rows":[{"t":"Activate incident command / district rapid response team (public health + clinical + logistics + communication)."},{"t":"confirm outbreak, define case definition, linelist cases, map spread (person/place/time)","h":"Epidemiological triage:"},{"t":"Scale up testing & diagnostics (rapid tests + molecular where needed) and start contact tracing."},{"t":"Implement immediate NPIs in affected areas - mask use in crowded places, hand hygiene stations, temporary restrictions on mass gatherings if indicated."},{"t":"ensure PPE, triage zones, IPC reinforcement","h":"Protect health workers -"},{"t":"public brief within 24 hours with clear actions for public (what to do, where to seek care, do’s/don’ts).","h":"Risk communication -"}],"title":"<u>Immediate actions (first 72 hours)<\/u>","id":"preventive-measures-during-outbreaks:fix-immediate-actions-first-72-hours","v":"147a54"},{"path":["<u>Community & individual measures<\/u>"],"roles":["fix"],"rows":[{"t":"accelerate targeted vaccination drives if a vaccine exists (priority: frontline workers, elderly, comorbid).","h":"Vaccination:"},{"t":"isolate confirmed cases (home or facility depending on severity); quarantine close contacts for the recommended period with testing.","h":"Isolation & quarantine:"},{"t":"symptomatic → test; high-risk contacts → test even if asymptomatic; use repeat testing protocols as per disease.","h":"Testing strategy:"},{"t":"promote well-fitting masks in indoor/crowded spaces; dispose/clean masks safely.","h":"Masking & respiratory etiquette:"},{"t":"handwashing, alcohol rub; regular cleaning of high-touch surfaces.","h":"Hand hygiene & surface cleaning:"},{"t":"symptomatic persons should stay home and seek testing/care; employers should offer paid sick leave to enable compliance.","h":"Stay-at-home guidance:"},{"t":"shield elderly, immunocompromised, pregnant women; postpone non-essential visits to LTCFs.","h":"Vulnerable protection:"},{"t":"Safe burial/practice protocols when disease requires special handling."}],"title":"<u>Community & individual measures<\/u>","id":"preventive-measures-during-outbreaks:fix-community-individual-measures","v":"6b1de0"},{"path":["<u>Health-facility measures<\/u>"],"roles":["fix"],"rows":[{"t":"front-door screening, separate respiratory/ isolation zones, fast referral pathways.","h":"Triage & separation:"},{"t":"hand hygiene, N95/PPE use when required, environmental cleaning, waste management.","h":"IPC enforcement:"},{"t":"plan workforce surge, elective care prioritisation, telemedicine for non-urgent care.","h":"Maintain essential services:"},{"t":"distribute standard treatment protocols, oxygen/ critical care scaling plan, stockpile essential medicines and consumables.","h":"Clinical guidance:"},{"t":"vaccination, psychosocial support, roster rotation to prevent burnout.","h":"Healthcare worker welfare:"}],"title":"<u>Health-facility measures<\/u>","id":"preventive-measures-during-outbreaks:fix-health-facility-measures","v":"7967fc"},{"path":["<u>Surveillance, data & labs<\/u>"],"roles":["fix"],"rows":[{"t":"case reporting (IDSP-like), sentinel sites, syndromic surveillance in primary care.","h":"Enhanced surveillance:"},{"t":"sequence representative isolates to detect variants (if applicable).","h":"Genomic surveillance:"},{"t":"real-time case counts, hospital bed/ oxygen capacity, testing positivity - use to guide NPIs.","h":"Data dashboard & analytics:"},{"t":"Wastewater/environmental surveillance where relevant for early warning (e.g., poliovirus, SARS-CoV-2)."}],"title":"<u>Surveillance, data & labs<\/u>","id":"preventive-measures-during-outbreaks:fix-surveillance-data-labs","v":"5cee70"},{"path":["<u>Non-pharmaceutical interventions (NPI) policy levers<\/u>"],"roles":["fix"],"rows":[{"t":"Targeted restrictions (microcontainment, temporary closure of highrisk venues) rather than blanket lockdowns when possible."},{"t":"Mass gathering guidance based on local transmission & healthcare capacity."},{"t":"Travel advisories & screening (domestic/international) proportional to risk."},{"t":"cohorting, hybrid models, ventilation improvements, symptomatic leave policies.","h":"School/workplace protocols:"},{"sec":"<u>One-Health & animal sector<\/u>","tg":1},{"t":"Animal surveillance & culling (if zoonotic spillover), safe handling of sick animals, veterinary diagnostics."},{"t":"Restrict wildlife markets/unsafe practices linked to zoonosis risk; coordinate human-animal health data sharing."}],"title":"<u>Non-pharmaceutical interventions (NPI) policy levers<\/u>","id":"preventive-measures-during-outbreaks:fix-non-pharmaceutical-interventions-npi-pol","v":"b27b63"},{"path":["<u>Risk communication & community engagement<\/u>"],"roles":["fix"],"rows":[{"t":"Clear, transparent messaging about risk level, protective actions, where/when to test and seek care."},{"t":"Use trusted local leaders, media & social platforms to counter misinformation."},{"t":"hotlines and community reporting channels to learn barriers and adapt measures.","h":"Two-way feedback:"},{"sec":"<u>Supply chain, logistics & legal<\/u>","tg":1},{"t":"Ensure supply chains for PPE, medicines, oxygen, vaccines and testing kits."},{"t":"Mobilise temporary facilities (field hospitals, isolation centers) if needed."},{"t":"Legal measures (public health orders) should be time-limited, proportional and rights-respecting."},{"t":"support for quarantined/isolated persons (food, wages) to improve compliance.","h":"Financial protection:"}],"title":"<u>Risk communication & community engagement<\/u>","id":"preventive-measures-during-outbreaks:fix-risk-communication-community-engagement","v":"b8a564"},{"path":["<u>Recovery & resilience (post-peak)<\/u>"],"roles":["fix"],"rows":[{"t":"Gradual lifting of restrictions based on data (falling cases, hospital capacity, vaccination)."},{"t":"After-action review to document lessons, update response plans."},{"t":"Strengthen routine public-health functions (immunisation drives, lab networks, IPC) to prevent next outbreak."}],"title":"<u>Recovery & resilience (post-peak)<\/u>","id":"preventive-measures-during-outbreaks:fix-recovery-resilience-post-peak","v":"8309b5"},{"path":["<u>Practical checklists <\/u>"],"roles":["fix"],"rows":[{"sec":"<i>For individuals (short DOs)<\/i>"},{"t":"<span class=\"lst\"><span class=\"li\">DO get vaccinated if eligible.<\/span><br><span class=\"li\">DO isolate if symptomatic; inform contacts.<\/span><br><span class=\"li\">DO wear mask in crowded/indoor spaces.<\/span><br><span class=\"li\">DO wash hands frequently and avoid touching face.<\/span><br><span class=\"li\">DO follow public health advisories on testing & care.<\/span><\/span>"},{"sec":"<i>For district admin (top 8)<\/i>"},{"t":"<span class=\"lst\"><span class=\"li\">Activate district incident command<\/span><br><span class=\"li\">Mobilise testing & lab capacity.<\/span><br><span class=\"li\">Map cases & contacts; implement microcontainment.<\/span><br><span class=\"li\">Protect and equip health workers.<\/span><br><span class=\"li\">Ensure oxygen/bed surge plans.<\/span><br><span class=\"li\">Manage risk communication daily.<\/span><br><span class=\"li\">Enforce targeted NPIs and essential-service continuity.<\/span><br><span class=\"li\">Coordinate with animal health (One-Health) if zoonotic.<\/span><\/span>"},{"sec":"<i>For hospitals (top 6)<\/i>"},{"t":"<span class=\"lst\"><span class=\"li\">Triage & isolate at entry.<\/span><br><span class=\"li\">IPC audit & PPE stock check.<\/span><br><span class=\"li\">Clinical pathway for severe cases (oxygen, ICU).<\/span><br><span class=\"li\">Staff rostering & backup.<\/span><br><span class=\"li\">Maintain essential non-COVID care.<\/span><br><span class=\"li\">Report data to surveillance system daily.<\/span><\/span>"}],"title":"<u>Practical checklists <\/u>","id":"preventive-measures-during-outbreaks:fix-practical-checklists","v":"af6e3d"},{"path":["<u>Practical checklists <\/u>"],"roles":["issue"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Delayed testing & reporting → uncontrolled spread.<\/span><br><span class=\"li\">Blanket long lockdowns without social support → economic harm and non-compliance.<\/span><br><span class=\"li\">Poor communication → misinformation and panic.<\/span><br><span class=\"li\">Ignoring animal health signals in zoonotic outbreaks.<\/span><br><span class=\"li\">Inadequate protection of health workers → system collapse.<\/span><\/span>"}],"title":"<i>Common pitfalls to avoid<\/i>","id":"preventive-measures-during-outbreaks:issue-common-pitfalls-to-avoid","v":"a9546d"}]},{"id":"immunity-and-vaccination","subj":"s06","name":"IMMUNITY AND VACCINATION","cards":[{"path":[],"roles":["def"],"rows":[{"t":"Immunity is the body’s defense matrix against pathogens (viruses, bacteria) and their toxins."},{"h":"<b>Origin<\/b>","t":"<span class=\"th\">Innate (Natural) Immunity<\/span> Present from birth.<br><span class=\"th\">Adaptive (Acquired) Immunity<\/span> Develops after exposure/vaccination."},{"h":"<b>Response<\/b>","t":"<span class=\"th\">Innate (Natural) Immunity<\/span> Immediate & Non-specific (attacks anything foreign).<br><span class=\"th\">Adaptive (Acquired) Immunity<\/span> Slow initial response, but Highly Specific."},{"h":"<b>Memory<\/b>","t":"<span class=\"th\">Innate (Natural) Immunity<\/span> No memory cells.<br><span class=\"th\">Adaptive (Acquired) Immunity<\/span> <b>Creates Memory Cells<\/b> (faster response next time)."},{"h":"<b>Components<\/b>","t":"<span class=\"th\">Innate (Natural) Immunity<\/span> Skin, stomach acid, macrophages, natural killer cells.<br><span class=\"th\">Adaptive (Acquired) Immunity<\/span> T-cells (Cell-mediated) & B-cells (Humoral/Antibodies)."}],"title":"<b><u>The Core Battleground: Immunity<\/u><\/b>","table":1,"head":["Feature","Innate (Natural) Immunity","Adaptive (Acquired) Immunity"],"id":"immunity-and-vaccination:def-the-core-battleground-immunity","v":"521447"},{"path":[],"roles":["def"],"rows":[{"t":"The immune system generates its own antibodies and memory cells.","h":"Active Immunity (Your body does the work):"},{"t":"Getting infected with measles and recovering.","h":"Natural:"},{"t":"Taking a vaccine. Provides long-term protection.","h":"Artificial:"},{"t":"Ready-made antibodies are given directly to the body. No memory cells are formed.","h":"Passive Immunity (Borrowed protection):"},{"t":"Maternal antibodies passed through the placenta or breast milk.","h":"Natural:"},{"t":"Antiserum/Immunoglobulin therapy (e.g., Rabies or Snakebite antivenom). Provides immediate but short-term protection.","h":"Artificial:"}],"title":"<u>Active vs. Passive Immunity (The Acquisition)<\/u>","id":"immunity-and-vaccination:def-active-vs-passive-immunity-the-acquisiti","v":"a5ba31"},{"path":[],"roles":["tbl"],"rows":[{"h":"<b>Live Attenuated<\/b>","t":"<span class=\"th\">How it Works<\/span> Weakened, harmless version of the live virus.<br><span class=\"th\">Classic Examples<\/span> BCG, OPV (Polio), MMR, Rotavirus.<br><span class=\"th\">Pros / Cons<\/span> <b>Pro:<\/b> Lifelong immunity.<br><br><br><b>Con:<\/b> Not for the immunocompromised."},{"h":"<b>Inactivated<\/b>","t":"<span class=\"th\">How it Works<\/span> Pathogen is killed via heat or chemicals.<br><span class=\"th\">Classic Examples<\/span> IPV (Polio), Rabies, Hepatitis A.<br><span class=\"th\">Pros / Cons<\/span> <b>Pro:<\/b> Very safe.<br><br><br><b>Con:<\/b> Needs booster doses."},{"h":"<b>Subunit / Recombinant<\/b>","t":"<span class=\"th\">How it Works<\/span> Uses only a specific piece (antigen) of the germ.<br><span class=\"th\">Classic Examples<\/span> Hepatitis B, HPV.<br><span class=\"th\">Pros / Cons<\/span> <b>Pro:<\/b> Extremely low side-effect risk."},{"h":"<b>Toxoid<\/b>","t":"<span class=\"th\">How it Works<\/span> Uses the <i>toxin<\/i> made by the germ, not the germ itself.<br><span class=\"th\">Classic Examples<\/span> Tetanus, Diphtheria.<br><span class=\"th\">Pros / Cons<\/span> <b>Pro:<\/b> Prevents toxin-based diseases."},{"h":"<b>mRNA<\/b>","t":"<span class=\"th\">How it Works<\/span> Gives cells genetic instructions to make a viral protein.<br><span class=\"th\">Classic Examples<\/span> COVID-19 (Pfizer/Moderna).<br><span class=\"th\">Pros / Cons<\/span> <b>Pro:<\/b> Rapid to develop and scale."},{"h":"Conjugate vaccine","t":"<span class=\"th\">How it Works<\/span> uses 2 specfic parts of a pathogen to enhance immune response<br><span class=\"th\">Classic Examples<\/span> eg zyvac TCV"},{"h":"recombinant vaccine","t":"<span class=\"th\">How it Works<\/span> small part of the disease causing bacterium or virus is used<br><span class=\"th\">Classic Examples<\/span> eg hepatitus B"},{"h":"ADFALCIVAX VACCINE","t":"<span class=\"th\">How it Works<\/span> Dual-Stage Targeting of Plasmodium falciparum (Deadliest malaria parasite Species): Unlike existing vaccines (RTS, S/AS01 (Mosquirix) and R21/Matrix-M) that target only one life stage; it targets two critical stages in parasite’s lifecycle i.e. Pre-erythrocytic (liver) stage and Transmission (sexual) stage."},{"h":"Oncolytic Vaccine Enteromix","t":"<span class=\"th\">How it Works<\/span> An Oncolytic vaccine uses oncolytic viruses (OVs) to directly kill cancer cells and stimulate an antitumor immune response.<br>Enteromix is based on a combination of fournon-pathogenic viruses that have the ability to destroy malignant cells and simultaneously activate the patient's antitumor immunity<br><span class=\"th\">Classic Examples<\/span> Personalized mRNA Vaccines"},{"h":"Self-amplifying mRNA (saRNA) Vaccine","t":"<span class=\"th\">How it Works<\/span> saRNA vaccines work by giving the body instructions to replicate mRNA needed to create the desired antigen<br><span class=\"th\">Classic Examples<\/span> potentially enhancing the immune response with lower doses compared to existing mRNA<br>vaccines."}],"title":"<u>The Vaccine Toolkit (How we trigger Active Immunity)<\/u>","table":1,"head":["Type","How it Works","Classic Examples","Pros / Cons"],"id":"immunity-and-vaccination:tbl-the-vaccine-toolkit-how-we-trigger-activ","v":"b0be2b"},{"path":[],"roles":["gov","news"],"rows":[{"t":"If a question asks about the Universal Immunization Programme (UIP) or public health infrastructure, drop these immediate 2025-26 developments:"},{"t":"The Health Ministry officially replaced the legacy Tetanus Toxoid (TT) vaccine with the Td Vaccine (Tetanus & adult Diphtheria) in the UIP to broaden protection for adolescents and pregnant women.","h":"The Td Shift (Feb 2026):"},{"t":"India launched a massive single-dose HPV vaccination campaign for 1.2 crore 14-year-old girls to eliminate cervical cancer. Currently utilizing Gardasil, the programme aims to eventually shift to India’s indigenous Cervavac.","h":"Nationwide HPV Rollout (March 2026):"},{"t":"The digital registry for tracking vaccinations (similar to CoWIN) has now registered over 11 crore children. In 2026, it is being deeply integrated with the Ayushman Bharat Digital Mission (ABDM) and the POSHAN Tracker.","h":"U-WIN Portal Integration:"},{"t":"Provides free immunization against 12 diseases","h":"UNIVERSAL IMMUNIZATION PROGRAMME (UIP) Coverage:"},{"t":"Under the National Rural Health Mission, the UIP has become a central component of India's public health efforts."},{"t":"Polio-Free India and Neonatal tetanus elimination","h":"Achievements:"}],"title":"<u>India’s Policy Push: High-Yield 2026 Updates (For Mains)<\/u>","id":"immunity-and-vaccination:gov-india-s-policy-push-high-yield-2026-upda","v":"e8d125"},{"path":[],"roles":["use","gov"],"rows":[{"t":"When a critical mass of a population is immunized, the chain of transmission is broken, indirectly protecting those who cannot be vaccinated (e.g., newborns, immunocompromised","h":"Herd Immunity:"},{"h":"global efforts","t":"WHO member states held their first meeting of the Intergovernmental Working Group (IGWG) on the WHO Pandemic Agreement."},{"t":"WHO launched 3 By 35 Initiatives, aims to raise prices of any or all of three unhealthy products tobacco, alcohol, and sugary drinks by at least 50% through health taxes by 2035."}],"title":"<u>Herd Immunity & Exam Answer Template<\/u>","id":"immunity-and-vaccination:use-herd-immunity-exam-answer-template","v":"b92a52"},{"path":["MONOCLONAL ANTIBODIES"],"roles":["def","use"],"rows":[{"t":"<b>Monoclonal antibodies (mAbs)<\/b> are laboratory-produced molecules engineered to act as substitute antibodies, designed to restore, enhance, or mimic the immune system's attack on disease-causing pathogens. Unlike naturally occurring antibodies, which are a diverse mix, mAbs are cloned from a single, specific white blood cell. This means they are designed to recognize and bind to one extremely specific target—known as an antigen—on the surface of a virus, bacteria, or cancer cell."},{"t":"This pinpoint accuracy has made them a cornerstone of modern precision medicine; they are widely used to flag cancer cells for destruction by the immune system, block the growth signals of tumors, neutralize infectious diseases, and manage autoimmune disorders by targeting specific inflammatory proteins."}],"title":"MONOCLONAL ANTIBODIES","id":"immunity-and-vaccination:def-monoclonal-antibodies","v":"573714"}]},{"id":"anti-microbial-resistance","subj":"s06","name":"ANTI-MICROBIAL RESISTANCE","cards":[{"path":[],"roles":["fact","use","gov"],"rows":[{"t":"In 2023, approximately 1 in 6 bacterial infections worldwide was caused by antibiotic-resistant bacteria."},{"t":"Around 41% of bloodstream infection reports came from China, India, and Pakistan combined.","h":"India Related Finding:"},{"t":"AMR occurs when bacteria, viruses, fungi, and parasites evolve to withstand the drugs designed to kill them."},{"t":"Bacterial AMR was directly responsible for 1.27 million deaths in 2019, Resistant infections could cause an estimated $3 trillion in global GDP, Outpacing advances in modern medicine, Threat to Food Security, Spread of resistance genes: Creating a \"Silent Pandemic\", expected to cause over 39 million","h":"why threat ?"},{"t":"Drugs and Cosmetics Rules, 1945: Antibiotics included in Schedule H1 (sold by only under registered medical professional), Red Line awareness campaign: Urging people not to use medicines marked with a red vertical line, National Action Plan on Antimicrobial Resistance 2.0 (2025-29):","h":"national measures :"},{"t":"WHO AWaRe (Access, Watch, Reserve): It is antibiotic book provides concise, evidence-based guidance","h":"global :"}],"id":"anti-microbial-resistance:fact-main","v":"98ced4"}]},{"id":"veterinary-and-animal-sciences-latest-de","subj":"s06","name":"Veterinary and Animal Sciences- latest developments.","cards":[{"path":[],"roles":["gov"],"rows":[{"t":"The Policy Push","h":"AMR & One Health:"},{"t":"<u>NAP-AMR 2.0 (2022-2026)<\/u>","h":"The Core Framework:"},{"t":"India is currently in the late stages of the National Action Plan on AMR 2.0."},{"t":"The focus has shifted from “awareness” to “enforcement and surveillance” across three sectors: Human, Animal, and Environment."},{"t":"Recognizing that antibiotic residues in poultry/dairy runoff lead to “Superbugs” in humans.","h":"<u>One Health Integration<\/u>:"},{"t":"Moving beyond doctors to Veterinary Pharmacists and Feed Manufacturers to curb non-therapeutic use (growth promoters).","h":"Stewardship Drives:"}],"title":"AMR & One Health:","id":"veterinary-and-animal-sciences-latest-de:gov-amr-one-health","v":"120cfb"},{"path":[],"roles":["fix"],"rows":[{"t":"Universal livestock vaccination (reducing the need for antibiotics).","h":"Preventative:"},{"t":"Use of probiotics and bacteriophages.","h":"Biological:"},{"t":"Improved farm hygiene to stop infection at the source.","h":"Biosecurity:"},{"t":"The “Ludhiana Model”","h":"Punjab Case Study:"},{"t":"A landmark collaboration where the Asian Development Bank (ADB) funded capacity-building for Punjab’s veterinary officers.","h":"ADB-Funded Mission:"},{"t":"Guru Angad Dev Veterinary and Animal Sciences University acted as the knowledge partner, training vets on Diagnostic-led Prescription (testing before treating) rather than “blanket” antibiotic use.","h":"Role of GADVASU:"}],"title":"The “3-Pronged” Alternative Strategy:","id":"veterinary-and-animal-sciences-latest-de:fix-the-3-pronged-alternative-strategy","v":"a2773a"},{"path":[],"roles":["issue","fix"],"rows":[{"h":"The Climate-Livestock Paradox","t":"Livestock is both a victim of climate change (heat stress) and a contributor (methane)."},{"t":"Efficiency Gains. By using Genomic Selection to breed cows that produce more milk while eating less, we reduce the “Methane Intensity” (methane per liter of milk).","h":"The Solution:"},{"t":"Focus on indigenous breeds (like Sahiwal in Punjab) that have natural thermoregulation genes compared to exotic Holsteins.","h":"Heat-Tolerant Breeds:"},{"h":"Welfare as a Trade Tool","t":"Export Standards: To export buffalo meat or dairy to the EU/Middle East, India is aligning with OIE (World Organisation for Animal Health) standards on humane slaughter and “stress-free” transport."},{"t":"Recent Ministry guidelines focus on “Shade-Water-Ventilation” protocols to prevent mass poultry mortality during Northwest India’s increasingly frequent heatwaves","h":"SOPs:"}],"title":"Animal Welfare & Climate Resilience","id":"veterinary-and-animal-sciences-latest-de:issue-animal-welfare-climate-resilience","v":"036c98"},{"path":["ONE HEALTH MISSION"],"roles":["gov"],"rows":[{"t":"A multi-sectorial initiative integrating human, livestock, wildlife and environmental health to strengthen coordinated surveillance, diagnostics and outbreak response"},{"t":"R & D, clinical readiness, data integration, community engagement","h":"key pillar :"},{"t":"Zoonotic Risk Mitigation, Pandemic Preparedness, Rise of Antimicrobial Resistance (AMR). Climate Change Impacts, Ecosystem Health","h":"need of the mission :"}],"title":"ONE HEALTH MISSION","id":"veterinary-and-animal-sciences-latest-de:gov-one-health-mission","v":"762a00"}]},{"id":"trans-fat","subj":"s06","name":"TRANS-FAT:","cards":[{"path":[],"roles":["news"],"rows":[{"t":"The policies have improved the food environment for 46% of the world’s population (it was only 6% in 2018)."},{"t":"WHO’s ambitious target to fully eliminate trans-fat from the global food supply by the end of 2023 has not been fully met."}],"title":"<b>Key Findings of the Report<\/b>","id":"trans-fat:news-key-findings-of-the-report","v":"c501c9"},{"path":[],"roles":["def"],"rows":[{"t":"Fatty acids, which are the building blocks of fat, are long chains of carbon and hydrogen atoms."},{"t":"Essential fatty acids are those needed by the human body that can only be obtained through food."},{"sec":"<b>About Trans-fat (or Trans-fatty Acids (TFA))<\/b>"},{"t":"They are considered the worst type of fats (bad fat)."},{"t":"<b>Types of Trans-fat (Natural (ruminant trans fats):<\/b> Occur naturally in meat and dairy and are not considered harmful and <b>Artificial:<\/b> Formed in an industrial process that adds hydrogen to vegetable oil, converting the liquid into a solid and resulting in partially hydrogenated oil (PHO)."},{"sec":"<b>Health Impacts<\/b>"},{"t":"<span class=\"lst\"><span class=\"li\">Raises the level of bad cholesterol and lowers the good cholesterol.<\/span><br><span class=\"li\">Linked to inflammation, overweight/obesity, high blood pressure, diabetes, etc.<\/span><\/span>"}],"title":"<b>About Fat<\/b>","id":"trans-fat:def-about-fat","v":"2550f3"},{"path":[],"roles":["gov"],"rows":[{"t":"Trans-fat free logo, Heart Attack Rewind, Eat Right India Movement, etc.","h":"<b>Initiative of FSSAI:<\/b>"},{"t":"FSSAI capped the amount of trans fatty acids (TFA) in oils and fats to 3% for 2021 and 2% by 2022."},{"t":"Provides a strategic approach to eliminating industrially produced trans-fat from national food supplies.","h":"<b>REPLACE action framework by WHO (2018):<\/b>"}],"title":"<b>Steps Taken to Regulate Trans-fat<\/b>","id":"trans-fat:gov-steps-taken-to-regulate-trans-fat","v":"ff4e18"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"Trans-fat is cheaper compared to its alternatives.","h":"<b>High demand in the food industry:<\/b>"},{"t":"Many unregistered firms are using them in different ways.","h":"<b>Poor enforcement of policies:<\/b>"},{"t":"Growing inclination towards processed food poses a challenge for governments and health regulators.","h":"<b>Consumer preferences:<\/b>"},{"sec":"<b>Way Forward to Reduce Use of Trans-fats<\/b>"},{"t":"Countries must strengthen enforcement mechanisms to qualify for the WHO Validation Certificate.","h":"<b>Policies:<\/b>"},{"t":"Partially Hydrogenated Oils (PHOs) in foods can be replaced by oils rich in Polyunsaturated Fatty Acids (PUFA). E.g., safflower, corn, sunflower, soybean, peanut, etc.","h":"<b>Healthier Alternative:<\/b>"}],"title":"<b>Challenges in Eliminating Trans-fat<\/b>","id":"trans-fat:issue-challenges-in-eliminating-trans-fat","v":"b8e0b4"}]},{"id":"ultra-processed-food","subj":"s06","name":"ULTRA PROCESSED FOOD","cards":[{"path":[],"roles":["def","gov","fix"],"rows":[{"t":"They are industrial formulations, usually high in fat, sugar and salt (HFSS), containing cosmetic additives such as emulsifiers, stabilisers, colourants and flavouring agents. E.g., noodles, biscuits, chips etc."},{"t":"They are low in dietary fibre, protein and micronutrients and are designed for convenience, long shelf life and hyper-palatability."},{"t":"Consumer Protection Act, 2019, FSSAI limits Trans fatty acids (TFA. Revised (2024) Dietary Guidelines","h":"intiatives to minimize :"},{"t":"Economic Survey 2025 proposed health tax on UPFs, stricter labelling, marketing restrictions., Recognise UPFs as a Public Health Risk, Front-of-Pack Warning Labels, Regulate Corporate Influence, Restrict UPFs in Public Institutions:","h":"sol :"}],"id":"ultra-processed-food:def-main","v":"fd2fe1"}]},{"id":"non-communicable-diseases","subj":"s06","name":"NON-COMMUNICABLE DISEASES","cards":[{"path":[],"roles":["def"],"rows":[{"t":"<b>1. The Core Phenomenon: \"The Epidemiological Transition\"<\/b> India is undergoing a rapid epidemiological transition. Historically, the public health system was designed to fight communicable/infectious diseases (like TB, Malaria, and Cholera). Today, due to rapid urbanization, increased life expectancy, and changing lifestyles, the primary cause of mortality has aggressively shifted to NCDs, which now account for over 60% of all deaths in India."},{"t":"<b>2. The \"Big Four\" (and the Emerging Fifth)<\/b> According to the WHO, the NCD burden is primarily driven by four major disease groups:"},{"t":"Heart attacks and strokes (the highest killer).","h":"<b>Cardiovascular Diseases (CVDs):<\/b>"},{"t":"Asthma and Chronic Obstructive Pulmonary Disease (COPD), severely exacerbated by India's air pollution crisis.","h":"<b>Chronic Respiratory Diseases (CRDs):<\/b>"},{"sec":"<b>Cancers.<\/b>"},{"t":"India is often referred to as the \"Diabetes Capital of the World.\"","h":"<b>Diabetes:<\/b>"},{"sec":"<i>(Note: Mental Health is increasingly being recognized as the critical fifth pillar of NCDs).<\/i>"}],"title":"The Epidemic of Non-Communicable Diseases (NCDs) in India","id":"non-communicable-diseases:def-the-epidemic-of-non-communicable-disease","v":"801f0b"},{"path":[],"roles":["def"],"rows":[{"t":"Malnutrition-related diabetes has been officially recognized and named “type 5 diabetes”"},{"t":"Autoimmune destruction of insulin-producing beta cells that prevents your pancreas from making insulin","h":"Type 1:"},{"t":"Mainly caused by obesity and over nutrition (Body does not use insulin well).","h":"Type 2:"},{"t":"Occurs with high blood glucose during pregnancy and can cause complications for bothmother and child","h":"Gestational:"}],"title":"DIABITIES AND ITS TYPES","id":"non-communicable-diseases:def-diabities-and-its-types","v":"a2fe3a"},{"path":[],"roles":["issue"],"rows":[{"t":"<b>3. The Risk Factors<\/b> Examiners look for a clear distinction between what can and cannot be controlled:"},{"t":"Diets high in trans fats, ultra-processed foods, free sugars, and sodium; physical inactivity; tobacco use; and harmful alcohol consumption.","h":"<b>Modifiable Behavioral Risk Factors:<\/b>"},{"t":"Raised blood pressure (hypertension), obesity, and raised blood glucose.","h":"<b>Metabolic Risk Factors:<\/b>"},{"t":"Age, genetics, and family history.","h":"<b>Non-Modifiable Risk Factors:<\/b>"},{"t":"<b>4. The Socio-Economic Impact (The Analytical Core)<\/b> This is where you earn your marks. The NCD epidemic is not just a health crisis; it is an economic one."},{"t":"Unlike in Western nations where NCDs primarily affect the elderly, in India, a massive percentage of NCD deaths occur prematurely (between the ages of 30 and 69). This strikes at the heart of India's working-age population, blunting its economic productivity.","h":"<b>Threat to the Demographic Dividend:<\/b>"},{"t":"NCDs require chronic, lifelong management. This leads to massive Out-Of-Pocket Expenditure (OOPE) for families. A sudden cancer diagnosis or stroke is one of the leading causes of families falling back below the poverty line.","h":"<b>Catastrophic Health Expenditure:<\/b>"},{"t":"India's primary healthcare centers (PHCs) were traditionally geared toward maternal health and immunization. The NCD surge forces patients into already overcrowded tertiary care hospitals (like AIIMS or PGI) for advanced treatments like dialysis or chemotherapy.","h":"<b>Overburdening Infrastructure:<\/b>"}],"id":"non-communicable-diseases:issue-main","v":"093721"},{"path":[],"roles":["gov"],"rows":[{"t":"<b>5. Government Interventions (The Way Forward)<\/b> Always conclude with how the state is responding:"},{"t":"The National Programme for Prevention and Control of Non-Communicable Diseases (recently renamed and expanded to include diseases like non-alcoholic fatty liver disease).","h":"<b>NP-NCD:<\/b>"},{"t":"Shifting the focus to <i>preventive<\/i> care by conducting massive population-level screenings for hypertension, diabetes, and common cancers at the village level.","h":"<b>Ayushman Bharat Health and Wellness Centres (AB-HWCs):<\/b>"},{"t":"\"Eat Right India\" and strict regulations capping industrial trans fats at 2%.","h":"<b>FSSAI Initiatives:<\/b>"}],"id":"non-communicable-diseases:gov-main","v":"f15524"}]},{"id":"obesity","subj":"s06","name":"OBESITY","cards":[{"path":[],"roles":["news","def"],"rows":[{"t":"Prime Minister stated that in 2022, one in eight people globally is living with obesity, with cases among children and adolescents (5 to 19 years) having quadrupled."},{"sec":"<b>About Obesity<\/b>"},{"t":"Defined as an abnormal or excessive fat accumulation that presents a risk to health (World Health Organisation)."},{"t":"Body Mass Index (BMI) is used to classify obesity. BMI 30 or above is classified as obese."},{"sec":"<b>Status of Obesity in India as per NFHS-5 (2019-2021)<\/b>"},{"t":"Overall, 24% of women and 23% of men are overweight or obese."},{"t":"Child (under 5 years) overweight rates increased from 2.1% to 3.4% between 2015-16 and 2019-21."}],"title":"<b>Why in the News?<\/b>","id":"obesity:news-why-in-the-news","v":"f8b6eb"},{"path":[],"roles":["issue"],"rows":[{"t":"Increased consumption of refined carbohydrates, saturated fats, and easy access to processed foods.","h":"High-Calorie, Low-Nutrient Diets:"},{"t":"Long sitting hours, excessive screen time, minimal movement in daily routines, etc.","h":"Sedentary Lifestyles:"},{"t":"Altered food composition, impacting metabolism and weight gain.","h":"Use of Genetically Modified Crops:"},{"img":8}],"title":"<b>Factors Driving Obesity in India<\/b>","id":"obesity:issue-factors-driving-obesity-in-india","v":"4fd7e7"},{"path":[],"roles":["news"],"rows":[{"t":"The drug semaglutide, marketed under the brand name Wegovy, will be available in the form of injections.","h":"drugs :"},{"t":"Semaglutide, works as an appetite suppressant by imitating a hormone called glucagon-like peptide-<br>1 (GLP-1)."},{"t":"recently its patent expired making it cheaper"},{"t":"GLP-1 is an intestinal hormone released after eating, and usually makes people feel fuller."}],"title":"drugs :","id":"obesity:news-drugs","v":"91097f"}]},{"id":"nanotech","subj":"s07","name":"NANOTECH","cards":[{"path":[],"roles":["def"],"rows":[{"t":"Nanotechnology functions by manipulating matter at the atomic scale, based on the principle that a material’s properties—such as strength, conductivity, or durability—are determined by the precise arrangement of its atoms.","h":"Definition and Scope:"},{"t":"Much like a car requires its individual parts to be correctly positioned to function, scientists engineer these atomic structures to optimize performance, eliminating flaws like brittleness or energy inefficiency."},{"t":"By working at this minute level, often tapping into unique quantum effects, researchers can create entirely new materials with advanced capabilities, ranging from shatter-proof glass to targeted drug delivery systems, effectively redesigning the building blocks of matter to solve complex problems."},{"t":"Nanotechnology involves the design, production, and application of materials and devices at the nanoscale (1-100 nm). It enables manipulation of atoms and molecules to create structures with novel properties.<br>India’s Position","h":"Formally :"},{"img":9}],"title":"Definition & Scope","id":"nanotech:def-definition-scope","v":"caf96d"},{"path":[],"roles":["use","gov","issue"],"rows":[{"t":"Since 2016, India has maintained the 3rd position globally for scientific publications in nanoscience and technology<br>Sectoral Applications"},{"t":"Nanotechnology is used in diverse sectors like energy (efficient solar panels, battery tech), food (nanobiosensers pathogen detection), water management (nano enabled reverse osmosis advanced filtration), electronics (carbon nanotubes can replace silicon in semiconductors), health (nanomedicines, diagnostics), and environment (pollutant detection).<br>Policy Support","h":"Major Applications:"},{"t":"Indian government has launched schemes such as the Nano Science and Technology Initiative (NSTI, 2002). (to promote R&D in nanotech) and the Mission on Nano Science and Technology (Nano Mission, 2007) and nano science and tech in punjab (1st).","h":"Key Initiatives:"},{"sec":"Key Concerns"},{"t":"Health & Environmental Concerns: Nanoparticles can cause acute inflammatory reactions, Lack of Skilled Workforce: Low enrollment in nanotechnology education, High Costs and Limited Private Sector Participation, Ethical Issues: Potential misuse, such as in warfare and privacy invasion","h":"Challenges :"}],"id":"nanotech:use-main","v":"faf6d9"},{"path":[],"roles":["use","issue","gov"],"rows":[{"t":"Applications Nanotechnology can be applied to agriculture in various ways, including creating nano-fertilizers and nano-pesticides that reduce toxicity and improve nutrient uptake. It is also used in food processing through <u>nano emulsions <\/u>to extend shelf-life and in edible coatings to reduce post-harvest losses. Nanotechnology also helps in crop breeding by enabling precise gene manipulation at the nanoscale<br>Implementation Barriers"},{"t":"The implementation of nanotech in agriculture faces several challenges, such as the high cost of technology, with agricultural drones costing between Rs 4-5 lakh, low digital literacy, fragmented landholdings Government Programs","h":"Challenges :"},{"t":"National Agricultural Innovation Project (NAIP) (initiated projects to explore nanotech applications in this sector) + Indian Council for Agriculture Research (ICAR) conducts skill development programs, and IFFCO has established a Nano Fertilizer Plant (NFP) in Phulpur, Prayagraj","h":"Initiatives:"}],"title":"NANOTECH IN AGRICULTURE  Innovations","id":"nanotech:use-nanotech-in-agriculture-innovations","v":"8c00de"},{"path":[],"roles":["use","issue","fix"],"rows":[{"t":"Nanotech is used in clinical investigations, such as using gold nanoparticles to detect specific nucleic acid sequences, and for creating potential cancer treatments. It also provides better imaging tools for earlier disease diagnosis and personalized treatment."},{"t":"In drug delivery, nanotech materials can protect drugs from degradation and control their release. Furthermore, it assists in gene sequencing by helping to design and engineer advanced nanopore (A nanopore is an extremely small hole, only a few nanometers in size.","cont":1},{"t":"This can be a natural protein channel, like those found in cell membranes) materials<br>Risks & Strategy","cont":1},{"t":"free radicals (They are molecules that can cause harm to body cells when created by certain nanoparticles, such as those made of cobalt and chromium) can harm body cells + acute inflammatory reaction as the immune system identifies them as “invader” particles + high cost of development and implementation","h":"Challenges :"},{"t":"Way forward is meticulous design and frequent trails + dedicated authority"}],"title":"NANOTECH IN HEALTHCARE  Medical Advances","id":"nanotech:use-nanotech-in-healthcare-medical-advances","v":"cc9b59"},{"path":[],"roles":["use","issue"],"rows":[{"sec":"Military Applications"},{"t":"These sensors are used to detect chemical and biological weapons. Nano-devices can also be used to detect or decrease radioactivity","h":"Nano-Sensors:"},{"t":"Nanoparticles of silicon dioxid
