rk>mass bleaching<\/mark> event hit its reefs hard)<\/span><br><span class=\"li\">Gulf of Mannar, Vaan island (worked: artificial reef modules slowed island erosion and helped corals recover)<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">India protects via WPA Schedule I<\/span><br><span class=\"li\">EPA ban on coral and sand use in construction<\/span><br><span class=\"li\">ICRI membership<\/span><\/span>","h":"<b>India's response<\/b>:"}],"id":"coral-bleaching:use-main","v":"903a61","q":"Why reefs matter, a bleaching example and a recovery example, and how India protects corals?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Threats: 4th global mass bleaching (NOAA 2024)<\/span><br><span class=\"li\">coral mining<\/span><br><span class=\"li\">aquarium trade<\/span><br><span class=\"li\">ocean acidification<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">cut runoff<\/span><br><span class=\"li\">cryobank (Taronga)<\/span><br><span class=\"li\">Biorock (Gulf of Kutch)<\/span><br><span class=\"li\">artificial reefs (Tamil Nadu)<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"coral-bleaching:issue-main","v":"b88d83","q":"What threatens coral reefs, and how do we protect them?"}],"circle":"y"},{"id":"peatlands","subj":"s01","name":"Peatlands","cards":[{"path":[],"roles":["def","issue"],"rows":[{"t":"Simply means layers of decaying matter (plants and animals ) decomposing for centuries because no Oxygen so low rate of decomposition ( 1 sq m of peatland holds 5x more carbon than 1 sq m of forest )"},{"t":"12 % in world and 60% in india are in danger"},{"t":"<span class=\"lst\"><span class=\"li\">guidelines for global action on peatlands<\/span><br><span class=\"li\">UNEP global peatlands initiative formed at UNFCCC COP in marakesh, Morocco<\/span><\/span>","h":"Initiatives:"},{"t":"<span class=\"lst\"><span class=\"li\">(same vohi problems kya hongi : overuse , over farming ((Palm oil, Eucalyptus).), human acts etc etc. + balancing interest of diverse groups )<\/span><br><span class=\"li\">Drained peat is highly flammable (e.g., the massive fires in Indonesia), For fuel or horticulture (gardening soil).<\/span><\/span>"},{"t":"(just ask yourself the question ki what will have to done to protect an area which is under threat)","h":"Way forward:"}],"id":"peatlands:def-main","v":"0b122d","q":"What are peatlands, how much is at risk, which initiatives exist, and what threatens them?"}],"circle":"w"},{"id":"marine-protected-areas","subj":"s01","name":"Marine protected areas","cards":[{"path":[],"roles":["def"],"rows":[{"t":"A specific area where activity is regulated"},{"t":"Gulf of Mannar marine park, Lothian island (WB) and Gahirmatha (Odisha)","h":"Examples in India:"}],"id":"marine-protected-areas:def-main","v":"21cb80","q":"What is a marine protected area? Three examples in India?"}],"circle":"w"},{"id":"unregulated-sand-mining","subj":"s01","name":"UNREGULATED SAND MINING","cards":[{"path":[],"roles":["def","issue"],"rows":[{"t":"Sand is the second most consumed natural resource globally after water. In India, rapid urbanization has turned sand into \"White Gold,\" leading to a demand-supply gap of nearly 300 million tonnes annually."},{"t":"To make strong concrete, you need riverbed or marine sand."},{"t":"Indiscriminate mining of riverbeds. Altering River Hydrodynamics, Groundwater Depletion, Biodiversity Loss, sand mafia (y? Because low barrier to entry but high profits, sand minor mineral under Mines and Minerals (Development and Regulation) Act, 1957 (MMDR Act) hence less regulated,","h":"Problems :"}],"id":"unregulated-sand-mining:def-main","v":"858ff3","q":"Why is sand so in demand, and what does unregulated sand mining cause?"},{"path":[],"roles":["gov","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">sand = minor mineral (MMDR 1957) so states regulate<\/span><br><span class=\"li\">Deepak Kumar v State of Haryana (2012): clearance needed even for small sand mines<\/span><br><span class=\"li\">EIA 2016 amendment: cluster EIA<\/span><\/span>","h":"Law:"},{"t":"<span class=\"lst\"><span class=\"li\">District Survey Reports<\/span><br><span class=\"li\">Sustainable Sand Mining Guidelines 2016<\/span><br><span class=\"li\">Enforcement & Monitoring Guidelines 2020 (replenishment rate sets the limit)<\/span><\/span>","cont":1},{"t":"<span class=\"lst\"><span class=\"li\">national aggregate association (like GAIN)<\/span><br><span class=\"li\">drones (Telangana model)<\/span><br><span class=\"li\"><mark>replenishment studies<\/mark> (SC)<\/span><\/span>","h":"Way forward:"},{"t":"Promoting <mark>M-Sand<\/mark> (Manufactured Sand) (artificially created by crushing hard rocks (like granite) into angular sand-sized particles, ecologically safer), The Circular Economy, Tech-Driven Enforcement:","h":"Sol :"}],"id":"unregulated-sand-mining:gov-main","v":"14e3ab","q":"What law and guidelines govern sand mining, and what are the solutions?"},{"path":[],"roles":["news"],"rows":[{"t":"Analysis of Punjab's Recent Policy Shifts (2025–2026) The Punjab government has moved from a purely prohibitive stance to a regulatory and participatory model: • Landowner Mining Sites (LMS): By allowing farmers to legally mine up to 3 feet of sand on their land, the state aims to decentralize supply and starve illegal cartels. • Crusher Mining Sites (CRMS): Registering crushers as legal mining units reduces the demand for illegally sourced raw materials. • Technological Integration: The use of drone mapping (with IIT Ropar), GPS-tracked vehicles, and an online \"Digital Sand Tracking System\" reflects a shift toward evidence-based governance"}],"id":"unregulated-sand-mining:news-main","v":"885060","q":"What has Punjab changed in its sand-mining policy (2025–26)?"}],"circle":"g","pyq":["<b>2019 Q7 (10 marks):<\/b> Coastal sand mining, whether legal or illegal, poses one of the biggest threats to our environment. Analyze the impact of sand mining along the Indians coasts, citing specific examples.","<b>2013 Q19 (10 marks):<\/b> What are the consequences of Illegal mining? Discuss the Ministry of Environment and Forest’s concept of GO AND NO GO zones for coal mining sector."]},{"id":"coastal-sand-mining","subj":"s01","name":"Coastal sand mining","cards":[{"path":[],"roles":["issue","eg","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Coastal sand mining (beaches + seabed, for building and heavy minerals) → beach and dune erosion<\/span><br><span class=\"li\">seawater enters aquifers and farms<\/span><br><span class=\"li\">turtle nesting beaches lost (Olive Ridley, Odisha)<\/span><br><span class=\"li\">fish breeding grounds damaged → fishers' catch falls<\/span><\/span>"},{"t":"Alappad (Kollam, Kerala; mineral-sand mining, \"Save Alappad\" protest 2019)","h":"Second example:"},{"t":"<span class=\"lst\"><span class=\"li\">CRZ notifications ban or restrict it<\/span><br><span class=\"li\">sand = minor mineral under MMDR 1957, so states regulate<\/span><br><span class=\"li\">NGT and SC orders against illegal mining<\/span><\/span>","h":"Rules:"}],"id":"coastal-sand-mining:issue-main","v":"749ce1","q":"What does coastal sand mining damage, one example, and the rules on it?"},{"path":[],"roles":["cause","effect","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">waves, currents and tides wear away the shoreline → 33.6% of India's coast eroding (worst: West Bengal 63%, Puducherry 57%, Kerala 45%, Tamil Nadu 41%)<\/span><br><span class=\"li\">coastline re-measured 7,500 → 11,098 km<\/span><\/span>","h":"Coastal erosion:"},{"t":"<span class=\"lst\"><span class=\"li\">sea-level rise<\/span><br><span class=\"li\">stronger cyclones and surges<\/span><\/span>","h":"Causes:"},{"t":"<span class=\"lst\"><span class=\"li\">mangroves lost<\/span><br><span class=\"li\">sand mining and dredging<\/span><br><span class=\"li\">ports and seawalls block longshore drift<\/span><br><span class=\"li\">dams cut river sediment<\/span><\/span>","cont":1},{"t":"<span class=\"lst\"><span class=\"li\">land, homes and beaches lost<\/span><br><span class=\"li\"><mark>seawater intrusion<\/mark><\/span><br><span class=\"li\">fishers displaced<\/span><\/span>","h":"Effects:"},{"t":"<span class=\"lst\"><span class=\"li\">mangroves and sand nourishment<\/span><br><span class=\"li\"><mark>Shoreline Management Plans<\/mark><\/span><br><span class=\"li\">CRZ 2019 No Development Zones<\/span><\/span>","h":"Fix:"},{"t":"<span class=\"lst\"><span class=\"li\">Coastal Management Information System<\/span><br><span class=\"li\">AI monitoring<\/span><br><span class=\"li\">World Bank K-SHORE (Kerala)<\/span><\/span>","cont":1}],"title":"COASTAL EROSION","id":"coastal-sand-mining:cause-coastal-erosion","v":"acc552","q":"How much of India&#x27;s coast is eroding, why, with what effects, and the fix?"},{"path":[],"roles":["cause","effect","fix"],"rows":[{"t":"seawater pushes into coastal aquifers and rivers when fresh groundwater falls","h":"Seawater intrusion:"},{"t":"<span class=\"lst\"><span class=\"li\">over-pumping coastal wells<\/span><br><span class=\"li\">sea-level rise and surges<\/span><br><span class=\"li\">dams reduce river flow<\/span><br><span class=\"li\">sand mining<\/span><br><span class=\"li\">shrimp ponds and tidal canals<\/span><\/span>","h":"Causes:"},{"t":"<span class=\"lst\"><span class=\"li\">Saurashtra and Kutch (Gujarat)<\/span><br><span class=\"li\">Minjur aquifer near Chennai<\/span><br><span class=\"li\">Kerala and Sundarbans deltas<\/span><\/span>","h":"Eg:"},{"t":"<span class=\"lst\"><span class=\"li\">salty drinking water<\/span><br><span class=\"li\">farmland salinised<\/span><br><span class=\"li\">mangroves and freshwater species change<\/span><\/span>","h":"Effects:"},{"t":"<span class=\"lst\"><span class=\"li\">limit pumping (CGWA)<\/span><br><span class=\"li\">artificial recharge<\/span><br><span class=\"li\">tidal regulators and check dams (Gujarat's salinity ingress programme)<\/span><\/span>","h":"Remedies:"},{"t":"<span class=\"lst\"><span class=\"li\">freshwater injection barriers<\/span><br><span class=\"li\">mangroves<\/span><br><span class=\"li\">monitoring wells<\/span><\/span>","cont":1}],"title":"Seawater intrusion","id":"coastal-sand-mining:cause-seawater-intrusion","v":"f72f17","q":"What is seawater intrusion, its causes, examples, effects and remedies?"},{"path":[],"roles":["fact","gov","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">about 250 mn people within 50 km of the sea<\/span><br><span class=\"li\">Cyclone Fani about USD 1.2 bn power damage (Odisha 2019, GAR 2025)<\/span><br><span class=\"li\">half the world's mangroves at severe risk by 2100<\/span><\/span>","h":"Coasts:"},{"t":"<span class=\"lst\"><span class=\"li\">CRZ 2019<\/span><br><span class=\"li\">ICZMP (Odisha, West Bengal)<\/span><br><span class=\"li\">INCOIS Coastal Vulnerability Index and multi-hazard maps<\/span><br><span class=\"li\">CMIS<\/span><br><span class=\"li\">CDRI (IRIS for island states)<\/span><\/span>","h":"Tools:"},{"t":"<span class=\"lst\"><span class=\"li\">mangroves, reefs, dunes as buffers<\/span><br><span class=\"li\">cyclone-proof housing<\/span><br><span class=\"li\">shoreline management plans<\/span><\/span>","h":"Way forward:"}],"title":"COASTAL REGIONS","id":"coastal-sand-mining:fact-coastal-regions","v":"d11386","q":"How exposed are India&#x27;s coasts, what tools exist, and the way forward?"}],"circle":"g","pyq":["<b>2025 Q8 (10 marks):<\/b> Seawater intrusion in the coastal aquifers is a major concern in India. What are the causes of seawater intrusion and the remedial measures to combat this hazard?","<b>2022 Q18 (15 marks):<\/b> Explain the causes and effects of coastal erosion in India. What are the available coastal management techniques for combating the hazard ?","<b>2019 Q7 (10 marks):<\/b> Coastal sand mining, whether legal or illegal, poses one of the biggest threats to our environment. Analyze the impact of sand mining along the Indians coasts, citing specific examples."]},{"id":"high-seas-treaty-biological-diversity-of","subj":"s01","name":"HIGH SEAS TREATY ( Biological Diversity of Areas Beyond National Jurisdiction (BBNJ agreement) or High Seas Treaty)","cards":[{"path":[],"roles":["def"],"rows":[{"t":"India signed the treaty but not ratified yet.","h":"<b>Definition & India's status<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">share whatever useful found by any country on sea bed in high seas<\/span><br><span class=\"li\">creates marine protected areas in high seas<\/span><br><span class=\"li\">mandates EIA for high sea projects<\/span><br><span class=\"li\">Finance/ help for developing countries to participate<\/span><\/span>","h":"<b>Pillars / key features<\/b>:"}],"id":"high-seas-treaty-biological-diversity-of:def-main","v":"f2773f","q":"What is India&#x27;s status on the High Seas Treaty, and what does the treaty do?"},{"path":[],"roles":["use","eg","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Fills gap in ocean gov, promote equity, strengthen climate resilience, acknowledge indigenous and local knowledge, supports SDG 14 + (30 x 30) target, reinforces India’s support for UNCLOS<\/span><br><span class=\"li\">Keyword to include : <mark>area-based management tools<\/mark><\/span><\/span>","h":"<b>Significance<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Salas y Gómez and Nazca ridges, SE Pacific (Chile-led, set to be among the first high-seas MPAs)<\/span><br><span class=\"li\">West African states push the Eastern Atlantic (Canary–Guinea current zone) for the first wave (Jun 2026); first BBNJ COP due Jan 2027<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Cabinet approved signing (Jul 2024)<\/span><br><span class=\"li\">India signed (Sep 2024)<\/span><br><span class=\"li\">ratification still needs a domestic law<\/span><br><span class=\"li\">treaty in force Jan 2026 after 60 ratifications<\/span><br><span class=\"li\">fits India's <mark>Deep Ocean Mission<\/mark> and SAGAR/MAHASAGAR outlook<\/span><\/span>","h":"<b>India's response<\/b>:"}],"id":"high-seas-treaty-biological-diversity-of:use-main","v":"dabfa5","q":"Why the High Seas Treaty matters, the first high-seas MPAs, and India&#x27;s steps so far?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"not universal ratif, marine protected areas may conflict with territorial claims, Does not establish its own punitive body, Limited Scope: Regarding technology transfer and capacity-building","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">pass the domestic law and ratify<\/span><br><span class=\"li\">build deep-sea research capacity to share in the benefits<\/span><br><span class=\"li\">push for real technology transfer<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"high-seas-treaty-biological-diversity-of:issue-main","v":"64f20f","q":"Where is the High Seas Treaty weak, and what should India do?"}],"circle":"y"},{"id":"natural-causes-of-cc","subj":"s02","name":"NATURAL CAUSES OF CC","cards":[{"path":[],"roles":["def"],"rows":[{"t":"climate changes that happen without any human role, mostly over thousands to millions of years","h":"<b>Definition & India's status<\/b>:"},{"t":"1. Continental Drift (affect because of change pod physical features over time)","h":"<b>Pillars / key features<\/b>:"},{"t":"2. Variation of the Earth’s orbit"},{"t":"3. <mark>Milankovitch<\/mark> cycles (Milankovitch cycles are long-term, predictable variations in Earth's orbit, axial tilt, and wobble that alter the distribution and intensity of sunlight reaching our planet. These astronomical shifts operate over tens of thousands of years and are the primary natural drivers behind Earth's historical climate phases, including the onset and retreat of major ice ages)"},{"t":"4. Plate tectonics"},{"t":"5. Volcanic Activity"}],"id":"natural-causes-of-cc:def-main","v":"e97a0c","q":"What are the natural causes of climate change? Start with the first five."},{"path":[],"roles":["def","use","eg"],"rows":[{"t":"6. Ocean Currents:Ocean current is one of the major components of the climate system.It is driven by horizontal winds causing the movement of the water against the sea surface.The temperature differences of the water influence the climate of the region."},{"t":"7. Solar Variability: Sunspot activity can alter incoming solar radiation"},{"t":"Volcanic Eruptions: E.g., Mount Pinatubo (1991) injected aerosols into the stratosphere, causing a short-term cooling of ~0.5°C (Milankovitch cycles work over ~100,000 years, driving cold and warm periods)","cont":1},{"t":"explain past ice ages, but not the fast warming since 1950 → IPCC AR6: warming is <mark>unequivocally<\/mark> human-caused","h":"<b>Significance<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Mount Pinatubo, 1991 (~0.5°C cooling for about two years)<\/span><br><span class=\"li\"><mark>Maunder Minimum<\/mark> (1645–1715, few sunspots) during the Little Ice Age<\/span><\/span>","h":"<b>Examples<\/b>:"}],"id":"natural-causes-of-cc:def-main-2","v":"73632e","q":"Two more natural causes, why they can&#x27;t explain today&#x27;s warming, and two historical examples?"}],"circle":"y"},{"id":"anthropogenic-factors","subj":"s02","name":"Anthropogenic Factors","cards":[{"path":[],"roles":["def","how"],"rows":[{"t":"1. Greenhouse Gases (water vapour, Co2, CFC, Methane (formed via decomposition of organic matter), Nitrous oxide)"},{"t":"2. Change in land use patterns (From the satellite imagery, it is seen that the clearing of forest cover for agriculture and irrigated farming in arid and semi-arid lands can increase solar energy absorption and the amount of moisture evaporated into the atmosphere)"},{"t":"3. Atmospheric aerosols: what are aerosols ? They are organic and inorganic matter like dust, volcanic ash, water from transpiration, agricultural dust or vehicular emissions, they are very small in size Atmospheric aerosol can: Scatter and absorb the solar and infrared radiation, change microphysical and chemical properties of the clouds, Solar radiation, when scattered, cools the planet"}],"id":"anthropogenic-factors:def-main","v":"982434","q":"The three human factors behind climate change, and how each works?"},{"path":[],"roles":["eg","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Indo-Gangetic Plain winter haze (stubble + vehicles + industry → <mark>aerosols<\/mark> cut sunshine and change local climate)<\/span><br><span class=\"li\">south-east Amazon (2021 study: deforestation turned it into a net <mark>carbon source<\/mark>)<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">3rd largest emitter but low per-capita → <mark>CBDR<\/mark><\/span><br><span class=\"li\">NDC 2035<\/span><br><span class=\"li\"><mark>CCTS<\/mark> carbon market<\/span><br><span class=\"li\">LiFE (see Legal & Policy, <mark>Panchamrit<\/mark>)<\/span><\/span>","h":"<b>India's response<\/b>:"}],"id":"anthropogenic-factors:eg-main","v":"165da5","q":"Two examples of human-made climate effects, and India&#x27;s position as an emitter?"}],"circle":"g","pyq":["<b>2022 Q17 (15 marks):<\/b> Discuss global warming and mention its effects on the global climate. Explain the control measures to bring down the level of greenhouse gases which cause global warming, in the light of the Kyoto Protocol, 1997."]},{"id":"legal-policy-developments","subj":"s02","name":"Legal & Policy Developments","cards":[{"path":[],"roles":["gov","news"],"rows":[{"t":"<mark>MK Ranjitsinh<\/mark> vs. Union of India case (2024): Right to be free from the adverse effects of climate change under Articles 14 and 21."},{"t":"India’s enhanced NDC submitted in August 2022, which includes reducing emissions intensity by 45%, achieving 50% non-fossil energy capacity by 2030, and targeting <mark>net-zero<\/mark> by 207 2015–2023) were the warmest on record (WMO 2023), Doubling of CO₂ is likely to cause 2.5–4°C warming. (IPCC AR6)","h":"<b>Definition & India's status<\/b>:"},{"t":"every extra 0.5°C → more heat extremes, heavy rain and droughts (IPCC <mark>SR1.5<\/mark>)","h":"<b>Significance<\/b>:"}],"id":"global-temperature-trends:def-main","v":"06c3de","q":"How much has the world warmed, and what does every extra half degree mean?"},{"path":[],"roles":["eg","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">2024 = warmest year on record and the first calendar year above <mark>1.5°C<\/mark> (WMO)<\/span><br><span class=\"li\">India's 2024 = warmest year since 1901 (IMD)<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Heat Action Plans (first: Ahmedabad 2013)<\/span><br><span class=\"li\">net zero 2070 (see Panchamrit)<\/span><\/span>","h":"<b>India's response<\/b>:"}],"id":"global-temperature-trends:eg-main","v":"4b44d1","q":"Recent temperature records (world and India), and India&#x27;s response?"}],"circle":"y"},{"id":"melting-glaciers-ice-sheets","subj":"s02","name":"Melting Glaciers & Ice Sheets","cards":[{"path":[],"roles":["def","fact"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Himalayan glaciers (which store Carbon sink (stores 5.4 billion tonnes of carbon) like Gangotri are retreating at ~20 m/year. Greenland and Antarctic ice sheets have lost over 4000 gigatonnes of mass since 1992, The Hindu Kush–Himalaya region is warming rapidly—0.2 °C per decade over the last 50 years—with projections that 30–67% of glaciers may vanish by 2100 under mid-to-high warming scenarios<\/span><br><span class=\"li\">Nepal’s Yala Glacier declared dead (if all glaciers melt sea level rise by 60m (NASA)<\/span><br><span class=\"li\">+ Himalayan states reported a loss of 1,072 sq km of forest cover (2019 -2021)<\/span><br><span class=\"li\">HR (Himalayan region) records about 100 million tourists every year with 240 million expected by 2025. ( indian initiative : NMSHE)<\/span><\/span>"},{"t":"<span class=\"lst\"><span class=\"li\">Melt rate doubled since 2000; Ganga basin −21%, Brahmaputra −16% (<mark>ICIMOD<\/mark>)<\/span><br><span class=\"li\">more dead glaciers: Ayoloco (Mexico 2021), Okjökull (Iceland 2019)<\/span><\/span>"}],"id":"melting-glaciers-ice-sheets:def-main","v":"84ec00","q":"How fast are Himalayan glaciers and ice sheets melting, with figures?"},{"path":[],"roles":["cause","effect","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">warming fastest at 4,500–6,000 m<\/span><br><span class=\"li\"><mark>black carbon<\/mark><\/span><br><span class=\"li\">less seasonal snow<\/span><br><span class=\"li\">erratic western disturbances<\/span><\/span>","h":"Why faster:"},{"t":"<span class=\"lst\"><span class=\"li\">less <mark>albedo<\/mark> → more warming<\/span><br><span class=\"li\">about 0.75 mm/yr sea rise (2000–23, WMO)<\/span><br><span class=\"li\">GLOFs and debris flows (Chamoli 2021, Sikkim 2023, Dharali 2025)<\/span><\/span>","h":"Effects:"},{"t":"<span class=\"lst\"><span class=\"li\">NMSHE<\/span><br><span class=\"li\">Himansh station<\/span><br><span class=\"li\">National GLOF Risk Mitigation Programme; World: 2025 Year of Glaciers' Preservation<\/span><br><span class=\"li\">Decade of Action for Cryosphere Sciences 2025–34<\/span><\/span>","h":"India:"}],"id":"melting-glaciers-ice-sheets:cause-main","v":"c3ac6a","q":"Why is melting speeding up, what does it cause, and what are India and the world doing?"}],"circle":"g","pyq":["<b>2017 Q17 (15 marks):<\/b> ‘Climate Change’ is a global problem. How India will be affected by climate change? How Himalayan and coastal states of India will be affected by climate change?"]},{"id":"oceans-heat-absorption","subj":"s02","name":"Oceans & Heat Absorption","cards":[{"path":[],"roles":["def","eg"],"rows":[{"t":"Oceans absorb 90% of excess heat, threatening coral reefs and fisheries.","h":"<b>Definition & India's status<\/b>:"},{"t":"The oceans absorb approximately 30% of anthropogenic CO2.","h":"Stat:"},{"t":"<span class=\"lst\"><span class=\"li\">oceans took in an extra 23 zettajoules of heat (record since the 1960s)<\/span><br><span class=\"li\">SST ~0.5°C above 1981–2010<\/span><\/span>","h":"2025:"},{"t":"<span class=\"lst\"><span class=\"li\">2023–24 <mark>marine heatwaves<\/mark> → 4th global coral bleaching (NOAA 2024)<\/span><br><span class=\"li\">warmer Arabian Sea → stronger cyclones on the west coast (Tauktae 2021, Biparjoy 2023)<\/span><\/span>","h":"<b>Examples<\/b>:"}],"id":"oceans-heat-absorption:def-main","v":"b16b92","q":"How much heat and CO₂ do oceans absorb, and what is it doing to them?"},{"path":[],"roles":["gov","issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\"><mark>Deep Ocean Mission<\/mark> (2021)<\/span><br><span class=\"li\">INCOIS ocean monitoring and cyclone/tsunami warnings<\/span><br><span class=\"li\"><mark>MISHTI<\/mark> mangroves<\/span><\/span>","h":"<b>India's response<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">coral restoration<\/span><br><span class=\"li\">UNOC3, Nice 2025 (<mark>Nice Ocean Action Plan<\/mark>: SDG 14 is the least funded SDG)<\/span><br><span class=\"li\">UN Ocean Decade 2021–30<\/span><\/span>","cont":1},{"t":"<span class=\"lst\"><span class=\"li\"><mark>ocean acidification<\/mark><\/span><br><span class=\"li\">oxygen loss<\/span><br><span class=\"li\">sea-level rise<\/span><br><span class=\"li\">acidification planetary boundary breached<\/span><br><span class=\"li\">stratification → less oxygen and nutrients<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">cut CO₂<\/span><br><span class=\"li\">more marine protected areas<\/span><br><span class=\"li\">ocean goals in the NDC (Blue NDC Challenge: France + Brazil, before COP30)<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"oceans-heat-absorption:gov-main","v":"495709","q":"India&#x27;s ocean initiatives, the threats oceans face, and the way forward?"}],"circle":"y"},{"id":"extreme-weather-events","subj":"s02","name":"Extreme Weather Events","cards":[{"path":[],"roles":["def","how"],"rows":[{"t":"Increase in Extreme Weather Events: India witnessed record-breaking heatwaves in 2022 and 2024.","h":"<b>Definition & India's status<\/b>:"},{"t":"<mark>ENSO<\/mark>: El Niño and La Niña (ocean) + Southern Oscillation (air)","h":"<b>Pillars / key features<\/b>:"},{"h":"El Niño:","t":"trade winds weaken → warm water moves to South America → weak Indian monsoon, drought + lower kharif yields (rice, sugarcane, oilseeds) + harsher summers"},{"t":"<span class=\"lst\"><span class=\"li\">trade winds strengthen → good monsoon<\/span><br><span class=\"li\">cold winters in the north<\/span><br><span class=\"li\">more floods and Bay of Bengal cyclones<\/span><\/span>","h":"La Niña:"},{"t":"central/eastern Pacific >2°C above normal for a long time (one forecast for late 2026)","h":"<mark>Super El Niño<\/mark>:"},{"t":"El Niño–monsoon link is weakening (see item 46)","h":"Note:"}],"id":"extreme-weather-events:def-main","v":"1e0d4c","q":"How do El Niño and La Niña affect India, and what is a super El Niño?"},{"path":[],"roles":["eg","gov"],"rows":[{"t":"Cyclone Biparjoy (2023) and flooding in Himachal Pradesh (2023) reflect this volatility.","h":"<b>Examples<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">IMD impact-based forecasts<\/span><br><span class=\"li\"><mark>Mission Mausam<\/mark> (2024)<\/span><br><span class=\"li\">NDMA heatwave and cyclone guidelines<\/span><\/span>","h":"<b>India's response<\/b>:"}],"id":"extreme-weather-events:eg-main","v":"9bc3c3","q":"Two recent extreme weather examples, and India&#x27;s forecasting response?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">local extremes (cloudbursts) still hard to forecast<\/span><br><span class=\"li\">weaker El Niño–monsoon link makes seasonal forecasts harder<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Bharat Forecast System<\/span><br><span class=\"li\"><mark>Early Warnings for All<\/mark> (UN, by 2027)<\/span><br><span class=\"li\">heat and flood plans in every district<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"extreme-weather-events:issue-main","v":"54afda","q":"Why are extremes hard to forecast, and what should be done?"}],"circle":"y"},{"id":"co-records","subj":"s02","name":"CO₂ Records","cards":[{"path":[],"roles":["def","how"],"rows":[{"t":"A continuous record of CO₂ concentrations since 1958, measured at Mauna Loa Observatory, Hawaii (it has never been 400 ppm in 1000’s of years).","h":"<b>Definition & India's status<\/b>:"},{"t":"In 2024, fossil CO₂ emissions hit an all-time high of 10.2 GtC (up 0.8% from 2023), driven by rising natural gas (+2.4%), oil, and coal use. While US and EU emissions declined, India’s emissions rose to 0.9 GtC."},{"t":"How does Co2 cause climate change : Longwave and short wave differentiation and CO2 absorbs longwave and releases","h":"<b>Pillars / key features<\/b>:"}],"id":"co-records:def-main","v":"48861b","q":"What does the Mauna Loa record show, 2024&#x27;s emissions, and how CO₂ traps heat?"},{"path":[],"roles":["eg","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Mauna Loa 2024 average 424.6 ppm, a record (NOAA)<\/span><br><span class=\"li\">2023→2024 rise of 3.58 ppm, the fastest ever (Met Office; wildfires + El Niño)<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">3rd largest emitter, low per-capita → argues <mark>carbon budget<\/mark> fairness at COPs<\/span><br><span class=\"li\"><mark>CCTS<\/mark> carbon market (2023)<\/span><br><span class=\"li\">CCUS push (Budget 2026–27)<\/span><br><span class=\"li\">500 GW non-fossil target<\/span><\/span>","h":"<b>India's response<\/b>:"}],"id":"co-records:eg-main","v":"c29b40","q":"Recent CO₂ records, and India&#x27;s stand and tools on emissions?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">emissions still rising (record in 2024)<\/span><br><span class=\"li\">gas, oil and coal use all up<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">peak and cut emissions<\/span><br><span class=\"li\"><mark>CCUS<\/mark> for hard sectors<\/span><br><span class=\"li\">a working carbon market<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"co-records:issue-main","v":"6f4813","q":"Why are emissions still rising, and how do we cut them?"}],"circle":"y"},{"id":"economic-impacts","subj":"s02","name":"Economic Impacts","cards":[{"path":[],"roles":["def","eg","gov"],"rows":[{"t":"1 Deg. Celsius warming reduces global GDP by 12 per cent.","h":"<b>Definition & India's status<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Kerala floods 2018 (~₹31,000 cr needed to rebuild, PDNA)<\/span><br><span class=\"li\">Pakistan floods 2022 (~$30 bn <mark>loss and damage<\/mark>)<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">SDRF/<mark>NDRF<\/mark><\/span><br><span class=\"li\">PMFBY crop insurance<\/span><br><span class=\"li\">Odisha's <mark>climate budget<\/mark> tagging<\/span><br><span class=\"li\"><mark>CDRI<\/mark> for resilient infrastructure<\/span><\/span>","h":"<b>India's response<\/b>:"}],"id":"economic-impacts:def-main","v":"d796c0","q":"What does warming cost the economy? Two examples and India&#x27;s financial tools?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">adaptation finance gap<\/span><br><span class=\"li\">most disaster losses uninsured<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">climate budget tagging in every state<\/span><br><span class=\"li\"><mark>parametric insurance<\/mark><\/span><br><span class=\"li\">resilient infrastructure<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"economic-impacts:issue-main","v":"37f2c6","q":"Why are disaster losses so costly, and how do we cushion them?"}],"circle":"y"},{"id":"panchamrit-india-s-cop26-climate-goals","subj":"s02","name":"Panchamrit – India’s COP26 Climate Goals","cards":[{"path":[],"roles":["def"],"rows":[{"t":"<mark>Panchamrit<\/mark> refers to the five key climate goals announced by India at COP26 (Glasgow, 2021) to combat climate change and promote sustainability. They are:"},{"t":"Reach 500 GW of non-fossil fuel energy capacity by 2030."},{"t":"Meet 50% of energy requirements from renewables by 2030."},{"t":"Reduce total projected carbon emissions by 1 billion tonnes by 2030."},{"t":"Cut emissions intensity of GDP by 45% by 2030 (from 2005 levels)."},{"t":"Achieve <mark>net-zero<\/mark> carbon emissions by 2070. (PIB)"}],"id":"panchamrit-india-s-cop26-climate-goals:def-main","v":"3df4fd","q":"What are the five Panchamrit goals?"},{"path":[],"roles":["fact","tbl"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">India 2.9 t CO₂e per person (world 6.7)<\/span><br><span class=\"li\">$22.7 tn needed by 2070, gap $6.5 tn<\/span><br><span class=\"li\">~1.3 Gt CO₂e still left in 2070 (farms, cement, heavy industry)<\/span><\/span>","h":"NITI net-zero report:"},{"h":"Emissions intensity cut (vs 2005)","t":"<span class=\"th\">2015 NDC (2030)<\/span> 33–35%<br><span class=\"th\">2022 update (2030)<\/span> 45%<br><span class=\"th\">NDC 2035<\/span> 47%<br><span class=\"th\">Progress<\/span> 36% by 2020"},{"h":"Non-fossil power capacity","t":"<span class=\"th\">2015 NDC (2030)<\/span> 40%<br><span class=\"th\">2022 update (2030)<\/span> 50%<br><span class=\"th\">NDC 2035<\/span> 60%<br><span class=\"th\">Progress<\/span> 52.57% (Feb 2026)"},{"h":"Extra <mark>carbon sink<\/mark>","t":"<span class=\"th\">2015 NDC (2030)<\/span> 2.5–3 bn t<br><span class=\"th\">2022 update (2030)<\/span> 2.5–3 bn t<br><span class=\"th\">NDC 2035<\/span> 3.5–4 bn t<br><span class=\"th\">Progress<\/span> 2.29 bn t by 2021"}],"table":1,"head":["","2015 NDC (2030)","2022 update (2030)","NDC 2035","Progress"],"id":"panchamrit-india-s-cop26-climate-goals:fact-main","v":"6ed18c","q":"What does NITI&#x27;s net-zero report say, and how have India&#x27;s NDC targets moved from 2015 to 2035?"}],"circle":"g","pyq":["<b>2025 Q18 (15 marks):<\/b> Write a review on India’s climate commitments under the Paris Agreement (2015) and mention how these have been further strengthened in COP26 (2021). In this direction, how has the first Nationally Determined Contribution intended by India been updated in 2022?","<b>2021 Q17 (15 marks):<\/b> Describe the major outcomes of the 26th session of the Conference of the Parties (COP) to the United Nations Framework Convention on Climate Change (UNFCCC). What are the commitments made by India in this conference?"]},{"id":"country-specific-examples","subj":"s02","name":"Country-Specific Examples","cards":[{"path":[],"roles":["eg"],"rows":[{"t":"Wildfires burned 18.5 million hectares and released 2 gigatonnes of CO₂, nearly three times the nation’s economic emissions and 23% of global wildfire emissions that year.","h":"Canada (2023):"}],"id":"country-specific-examples:eg-main","v":"8296dc","q":"What did Canada&#x27;s 2023 wildfires show about climate change?"}],"circle":"w"},{"id":"challenges-solutions","subj":"s02","name":"Challenges & Solutions","cards":[{"path":[],"roles":["issue"],"rows":[{"t":"Challenges in CC: GHG emissions (India 3rd largest), 8% gap in current policies and NDC’s pledges, the pace of renewable energy growth don’t meet its implementation (power still 70 % coal).","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Steel sector accounts for about 12% of India’s CO₂. Also: cement ~6% + aluminium ~2.8% of India's GHG → refuse-derived fuel in cement (−80–85% by 2070)<\/span><br><span class=\"li\">round-the-clock RE for aluminium; EU <mark>CBAM<\/mark> makes it urgent<\/span><\/span>"},{"t":"<span class=\"lst\"><span class=\"li\">EU carbon tax on imports from 1 Jan 2026 (cement, aluminium, fertiliser, steel, hydrogen, electricity) → India: trade barrier<\/span><br><span class=\"li\">cost ~0.05% of GDP (CSE)<\/span><br><span class=\"li\">hits MSMEs<\/span><br><span class=\"li\">heavy paperwork → India calls it \"disguised protectionism\" (see COP30)<\/span><\/span>","h":"CBAM:"},{"t":"Methane is responsible for ~30 % global temperature rise since the Industrial Revolution. (Global Methane Tracker, 2025 by International Energy Agency, IEA)"}],"id":"challenges-solutions:issue-main","v":"1df24a","q":"What are India&#x27;s main climate challenges: emissions, hard sectors, CBAM, methane?"},{"path":[],"roles":["gov","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Panchamrit<\/span><br><span class=\"li\">CCTS (2023)<\/span><br><span class=\"li\">Green Hydrogen Mission<\/span><br><span class=\"li\">PAT for industry<\/span><\/span>","h":"<b>India's response<\/b>:"},{"t":"Solutions: Municipal green bonds (eg. Ahmedabad), move away from FF, invest in battery storage systems, local actions like pachathuruthu initiative (aims to create man-made mini-forests, or \"green islands,\" across the state.), sponge cities (eg. China to avert CC’s flood effects).","h":"<b>Way forward<\/b>:"}],"id":"challenges-solutions:gov-main","v":"3557e9","q":"India&#x27;s climate measures, and practical solutions with examples?"}],"circle":"y"},{"id":"climate-change-sea-level-rise","subj":"s02","name":"Climate Change & Sea Level Rise","cards":[{"path":[],"roles":["fact"],"rows":[{"t":"Sea level rise occurred at 3.3 mm per year (1993 - 2017) in North Indian Ocean."},{"t":"Average ocean temprature increased 1.45 degree (water expands when hot leading to sea level rise)."},{"t":"2023 driest year for rivers on record."}],"id":"climate-change-sea-level-rise:fact-main","v":"16a4ef","q":"How fast is the sea rising around India, and what&#x27;s driving it?"},{"path":[],"roles":["effect"],"rows":[{"t":"Coastal erosion and chronic flooding threaten major cities like Mumbai, Chennai, and Kolkata. Over 36 million Indians may face persistent flooding by 2100 across a 7,500 km coastline. Over 570,000 hectares could be submerged with a 1-meter rise, displacing about 7.1 million people, while significant infrastructure losses are expected, especially in Odisha and West Bengal.","h":"On India:"},{"t":"The Sundarbans face serious threats: up to 80% of mangrove cover could vanish, with islands already disappearing and shoreline retreating up to 200 meters annually. Intensifying cyclones like Amphan in 2020 highlight how sea-level rise magnifies storm surges—Amphan pushed seawater 25 km inland, severely impacting the Sunderbans delta. + distress movement eg. of Kosi river and climate change, how it is cutting nearby lands in Bihar, forcing people to relocate (no institutional support, false promises creates trust deficit, no rehabilitation). Lakshadweep faces land submergence risks: Kavaratti, Minicoy may lose 60% of land under RCP8.5.","cont":1}],"title":"On India:","id":"climate-change-sea-level-rise:effect-on-india","v":"3b4396","q":"What does sea-level rise mean for India&#x27;s coasts, cities, Sundarbans and islands?","read":1},{"path":[],"roles":["effect"],"rows":[{"t":"With average elevations around 1.5 meters, the nation is at risk of becoming largely uninhabitable by 2100 unless adaptive measures are undertaken.","h":"Maldives:"},{"t":"Low-lying delta regions could see 0.74 meters of sea rise by 2100, displacing over 2 million people. (Already started)","h":"Bangladesh:"},{"t":"<span class=\"lst\"><span class=\"li\">Sri Lanka (Colombo, coastal belt)<\/span><br><span class=\"li\">Myanmar (Irrawaddy delta)<\/span><br><span class=\"li\">Pakistan (Indus delta: <mark>seawater intrusion<\/mark> in Sindh)<\/span><br><span class=\"li\">Indonesia (Jakarta sinking, capital moving to Nusantara)<\/span><br><span class=\"li\">Seychelles, Mauritius (beaches, reefs, tourism)<\/span><\/span>","h":"Other IOR countries:"},{"t":"<span class=\"lst\"><span class=\"li\">climate migration from Bangladesh into Assam, West Bengal<\/span><br><span class=\"li\">shared fisheries hit<\/span><br><span class=\"li\">India as first responder (HADR)<\/span><br><span class=\"li\">role via <mark>CDRI<\/mark> and MAHASAGAR<\/span><\/span>","h":"What it means for India:"}],"id":"climate-change-sea-level-rise:effect-main","v":"6bd215","q":"Which neighbours are most at risk from sea-level rise, and what does it mean for India?"}],"circle":"g","pyq":["<b>2023 Q18 (15 marks):<\/b> The Intergovernmental Panel on Climate Change(IPCC) has predicted a global sea level rise of about one metre by AD 2100. What would be its impact in India and the other countries in the Indian Ocean region?","<b>2022 Q18 (15 marks):<\/b> Explain the causes and effects of coastal erosion in India. What are the available coastal management techniques for combating the hazard ?","<b>2017 Q17 (15 marks):<\/b> ‘Climate Change’ is a global problem. How India will be affected by climate change? How Himalayan and coastal states of India will be affected by climate change?"]},{"id":"international-court-of-justice","subj":"s02","name":"International Court of Justice","cards":[{"path":[],"roles":["def","use"],"rows":[{"t":"ICJ case: The International Court of Justice (ICJ), in a landmark advisory opinion “Obligations of States in respect of Climate Change” led by Pacific Island law students (2019); led by Vanuatu, issued on 23 July 2025, declared that nations have a legal obligation under international law—including treaties and customary norms—to curb greenhouse gas emissions and avoid environmental harm.","h":"<b>Definition & India's status<\/b>:"},{"t":"Failing to meet these duties may be deemed an internationally wrongful act, opening the door for reparations such as compensation, restoration, or guarantees against future harm.","cont":1},{"t":"first world-court opinion on climate duties → backs <mark>climate litigation<\/mark> and loss-and-damage claims","h":"<b>Significance<\/b>:"}],"id":"international-court-of-justice:def-main","v":"feafda","q":"What did the ICJ&#x27;s 2025 climate opinion say, and why does it matter?"},{"path":[],"roles":["eg","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Vanuatu-led UNGA request (Mar 2023, by consensus) → ICJ opinion Jul 2025<\/span><br><span class=\"li\"><mark>ITLOS<\/mark> advisory opinion (May 2024: GHG emissions = marine pollution under UNCLOS)<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">at the ICJ hearings (Dec 2024) India argued <mark>CBDR<\/mark><\/span><br><span class=\"li\">equity<\/span><br><span class=\"li\">historical emissions of the North → court should not add new duties beyond UNFCCC/Paris<\/span><\/span>","h":"<b>India's response<\/b>:"}],"id":"international-court-of-justice:eg-main","v":"bff360","q":"What led to the ICJ opinion, a related tribunal ruling, and India&#x27;s argument?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">advisory, so not binding<\/span><br><span class=\"li\">no enforcement<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">use it in NDCs and finance talks<\/span><br><span class=\"li\">national courts can rely on it (SC already sees a right against climate change, M.K. Ranjitsinh 2024)<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"international-court-of-justice:issue-main","v":"b98b9b","q":"What are the limits of the ICJ opinion, and how can it still be used?"}],"circle":"y"},{"id":"migration-vulnerable-nations","subj":"s02","name":"Migration & Vulnerable Nations","cards":[{"path":[],"roles":["def","eg","gov"],"rows":[{"t":"Panama became the first country to migrate because of climate related effects.","h":"<b>Definition & India's status<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Ghoramara island, Sundarbans (failed: about half the island lost to erosion → people moved to Sagar island)<\/span><br><span class=\"li\">Tuvalu–Australia <mark>Falepili Union<\/mark> (2023, worked: climate visas for Tuvaluans)<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">no law for <mark>climate migrants<\/mark> yet<\/span><br><span class=\"li\">resettlement left to states<\/span><br><span class=\"li\">HADR to neighbours (Bangladesh, Maldives, Sri Lanka)<\/span><\/span>","h":"<b>India's response<\/b>:"}],"id":"migration-vulnerable-nations:def-main","v":"6262e6","q":"Climate migration: the first case, two examples, and India&#x27;s response?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"Most disproportionately affected are small island developing nations (SIDS); had access to only 1 billion out of 100 billion pledged, lost $153 Billion.","h":"<b>Challenges<\/b>:"},{"t":"Solutions: Flood barriers (eg. Oyster beds), <mark>storm surge<\/mark> modelling and planning, and build flood resistant cities like in South Korea.","h":"<b>Way forward<\/b>:"}],"id":"migration-vulnerable-nations:issue-main","v":"9cea26","q":"Why are small island states hit hardest, and what solutions exist?"}],"circle":"y"},{"id":"antarctic-ozone","subj":"s02","name":"Antarctic & OZONE","cards":[{"path":[],"roles":["def"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Ozone: good in the stratosphere (blocks UV), a pollutant at ground level<\/span><br><span class=\"li\">ODS (CFCs, HCFCs) release chlorine/bromine that breaks ozone → Antarctic hole (Aug–Nov, polar vortex)<\/span><\/span>","h":"<b>Definition & India's status<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">2040 world<\/span><br><span class=\"li\">2045 Arctic<\/span><br><span class=\"li\">2066 Antarctic<\/span><\/span>","h":"Recovery to 1980 levels:"},{"t":"Treaties: Vienna Convention 1985 (first to name the problem) → <mark>Montreal Protocol<\/mark> 1987 (universal, ODS cut >98%) → <mark>Kigali Amendment<\/mark> 2016 (HFCs: not ozone-depleting but strong GHG, cut 80–85% by late 2040s)","h":"<b>Pillars / key features<\/b>:"},{"t":"Antarctica treaty (area south of 60 degree) (use Antarctica only for exploration)"}],"id":"antarctic-ozone:def-main","v":"8fefac","q":"How does ozone get depleted, when will it recover, and which treaties cover ozone and Antarctica?"},{"path":[],"roles":["eg","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Montreal Protocol (worked: ozone layer on track to recover, UNEP–WMO 2023)<\/span><br><span class=\"li\">India phased out HCFC-141b in foam making by 1 Jan 2020 (among the first developing countries)<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">India: CFCs, CTC, halons out by 2010<\/span><br><span class=\"li\">ODS Rules 2000<\/span><br><span class=\"li\">HCFC −67.5%<\/span><br><span class=\"li\">HFC phase-down 10% (2032) → 20% (2037) → 30% (2042) → 85% (2047)<\/span><br><span class=\"li\">no new HFC plant clearances beyond 2027<\/span><\/span>","h":"<b>India's response<\/b>:"},{"t":"(India operates Antarctic research stations—Dakshin Gangotri (1st), Maitri, and Bharati—and plans Maitri-II, reaffirming its commitment through the Indian Antarctic Act, 2022.)","cont":1}],"id":"antarctic-ozone:eg-main","v":"0b8200","q":"Proof the Montreal Protocol works, and India&#x27;s ozone and Antarctic record?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">HFC demand rising with ACs<\/span><br><span class=\"li\">rogue CFC-11 emissions found in 2018 (eastern China)<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\"><mark>India Cooling Action Plan<\/mark> (2019: cooling demand −20–25% by 2037–38)<\/span><br><span class=\"li\">climate-friendly refrigerants<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"antarctic-ozone:issue-main","v":"fcc8e8","q":"What still threatens the ozone layer, and the way forward?"}],"circle":"y"},{"id":"impacts-ipcc-draft-report","subj":"s02","name":"Impacts – IPCC Draft Report","cards":[{"path":[],"roles":["def","eg"],"rows":[{"t":"what warming is already doing to species, oceans, forests, health, gender, migration, farming and schooling (toggles below)","h":"<b>Definition & India's status<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Pakistan floods 2022 (1,700+ deaths, 8 million displaced)<\/span><br><span class=\"li\">Punjab excess rain Jul 2023 → paddy transplanting delayed (more in toggles)<\/span><\/span>","h":"<b>Examples<\/b>:"}],"id":"impacts-ipcc-draft-report:def-main","v":"f59717","q":"What does the IPCC impacts report cover, with two examples?"},{"path":[],"roles":["gov","issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">NAPCC (9 missions)<\/span><br><span class=\"li\"><mark>State Action Plans on Climate Change<\/mark><\/span><br><span class=\"li\">heat action plans<\/span><br><span class=\"li\">climate-resilient crop varieties (ICAR)<\/span><br><span class=\"li\">health mission on climate (NPCCHH)<\/span><\/span>","h":"<b>India's response<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\"><mark>adaptation gap<\/mark>: finance far below need<\/span><br><span class=\"li\">many ecosystems near the limits of adaptation<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">National Adaptation Plan<\/span><br><span class=\"li\">locally led adaptation<\/span><br><span class=\"li\">early warnings for all<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"impacts-ipcc-draft-report:gov-main","v":"b43312","q":"India&#x27;s adaptation tools, the adaptation gap, and the way forward?"},{"path":["Species"],"roles":["effect"],"rows":[{"t":"Extinction rates a thousand times higher than before the Anthropocene"},{"t":"at 2–3°C up to 54% of land and sea species threatened this century","cont":1},{"t":"freshwater fish: local biodiversity down up to 75% by 2°C","cont":1},{"t":"turtles: upper-range sea-level rise → 59% loss of green turtles’ Mediterranean nesting area, loggerhead 67%","cont":1}],"id":"impacts-ipcc-draft-report:effect-species","v":"24b30a","q":"What will warming do to species? Four findings with figures."},{"path":["Oceans"],"roles":["effect"],"rows":[{"t":"70–90% die at 1.5°C","h":"Coral reefs:"},{"t":"marine heatwaves at least 34% more frequent and 17% longer since 1925","cont":1},{"t":"Arctic summer sea ice down 25% (~2 million sq km) since late 1970s","cont":1}],"id":"impacts-ipcc-draft-report:effect-oceans","v":"a25196","q":"What will warming do to oceans: reefs, heatwaves, sea ice?"},{"path":["Systems"],"roles":["effect"],"rows":[{"t":"at 2°C, 15% lost by 2100, releasing 36–67 billion tonnes of carbon","h":"Permafrost:"},{"t":"many terrestrial, freshwater, ocean and coastal ecosystems already “near or beyond” their adaptive capacity","cont":1}],"id":"impacts-ipcc-draft-report:effect-systems","v":"dc328f","q":"What will warming do to permafrost and ecosystems?"},{"path":["Forests"],"roles":["effect"],"rows":[{"t":"Fire seasons extended, potential burnable area doubled"},{"t":"at 2°C severe drought in Brazil’s natural areas could quadruple","cont":1},{"t":"Arctic tundra burned area up ninefold (1996–2015)","cont":1},{"t":"high emissions, drought and wildfire could turn half the Amazon into grassland","cont":1}],"id":"impacts-ipcc-draft-report:effect-forests","v":"562b3c","q":"What will warming do to forests and fire? Four findings."},{"path":["Human Health"],"roles":["effect"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Extreme heat, storms, floods → heat illness, injuries, waterborne diseases, mental health (elderly, children, pregnant women, chronically ill, low-income worst hit)<\/span><br><span class=\"li\">longer pollen seasons, more air pollution and wildfire smoke → asthma<\/span><br><span class=\"li\">pest-borne diseases spread (Lyme, Zika, West Nile)<\/span><\/span>"},{"t":"<span class=\"lst\"><span class=\"li\">additional 250,000 deaths per year (2030–2050)<\/span><br><span class=\"li\">deaths due to non communicable diseases, 85% of it by CC (COP29 spl report)<\/span><\/span>","h":"WHO:"},{"t":"<span class=\"lst\"><span class=\"li\"><mark>Belém Health Action Plan<\/mark> = first health adaptation plan ($300 mn)<\/span><br><span class=\"li\">~5 lakh heat deaths a year<\/span><br><span class=\"li\">1 in 12 hospitals at risk of climate shutdown → early warnings<\/span><br><span class=\"li\">trained health workers<\/span><br><span class=\"li\">resilient hospitals<\/span><\/span>","h":"COP30:"}],"id":"impacts-ipcc-draft-report:effect-human-health","v":"5db0f4","q":"How does climate change hurt health, how many deaths, and what did COP30 do?"},{"path":["Gender-Based Violence"],"roles":["effect","eg"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">each 1°C rise → 4.7% more intimate partner violence (IPV)<\/span><br><span class=\"li\">femicide up 28% during heatwaves (reasons: extreme weather, displacement, food insecurity, economic instability)<\/span><br><span class=\"li\">women environmental defenders in Guatemala, Philippines face evictions and threats<\/span><\/span>","h":"UN Spotlight Initiative (2025):"},{"t":"<span class=\"lst\"><span class=\"li\">Mozambique mobile health clinics<\/span><br><span class=\"li\">Haiti & Vanuatu train midwives for green jobs and embed GBV services in climate response<\/span><\/span>","h":"Successful examples:"}],"id":"impacts-ipcc-draft-report:effect-gender-based-violence","v":"56d645","q":"How does heat raise violence against women, and what has worked?"},{"path":["Displacement"],"roles":["effect"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">over 216 million could be displaced within their countries by 2050<\/span><br><span class=\"li\">Pakistan 2022 floods (1,700+ deaths, 8 million displaced)<\/span><br><span class=\"li\">Bangladesh 1.5 million (2022)<\/span><br><span class=\"li\">Brazil 700,000 (2022)<\/span><br><span class=\"li\">Colombia 281,000<\/span><\/span>","h":"World Migration Report 2024 (UN):"},{"t":"<span class=\"lst\"><span class=\"li\">floods and droughts push farm households into debt cycles<\/span><br><span class=\"li\">tribals hit hardest<\/span><br><span class=\"li\">1 unit more services in GSDP → ~1.9% lower poverty odds (NISER)<\/span><\/span>","h":"Poverty:"}],"id":"impacts-ipcc-draft-report:effect-displacement","v":"20b783","q":"How many could climate displace, with country figures, and how does it deepen poverty?"},{"path":["Agriculture"],"roles":["effect","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Coffee shifting from Wayanad to higher altitudes (heat stress)<\/span><br><span class=\"li\">rice = 8–12% of global methane<\/span><br><span class=\"li\">Punjab excess rain July 2023 → delayed paddy transplantation, yield loss<\/span><\/span>"},{"t":"<span class=\"lst\"><span class=\"li\">Non-irrigated area → farmer incomes drop 17–18% (eco survey)<\/span><br><span class=\"li\">by 2050 rice yields −10–15%, wheat −20% unless adaptation<\/span><br><span class=\"li\">hurdles: cost, small land in adopting climate-resistant agriculture<\/span><\/span>"},{"t":"<span class=\"lst\"><span class=\"li\">CC can cut yields 4.5–9% (~1.5% of GDP a year)<\/span><br><span class=\"li\">half of sown area rainfed<\/span><\/span>","h":"Climate-resilient agriculture:"},{"t":"<span class=\"lst\"><span class=\"li\">India: <mark>NICRA<\/mark> (ACASA atlas)<\/span><br><span class=\"li\">NMSA<\/span><br><span class=\"li\">PKVY<\/span><\/span>","cont":1},{"t":"<span class=\"lst\"><span class=\"li\">Soil Health Card → way forward: heat-tolerant seeds (wheat DBW-187, rice CR Dhan)<\/span><br><span class=\"li\">climate-resilient villages nationwide<\/span><br><span class=\"li\">one nodal agency<\/span><\/span>","cont":1}],"id":"impacts-ipcc-draft-report:effect-agriculture","v":"a5d0a0","q":"How is climate change hitting Indian farming, and what makes agriculture resilient?"},{"path":["Education"],"roles":["effect"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Schools closed 75% of the time due to extreme heat<\/span><br><span class=\"li\">1 degree rise → lower test scores<\/span><br><span class=\"li\">4 mil girls can’t complete education (low and middle income countries)<\/span><br><span class=\"li\">rainfall shocks hurt vocab at age 5 and math at age 15 (UNESCO) → Solutions: Indonesia’s INARISK<\/span><br><span class=\"li\">Rwanda’s flood- and landslide-safe schools<\/span><\/span>"}],"id":"impacts-ipcc-draft-report:effect-education","v":"dcaa8c","q":"How does heat and rain disrupt schooling, and what solutions exist?"}],"circle":"y"},{"id":"india-specific-legislations","subj":"s02","name":"India-Specific Legislations","cards":[{"path":[],"roles":["fact","how"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Carbon pricing instruments 5 (2005) → 80 now, covering about 29% of world GHG<\/span><br><span class=\"li\">USD 107 bn revenue (2025) (World Bank)<\/span><\/span>"},{"t":"<span class=\"lst\"><span class=\"li\">6.2 country-to-country trades<\/span><br><span class=\"li\">6.4 UN-run market (replaces Kyoto's CDM)<\/span><br><span class=\"li\">6.8 non-market cooperation<\/span><\/span>","h":"<mark>Article 6<\/mark> (rules finished at COP29):"},{"t":"<span class=\"lst\"><span class=\"li\">carbon colonialism<\/span><br><span class=\"li\">weak MRV<\/span><br><span class=\"li\"><mark>greenwashing<\/mark> → fix: Core Carbon Principles<\/span><br><span class=\"li\">third-party verification<\/span><br><span class=\"li\">blockchain tracking<\/span><\/span>","h":"Issues:"}],"id":"india-specific-legislations:fact-main","v":"d2188a","q":"Carbon pricing worldwide, Article 6&#x27;s three routes, and the problems with carbon markets?"},{"path":[],"roles":["gov"],"rows":[{"t":"The Carbon Credit Trading Scheme (<mark>CCTS<\/mark>), 2023 sets yearly GHG emission intensity targets for 9 big polluting sectors. If companies exceed limits, they must buy carbon credits from the Indian Carbon Market or face fines. Others outside these sectors can voluntarily run green projects to earn and sell credits."},{"t":"<span class=\"lst\"><span class=\"li\">The GEI Target Rules, 2025 fix sector-specific limits on GHG emissions per unit of production for 4 high-energy sectors—aluminium, cement, chlor-alkali, and pulp & paper. Companies must meet these yearly targets or buy carbon credits; non-compliance attracts fines under the Environment Protection Act, 1986. → 2025: 4 more sectors (refinery, petrochemicals, textiles, secondary aluminium) → 208 units must cut 3–7% by 2026–27<\/span><br><span class=\"li\">penalty = 2x credit price (CPCB enforces)<\/span><\/span>"}],"id":"india-specific-legislations:gov-main","v":"46b02b","q":"How do the CCTS and the GEI Target Rules work?"},{"path":[],"roles":["gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">The Green Credit Programme (GCP), 2023 is a voluntary market scheme that rewards eco-friendly actions like tree planting, sustainable farming, waste management, and air pollution reduction. Credits earned can be traded domestically and used in ESG disclosures, with the Indian Council of Forestry Research and Education (ICFRE) managing the programme. Under EPA,1986. → new rule: credit only after 5 years<\/span><br><span class=\"li\">40% canopy (1 credit = 1 tree) → concerns: buy credits instead of restoring<\/span><br><span class=\"li\">uses existing degraded forest, no new forest<\/span><br><span class=\"li\">weak survival checks<\/span><\/span>"}],"id":"india-specific-legislations:gov-main-2","v":"a96a12","q":"What is the Green Credit Programme, and what are its concerns?"},{"path":[],"roles":["gov"],"rows":[{"t":"The Perform, Achieve and Trade (PAT) Scheme is basically an energy-saving game for big industries (launched 2012 by BEE under NMEEE, which, if you recall our timeline, is one of the 8 original missions of NAPCC 2008, now 9 with Health) → reduces Specific Energy Consumption (SEC) of Designated Consumers (iron & steel, cement, fertilizers, thermal power plants)"},{"t":"The genius of the PAT scheme is that it doesn't just mandate cuts; it creates a profitable market for energy efficiency → Perform (target over a 3-year cycle) → Achieve (audit) → Trade: over-achievers earn Energy Saving Certificates (ESCerts), under-achievers buy ESCerts on the Indian Energy Exchange (IEX) or face heavy penalties"}],"id":"india-specific-legislations:gov-main-3","v":"2f4cee","q":"How does the PAT scheme work?"},{"path":[],"roles":["gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">National green hydrogen mission.<\/span><br><span class=\"li\">Green steel.<\/span><\/span>"},{"t":"SVAGRIHA is an Indian green building rating system by IGBC (Indian Green Building Council) that promotes sustainable and eco-friendly construction for small residential projects."},{"t":"India has started its first cluster of five Carbon Capture and Utilisation (CCU) testbeds for the cement sector, using a Public-Private Partnership (PPP)."}],"id":"india-specific-legislations:gov-main-4","v":"dced09","q":"Four other green initiatives in India&#x27;s climate toolkit?"},{"path":[],"roles":["gov","fix"],"rows":[{"t":"Global methane pledge but in India national mission on sustainable agriculture and direct seeded rice.","h":"To reduce methane:"},{"t":"<span class=\"lst\"><span class=\"li\"><mark>84x<\/mark> CO₂ over 20 years, lives ~12 years<\/span><br><span class=\"li\">sources: livestock, rice, coal mines, gas leaks, landfills<\/span><br><span class=\"li\">India = 3rd biggest emitter, not in the Global Methane Pledge (−30% by 2030)<\/span><\/span>","h":"Methane:"},{"t":"<span class=\"lst\"><span class=\"li\">ISRO found landfill hotspots (Pirana, Deonar, Ghazipur) → fix: waste segregation<\/span><br><span class=\"li\">bio-CNG (GOBARdhan)<\/span><br><span class=\"li\">scientific landfills<\/span><br><span class=\"li\">bio-covers<\/span><\/span>","cont":1}],"title":"To reduce methane:","id":"india-specific-legislations:gov-to-reduce-methane","v":"8ddd84","q":"Why does methane matter, where does India&#x27;s come from, and how do we cut it?"},{"path":[],"roles":["gov"],"rows":[{"sec":"Here’s a concise 2-line summary of the types of greenwashing companies use:"},{"t":"The Central Consumer Protection Authority (CCPA) has issued 2024 guidelines (“Prevention and Regulation of Greenwashing and Misleading Environmental Claims, 2024’.”) to prevent greenwashing by ensuring environmental claims in advertisements are truthful, clear, and fully disclosed."},{"t":"This regulation aims to protect consumers from misleading claims, maintain public trust, and promote genuine sustainable practices. Companies engage in various greenwashing tactics like hiding true sustainability efforts (greenhushing), misleading with false labels (greenlabeling), shifting blame to consumers (greenshifting), or downplaying actions by hiding in groups (greencrowding) to appear environmentally friendly without real impact.","cont":1},{"t":"They also change targets frequently (greenrinsing) or highlight small green features to distract from harmful practices (greenlighting).","cont":1}],"id":"india-specific-legislations:gov-main-5","v":"41f74a","q":"What are the CCPA&#x27;s greenwashing guidelines, and the types of greenwashing?"}],"circle":"g","pyq":["<b>2014 Q13 (12.5 marks):<\/b> Should the pursuit of carbon credits and clean development mechanisms set up under UNFCCC be maintained even though there has been a massive slide in the value of a carbon credit? Discuss with respect to India’s energy needs for economic growth."]},{"id":"cop-3-kyoto-protocol","subj":"s02","name":"COP 3 (KYOTO PROTOCOL)","cards":[{"path":[],"roles":["def"],"rows":[{"sec":"<b>🌍 Global Architecture & Outcomes<\/b>"},{"t":"Transitioned global climate action from voluntary pledges to binding emission cuts, placing the burden exclusively on industrialized nations (Annex I) based on their historical emissions.","h":"Legally Binding Targets:"},{"t":"Introduced foundational carbon market tools: the Clean Development Mechanism (CDM), Joint Implementation (JI), and International Emissions Trading.","h":"Flexible Market Mechanisms:"}],"id":"cop-3-kyoto-protocol:def-main","v":"d4b319","q":"What did the Kyoto Protocol establish globally?"},{"path":[],"roles":["gov"],"rows":[{"sec":"<b>🇮🇳 India’s Strategic Stance & Gains<\/b>"},{"t":"As a developing nation (Non-Annex I), India successfully negotiated an exemption from binding targets, arguing that poverty alleviation and economic growth were its overriding priorities.","h":"Defending Developmental Space:"},{"t":"India strongly backed the protocol because it legally codified the principle of <mark>Common But Differentiated Responsibilities<\/mark> (CBDR), ensuring the Global North took the lead.","h":"Championing <mark>CBDR<\/mark>:"},{"t":"Rather than just opting out, India proactively utilized the CDM to attract foreign direct investment and technology transfer. By selling carbon credits (Certified Emission Reductions), India became one of the world's largest beneficiaries, which helped kickstart its early domestic renewable energy projects.","h":"Capitalizing on the CDM:"}],"id":"cop-3-kyoto-protocol:gov-main","v":"341eb0","q":"What was India&#x27;s stance at Kyoto, and how did India gain?"},{"path":[],"roles":["pic"],"rows":[{"sec":"<b>UNDESTANDING KYOTO<\/b>"},{"img":0},{"img":1},{"img":2},{"img":3},{"img":4}],"id":"cop-3-kyoto-protocol:pic-main","v":"90318d","q":"Kyoto in diagrams: Annexes, why only developed countries, flexible mechanisms, CDM?"}],"circle":"g","pyq":["<b>2022 Q17 (15 marks):<\/b> Discuss global warming and mention its effects on the global climate. Explain the control measures to bring down the level of greenhouse gases which cause global warming, in the light of the Kyoto Protocol, 1997.","<b>2014 Q13 (12.5 marks):<\/b> Should the pursuit of carbon credits and clean development mechanisms set up under UNFCCC be maintained even though there has been a massive slide in the value of a carbon credit? Discuss with respect to India’s energy needs for economic growth."]},{"id":"cop-15-copenhagen-2009","subj":"s02","name":"COP 15 (COPENHAGEN) (2009)","cards":[{"path":[],"roles":["def","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Copenhagen Accord = 11th-hour compromise shaped by BASIC (Brazil, South Africa, India, China) negotiating with the US<\/span><br><span class=\"li\">The 2°C Consensus (first formal recognition)<\/span><br><span class=\"li\">Voluntary Pledges (NAMAs): shift from Kyoto’s top-down mandates to bottom-up<\/span><\/span>","h":"Political Accord, Not a Treaty:"},{"t":"<span class=\"lst\"><span class=\"li\">\"Constructive Engagement\" pivot, shed the \"deal-breaker\" image by anchoring BASIC<\/span><br><span class=\"li\">voluntarily pledged emissions intensity −20–25% by 2020 (vs 2005), agriculture excluded for food security<\/span><br><span class=\"li\">MRV win: domestically funded actions only under \"International Consultation and Analysis\" (ICA), no intrusive audits<\/span><\/span>","h":"🇮🇳 India:"}],"id":"cop-15-copenhagen-2009:def-main","v":"d3681c","q":"What came out of Copenhagen, and how did India&#x27;s stance change there?"}],"circle":"w"},{"id":"cop-17-durban-south-africa-2011","subj":"s02","name":"COP 17 (DURBAN South Africa ) (2011)","cards":[{"path":[],"roles":["def","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">draft a post-2020 universal agreement by 2015 (became Paris)<\/span><br><span class=\"li\">Breaking the \"Firewall\": Kyoto-era Annex I / Non-Annex I split began to end, new deal \"applicable to all Parties\"<\/span><\/span>","h":"The ADP Mandate (Durban Platform):"},{"t":"<span class=\"lst\"><span class=\"li\">The Battle for Equity (no binding cuts ignoring historical emissions)<\/span><br><span class=\"li\">The Vocabulary Victory: \"a protocol, another legal instrument or an agreed outcome with legal force\" → crucial wiggle room: commitments via domestic laws and policies, not an intrusive, punitive international treaty<\/span><\/span>","h":"🇮🇳 India:"}],"id":"cop-17-durban-south-africa-2011:def-main","v":"f86ef3","q":"What did Durban start, and what did India secure there?"}],"circle":"w"},{"id":"cop-21-paris","subj":"s02","name":"COP 21 (PARIS)","cards":[{"path":[],"roles":["def"],"rows":[{"sec":"<b>1. 🌍 Global Architecture & Key Outcomes<\/b>"},{"t":"Replaced Kyoto’s rigid, top-down mandates with a flexible, universal system where every nation submits Nationally Determined Contributions (NDCs) based on their sovereign capacities.","h":"The Bottom-Up Paradigm:"},{"t":"Established a binding global consensus to hold the average temperature increase to \"well below 2°C\" above pre-industrial levels, actively pursuing 1.5°C.","h":"The Temperature Goal:"},{"t":"Instituted a mandatory 5-year ambition cycle, requiring countries to submit increasingly ambitious NDCs over time to prevent backsliding.","h":"The \"<mark>Ratchet Mechanism<\/mark>\":"},{"t":"Created a unified system for a \"<mark>Global Stocktake<\/mark>\" to track progress, while maintaining flexibility for developing nations.","h":"Enhanced Transparency Framework (ETF):"}],"id":"cop-21-paris:def-main","v":"57d55e","q":"Paris Agreement: what changed from Kyoto, the temperature goal, and how ambition is kept up?"},{"path":[],"roles":["def"],"rows":[{"t":"Laid the groundwork to replace Kyoto's Clean Development Mechanism (CDM) with decentralized, cooperative carbon market mechanisms.","h":"<mark>Article 6<\/mark> (New Carbon Markets):"},{"t":"Formally recognized the irreversible impacts of climate change, though developed nations insisted on a strict clause excluding liability or financial compensation.","h":"Article 8 (Loss and Damage):"},{"t":"Retained the sacred principle of Common But Differentiated Responsibilities, but added the crucial phrase \"in the light of different national circumstances,\" signaling that as developing nations grow, their obligations will increase.","h":"Nuanced CBDR-RC:"}],"id":"cop-21-paris:def-main-2","v":"b58fc6","q":"Paris on carbon markets, loss and damage, and CBDR?"},{"path":[],"roles":["gov"],"rows":[{"sec":"<b>🇮🇳 India’s Strategic Stance & First NDCs (2015)<\/b>"},{"t":"India submitted highly ambitious, measurable goals for 2030:","h":"The Three Quantitative Targets:"},{"t":"1. Reduce the emissions intensity of its GDP by 33–35% (from 2005 levels)."},{"t":"2. Achieve 40% cumulative electric power installed capacity from non-fossil fuel energy resources."},{"t":"3. Create an additional carbon sink of 2.5 to 3 billion tonnes of CO2  equivalent through expanded forest and tree cover."}],"id":"cop-21-paris:gov-main","v":"4da2da","q":"India&#x27;s three quantitative NDC targets at Paris (2015)?"},{"path":[],"roles":["gov"],"rows":[{"t":"India masterfully framed the narrative around \"Climate Justice\" rather than \"climate charity,\" emphasizing that developing nations have a fundamental right to poverty eradication and economic growth.","h":"Climate Justice:"},{"t":"India made it clear that achieving its NDC targets was intrinsically linked to the successful delivery of climate finance (the $100B/year promise) and technology transfer from the Global North.","h":"Conditional Commitments:"}],"id":"cop-21-paris:gov-main-2","v":"9a6370","q":"How did India frame its Paris pledges?"},{"path":[],"roles":["gov"],"rows":[{"t":"Transitioning from a protesting nation to a global rule-maker, India, alongside France, launched the International Solar Alliance (ISA) on the sidelines of the summit to accelerate global clean technology deployment.","h":"Global Leadership (The ISA):"},{"t":"<span class=\"lst\"><span class=\"li\">125 members, India re-elected President (2024–26), first inter-governmental body HQ'd in India<\/span><br><span class=\"li\"><mark>Towards 1000<\/mark> ($1 tn solar investment, 1 bn people, 1 bn t CO₂ cut a year by 2030)<\/span><br><span class=\"li\">OSOWOG, STAR-C, SolarX, Global Solar Facility<\/span><br><span class=\"li\">VGF for LDCs/SIDS → \"alternative OPEC\", South-South tool<\/span><\/span>","h":"ISA now (10 years, Mar 2026):"},{"t":"challenges: finance gap, US exit (2026), slow projects in Africa and islands, high tariffs on PV","cont":1}],"title":"Global Leadership (The ISA):","id":"cop-21-paris:gov-global-leadership-the-isa","v":"8c7045","q":"What is the International Solar Alliance, what has it done, and where does it struggle?"}],"circle":"g","pyq":["<b>2025 Q18 (15 marks):<\/b> Write a review on India’s climate commitments under the Paris Agreement (2015) and mention how these have been further strengthened in COP26 (2021). In this direction, how has the first Nationally Determined Contribution intended by India been updated in 2022?"]},{"id":"cop-24-katowice","subj":"s02","name":"COP 24 (KATOWICE)","cards":[{"path":[],"roles":["def","gov"],"rows":[{"t":"The summit adopted the Katowice Climate Package, effectively the \"operating manual\" for the Paris Agreement. It established the Enhanced Transparency Framework (ETF) to standardize how countries report their emissions and progress. 🇮🇳 India’s Stance: India negotiated hard to ensure the rulebook retained the principle of CBDR-RC. It secured \"flexibility\" for developing nations in reporting standards, arguing that the Global South requires financial and technical capacity-building before facing stringent, universal audit mechanisms.","h":"🌍 Global Outcome:"}],"id":"cop-24-katowice:def-main","v":"8288e5","q":"What did Katowice adopt, and what did India secure?"}],"circle":"w"},{"id":"cop-26-glasgow","subj":"s02","name":"COP 26 (GLASGOW)","cards":[{"path":[],"roles":["def"],"rows":[{"t":"COP26 was a critical implementation summit aimed at operationalising the <mark>Paris Agreement<\/mark> and enhancing 2030 ambition. Key outcomes included:"},{"sec":"Finalisation of the Paris Rulebook, particularly:"},{"t":"Operationalising <mark>Article 6<\/mark> carbon markets (including rules to prevent double counting and transition of CDM credits)."},{"t":"Strengthening the Enhanced Transparency Framework."},{"t":"A formal request for countries to revisit and strengthen 2030 NDCs to align with the 1.5°C pathway."},{"t":"For the first time in UNFCCC history, the text explicitly called for the “phase-down of unabated coal power” and reduction of inefficient fossil fuel subsidies."},{"t":"Renewed emphasis on climate finance, though without concrete fulfilment of the $100 billion annual commitment.-"}],"title":"Global Outcome: The Glasgow Climate Pact","id":"cop-26-glasgow:def-global-outcome-the-glasgow-climate-pact","v":"03400a","q":"What were the key outcomes of the Glasgow Climate Pact?"},{"path":[],"roles":["gov"],"rows":[{"t":"COP26 became one of India’s most consequential climate summits since Paris."},{"sec":"1️⃣ The <mark>Panchamrit<\/mark> – India’s Ambition Upgrade"},{"t":"India announced a transformative five-point climate action framework (“Panchamrit”) → see 🟢 Panchamrit heading above"}],"id":"cop-26-glasgow:gov-main","v":"a8f44b","q":"Why was COP26 important for India?"}],"circle":"g","pyq":["<b>2025 Q18 (15 marks):<\/b> Write a review on India’s climate commitments under the Paris Agreement (2015) and mention how these have been further strengthened in COP26 (2021). In this direction, how has the first Nationally Determined Contribution intended by India been updated in 2022?","<b>2021 Q17 (15 marks):<\/b> Describe the major outcomes of the 26th session of the Conference of the Parties (COP) to the United Nations Framework Convention on Climate Change (UNFCCC). What are the commitments made by India in this conference?"]},{"id":"cop-27-sharm-el-sheikh","subj":"s02","name":"COP 27 (SHARM - EL - SHEIKH)","cards":[{"path":[],"roles":["def","eg"],"rows":[{"t":"Sharm el-Sheikh, Egypt, Nov 2022 → the \"implementation COP\"","h":"<b>Definition & India's status<\/b>:"},{"sec":"<b>Pillars / key features<\/b> (Global Architecture & Outcomes)"},{"t":"The crowning achievement. After decades of resistance from the Global North, an agreement was finally reached to establish a dedicated fund to financially compensate vulnerable developing nations suffering from irreversible climate disasters. This was a monumental victory for <mark>climate justice<\/mark> and the G77 bloc.","h":"The <mark>Loss and Damage<\/mark> (L&D) Fund:"},{"t":"The summit shifted the focus from \"pledges\" to \"action,\" demanding accountability and rapid execution of the commitments made at Paris and Glasgow.","h":"Sharm el-Sheikh Implementation Plan:"},{"t":"For the first time, the final text explicitly called for the reform of Multilateral Development Banks (like the World Bank) to scale up climate finance and reduce the debt burden on developing nations.","h":"Call for MDB Reform:"},{"t":"<span class=\"lst\"><span class=\"li\">Pakistan floods 2022 (~$30 bn loss) → the push that won the <mark>L&D fund<\/mark><\/span><br><span class=\"li\">Egypt's \"implementation COP\" still left the fund empty till COP28<\/span><\/span>","h":"<b>Examples<\/b>:"}],"id":"cop-27-sharm-el-sheikh:def-main","v":"5e3731","q":"COP27: what was its crowning achievement, the other outcomes, and examples?"},{"path":[],"roles":["gov"],"rows":[{"sec":"<b>India's response<\/b> (India’s Strategic Stance & Diplomatic Gains)"},{"t":"This is a crucial exam point. When developed nations heavily pressured India to phase out coal, India launched a brilliant diplomatic counter-offensive. India formally proposed that the final text should call for a phase-down of all fossil fuels (including the natural gas and oil heavily relied upon by the West), not just coal. This exposed the hypocrisy of the developed world and successfully defended India’s baseload energy security.","h":"The \"All Fossil Fuels\" Gambit:"},{"t":"India successfully embedded the \"Lifestyle for Environment\" (LiFE) movement into the preamble of the Sharm el-Sheikh Implementation Plan.","h":"Mainstreaming <mark>Mission LiFE<\/mark>:"},{"t":"This was a strategic narrative shift. By focusing on mindful, sustainable consumption, India shifted a portion of the climate burden away from just \"production emissions\" (which developing nations need for growth) and pointed it at the unsustainable per-capita consumption patterns of the developed world.","h":"Analytical Point:"}],"id":"cop-27-sharm-el-sheikh:gov-main","v":"e2649e","q":"India&#x27;s two big moves at COP27, and why they mattered?","read":1},{"path":[],"roles":["gov"],"rows":[{"t":"India officially submitted its Long-Term Low Emission Development Strategy. If Glasgow (COP26) was the announcement of Net-Zero by 2070, the LT-LEDS was the roadmap. It provided a comprehensive, multi-sectoral strategy focusing on:","h":"Submission of the LT-LEDS:"},{"t":"<span class=\"lst\"><span class=\"li\">Rapid expansion of green hydrogen and nuclear power.<\/span><br><span class=\"li\">20% ethanol blending in petrol.<\/span><br><span class=\"li\">A deliberate emphasis that this transition is fundamentally conditional on the Global North providing trillions in climate finance and technology transfer.<\/span><\/span>"}],"title":"Submission of the LT-LEDS:","id":"cop-27-sharm-el-sheikh:gov-submission-of-the-lt-leds","v":"780707","q":"What is India&#x27;s LT-LEDS, and what does it focus on?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">L&D fund set up with no money at first<\/span><br><span class=\"li\">no new mitigation ambition (no phase-down of all fossil fuels in the text)<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">fill the <mark>L&D fund<\/mark><\/span><br><span class=\"li\">MDB reform<\/span><br><span class=\"li\">finance and tech for the South<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"cop-27-sharm-el-sheikh:issue-main","v":"8c2058","q":"Where did COP27 fall short, and what next?"}],"circle":"y"},{"id":"cop-28-dubai","subj":"s02","name":"COP 28 (D
