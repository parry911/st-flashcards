nergy-transition-index-2024:fact-main","v":"4c58bc","q":"India&#x27;s rank in the WEF Energy Transition Index, why it needs the transition, and the hurdles?"}],"circle":"w"},{"id":"pradhan-mantri-khanij-kshetra-kalyan-yoj","subj":"s04","name":"Pradhan Mantri Khanij Kshetra Kalyan Yojana (PMKKKY)","cards":[{"path":[],"roles":["def"],"rows":[{"t":"Basic idea : Mining damages local areas. So the government created PMKKKY to use money from mining companies to improve the lives of people living near mines.","h":"<b>Definition & India's status<\/b>:"},{"t":"Mining companies contribute 10% or 30% of royalty to DMFs"},{"t":"≥70% funds for high-priority sectors (health, water, education, women/child welfare)"},{"t":"≤30% funds for other sectors"},{"t":"70% spending in directly affected areas"},{"t":"Endowment fund (≤10% receipts) for post-mining livelihoods"},{"t":"All transfers via DBT"}],"title":"<b>Pillars / key features<\/b>: Funds:","id":"pradhan-mantri-khanij-kshetra-kalyan-yoj:def-pillars-key-features-funds","v":"79b539","q":"What is PMKKKY&#x27;s basic idea, and how are DMF funds raised and split?"},{"path":[],"roles":["how"],"rows":[{"t":"Implement welfare & development in mining-affected areas"},{"t":"Mitigate environmental/health/socio-economic impacts"},{"t":"Maintain affected area/person list"},{"t":"Prepare baseline survey, 5-year perspective & annual plans"},{"t":"Converge with state/central schemes & SDGs"},{"t":"PMUs for collections >₹50 crore; yearly audit & grievance redressal"}],"title":"Function:","id":"pradhan-mantri-khanij-kshetra-kalyan-yoj:how-function","v":"473b7a","q":"What are the functions of a District Mineral Foundation?"},{"path":[],"roles":["how"],"rows":[{"t":"DMF (non-profit trust under MMDR Act) set up by State Govt"},{"t":"Chaired by District Magistrate/Collector"},{"t":"<mark>Gram Sabha<\/mark> identifies beneficiaries"},{"t":"State Govt defines affected area radius & manages endowment investments"},{"t":"Executing agencies implement projects via DBT"}],"title":"Functionaries:","id":"pradhan-mantri-khanij-kshetra-kalyan-yoj:how-functionaries","v":"ce0cd3","q":"Who runs the DMF and who picks beneficiaries?"},{"path":[],"roles":["use","eg","gov"],"rows":[{"t":"mining money goes back to the people who bear its harm (<mark>benefit-sharing<\/mark>)","h":"<b>Significance<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Keonjhar, Odisha (mixed: one of the biggest <mark>DMF<\/mark> funds, but spending skewed to roads and buildings over health and nutrition: CSE)<\/span><br><span class=\"li\">Dantewada, Chhattisgarh (worked: DMF money for education and livelihoods in mining-hit villages)<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"revised PMKKKY guidelines, 2024 (high-priority share raised to 70%)","h":"<b>India's response<\/b>:"}],"id":"pradhan-mantri-khanij-kshetra-kalyan-yoj:use-main","v":"e85763","q":"Why does PMKKKY matter, two district examples, and the 2024 change?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">large unspent balances<\/span><br><span class=\"li\">Collector-run trusts, little Gram Sabha say<\/span><br><span class=\"li\">spending on buildings over health<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">real Gram Sabha role<\/span><br><span class=\"li\"><mark>social audits<\/mark><\/span><br><span class=\"li\">spend on health, nutrition and livelihoods<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"pradhan-mantri-khanij-kshetra-kalyan-yoj:issue-main","v":"9819f9","q":"Where does PMKKKY go wrong, and how should it be fixed?"}],"circle":"y"},{"id":"nuclear-energy-mission-budget-2025-26","subj":"s04","name":"Nuclear Energy Mission (Budget 2025-26)","cards":[{"path":[],"roles":["fact"],"rows":[{"t":"100 GW capacity by 2047"},{"t":"8.18 GW (Jan 2025)","h":"Current capacity:"},{"t":"22.48 GW by 2031-32, including ≥5 Small Modular Reactors (SMRs) by 2033","h":"Plans:"}],"title":"Target & Roadmap:","id":"nuclear-energy-mission-budget-2025-26:fact-target-roadmap","v":"33091d","q":"The Nuclear Energy Mission&#x27;s target, current capacity and plans?"},{"path":[],"roles":["gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Proposed amendments to Atomic Energy Act, 1962 and Civil Liability for Nuclear Damage Act, 2010 for private sector participation<\/span><br><span class=\"li\">SHANTI ACT<\/span><\/span>"},{"t":"Development of <mark>Bharat Small Reactors<\/mark> (BSRs) and SMRs using indigenous technology"},{"t":"Repurposing retiring coal plants"}],"title":"Private & Indigenous Push:","id":"nuclear-energy-mission-budget-2025-26:gov-private-indigenous-push","v":"1eca84","q":"How is India opening nuclear to private players and indigenous reactors?"},{"path":[],"roles":["use","issue","eg"],"rows":[{"t":"Large thorium reserves, low pollution, minimal land use, continuous power supply"},{"t":"Uranium extraction depends on sulphuric acid; projected shortfall 100–320 million tonnes by 2040"},{"t":"<span class=\"lst\"><span class=\"li\">Kudankulam, Tamil Nadu (worked: India's largest nuclear plant, Russian VVERs)<\/span><br><span class=\"li\">Jaitapur, Maharashtra (failed: planned since 2010, stuck on <mark>nuclear liability<\/mark> law, cost and local protests)<\/span><\/span>","h":"<b>Examples<\/b>:"}],"title":"Key Relevance & Challenge:","id":"nuclear-energy-mission-budget-2025-26:use-key-relevance-challenge","v":"317c7b","q":"Why nuclear suits India, its fuel problem, and one success and one stuck project?"}],"circle":"g","pyq":["<b>2025 Q5 (10 marks):<\/b> The fusion energy programme in India has steadily evolved over the past few decades. Mention India’s contributions to the international fusion energy project – International Thermonuclear Experimental Reactor (ITER). What will be the implications of the success of this project for the future of global energy?","<b>2018 Q16 (15 marks):<\/b> With growing energy needs should India keep on expanding its nuclear energy programme? Discuss the facts and fears associated with nuclear energy.","<b>2017 Q16 (15 marks):<\/b> Give an account of the growth and development of nuclear science and technology in India. What is the advantage of fast breeder reactor programme in India?"]},{"id":"hydrogen","subj":"s04","name":"Hydrogen","cards":[{"path":[],"roles":["def"],"rows":[{"t":"Current production: 6.5 million metric tonnes/year","h":"<b>Definition & India's status<\/b>:"},{"t":"3× gasoline","h":"Energy density:"},{"t":"Green hydrogen : Green Hydrogen is produced by electrolysis of water using renewable energy, making it a zero-carbon fuel. It is considered a strategic component of India’s clean energy transition to achieve <mark>net-zero<\/mark> targets, decarbonize hard-to-abate sectors (steel, cement, ammonia), and enhance energy security.","h":"<b>Pillars / key features<\/b> (types):"}],"id":"hydrogen:def-main","v":"aafd4c","q":"India&#x27;s hydrogen production, its energy density, and what green hydrogen is?"},{"path":[],"roles":["def"],"rows":[{"t":"Like the highly polluting \"Grey Hydrogen,\" Blue Hydrogen is extracted from natural gas using a process called Steam Methane Reforming (SMR). However, the crucial difference is that the carbon dioxide emitted during the process is captured and stored underground using Carbon Capture, Utilization, and Storage (CCUS)technology.","h":"What it is:"},{"t":"Why it's on the rise: It is currently much cheaper to produce than Green Hydrogen and allows countries to utilize existing natural gas infrastructure while still lowering emissions. 🇮🇳 India’s Initiatives","cont":1},{"t":"NITI Aayog has released a comprehensive CCUS policy framework. Without CCUS, Blue Hydrogen cannot exist.","h":"CCUS Policy Framework:"},{"t":"State-owned giants like ONGC and Indian Oil Corporation (IOCL) are actively investing in CCUS technologies to retrofit their existing refineries, effectively preparing to transition their captive grey hydrogen production into blue hydrogen.","h":"PSU Action:"}],"title":"Blue hydrogen : Blue Hydrogen: The \"Bridge\" Fuel","id":"hydrogen:def-blue-hydrogen-blue-hydrogen-the-bridge-f","v":"1e0665","q":"How is blue hydrogen made, and what does India need for it?","read":1},{"path":[],"roles":["def"],"rows":[{"t":"Pink hydrogen is produced through the exact same process as Green Hydrogen (electrolysis of water), but the electricity comes from nuclear power plants instead of solar or wind. Why it's on the rise: Nuclear power provides 24/7, uninterrupted baseload electricity. Solar and wind are intermittent (the sun sets, the wind stops), which makes running electrolysers inefficient. Pink hydrogen solves this intermittency problem.","h":"What it is:"},{"sec":"India’s Initiatives:"},{"t":"The Bhabha Atomic Research Centre (BARC) is actively researching High-Temperature Steam Electrolysis (HTSE).","h":"BARC R&D:"},{"t":"With India planning to massively scale up its nuclear capacity (including Small Modular Reactors - SMRs), the Department of Atomic Energy (DAE) is exploring the co-location of hydrogen production facilities with future nuclear plants to produce clean Pink Hydrogen at scale.","h":"Future Integration:"}],"title":"Pink (or Red) Hydrogen: The Nuclear Option","id":"hydrogen:def-pink-or-red-hydrogen-the-nuclear-option","v":"406161","q":"How is pink hydrogen made, and what is India doing on it?"},{"path":[],"roles":["eg","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Leh, Ladakh (2023, worked: NTPC's green-hydrogen buses at high altitude)<\/span><br><span class=\"li\">NTPC Kawas, Gujarat (2023: green hydrogen blended into piped natural gas) → under the <mark>National Green Hydrogen Mission<\/mark><\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Initiatives: GAIL 2% H₂ blending in CNG, NTPC H₂ fuel cell, green hydrogen certification scheme<\/span><br><span class=\"li\">NGHM (2023): 5 MMT green H₂ a year by 2030 (Phase I to 2025–26, Phase II to 2029–30; <mark>SIGHT<\/mark> incentives + hubs + certification)<\/span><br><span class=\"li\">first hydrogen train coach tested (ICF)<\/span><\/span>","h":"<b>India's response<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Kandla port H₂ plant<\/span><br><span class=\"li\">Varanasi fuel-cell boat<\/span><br><span class=\"li\">GAIL 5% H₂ in PNG (Indore)<\/span><\/span>","cont":1}],"id":"hydrogen:eg-main","v":"339f2e","q":"Two green hydrogen examples, and India&#x27;s hydrogen initiatives and mission targets?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Requires up to 9 litres water per kg<\/span><br><span class=\"li\">Cost: $4.10–$7 per kg (still high)<\/span><br><span class=\"li\">most H₂ still grey (from gas)<\/span><br><span class=\"li\">storage and safety (flammable)<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">cheaper electrolysers (PLI)<\/span><br><span class=\"li\"><mark>green hydrogen hubs<\/mark><\/span><br><span class=\"li\">demand mandates for fertiliser and refineries<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"hydrogen:issue-main","v":"b452b6","q":"What holds green hydrogen back, and the way forward?"}],"circle":"y"},{"id":"biofuels","subj":"s04","name":"Biofuels","cards":[{"path":[],"roles":["def","issue"],"rows":[{"sec":"Generations:"},{"t":"edible part of plants (sugarcane, wheat, corn)","h":"1st gen:"},{"t":"non-edible part (tree trunk, grass, straw)","h":"2nd gen:"},{"t":"microalgae/macroalgae","h":"3rd gen:"},{"t":"waste-to-fuel (pyrolysis)","h":"4th gen:"},{"t":"$100–270 billion to meet current policy measures","h":"Investment:"},{"t":"food security (1st gen), low energy density","h":"Concerns:"}],"id":"biofuels:def-main","v":"9668ba","q":"The four generations of biofuels, the investment needed, and the concerns?"},{"path":[],"roles":["gov"],"rows":[{"t":"ethanol","h":"Biggest example:"},{"t":"o Targets 20% ethanol blending by 2025. o asification","cards":[{"path":[],"roles":["def","gov"],"rows":[{"t":"100 MT by 2030","h":"Target:"},{"t":"<span class=\"lst\"><span class=\"li\">Draft UCG guidelines (mining and closure plans for UCG blocks)<\/span><br><span class=\"li\">National Coal Gasification Mission<\/span><br><span class=\"li\">incentive scheme → coal → <mark>syngas<\/mark> for power, methanol, fertiliser<\/span><\/span>"},{"t":"<span class=\"lst\"><span class=\"li\">issues: high cost, foreign tech suits low-ash coal (India's is high-ash) → fluidised-bed gasifiers<\/span><br><span class=\"li\">CCUS<\/span><br><span class=\"li\">VGF<\/span><\/span>","cont":1}],"id":"underground-coal-gasification:def-main","v":"264ac6","q":"What is India&#x27;s coal gasification target, the steps taken, and the problems?"}],"circle":"w"},{"id":"seismic-and-disaster-statistics","subj":"s05","name":"Seismic and Disaster Statistics","cards":[{"path":[],"roles":["def","use"],"rows":[{"t":"<mark>59% landmass<\/mark> prone to moderate to very high intensity earthquakes","h":"<b>Definition & India's status<\/b>:"},{"t":"According to IDMC, 13–23 million people are displaced globally each year due to disasters; in 2024, India alone saw 5.4 million internal displacements, 40 million hectares susceptible to flood and river erosion 5700 out of 7500 coastline risk of cyclones and tsunamis 68% of cultivable area"},{"t":"India is multi-hazard prone → <mark>DRR<\/mark> has to be part of all development planning","h":"<b>Significance<\/b>:"}],"id":"seismic-and-disaster-statistics:def-main","v":"1d681a","q":"How exposed is India to quakes, floods and displacement, and what does that mean for planning?"}],"circle":"y"},{"id":"india-s-disaster-approach","subj":"s05","name":"India’s Disaster Approach","cards":[{"path":[],"roles":["def","eg","how"],"rows":[{"t":"from Relief centric approach to a <mark>zero casualty<\/mark> approach and National Disaster plan management india (make india disaster resilient in all sectors ) (<mark>NDMP 2019<\/mark> focuses on six thematic areas: Understanding Risk, Inter-Agency Coordination, Disaster Risk Governance, Capacity Development, Preparedness and Response, Recovery and Rehabilitation.","h":"India’s approach :"},{"t":"<span class=\"lst\"><span class=\"li\">Odisha, Cyclone Phailin 2013 (worked: ~10 lakh evacuated, ~44 deaths vs ~10,000 in the 1999 super cyclone → <mark>zero-casualty approach<\/mark>)<\/span><br><span class=\"li\">Kerala floods 2018 (failed: dam releases poorly coordinated, ~480 dead)<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">same goal = less risk → <mark>Sendai + Paris + SDGs<\/mark> (all 2015) to be read together → India: NDMP 2019 aligns all three<\/span><br><span class=\"li\">climate-proof infrastructure via <mark>CDRI<\/mark><\/span><\/span>","h":"<b>DRR + climate adaptation<\/b>:"}],"id":"india-s-disaster-approach:def-main","v":"15971c","q":"How has India&#x27;s disaster approach shifted, one example each way, and how DRR links with climate adaptation?"}],"circle":"g","pyq":["<b>2020 Q18 (15 marks):<\/b> Discuss the recent measures initiated in disaster management by the Government of India departing from the earlier reactive approach."]},{"id":"disaster-risk-formula","subj":"s05","name":"Disaster Risk Formula","cards":[{"path":[],"roles":["def"],"rows":[{"t":"Disaster Risk = <mark>Hazard × Vulnerability<\/mark> × Exposure (triad is foundation of Disaster Risk Reduction (DRR) Hazard Zoning and Risk Mapping, <mark>Early Warning<\/mark> Systems, Resilient Development Planning) (eg;. In Sikkim, the 2023 Glacial Lake Outburst Flood (GLOF) from South Lhonak Lake caused major destruction downstream. The hazard (GLOF) became a high disaster risk due to vulnerable infrastructure, exposed settlements, and lack of <mark>early warning<\/mark>.)"},{"t":"Exposure = people and assets sitting in the hazard zone (high exposure → damage even if vulnerability is low)"},{"t":"hazard = an event that can cause harm (cyclone) → disaster = when it overwhelms a community's <mark>capacity to cope<\/mark> → risk = chance of loss = hazard × vulnerability × exposure (lower with more capacity)","h":"<b>Hazard vs disaster vs risk<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">one hazard sets off another → Chamoli 2021 (rock-ice avalanche → flood → Tapovan tunnel)<\/span><br><span class=\"li\">Sikkim 2023 (GLOF → Chungthang dam breach)<\/span><br><span class=\"li\">Japan 2011 (quake → tsunami → Fukushima) → plan for <mark>chains of hazards<\/mark>, not single ones (Sendai)<\/span><\/span>","h":"<b>Cascading / compound risk<\/b>:"}],"id":"disaster-risk-formula:def-main","v":"15b8b4","q":"What is the disaster risk formula, what are exposure, hazard, disaster and risk, and what is cascading risk?","read":1},{"path":[],"roles":["def","eg"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Vulnerability = how likely people or assets are to be harmed + how little they can cope → 4 types: physical (weak houses on unsafe slopes)<\/span><br><span class=\"li\">social (age, gender, caste, disability, literacy)<\/span><br><span class=\"li\">economic (poverty, informal jobs, no insurance)<\/span><br><span class=\"li\">environmental (degraded ecosystems, deforestation)<\/span><\/span>"},{"t":"Himachal flash floods 2023 (Mandi, Kullu, Shimla): building on unstable slopes = physical + environmental vulnerability","h":"Eg:"},{"t":"Joshimath 2023 (town on old landslide debris = high exposure + vulnerability → sinking)","h":"<b>Examples<\/b>:"}],"id":"disaster-risk-formula:def-main-2","v":"2fc9d8","q":"What is vulnerability, its four types, and two Indian examples?"}],"circle":"g","pyq":["<b>2019 Q8 (10 marks):<\/b> Vulnerability is an essential element for defining disaster impacts and its threat to people. How and in what ways can vulnerability to disasters be characterized? Discuss different types of vulnerability with reference to disasters.","<b>2013 Q18 (10 marks):<\/b> How important ov-main","v":"236e25","q":"India&#x27;s insurance push, the protection gap, and the way forward?"}],"circle":"y"},{"id":"examples-of-disaster-innovation","subj":"s05","name":"Examples of Disaster Innovation","cards":[{"path":[],"roles":["def","eg","gov"],"rows":[{"t":"new tech and local ideas used to warn, coordinate and teach in disasters","h":"<b>Definition & India's status<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">During <mark>Cyclone Hudhud<\/mark>, Visakhapatnam’s PWD used WhatsApp groups for resource tracking and team coordination<\/span><br><span class=\"li\">Disaster detection: E.g. Earthquake detection through X (Formerly twitter), COVID 19 Chatbots by WHO<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"Disaster awareness is now part of the NCERT curriculum in Classes 8 to 10, The IUINDRR-NIDM network, with over 330+ universities, promotes disaster risk research. E.g., building hazard maps using AI, Odisha State Disaster Mitigation Authority has developed a web based platform called “SATARK” to provide warning information for various hazards","h":"<b>India's response<\/b>:"}],"id":"examples-of-disaster-innovation:def-main","v":"246e1a","q":"Examples of disaster innovation, and how India builds disaster knowledge?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">digital divide<\/span><br><span class=\"li\">fake news on social media in disasters<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\"><mark>Common Alerting Protocol<\/mark> (SACHET)<\/span><br><span class=\"li\">cell-broadcast alerts<\/span><br><span class=\"li\">AI hazard maps for every district<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"examples-of-disaster-innovation:issue-main","v":"dc267f","q":"What limits tech in disasters, and the way forward?"}],"circle":"y"},{"id":"disaster-management-cycle","subj":"s05","name":"Disaster Management Cycle","cards":[{"path":[],"roles":["def","use"],"rows":[{"t":"Phases: before (prevention, mitigation → preparedness) → during (response) → after (recovery = rehabilitation + reconstruction) → <mark>build back better<\/mark> feeds the next round of prevention","h":"<b>Definition & India's status<\/b>:"},{"t":"moves focus from relief after the event to <mark>risk reduction<\/mark> before it","h":"<b>Significance<\/b>:"},{"sec":"Disaster management cycle :"},{"img":6}],"id":"disaster-management-cycle:def-main","v":"719a7b","q":"The phases of the disaster management cycle, and why the cycle matters?"},{"path":[],"roles":["eg","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Odisha after the 1999 super cyclone (worked: OSDMA set up 1999 → shelters, drills, warnings → Phailin 2013, Fani 2019 with few deaths = full cycle working)<\/span><br><span class=\"li\">Uttarakhand 2013 (failed: no preparedness or warning → Kedarnath, 5,000+ dead or missing)<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">DM Act 2005 moved India from <mark>relief-centric<\/mark> to the whole cycle<\/span><br><span class=\"li\"><mark>NDMP 2019<\/mark> gives each phase to nodal ministries<\/span><\/span>","h":"<b>India's response<\/b>:"}],"id":"disaster-management-cycle:eg-main","v":"3938b6","q":"One state where the full cycle worked, one where it failed, and how India runs the cycle?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">many states still relief-heavy<\/span><br><span class=\"li\">mitigation money under-used<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">DRR in every phase<\/span><br><span class=\"li\">build back better as the rule, not the exception<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"disaster-management-cycle:issue-main","v":"59bf8e","q":"Where does the cycle break down in India, and the fix?"}],"circle":"y"},{"id":"components-of-prevention","subj":"s05","name":"Components of Prevention","cards":[{"path":[],"roles":["def"],"rows":[{"t":"steps that stop a hazard becoming a disaster or cut its impact before it strikes","h":"<b>Definition & India's status<\/b>:"},{"t":"Components of prevention : 1) Hazard mapping and risk zoning (e.g., seismic zoning maps), <mark>Retrofitting<\/mark> of buildings and infrastructure, Flood embankments, cyclone shelters, <mark>early warning<\/mark> system, Policy and regulation (e.g., land-use planning, building codes, coastal regulation zones), Environmental conservation (e.g., afforestation, wetland protection)","h":"<b>Pillars / key features<\/b>:"},{"t":"every $1 on mitigation saves about $6 in losses (US NIBS 2019)","h":"<b>Significance<\/b>:"}],"id":"components-of-prevention:def-main","v":"74c6d6","q":"What is prevention, its components, and how much does it save?"},{"path":[],"roles":["eg","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Odisha's multipurpose cyclone shelters (worked)<\/span><br><span class=\"li\">Joshimath 2023 (failed: the Mishra Committee warned against heavy construction back in 1976 → ignored)<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">BIS codes<\/span><br><span class=\"li\">National Building Code<\/span><br><span class=\"li\"><mark>hazard zonation<\/mark> maps<\/span><br><span class=\"li\"><mark>mitigation funds<\/mark> (NDMF / SDMF from the 15th FC)<\/span><\/span>","h":"<b>India's response<\/b>:"}],"id":"components-of-prevention:eg-main","v":"4692a7","q":"One prevention success, one ignored warning, and India&#x27;s prevention tools?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">building codes poorly enforced<\/span><br><span class=\"li\">expert warnings ignored (Joshimath)<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">risk-informed land use<\/span><br><span class=\"li\">retrofit schools and hospitals first<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"components-of-prevention:issue-main","v":"ec5877","q":"Why does prevention fail, and what comes first?"}],"circle":"y"},{"id":"components-of-preparedness","subj":"s05","name":"Components of Preparedness","cards":[{"path":[],"roles":["def"],"rows":[{"t":"Development of disaster management plans (national, state, district levels)","h":"Components of prepardness :"},{"t":"Training of first responders (e.g., <mark>Aapda Mitra<\/mark> volunteers, civil defence, police), Conducting mock drills, simulations, and community awareness campaigns, Stockpiling emergency supplies and equipment, Development of <mark>early warning<\/mark> systems and communication protocols (e.g., CAP-SACHET)"}],"title":"Components of prepardness :","id":"components-of-preparedness:def-components-of-prepardness","v":"733719","q":"What goes into disaster preparedness?"},{"path":[],"roles":["gov"],"rows":[{"t":"<mark>Mission Mausam<\/mark> was approved by the Union Cabinet on September 11, 2024, with a budget of ₹2,000 crore over two years (2024–26), aimed at making India \"Weather Ready and Climate Smart.\""},{"t":"deployment of 50 Doppler Weather Radars, 60 Radio Sonde/Radio Wind stations, 100 disdrometers, 10 Wind Profilers, and 25 radiometers; integration of AI/ML with physics-based numerical models for improved forecasts.","h":"Key features:"},{"t":"\"Mausam GPT\" — an AI-powered system providing quick and reliable weather information in both text and audio forms — is being developed and will be rolled out over the next five years"},{"t":"<span class=\"lst\"><span class=\"li\">forecast grid 12 km → 6 km, finer than US/UK/EU models<\/span><br><span class=\"li\">village-level nowcasts<\/span><\/span>","h":"Bharat Forecast System (IITM Pune):"}],"id":"components-of-preparedness:gov-main","v":"5bac40","q":"What is Mission Mausam, its key features, and the Bharat Forecast System?"},{"path":[],"roles":["gov","issue"],"rows":[{"t":"the first integrated multi-state mock drill in Delhi-NCR, conducted across 55 locations covering 18 districts in Delhi, Haryana, and Uttar Pradesh, simulating a large-scale earthquake. Organised by NDMA with the Indian Army, DDMA, and state SDMAs.","h":"Exercise Suraksha Chakra (August 2025):"},{"t":"Standard hydrological Early Warning Systems (EWS) are often rendered ineffective during sturzstrom and flash-debris events because travel velocity is extreme (minutes rather than hours), leaving negligible lead time.","h":"The Hyper-Velocity EWS Challenge:"},{"t":"Requires high-altitude satellite monitoring (SAR/InSAR), permafrost thermal mapping, cross-border data sharing (transboundary early warning), and localized sirens rather than downstream-only gauge sensors.","h":"DRR Priority:"}],"id":"components-of-preparedness:gov-main-2","v":"d53a9a","q":"What was Exercise Suraksha Chakra, and why do sturzstrom-type events beat normal early warnings?"}],"circle":"g"},{"id":"components-of-response","subj":"s05","name":"Components of Response","cards":[{"path":[],"roles":["def"],"rows":[{"t":"action during and just after a disaster to save lives and meet basic needs","h":"<b>Definition & India's status<\/b>:"},{"t":"Components of response : Search and rescue operations by <mark>NDRF<\/mark>, SDRF, armed forces, Provision of emergency shelter, food, water, and medical aid, Restoration of critical infrastructure (power, roads, communication), Coordinated efforts by central and state agencies, NGOs, and community volunteers, Emergency health care and psychological support","h":"<b>Pillars / key features<\/b>:"},{"t":"the <mark>golden hour<\/mark>: most lives are saved by fast local rescue","h":"<b>Significance<\/b>:"}],"id":"components-of-response:def-main","v":"f9d9c3","q":"What is disaster response, its components, and the golden hour?"},{"path":[],"roles":["eg","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Silkyara tunnel, Uttarakhand (2023, worked: 41 workers rescued after 17 days, multi-agency + rat-hole miners)<\/span><br><span class=\"li\">Kedarnath 2013 (failed: late warning + poor coordination)<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">NDRF (16 battalions)<\/span><br><span class=\"li\">SDRF in every state<\/span><br><span class=\"li\"><mark>Incident Response System<\/mark> (NDMP)<\/span><br><span class=\"li\">ERSS-112<\/span><br><span class=\"li\">armed forces for HADR<\/span><\/span>","h":"<b>India's response<\/b>:"}],"id":"components-of-response:eg-main","v":"5ab50a","q":"One rescue success, one failure, and India&#x27;s response forces and systems?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">last-mile reach<\/span><br><span class=\"li\">coordination gaps between agencies<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">regular IRS drills<\/span><br><span class=\"li\">trained community first responders (<mark>Aapda Mitra<\/mark>)<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"components-of-response:issue-main","v":"bc07e4","q":"Where does response break down, and the fix?"}],"circle":"y"},{"id":"components-of-recovery","subj":"s05","name":"Components of Recovery","cards":[{"path":[],"roles":["def","eg","gov"],"rows":[{"t":"restoring lives, livelihoods and infrastructure after a disaster, ideally better than before","h":"<b>Definition & India's status<\/b>:"},{"t":"Components of recovery : Damage assessment and compensation, Restoration of public services and livelihoods, Reconstruction of housing, schools, health centres, and other infrastructure, Integration of disaster risk reduction (DRR) and climate resilience into redevelopment, Psycho-social rehabilitation and community participation in rebuilding","h":"<b>Pillars / key features<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Bhuj 2001 → Gujarat (worked: GSDMA + <mark>owner-driven reconstruction<\/mark> + new building rules = <mark>build back better<\/mark>)<\/span><br><span class=\"li\">Kerala 2018 → Rebuild Kerala Initiative (mixed: slow spending)<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\"><mark>PDNA<\/mark> (post-disaster needs assessment)<\/span><br><span class=\"li\">Recovery & Reconstruction window in disaster funds (15th FC)<\/span><br><span class=\"li\">livelihood support via MGNREGA<\/span><\/span>","h":"<b>India's response<\/b>:"}],"id":"components-of-recovery:def-main","v":"04a7dd","q":"What is recovery, its components, two examples, and India&#x27;s recovery tools?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">slow release of funds<\/span><br><span class=\"li\">rebuilding in the same risky places<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">owner-driven, <mark>risk-informed<\/mark> rebuilding<\/span><br><span class=\"li\">PDNA after every major disaster<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"components-of-recovery:issue-main","v":"9505c4","q":"Why does recovery go wrong, and the fix?"}],"circle":"y"},{"id":"disaster-resilience","subj":"s05","name":"Disaster Resilience","cards":[{"path":[],"roles":["def"],"rows":[{"t":"can <mark>anticipate, absorb, adapt and recover<\/mark> quickly","h":"Disaster resilience :"},{"t":"Resilience = anticipate + absorb + adapt + recover, and \"<mark>bounce forward<\/mark>\" (build back better), not just bounce back"},{"t":"<span class=\"lst\"><span class=\"li\">anticipate (early warning, risk information, education)<\/span><br><span class=\"li\">absorb (strong infrastructure, safety nets)<\/span><br><span class=\"li\">adapt (flexible institutions, risk-informed development)<\/span><br><span class=\"li\">recover (fast, inclusive rebuilding with community)<\/span><\/span>","h":"Measured by:"},{"t":"coastal village with cyclone shelters + trained volunteers is more resilient than one without","h":"Eg:"}],"id":"disaster-resilience:def-main","v":"e2dd7d","q":"What is disaster resilience, how is it measured, and an example?"},{"path":[],"roles":["eg","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Odisha, Cyclone Fani 2019 (worked: ~12 lakh evacuated, ~64 deaths)<\/span><br><span class=\"li\">Chennai floods 2015 (failed: lakes and floodplains built over → city could not absorb the rain)<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\"><mark>CDRI<\/mark> (2019)<\/span><br><span class=\"li\">Aapda Mitra volunteers<\/span><br><span class=\"li\">Mission Mausam<\/span><br><span class=\"li\">resilient-infrastructure chapters in NDMP<\/span><\/span>","h":"<b>India's response<\/b>:"}],"id":"disaster-resilience:eg-main","v":"60714e","q":"One resilience success, one failure, and India&#x27;s resilience initiatives?"}],"circle":"g","pyq":["<b>2024 Q17 (15 marks):<\/b> What is disaster resilience? How is it determined? Describe various elements of a resilience framework. Also mention the global targets of Sendai Framework for Disaster Risk Reduction (2015-2030)."]},{"id":"accountability-and-oversight","subj":"s05","name":"Accountability and Oversight","cards":[{"path":[],"roles":["def","eg"],"rows":[{"h":"<b>Definition & India's status<\/b>:","t":"Supreme Court & High Courts have played a critical role in enforcing accountability (e.g., Pradhan Mantri Garib Kalyan Yojana case, COVID migrant workers case), Comptroller and Auditor General (CAG) and Parliamentary Committees have flagged issues in fund utilization, inter-agency coordination, and absence of mitigation plans."},{"t":"<span class=\"lst\"><span class=\"li\">CAG audit of NDMA (2013: projects stalled, plans missing)<\/span><br><span class=\"li\">SC, <mark>Gaurav Kumar Bansal<\/mark> (2021: NDMA must set ex gratia for COVID deaths)<\/span><\/span>","h":"<b>Examples<\/b>:"}],"id":"accountability-and-oversight:def-main","v":"cfecec","q":"Who holds disaster management to account, with examples?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">no fixed liability for officials<\/span><br><span class=\"li\">funds left unspent (CAG)<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\"><mark>social audits<\/mark> of relief<\/span><br><span class=\"li\">DM plans with timelines<\/span><br><span class=\"li\">regular review of NDMA by Parliament<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"accountability-and-oversight:issue-main","v":"e42de9","q":"Where is accountability weak, and how do we fix it?"}],"circle":"y"},{"id":"disaster-management-act-2005","subj":"s05","name":"Disaster Management Act, 2005","cards":[{"path":[],"roles":["def","how"],"rows":[{"t":"Disaster management is structured at National (NDMA), State (SDMA), and District (DDMA) levels","h":"Three-Tier Mechanism:"},{"t":"Apex body chaired by PM; lays policies, approves plans, supervises <mark>NDRF<\/mark>, and oversees funds for mitigation and preparedness","h":"NDMA:"},{"t":"Chaired by Union Home Secretary; coordinates and monitors disaster management across ministries","h":"National Executive Committee (NEC):"},{"t":"National, State, and District plans are mandatory and must align with <mark>sustainable development<\/mark> principles","h":"Statutory Disaster Plans:"},{"t":"Specialized response force with trained battalions, engineers, paramedics, and dog squads; pre-positioned in threatening disaster situations","h":"NDRF:"},{"t":"Panchayat, municipalities, and ULBs play legally defined roles in preparedness, relief, and reconstruction. Fund via NDRF (fund) (used for rehab) and SDRF (only for immediate mitigation) and The National Calamity Contingency Fund (NCCF), created by the 11th Finance Commission, was later merged with the NDRF.","h":"Local Authorities:"}],"id":"disaster-management-act-2005:def-main","v":"920f74","q":"The DM Act 2005: its three tiers, NDMA, NEC, plans, NDRF and local bodies?"},{"path":[],"roles":["fix"],"rows":[{"sec":"Recommendations of the Standing Committee on Finance (2019)(Chairperson: Dr. M. Veerappa Moily)"},{"t":"Increase SDRF/NDRF aid, including infrastructure restoration","h":"Relief scale:"},{"t":"Create a separate fund for permanent disaster mitigation projects","h":"Mitigation fund:"},{"t":"NCCD revenue declining; 10% of central scheme funds should restore damaged assets","h":"Funding issues:"},{"t":"Raise annual allocation from 5% to 15% (2020–2025) to meet state needs","h":"SDRF corpus:"}],"id":"disaster-management-act-2005:fix-main","v":"77d279","q":"What did the Standing Committee on Finance (2019) recommend on disaster funds?"},{"path":[],"roles":["eg"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">COVID-19 (Mar 2020, worked as a tool: first nationwide use of the Act for lockdown orders)<\/span><br><span class=\"li\">Uttarakhand 2013 (failed: CAG found the state authority had barely met before Kedarnath)<\/span><\/span>","h":"<b>Examples<\/b>:"}],"id":"disaster-management-act-2005:eg-main","v":"3b202b","q":"When did the DM Act work, and when did it fail?"}],"circle":"g"},{"id":"disaster-management-amendment-act-2025","subj":"s05","name":"Disaster Management Amendment Act 2025","cards":[{"path":[],"roles":["def"],"rows":[{"t":"Expands definitions of disaster risk, resilience, recovery aligns with global frameworks (SFDRR) and strengthens disaster governance"},{"t":"All Municipal Corporations (except Delhi & Chandigarh) must have Urban DM Authorities headed by Municipal Commissioners","h":"<mark>Urban DM Authorities<\/mark>:"},{"t":"Mandates real-time databases for risk, response, mitigation, damage, and relief — essential for planning and audits","h":"National & State Disaster Databases:"},{"t":"NDMA can monitor plans, set minimum relief standards, audit implementations; all states must have SDRFs mirroring <mark>NDRF<\/mark> but some issues remain like no upgradation is status of NDMA (still under MHA), doesn’t address member vacancy, fund thru MHA, vague details on urban DM plans, weak linkage with tech.","h":"Enhanced NDMA & SDRFs:"}],"id":"disaster-management-amendment-act-2025:def-main","v":"e9259d","q":"What did the DM (Amendment) Act 2025 add?"},{"path":[],"roles":["gov","eg"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">locals identify, plan and act on their own risks (Sendai asks for it)<\/span><br><span class=\"li\">communities are the first responders<\/span><\/span>","h":"<mark>Community-based DRR<\/mark>:"},{"t":"<span class=\"lst\"><span class=\"li\">National Project for Community-Based DRR in PRIs (₹507.37 cr; MoPR + NDMA): 20 states, 81 disaster-prone districts, 20 GPs per district<\/span><br><span class=\"li\">1 Model Gram Panchayat per state on 6 hazard themes<\/span><\/span>"},{"t":"<span class=\"lst\"><span class=\"li\">Pozhuthana panchayat (Kerala floods 2018: risk maps, village response teams, EOC)<\/span><br><span class=\"li\">Tampara wetland (Odisha, eco-DRR)<\/span><\/span>","h":"Local examples:"},{"t":"<span class=\"lst\"><span class=\"li\">Aapda Mitra<\/span><br><span class=\"li\">eGramSwaraj, Gram Manchitra<\/span><br><span class=\"li\">SACHET alerts<\/span><\/span>","h":"Tools:"}],"title":"<b>Localisation of DRR (₹507 cr panchayat project)<\/b>","id":"disaster-management-amendment-act-2025:gov-localisation-of-drr-507-cr-panchayat-pro","v":"df0c1e","q":"What is community-based DRR, the panchayat DRR project, and local examples and tools?"}],"circle":"g","pyq":["<b>2020 Q18 (15 marks):<\/b> Discuss the recent measures initiated in disaster management by the Government of India departing from the earlier reactive approach."]},{"id":"legal-framework-for-disasters","subj":"s05","name":"Legal Framework for Disasters","cards":[{"path":[],"roles":["def"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\"><mark>DM Act, 2005<\/mark> = main law (NDMA → SDMA → DDMA)<\/span><br><span class=\"li\">sector laws below<\/span><\/span>","h":"<b>Definition & India's status<\/b>:"},{"t":"Environment (Protection) Act, 1986 Addresses chemical and ecological disasters","h":"<b>Pillars / key features<\/b>:"},{"t":"Factories Act, 1948 Worker safety and industrial disaster prevention"},{"t":"The <mark>Epidemic Diseases Act, 1897<\/mark> Legal framework for biological disasters (e.g., COVID-19)"},{"t":"Atomic Energy Act, 1962 For radiological and nuclear emergencies"},{"t":"The Water Act, 1974 & Air Act, 1981 Prevent pollution-induced disasters"},{"t":"Forest (Conservation) Act, 1980 Prevents ecological degradation leading to disasters"},{"t":"Strengthen enforcement of environmental laws like Air Act, Water Act, Environment Protection Act.","h":"National green tribunal :"}],"id":"legal-framework-for-disasters:def-main","v":"383189","q":"Which laws besides the DM Act cover disasters, and what does each handle?"},{"path":[],"roles":["eg","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">COVID-19, 2020 (DM Act + Epidemic Diseases Act used together for lockdowns)<\/span><br><span class=\"li\">Bhopal 1984 → EPA 1986<\/span><br><span class=\"li\">Public Liability Insurance Act 1991<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">DM (Amendment) Act, 2025: urban DM authorities<\/span><br><span class=\"li\">national and state disaster databases<\/span><\/span>","h":"<b>India's response<\/b>:"}],"id":"legal-framework-for-disasters:eg-main","v":"b48335","q":"Examples of these laws in action, and the 2025 changes?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">laws scattered across ministries<\/span><br><span class=\"li\">weak liability for chemical disasters<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">one risk-based approach across laws<\/span><br><span class=\"li\">enforce the 2025 amendments<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"legal-framework-for-disasters:issue-main","v":"ecf36b","q":"What&#x27;s wrong with India&#x27;s disaster laws, and the fix?"}],"circle":"y"},{"id":"national-disaster-management-plan-ndmp-2","subj":"s05","name":"National Disaster Management Plan (NDMP) 2019","cards":[{"path":[],"roles":["def"],"rows":[{"t":"The National Disaster Management Plan (NDMP) 2019 updates India’s first plan (2016) and aligns with SFDRR, SDGs, <mark>Paris Agreement<\/mark>, and India’s Ten-Point DRR Agenda. It provides a comprehensive framework for prevention, mitigation, preparedness, response, recovery, and “<mark>build back better<\/mark>.”"},{"t":"Thematic areas include risk assessment, inter-agency coordination, structural and non-structural DRR investments, capacity development, and climate risk management, with special focus on vulnerable groups and mainstreaming DRR into development."},{"t":"<mark>NDMP 2019<\/mark> sets short-, medium-, and long-term objectives (2022, 2027, 2030) and includes hazard-specific risk matrices for 20+ natural and anthropogenic disasters."},{"t":"The response framework defines roles of nodal ministries, Incident Response Teams, early warning systems, and central support to state governments. Capacity building involves PRIs, ULBs, communities, professionals, educational institutions, civil society, and private sector to ensure decentralized, inclusive disaster governance."}],"id":"national-disaster-management-plan-ndmp-2:def-main","v":"696420","q":"What does NDMP 2019 align with, its themes, its time frames and its response framework?","read":1},{"path":[],"roles":["eg"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Ahmedabad <mark>Heat Action Plan<\/mark> (2013, first in South Asia → model for heat chapters)<\/span><br><span class=\"li\">Cyclone Fani 2019 (SOPs, NDRF pre-positioned, IMD warnings in sync)<\/span><\/span>","h":"<b>Examples<\/b>:"}],"id":"national-disaster-management-plan-ndmp-2:eg-main","v":"1a0c01","q":"Two examples of NDMP-style planning that worked?"}],"circle":"g","pyq":["<b>2018 Q18 (15 marks):<\/b> Describe various measures taken in India for Disaster Risk Reduction (DRR) before and after signing ‘Sendai Framework for DRR (2015-2030)’. How is this framework different from ‘Hyogo Framework for Action, 2005’?"]},{"id":"sdg-13-1-2","subj":"s05","name":"SDG 13.1.2","cards":[{"path":[],"roles":["fact"],"rows":[{"t":"Tracks the number of countries adopting and implementing national disaster risk reduction strategies aligned with the Sendai Framework (2015–2030)."}],"id":"sdg-13-1-2:fact-main","v":"635609","q":"What does SDG indicator 13.1.2 track?"}],"circle":"w"},{"id":"early-warning-systems","subj":"s05","name":"Early Warning Systems","cards":[{"path":[],"roles":["def","use"],"rows":[{"t":"systems that detect a hazard and warn people in time to act","h":"<b>Definition & India's status<\/b>:"},{"t":"The Pacific Rim Tsunami Warning system is an example of a cost-effective warning system; its yearly operating cost is approximately US$4 million. The yearly operating cost of a hypothetical global warning system is estimated at US$30 million. This cost, compared to the international aid donations of nearly US$8 billion for the 2004 Indian Ocean earthquake and tsunami, clearly demonstrates the cost effectiveness of such a system.","h":"<b>Significance<\/b>:"}],"id":"early-warning-systems:def-main","v":"78b76a","q":"What is an early warning system, and why is it worth the money?"},{"path":[],"roles":["eg","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">INCOIS tsunami warning centre, Hyderabad (2007, worked: alerts within minutes, serves the Indian Ocean)<\/span><br><span class=\"li\">Dharali, Uttarkashi (Aug 2025, failed: flash flood in a narrow valley with no local warning)<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\"><mark>SACHET<\/mark> <mark>Common Alerting Protocol<\/mark><\/span><br><span class=\"li\">Mission Mausam<\/span><br><span class=\"li\">Bharat Forecast System<\/span><br><span class=\"li\">Damini (lightning)<\/span><br><span class=\"li\">cell-broadcast alert tests<\/span><\/span>","h":"<b>India's response<\/b>:"}],"id":"early-warning-systems:eg-main","v":"0a87c4","q":"One warning success, one failure, and India&#x27;s warning tools?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\"><mark>last-mile<\/mark> gaps (Dharali)<\/span><br><span class=\"li\">cloudbursts and flash floods hard to forecast<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">UN Early Warnings for All (by 2027)<\/span><br><span class=\"li\">village sirens<\/span><br><span class=\"li\">alerts in local languages<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"early-warning-systems:issue-main","v":"ec49f3","q":"Why do warnings still miss people, and the fix?"}],"circle":"y"},{"id":"world-conferences-on-disaster-risk-reduc","subj":"s05","name":"World Conferences on Disaster Risk Reduction (WCDRR)","cards":[{"path":[],"roles":["def"],"rows":[{"t":"Yokohama, Japan (1994)","h":"First WCDRR –"},{"t":"Yokohama Strategy and Plan of Action for a Safer World","h":"Main Outcome:"},{"t":"Establish a global framework for disaster risk reduction (DRR). Promote disaster prevention, preparedness, and mitigation. Encourage international cooperation and support for DRR initiatives.","h":"Aims:"},{"t":"Introduced the concept of disaster risk reduction as a global priority. Emphasized the importance of integrating DRR into development planning.","h":"Key Features:"}],"title":"First WCDRR –","id":"world-conferences-on-disaster-risk-reduc:def-first-wcdrr","v":"2cc1bb","q":"The first WCDRR: where, when, outcome, aims and features?"},{"path":[],"roles":["def"],"rows":[{"t":"Kobe, Japan (2005)","h":"Second WCDRR –"},{"t":"<mark>Hyogo Framework<\/mark> for Action (HFA) 2005–2015","h":"Main Outcome:"},{"t":"Build the resilience of nations and communities to disasters. Achieve a substantial reduction of disaster losses in lives and in the social, economic, and environmental assets of communities and countries.","h":"Aims:"},{"t":"Outlined five priorities for action: 1. Making DRR a priority, 2. Improving risk information and <mark>early warning<\/mark>, 3. Building a culture of safety and resilience, 4. Reducing the risks in key sectors, 5. Strengthening preparedness for response.","h":"Key Features:"},{"t":"<span class=\"lst\"><span class=\"li\">Emphasized the need for a systematic approach to DRR.<\/span><br><span class=\"li\">Highlighted the importance of integrating DRR into development policies and planning<\/span><\/span>"}],"title":"Second WCDRR –","id":"world-conferences-on-disaster-risk-reduc:def-second-wcdrr","v":"a749da","q":"The second WCDRR: where, when, outcome, aims and the five priorities?"},{"path":[],"roles":["def"],"rows":[{"t":"Sendai, Japan (2015)","h":"Third WCDRR –"},{"t":"<mark>Sendai Framework<\/mark> for Disaster Risk Reduction 2015–2030","h":"Main Outcome:"},{"t":"Achieve the substantial reduction of disaster risk and losses in lives, livelihoods, and health, and in the economic, physical, social, cultural, and environmental assets of persons, businesses, communities, and countries.","h":"Aims:"},{"t":"<span class=\"lst\"><span class=\"li\">disaster deaths<\/span><br><span class=\"li\">people affected<\/span><br><span class=\"li\">economic loss (as % of GDP)<\/span><br><span class=\"li\">damage to critical infrastructure and basic services<\/span><\/span>","h":"4 reduce (by 2030):"},{"t":"<span class=\"lst\"><span class=\"li\">countries with national and local DRR strategies (by 2020)<\/span><br><span class=\"li\">international support to developing countries<\/span><br><span class=\"li\">access to multi-hazard early warning and risk information<\/span><\/span>","h":"3 increase:"},{"t":"<span class=\"lst\"><span class=\"li\">understand risk<\/span><br><span class=\"li\">strengthen risk governance<\/span><br><span class=\"li\">invest in DRR for resilience<\/span><br><span class=\"li\">preparedness and build back better<\/span><\/span>","h":"4 priorities:"},{"t":"<span class=\"lst\"><span class=\"li\">NDMP 2016/2019 built on the 4 priorities<\/span><br><span class=\"li\">PM's 10-point agenda (2016)<\/span><br><span class=\"li\">CDRI (2019)<\/span><\/span>","h":"India aligned via:"}],"title":"Third WCDRR –","id":"world-conferences-on-disaster-risk-reduc:def-third-wcdrr","v":"74dcc6","q":"The third WCDRR: where, when, outcome, its targets and priorities, and how India aligned?"},{"path":[],"roles":["tbl"],"rows":[{"h":"Manage disasters","t":"<span class=\"th\">Sendai 2015–30<\/span> Manage risk"},{"h":"Response and preparedness","t":"<span class=\"th\">Sendai 2015–30<\/span> Prevention and reduction"},{"h":"Early warning","t":"<span class=\"th\">Sendai 2015–30<\/span> Risk governance, whole-system approach"},{"h":"Institutional preparedness","t":"<span class=\"th\">Sendai 2015–30<\/span> DRR built into all development sectors"},{"h":"Nation-centric, 5 priorities","t":"<span class=\"th\">Sendai 2015–30<\/span> Local ownership + global cooperation, 7 targets + 4 priorities"}],"title":"<b>Hyogo vs Sendai<\/b>","table":1,"head":["Hyogo 2005–15","Sendai 2015–30"],"id":"world-conferences-on-disaster-risk-reduc:tbl-hyogo-vs-sendai","v":"bdfff8","q":"How does Sendai differ from Hyogo?"}],"circle":"g","pyq":["<b>2024 Q17 (15 marks):<\/b> What is disaster resilience? How is it determined? Describe various elements of a resilience framework. Also mention the global targets of Sendai Framework for Disaster Risk Reduction (2015-2030).","<b>2018 Q18 (15 marks):<\/b> Describe various measures taken in India for Disaster Risk Reduction (DRR) before and after signing ‘Sendai Framework for DRR (2015-2030)’. How is this framework different from ‘Hyogo Framework for Action, 2005’?"]},{"id":"earthquakes","subj":"s05","name":"Earthquakes","cards":[{"path":[],"roles":["def","cause"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">59% of India is prone to earthquakes<\/span><br><span class=\"li\">India recorded 159 earthquakes from November 2024 to February 2025<\/span><\/span>","h":"<b>Extent<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Indian plate pushing into Eurasia (Himalaya, NE)<\/span><br><span class=\"li\">59% of land in moderate–very high zones<\/span><br><span class=\"li\">dense cities on soft soil<\/span><\/span>","h":"Why India is vulnerable:"},{"t":"<span class=\"lst\"><span class=\"li\">IS 1893:2016 → Zones II–V (59%)<\/span><br><span class=\"li\">BIS 2025 code added Zone VI (whole Himalayan arc, 61%) → withdrawn Mar 2026 after MoHUA flagged 10–15% cost rise + little consultation → 2016 code back in force<\/span><\/span>","h":"Zones:"},{"img":7},{"t":"Reasons : Earthquakes: plate boundary movement (subduction/collision/transform), intraplate stress, fault rupture/lock–release, volcanic activity, reservoir-induced seismicity (dams/mining), hydraulic fracturing, isostatic rebound.","h":"<b>Causes<\/b>:"}],"id":"earthquakes:def-main","v":"d28baa","q":"How quake-prone is India, why, its seismic zones, and what causes earthquakes?"},{"path":[],"roles":["effect","eg"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">building collapse → most deaths (buildings kill, not the shaking)<\/span><br><span class=\"li\"><mark>liquefaction<\/mark>, landslides, tsunamis, dam damage<\/span><br><span class=\"li\">lifelines (roads, power, hospitals) cut<\/span><br><span class=\"li\">economic loss<\/span><\/span>","h":"<b>Effects<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Last 3 decades: Latur 1993 (~10,000 dead, stable Deccan plate)<\/span><br><span class=\"li\">Jabalpur 1997<\/span><br><span class=\"li\">Chamoli 1999<\/span><br><span class=\"li\">Bhuj 2001 (M7.7, ~20,000 dead)<\/span><br><span class=\"li\">Kashmir 2005 (M7.6)<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Sikkim 2011 (M6.9)<\/span><br><span class=\"li\">Nepal 2015 (M7.8, Bihar hit)<\/span><br><span class=\"li\">Imphal 2016 (M6.7)<\/span><br><span class=\"li\">Eg. Mayanmar earthquake (cause strike slip faulting)<\/span><\/span>","cont":1}],"id":"earthquakes:effect-main","v":"1e3a78","q":"What do earthquakes do, and the major Indian quakes of the last three decades?"},{"path":[],"roles":["gov"],"rows":[{"t":"India focuses on pre-disaster mitigation, preparedness, and vulnerability reduction for earthquakes, as they cannot be prevented or precisely predicted. Key national institutions include the National Centre for Seismology (earthquake monitoring, hazard reports, “India Quake” app), the National Earthquake Risk Mitigation Project (structural and non-structural vulnerability reduction), and the National Building Code (regulates safe construction).","h":"<b>NDMA guideline / scheme<\/b>:"},{"t":"NDMA’s six pillars of earthquake management include: earthquake-resistant new construction, selective retrofitting of priority structures, regulation and enforcement of building codes, awareness and preparedness campaigns, capacity development through training and R&D, and emergency response via Incident Command Systems and Emergency Operations Centres.","cont":1},{"t":"Seismic observatories increased from 80 in 2014 to 168 by February 2025. Pib"},{"t":"The BhooKamp app was launched for real-time earthquake updates Pib (complements the existing \"India Quake\" app mention — now two apps)."},{"t":"NDMA's Earthquake Risk Indexing (EDRI) project assesses earthquake risks in 50 cities, with plans to cover 16 more. Press Information Bureau"},{"t":"<mark>NDRF<\/mark> has now expanded to 16 Battalions, each with 1,149 personnel"}],"title":"<b>NDMA guideline / scheme<\/b>:","id":"earthquakes:gov-ndma-guideline-scheme","v":"37da93","q":"India&#x27;s earthquake approach, and recent steps in figures?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Gaps: building codes (IS 1893, NBC) not enforced<\/span><br><span class=\"li\">most houses non-engineered<\/span><br><span class=\"li\">slow retrofitting of schools, hospitals<\/span><\/span>","h":"<b>Gaps → way forward<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">earthquake <mark>early warning<\/mark> only a pilot (Uttarakhand)<\/span><br><span class=\"li\">weak urban planning<\/span><br><span class=\"li\">low awareness → enforce codes<\/span><\/span>","cont":1},{"t":"<span class=\"lst\"><span class=\"li\">retrofit schools and hospitals<\/span><br><span class=\"li\">early warning beyond the pilot<\/span><br><span class=\"li\">drills and awareness<\/span><\/span>","cont":1}],"id":"earthquakes:issue-main","v":"ab1492","q":"Where is earthquake safety weak, and the way forward?"},{"path":[],"roles":["fact","news"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\"><b> Pacific Ring of Fire<\/b>: Ring of Fire: ~40,000 km horseshoe round the Pacific → ~75% of active volcanoes<\/span><br><span class=\"li\">~90% of earthquakes<\/span><br><span class=\"li\">Why: subduction zones (Pacific under Australian plate, Taupo)<\/span><br><span class=\"li\">transform faults (San Andreas)<\/span><\/span>","h":"<b>Related:<\/b>"},{"t":"<span class=\"lst\"><span class=\"li\">ridges (East Pacific Rise)<\/span><br><span class=\"li\">hotspots<\/span><br><span class=\"li\">News: M8.8 Kamchatka quake (shallow reverse faulting) → tsunami in Russia, Japan<\/span><\/span>","cont":1}],"title":"<b>Related:<\/b>","id":"earthquakes:fact-related","v":"205384","q":"What is the Pacific Ring of Fire, why is it so active, and a recent example?"}],"circle":"g","pyq":["<b>2021 Q8 (10 marks):<\/b> Discuss about the vulnerability of India to earthquake related hazards. Give examples including the salient features of major disasters caused by earthquakes in different parts of India during the last three decades.","<b>2015 Q16 (12.5 marks):<\/b> The frequency of earthquakes appears to have increased in the Indian subcontinent. However, India’s preparedness for mitigating their impact has significant gaps. Discuss various aspects."]},{"id":"tsunamis","subj":"s05","name":"Tsunamis","cards":[{"path":[],"roles":["def","cause"],"rows":[{"t":"Though tsunamis are rare in the Indian Ocean, 13 were recorded in the last 300 years, with 3 in the Andaman and Nicobar region. The Indian Ocean Tsunami of 26th December 2004 remains one of the most destructive to have hit India","h":"<b>Extent<\/b>:"},{"t":"Tsunamis: undersea megathrust/submarine earthquakes, submarine landslides, volcanic flank collapse/eruption (caldera collapse), asteroid/meteor impact, coastal subsidence.","h":"<b>Causes<\/b>:"}],"id":"tsunamis:def-main","v":"b5d713","q":"How often do tsunamis hit the Indian Ocean, and what causes them?"},{"path":[],"roles":["effect","eg"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">2004 → ~2.3 lakh dead in 14 countries, India ~10,700 (Nagapattinam, A&N worst)<\/span><br><span class=\"li\">boats, harbours and fishing livelihoods lost<\/span><br><span class=\"li\">coastal farmland salinised<\/span><br><span class=\"li\">tourism hit<\/span><\/span>","h":"<b>Effects<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">26 Dec 2004: M9.1 Sumatra–Andaman megathrust (Indian plate under Burma plate)<\/span><br><span class=\"li\">mangroves (Pichavaram) reduced damage<\/span><\/span>","h":"<b>Examples<\/b>:"}],"id":"tsunamis:effect-main","v":"302168","q":"What did the 2004 tsunami do, and what caused it?"},{"path":[],"roles":["gov","fix"],"rows":[{"t":"Since tsunamis cannot be prevented or precisely predicted, India focuses on pre-disaster mitigation, preparedness, and vulnerability reduction. NDMA’s six pillars for tsunami management include: risk assessment and hazard mapping, preparedness through monitoring networks and awareness, structural mitigation using natural and built barriers, regulation and enforcement of safe construction, coordinated emergency response, and implementation via capacity building and drills.","h":"<b>NDMA guideline (Tsunami Guidelines, Aug 2010)<\/b>:"},{"t":"The Indian Tsunami <mark>Early Warning<\/mark> System (ITEWS), developed by the Department of Space, DST, and CSIR (run by INCOIS, Hyderabad, under MoES since 2007), can detect Indian Ocean earthquakes in under 10 minutes and issue timely advisories using advanced communication and decision support systems. These measures aim to protect lives, infrastructure, and coastal communities.","cont":1},{"t":"<span class=\"lst\"><span class=\"li\">mangrove and shelterbelt <mark>bio-shields<\/mark><\/span><br><span class=\"li\">CRZ no-development zones<\/span><br><span class=\"li\">regular coastal drills<\/span><br><span class=\"li\">last-mile alerts (<mark>SACHET<\/mark>)<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"tsunamis:gov-main","v":"d59296","q":"NDMA&#x27;s tsunami guidelines and the way forward?","read":1}],"circle":"g","pyq":["<b>2017 Q18 (15 marks):<\/b> On December 2004, tsumani brought havoc on 14 countries including India. Discuss the factors responsible for occurrence of Tsunami and its effects on life and economy. In the light of guidelines of NDMA (2010) describe the mechanisms for preparedness to reduce the risk during such events."]},{"id":"floods","subj":"s05","name":"Floods","cards":[{"path":[],"roles":["def","cause"],"rows":[{"t":"Around 12% (40 million hectares) of India's land is prone to floods. The country receives an annual rainfall of 1200 mm, with 85% concentrated in just 3-4 months (June to September)","h":"<b>Extent<\/b>:"},{"t":"Urban floods in India have become a pressing issue, disrupting city life and causing economic losses. The World Bank estimates urban flood damage could reach $1 trillion annually by 2050 globally, with India highly vulnerable due to its urban density."},{"t":"Floods: extreme/ prolonged rainfall, river overflow/ice-jam release, rapid snowmelt, <mark>storm surge<\/mark>/ cyclone, dam/embankment breach, urbanisation/poor drainage, deforestation and siltation.","h":"<b>Causes<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">encroached drains and wetlands<\/span><br><span class=\"li\">concrete stops infiltration<\/span><br><span class=\"li\">no city flood plan<\/span><\/span>","h":"Urban, common cause:"}],"id":"floods:def-main","v":"41399f","q":"How flood-prone is India, why urban floods are growing, and the causes?"},{"path":[],"roles":["effect","eg"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">deaths, homes and crops lost<\/span><br><span class=\"li\">water-borne disease<\/span><br><span class=\"li\">roads, power and transport cut<\/span><br><span class=\"li\">big urban economic losses<\/span><\/span>","h":"<b>Effects<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Mumbai, 26 July 2005: ~944 mm in 24 hours (Santacruz)<\/span><br><span class=\"li\">Mithi river encroached<\/span><br><span class=\"li\">old drains built for 25 mm/hour → ~1,000 dead<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Chennai, Dec 2015: extreme rain<\/span><br><span class=\"li\">sudden release from Chembarambakkam lake<\/span><br><span class=\"li\">lakes and Adyar floodplain built over → ~340+ dead in Tamil Nadu<\/span><\/span>","cont":1}],"id":"floods:effect-main","v":"894a09","q":"What do floods do, and two big urban flood disasters with their causes?"},{"path":[],"roles":["gov"],"rows":[{"t":"India’s flood management combines structural and non-structural measures. Structural measures include reservoirs, dams, water storage, drainage improvement, river channel desilting, and catchment area treatment to control floods and runoff. Non-structural measures focus on flood plain zoning, comprehensive flood management plans, integrated water resources management, afforestation, and community preparedness.","h":"<b>NDMA guideline / scheme<\/b>:"},{"t":"Programs like the Aapada Mitra Scheme train volunteers for immediate relief and rescue during floods. Together, these measures aim to reduce flood impact, protect lives, and safeguard infrastructure.","cont":1},{"t":"<span class=\"lst\"><span class=\"li\">NDMA Urban Flood Guidelines 2010<\/span><br><span class=\"li\">AMRUT stormwater drains<\/span><br><span class=\"li\">sponge-city ideas<\/span><\/span>","h":"Policy:"}],"id":"floods:gov-main","v":"101de1","q":"India&#x27;s structural and non-structural flood measures, and policies?"},{"path":[],"roles":["fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Urban resilience: urban people 480 mn (2020) → 951 mn (2050)<\/span><br><span class=\"li\">storm-water flood risk 3.6–7x by 2070 (World Bank)<\/span><br><span class=\"li\">52% of towns have no master plan<\/span><br><span class=\"li\">city own revenue about 1% of GDP → tools: Climate Smart Cities Assessment Framework<\/span><\/span>","h":"<b>Way forward<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">C-FLOOD (flood forecasting)<\/span><br><span class=\"li\">MHEW-DSS → way forward: devolve urban planning to ULBs (74th Amendment)<\/span><\/span>","cont":1},{"t":"<span class=\"lst\"><span class=\"li\">about USD 2.4 tn resilient infrastructure by 2050<\/span><br><span class=\"li\">transit-oriented development<\/span><\/span>","cont":1}],"title":"<b>Way forward<\/b>:","id":"floods:fix-way-forward","v":"bf79da","q":"Urban flood resilience: the scale of the problem, the tools, and the way forward?"}],"circle":"g","pyq":["<b>2024 Q18 (15 marks):<\/b> Flooding in urban areas is an emerging climate-induced disaster. Discuss the causes of this disaster. Mention the features of two such major floods in the last two decades in India. Describe the policies and frameworks in India that aim at tackling such floods.","<b>2016 Q15:<\/b> The frequency of urban floods due to high intensity rainfall is increasing over the years. Discussing the reasons for urban floods, highlight the mechanisms for preparedness to reduce the risk during such events."]},{"id":"landslides","subj":"s05","name":"Landslides","cards":[{"path":[],"roles":["def","cause"],"rows":[{"t":"Approximately 12.6-15% of India’s landmass (0.42 million sq. km) is prone to landslides, covering the Himalayas, Western Ghats, Northeastern hill ranges, Nilgiris, Eastern Ghats, and Vindhyans.","h":"<b>Extent<\/b>:"},{"t":"intense rainfall/soil saturation, earthquake shaking, slope undercutting (rivers/roads), removal of vegetation/deforestation, weak geology/clinopyrite or clay layers, mining/blasting, rapid snow/ice melt.","h":"<b>Causes<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">reasons : Basalt rocks<\/span><br><span class=\"li\">High gradient<\/span><br><span class=\"li\">Deforestation and mining.<\/span><\/span>","h":"In western ghats :"}],"id":"landslides:def-main","v":"323da9","q":"How landslide-prone is India, and why do landslides happen, especially in the Western Ghats?"},{"path":[],"roles":["effect","eg"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">deaths and buried homes<\/span><br><span class=\"li\">roads, power lines and hydel projects cut off<\/span><br><span class=\"li\">debris dams rivers → flash floods downstream<\/span><br><span class=\"li\">farmland and topsoil lost<\/span><br><span class=\"li\">tourism and local economy hit<\/span><\/span>","h":"<b>Effects<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Recent instances : Sikkim (unplanned construction and hydel projects)<\/span><br><span class=\"li\">Uttarkashi landslide (heavy rain)<\/span><br><span class=\"li\">Wayanad<\/span><br><span class=\"li\">Aizawl (Mizoram (unscientific earth cutting )) → two to name: Wayanad, 30 July 2024 (Mundakkai–Chooralmala; extreme rain on steep, weathered slopes; 200+ dead)<\/span><br><span class=\"li\">Malin, Pune, July 2014 (village buried; hill slopes levelled for farming; ~150 dead)<\/span><\/span>","h":"<b>Examples<\/b>:"}],"id":"landslides:effect-main","v":"d2641c","q":"What do landslides do, with recent examples?"},{"path":[],"roles":["gov"],"rows":[{"t":"NDMA’s landslide management focuses on prevention, preparedness, and area-specific solutions. Key measures include hazard zone identification, slope stabilization (no construction if slope 30 degrees and above), and <mark>early warning<\/mark> systems, along with detailed hazard mapping.","h":"<b>NDMA guideline / scheme<\/b>:"},{"t":"Construction, road building, and large settlements are restricted in high-risk areas, and agriculture is limited to valleys or moderate slopes. Guidelines also cover excavation codes, landslide insurance, and compensation mechanisms to protect communities and infrastructure. + National landslide susceptible mapping + bhusanket web portal.","cont":1},{"t":"<span class=\"lst\"><span class=\"li\"><mark>National Landslide Risk Management Strategy<\/mark> (NDMA, Sept 2019): hazard mapping (GSI's National Landslide Susceptibility Mapping)<\/span><br><span class=\"li\">monitoring and early warning<\/span><br><span class=\"li\">awareness<\/span><\/span>"},{"t":"<span class=\"lst\"><span class=\"li\">capacity building and training<\/span><br><span class=\"li\">regulations and policies (mountain zone rules)<\/span><br><span class=\"li\">stabilisation and mitigation (Landslide Risk Mitigation Scheme, 2019)<\/span><\/span>","cont":1}],"id":"landslides:gov-main","v":"dc95dd","q":"NDMA&#x27;s landslide guidelines and the national strategy?"},{"path":[],"roles":["how","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">LHZ: divide hill terrain into zones by how likely landslides are → inputs: slope<\/span><br><span class=\"li\">geology<\/span><br><span class=\"li\">soil<\/span><br><span class=\"li\">drainage<\/span><\/span>","h":"Landslide <mark>hazard zonation<\/mark> mapping :"},{"t":"<span class=\"lst\"><span class=\"li\">land use<\/span><br><span class=\"li\">rainfall<\/span><br><span class=\"li\">past landslides (inventory) → made with GIS, satellite images, field checks<\/span><\/span>","cont":1},{"t":"Scales: macro 1:50,000 (GSI national map) → meso 1:10,000 (town planning) → site level (projects)","cont":1},{"t":"<span class=\"lst\"><span class=\"li\">Use: where not to build<\/span><br><span class=\"li\">road and dam alignment<\/span><br><span class=\"li\">building codes<\/span><br><span class=\"li\">where to put early warning sensors<\/span><\/span>","cont":1},{"t":"Afforestation, bunds, retaining walls, and terrace farming (especially in NE hill states) are promoted to reduce vulnerability.","h":"<b>Way forward<\/b>:"}],"title":"Landslide <mark>hazard zonation<\/mark> mapping :","id":"landslides:how-landslide-hazard-zonation-mapping","v":"15ceb0","q":"What is landslide hazard zonation mapping, at what scales, and its uses?"},{"path":[],"roles":["fact"],"rows":[{"t":"An avalanche is the rapid descent of a mass of snow, ice, rock, or debris down a mountain slope, triggered by natural or human-induced factors (causes Continuous snowfall increases snowpack weight, Rising temperatures cause freeze-thaw cycles, wetter snow, and glacier melt, Deforestation) (sol : Structural Measures: Snow Barriers and Fences, Avalanche Control Piles and Terraces, Deflecting Structures and Tunnels, Controlled explosions trigger small avalanches to prevent larger ones,The India Meteorological Department (IMD) and Snow and Avalanche Study Establishment (SASE) use satellite-based monitoring, Zoning and Land-Use Planning: Mapping high-risk areas (e.g., Red, Blue, Yellow Zones","h":"<b>Related<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">ground sinks as soil or rock below is compressed → groundwater pumping<\/span><br><span class=\"li\">mining<\/span><br><span class=\"li\">urbanisation<\/span><\/span>","h":"Land subsidence:"},{"t":"<span class=\"lst\"><span class=\"li\">crustal movement → Delhi, Mumbai, Kolkata, Bengaluru, Chennai sinking (~80 mn people; Delhi worst, 51 mm a year, >2,000 buildings at risk)<\/span><br><span class=\"li\">Joshimath, Mussoorie (unregulated building) → fix: artificial aquifer recharge<\/span><br><span class=\"li\">InSAR satellite monitoring<\/span><\/span>","cont":1}],"id":"landslides:fact-main","v":"61b6a2","q":"What is an avalanche, and what is land subsidence, where and the fix?","read":1}],"circle":"g","pyq":["<b>2021 Q18 (15 marks):<\/b> Describe the various causes and the effects of landslides. Mention the important components of the National Landslide Risk Management Strategy.","<b>2019 Q18 (15 marks):<\/b> Disaster preparedness is the first step in any disaster management process. Explain how hazard zonation mapping will help disaster mitigation in the case of landslides."]},{"id":"sturzstrom-hyper-mobility-rock-ice-avala","subj":"s05","name":"Sturzstrom (Hyper-Mobility Rock-Ice Avalanche)","cards":[{"path":[],"roles":["def","how","eg"],"rows":[{"t":"A massive, high-velocity mass movement where a large volume of bedrock/slope suddenly collapses and travels over an exceptionally long horizontal runout distance.","h":"Definition:"},{"t":"Initial rock-ice slope failure → rapid acceleration and fragmentation → frictional heat melts ice/firn, generating basal water lubrication → resistance drops drastically, transforming the avalanche into a catastrophic debris flow/flash flood within minutes.","h":"Mechanism:"},{"t":"Permafrost degradation, freeze-thaw cycles, steep structural joints, and climate-induced warming in high-mountain cryosphere zones.","h":"Key Drivers:"},{"sec":"Examples:"},{"t":"Bedrock failure beneath a hanging glacier released ≈25 million m3of rock and ice.","h":"Chamoli Disaster, Uttarakhand (2021):"},{"t":"Bhotekoshi–Trishuli Flood, Nepal (Langtang Lirung / Border Region): Rock-ice avalanche and <mark>permafrost<\/mark> collapse that devastated Rasuwa, Nuwakot, and Dhading districts."}],"id":"sturzstrom-hyper-mobility-rock-ice-avala:def-main","v":"2e8341","q":"What is a sturzstrom, how does it work, its drivers, and two examples?"}],"circle":"y"},{"id":"cloudburst","subj":"s05","name":"Cloudburst","cards":[{"path":[],"roles":["def","cause"],"rows":[{"t":"Specifically, it is classified when rainfall of about 10 cm or above per hour is recorded over an area roughly 20-30 sq km.","h":"<b>Definition<\/b>:"},{"t":"Cloudburst: intense convective convection over short duration, orographic uplift of moist air, stalled mesoscale convective systems, tropical cyclonic moisture influx, climate change-driven extreme events.","h":"<b>Causes / mechanism<\/b>:"},{"t":"Cloudbursts occur mainly in mountainous regions like the Himalayas, where orographic lift forces warm, moist air upward. This forms dense cumulonimbus clouds that trap continuous moisture in tall, vertical columns.","h":"Mechanism :"},{"t":"The cloud cannot release the water gradually because of its structure and constant inflow, so it eventually bursts, releasing an intense, localized downpour. This sudden release often causes flash floods and severe damage, as seen in the 2013 Uttarakhand floods. The process is driven by temperature and pressure differences, windward-leeward dynamics, and thermodynamic principles.","cont":1}],"id":"cloudburst:def-main","v":"07e6fc","q":"What counts as a cloudburst, and how does it form?","read":1},{"path":[],"roles":["effect","eg"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">flash floods<\/span><br><span class=\"li\">landslides and debris flows<\/span><br><span class=\"li\">roads, bridges and hydel projects washed away<\/span><br><span class=\"li\">pilgrims and tourists trapped<\/span><\/span>","h":"<b>Effects<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">eg. In July 2021, Uttarakhand, a northern Indian state, experienced severe cloudbursts across multiple districts, including Chamoli, Uttarkashi, and Pithoragarh. These cloudbursts triggered flash floods<\/span><br><span class=\"li\">Recent: Mandi, Himachal (June–July 2025, many cloudbursts in one night)<\/span><br><span class=\"li\">Chasoti, Kishtwar, J&K (Aug 2025, pilgrims on the Machail yatra route, ~65 dead)<\/span><\/span>","h":"<b>Examples<\/b>:"}],"id":"cloudburst:effect-main","v":"e4b9f2","q":"What do cloudbursts do, with recent examples?"},{"path":[],"roles":["gov","fix"],"rows":[{"t":"Safe Settlement: Advise people to settle on hard rock or firm ground, Infiltration Control: Implement measures to control water infiltration, Vigilance and Reporting, Regulating Construction, Develop effective rainwater drainage systems, both surface and sub-surface, and use bioengineering techniques with local vegetation to reduce soil erosion and instability","h":"<b>NDMA measures<\/b>:"},{"t":"Way Forward: Cloudburst Disaster Risk Reduction (DRR) Strategy – National Disaster Management Plan (2019) • Landslide Hazard Zonation (LHZ): Using remote sensing and different kinds of spatial data (aerial photographs, satellite imagery) along with local knowledge for accurate mapping of landslide-prone area,\\\\ Inter-agency Coordination: Coordination between central and state agencies for updating rules, adopting new, standards, amending laws, and reviewing policies, Ensure effective <mark>early warning<\/mark> dissemination down to the last mile.","h":"<b>Way forward<\/b>:"},{"t":"o Slope stabilization through bioengineering (plantation, vegetation), and protective structures. o Maintenance and improvement of stormwater drainage, rivulets, and natural water systems to reduce flooding risks.","h":"Structural Measures:"},{"t":"o Expansion of multi-hazard insurance for life and property. o Integration of risk-sensitive urban planning: amending building by-laws to reduce vulnerability. o Application of multi-level safety planning in expanding and high-risk settlements, Capacity Development: Strengthen ULBs/PRIs to prepare and respond effectively and encourage use of insurance and risk transfer tools, Climate Change Risk Management: Support and promote state-specific and local adaptation efforts.","h":"Non-Structural Measures:"}],"id":"cloudburst:gov-main","v":"ce769c","q":"NDMA measures and the way forward on cloudbursts?","read":1},{"path":[],"roles":["fact","news"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\"><b> monsoon extremes<\/b>: Changing monsoon: winds weaker but air holds more moisture → short, intense bursts<\/span><br><span class=\"li\">long dry spells<\/span><br><span class=\"li\">El Niño–monsoon link weakening<\/span><br><span class=\"li\">wet areas drier, dry areas wetter (Ganga states less rain; Saurashtra, Rajasthan more)<\/span><\/span>","h":"<b>Related:<\/b>"},{"t":"<span class=\"lst\"><span class=\"li\">Punjab floods<\/span><br><span class=\"li\">Uttarakhand, HP, J&K landslides and flash floods<\/span><\/span>","h":"News:"},{"t":"<span class=\"lst\"><span class=\"li\">disasters<\/span><br><span class=\"li\">heat and dengue<\/span><br><span class=\"li\">harder forecasting<\/span><br><span class=\"li\">monsoon feeds 51% of farm area, 40% of farm output, 47% of livelihoods<\/span><\/span>","h":"Impact:"}],"title":"<b>Related:<\/b>","id":"cloudburst:fact-related","v":"2d7038","q":"How is the monsoon changing, the recent news, and its impact?"}],"circle":"g","pyq":["<b>2022 Q8 (10 marks):<\/b> Explain the mechanism and occurrence of cloudburst in the context of the Indian subcontinent. Discuss two recent examples.","<b>2016 Q16 (12.5 marks):<\/b> With reference to National Disaster Management Authority (NDMA) guidelines, discuss the measures to be adopted to mitigate the impact of recent incidents of cloudbursts in many places of Uttarakhand."]},{"id":"lightning","subj":"s05","name":"Lightning","cards":[{"path":[],"roles":["def","cause"],"rows":[{"t":"In March–April 2025, lightning killed over 160 people across 12 states—a 184% increase over the previous year. Bihar and Uttar Pradesh were worst affected, with most deaths concentrated in rural areas.","h":"<b>Extent<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">pre-monsoon heat<\/span><br><span class=\"li\">moisture → tall cumulonimbus clouds → more lightning as the climate warms<\/span><\/span>","h":"<b>Causes<\/b>:"}],"id":"lightning:def-main","v":"39400d","q":"How deadly is lightning in India now, and why is it rising?"}
