e are used in a liquid polymer that hardens on ballistic impact, a technology known as Shear Thickening Fluid","h":"Body Armor:"},{"t":"Nanotechnology is being used to modify materials like aluminum so it performs like titanium but without the added weight","h":"Advanced Weapons/Equipment:"},{"t":"Nanomedicines and nano-bandages are being developed for wound healing","h":"Health Aid:"},{"sec":"<b><u>Ethical & Security Concerns<\/u><\/b>"},{"t":"Nanowars: The widespread availability of nano-weapons could lead to a new age of destruction, also referred to as “nanowars” + Misuse: These devices could be used for criminal activity and terrorist attacks + Regulation: The development of medical applications to improve soldier performance requires careful regulation","h":"Challenges :"}],"title":"NANOTECH IN DEFENCE","id":"nanotech:use-nanotech-in-defence","v":"912c78"}]},{"id":"graphene","subj":"s07","name":"GRAPHENE","cards":[{"path":[],"roles":["def"],"rows":[{"t":"Graphene is an allotrope of carbon, discovered in 2004 by Geim and Novoselov. It is a single, 2D layer of carbon atoms arranged in a hexagonal lattice. Its production methods include Chemical Vapor Deposition, graphite cleavage, exfoliation, and hydrogen arc discharge. China and Brazil are the leading producers, with India producing about onetwentieth of China’s output.","h":"Meaning :"},{"t":"Graphene possesses several key properties that make it a highly valuable material. It is exceptionally strong, being 200 times stronger than steel, yet it is also six times lighter. Graphene is transparent, as it absorbs only 2.3% of light, which is ideal for displays and solar cells. It is also impermeable, blocking all gases including hydrogen and helium. The material exhibits unique quantum effects, useful in fields like metrology and quantum computing","h":"Characteristics :"}],"title":"Material Properties","id":"graphene:def-material-properties","v":"431d62"},{"path":[],"roles":["use","gov","issue"],"rows":[{"t":"In electronics, it can be used to create faster and more efficient semiconductors, potentially replacing silicon. It is also used in nanoporous membranes for water filtration and desalination. In the biomedical field, it finds use in tissue engineering, drug delivery, and biosensors.","h":"Uses :"},{"t":"Graphene can enhance energy storage through its use in high-capacity batteries and supercapacitors. For environmental purposes, its ability to absorb liquids makes it useful for cleanup. In defense, its strength makes it suitable for armor and ballistic protection","cont":1},{"sec":"Indian Initiatives & Hurdles"},{"t":"Graphene-Aurora program aims to bridge the gap between research and development (R&D) and commercialization + India Innovation Centre for Graphene (IICG) has been set up in Kerala + India Graphene Engineering and Innovation Centre (IGEIC) was launched under the vision of Viksit Bharat@2047","h":"Intiatives:"},{"t":"The main challenge to its commercialisation is the adoption rate and the fact that silicone just works and the market doesn’t easily displace something that works for something that is 50% better it should be better in all respects not to say that it hasn’t come far from its discovery in 2004, companies like vorbeck materials + high cost + manuf integration + lack of standardisation","h":"Challenges:"}],"title":"Industrial Uses","id":"graphene:use-industrial-uses","v":"c11fc4"}]},{"id":"nanozymes","subj":"s07","name":"NANOZYMES","cards":[{"path":[],"roles":["def","how"],"rows":[{"t":"Nanozymes are a class of nanomaterials that possess intrinsic, enzyme-like catalytic activity, effectively acting as stable and low-cost artificial enzymes."},{"t":"Unlike natural enzymes, which are fragile proteins sensitive to temperature and pH , nanozymes (often made of metal oxides, noble metals, or carbon materials) are highly robust, durable, and easier to manufacture."},{"t":"They work by mimicking the function of natural enzymes, such as peroxidase or catalase, to speed up chemical reactions, which has led to a surge in applications, including developing highly sensitive biosensors for medical diagnostics, creating new therapies for diseases by regulating oxidative stress, degrading environmental pollutants, and acting as potent antibacterial agents."}],"id":"nanozymes:def-main","v":"34cbe8"}]},{"id":"space-economy-significance","subj":"s08","name":"SPACE ECONOMY & SIGNIFICANCE","cards":[{"path":["general"],"roles":["use"],"rows":[{"t":"India’s space economy is valued at $8.4 billion aims to grow this to $44 billion by 2033,, making up 2% of the global space market. It has significantly contributed to the nation’s economy and job growth, with a contribution of 20,000 crore to GDP in the last decade and the creation of 96,000 jobs"},{"t":"India’s space program is crucial for national security and has significant socioeconomic benefits. It plays a key role in digitization through systems like NavIC (Navigation with Indian Constellation), which provides India with a regional navigation system and ensures self-reliance. Additionally, missions like Chandrayaan-3 and Earth Observation Satellites (EOS-08) contribute to scientific research and disaster management. + Swavimta scheme leverages satellites for transparent land record + Space diplomacy (NASA-ISRO convergence on NISAR)"},{"t":"Space for Viksit Bharat 2047 (Lok Sabha held a special discussion on it) : every sector problem has a space solution → Agriculture (erratic monsoon, poor crop forecasting) : INSAT-3D/3DR for weather forecasting + Resourcesat for crop monitoring and yield estimation + Infrastructure : PM Gati Shakti uses ISRO imagery & spatial tools to integrate Bharatmala, Sagarmala, railways + Disaster : ISRO's Disaster Management Support (DMS) Programme (real-time monitoring, early warning, post-disaster assessment) + Education : EDUSAT (distance education broadcasting) + Transparency : geo-tagging of MGNREGA assets (stops leakages) + Water : Bhuvan–SRISHTI geoportal monitors watershed (IWMP) projects"},{"t":"NISAR = \"India's scientific handshake with the world\" + Regional leadership : South Asia Satellite (GSAT-9) for South Asia (except Pakistan) + Data sharing : Chandrayaan-3 datasets open on PRADAN (Policy based data Retrieval, Analytics, Dissemination and Notification system) + Capacity building : UNNATI (UNispace Nanosatellite Assembly & Training by ISRO) trains other countries on nanosatellites + Humanitarian : ISRO is a member of COSPAS–SARSAT (international satellite-based search and rescue system)","h":"Space makes India Vishwabandhu :"},{"t":"bottom up approach + Despite having limited resources, ISRO has achieved remarkable success through cost-effective, indigenous missions. For example, the Mars Orbiter Mission cost only $74 million, a fraction of NASA’s mission budget. About 95% of space components in Indian rockets are indigenously developed. Partnerships and collaborations with other space agencies like ESA and CNES have also been a key to its success","h":"Reasons of success :"}],"title":"general","id":"space-economy-significance:use-general","v":"ed7de8"},{"path":["SPACE CHALLENGES"],"roles":["issue"],"rows":[{"t":"The sector still faces several challenges, including a heavy dependence on imported components like semiconductors."},{"t":"The absence of an Indian Space Quality Standard can lead to inconsistencies and reduced trust in domestically produced parts.","cont":1},{"t":"The space program also faces increasing competition from private companies globally and a shortage of skilled workforce to meet the demands of an expanding program","cont":1},{"sec":"KEY PROJECTS & TECHNOLOGIES RELATED TO SPACE","tg":1},{"t":"Astronaut Health: NASA observes weight-bearing bone loss of 1% to 1.5% per month in microgravity","h":"main problem of manned missions in microgravity :"},{"sec":"problems of crewed mission","tg":1},{"t":"Life support system (must ensure air regeneration), beyond LEO (Radiation protection), During re-entry, spacecraft face temperatures up to 7,000°F, Human-rated rockets must meet stricter safety standards, Manned space missions incur higher costs, Training and selection of astronauts"}],"title":"SPACE CHALLENGES","id":"space-economy-significance:issue-space-challenges","v":"7c95e1"},{"path":["PRIVATIZATION IN SPACE"],"roles":["gov","issue"],"rows":[{"t":"India’s space economy is projected to grow significantly, reaching a valuation of $50 billion and a 10% share of the global commercial space economy by 2030 , largely driven by privatization, Could free up ISRO for more R&D type stuff + privatisation will keep ISRO competitive."},{"t":"How aims to achieve this ?","cont":1},{"t":"IN-SPACe, an autonomous agency, was established to support private players. & New Space India Limited (NSIL) handles ISRO’s commercial activities and 100% FDI in manufacturing components but it is plagues because of multiplicity of regulations + risky nature of industry and limited access to launch vehicles","cont":1}],"title":"PRIVATIZATION IN SPACE","id":"space-economy-significance:gov-privatization-in-space","v":"5ae6ce"},{"path":["PRIVATE SECTOR INNOVATIONS"],"roles":["news"],"rows":[{"t":"Indian private space-tech company Pixels launched India’s first private satellite constellation ‘Firefly’ (Pixxel’s flagship Hyperspectral Imaging_(HSI). satellite constellation)."},{"t":"HSI analyses a wide spectrum of light instead of just assigning primary colours (red, green, blue) to each pixel, effectively spectrally fingerprinting the Earth. While a typical satellite can identify a forest from space, HSI can distinguish between different types of trees and determine health of each individual tree. Applications include : water recycling and sorting, agriculture, soil mapping, environmental monitoring, mineral explosion."},{"sec":"PRIVATIZATION IN SPACE","tg":1},{"t":"Pixxel successfully launched three new Firefly satellites aboard the SpaceX NAOS Falcon 9 mission completing the first phase of its commercial constellation."},{"t":"PixxelSpace India-led Consortium has won the IN-SPACe proposal to build India’s first fully indigenous commercial Earth Observation Satellite System (EOSS) under PPP model"}],"title":"PRIVATE SECTOR INNOVATIONS","id":"space-economy-significance:news-private-sector-innovations","v":"712032"},{"path":["FUTURE MISSIONS"],"roles":["news"],"rows":[{"t":"India’s key future space missions include Chandrayaan-4, which aims to bring rock and soil samples back from the moon; the Gaganyaan Mission, India’s first human spaceflight; the Bharatiya Antariksh Station, a planned space station to be operational by 2035 ; the Venus Orbiter Mission (Shukrayaan) to study Venus’s atmosphere; and the Lunar Polar Exploration Mission in collaboration with JAXA to explore the Moon’s South Pole region"},{"sec":"KEY PROJECTS & TECHNOLOGIES RELATED TO SPACE","tg":1},{"t":"BAS is India’s planned space station for scientific research which will orbit around 400-450 km above the Earth’s surface, It will have five modules and will be built in phases, Targets: operationalized by 2035."}],"title":"FUTURE MISSIONS","id":"space-economy-significance:news-future-missions","v":"ba7099"},{"path":["KEY PROJECTS & TECHNOLOGIES RELATED TO SPACE","Artemis II"],"roles":["news"],"rows":[{"t":"Crewed Lunar Flyby Mission under the NASA’s Artemis Program(to return to moon)"},{"t":"Space Launch System (SLS)","h":"Launch Vehicle:"},{"t":"1) crew flight 2) emergency system capabilities 3) go to moon","h":"objectives :"},{"t":"1) yay moon 2) safety in deep space 3) woman + 1st non american (Canadian Space Agency's Jeremy Hansen) 4) geological observation of the moon (lava flows and carters) 5) Astronaut Health Studies: ARCHeR (to monitor astronauts' well-being, activity, and sleep), AVATAR (Uses organ-on-a-chip devices to study the effects of microgravity and increased radiation on the health of the crew).","h":"signifiacene :"}],"title":"Artemis II","id":"space-economy-significance:news-artemis-ii","v":"103f6a"},{"path":["KEY PROJECTS & TECHNOLOGIES RELATED TO SPACE"],"roles":["news"],"rows":[{"t":"(eg subhanshu Shukla in AXIOM-4) ( 4th private astronaut mission (NASA + ISRO + AXIOM) (India, Poland, and Hungary.) ( aims to achieve via this mission :"},{"h":"Crop growth:","t":"<span class=\"lst\"><span class=\"li\">Study impact of microgravity on 6 crop seed varieties for future space farming<\/span><br><span class=\"li\">Cyanobacteria ( Cyanobacteria are aquatic bacteria that can photosynthesize): Observe growth and activity<\/span><br><span class=\"li\">Space Microalgae (potential as food)<\/span><br><span class=\"li\">myogensis (muscle loss study )<\/span><\/span>"}],"id":"space-economy-significance:news-key-projects-technologies-related-to-spa","v":"4eb864"},{"path":["KEY PROJECTS & TECHNOLOGIES RELATED TO SPACE"],"roles":["how"],"rows":[{"t":"development of gqgayaan’s mission ( will use GSLV MARK III (3 stage rocket ( 2 solid fuel booster (Solid propellant (solid rocket fuel) is a mixture of fuel + oxidizer bound together in a solid grain. Once ignited, it burns in a controlled way, producing hot gases expelled through a nozzle to generate thrust)"},{"t":"2 liquid fuelled Vikas 2 engine","h":"2 nd stage :"},{"t":"CE-20 indigenous cryogenic engine (liquid H2 and O2 as fuel) to put into A Geosynchronous Transfer Orbit (GTO) (which is used to efficiently place satellites into geosynchronous orbit (~35,786 km altitude).","h":"3rd stage :"},{"t":"Going directly to such a high orbit would require huge amounts of rocket fuel, so GTO saves energy.","h":"Why:"},{"t":"The rocket first puts the satellite into a long, oval-shaped orbit where the low point (perigee) is close to Earth and the high point (apogee) reaches geosynchronous height. When the satellite reaches apogee, it fires its own engine to raise the low point and make the orbit circular.","h":"How:"},{"t":"Mostly for communication, weather, and navigation satellites that need to stay fixed relative to one spot on Earth.)","h":"For what:"}],"id":"space-economy-significance:how-key-projects-technologies-related-to-spa","v":"cd95e4"},{"path":["KEY PROJECTS & TECHNOLOGIES RELATED TO SPACE"],"roles":["news"],"rows":[{"t":"The Space Docking Experiment (SPADEX) is an ISRO mission to demonstrate autonomous docking between two spacecraft in orbit."},{"t":"It involves a chaser and a target satellite, where the chaser approaches, aligns, and connects with the target without human control."},{"t":"This technology is vital for future projects like assembling large structures in space, refueling satellites, and supporting the Indian Space Station. The experiment also helps India build capabilities for long-duration human space missions."},{"t":"An indigenous tech called A GNSS-based RODP (Novel Relative Orbit Determination and Propagation (RODP) ) processor is a small onboard computer that figures out, in real time, where the chaser spacecraft is relative to the target (position) and how fast it’s moving relative to it (velocity)."}],"id":"space-economy-significance:news-key-projects-technologies-related-to-spa-2","v":"002006"},{"path":["KEY PROJECTS & TECHNOLOGIES RELATED TO SPACE"],"roles":["news"],"rows":[{"t":"ISRO’s Third Launch Pad (TLP) at Sriharikota is being developed to handle heavier and more frequent launches, including Gaganyaan human spaceflight missions."},{"t":"It will have advanced crew access towers, emergency escape systems, and upgraded fueling and integration facilities."},{"t":"The pad is designed to support future heavy-lift rockets beyond LVM-3 and support Next generation launch vehicles (NGLV) (Current PSLV/GSLV use a mix of solid, earth-storable liquid, and cryogenic stages and now NGLV will use semi-cryogenic engines (LOX + kerosene) for the core stage → cleaner, cheaper, and more efficient with higher thrust), improve turnaround time between launches, and enhance safety by separating human-rated missions from routine commercial or scientific launches."}],"id":"space-economy-significance:news-key-projects-technologies-related-to-spa-3","v":"5a541b"},{"path":["KEY PROJECTS & TECHNOLOGIES RELATED TO SPACE"],"roles":["def","use"],"rows":[{"t":"NISAR (ISRO + NASA) (sun-synchronous satellite) (NASA provided L-BAND (GPS, High rate telecomm sys, solid state recorder and 12 meter deployable antenna) ISRO contirb (S Band; spacecraft bus, GSLV-F16 launch vehicle)"},{"t":"Produces high-resolution, wide-swath images across a broad range of terrain.","h":"SweepSAR (Swept Synthetic Aperture Radar):"},{"t":"In SAR, an instrument sends out a pulse of energy and then records the amount of that energy reflected back after it interacts with Earth."},{"t":"Provides high-resolution data every 12 days to monitor land changes across Earth.","h":"Repeat Cycle:"},{"t":"The satellite features a large, 12-metre diameter common unfurlable reflector antenna.","h":"Antenna and Resolution:"},{"t":"Information collected will be freely available to global scientific communit","h":"Open-Data Policy:"},{"img":10}],"id":"space-economy-significance:def-key-projects-technologies-related-to-spa","v":"ad9178"},{"path":["KEY PROJECTS & TECHNOLOGIES RELATED TO SPACE"],"roles":["news"],"rows":[{"t":"INSAT D/3DR (provide weather forecasting resource satelitte)"},{"t":"ISRO’s HOPE (himalyan outpost for planetary exploration) (Tso kar valley)"},{"t":"A specially designed Habitat Module for crew living and a Utility Module for operations and support systems which are interconnected for seamless workflow"},{"t":"ASTROSAT (to study celestial objects across X-rays, ultravoilet, optical wavelength simulatenously and launched via PSLV-C30 from sriharikota)"},{"t":"Light doesn’t just have brightness (how strong it is), it also has a “vibration direction” called polarisation. Polarimetry means studying this direction of vibration. Why useful? Because when light passes through gas, dust, or strong magnetic fields in space, its polarisation changes."},{"t":"By measuring that change, scientists can learn about what the light has passed through and the nature of stars, black holes, and galaxies. Example: Two stars may look the same brightness, but polarimetry can show one is surrounded by dust while the other isn’t.","cont":1}],"id":"space-economy-significance:news-key-projects-technologies-related-to-spa-4","v":"9e2c8c"},{"path":["KEY PROJECTS & TECHNOLOGIES RELATED TO SPACE","Technology demonstrator satellitte 01 and high thrust electric propulsion"],"roles":["how"],"rows":[{"t":"Currently, when a rocket drops a communication satellite into space, the satellite is not yet in its final resting place. It has to travel from a temporary transfer orbit up to a Geostationary Orbit (about 36,000 km high). Once there, it has to constantly fire small thrusters to maintain its position against the gravitational pull of the moon and the sun (a process called \"station-keeping\")."},{"t":"<b>Chemical rockets<\/b> do this by mixing heavy liquid fuels and oxidizers, setting them on fire, and blowing the resulting explosion out the back."},{"t":"Because chemical combustion is highly inefficient in space, a standard 4-ton satellite requires about <b>2 to 2.5 tons<\/b> of heavy liquid fuel just to survive its 15-year lifespan. You are essentially spending millions of dollars to launch a giant, floating gas tank."},{"t":"Electric propulsion completely abandons fire and combustion. Instead, it relies on electricity and electromagnetism to generate thrust. ISRO's system specifically uses a <b>Stationary Plasma Thruster (SPT)<\/b>.","h":"solution = Electric Propulsion :"},{"sec":"Here is the step-by-step mechanism:"},{"t":"Instead of heavy liquid chemicals, the satellite carries a small amount of an inert gas, like <b>Argon<\/b> or <b>Xenon<\/b> (roughly 200 kg).","h":"<b>The Fuel:<\/b>"},{"t":"The satellite's massive solar panels capture sunlight and convert it into high-voltage electricity.","h":"<b>The Power:<\/b>"},{"t":"This electricity is used to strip electrons away from the Argon gas atoms, turning the neutral gas into a highly charged \"plasma\" of positive ions.","h":"<b>Ionization:<\/b>"},{"t":"The engine uses powerful electromagnetic fields to accelerate these charged ions out the back of the engine at mind-boggling speeds (up to 30 to 50 kilometers <i>per second<\/i>—vastly faster than the exhaust of a chemical rocket).","h":"<b>The Thrust:<\/b>"}],"title":"Technology demonstrator satellitte 01 and high thrust electric propulsion","id":"space-economy-significance:how-technology-demonstrator-satellitte-01-an","v":"7de484"},{"path":["KEY PROJECTS & TECHNOLOGIES RELATED TO SPACE","Technology demonstrator satellitte 01 and high thrust electric propulsion"],"roles":["use","issue"],"rows":[{"t":"In rocket science, fuel efficiency is measured by <b>Specific Impulse (Isp)<\/b>. It measures how much thrust you get out of every single drop of fuel. Because electric thrusters shoot particles out at such extreme velocities, their specific impulse is <b>5 to 6 times higher<\/b> than chemical rockets."},{"t":"You are getting vastly more momentum out of a single atom of Argon than you would from a massive drop of liquid fuel. Therefore, you simply do not need to carry as much physical mass to do the same amount of work in space.","cont":1},{"t":"cost and capacity and lifespan","h":"adv :"},{"t":"LOW THRUST (A chemical thruster provides a massive, violent push that gets a satellite to its final orbit in roughly <b>one week<\/b>. An electric thruster provides a gentle, continuous push. It will take the TDS-01 <b>up to three months)<\/b>","h":"disadv :"}],"title":"Why 2 Tons Drops to 200 Kg (The Concept of Specific Impulse)","id":"space-economy-significance:use-why-2-tons-drops-to-200-kg-the-concept-o","v":"d5b64b"},{"path":["KEY PROJECTS & TECHNOLOGIES RELATED TO SPACE","Radioisotope Thermoelectric Generators - RTG"],"roles":["how","use"],"rows":[{"t":"Solar panels are great for Earth-orbiting satellites. However, if you want to send a mission to the dark side of the Moon, to deep space (like Jupiter), or survive the freezing 14-day Lunar Night (which effectively \"froze\" the Chandrayaan-3 rover), solar power is useless.","h":"<b>The Problem:<\/b>"},{"t":"ISRO, in collaboration with the Bhabha Atomic Research Centre (BARC), is developing RTGs. These are essentially nuclear batteries. They do not use fission like a power plant; instead, they use the natural heat released by the decay of a radioactive material (like Plutonium-238). Thermocouples then convert this heat directly into electricity.","h":"<b>The Solution:<\/b>"},{"t":"It provides a reliable, continuous power source for decades, independent of sunlight. This technology is absolutely essential for India's upcoming deep planetary missions and for sustaining the future Bharatiya Antariksh Station.","h":"<b>Why it matters:<\/b>"}],"title":"Radioisotope Thermoelectric Generators - RTG","id":"space-economy-significance:how-radioisotope-thermoelectric-generators-r","v":"39b8c2"},{"path":["LAUNCH VEHICLES"],"roles":["fact"],"rows":[{"t":"India’s first experimental orbital launcher developed in the 1970s (small lift ~40 kg ).","h":"SLV-3 -"},{"t":"Improved SLV predecessor to PSLV (upgraded solid stages).","h":"ASLV (Augmented SLV) -"},{"t":"Four-stage workhorse for placing small-to-medium payloads in polar/SSO/LEO; highly reliable but not for heavy GTO missions.","h":"PSLV -"},{"t":"Early three-stage GTO launcher using a Russian cryogenic upper stage; limited payload and low success rate.","h":"GSLV Mk I -"},{"t":"Improved Mk I with an indigenous CE-7.5 cryogenic engine; ~2.5 t to GTO capability.","h":"GSLV Mk II -"},{"t":"Now called LVM-3; India’s most powerful operational launcher, heavy-lift with CE-20 cryogenic stage.","h":"GSLV Mk III -"},{"t":"New name for GSLV Mk III, used for Chandrayaan-2/3 and planned for Gaganyaan human spaceflight. (Max capacity : 4000 kg ) (a new navy related GSAT-7R will replace GSAT-7 for navy)","h":"LVM-3 -"},{"t":"Small Satellite Launch Vehicle for quick, low-cost launches of payloads up to ~500 kg to LEO; minimal infrastructure.","h":"SSLV -"}],"title":"LAUNCH VEHICLES","id":"space-economy-significance:fact-launch-vehicles","v":"84d5a4"},{"path":["LAUNCH VEHICLES"],"roles":["fact"],"rows":[{"t":"Future modular, semi-cryogenic, partially reusable rocket for heavier, cheaper, and faster-turnaround launches.","h":"NGLV -"},{"t":"New super-heavy launch vehicle for crewed lunar missions / deep-space (~80 t to LEO) - announced in Aug 2025. improved version of next gen launch vehicle","h":"LMLV -"},{"t":"Human-rated variant of LVM-3 (for Gaganyaan).","h":"HRLV (Human Rated Launch Vehicle) -"},{"t":"Technology Demonstrator (RLV-TD) - Winged spaceplane testbed (not a full orbital rocket).","h":"Reusable Launch Vehicle -"},{"h":"VIKRAM -1 Developer:","t":"Skyroot Aerospace — a private Indian space-startup based in Hyderabad India’s new private orbital-class launch vehicle."}],"title":"These are under development or demonstrators:","id":"space-economy-significance:fact-these-are-under-development-or-demonstra","v":"632126"},{"path":["LAUNCH VEHICLES"],"roles":["how"],"rows":[{"t":"A geostationary satellite is a satellite that orbits the Earth at the same speed that the Earth rotates, so it appears to stay fixed over one point on the equator.<br>It orbits at an altitude of about 35,786 km and takes 24 hours to complete one revolution - exactly the same time the Earth takes to rotate once.","h":"What does G stand for ?"},{"t":"Geosynchronous satellite means a satellite that orbits the Earth once every 24 hours, matching the Earth’s rotation period. Because its orbital period is the same as Earth’s rotation, it always stays above the same longitude but not necessarily the same spot - if its orbit is tilted or elliptical, it appears to move in a figure-8 pattern in the sky. So, while it’s “synchronized” with Earth’s rotation (geo + synchronous), it isn’t “stationary.”"},{"t":"Geosynchronous Transfer Orbit (GTO) is an elliptical orbit used to move a satellite from low Earth orbit (LEO) to a geosynchronous or geostationary orbit.<br>Here’s how it works"},{"t":"A rocket first places the satellite into LEO (a few hundred km above Earth)."},{"t":"Then it gives a boost to place it in an elliptical orbit - the GTO where:"},{"t":"The perigee (closest point to Earth) is near LEO, The apogee (farthest point) reaches geostationary altitude (~35,786 km)."},{"t":"When the satellite reaches the apogee, its onboard thrusters fire to circularize the orbit, converting the GTO into a geosynchronous (or geostationary) orbit."},{"img":11}],"title":"What does G stand for ?","id":"space-economy-significance:how-what-does-g-stand-for","v":"9d56b3"},{"path":["LAUNCH VEHICLES"],"roles":["how"],"rows":[{"t":"A Polar Sun-Synchronous Satellite (often just called a Sun-synchronous satellite) orbits the Earth in such a way that it:","h":"What is polar sun synchronous ?"},{"t":"Moves nearly over the poles (North and South) - that’s the polar part."},{"t":"Crosses the same region of Earth at the same local solar time each day - that’s the sun-synchronous part. So, it combines a polar orbit + sun-synchronous timing → allowing consistent sunlight conditions for observation. How it moves:"},{"t":"The satellite travels north-south while the Earth rotates east-west beneath it."},{"t":"Over time, the satellite passes over every part of the Earth as the planet spins."},{"t":"<span class=\"lst\"><span class=\"li\">Its orbit is tilted at about 98° to the equator (slightly retrograde).<\/span><br><span class=\"li\">It orbits at an altitude of around 600-800 km<\/span><\/span>"}],"title":"What is polar sun synchronous ?","id":"space-economy-significance:how-what-is-polar-sun-synchronous","v":"e367a6"},{"path":["SOLAR MISSION & ORBITAL MECHANICS"],"roles":["news","how"],"rows":[{"t":"Aditya L1 (1st ever image of solar kernel) (study suns corona (outermost layer) + solar emissions + coronal mass ejections (A coronal mass ejection (CME) is a massive explosion of plasma and magnetic fields from the Sun’s outer atmosphere, known as the corona.) at L1 ( Lagrange point 1 : A Lagrange point is one of five unique points of gravitational equilibrium in a two-body system, such as the Sun-Earth system."},{"t":"At these points (labeled L1 through L5), the gravitational pulls of the two large bodies and the centripetal force required to orbit with them perfectly balance. This makes them excellent “parking spots” for spacecraft because they require very little fuel for station-keeping to remain in a fixed position relative to the two larger bodies","cont":1},{"t":"A spacecraft in Lagrange point like L1 or L2 is indeed in equilibrium, but a precarious one. It’s like balancing a pencil on its tip. It will remain there if everything is perfect, but the slightest disturbance will cause it to fall.","h":"Halo orbit :"},{"t":"So, while the Lagrange point offers a “parking spot” with a favorable gravitational balance, the halo orbit around it, maintained by minimal fuel use, provides a stable and continuous presence. (Useful for 3 body system)","cont":1},{"img":12}],"title":"SOLAR MISSION & ORBITAL MECHANICS","id":"space-economy-significance:news-solar-mission-orbital-mechanics","v":"1023d3"},{"path":["SPACE GOVERNANCE & DEBRIS MANAGEMENT"],"roles":["gov","issue"],"rows":[{"t":"The foundation of modern space law is the Outer Space Treaty of 1967. Other key international agreements include the Registration Convention and the Rescue and Return Agreement.","h":"Governance :"},{"t":"In recent times, new frameworks have emerged to address modern challenges, such as NASA’s Artemis Accords, which India is a signatory to. The accords, though nonbinding, establish principles for cooperation in lunar and planetary exploration."},{"t":"Additionally, to manage the increasing issue of space debris, a Zero Debris Charter (Space debris objects larger than 1 cm in size (Large enough to be capable of causing catastrophic damage) is estimated to be over 1.2 million (ESA Space Environment Report 2025)"},{"t":"+ The unchecked growth of debris could lead to a self-sustaining cascade of collisions known as the Kessler syndrome."},{"t":"To address this, global initiatives include the Inter-Agency Debris Coordination Committee (IADC) and the UN’s Space Debris Mitigation Guidelines. India is also taking action with its Debris Free Space Missions (DFSM) 2030 and the ISRO System for Safe and Sustainable Operations Management (IS4OM).) has been signed by 12 countries."},{"t":"(Mitigation tech : ClearSpace-1 (ESA) Set for launch in 2025, this mission aims to actively remove an existing debris object using a robotic arm-marking the first commercial demonstration of such ADR (Active Debris Removal) capability."},{"t":"Startups Orbital Lasers (Japan) and InspeCity (India) are exploring satellites with onboard lasers that vaporize parts of debris to slow its spin, making it easier to capture. And project NETRA of india Phased-array radars, telescopes, and control centers for independent debris tracking and collision alerts)"}],"title":"SPACE GOVERNANCE & DEBRIS MANAGEMENT","id":"space-economy-significance:gov-space-governance-debris-management","v":"61222a"},{"path":["SPACE SURVEILLANCE"],"roles":["use","issue"],"rows":[{"t":"Space-based surveillance (SBS) uses satellites and other space assets to monitor activities on Earth and in space, with components that include various types of satellites like those with synthetic aperture radar (e.g., RISAT series), ground control stations eg NASA’s deep space network, space surveillance networks eg Russia’s Korona radar, and tracking and telemetry systems.","h":"Space surveillance :"},{"t":"This technology is significant for national security e.g., EMISAT provides for intercepting signals, space traffic management (e.g., ISRO’s NETRA), asset protection (defend satellites (e.g., Mission Shakti ASAT test), and environmental monitoring."},{"t":"However, concerns exist about dual-use risks, potential militarization like arms race, and privacy issues."},{"t":"In India, the recently approved SBS-3 project will use a fleet of 52 AI -based satellites in both LEO and GEO to gather geointelligence for land, sea, and air missions, building on previous phases that focused on basic and maritime surveillance."}],"title":"SPACE SURVEILLANCE","id":"space-economy-significance:use-space-surveillance","v":"07730e"},{"path":["INDIAN SPACE POLICY 2023"],"roles":["gov"],"rows":[{"t":"The <b>Indian Space Policy 2023<\/b> is a landmark document that officially transitions India's space sector from a tightly controlled, government-monopolized model into a liberalized, commercially driven ecosystem."},{"t":"ISRO (Indian Space Research Organisation), IN-SPACe (Indian National Space Promotion and Authorisation Centre): NSIL (NewSpace India Limited), Department of Space (DoS) (The overarching nodal department responsible for implementing the policy,)","h":"The Four-Pillar Institutional Framework :"},{"h":"Unlocking the Private Sector (NGEs)","t":"The policy officially categorizes private companies as Non-Governmental Entities (NGEs) and allows them to undertake <b>end-to-end space activities<\/b>."},{"t":"can build/own/operate/Establish private ground stations, tracking centers, and spaceports/ Offer national and international space-based services/Engage in the commercial recovery of asteroids"},{"t":"Freely access and disseminate satellite data. Images with a Ground Sample Distance (GSD) greater than 5 meters are freely available, while higher-resolution images (less than 30 cm) require IN-SPACe authorization for national security reasons."},{"t":"FDI Liberalization now 100% (<b>Up to 100% under Automatic Route:<\/b> For the manufacturing , <b>Up to 74% under Automatic Route:<\/b> For satellite manufacturing and operations, <b>Up to 49% under Automatic Route:<\/b> For launch vehicles","h":"not part of policy but in 2024 :"}],"title":"INDIAN SPACE POLICY 2023","id":"space-economy-significance:gov-indian-space-policy-2023","v":"fa459a"}]},{"id":"satellite-internet","subj":"s08","name":"SATELLITE INTERNET","cards":[{"path":[],"roles":["def","use","issue"],"rows":[{"t":"provides a wireless connection via communication satellites orbiting Earth, differing from land-based services like fiber or cable. The infrastructure comprises three segments: the space segment with satellites that relay signals, the ground segment with control networks and gateway stations, and the user segment with communication terminals. Notable global projects include Amazon’s Project Kuiper and SpaceX’s Starlink, which recently received a five-year license to operate commercially in India."},{"t":"Significance Satellite internet is crucial for bridging the digital divide by connecting rural and underserved areas. It provides connectivity during emergencies and disasters. The technology also supports the digital economy and offers strategic autonomy, as it is less vulnerable to disruptions"},{"t":"Concerns include internal security risks, as satellite phones may be used by terrorists. Satellite internet has higher latency compared to wired connections because of the long distance data must travel. Additionally, atmospheric changes caused by satellite launches, such as the production of alumina, could deplete the ozone layer. Other issues are its high cost, susceptibility to weather, and the contribution to space junk"},{"t":"Another eg. Qianfan constellation: Qianfan is a planned Chinese low-Earth orbit satellite internet megaconstellation"},{"t":"Implications of many satellites by space X and amazon’s blue origin : Kessler Syndrome occurs because collisions between space objects generate debris that increases collision probability, creating a selfsustaining cascade of orbital debris. (Because each collision increases debris, and increased debris increases collision probability, creating a runaway positive feedback loop)"}],"title":"Satellite internet:","id":"satellite-internet:def-satellite-internet","v":"003d20"}]},{"id":"geospatial-technology","subj":"s08","name":"GEOSPATIAL TECHNOLOGY","cards":[{"path":[],"roles":["def","use"],"rows":[{"t":"Geospatial technology is a collection of technologies that provide information about the Earth to aid in resource management and sustainable development. It includes Remote Sensing, Global Positioning Systems (GPS), and Geographic Information Systems (GIS)"},{"t":"Applications The technology has wide-ranging applications across various sectors. In environmental monitoring, it is used by tools like M-STRIPES for patrolling tiger habitats. For water resources, the India-WRIS Web GIS provides data and information on water bodies."},{"t":"In agriculture, the KrishiDecision Support System (Krishi-DSS) uses geospatial data to provide realtime information on crop conditions and soil health. For land records management, the NAKSHA platform (National Geospatial Knowledge-based Land Survey of Urban Habitations) is an example.","cont":1},{"t":"It is also used in mineral mapping by the GSI using ASTER multispectral remote sensing data","cont":1}],"title":"GEOSPATIAL :","id":"geospatial-technology:def-geospatial","v":"bc3b76"},{"path":[],"roles":["gov","issue","fix"],"rows":[{"t":"India has several initiatives to promote this technology, such as the National Geospatial Data Repository and the Integrated Geospatial Data Sharing Interface (GDI).","h":"Initiatives and Concerns:"},{"t":"The National Geospatial Policy 2022 aims to position India as a global leader in the sector."},{"t":"However, the sector faces challenges like high costs for technologies such as LIDAR(light detection and ranging: scans ground and light is sent to the ground (Pulses) and gets a return to see its height or elevation also in iPhone to map a 3D model because it can perceive height) and drones, limited availability of high-resolution data due to a lack of detailed maps , and low awareness and adoption among local bodies like Panchayats. There are also surveillance concerns, as seen with location tracking during the COVID-19 lockdown."},{"t":"Way Forward To advance geospatial technology, India should integrate it with AI and Big Data, offer training to local bodies like Panchayats, provide open-access, high-resolution maps, and invest in indigenous, low-cost alternatives like miniaturized satellites"}],"id":"geospatial-technology:gov-main","v":"adc24f"}]},{"id":"space-observation-research","subj":"s08","name":"SPACE OBSERVATION & RESEARCH","cards":[{"path":["Fundamental Cosmology"],"roles":["fact"],"rows":[{"t":"This states that the universe is expanding at a rate of 67-68 kilometers per second per megaparsec (1 megaparsec means 3.26 million light years)","h":"Hubble Constant:"},{"t":"Dark matter is a hypothesized invisible form of matter that is inferred to exist based on its gravitational effects. Dark energy is a hypothetical form of energy that explains why the universe’s expansion is accelerating","h":"Dark Matter and Dark Energy:"},{"t":"The light from distant galaxies is “redshifted,” meaning their wavelengths are stretched, which indicates they are moving away from us Observation Tools","h":"Redshift:"},{"t":"Hubble Space Telescope (1990): Helped understand the universe, Chandra X-ray Observatory (1999): Detects X-ray emissions from hot regions of the universe like exploded stars and black holes., James Webb Space Telescope (JWST) (2022): Studies every phase of the universe, from the Big Bang to the formation of solar systems","h":"Important Space Telescopes:"},{"h":"Key Research Areas","t":"Exoplanet Exploration: Telescopes like Hubble and Spitzer have helped capture early evidence of gases in the atmospheres of distant worlds"},{"t":"Hubble has captured images of majestic spiral galaxies, such as NGC 3344","h":"Galaxy Formation:"},{"t":"Star Life Cycle"}],"title":"Fundamental Cosmology","id":"space-observation-research:fact-fundamental-cosmology","v":"dc9119"},{"path":["Indian Contributions"],"roles":["news"],"rows":[{"t":"Ladakh has emerged as a major hub for astronomical observatories and space-related research in India, earning the name “Astronomical Hub of India” due to its unique environmental features.","h":"Ladakh as Astronomical Hub:"},{"t":"The Hanle Valley is home to the Indian Astronomical Observatory (IAO), with its optical infrared telescope. Its high altitude, dry and cold desert climate, and lack of clouds and atmospheric water vapor make it an ideal location for optical, infrared, and other wavelength observations."},{"t":"The region has also been designated as the Hanley Dark Sky Reserve to promote astro-tourism. Recently, the Major Atmospheric Cherenkov Experiment (MACE) Observatory, Asia’s largest imaging Cherenkov telescope, was inaugurated in Hanle to observe high-energy gamma rays from phenomena like supernovae and black holes."},{"t":"Furthermore, scientists are considering Ladakh as a potential site for a Martian or Lunar analogue research station due to its geological, geochemical, and exobiological similarities to early Mars and the Moon"}],"title":"Indian Contributions","id":"space-observation-research:news-indian-contributions","v":"6d1dc4"},{"path":["Black Hole Research"],"roles":["def","news"],"rows":[{"t":"The recent discovery of gravitational waves from the merger of two black holes has brought them into focus. Previously, India’s Devasthal Optical Telescope (DOT) detected an Intermediate-Mass Black Hole (IMBH).","h":"Black Hole Discovery:"},{"t":"A black hole is a region in space with immense mass packed into a tiny volume, creating a gravitational pull so strong that even light cannot escape. They are classified into three types: Stellar-Mass, Intermediate-Mass (IMBH), and Supermassive black holes, which differ in mass and how they grow."},{"t":"Because they do not emit or reflect light, black holes are detected by their effects on their surroundings, such as accretion disks or the gravitational waves they create when they merge. Studying black holes is important for testing fundamental theories of the universe, like the General Theory of Relativity and Quantum Physics, and for understanding the universe’s origin"},{"t":"The international LIGO-Virgo-KAGRA (LVK) collaboration of gravitational wave observatories has recently detected the merger of two exceptionally massive black holes named GW231123. (Challenges the current understanding of black hole formation,"}],"title":"Black Hole Research","id":"space-observation-research:def-black-hole-research","v":"9e873d"},{"path":["Black Hole Research","LIGO-india facility"],"roles":["news"],"rows":[{"t":"Larsen & Toubro Wins Department of Atomic Energy Contract to Build LIGO-India Facility in Hingoli district,<br>Maharashtra."},{"t":"LIGO is the world’s largest gravitational-wave observatory that detects ripples in space-time using laser interferometry.  Uses laser interferometers with two 4-km-long arms arranged in an L-shape to measure extremely tiny distortions in space-time."},{"t":"Two main observatories located about 3000 km apart at Hanford (Washington) and Livingston (Louisiana) in the USA."},{"t":"Works with detectors such as the Virgo detector (Italy), the KAGRA (Japan) and GEO600 (in Germany).","h":"Global Network:"},{"t":"InDIGO (the Indian Initiative in Gravitational-wave Observations): An initiative to set up advanced experimental facilities; Objective: Improve the detection accuracy and 59ocalization of gravitational-wave sources","h":"LIGO-India :"}],"title":"LIGO-india facility","id":"space-observation-research:news-ligo-india-facility","v":"7f365a"},{"path":["Space Weather Phenomena"],"roles":["def"],"rows":[{"t":"A geomagnetic storm is a major disturbance of Earth’s magnetosphere caused by the interaction of charged particles from the Sun. These storms are primarily triggered by Coronal Mass Ejections (CMEs), which are massive expulsions of plasma and magnetic fields from the Sun’s corona, and solar flares, which are intense bursts of radiation.","h":"Geomagnetic Storms:"},{"t":"The intensity of these events is classified from G1 (Minor) to G5 (Extreme). If a storm is Earth-directed, it can cause the failure of GPS systems, damage power grids, interrupt radio communications, and disturb satellite orbits.","cont":1}],"title":"Space Weather Phenomena","id":"space-observation-research:def-space-weather-phenomena","v":"9fca6e"}]},{"id":"navigation-systems-and-defence","subj":"s09","name":"NAVIGATION SYSTEMS and DEFENCE","cards":[{"path":[],"roles":["def","use"],"rows":[{"t":"NavIC, formerly known as the Indian Regional Navigation Satellite System (IRNSS), is India’s homegrown satellite navigation system developed by ISRO, making India the only developing country with such a system. The system provides accurate Position, Velocity, and Timing (PVT) services within India and up to 1,500 km beyond its borders."},{"t":"Its constellation consists of seven satellites, with three in geostationary orbit and four in inclined geosynchronous orbit. These satellites use dual-band signals (L5 and S-band) and provide both a civilian Standard Position Service (SPS) and an encrypted Restricted Service (RS) for strategic users."},{"t":"The system offers India strategic independence from foreign navigation systems, like the GPS denial of use by USA during the 1999 Kargil War. With its encrypted military channel and high accuracy, NavIC is also intended to be the digital backbone for India’s Defence Space Agency and to guide future hypersonic glide vehicles"}],"id":"navigation-systems-and-defence:def-main","v":"f4a8b6"},{"path":["Hypersonic glide vehicles and all missles tech"],"roles":["def","how"],"rows":[{"t":"An HGV is a type of warhead design that combines extreme speed with the maneuverability of an aircraft, making it nearly impossible for current air defense systems to intercept."},{"t":"It travels at hypersonic speeds, defined as anything faster than <b>Mach 5<\/b> (five times the speed of sound, or roughly 6,100 km/h). Some HGVs can exceed Mach 20.","h":"<b>The Speed:<\/b>"},{"t":"Unlike a standard missile that flies entirely on its own engine, an HGV is placed on top of a traditional rocket (like a ballistic missile). The rocket \"boosts\" the HGV to the very edge of the Earth's atmosphere.","h":"<b>The Flight Profile (Boost-Glide):<\/b>"},{"t":"Once it reaches that high altitude, the HGV detaches from the rocket. It does not go into space. Instead, it \"surfs\" or glides along the upper atmosphere unpowered, using its aerodynamic shape to maintain hypersonic speeds as it falls toward its target.","h":"<b>The Glide:<\/b>"},{"t":"A Glide bomb after launch steer towards the target using highly accurate hybrid navigation scheme"}],"title":"Hypersonic glide vehicles and all missles tech","id":"navigation-systems-and-defence:def-hypersonic-glide-vehicles-and-all-missle","v":"27d56e"},{"path":["Hypersonic glide vehicles and all missles tech"],"roles":["fact","news"],"rows":[{"t":"Follow a fixed, predictable, parabolic arch into space and back down (like throwing a stone). Because the path is predictable, advanced defense systems can calculate where it will land and shoot it down.","h":"<b>Ballistic Missiles (e.g., Agni-V):<\/b>"},{"t":"Powered by an air-breathing \"Scramjet\" engine for the entire flight. They fly at lower altitudes and can maneuver, but rely on constant engine thrust.","h":"<b>Hypersonic Cruise Missiles (HCMs):<\/b>"},{"t":"Unpowered after the initial rocket boost. Their biggest advantage over ballistic missiles is <b>maneuverability<\/b>. As they glide, they can erratically change direction mid-flight, flying below the radar horizon of ballistic missile early-warning systems and completely confusing interceptors.","h":"<b>Hypersonic Glide Vehicles (HGVs):<\/b>"},{"t":"(<b>The LR-AShM (Unveiled Republic Day 2026):<\/b> DRDO officially unveiled the Long-Range Anti-Ship Hypersonic Missile at the 77th Republic Day parade)"},{"t":"This is India's dedicated HGV program aimed at striking land and sea targets at massive ranges (estimated between 6,000–10,000 km)","h":"<b>Project Dhvani:<\/b>"},{"t":"Russia already has deployed HGVs (the <i>Avangard<\/i>), and China has heavily invested in them (the <i>DF-ZF<\/i> or DF-17). The US is actively testing systems like the <i>Dark Eagle<\/i>.","h":"<b>The Global Players:<\/b>"}],"title":"<u>Other missles <\/u>","id":"navigation-systems-and-defence:fact-other-missles","v":"4a7c12"},{"path":["Hypersonic glide vehicles and all missles tech"],"roles":["def","use","news"],"rows":[{"t":"Instead of firing a physical projectile (like a bullet or a missile), a DEW fires highly concentrated energy at the speed of light. This usually comes in two forms: <b>High-Energy Lasers (HEL)<\/b> to physically burn through a target, or <b>High-Power Microwaves (HPM)<\/b> to fry the electronic circuits of an incoming threat","h":"Directed Energy Weapons (DEWs):"},{"t":"The \"cost-per-shot\" of a laser is essentially just the cost of electricity, whereas a traditional interceptor missile costs millions of dollars. Furthermore, because lasers travel at the speed of light, they are theoretically the only weapon fast enough to consistently shoot down a hypersonic glide vehicle or a massive swarm of cheap drones."},{"t":"The DRDO is actively developing project <b>DURGA-2<\/b> (Directionally Unrestricted Ray-Gun Array), a 100-kilowatt lightweight directed energy weapon meant to be integrated into land, sea, and air platforms.","h":"<b>India's Position:<\/b>"},{"t":"DRDO successfully conducted a trial of an Mk-II (A) LASER- Directed Energy Weapon (DEW) system at the National Open-Air Range (NOAR) in Andhra Pradesh."}],"title":"Directed Energy Weapons (DEWs):","id":"navigation-systems-and-defence:def-directed-energy-weapons-dews","v":"038745"},{"path":["Hypersonic glide vehicles and all missles tech"],"roles":["def","news"],"rows":[{"t":"This is not just a group of drones being flown by multiple pilots. A true \"swarm\" uses Artificial Intelligence so that dozens or hundreds of drones communicate with each other and act as a single, coordinated organism. If one drone is shot down, the rest of the swarm instantly reconfigures to complete the mission.","h":"<b>Drone Swarms:<\/b>"},{"t":"A hybrid between a cruise missile and a drone. It is launched into an area where it \"loiters\" in the air for hours, waiting for a target (like an enemy radar or tank) to reveal itself. Once a target is spotted, it crashes into it and detonates.","h":"<b>Loitering Munitions (\"Kamikaze Drones\"):<\/b>"},{"t":"The Indian Army has already begun inducting indigenous swarm drone systems for high-altitude operations. The DRDO and private startups are also developing systems like <b>ALFA-S<\/b> (Air-Launched Flexible Asset - Swarm).","h":"<b>India's Position:<\/b>"}],"title":"<b>Drone Swarms:<\/b>","id":"navigation-systems-and-defence:def-drone-swarms","v":"27adf1"},{"path":["Hypersonic glide vehicles and all missles tech"],"roles":["use","news"],"rows":[{"t":"Since modern militaries rely entirely on satellites for GPS, communication, and drone piloting, blinding the enemy's satellites is the first step in a modern war.","h":"Anti-Satellite (ASAT) Weapons and Space Militarization:"},{"t":"ASAT weapons are designed to physically destroy or electronically disable a country's satellites in orbit. These can be kinetic (launching a missile from Earth to smash the satellite) or non-kinetic (using lasers to blind the satellite's cameras or cyberattacks to hijack its controls).","h":"<b>The Concept:<\/b>"},{"t":"India proved its kinetic ASAT capability in 2019 with <b>Mission Shakti<\/b>, successfully destroying one of its own live satellites in Low Earth Orbit (LEO). Following this, India established the <b>Defence Space Agency (DSA)<\/b> to command the space assets of the Army, Navy, and Air Force, acknowledging space as the fourth domain of warfare.","h":"<b>India's Position:<\/b>"}],"title":"Anti-Satellite (ASAT) Weapons and Space Militarization:","id":"navigation-systems-and-defence:use-anti-satellite-asat-weapons-and-space-mi","v":"a8a6d1"},{"path":["Hypersonic glide vehicles and all missles tech"],"roles":["def","use"],"rows":[{"t":"A high-altitude, unmanned airship designed to operate in the stratosphere, typically between 17 to 22 kilometers above Earth."},{"t":"Functions as a High-Altitude Pseudo-Satellite (HAPS) that can remain airborne for extended durations."},{"t":"HAPS can be classified as aerodynamic (or heavier-than-air, e.g. fixed wing/airplanes) and aerostatic (or lighter-than-air, e.g. balloons and airships)."},{"t":"Uses helium for buoyancy","h":"Lift Mechanism:"},{"t":"Generally powered by solar energy with onboard batteries for night-time operation.","h":"Power Source:"},{"t":"They can carry imaging sensors, radar, and telecom payloads, making them useful for border monitoring, disaster response, and intelligence missions.","h":"Strategic Advantages:"},{"t":"They bridge the gap between drones and satellites, providing space-like coverage with faster deployment, lower costs, and more flexibilit"}],"title":"STRATOSPHERIC AIRSHIP PLATFORM","id":"navigation-systems-and-defence:def-stratospheric-airship-platform","v":"b94dc0"},{"path":["Hypersonic glide vehicles and all missles tech"],"roles":["news"],"rows":[{"t":"Defence Minister approved Fifth-Generation Fighter Jet Execution Model through Industry Tie-Up."},{"t":"Currently only the US (F-22 and F-35), Russia (Sukhoi Su-57), and China (Chengdu J-20) have developed operational fifth generation aircraft."},{"t":"Key Features of 5th Generation Fighters"},{"t":"Provides higher level of air safety and survivability in the event of failure of one engine especially at night.","h":"Powered by Twin-engine:"},{"t":"Harder to detect by enemy radar.","h":"Stealth Capabilities:"},{"t":"High maneuverability, fly at supersonic speeds, etc","h":"Other:"}],"title":"ADVANCED MEDIUM COMBAT AIRCRAFT (AMCA)","id":"navigation-systems-and-defence:news-advanced-medium-combat-aircraft-amca","v":"1eea5c"},{"path":["Hypersonic glide vehicles and all missles tech"],"roles":["news"],"rows":[{"t":"Successful Trial of the Hybrid Unmanned Aerial Vehicle (UAV) Rudrastra Conducted at Pokhran,"},{"t":"A Hybrid Vertical Take-Off and Landing (VTOL) UAV manufactured by Solar Defence and Aerospace Limited (SDAL)."},{"t":"VTOL UAVs can take off and land vertically, eliminating the need for runways, and providing manoeuvrability and versatility in operations."},{"t":"BHARGAVASTRA (A low-cost, 'hard kill' anti-drone system designed to neutralize threats from drone swarms)"}],"title":"RUDRASTRA","id":"navigation-systems-and-defence:news-rudrastra","v":"36ee98"}]},{"id":"ramjet-scramjet-engine","subj":"s09","name":"RAMJET/SCRAMJET ENGINE","cards":[{"path":[],"roles":["how"],"rows":[{"t":"Normal engine has a turbine and a compressor but ramjet because of the high speed does not need both of those components because the combustion can happen automatically if we slow the speed down in the engine to sub sonic (e slow the air down to low subsonic inside the combustor so the fuel can burn fully and stably at high pressure."},{"t":"That lets the nozzle later turn that hot, high-pressure gas into a much faster jet, which is what gives you big thrust.) ramjet cannot start at 0 speed, only 3 to 6 and produces too high temp,","cont":1},{"t":"only till mach 3.5 (mach means 3.5 speed of object relative to speed of sound in atmosphere, its around 295 at higher altitutdes so 3,700)","h":"Normal engine :"},{"img":13},{"t":"<b><u>ramjet <\/u><\/b>cannot start at 0 speed, only 3 to 6 and produces too high temp so good combustion halters flow, so we need to lower the temp, so we only need a little slowing down of the flow of fuel in combustion and then can happen only when we keep burning fuel as we fly and this is what is done by scramjet"},{"img":14},{"t":"<b><u>Scramjet <\/u><\/b>(vehicle must be travelling above mach 3) and can travel mach 6 to mach 11, 12, 13, 14. (High-energy fuels, high initial costs, integration issues, active cooling systems, and heat-resistant materials are all significant challenges in scramjet development.) (follows newton 3rd law of motion : for every. Action there’s an equal and opposite reaction)"},{"img":15}],"title":"Technology Comparison","id":"ramjet-scramjet-engine:how-technology-comparison","v":"d16425"},{"path":[],"roles":["def","use","issue"],"rows":[{"t":"rocket engine that uses a cryogenic (liquid h2 or O2) or oxidiser (Developed by: The Liquid Propulsion Systems Centre (LPSC), Valiamala, Kerala), the fuel is liquified gases (Generally liquid hydrogen liquefied at -253° Celsius is used as fuel and liquid oxygen liquefied at -183° Celsius)","h":"<b><u>Cryogenic engine<\/u><\/b> :"},{"t":"ISRO’s PSLV Vikas engine burns 3.4 kg/sec, while cryogenic engines need only 2 kg/sec for the same thrust, Eco-Friendly Technology: Hydrogen-oxygen combustion emits only steam, Heavy Payloads & Space Missions: Ideal for heavy payloads and long missions like Gaganyaan","h":"adv:"},{"t":"Extremely low-temperature propellants create thermal and structural issues, Thermal Stress: Risks of cracks, High Pressure: Requires strong superalloys, Temperature Control: Balancing performance with coolant","h":"and problems Complex Systems:"},{"img":16}],"title":"<b><u>Cryogenic engine<\/u><\/b> :","id":"ramjet-scramjet-engine:def-cryogenic-engine","v":"ccbc60"}]},{"id":"rotating-detonation-engine-rde-detonatio","subj":"s09","name":"ROTATING DETONATION ENGINE (RDE) & DETONATION PROPULSION","cards":[{"path":[],"roles":["how"],"rows":[{"t":"Normal engines use <i>deflagration<\/i> (subsonic burning where the flame travels slower than sound at a constant pressure, allowing the mixture to expand and lose energy as heat). RDEs use <i>detonation<\/i> (supersonic shock waves traveling faster than sound at a constant volume, instantly compressing unburned fuel and turning more chemical energy into high pressure instead of heat).","h":"<b>Traditional Engine vs. RDE Combustion:<\/b>"},{"t":"By replacing constant-pressure deflagration with constant-volume detonation, RDEs yield <b>10% to 25% higher thermodynamic efficiency<\/b>. This translates theoretically to roughly <b>17% less fuel usage<\/b> for the same output, allowing weight savings to be directly shifted to a heavy payload (satellites or warheads).","h":"<b>Efficiency and Fuel Savings:<\/b>"},{"sec":"<b>Pulse Detonation Engine (PDE) vs. Rotating Detonation Engine (RDE):<\/b>"},{"t":"Uses a long tube where a detonation wave fires down the length, after which the tube <b>must be actively purged<\/b> with air before the next cycle. This creates discrete pulses and mechanical/valve fatigue.","h":"<b>PDE (Intermittent):<\/b>"},{"t":"Uses an <b>annular chamber<\/b> (two concentric cylinders with a narrow ring gap) where one or more detonation waves race continuously in a circle thousands of times per second, with fresh fuel fed continuously just ahead of the wave.","h":"<b>RDE (Continuous):<\/b>"},{"t":"Unlike ramjets/scramjets—which cannot start from 0 speed and require high forward speeds (Mach 3 to 6) to function—RDEs can operate statically from a dead stop (acting like a rocket engine carrying its own oxidizer) or integrate with atmospheric air-breathing streams for high-speed missiles.","h":"<b>Operational Versatility (vs. Ramjets/Scramjets):<\/b>"},{"t":"RDE development was bottlenecked for decades because materials must survive temperatures over <b>2,000° C<\/b>, pressures fluctuating between <b>10 to 100 atmospheres<\/b> at thousands of cycles per second, and detonation speeds exceeding <b>1,500 m/s<\/b>. Practical models required major leaps in high-speed computing, diagnostics, and advanced manufacturing.","h":"<b>Extreme Engineering Challenges:<\/b>"}],"title":"Technology Comparison","id":"rotating-detonation-engine-rde-detonatio:how-technology-comparison","v":"5453bb"}]},{"id":"nuclear-energy","subj":"s10","name":"NUCLEAR ENERGY","cards":[{"path":[],"roles":["fact","use"],"rows":[{"img":17},{"sec":"Current Status & Goals"},{"t":"India’s current nuclear energy capacity is 8.78 GW , with plans to triple it by 2031-32 (22,480 MW)","h":"Installed Capacity & Target:"},{"sec":"Strategic Importance"},{"t":"Provides low-carbon energy (critical for Net Zero 2070), applications in medicine (eg radioactive iodine is used to treat thyroid cancer), agriculture (Fallout Radio Nuclide technique using radioactive traces in soil to measure how much soil is being eroded or deposited), and industry (radiotracers help in tracing leakages (like in pipes because of the vast network of it).","h":"Significance:"}],"title":"General","id":"nuclear-energy:fact-general","v":"8314d1"},{"path":["General"],"roles":["gov"],"rows":[{"t":"Key steps include the Atomic Energy (Amendment) Act, 2015 enables Nuclear power corporation of india limited to join with other PSU, Three-Stage Nuclear Power Programme (first Presurrized heavy water reactors then move to fast breeder reactor and then to throrium reactors) , Nuclear Energy Mission ( 100 GW by 2047), setting up of world’s first thorium-based plant Bhavini (U-233, Kalpakkam), and commissioning of KAPS 3 & 4 (700 MWe PHWR).","h":"Initiatives:"},{"t":"MAHI BANSWARA RAJASTHAN ATOMIC POWER PROJECT (4 NUCLEAR UNITS OF PWHR) DEV BY ANUSHAKTI VIDHUJEET NIGAM (JV B/W NPCIL AND NTPC)","h":"recent initiative :"},{"t":"private sector participation (plant operations, power generation and equipment manuf) but enrichment is strictly under gov control; Atomic energy regulatory board (statutory made), if theres a problem it introduces a liability fund (eg. large plants private will pay max rs 3000 crore rest all thru fund (earlier in CLND act it was 100% private laibility) + Atomic energy dispute redressal forum will be made","h":"SHANTI Act, 2025 :"},{"t":"Increasing share of Nuclear Power in energy gen +  Private participation expands capital availability and attrsct investment + less delays (eg. kalapakkam scheduled originally for 2010) + Advanced technology access + Facilitating Clean energy transition: To meet the national target of 100 GW","h":"intro private will :"}],"title":"Government Initiatives","id":"nuclear-energy:gov-government-initiatives","v":"1616c5"},{"path":["General"],"roles":["issue","fix"],"rows":[{"t":"Safety concerns (Chernobyl, Fukushima), land acquisition issues, import dependence on uranium, and high upfront costs.","h":"Challenges:"},{"sec":"Future Strategy"},{"t":"Structured waste management, building societal awareness, optimal regulatory regime, and public-private partnership for expansion.","h":"Way Forward:"}],"title":"Implementation Challenges","id":"nuclear-energy:issue-implementation-challenges","v":"703cb6"},{"path":["Heavy Water Reactors"],"roles":["how"],"rows":[{"t":"These reactors use natural uranium as fuel and heavy water (normal water is H 20 but we know hydrogen’s isotope(isotope means same protons but different number of neutron) and the isotope with I neutron is deuterium and when deuterium and oxygen are there then it is called heavy water ) both as a moderator to slow down neutrons and as a coolant to carry away heat.","h":"Heavy water reactors :"},{"t":"Because heavy water doesn’t absorb many neutrons, it allows even low-grade natural uranium to sustain a chain reaction. Most of India’s current reactors are PHWRs since the country has uranium and is the world’s largest producer of heavy water. Apart from generating electricity, PHWRs also produce plutonium-239 as a by-product, which is very useful for the next stage of India’s nuclear programme."},{"t":"( Introduced through Indo-Canadian nuclear cooperation in the 1960s., First 220 MW reactor built at Rajasthan Atomic Power Station (RAPS-1), After Pokhran-1 (1974), Canada withdrew support, leading India to indigenously develop and standardize the 220 MW PHWR design"}],"title":"Heavy Water Reactors","id":"nuclear-energy:how-heavy-water-reactors","v":"027085"},{"path":["Fast Breeder Reactors"],"roles":["how"],"rows":[{"t":"Fast Breeder Reactor (FBR). These use plutonium-239 mixed with uranium as fuel and liquid sodium as coolant, since water would slow down neutrons."},{"t":"In an FBR, fast neutrons cause fission in plutonium while the surrounding uranium-238 absorbs some neutrons and turns into more plutonium-239. This means the reactor produces more fissile material than it consumes, which is why it is called a “breeder.”"},{"t":"India is building its Prototype Fast Breeder Reactor (PFBR) at Kalpakkam, Tamil Nadu. The purpose of FBRs is to multiply India’s limited uranium resources and create enough fuel for the future."},{"t":"(In 2003, government established Bharatiya Nabhikiya Vidyut Nigam Limited (BHAVINI) to construct and operate Prototype Fast Breeder Reactor (PFBR))"},{"t":"HALEU (High-Assay Low-Enriched Uranium) is nuclear fuel enriched so that 5% to 20% of its uranium is the fissile isotope Uranium-235 making it more concentrated than standard power-plant fuel (3–5%), while remaining below weapons-grade levels (above 20%)."},{"t":"(its cleaner and of high efficeincy) (Its high energy density allows engineers to shrink reactor core sizes, making it the required fuel for next-generation <b>Advanced Reactors<\/b> and <b>Small Modular Reactors (SMRs)<\/b>.) (Commercial HALEU production is currently dominated by <b>Russia<\/b> and <b>China)<\/b>","cont":1}],"title":"Fast Breeder Reactors","id":"nuclear-energy:how-fast-breeder-reactors","v":"a16e6a"},{"path":["Thorium-Based Systems"],"roles":["how"],"rows":[{"t":"Thorium Reactors, also called Advanced Heavy Water Reactors (AHWR).<br>Thorium-232 is not itself fissile, but when it absorbs a neutron it converts into Uranium-233, which can sustain fission."},{"t":"In these reactors, thorium acts as the fertile material, while a small amount of plutonium or uranium is used to start the chain reaction. Over time, thorium gradually breeds U-233, which becomes the main fuel."},{"t":"India has the world’s largest thorium reserves ( Kerala and Odisha have rich reserves of monazite, which contains about 8-10% thorium, Monazite is also prominent in Andhra Pradesh, Tamil Nadu, West Bengal and Jharkhand) so this stage would allow the country to run almost entirely on its own resources in a clean and sustainable way."},{"t":"(World’s first thorium molten salt nuclear power station will be launched in Gobi Desert by China in 2025), Its reactor does not need water for cooling because it utilizes liquid salt or carbon dioxide to transfer heat and make electricity (reduces the chances of meltdowns.) + Chemically safe, due to higher melting point, better thermal conductivity, better fuel performance characteristics + Environmentally safe, generates lesser toxic"}],"title":"Thorium-Based Systems","id":"nuclear-energy:how-thorium-based-systems","v":"0fb2c7"},{"path":["Small Reactor Technologies"],"roles":["def","use"],"rows":[{"t":"Unlike SMRs, which are an entirely new concept involving factory-made, easily assembled reactors, BSRs are based on India’s existing Pressurized Heavy Water Reactor technology will be built with help of private sector (a historic shift in India’s nuclear policy, as the Atomic Energy Act of 1962 did not permit private sector participation in nuclear energy generation). They can enhance the contribution of nuclear energy in India’s energy basket (current share of nuclear energy is 1.6%)","h":"Bharat small reactors :"},{"t":"Small Modular Reactors (SMRs) are compact nuclear reactors, typically producing less than 300 MWe ( 1/3rd of traditonal), designed as modular units that can be factory-built and transported to sites for quick installation."},{"t":"Unlike traditional large reactors, SMRs are cheaper, faster to construct, and allow flexible scaling by adding modules as demand grows. They also incorporate advanced passive safety systems, enabling automatic shutdown and cooling without external power, making them safer and more reliable."},{"t":"Because of their size, they are especially suitable for remote regions, islands, or military bases where large plants are impractical."},{"t":"Globally, projects like the NuScale design in the US, Russia’s floating Akademik Lomonosov, and China’s inland SMRs and Suitable for electricity and thermal needs like seawater desalination (e.g., South Korea’s SMART). highlight the technology’s potential. India too is exploring SMRs as a complement to its larger reactors and renewables, with the aim of providing clean, decentralized power while reducing carbon emissions."}],"title":"Small Reactor Technologies","id":"nuclear-energy:def-small-reactor-technologies","v":"1950fd"},{"path":["NUCLEAR FUSION"],"roles":["def"],"rows":[{"sec":"Fundamental Concepts"},{"t":"Occurs when light nuclei, like deuterium (D) and tritium (T), fuse to form helium and a neutron, releasing a massive amount of energy.","h":"<b>Nuclear Fusion:<\/b>"},{"t":"Hydrogen isotopes (Deuterium and Tritium).","h":"<b>Fuel Used:<\/b>"},{"t":"The splitting of a heavy nucleus, like uranium-235, into lighter nuclei, releasing neutrons and energy.","h":"<b>Nuclear Fission:<\/b>"},{"t":"Heavy elements like Uranium and Plutonium.","h":"<b>Fuel Used:<\/b>"}],"title":"Fusion vs. Fission","id":"nuclear-energy:def-fusion-vs-fission","v":"1faa39"},{"path":["NUCLEAR FUSION"],"roles":["gov"],"rows":[{"t":"India has made significant strides in nuclear and plasma research through several key initiatives:"},{"t":"India's domestically developed machine for plasma physics research.","h":"<b>ADITYA Tokamak (Ahmedabad):<\/b>"},{"t":"Designed for <b>steady-state plasma<\/b> studies. (Steady-state means the hot, ionized plasma is maintained continuously for a long time without dying out or becoming unstable).","h":"<b>SST-1:<\/b>"},{"t":"Features the INDUS 1 and INDUS 2 particle accelerators.","h":"<b>Indus Synchrotron Radiation Facility:<\/b>"}],"title":"Indian Research & Facilities","id":"nuclear-energy:gov-indian-research-facilities","v":"70368d"},{"path":["NUCLEAR FUSION"],"roles":["how"],"rows":[{"sec":"<b>1. Tokamaks & Plasma Confinement<\/b>"},{"t":"A tokamak is a device designed to achieve nuclear fusion (not fission) by heating hydrogen isotopes to star-core temperatures.","h":"<b>The Concept:<\/b>"},{"t":"It confines the resulting <b>plasma<\/b>—the 4th state of matter, created when ionized gas is heated until electrons are stripped away—using powerful magnetic fields generated by solenoids inside a doughnut-shaped chamber (a <i>torus<\/i>).","h":"<b>The Mechanism:<\/b>"},{"t":"The Joint European Torus (JET) currently holds the world record for fusion power. A newer variant, the <b>spherical tokamak<\/b>, reshapes the chamber into a compact, cored-apple shape. This design offers stronger magnetic fields, better heat retention, fewer instabilities, and lowers external energy needs. Private companies like Tokamak Energy are developing these high-field magnet designs to make fusion commercially viable.","h":"<b>Advancements:<\/b>"},{"sec":"<b>2. Synchrotron Radiation<\/b>"},{"t":"An electron gun emits electrons into steel tubes connected to a booster ring, where microwave energy accelerates them to near light-speed.","h":"<b>The Process:<\/b>"},{"t":"The beam is injected into a storage ring where powerful magnets bend the electrons' path. This bending emits an intensely bright light called <b>synchrotron radiation<\/b>.","h":"<b>The Output:<\/b>"},{"t":"This light is directed through beamlines onto various samples. The interaction between the light and the sample's molecules allows scientists to generate highly detailed, molecular-level images.","h":"<b>The Application:<\/b>"}],"title":"Core Technologies Explained","id":"nuclear-energy:how-core-technologies-explained","v":"ec8c20"},{"path":["NUCLEAR FUSION"],"roles":["news"],"rows":[{"t":"Major international projects are pushing the boundaries of fusion technology:"},{"h":"<b>EAST Tokamak:<\/b>","t":"<span class=\"lst\"><span class=\"li\">China (<b>1. The EAST (Experimental Advanced Superconducting Tokamak) <\/b>world's first <i>fully superconducting<\/i> tokamak.<\/span><br><span class=\"li\"><b>Joint European Torus (JET):<\/b> United Kingdom<\/span><br><span class=\"li\"><b>KSTAR:<\/b> South Korea<\/span><\/span>"},{"t":"The world's largest fusion project located in France. It aims to demonstrate fusion as a safe, carbon-free energy source. It is a 30-nation collaboration where the European Union contributes 45% of the funding, and other partners (including India, since 2005) contribute 9% each.","h":"<b>ITER (International Thermonuclear Experimental Reactor):<\/b>"},{"t":"The HL-2M (Also known as HL-3)"},{"t":"Chengdu, China (Operated by the Southwestern Institute of Physics under the China National Nuclear Corporation).","h":"<b>Location:<\/b>"},{"t":"It is China's largest and most advanced tokamak in terms of the raw parameters and heat fluxes it can handle.","h":"<b>The Claim to Fame:<\/b>"},{"t":"<b> Raw Power and Current.<\/b> While EAST focuses on how <i>long<\/i> the reaction can run, the HL-2M is largely focused on pushing the limits of high temperatures, high plasma density, and massive electrical currents (such as its milestone of exceeding 1 million amperes).","h":"<b>Primary Goal:<\/b>"}],"title":"Global Collaborations","id":"nuclear-energy:news-global-collaborations","v":"9793f7"},{"path":["NUCLEAR FUSION"],"roles":["issue","fix"],"rows":[{"t":"Achieving commercially viable fusion energy requires overcoming several massive engineering challenges."},{"sec":"The Challenges"},{"t":"Sustaining temperatures upwards of 100 million degrees Celsius.","h":"<b>Extreme Heat:<\/b>"},{"t":"Using magnets to keep plasma stable and at a steady state is an incredibly complex process.","h":"<b>Plasma Confinement:<\/b>"},{"t":"High-energy neutron radiation can escape and travel tens of centimeters, degrading surrounding materials.","h":"<b>Radiation:<\/b>"},{"t":"The technology is still largely in the research and development phase.","h":"<b>Experimental Nature:<\/b>"},{"sec":"The Way Forward"},{"t":"<span class=\"lst\"><span class=\"li\">Fostering deep <b>international cooperation<\/b> (like ITER).<\/span><br><span class=\"li\">Securing heavy <b>R&D investment<\/b>.<\/span><br><span class=\"li\">Developing highly accurate <b>plasma modeling<\/b> through advanced computing.<\/span><br><span class=\"li\">Encouraging <b>private sector participation<\/b> to accelerate innovation and commercial viability.<\/span><\/span>"}],"title":"Technical Hurdles & Solutions","id":"nuclear-energy:issue-technical-hurdles-solutions","v":"9c2603"},{"path":["THORIUM MOLTEN SALT REACTOR (TMSR)"],"roles":["def","use"],"rows":[{"t":"It is fourth-generation advanced nuclear energy system that uses high-temperature molten salt as a coolant."},{"t":"China’s TMSR is currently the only operational molten-salt reactor in the world."},{"t":"Cool without water, run at atmospheric pressure, deliver a high temperature output, etc.","h":"Key Features:"},{"sec":"Key Advantages:"},{"t":"If an MSR is too hot, a salt plug melts, stopping the reaction.","h":"Passive Safety Features:"},{"t":"Thorium generates fewer long-lived minor actinides (radioactive metallic elements) than plutonium fuels.","h":"Small High-Level Nuclear Waste Footprint:"},{"t":"Extract more energy from fuel, etc.","h":"Other:"},{"t":"Thorium has to be converted to Uranium-233 in a reactor before it can be used as fuel. Thorium-232 is the only naturally occurring isotope of thorium"}],"title":"THORIUM MOLTEN SALT REACTOR (TMSR)","id":"nuclear-energy:def-thorium-molten-salt-reactor-tmsr","v":"b46571"},{"path":["FUSION-FISSION REACTOR CHINA"],"roles":["news"],"rows":[{"t":"China aims to construct the World’s First Hybrid Fusion-Fission Nuclear Plant, named Xinghuo."},{"t":"Contains a nuclear fusion reactor core where deuterium and tritium nuclei are fused to form helium and a fast neutron"},{"t":"then uses high intensity neutron flux produced by a fusion reactor to drive a nuclear fission reaction, and breed fissile fuel from fertile materials"},{"t":"the inner fusion core is surrounded by a blanket of fertile material for fission (like uranium-238 or thorium-232)."}],"title":"FUSION-FISSION REACTOR CHINA","id":"nuclear-energy:news-fusion-fission-reactor-china","v":"d7bb86"}]},{"id":"battery-energy-storage-system-bess","subj":"s11","name":"BATTERY ENERGY STORAGE SYSTEM (BESS)","cards":[{"path":[],"roles":["def","use"],"rows":[{"t":"BESS is an electrochemical device that stores renewable energy (solar, wind) for later use; storage systems can be Mechanical (pumped hydro, flywheel) to Electrochemical (lead-acid, zincbromine), or Chemical (fuel cells).","h":"Definition & Types:"},{"sec":"Strategic Importance"},{"t":"Helps minimize greenhouse gas emissions (pachamrit target of net zero by 2070), reduce energy costs during peak hours, improve grid stability and reduce dependency, and cater to future demand ( 236 GWh BESS required by 2031-32 acc to National electricity pan).","h":"Significance:"}],"title":"Definition & Types","id":"battery-energy-storage-system-bess:def-definition-types","v":"5d77df"},{"path":[],"roles":["gov","issue","fix"],"rows":[{"t":"Viability Gap Funding for 4,000 MWh BESS by 2030-31, legal status as Generator/Transmission/Distribution element (MoP, 2022) (they can participate in electricity markets, receive regulated treatment, and be integrated into the grid like conventional power assets), Production Linked Incentive for Advanced Chemistry Cell storage, and National Framework (2023) for promoting energy systems.","h":"Initiatives:"},{"sec":"Implementation Challenges"},{"t":"Extremely low reserves of key raw materials (lithium, cobalt, nickel and graphite), policy uncertainty (loss of tax benefits can happen), high maintenance needs, and lack of quality R&D, EV/storage policies, and financing.","h":"Concerns:"},{"sec":"Future Strategy"},{"t":"Create demand via soft loans (favourable terms) facility for discoms, phased manufacturing programme, GST redesign for imports, and push recycling/sustainability through Extended Producer Responsibility and circular economy in BESS.","h":"Way Forward:"}],"title":"Policy Initiatives","id":"battery-energy-storage-system-bess:gov-policy-initiatives","v":"a26f79"},{"path":[],"roles":["news","how"],"rows":[{"t":"DPIIT = sodium-ion battery (SIB) that can charge up to 80% in just six minutes and last over 3000 charge cycles,SIBs are a type of rechargeable battery similar to lithium batteries, but carry the charge using sodium ions (Na+) instead of lithium ions (Li+)."},{"t":"Batteries store and provide electricity by using chemical reactions where metals lose electrons (oxidation) and other substances gain them (reduction). The first battery was made by Volta in the 1780s after experiments with frogs and metals by him and Galvani. Modern batteries, whether disposable or rechargeable, work on the same principle: rechargeable ones can reverse the reaction to be used again."},{"t":"Over time, batteries lose capacity because repeated charging causes tiny imperfections inside them. Today’s batteries can last thousands of cycles, and future designs might last even hundreds of thousands. For now, the best way to keep batteries healthy is to charge them using a wall outlet."},{"t":"15-20% cheaper, sodium abundant and lithium is rare, better suited for wider temp variations and can be shipped at 0 voltage with 0 risk","h":"Adv :"},{"t":"VANADIUM REDOX FLOW BATTERY","h":"new advancement :"},{"img":18}],"id":"battery-energy-storage-system-bess:news-main","v":"9edf14"}]},{"id":"electric-vehicles","subj":"s11","name":"ELECTRIC VEHICLES","cards":[{"path":[],"roles":["gov"],"rows":[{"t":"ke
