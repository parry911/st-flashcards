ince 1925<\/span><\/li><li>Nice Ocean Action Plan (<span class=\"cm\" data-c=\"16\">UNOC3<\/span>, 2025): SDG 14 is the least funded SDG · fix: more marine protected areas + <span class=\"cm\" data-c=\"17\">Blue NDC Challenge<\/span> (France + Brazil)<\/li><li>India: <span class=\"cm\" data-c=\"18\">Deep Ocean Mission<\/span> + MISHTI <span class=\"cm\" data-c=\"19\">mangroves + INCOIS<\/span><\/li><\/ul>"},{"t":"AMOC","b":"<ul><li>Atlantic Meridional Overturning Circulation: Atlantic currents driven by temperature and salinity (thermohaline) → warm salty water flows north from the Gulf of Mexico, cools, sinks and returns south → keeps western Europe mild<\/li><li>Weakening: Greenland melt added ≈5,000 km³ of fresh water → lighter water sinks slower → possible tipping point<\/li><li>Collapse → Europe and Arctic cool (≈7°C) + tropical rain belt shifts south → droughts in the Sahel and South Asia, disrupted Indian monsoon + fewer nutrients for marine life<\/li><li>Fix: cut emissions + long-term monitoring (ocean bottom pressure)<\/li><\/ul>"},{"t":"Extreme weather + <span class=\"cm\" data-c=\"20\">ENSO<\/span>","b":"<ul><li>El Niño: trade winds weaken → weak monsoon, drought, lower kharif yields<\/li><li>La Niña: trade winds strengthen → good monsoon, floods, Bay of Bengal cyclones<\/li><li>El Niño–monsoon link weakening → harder forecasts + record heatwaves 2022, 2024 + Himachal floods 2023<\/li><li><mark>Super El Niño<\/mark>: Pacific &gt;2°C above normal for long (one forecast for late 2026)<\/li><\/ul>"},{"t":"Ozone","b":"<ul><li>CFCs, HCFCs release chlorine → Antarctic ozone hole (Aug–Nov) → recovery by 2066<\/li><li>Montreal Protocol 1987: ozone-depleting substances cut &gt;98% (worked) → <span class=\"cm\" data-c=\"21\">Kigali Amendment 2016<\/span>: HFCs (strong GHGs) cut 80–85% by late 2040s<\/li><li>India: CFCs, halons out by 2010 + <span class=\"cm\" data-c=\"22\">HCFC-141b out of foam-making<\/span> by 2020 (among the first developing countries)<\/li><li>India: HFC phase-down 10% (2032) → 85% (2047) + <span class=\"cm\" data-c=\"23\">India Cooling Action Plan 2019<\/span> (cooling demand −20–25% by 2037–38)<\/li><\/ul>"},{"t":"Economic + farm impacts","b":"<ul><li>1°C warming → global GDP −12%<\/li><li>India: yields −4.5–9% (≈1.5% of GDP a year) + rice −10–15%, wheat −20% by 2050 without adaptation + rainfed farm incomes −17–18% (Economic Survey)<\/li><li>Kerala floods 2018: ≈₹31,000 crore to rebuild<\/li><li>Fix: climate budget tagging in every state + parametric insurance + resilient infrastructure (CDRI)<\/li><\/ul>"},{"t":"Sea-level rise + coasts","b":"<ul><li>North Indian Ocean rising 3.3 mm a year (1993–2017) · 1 m rise → 5.7 lakh ha submerged, ≈71 lakh displaced in India<\/li><li>Mumbai, Chennai, Kolkata + Sundarbans (up to 80% of mangroves could go; <span class=\"cm\" data-c=\"26\">Amphan 2020's<\/span> <mark>storm surge<\/mark> pushed seawater 25 km inland) + 36 million Indians may face persistent flooding by 2100 + Lakshadweep (Kavaratti, Minicoy may lose 60% of land)<\/li><li>Indian Ocean region: Maldives (≈1.5 m high) + Bangladesh (0.74 m rise, 2 million+ displaced → migration into Assam, West Bengal) + Jakarta sinking + Sri Lanka (Colombo coast) + Myanmar (Irrawaddy delta) + Pakistan (Indus delta, seawater in Sindh) + Seychelles, Mauritius (beaches, reefs, tourism) → for India: climate migrants + shared fisheries hit + India as first responder<\/li><li>Coastal erosion causes: sea-level rise + storm surges + sand mining + <span class=\"cm\" data-c=\"27\">dams trap river silt<\/span> + ports and breakwaters block sand flow + mangroves cleared (new)<\/li><li>Coastal erosion fixes: hard (<span class=\"cm\" data-c=\"28\">seawalls, groynes<\/span>) + soft (<span class=\"cm\" data-c=\"29\">beach nourishment, dunes<\/span>, mangroves) (new) · India: <span class=\"cm\" data-c=\"30\">HADR, CDRI<\/span>, <span class=\"cm\" data-c=\"31\">MAHASAGAR<\/span><\/li><\/ul>"},{"t":"Migration","b":"<ul><li>216 million could be displaced within their countries by 2050 (World Migration Report 2024)<\/li><li>Ghoramara, Sundarbans: half the island lost → people moved to Sagar island · Tuvalu–Australia Falepili Union (2023): climate visas<\/li><li>India: no law for climate migrants, resettlement left to states (Kosi-eroded villages in Bihar moved with no rehabilitation)<\/li><\/ul>"},{"t":"Carbon markets","b":"<ul><li><span class=\"cm\" data-c=\"34\">CCTS 2023<\/span>: intensity targets for 9 big polluting sectors → buy credits or pay fines + <span class=\"cm\" data-c=\"35\">GEI Target Rules 2025<\/span>: 4 sectors, then 4 more → 208 units cut 3–7% by 2026–27 (penalty 2x credit price)<\/li><li>PAT (2012): energy-saving targets for big industry → over-achievers <span class=\"cm\" data-c=\"36\">sell ESCerts<\/span><\/li><li>Green Credit Programme 2023: credits for planting, water, waste · concern: buys credits instead of restoring<\/li><li>Article 6 (rules done at COP29): 6.2 country-to-country + 6.4 UN market replaces CDM · issues: greenwashing (<span class=\"cm\" data-c=\"37\">CCPA guidelines<\/span> 2024), weak verification + carbon colonialism (rich buyers pay for cheap offsets in poor countries instead of cutting at home) → fix: third-party <span class=\"cm\" data-c=\"38\">verification + Core Carbon Principles<\/span><\/li><li>World: carbon pricing tools 5 (2005) → 80, covering ≈29% of global GHG, 107 billion dollars revenue (World Bank 2025)<\/li><\/ul>"},{"t":"CCUS","b":"<ul><li>Capture CO₂ at the source → use it or store it (oil recovery, coal-bed methane, saline aquifers, basalt)<\/li><li>Why: hard-to-abate sectors (steel, cement, fertiliser) + <span class=\"cm\" data-c=\"39\">blue hydrogen + net<\/span> zero needs 11.4 Gt stored by 2070<\/li><li>India: NTPC Vindhyachal pilot (20 t a day) + Budget 2026–27 ₹20,000 crore over 5 years + target 750 mtpa (NITI) + 5 CCU testbeds for cement<\/li><li>Challenges: $100–150 billion cost + injection can trigger quakes + no law yet → fix: national CCS rules + storage maps + hub-and-cluster model<\/li><\/ul>"},{"t":"LBCR","b":"<ul><li>Land-Based Carbon Removal = using forests, soils, wetlands and farms to pull CO₂ out of the air and store it<\/li><li>Methods: reforestation (0.5–10 Gt CO₂ a year, IPCC) + soil carbon + <span class=\"cm\" data-c=\"49\">biochar<\/span> + <span class=\"cm\" data-c=\"50\">BECCS<\/span><\/li><li>Concern: climate pledges rely on ≈1 billion ha of land for it (Land Gap Report 2025) → competes with food and land rights (Mains 365)<\/li><\/ul>"}],"cm":{"0":"AR6 = IPCC's 6th Assessment Report (2021–23): the world's main scientific summary of climate change.","1":"SR1.5 = IPCC's 2018 special report comparing a 1.5°C world with a 2°C world.","2":"Carbon budget = the total CO₂ the world can still emit and stay under 1.5°C. Once it's spent, warming crosses the line.","3":"Hard-to-abate = heavy industries (steel, cement, fertiliser) and long-distance transport whose emissions can't be cut easily or cheaply just by switching to renewable power.","4":"MSMEs = Micro, Small and Medium Enterprises: small factories and workshops; most still run on coal, diesel or oil and can't afford clean tech.","5":"Maunder Minimum = 70 years (1645–1715) with almost no sunspots, so the sun gave slightly less energy and Europe got the 'Little Ice Age'.","6":"LiFE = Lifestyle for Environment: India's campaign for mindful use (switch off lights, save water, waste less). It shifts the focus from production to consumption.","7":"Primary energy = all energy used in its raw form (coal, oil, gas, sun, wind) before it becomes electricity or fuel. Fossil fuels still supply 87% of India's.","8":"GtC = gigatonnes of carbon. 1 gigatonne = 100 crore tonnes.","9":"CBAM = Carbon Border Adjustment Mechanism: an EU charge on imports based on the carbon emitted making them, so foreign goods pay the same carbon cost as EU goods.","10":"ICIMOD = International Centre for Integrated Mountain Development (Kathmandu): an 8-country research body for the Hindu Kush Himalaya.","11":"GLOF = glacial lake outburst flood: a lake held back by ice or loose rock bursts and floods valleys downstream.","12":"Albedo = how much sunlight a surface reflects. Ice reflects a lot; when it melts, the darker ground or sea absorbs more heat, so warming speeds up.","13":"NMSHE = National Mission for Sustaining the Himalayan Ecosystem: the NAPCC mission to study and protect Himalayan glaciers, forests and water. Himansh = India's high-altitude glacier research station in Lahaul-Spiti, Himachal.","14":"Ocean acidification = the sea absorbs CO₂ and turns slightly acidic, so corals and shellfish struggle to build their shells.","15":"Marine heatwave = days or weeks when a patch of sea stays unusually hot; it bleaches corals and kills fish.","16":"UNOC3 = 3rd UN Ocean Conference, Nice, June 2025 (France + Costa Rica): its Nice Ocean Action Plan pushes ocean funding, marine protected areas and the High Seas Treaty.","17":"Blue NDC Challenge = France and Brazil asking countries to put ocean goals into their climate pledges (NDCs) before COP30.","18":"Deep Ocean Mission (2021) = India's mission to explore the deep sea for minerals and life, including a crewed submersible (Samudrayaan).","19":"INCOIS = Indian National Centre for Ocean Information Services, Hyderabad: ocean, tsunami and cyclone warnings.","20":"ENSO = El Niño–Southern Oscillation: the Pacific swinging between a warm phase (El Niño) and a cool phase (La Niña), which shapes India's monsoon.","21":"Kigali Amendment (2016) = add-on to the Montreal Protocol to cut HFCs, the gases in ACs and fridges that don't harm ozone but heat the planet strongly.","22":"HCFC-141b = ozone-depleting gas used to blow foam (fridge and building insulation); India phased it out of foam-making from 1 Jan 2020.","23":"India Cooling Action Plan (2019) = plan to meet fast-growing AC and fridge demand with less energy and climate-friendly refrigerants.","24":"Adaptation gap = the difference between what countries need to cope with climate impacts and the money and action actually there.","25":"Climate litigation = taking governments or companies to court over climate harm (e.g. MK Ranjitsinh case, ICJ opinion).","26":"Storm surge = a cyclone's winds pile seawater up and push it onto land, like a sudden high tide.","27":"Dams trap river silt = sand and mud that rivers used to carry to the coast now settle behind dams, so beaches and deltas get no new sand and shrink.","28":"Groynes = low walls built out from the beach into the sea; they trap sand moving along the coast so the beach doesn't wash away.","29":"Beach nourishment = pumping or dumping fresh sand onto an eroding beach to rebuild it; dunes = natural sand hills behind the beach that absorb waves.","30":"CDRI = Coalition for Disaster Resilient Infrastructure (India-led, 2019): helps countries build roads, power and hospitals that survive disasters.","31":"MAHASAGAR = India's vision for Indian Ocean cooperation: security and growth for all countries in the region (successor to SAGAR) (new).","32":"NAPCC = National Action Plan on Climate Change (2008). Its 9 missions: Solar, Enhanced Energy Efficiency, Sustainable Habitat, Water, Himalayan Ecosystem, Green India, Sustainable Agriculture, Strategic Knowledge, and Health (the 9th, added later).","33":"National Adaptation Plan = a country's plan for coping with climate impacts (heat, floods, crops), prepared under the UNFCCC.","34":"CCTS = Carbon Credit Trading Scheme: India's own carbon market. Firms that beat their emissions target earn credits and sell them to firms that miss it.","35":"GEI Target Rules = Greenhouse gas Emission Intensity rules: fix how much GHG a sector may emit per unit of product (e.g. per tonne of cement).","36":"ESCerts = Energy Saving Certificates: earned by firms that save more energy than their PAT target and sold on the power exchange.","37":"CCPA = Central Consumer Protection Authority. Its 2024 guidelines stop companies making false 'eco-friendly' claims (greenwashing).","38":"Core Carbon Principles = quality benchmark for carbon credits (real, additional, permanent, verified) set by the Integrity Council for the Voluntary Carbon Market.","39":"Blue hydrogen = hydrogen made from natural gas, with the CO₂ captured and stored so it doesn't reach the air.","40":"Enhanced rock weathering = basalt dust spread on fields reacts with rainwater and CO₂ and locks the carbon away as bicarbonate for ≈10,000 years.","41":"3-NOP (and red seaweed) = cattle feed additives that block the stomach enzymes making methane, cutting it 30–80%.","42":"Direct Ocean Capture = pulling CO₂ out of seawater instead of air; seawater holds far more CO₂, so it's easier to extract.","43":"MISHTI = Mangrove Initiative for Shoreline Habitats &amp; Tangible Incomes: plants mangroves along the coast as a natural wall against storms, with income for locals.","44":"NICRA = National Innovations in Climate Resilient Agriculture (ICAR, 2011): research and village demos of farming that copes with heat, drought and floods.","45":"DBW-187 = a high-yield wheat variety bred to cope with heat (ICAR wheat institute, Karnal).","46":"Sponge cities = cities built to soak up rain (parks, wetlands, permeable pavements) instead of flooding.","47":"Early Warnings for All = UN goal that every person on Earth is covered by a disaster early-warning system by 2027.","48":"Mission Mausam (2024, ₹2,000 crore) = upgrade of India's weather forecasting: more radars and AI, to be 'weather ready and climate smart'.","49":"Biochar = charcoal made by burning crop waste with little oxygen; mixed into soil, it locks carbon away for centuries and makes the soil richer.","50":"BECCS = Bioenergy with Carbon Capture and Storage: grow energy crops, burn them for power, then capture the CO₂ and store it underground, so the net effect pulls CO₂ out of the air.","51":"Pachathuruthu = Kerala's \"green islets\" drive: local bodies and communities plant small native mini-forests on spare public land.","52":"Refuse-derived fuel (RDF) = dry burnable waste (plastic, paper) shredded into fuel for cement kilns instead of coal.","53":"Blended finance = public or donor money takes the first risk so private investors are willing to fund green projects.","54":"Climate budget tagging = marking each budget item by how much it helps climate action, so a state can track its green spending (Odisha first).","55":"Parametric insurance = payout comes automatically when a measured trigger is crossed (e.g. rain above X mm); no damage survey needed (Nagaland 2024).","56":"ISA = International Solar Alliance: India–France-led group of sunny countries to spread solar power; HQ in Gurugram."},"v":"5fb630"}],"circle":"g","pyq":["<b>2023 Q18 (15 marks):<\/b> The Intergovernmental Panel on Climate Change(IPCC) has predicted a global sea level rise of about one metre by AD 2100. What would be its impact in India and the other countries in the Indian Ocean region?","<b>2022 Q17 (15 marks):<\/b> Discuss global warming and mention its effects on the global climate. Explain the control measures to bring down the level of greenhouse gases which cause global warming, in the light of the Kyoto Protocol, 1997.","<b>2022 Q18 (15 marks):<\/b> Explain the causes and effects of coastal erosion in India. What are the available coastal management techniques for combating the hazard ?","<b>2017 Q17 (15 marks):<\/b> ‘Climate Change’ is a global problem. How India will be affected by climate change? How Himalayan and coastal states of India will be affected by climate change?"]},{"id":"b-climate-negotiations","subj":"s02","name":"Climate negotiations","cards":[{"id":"b-climate-negotiations:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"<span class=\"cm\" data-c=\"0\">UNFCCC<\/span> (Rio 1992) → CBDR-RC (<span class=\"cm\" data-c=\"1\">Common But Differentiated<\/span> Responsibilities and Respective Capabilities) · India's thread: climate justice + CBDR + finance is a legal duty of the North (<span class=\"cm\" data-c=\"2\">Article 9.1<\/span>) + low per-capita emissions"},{"sec":"Timeline"},{"t":"1997 Kyoto (COP3): binding cuts for rich countries only <button class=\"hs chipx\" data-h=\"0\">Kyoto + CDM<\/button>","h":"1997 Kyoto (COP3)"},{"t":"2009 Copenhagen (COP15): 2°C first recognised + voluntary pledges · India (<span class=\"cm\" data-c=\"5\">via BASIC<\/span>): intensity −20–25% by 2020 + <span class=\"cm\" data-c=\"6\">no intrusive audits (ICA)<\/span>","h":"2009 Copenhagen (COP15) · India (via BASIC)"},{"t":"2011 Durban (COP17): mandate for a post-2020 deal for all → Paris · India won \"agreed outcome with legal force\" wording","h":"2011 Durban (COP17)"},{"t":"2015 <button class=\"hs\" data-h=\"1\">Paris<\/button> (COP21): every country pledges (NDCs)","h":"2015 Paris (COP21)"},{"t":"2018 Katowice (COP24): Paris rulebook + transparency framework · India kept flexibility for developing countries","h":"2018 Katowice (COP24)"},{"t":"2021 Glasgow (COP26): Panchamrit <button class=\"hs chipx\" data-h=\"2\">Glasgow + Panchamrit<\/button>","h":"2021 Glasgow (COP26)"},{"t":"2022 Sharm el-Sheikh (<button class=\"hs\" data-h=\"3\">COP27<\/button>): loss and damage fund","h":"2022 Sharm el-Sheikh (COP27)"},{"t":"2023 Dubai (<button class=\"hs\" data-h=\"4\">COP28<\/button>): first Global Stocktake","h":"2023 Dubai (COP28)"},{"t":"2024 Baku (<button class=\"hs\" data-h=\"5\">COP29<\/button>): the finance COP","h":"2024 Baku (COP29)"},{"t":"2025 Belem (<button class=\"hs\" data-h=\"6\">COP30<\/button>): implementation and forests","h":"2025 Belem (COP30)"},{"sec":"Beyond the COPs"},{"t":"Courts <button class=\"hs chipx\" data-h=\"7\">ICJ opinion<\/button>"},{"t":"Trade <button class=\"hs chipx\" data-h=\"8\">CBAM<\/button>"},{"sec":"Gaps"},{"t":"pledges not binding + no fossil-fuel phase-out text","h":"P","lt":1},{"t":"technology locked behind IPR","h":"I","lt":1},{"t":"$100 billion never fully met + new goal counts loans + adaptation finance tripled but with no clear baseline","h":"F","lt":1},{"t":"North–South trust deficit + unilateral trade measures (CBAM)","h":"C","lt":1},{"sec":"Fixes"},{"t":"CBDR-RC to guide timelines and finance + grant-based finance + technology access as a right + NDC 3.0 with economy-wide targets + fund loss and damage and the TFFF"}],"hs":[{"t":"Kyoto + CDM","b":"<ul><li>Binding cuts only for <span class=\"cm\" data-c=\"3\">Annex I<\/span> (historical emitters) + market tools: <span class=\"cm\" data-c=\"4\">CDM, Joint<\/span> Implementation, emissions trading<\/li><li>India: exempt as a developing country + backed CBDR + one of the largest CDM beneficiaries (credits brought FDI and tech, kickstarted early RE)<\/li><li>Credit prices crashed, but keep the approach: CDM now replaced by Article 6.4 (COP29) + India's own CCTS<\/li><\/ul><div class=\"pic\"><img src=\"img/env/00.jpg\" alt=\"\" loading=\"lazy\"><\/div><div class=\"pic\"><img src=\"img/env/01.jpg\" alt=\"\" loading=\"lazy\"><\/div><div class=\"pic\"><img src=\"img/env/02.jpg\" alt=\"\" loading=\"lazy\"><\/div><div class=\"pic\"><img src=\"img/env/03.jpg\" alt=\"\" loading=\"lazy\"><\/div><div class=\"pic\"><img src=\"img/env/04.jpg\" alt=\"\" loading=\"lazy\"><\/div>"},{"t":"Paris","b":"<ul><li><span class=\"cm\" data-c=\"7\">Bottom-up NDCs<\/span> + well below 2°C, pursue 1.5°C + 5-year \"<span class=\"cm\" data-c=\"8\"><mark>ratchet mechanism<\/mark><\/span>\" + <span class=\"cm\" data-c=\"9\">Global Stocktake<\/span> + transparency framework<\/li><li>Art 6 carbon markets + <span class=\"cm\" data-c=\"10\">Art 8 loss and damage<\/span> (no liability) + CBDR \"in light of national circumstances\"<\/li><li>India's first NDC (2030): intensity −33–35% + 40% non-fossil capacity + 2.5–3 billion t extra sink<\/li><li>India + France launched the ISA: 125 members, HQ in India + Towards 1000 (1 trillion in solar investment, 1 billion people, by 2030)<\/li><li>India's stance: climate justice, not charity + right to eradicate poverty and grow + NDC conditional on finance ($100 billion a year) and technology transfer<\/li><\/ul>"},{"t":"Glasgow + Panchamrit","b":"<ul><li>First call to \"phase down unabated coal\" + cut inefficient fossil subsidies + Paris rulebook done (Art 6) + countries asked to revisit 2030 NDCs<\/li><li>Panchamrit: 500 GW non-fossil + 50% of energy from RE + 1 billion t less CO₂ + intensity −45% (all by 2030) + net zero 2070<\/li><li>India's updated NDC (2022): intensity −45% + 50% non-fossil capacity<\/li><li>NDC 2035: −47% + 60% + 3.5–4 billion t sink<\/li><li>Progress: intensity −36% by 2020 + non-fossil 52.57% (Feb 2026) + 2.29 billion t sink by 2021<\/li><li>India's stance: got coal \"phase-out\" changed to \"phase-down\" in the final text + launched LiFE + asked rich countries for $1 trillion in climate finance (new)<\/li><\/ul>"},{"t":"COP27","b":"<ul><li>Loss and Damage Fund agreed (after Pakistan floods 2022, ≈$30 billion loss) + call to reform development banks<\/li><li>India: proposed phase-down of all fossil fuels, not just coal + LiFE in the text + submitted its long-term low-emission strategy (<span class=\"cm\" data-c=\"11\">LT-LEDS<\/span>): roadmap to net zero 2070 (green hydrogen, nuclear, E20), conditional on finance<\/li><li>Gap: fund set up with no money<\/li><\/ul>"},{"t":"COP28","b":"<ul><li>First Global Stocktake: world off track for 1.5°C → \"transition away from fossil fuels\" (not phase-out)<\/li><li>Triple renewables + double efficiency by 2030 (India, China didn't sign: hidden curbs on coal)<\/li><li>Loss and Damage Fund running on Day 1 (≈$700 million pledged)<\/li><li>Transition text is \"just, orderly and equitable\": first mention of fossil fuels in ≈30 years of COPs<\/li><li>India and China also <span class=\"cm\" data-c=\"12\">stayed out of the Global Cooling Pledge<\/span><\/li><li>India: <span class=\"cm\" data-c=\"13\">Global Green Credit initiative<\/span> + offered to host COP33 (2028) + Global Biofuel Alliance<\/li><li>Gaps: loopholes (\"transitional fuels\" = gas, CCS) + loss-and-damage pledges tiny vs hundreds of billions needed a year → next: stronger NDC 3.0 (2025 round)<\/li><\/ul>"},{"t":"COP29","b":"<ul><li>New finance goal (<span class=\"cm\" data-c=\"14\">NCQG<\/span>): $300 billion a year by 2035, counting loans and private money (need: $1.3 trillion)<\/li><li>Article 6.4 UN carbon market adopted, replaces CDM<\/li><li>Replaces the unmet 100-billion goal (set 2009) + Baku Adaptation Roadmap + first Biennial Transparency Reports + gender programme extended 10 years<\/li><li>First <span class=\"cm\" data-c=\"15\">Article 6.2 transfer<\/span>: Switzerland–Thailand (Bangkok e-buses)<\/li><li>India: objected at the closing plenary (Chandni Raina) and called it an \"optical illusion\" + 2035 is too late for the 2030 NDCs + finance must be concessional grants, not loans + wants $600 billion of the $1.3 trillion as grants<\/li><li>Next: Baku-to-Belém Roadmap to 1.3 trillion a year<\/li><\/ul>"},{"t":"COP30","b":"<ul><li>Tropical <span class=\"cm\" data-c=\"16\">Forests Forever Facility<\/span> ($125 billion goal, ≈$5.5 billion pledged, 20% to Indigenous communities)<\/li><li>Adaptation finance tripled to $120 billion by 2035 + <span class=\"cm\" data-c=\"17\">Just Transition mechanism<\/span> + 59 <span class=\"cm\" data-c=\"18\">Global Goal on Adaptation indicators<\/span> + Baku-to-Belem Roadmap to $1.3 trillion<\/li><li>Belém Package (all 195 Parties): Belém Mission to 1.5°C + Belém 4x Pledge on sustainable fuels by 2035 (India among launchers) + Belém Health Action Plan (first health adaptation plan) + <span class=\"cm\" data-c=\"19\">PACT for<\/span> coal transitions<\/li><li>Also: Global Cooling Pledge reaches 72 nations + halve food waste by 2030<\/li><li>India: CBAM = disguised protectionism + TFFF observer + Art 9.1 finance is a legal duty + \"COP of adaptation\" + welcomed the Just Transition mechanism + rich countries to reach net zero earlier + technology access a right, not a bargaining chip<\/li><li>Gap: no fossil-fuel roadmap in the final text<\/li><\/ul>"},{"t":"ICJ opinion","b":"<ul><li>23 July 2025 (Vanuatu-led): states have legal duties to cut emissions; failure can be an internationally wrongful act → reparations<\/li><li><span class=\"cm\" data-c=\"20\">ITLOS 2024<\/span>: GHG emissions = marine pollution under UNCLOS<\/li><li>India argued CBDR + no new duties beyond UNFCCC and Paris · limit: advisory, not binding<\/li><\/ul>"},{"t":"CBAM","b":"<ul><li>EU carbon tax on imports from 1 Jan 2026: steel, cement, aluminium, fertiliser, hydrogen, electricity<\/li><li>India: cost ≈0.05% of GDP (CSE) + hits MSMEs + heavy paperwork → \"disguised protectionism\", against CBDR<\/li><\/ul>"}],"cm":{"0":"UNFCCC = UN Framework Convention on Climate Change (Rio 1992): the parent climate treaty. COPs are its yearly meetings.","1":"CBDR-RC = everyone must act, but rich countries that caused most of the problem must do more and pay more, according to their capacity.","2":"Article 9.1 (Paris) = says developed countries 'shall provide' finance to developing ones; India reads it as a legal duty, not charity.","3":"Annex I = the list of rich, industrialised countries (USA, UK, Russia, EU…) that had binding cuts under Kyoto.","4":"CDM = Clean Development Mechanism: rich countries funded clean projects in developing countries and counted the cuts as credits (CERs). India was a big winner.","5":"BASIC = Brazil, South Africa, India, China: a negotiating group of big developing countries.","6":"ICA = International Consultation and Analysis: developing countries' self-funded climate actions are only reviewed through consultation, not audited by outsiders.","7":"NDC = Nationally Determined Contribution: each country's own climate pledge under Paris, renewed every 5 years.","8":"Ratchet mechanism = every 5 years each country must submit a stronger pledge than the last. It can only go up, like a ratchet.","9":"Global Stocktake = a 5-yearly check under Paris of whether the world is on track; the first was done at COP28.","10":"Loss and damage = money for harm that can't be avoided or adapted to (homes washed away, islands lost).","11":"LT-LEDS = Long-Term Low Emission Development Strategy: India's 2022 roadmap to net zero by 2070 (green hydrogen, nuclear, ethanol).","12":"Global Cooling Pledge (COP28): cut cooling-related emissions 68% by 2050 vs 2022 + efficient ACs and fridges. India stayed out because its cooling demand is still growing.","13":"Global Green Credit Initiative (India, COP28): credits for planting on degraded land + an online platform to share ideas. Global Biofuel Alliance (India-led, G20 Delhi 2023, with US and Brazil): spread ethanol and other biofuels worldwide.","14":"NCQG = New Collective Quantified Goal: the new climate-finance target that replaces the old 100-billion-dollar goal: 300 billion dollars a year by 2035.","15":"Article 6.2 = two countries trade carbon credits directly (e.g. Thailand's e-bus cuts counted by Switzerland).","16":"TFFF = a fund that invests money and pays tropical countries every year for each hectare of forest they keep standing.","17":"Just transition = moving away from coal and oil without leaving workers and coal regions behind (new jobs, training, support).","18":"Global Goal on Adaptation = Paris goal to measure how well countries are coping with climate impacts; COP30 agreed 59 indicators (water, health, infrastructure).","19":"PACT = a COP30 initiative to support coal-dependent regions in moving away from coal.","20":"ITLOS = International Tribunal for the Law of the Sea (Hamburg): the UN court for ocean law."},"v":"25dd22"}],"circle":"g","pyq":["<b>2025 Q18 (15 marks):<\/b> Write a review on India’s climate commitments under the Paris Agreement (2015) and mention how these have been further strengthened in COP26 (2021). In this direction, how has the first Nationally Determined Contribution intended by India been updated in 2022?","<b>2022 Q17 (15 marks):<\/b> Discuss global warming and mention its effects on the global climate. Explain the control measures to bring down the level of greenhouse gases which cause global warming, in the light of the Kyoto Protocol, 1997.","<b>2021 Q17 (15 marks):<\/b> Describe the major outcomes of the 26th session of the Conference of the Parties (COP) to the United Nations Framework Convention on Climate Change (UNFCCC). What are the commitments made by India in this conference?","<b>2014 Q13 (12.5 marks):<\/b> Should the pursuit of carbon credits and clean development mechanisms set up under UNFCCC be maintained even though there has been a massive slide in the value of a carbon credit? Discuss with respect to India’s energy needs for economic growth."]},{"id":"b-air","subj":"s03","name":"Air","cards":[{"id":"b-air:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Causes"},{"t":"<span class=\"cm\" data-c=\"0\">weak standards: India's<\/span> PM2.5 limit (40) is 8x WHO's","h":"P","lt":1},{"t":"monitoring thin in small towns and villages","h":"I","lt":1},{"t":"winter inversion + low wind + north-westerly dust trap pollution","h":"N","lt":1},{"t":"open waste burning (Ghazipur landfill fires)","h":"C","lt":1},{"t":"vehicles + construction dust + stubble + coal plants (Delhi PM2.5: transport 23%, biomass burning 20%, dust 15%, industry 9%, CAQM) <button class=\"hs chipx\" data-h=\"0\">Photochem smog<\/button>","h":"H","lt":1},{"t":"about <mark>⅔ of Delhi's PM2.5 comes from outside Delhi<\/mark>","h":"C","lt":1},{"sec":"Effects"},{"t":"Health: 2nd biggest death risk after high BP + ≈15% of Delhi deaths (2023)","h":"Health"},{"t":"Environment: acid rain + urban heat island","h":"Environment"},{"t":"Economy: ≈9.5% of GDP lost (Lancet 2025)","h":"Economy"},{"t":"Governance: 66 of the world's 100 most polluted cities are Indian (IQAir 2025)","h":"Governance"},{"t":"Society: the poor and outdoor workers breathe it most","h":"Society"},{"sec":"Solutions"},{"t":"raise standards to WHO level <button class=\"hs chipx\" data-h=\"1\">WHO AQG 2021<\/button>","h":"P","lt":1},{"t":"implement better, target PM2.5 not just PM10 <button class=\"hs chipx\" data-h=\"2\">NCAP<\/button>","h":"P","lt":1},{"t":"monitors from 25 to 1,600 + <span class=\"cm\" data-c=\"5\">SAFAR<\/span> real-time tracking + <button class=\"hs\" data-h=\"3\">cloud seeding<\/button> trials","h":"I","lt":1},{"t":"scale Delhi's GRAP to other airsheds, move to an <mark>airshed approach<\/mark> <button class=\"hs chipx\" data-h=\"4\">Delhi model<\/button>","h":"N","lt":1},{"t":"awareness + end open waste and stubble burning","h":"C","lt":1},{"t":"clean the source: EVs (7.6% share in 2024 → 30% by 2030) + CNG + cleaner industrial fuels + phase out old vehicles","h":"H","lt":1},{"t":"<span class=\"cm\" data-c=\"8\">emissions trading (Surat<\/span> 2019, best practice)","h":"F","lt":1},{"t":"NCR states' joint annual plans + regional caps <button class=\"hs chipx\" data-h=\"5\">Gothenburg 1999<\/button>","h":"C","lt":1}],"hs":[{"t":"Photochem smog","b":"<ul><li>Classical smog: coal SO₂ + smoke + fog → grey haze, cold humid winters<\/li><li>Photochemical smog: NOx + VOCs (vehicles, industry) + strong sunlight → ground-level ozone → brown haze, warm sunny cities<\/li><li>Effects: lungs and eyes + SO₂ and NO₂ erode buildings (yellowing Taj) + acid rain<\/li><li>Fix: cut NOx <span class=\"cm\" data-c=\"1\">and VOCs<\/span> at source + regional caps (Gothenburg)<\/li><\/ul>"},{"t":"WHO AQG 2021","b":"<ul><li>First update since 2005, tighter for most pollutants<\/li><li>PM2.5 annual 10 → 5 + PM2.5 24-hour 25 → 15 + PM10 annual 20 → 15 + NO₂ annual 40 → 10<\/li><li>New: 24-hour NO₂, peak-season ozone, 24-hour CO limits<\/li><li><span class=\"cm\" data-c=\"2\">India's NAAQS (2009): PM2.5 annual 40 = 8x the new WHO level<\/span> → revise NAAQS<\/li><\/ul>"},{"t":"NCAP","b":"<ul><li>2019: cut particulate pollution 40% by 2026 (vs 2017) in 131 <span class=\"cm\" data-c=\"3\">non-attainment cities through<\/span> city action plans<\/li><li>Who: CPCB monitors, SPCBs and ULBs implement, MoEFCC funds<\/li><li>Problems: P chases PM10, not PM2.5 · N city by city, not airshed · H root causes untouched · F money spent on water sprinkling for dust<\/li><li>Fix: target PM2.5 + airshed <span class=\"cm\" data-c=\"4\">plans + source apportionment<\/span> in every city + health-based targets<\/li><\/ul>"},{"t":"Cloud seeding","b":"<ul><li>Silver iodide, potassium iodide or dry ice sprayed from aircraft → nuclei that pull water vapour into rain · hygroscopic (liquid clouds) vs glaciogenic (supercooled clouds)<\/li><li>India: IIT Kanpur trial over Delhi to wash out pollution · World: Dubai for rain<\/li><li>Uses: clear smog and dust + rain in drought areas + less hail, wildfire control, more winter snow<\/li><li>Concerns: floods and landslides + disturbs natural weather + silver iodide may be toxic + costs unclear → fix: research + environmental safeguards + clear rules<\/li><\/ul>"},{"t":"Delhi model","b":"<ul><li><span class=\"cm\" data-c=\"6\">CAQM Act 2021 (replaced EPCA) runs<\/span> GRAP for the whole NCR<\/li><li><span class=\"cm\" data-c=\"7\">GRAP: 4 stages<\/span> by AQI: Poor (201–300) → Very poor (301–400) → Severe (401–450) → Severe+ (450+)<\/li><li>Beijing model: average PM2.5 cut from 144 to 92 (2015–2024)<\/li><li>Polluter pays: environmental compensation (SC, Lodhi Property case)<\/li><\/ul>"},{"t":"<span class=\"cm\" data-c=\"9\">Gothenburg 1999<\/span>","b":"<ul><li>Under UNECE Convention on Long-Range Transboundary Air Pollution<\/li><li>Caps on SO₂, NOx, VOCs and ammonia<\/li><li>Lesson: air crosses borders, so caps must be regional, not city-wise<\/li><\/ul>"}],"cm":{"0":"NAAQS = National Ambient Air Quality Standards: India's legal limits for each pollutant in outdoor air (set by CPCB, 2009).","1":"VOCs = volatile organic compounds: gases from petrol, paints, solvents; with NOx and sunlight they make ozone smog.","2":"NAAQS = National Ambient Air Quality Standards (CPCB, 2009): legal safe limits for 12 pollutants in outdoor air.","3":"Non-attainment city = a city that failed to meet national air quality standards for 5 years in a row.","4":"Source apportionment = a study showing how much pollution comes from each source (vehicles, dust, industry, stubble).","5":"SAFAR = System of Air Quality and Weather Forecasting and Research: real-time air-quality forecasts for big cities (IITM Pune).","6":"CAQM = Commission for Air Quality Management in NCR and adjoining areas: one body for Delhi's airshed, with power to order and fine. EPCA = the SC-appointed body it replaced.","7":"GRAP = Graded Response Action Plan: restrictions that tighten automatically as AQI worsens (stage I to IV: construction bans, truck bans, school closures).","8":"Emissions trading (Surat) = factories get pollution permits; those that cut more can sell their spare permits to others, so cuts happen where they're cheapest.","9":"Gothenburg Protocol = a European treaty that sets national caps on 4 pollutants that drift across borders. UNECE = UN Economic Commission for Europe."},"v":"2abf12"}],"circle":"g","group":"Pollutions","pyq":["<b>2025 Q7 (10 marks):<\/b> What is Carbon Capture, Utilization and Storage (CCUS)? What is the potential role of CCUS in tackling climate change?","<b>2023 Q15 (15 marks):<\/b> The adoption of electric vehicles is rapidly growing worldwide. How do electric vehicles contribute to reducing carbon emissions and what are the key benefits they offer compared to traditional combustion engine vehicles?","<b>2022 Q7 (10 marks):<\/b> Discuss in detail the photochemical smog emphasizing its formation, effects and mitigation. Explain the 1999 Gothenburg Protocol.","<b>2021 Q7 (10 marks):<\/b> Describe the key points of the revised Global Air Quality Guidelines (AQGs) recently released by the World Health Organisation (WHO). How are these different from its last update in 2005? What changes in India’s National Clean Air Programme are required to achieve these revised standards ?","<b>2020 Q17 (15 marks):<\/b> What are the key features of the National Clean Air Programme (NCAP) initiated by the Government of India?","<b>2014 Q15 (12.5 marks):<\/b> Environmental Impact Assessment studies are increasingly undertaken before a project is cleared by the Government. Discuss the environmental impacts of coal-fired thermal plants located at coal pitheads."]},{"id":"b-water","subj":"s03","name":"Water","cards":[{"id":"b-water:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"<mark>water bankruptcy<\/mark> = long-term use &gt; what nature refills (UNU-INWEH) + India has 18% of people, 4% of fresh water"},{"sec":"Causes"},{"t":"weak checks on industry and cities + Draft National Water Policy 2020 still not adopted","h":"P","lt":1},{"t":"aquifers mapped late (NAQUIM), little real-time data","h":"I","lt":1},{"t":"climate change (groundwater depletion may triple by 2080)","h":"N","lt":1},{"t":"sea-level rise + storm surges push seawater into coastal aquifers <button class=\"hs chipx\" data-h=\"0\">Seawater intrusion<\/button>","h":"N","lt":1},{"t":"overuse + nitrogen fertiliser overuse (nitrate now the most widespread groundwater pollutant) + idol immersion during festivals","h":"C","lt":1},{"t":"untreated sewage (&gt;60% enters rivers) + industry (sugar, paper, tanneries, dyeing) <button class=\"hs chipx\" data-h=\"1\">Industrial pollution<\/button>","h":"H","lt":1},{"t":"farms draw 87% of <button class=\"hs\" data-h=\"2\">groundwater<\/button>","h":"H","lt":1},{"t":"sewage plants costly to build and run, so few get built","h":"F","lt":1},{"t":"water = State subject, inter-state rivers = Union (Art 262) → many agencies, states fight over water <button class=\"hs chipx\" data-h=\"3\">Urban water governance<\/button>","h":"C","lt":1},{"sec":"Effects"},{"t":"Health: cholera, typhoid + blue-baby syndrome, fluorosis, cancers","h":"Health"},{"t":"Environment: <span class=\"cm\" data-c=\"6\">eutrophication<\/span>, dead zones + 296 polluted stretches on 271 rivers (CPCB 2025)"},{"t":"Economy: ≈3% of GDP lost (World Bank) + threat to 75% of wheat and 65% of rice (NITI 2019)","h":"Economy"},{"t":"Governance: city water crises (Chennai 2019, Bengaluru 2024) + inter-state disputes","h":"Governance"},{"t":"Society: women and girls spend 200 million hours collecting water (UNICEF, global) + 20% of households lack tap water","h":"Society"},{"sec":"Solutions"},{"t":"one national water law <button class=\"hs chipx\" data-h=\"4\">NWP 2012<\/button>","h":"P","lt":1},{"t":"clean rivers basin by basin <button class=\"hs chipx\" data-h=\"5\">Namami Gange<\/button>","h":"P","lt":1},{"t":"tap water for every home <button class=\"hs chipx\" data-h=\"6\">Jal Jeevan Mission<\/button><button class=\"hs chipx\" data-h=\"7\">AMRUT 2.0<\/button>","h":"P","lt":1},{"t":": <span class=\"cm\" data-c=\"10\">GRACE satellite<\/span> for groundwater + IN-GRES + AI and GIS to site farm ponds + IoT sensors + <span class=\"cm\" data-c=\"11\">RTDAS water-level data<\/span> (National Hydrology Project)","h":"I","lt":1},{"t":"plan by basin, keep minimum <mark>e-flow<\/mark> (EU Water Framework Directive), revive water bodies (Mission Kakatiya: 46,531 tanks) <button class=\"hs chipx\" data-h=\"8\">Amrit Sarovar<\/button><button class=\"hs chipx\" data-h=\"9\">River linking<\/button>","h":"N","lt":1},{"t":"community action: <span class=\"cm\" data-c=\"13\">Jal Sanchay Jan Bhagidari<\/span> + Atal Bhujal + <span class=\"cm\" data-c=\"14\">Neeru-Chettu<\/span> (Andhra: 1.2 lakh structures repaired)","h":"C","lt":1},{"t":"<span class=\"cm\" data-c=\"15\">clean the source: ZLD<\/span> + CETPs + less nitrogen fertiliser (natural farming) + drip and sprinkler","h":"H","lt":1},{"t":"water pricing + tradable pollution permits for water (like air emissions trading)","h":"F","lt":1},{"t":"National Water Commission (<span class=\"cm\" data-c=\"16\">merge CWC<\/span> + CGWB, Mihir Shah) + basin authorities","h":"C","lt":1}],"hs":[{"t":"Seawater intrusion","b":"<ul><li>What: saline seawater moves into coastal freshwater aquifers when freshwater pressure falls; risk along the 7,500 km coast (Gujarat, Tamil Nadu, Andhra, Kerala) (new, CivilsDaily)<\/li><li>Causes: over-pumping near coasts + sea-level rise, cyclones, storm surges + wetland loss and sand mining (Chennai lost 85% of its wetlands, WWF) + less silt to deltas (dams, river linking)<\/li><li>Fix: artificial recharge (recharge wells, subsurface dykes) + caps and licensing on coastal borewells + mangroves + salt-tolerant crops (ICAR-CSSRI rice) (new, CivilsDaily)<\/li><\/ul>"},{"t":"Industrial pollution","b":"<ul><li>Industry dumps heavy metals (lead, mercury, chromium) + dyes, phenols + hot water<\/li><li>Cases: Kali river, UP (sugar mills, distilleries, paper mills → black water, no aquatic life) + Noyyal, Tamil Nadu (Tiruppur dyeing units → farmland infertile, groundwater salty)<\/li><li>Fix: <mark>zero liquid discharge<\/mark> for textile units + CETPs + online effluent monitoring<\/li><li>Law: Water Act 1974 (2024 amendment: fines by adjudicating officers go to the Environment Protection Fund) + EPA 1986 + NGT<\/li><\/ul>"},{"t":"Groundwater","b":"<ul><li><span class=\"cm\" data-c=\"0\">Status (CGWB<\/span> 2025): 10.8% of units over-exploited (17.2% in 2017) + India ≈25% of world groundwater use<\/li><li>Why: <span class=\"cm\" data-c=\"1\">Easement Act 1882<\/span> ties water to land + cities seal recharge zones + land subsidence in 5 megacities<\/li><li>Pollution: 28.3% of samples exceed a BIS limit: nitrate → blue-baby syndrome, fluoride → fluorosis (Nalgonda technique), arsenic → cancers (<span class=\"cm\" data-c=\"2\">phytoremediation<\/span>) + uranium (Punjab, Haryana)<\/li><li>Steps: Atal Bhujal + <span class=\"cm\" data-c=\"3\">NAQUIM<\/span> + <span class=\"cm\" data-c=\"4\">IN-GRES<\/span> → next: National Water Commission (Mihir Shah) + groundwater rights apart from land<\/li><\/ul><details><summary>Atal Bhujal<\/summary><ul><li>2019, World Bank-backed, 7 water-stressed states: community-led groundwater management, gram panchayats make water security plans (new)<\/li><\/ul><\/details>"},{"t":"Urban water governance","b":"<ul><li>Indore contaminated tap-water crisis + many agencies, nobody accountable (Gurugram)<\/li><li>≈38% of water lost as <span class=\"cm\" data-c=\"5\">non-revenue water (leaks, theft) + borewell<\/span> and tanker dependence (Chennai 2019, Bengaluru 2024)<\/li><li>Best practice: Rajasthan's Mukhyamantri Jal Swavlamban Abhiyan (\"four waters\") → groundwater up ≈4%<\/li><li>Fix: 100% wastewater treatment and reuse + Integrated Urban Water Management + water budgeting + Jan Bhagidari<\/li><\/ul>"},{"t":"NWP 2012","b":"<ul><li>National Water Policy 2012 (earlier 1987, 2002): drinking water and sanitation first, then water as an economic good + minimum ecological flow + basin-level planning<\/li><li>Water Regulatory Authority in each state + pricing to save water + a national framework law<\/li><li>Draft NWP 2020 (Mihir Shah) not adopted: from building dams to managing demand + groundwater as a common resource<\/li><li>National Water Mission (NAPCC): water-use efficiency +20% + basin plans<\/li><\/ul>"},{"t":"Namami Gange","b":"<ul><li>NMCG <span class=\"cm\" data-c=\"7\">implements: 127 STPs working (Mar 2025) + CETPs<\/span> for industry<\/li><li>Earlier plans (<span class=\"cm\" data-c=\"8\">GAP 1985<\/span>, GAP-II, NGRBA) faltered: P only sewage, not the whole basin · N no <span class=\"cm\" data-c=\"9\">e-flow<\/span> · H states didn't run STPs after building them<\/li><li>Now: I NGT 2022 found untreated waste in 60% of the Ganga · F only 69% of funds used till 2024–25<\/li><li>Quantum leaps: basin-level management with minimum e-flow + autonomous pollution boards + real-time AI tracking (Ganga digital twin)<\/li><\/ul>"},{"t":"Jal Jeevan Mission","b":"<ul><li>Tap water to every rural household + water-quality monitoring + Panchayats run and maintain it<\/li><li>Gap: 20% of households still lack tap water<\/li><\/ul>"},{"t":"AMRUT 2.0","b":"<ul><li>Water-secure cities: tap connections to all households in 500 AMRUT cities<\/li><li>Outcome-based funding + circular economy of water (treated wastewater reuse)<\/li><\/ul>"},{"t":"Amrit Sarovar","b":"<ul><li>75 water bodies per district, built or revived with people's participation<\/li><li>68,000+ completed (Mar 2025), 46,000 of them under MGNREGS<\/li><\/ul>"},{"t":"River linking","b":"<ul><li><span class=\"cm\" data-c=\"12\">NPP 1980 (NWDA)<\/span>: 30 links = 14 Himalayan + 16 Peninsular; Ken–Betwa is the first (MP + UP, Bundelkhand)<\/li><li>For: surplus to deficit basins → drought and flood relief + irrigation + hydropower + navigation<\/li><li>Against: forests drowned (Panna Tiger Reserve, ≈20,000 people affected) + less silt → deltas sink, seawater intrusion + costly, slow, states fight<\/li><\/ul>"}],"cm":{"0":"CGWB = Central Ground Water Board; CWC = Central Water Commission (surface water). Mihir Shah wanted them merged into one National Water Commission.","1":"Easement Act 1882 = whoever owns land owns the groundwater under it, so there's no limit on pumping.","2":"Phytoremediation = using plants to absorb or break down toxins in soil and water. Bioremediation = using microbes for the same.","3":"NAQUIM = National Aquifer Mapping and Management Programme: maps underground water layers to plan their use.","4":"IN-GRES = India Groundwater Resource Estimation System: CGWB's online tool that rates every block safe, semi-critical, critical or over-exploited.","5":"Non-revenue water = water a city supplies but never bills for: lost to leaks, theft and faulty meters.","6":"Eutrophication = fertiliser and sewage overfeed algae; the algae bloom, die and rot, using up oxygen, so fish die (dead zones).","7":"CETP = Common Effluent Treatment Plant: one shared treatment plant for a cluster of small factories that can't afford their own. NMCG = National Mission for Clean Ganga (2011): the body that runs Namami Gange. NGRBA = National Ganga River Basin Authority (2009, PM-chaired): the first basin-level body, replaced by the National Ganga Council (2016).","8":"GAP = Ganga Action Plan (1985), India's first river-cleaning plan. NGRBA = National Ganga River Basin Authority (2009). NMCG = National Mission for Clean Ganga: the body that runs Namami Gange.","9":"E-flow (environmental flow) = the minimum water a river must keep flowing to stay alive for fish, people and the delta.","10":"GRACE = NASA–German satellites that measure tiny changes in Earth's gravity to track groundwater loss from space.","11":"RTDAS = Real Time Data Acquisition System: automatic stations that send live surface- and groundwater-level data, installed under the National Hydrology Project.","12":"NPP = National Perspective Plan for river linking (1980); NWDA = National Water Development Agency, which studies the links.","13":"Jal Sanchay Jan Bhagidari = 'water saving through people's participation': villages build recharge structures with local funds and labour.","14":"Neeru-Chettu = Andhra's 'water and trees' campaign to desilt tanks and plant trees with community help.","15":"Zero liquid discharge (ZLD) = a factory treats and reuses all its wastewater, releasing none.","16":"CWC = Central Water Commission: apex technical body for surface water (dams, flood forecasts). CGWB = its groundwater counterpart. Mihir Shah Committee (2016): merge both into one National Water Commission."},"v":"89db96"}],"circle":"g","group":"Pollutions","pyq":["<b>2025 Q8 (10 marks):<\/b> Seawater intrusion in the coastal aquifers is a major concern in India. What are the causes of seawater intrusion and the remedial measures to combat this hazard?","<b>2025 Q13 (15 marks):<\/b> Examine the factors responsible for depleting groundwater in India. What are the steps taken by the government to mitigate such depletion of groundwater?","<b>2024 Q7 (10 marks):<\/b> Industrial pollution of river water is a significant environmental issue in India. Discuss the various mitigation measures to deal with this problem and also the government’s initiative in this regard.","<b>2022 Q18 (15 marks):<\/b> Explain the causes and effects of coastal erosion in India. What are the available coastal management techniques for combating the hazard ?","<b>2019 Q7 (10 marks):<\/b> Coastal sand mining, whether legal or illegal, poses one of the biggest threats to our environment. Analyze the impact of sand mining along the Indians coasts, citing specific examples.","<b>2017 Q8 (10 marks):<\/b> Not many years ago, river linking was a concept but it is becoming reality in the country. Discuss the advantages of river linking and its possible impact on the environment.","<b>2015 Q15 (12.5 marks):<\/b> Discuss the Namami Gange and National Mission for Clean Ganga (NMCG) programmes and causes of mixed results from the previous schemes. What quantum leaps can help preserve the river Ganga better than incremental inputs?","<b>2013 Q20 (10 marks):<\/b> Enumerate the National Water Policy of India. Taking river Ganges as an example, discuss the strategies which may be adopted for river water pollution control and management. What are the legal provisions of management and handling of hazardous wastes in India?"]},{"id":"b-plastic","subj":"s03","name":"Plastic","cards":[{"id":"b-plastic:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"India makes ≈4 million t of plastic waste a year (CPCB) + 3rd in the world in single-use plastic"},{"sec":"Causes"},{"t":"weak enforcement of the single-use plastic ban (thin bags back in markets)","h":"P","lt":1},{"t":"compostable or bio-based plastic is only 1.5% of plastic + few cheap alternatives","h":"I","lt":1},{"t":"plastic never breaks down, only fragments into microplastics","h":"N","lt":1},{"t":"throwaway habits: per-capita plastic waste doubled in 5 years","h":"C","lt":1},{"t":"packaging and FMCG (world makes 460+ million t of plastic a year) + informal recycling <button class=\"hs chipx\" data-h=\"0\">Plastic types<\/button>","h":"H","lt":1},{"t":"plastic stays cheaper: tariffs on plastics cut to 7.2% while alternatives (bamboo) pay ≈14.4%","h":"F","lt":1},{"t":": <span class=\"cm\" data-c=\"0\">global plastics treaty talks stalled (INC adjourned<\/span> without consensus)","h":"C","lt":1},{"sec":"Effects"},{"t":"Health: microplastics enter food and blood","h":"Health"},{"t":"Environment: ≈20 million t of plastic leaks into nature every year (WEF)","h":"Environment"},{"t":"Society: waste pickers and coastal communities bear it","h":"Society"},{"sec":"Solutions"},{"t":"strict EPR audits + enforce the ban <button class=\"hs chipx\" data-h=\"1\">SUP ban + EPR<\/button>","h":"P","lt":1},{"t":"cheap alternatives (KVIC's <span class=\"cm\" data-c=\"3\">Project REPLAN<\/span>, compostables) + National Dashboard on SUP","h":"I","lt":1},{"t":"carry-your-own-bag habits (Sikkim)","h":"C","lt":1},{"t":"replace at source: Mandatory Jute Packaging Act 2010 + recycled-content mandates","h":"H","lt":1},{"t":"<span class=\"cm\" data-c=\"4\">Plastic Parks<\/span> (10 approved, grants up to 50%) + fix tariffs so alternatives are cheaper","h":"F","lt":1},{"t":"industry pacts (<span class=\"cm\" data-c=\"5\">India Plastics Pact<\/span>, Un-Plastic Collective) + a global treaty covering the whole life cycle + <span class=\"cm\" data-c=\"6\">synergy with the BRS conventions<\/span>","h":"C","lt":1}],"hs":[{"t":"Plastic types","b":"<div class=\"pic\"><img src=\"img/env/05.jpg\" alt=\"\" loading=\"lazy\"><\/div><ul><li>PET: a pet dog drinking from a plastic bottle → everywhere, highly recyclable<\/li><li>PVC: plumbing pipes → industrial, toxins, low recyclability<\/li><li>PP: double P = Tupperware → goes in the microwave, heat resistant<\/li><li>PS: sounds like Styrofoam → crumbles, very low recyclability<\/li><\/ul>"},{"t":"SUP ban + EPR","b":"<ul><li>PWM Amendment Rules 2021: single-use plastic items banned from Jul 2022 + <span class=\"cm\" data-c=\"1\">EPR on plastic packaging<\/span> (2022): producers, importers, brand owners answer for the whole life cycle<\/li><li><span class=\"cm\" data-c=\"2\">PWM Rules 2024<\/span>: Panchayats assess local plastic waste + PWM Rules 2026: more recycled plastic in packaging<\/li><li>Worked: Sikkim (plastic bags banned in 1998) · Failed: 2022 ban (weak enforcement, few cheap alternatives)<\/li><\/ul>"}],"cm":{"0":"INC = Intergovernmental Negotiating Committee, set up by the UN Environment Assembly (2022) to write a global plastics treaty; talks failed at Busan (2024) and Geneva (2025).","1":"EPR = Extended Producer Responsibility: the company that sells the product must pay for collecting and recycling it after use.","2":"PWM Rules = Plastic Waste Management Rules (2016, amended many times since).","3":"Project REPLAN = KVIC scheme that mixes plastic waste with cotton fibre to make carry bags.","4":"Plastic Park = an industrial zone with shared facilities for plastic recycling and processing units.","5":"India Plastics Pact (CII + WWF India, 2021, first in Asia): companies pledge all plastic packaging reusable or recyclable by 2030. Un-Plastic Collective (UNEP + CII + WWF India, 2019): voluntary company pledges to cut plastic waste.","6":"BRS = Basel (hazardous-waste trade), Rotterdam (prior consent for hazardous chemicals trade) and Stockholm (persistent organic pollutants) conventions, run together by UNEP."},"v":"d54615"}],"circle":"y","group":"Pollutions"},{"id":"b-oil-spills","subj":"s03","name":"Oil Spills","cards":[{"id":"b-oil-spills:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"oil pollution = petroleum released into the sea from tankers, ship accidents, offshore rigs, pipelines and routine discharge (new)"},{"sec":"Causes"},{"t":"weak checks on cargo declarations and hazardous-goods handling","h":"P","lt":1},{"t":"little real-time detection at sea","h":"I","lt":1},{"t":"rough monsoon seas and cyclones sink ships (MSC ELSA 3 off Kochi, May 2025)","h":"N","lt":1},{"t":"tanker and cargo-ship accidents, fires, collisions + routine discharge <button class=\"hs chipx\" data-h=\"0\">Maritime disasters<\/button>","h":"H","lt":1},{"t":"insurance disputes delay clean-up","h":"F","lt":1},{"t":"tangled ownership across countries, nobody answers","h":"C","lt":1},{"sec":"Effects"},{"t":"Environment: oil film blocks light and oxygen → plankton and corals die + coats seabirds and turtles + toxins climb the food chain (new)","h":"Environment"},{"t":"Economy: fishing and coastal tourism lose","h":"Economy"},{"t":"Society: fishing communities lose livelihoods","h":"Society"},{"t":"Why worse for India: 7,500 km coast + most crude arrives by sea + fragile mangroves (Sundarbans), coral reefs (Gulf of Mannar), turtle nesting beaches (Odisha) (new)","h":"Why worse for India"},{"sec":"Solutions"},{"t":"enforce SOLAS + polluter pays + honest cargo declaration","h":"P","lt":1},{"t":": <span class=\"cm\" data-c=\"1\">electronic cargo tracking + satellite detection (RISAT)<\/span>","h":"I","lt":1},{"t":"<mark>bioremediation<\/mark> (<span class=\"cm\" data-c=\"2\">Oilzapper<\/span>, Oilivorous-S by TERI) + natural sorbents (milkweed fibre)","h":"N","lt":1},{"t":"booms and skimmers + standard safety SOPs","h":"H","lt":1},{"t":"National Oil Spill Disaster Contingency Plan (Coast Guard) + MARPOL, UNCLOS","h":"C","lt":1}],"hs":[{"t":"Maritime disasters","b":"<ul><li>MSC ELSA 3 sank off Kochi + fire on MV Wan Hai 503 off Kerala (2025)<\/li><li>Mauritius, MV Wakashio (2020)<\/li><li>Problems: tangled ownership (Liberian flag, German owner, Cyprus manager) + insurance disputes delay clean-up<\/li><li>Rules: IMO conventions (SOLAS 1974, <span class=\"cm\" data-c=\"0\">MARPOL<\/span>, IMDG Code) + Merchant Shipping Act 1958 + National Oil Spill Disaster Contingency Plan (Coast Guard)<\/li><\/ul>"}],"cm":{"0":"MARPOL = treaty on pollution from ships (oil, sewage, garbage). SOLAS = treaty on ship safety. IMDG Code = rules for carrying dangerous goods by sea. SOLAS 1974 = IMO's Safety of Life at Sea convention (how ships are built, fire safety, lifeboats). IMDG Code = how dangerous goods must be packed, labelled and declared on ships.","1":"RISAT = ISRO's Radar Imaging Satellites: see through clouds and at night → spot oil slicks.","2":"Oilzapper = TERI's mix of oil-eating bacteria sprayed on spills to break oil down naturally."},"v":"a199f6"}],"circle":"g","group":"Pollutions","pyq":["<b>2023 Q8 (10 marks):<\/b> What is oil pollution? What are its impacts on the marine ecosystem? In what way is oil pollution particularly harmful for a country like India?"]},{"id":"b-solid-waste","subj":"s03","name":"Solid Waste","cards":[{"id":"b-solid-waste:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"62 million t a year generated, 43 collected, only 12 treated (TERI) → 165 million t by 2030"},{"sec":"Causes"},{"t":"rules not implemented + no political will + no designated sites → open dumps and legacy landfills (≈8.8 crore t legacy waste, Ghazipur fires)","h":"P","lt":1},{"t":"no <mark>segregation at source<\/mark> + low door-to-door collection","h":"C","lt":1},{"t":"overconsumption + FMCG packaging: consumption grew, collection didn't + too few processing units: only 15–20% processed","h":"H","lt":1},{"t":"low municipal finance (poor creditworthiness)","h":"F","lt":1},{"t":"overlapping jurisdiction between agencies","h":"C","lt":1},{"sec":"Effects"},{"t":"Health: landfill fires and disease near dumps","h":"Health"},{"t":"Environment: <span class=\"cm\" data-c=\"0\">leachate<\/span> into groundwater + methane from landfills","h":"Environment"},{"t":"Economy: materials worth crores lost instead of recycled","h":"Economy"},{"t":"Society: waste pickers work unprotected","h":"Society"},{"sec":"Solutions"},{"t":"one dedicated, enforced rulebook <button class=\"hs chipx\" data-h=\"0\">SWM Rules 2026<\/button>","h":"P","lt":1},{"t":"GPS-tracked door-to-door collection (Bhopal) + waste processors at scale (Mumbai, Bhopal)","h":"I","lt":1},{"t":"designated sites + <span class=\"cm\" data-c=\"4\">biomine legacy dumps<\/span> (<span class=\"cm\" data-c=\"5\">DRAP<\/span>) + yearly landfill audits","h":"N","lt":1},{"t":"segregation at source: <mark>Indore<\/mark> (best example) + Anupam Colony, Delhi + SWaCH, Pune","h":"C","lt":1},{"t":"cut waste at source, treat it as a resource <button class=\"hs chipx\" data-h=\"1\">Circular economy<\/button>","h":"H","lt":1},{"t":"user fees + waste cess (Bengaluru proposal) + Garbage Free City star rating","h":"F","lt":1},{"t":"Swachh Bharat Mission-Urban 2.0 + clear roles for ULBs","h":"C","lt":1}],"hs":[{"t":"SWM Rules 2026","b":"<ul><li>From 1 Apr 2026, replaced the 2016 Rules: 3-way → 4-stream segregation<\/li><li>Bulk generators process their wet waste or buy an <span class=\"cm\" data-c=\"1\">EBWGR certificate<\/span> + <span class=\"cm\" data-c=\"2\">refuse-derived fuel to cement<\/span> plants<\/li><li>Yearly landfill audits + tourist user fee in hills and islands + polluter-pays compensation<\/li><li>Also: <span class=\"cm\" data-c=\"3\">C&amp;D Waste Rules, 2025<\/span> + Contaminated Sites Rules 2025<\/li><\/ul>"},{"t":"Circular economy","b":"<ul><li>Only 7.2% of the world economy is circular (9.1% in 2018) + India could be a $2 trillion market with 1 crore jobs by 2050<\/li><li>Waste to wealth: biogas from wet waste + gasification, pyrolysis + GOBARdhan plants · Indore: Asia's largest Bio-CNG plant (2022)<\/li><li>India: Mission LiFE + EPR <span class=\"cm\" data-c=\"6\">rules + Steel Scrap Recycling Policy<\/span> + NITI Circular Economy Cell<\/li><li>Gaps: <span class=\"cm\" data-c=\"7\">downcycling<\/span> + informal sector recovers only 10–20% of materials + fake EPR certificates<\/li><li>Fix: EPR across sectors (plastic, e-waste, batteries, tyres) + recycled-content mandates + design for reuse · Mixed: <span class=\"cm\" data-c=\"8\">Alang ship recycling (Hong Kong Convention<\/span> in force 2025)<\/li><\/ul>"}],"cm":{"0":"Leachate = the toxic liquid that drains out of rotting garbage and seeps into groundwater.","1":"EBWGR = Extended Bulk Waste Generator Responsibility: big generators (malls, hotels) that don't process their wet waste must buy certificates from those who do.","2":"Refuse-derived fuel (RDF) = dry burnable waste (plastic, paper) shredded into fuel for cement kilns instead of coal.","3":"C&amp;D Waste Rules 2025 (in force 1 Apr 2026, replace the 2016 rules): builders answer for their debris (EPR) + recycling targets + 5% recycled material in construction from 2026–27, rising to 25% by 2030–31.","4":"Biomining = digging up old dumps, sieving the waste and recovering soil, recyclables and fuel. Legacy waste = waste dumped years ago that never got treated.","5":"DRAP = Dumpsite Remediation Accelerator Programme (SBM-Urban 2.0) to clear old landfills fast.","6":"Steel Scrap Recycling Policy (2019): framework for organised scrapping centres, so old vehicles and goods become scrap for steel-making instead of imported scrap.","7":"Downcycling = recycling into a lower-value product each time (a bottle becomes a mat), so the material is eventually lost.","8":"Alang, Gujarat = world's largest ship-breaking yard. Hong Kong Convention (IMO, in force June 2025) = safe, clean ship recycling rules."},"v":"cb23fe"}],"circle":"g","group":"Waste","pyq":["<b>2018 Q6 (10 marks):<\/b> What are the impediments in disposing the huge quantities of discarded solid wastes which are continuously being generated? How do we remove safely the toxic wastes that have been accumulating in our habitable environment?"]},{"id":"b-e-waste","subj":"s03","name":"E-Waste","cards":[{"id":"b-e-waste:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"India is 3rd largest after the USA and China: ≈6 million t (2024) → 14 million t by 2030 + only 10% formally recycled (world ≈22%)"},{"sec":"Causes"},{"t":"fake recyclers distort the EPR market + EPR covers only gold, copper, iron, aluminium","h":"P","lt":1},{"t":"crude methods: circuit boards stripped with acid","h":"I","lt":1},{"t":"low awareness, old devices go to kabadiwalas","h":"C","lt":1},{"t":"85% handled by the informal sector","h":"H","lt":1},{"t":"80% of rich countries' e-waste is shipped to developing countries","h":"C","lt":1},{"sec":"Effects"},{"t":"Health and environment: lead, mercury, cadmium leach into groundwater (Moradabad: Ramganga mercury 8x the standard, CSE 2015)","h":"Health and environment"},{"t":"Economy: ₹51,000 crore of materials lost (Paryavaran NITI Manthan)","h":"Economy"},{"sec":"Solutions"},{"t":"widen and police EPR <button class=\"hs chipx\" data-h=\"0\">E-waste rules<\/button>","h":"P","lt":1},{"t":"hydrometallurgy + AI-based recovery + <span class=\"cm\" data-c=\"1\"><mark>bioleaching<\/mark><\/span> (microbes pull metals out of waste)","h":"I","lt":1},{"t":"Kerala's Haritha Karma Sena buys e-waste door to door at fixed rates (2025)","h":"C","lt":1},{"t":"train and certify informal workers","h":"H","lt":1},{"t":"GST-linked checks on recyclers + a recycling wing in <span class=\"cm\" data-c=\"2\">the National Critical Mineral Mission<\/span>","h":"F","lt":1},{"t":"global rules on dumping <button class=\"hs chipx\" data-h=\"1\">Basel + Stockholm<\/button>","h":"C","lt":1}],"hs":[{"t":"E-waste rules","b":"<ul><li>2011: EPR introduced (producer cleans what he produces) → 2016: Producer Responsibility Organisations<\/li><li>2022: CPCB portal + tradable EPR certificates bought from registered recyclers + items covered 21 → 106<\/li><li><span class=\"cm\" data-c=\"0\">Battery Waste Management Rules, 2022<\/span><\/li><\/ul>"},{"t":"Basel + Stockholm","b":"<ul><li>Basel Convention (1989): controls transboundary movement of hazardous waste, stops rich countries dumping e-waste on poor ones<\/li><li>Stockholm Convention (2001): eliminates persistent organic pollutants (the \"Dirty Dozen\", e.g. DDT)<\/li><\/ul>"}],"cm":{"0":"Battery Waste Management Rules 2022: EPR for battery makers (collect and recycle all batteries, incl. EV) + minimum recycled content in new batteries + tradable EPR certificates.","1":"Bioleaching = using microbes to pull metals out of e-waste. Hydrometallurgy = dissolving metals out with chemicals instead of burning.","2":"National Critical Mineral Mission (2025, ₹16,300 crore): find, mine and process critical minerals (lithium, cobalt, rare earths) at home and abroad + incentives to recover them from e-waste and old batteries."},"v":"7ff669"}],"circle":"g","group":"Waste","pyq":["<b>2018 Q6 (10 marks):<\/b> What are the impediments in disposing the huge quantities of discarded solid wastes which are continuously being generated? How do we remove safely the toxic wastes that have been accumulating in our habitable environment?","<b>2013 Q20 (10 marks):<\/b> Enumerate the National Water Policy of India. Taking river Ganges as an example, discuss the strategies which may be adopted for river water pollution control and management. What are the legal provisions of management and handling of hazardous wastes in India?"]},{"id":"b-hazardous-biomedical-waste","subj":"s03","name":"Hazardous &amp; Biomedical Waste","cards":[{"id":"b-hazardous-biomedical-waste:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"hazardous = toxic, flammable, reactive or corrosive + biomedical ≈609 t a day (+101 t a day in COVID)"},{"sec":"Causes"},{"t":"small clinics hard to monitor + illegal imports","h":"P","lt":1},{"t":"poor segregation in hospitals + informal recyclers without safety gear + people oppose new TSDFs near them","h":"C","lt":1},{"t":"industry, hospitals, coal plants, gold mining + few treatment, storage and disposal facilities (<span class=\"cm\" data-c=\"0\">TSDFs) + few<\/span> common biomedical facilities (CBWTFs) in rural areas <button class=\"hs chipx\" data-h=\"0\">Mercury<\/button>","h":"H","lt":1},{"sec":"Effects"},{"t":"Health: Bhopal: 337 t of Union Carbide toxic waste burnt at Pithampur only in 2025, 40 years later","h":"Health"},{"t":"Environment: toxins leach into soil and groundwater","h":"Environment"},{"sec":"Solutions"},{"t":"enforce the 2016 rules <button class=\"hs chipx\" data-h=\"1\">Waste rules 2016<\/button>","h":"P","lt":1},{"t":"clean old toxic sites with <mark>bioremediation<\/mark> and <span class=\"cm\" data-c=\"3\">phytoremediation + Contaminated Sites Rules 2025<\/span> (189 substances)","h":"N","lt":1},{"t":"IMAGE, Palakkad: doctors' association runs one common biomedical facility for Kerala's private hospitals","h":"C","lt":1},{"t":"cleaner production + formalise informal recyclers + more TSDFs and CBWTFs, especially rural","h":"H","lt":1}],"hs":[{"t":"Mercury","b":"<ul><li><span class=\"cm\" data-c=\"1\">Methylmercury is the most toxic form: bioaccumulates in fish<\/span>, harms foetuses and children<\/li><li>Failed: Minamata, Japan (1956, factory waste) + Kodaikanal, Tamil Nadu (2001, HUL thermometer factory)<\/li><li>India: ratified the Minamata Convention (2018) + mercury limits for coal plants (2015) + mercury thermometers out of hospitals<\/li><li>Gap: coal plants slow on controls (≈78% of Category C plants exempted from <span class=\"cm\" data-c=\"2\">FGD, Jul 2025<\/span>)<\/li><\/ul>"},{"t":"Waste rules 2016","b":"<ul><li>Hazardous and Other Wastes Rules 2016 (under EPA): SPCB authorisation for generators + duties for TSDF operators<\/li><li>Bio-Medical Waste Rules 2016 (amended 2018, 2019): colour-coded bins + common facilities (CBWTFs) + incineration, autoclave, microwave + secured landfill<\/li><\/ul>"}],"cm":{"0":"TSDF = Treatment, Storage and Disposal Facility for hazardous waste. CBWTF = Common Bio-medical Waste Treatment Facility shared by hospitals.","1":"Methylmercury = the form mercury takes in water and fish; it builds up the food chain and damages the brain.","2":"FGD = flue gas desulphurisation: scrubbers that remove SO₂ from power-plant smoke. Category C plants = those far from big cities and polluted areas.","3":"Contaminated Sites Rules 2025 = rules to find, list and clean up old toxic sites, with the polluter paying."},"v":"e747c4"}],"circle":"g","group":"Waste","pyq":["<b>2014 Q15 (12.5 marks):<\/b> Environmental Impact Assessment studies are increasingly undertaken before a project is cleared by the Government. Discuss the environmental impacts of coal-fired thermal plants located at coal pitheads."]},{"id":"b-land-degradation","subj":"s03","name":"Land Degradation","cards":[{"id":"b-land-degradation:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"fall in land's biological or economic productivity (UNCCD); in drylands = desertification + India ≈30% of land degraded (ISRO Atlas), Rajasthan, Maharashtra, Gujarat, Jharkhand worst"},{"sec":"Causes"},{"t":"policies reward over-irrigation and fertiliser (Punjab–Haryana canals → waterlogging, salinity)","h":"P","lt":1},{"t":"water erosion (biggest) + wind erosion (Thar) + invasive Lantana in ≈50% of forest and scrubland (SOE 2026)","h":"N","lt":1},{"t":"overgrazing + shifting cultivation","h":"C","lt":1},{"t":"deforestation + mining","h":"H","lt":1},{"sec":"Effects"},{"t":"Environment: soils are the 2nd largest carbon pool after oceans (2,500 Gt) + dust storms + silted reservoirs + India breached the <span class=\"cm\" data-c=\"0\">land-system-change boundary (SOE 2026)<\/span>","h":"Environment"},{"t":"Economy: lower yields","h":"Economy"},{"t":"Society: rural distress and migration (affects 3.2 billion people worldwide)","h":"Society"},{"sec":"Solutions"},{"t":"<span class=\"cm\" data-c=\"1\">LDN target<\/span>: restore 26 million ha by 2030 (≈24 million ha done or under way) <button class=\"hs chipx\" data-h=\"0\">Global commitments<\/button>","h":"P","lt":1},{"t":"ISRO Desertification Atlas + Soil Health Card","h":"I","lt":1},{"t":"watershed development (<span class=\"cm\" data-c=\"2\">PMKSY-WDC) + afforestation (Green India Mission, Aravalli<\/span> Green Wall) + restore whole landscapes, not just plant trees · Ralegan Siddhi (watershed revived groundwater and farms)","h":"N","lt":1},{"t":"grazing control + local techniques (<span class=\"cm\" data-c=\"3\">Zai pits<\/span>) + land tenure rights for local communities","h":"C","lt":1},{"t":"change how we farm <button class=\"hs chipx\" data-h=\"1\">Natural farming<\/button><button class=\"hs chipx\" data-h=\"2\">Agroforestry<\/button>","h":"H","lt":1},{"t":": <span class=\"cm\" data-c=\"7\">Green Credit Programme<\/span>","h":"F","lt":1}],"hs":[{"t":"Global commitments","b":"<ul><li>Bonn Challenge: restore 350 million ha worldwide by 2030 (India pledged 26 million ha)<\/li><li>UNCCD COP16, Riyadh 2024: Riyadh Global Drought Resilience Partnership ($12 billion+) + land tenure for local communities<\/li><li>UN Decade on Ecosystem Restoration (2021–2030)<\/li><\/ul>"},{"t":"Natural farming","b":"<ul><li>Chemical-free farming with on-farm inputs (organic buys inputs from outside; natural doesn't)<\/li><li>Pillars: <span class=\"cm\" data-c=\"4\">Beejamrit + Jeevamrit<\/span> + mulching + Whapasa<\/li><li>Worked: Andhra Pradesh <span class=\"cm\" data-c=\"5\">APCNF<\/span> (lakhs of farmers, lower input costs) · Failed: Sri Lanka 2021 (overnight fertiliser ban → yields crashed)<\/li><li>India: National Mission on Natural Farming (2024, ₹2,481 crore, 1 crore farmers)<\/li><li>Gaps: yields may dip in early years + needs cattle for inputs + few premium markets → fix: phased shift (Sri Lanka lesson) + certification + market links<\/li><\/ul>"},{"t":"Agroforestry","b":"<ul><li>Trees with crops or livestock on farms: ≈8.5% of land + National Agroforestry Policy 2014 (India first in the world)<\/li><li>Gains: crop yields up ≈50% + stores 14–27 t CO₂ per ha a year (EAC-PM) + half of fuelwood, 60% of paper-pulp wood<\/li><li>Worked: poplar on farm bunds, Punjab–Haryana (feeds the plywood industry)<\/li><li>India: <span class=\"cm\" data-c=\"6\">Trees Outside Forests in India (2023) + SMAF<\/span> (under NMSA) + NITI's GROW initiative<\/li><li>Gap: felling and transit permits → adopt model felling rules in every state<\/li><\/ul>"}],"cm":{"0":"SOE = State of India's Environment report (CSE). Land-system change = one of 9 planetary boundaries: how much forest and natural land can be converted before Earth systems are pushed out of a safe zone.","1":"LDN = Land Degradation Neutrality: restore as much land as is degraded, so net damage is zero.","2":"PMKSY-WDC = the watershed part of Pradhan Mantri Krishi Sinchayee Yojana: rainwater harvesting and soil conservation on a whole catchment.","3":"Zai pits = small planting pits that trap rain and compost, from the Sahel; they revive dry, hard soil.","4":"Beejamrit = seed treatment with cow dung and urine; Jeevamrit = fermented dung-urine mix that feeds soil microbes; Whapasa = soil with both air and moisture in it.","5":"APCNF = Andhra Pradesh Community-managed Natural Farming: the largest natural farming programme in India.","6":"Trees Outside Forests in India = MoEFCC + USAID programme (2023) to grow trees on farms and private land. SMAF = Sub-Mission on Agroforestry (under the National Mission for Sustainable Agriculture). GROW = NITI Aayog's Greening and Restoration of Wasteland with Agroforestry (maps wasteland fit for agroforestry).","7":"Green Credit Programme = earn tradable credits for tree planting, water saving and other green actions."},"v":"3866ab"}],"circle":"y","group":"Misc"},{"id":"b-energy-transition","subj":"s04","name":"Energy Transition","cards":[{"id":"b-energy-transition:big","big":1,"path":[],"roles":[],"rows":[{"sec":"Frame"},{"t":"non-fossil = <mark>50% of installed capacity<\/mark>, reached June 2025 (2030 NDC target, 5 years early) + 250 GW RE, 3rd in the world + but under 30% of generation (<span class=\"cm\" data-c=\"0\">capacity ≠ generation<\/span>) + <span class=\"cm\" data-c=\"1\">WEF Energy Transition Index 2024: 71 of 118<\/span> <button class=\"hs chipx\" data-h=\"0\">50% by 2030?<\/button>"},{"sec":"Benefits"},{"t":"Health: cleaner air (capability approach by amartya sen)(removes a major unfreedom )","h":"Health"},{"t":"Environment: cuts CO₂, the road to net zero 2070","h":"Environment"},{"t":"Economy: oil and coal import cut + 1.3 million RE jobs (7.7% of world), 2nd in solar PV jobs after China (IRENA 2025)","h":"Economy"},{"t":"Governance: energy security (West Asia crisis)","h":"Governance"},{"t":"Society: energy access: <span class=\"cm\" data-c=\"2\">decentralised RE empowers communities (Barefoot Women Solar Engineers<\/span>) <button class=\"hs chipx\" data-h=\"1\">Energy access + UJALA<\/button>","h":"Society"},{"sec":"Barriers"},{"t":"fossil fuels still get ≈5x the subsidy of clean energy (IISD, FY24) <button class=\"hs chipx\" data-h=\"2\">Subsidy shift<\/button>","h":"P","lt":1},{"t":"storage costly (≈₹5–6 per unit) + lag in latest solar cells","h":"I","lt":1},{"t":"RE cant provide energy 24x7 as solar during day time and wind during blowing winds <span class=\"cm\" data-c=\"5\">(no BESS)<\/span> + spread thin: solar needs 300x the land of nuclear","h":"N","lt":1},{"t":"farmers and herders lose land and grazing commons (orans) without consent → protests + coal workers face job loss (150+ districts live off coal and thermal power)","h":"C","lt":1},{"t":"≈80% of solar modules from China + power lines in the Thar kill Great Indian Bustards <button class=\"hs chipx\" data-h=\"3\">GIB conflict<\/button>","h":"H","lt":1},{"t":"$6.5 trillion needed by 2070 for net zero + <span class=\"cm\" data-c=\"6\">DISCOM deb<\/span><span class=\"cm\" data-c=\"7\">t + stranded coal assets<\/span>","h":"F","lt":1},{"t":"weak transmission, states slow on intra-state lines <button class=\"hs chipx\" data-h=\"4\">Green Energy Corridor<\/button>","h":"C","lt":1},{"sec":"Fixes"},{"t":"shift subsidies from fossil to <span class=\"cm\" data-c=\"9\">clean + Green Energy Open Access Rules 2022<\/span>","h":"P","lt":1},{"t":"storage (<span class=\"cm\" data-c=\"10\">ACC battery PLI<\/span>, pumped storage) + smart grids + new sources: geothermal (first policy 2025, 381 hot springs), <span class=\"cm\" data-c=\"11\">CO₂-to-methanol<\/span> (NTPC Vindhyachal), <span class=\"cm\" data-c=\"12\">coal gasification<\/span> (100 MT by 2030)","h":"I","lt":1},{"t":"wind-solar hybrids + one cross-border grid (<span class=\"cm\" data-c=\"13\">OSOWOG<\/span>)","h":"N","lt":1},{"t":"decentralised RE: rooftops (PM Surya Ghar) + farms (PM-KUSUM) (will cause habitual energy storage of solar energy)","h":"C","lt":1},{"t":"domestic manufacturing <span class=\"cm\" data-c=\"14\">(PLI) + a<\/span> just transition for coal regions <button class=\"hs chipx\" data-h=\"5\">PMKKKY<\/button>","h":"H","lt":1},{"t":"<span class=\"cm\" data-c=\"16\">JETP<\/span> + green bonds + blended finance","h":"F","lt":1},{"t":"independent national body for coal phase-out + Green Energy Corridor Phases 3 and 4","h":"C","lt":1}],"hs":[{"t":"50% by 2030?","b":"<ul><li>Capacity: 50% non-fossil reached June 2025, 5 years early → next 60% by 2035<\/li><li>Generation by using RE is still under 30% + coal still ≈55% of energy needs<\/li><li>Verdict: the capacity target is met; 50% of energy needs only with storage, grid and green hydrogen<\/li><\/ul>"},{"t":"Energy access + UJALA","b":"<ul><li><span class=\"cm\" data-c=\"3\">SDG 7<\/span>: affordable, reliable, sustainable, modern energy for all<\/li><li>UJALA (2015): 36.87 crore LED bulbs distributed, saving ₹19,153 crore a year (PIB 2025) (new)<\/li><li>LEDs use 90% less power than old bulbs, 50% less than <span class=\"cm\" data-c=\"4\">CFLs<\/span> → ≈48 billion units saved a year, ≈9,500 MW peak demand avoided (new, PIB)<\/li><\/ul>"},{"t":"Subsidy shift","b":"<ul><li>Fossil support fell to 5x clean energy in FY24, the smallest gap in 5 years; clean subsidies up 31% to ≈₹32,000 crore (IISD 2025) (new)<\/li><li>But 83% of new PSU investment still goes to fossil assets (IISD)<\/li><li>How the shift helps: frees money for storage and grid + makes RE cheaper than coal + steady signal to investors<\/li><li>Use fossil tax revenue to fund clean energy (IISD) (new)<\/li><\/ul>"},{"t":"GIB conflict","b":"<ul><li>Thar and Kutch: power lines kill Great Indian Bustards (under 150 left)<\/li><li>SC 2021 ordered lines underground, eased 2024<\/li><\/ul>"},{"t":"Green Energy Corridor","b":"<ul><li>Lines that carry solar and wind power from RE-rich states into the grid + <span class=\"cm\" data-c=\"8\">Renewable Energy Management Centres<\/span>; work began 2015 (new, Ministry of Power)<\/li><li>Phase I: inter-state part done (Mar 2020); intra-state part in 8 states delayed by right-of-way and GIB court cases<\/li><li>Phase II: 7 states, ≈10,750 km of lines, ≈₹12,000 crore, 33% central aid + Ladakh 13 GW line (2024)<\/li><li>Next: Phases 3 and 4 to cover the whole country (new, DTE)<\/li><\/ul>"},{"t":"PMKKKY","b":"<ul><li><span class=\"cm\" data-c=\"15\">Mining companies pay<\/span> 10% or 30% of royalty into District Mineral Foundations; ≥70% to health, water, education, women and child welfare<\/li><li>Mixed: Keonjhar, Odisha (huge fund, spent on roads and buildings) · Worked: Dantewada (education, livelihoods)<\/li><li>Problems: large unspent balances + Collector-run trusts, little Gram Sabha say<\/li><li>Fix: real Gram Sabha role + social audits (revised guidelines 2024)<\/li><\/ul>"}],"cm":{"0":"Capacity vs generation: capacity = how much power plants could make at full tilt; generation = what they actually make. Solar runs only in daylight, so 50% of capacity gives far less than 50% of electricity.","1":"WEF Energy Transition Index = World Economic Forum ranking of how ready countries are to move to clean energy.","2":"Barefoot Women Solar Engineers = rural women trained (Barefoot College, Tilonia) to install and fix solar lights in their villages.","3":"SDG 7 = UN goal of affordable, reliable, sustainable and modern energy for all by 2030.","4":"CFL = compact fluo
