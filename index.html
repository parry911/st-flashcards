ts:eg-main","v":"f7921a","q":"One recent Western Ghats disaster, one success, and how India protects the range?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">face threats from deforestation, mining, and infrastructure projects<\/span><br><span class=\"li\">Western Ghats <mark>ESA<\/mark> draft notification reissued 6 times since 2014, still not final (states object)<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">finalise the ESA notification with states on board<\/span><br><span class=\"li\">no quarrying or building on steep slopes<\/span><br><span class=\"li\">community-led protection (JFM, BMCs)<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"western-ghats:issue-main","v":"3adedc","q":"What threatens the Western Ghats, why is the ESA still stuck, and what is the fix?"}],"circle":"y"},{"id":"cop-16-un-convention-on-biological-diver","subj":"s01","name":"COP 16 UN Convention on Biological Diversity","cards":[{"path":[],"roles":["def"],"rows":[{"t":"Location: Cali, Colombia | Theme: \"Peace with Nature\"","h":"<b>Definition & India's status<\/b>:"},{"sec":"<b>Pillars / key features<\/b>: Key Outcomes & Frameworks"},{"h":"The <mark>Cali Fund<\/mark> (DSI Mechanism):","t":"<span class=\"lst\"><span class=\"li\">A landmark \"benefit-sharing\" agreement.<\/span><br><span class=\"li\">Requirement: Large companies (pharmaceutical, cosmetic, biotech) using <mark>Digital Sequence Information<\/mark> (DSI) from genetic resources must contribute to the fund.<\/span><br><span class=\"li\">Contribution: 1% of profits or 0.1% of revenue.<\/span><br><span class=\"li\">Beneficiaries: Funds are directed toward Indigenous Peoples and Local Communities (IPLCs) for biodiversity conservation.<\/span><\/span>"},{"t":"A new permanent subsidiary body was established to ensure the effective participation of Indigenous peoples in CBD processes.","h":"Institutional Recognition:"},{"t":"Formally launched to support developing nations in hitting biodiversity targets.","h":"Kunming Biodiversity Fund:"},{"t":"Identification of \"Ecologically or Biologically Significant Marine Areas\" (EBSAs) to help achieve the <mark>30-by-30<\/mark> goal.","h":"Marine Conservation:"},{"t":"Action plans were advanced regarding synthetic biology, management of invasive species, and the \"One Health\" approach (linking biodiversity to human health).","h":"Technical Progress:"}],"id":"cop-16-un-convention-on-biological-diver:def-main","v":"25b271","q":"COP16 at Cali: its theme and its key outcomes?"},{"path":[],"roles":["eg","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Cali Fund (launched Feb 2025; first private payment only in Nov 2025, a small UK startup → voluntary model weak)<\/span><br><span class=\"li\">Protected Planet Report released at Cali (17.6% land, 8.4% ocean protected → far from <mark>30x30<\/mark>)<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">released updated <mark>NBSAP<\/mark> at Cali (Oct 2024) → 23 national targets matched to KMGBF<\/span><br><span class=\"li\"><mark>Whole of Government, Whole of Society<\/mark><\/span><br><span class=\"li\">asked for international finance to implement it → one of only 44 countries to submit by the end of COP16 (see 🟡 India – NBSAP 2024–30)<\/span><\/span>","h":"<b>India's response<\/b>:"}],"id":"cop-16-un-convention-on-biological-diver:eg-main","v":"069e9c","q":"How has the Cali Fund fared so far, and what did India bring to COP16?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Cali Fund payments are voluntary<\/span><br><span class=\"li\">COP16 ran out of quorum on finance and had to resume in Rome (Feb 2025)<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">make DSI payments binding<\/span><br><span class=\"li\">close the <mark>finance gap<\/mark><\/span><br><span class=\"li\">implement NBSAPs on time<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"cop-16-un-convention-on-biological-diver:issue-main","v":"a28038","q":"Where did COP16 fall short, and what should come next?"}],"circle":"y"},{"id":"kunming-montreal-global-biodiversity-fra","subj":"s01","name":"Kunming-Montreal Global Biodiversity Framework (KMGBF)","cards":[{"path":[],"roles":["def"],"rows":[{"t":"Aims to halt biodiversity loss or reverse by 2030 (adopted at CBD COP15, Montreal, Dec 2022)","h":"<b>Definition & India's status<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">23 targets by 2030 like 30% land and sea conservation and halving invasive species<\/span><br><span class=\"li\">promote fair benefit-sharing (including via DSI)<\/span><\/span>","h":"<b>Pillars / key features<\/b>:"}],"id":"kunming-montreal-global-biodiversity-fra:def-main","v":"189fbe","q":"What does the KMGBF aim for, when and where was it adopted, and what are its headline targets?"},{"path":[],"roles":["use","eg","gov"],"rows":[{"t":"new global targets after the 2010 <mark>Aichi targets<\/mark> were missed (none of the 20 fully met by 2020)","h":"<b>Significance<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Protected Planet Report 2024 (failed so far: protection must double on land and triple at sea by 2030)<\/span><br><span class=\"li\">Salas y Gómez–Nazca ridges, SE Pacific (Chile-led, set to be among the first high-seas MPAs → helps Target 3)<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">updated NBSAP (Oct 2024) maps India's 23 targets onto KMGBF's 23<\/span><br><span class=\"li\"><mark>30x30<\/mark> via PAs, community reserves and OECMs<\/span><br><span class=\"li\">biodiversity finance via BIOFIN (see 🟡 India – NBSAP 2024–30)<\/span><\/span>","h":"<b>India's response<\/b>:"}],"id":"kunming-montreal-global-biodiversity-fra:use-main","v":"1d7061","q":"Why was the KMGBF needed, how far off track is the world, and how does India map onto it?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"close the $700 billion finance gap","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">fund the targets (Cali Fund, Kunming Fund)<\/span><br><span class=\"li\">honest progress reports in each national report<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"kunming-montreal-global-biodiversity-fra:issue-main","v":"4a2529","q":"What is the KMGBF&#x27;s biggest gap, and how do we close it?"}],"circle":"y"},{"id":"india-nbsap-2024-30","subj":"s01","name":"India – NBSAP 2024–30","cards":[{"path":[],"roles":["def"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Alignment: Fully aligned with the <mark>Kunming-Montreal<\/mark> Global Biodiversity Framework (KMGBF).<\/span><br><span class=\"li\">Core Objective: Halt and reverse biodiversity loss by 2030; \"Living in Harmony with Nature\" by 2050.<\/span><\/span>","h":"<b>Definition & India's status<\/b>:"},{"sec":"<b>Pillars / key features<\/b>"},{"t":"23 National Biodiversity Targets (NBTs) across three pillars: Threat Reduction, Sustainable Use, and Implementation Tools.","h":"Targets:"},{"t":"\"Whole-of-Government\" (23 ministries involved) and \"Whole-of-Society\" (incorporating Indigenous/local knowledge).","h":"Approach:"},{"t":"Supported by the Biodiversity Finance Initiative (BIOFIN); estimated annual requirement of ₹81,664 crore.","h":"Finance:"},{"t":"Three-tier governance (NBA → SBB → BMC) under the BD Act 2002 (amended 2023).","h":"Mechanism:"}],"id":"india-nbsap-2024-30:def-main","v":"9358c9","q":"NBSAP 2024–30: what is it aligned with, and its targets, approach, finance and mechanism?"},{"path":[],"roles":["use"],"rows":[{"t":"India recently submitted 7th national report under article 26 of convention on biological diversity"},{"t":"all 23 revised NBSAP indicators are on track and align with KMGBF"},{"t":"Forest + tree cover = 25.1 % of geographical area"},{"t":"Forest carbon stock reached 7,285.5 million tonnes (55% is soil organic carbon)"},{"t":"24.1 million hectares (mha) restored or under restoration (<mark>Bonn Challenge<\/mark> pledge of 26 mha by 2030)"},{"t":"100 <mark>Ramsar<\/mark> sites as of Jun 2026 (26 in 2014). (Ranks 1st in Asia and 3rd globally)."},{"h":"Wildlife Populations:","t":"<span class=\"lst\"><span class=\"li\">3,682 Tigers (>70% of global total), 22,446 Elephants, >4,000 Rhinos, and 891 Asiatic Lions.<\/span><br><span class=\"li\">First Assessments: Recorded 718 Snow Leopards and 6,327 Riverine Dolphins.<\/span><\/span>"},{"t":"Protected Areas covers 5.71% of land area; marine protected areas have also increase"}],"title":"<b>Significance (India's status)<\/b>","id":"india-nbsap-2024-30:use-significance-india-s-status","v":"e36fe3","q":"Where does India stand on biodiversity: its latest report and the key figures?"},{"path":[],"roles":["eg","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Arittapatti, Madurai (worked: Tamil Nadu's first <mark>Biodiversity Heritage Site<\/mark>, 2022 → Centre cancelled a tungsten mining block there after protests, Jan 2025)<\/span><br><span class=\"li\">Project Cheetah, Kuno NP (2022, mixed: species recovery target, but many cheetah deaths in the first year)<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">India implements by using PARVESH for green clearance, for eco sys restore (Bonn challenge (restore 26 million degraded land) , species recovery & genetic diversity (via species recovery program)<\/span><br><span class=\"li\">sustainable agriculture via natural and organic farming<\/span><br><span class=\"li\">Pollution reduction via national clean air programme<\/span><\/span>","h":"<b>India's response<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Urban ecosystem ( smart cities)<\/span><br><span class=\"li\">Access and benefit sharing via (Nagoya protocol mechanism)<\/span><br><span class=\"li\">Finance (CSR and Business responsibility and sustainability report (top 1000 firms) )<\/span><br><span class=\"li\">capacity building via national one health mission<\/span><\/span>","cont":1}],"id":"india-nbsap-2024-30:eg-main","v":"a79bb1","q":"One NBSAP success, one mixed result, and the tools India uses to implement the plan?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">finance (₹81,664 crore a year needed)<\/span><br><span class=\"li\">many BMCs exist only on paper<\/span><br><span class=\"li\">species recovery mixed (cheetah deaths)<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">BIOFIN<\/span><br><span class=\"li\">CSR money for targets<\/span><br><span class=\"li\">empower <mark>BMCs<\/mark> and People's Biodiversity Registers<\/span><br><span class=\"li\">track all 23 targets in the 8th national report<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"india-nbsap-2024-30:issue-main","v":"29029f","q":"Why could the NBSAP fall short, and how do we fix it?"}],"circle":"y"},{"id":"case-study-of-eco-bridge-a-k-a-eco-ducts","subj":"s01","name":"Case study of eco-bridge a.k.a eco ducts","cards":[{"path":[],"roles":["eg"],"rows":[{"t":"This eco-bridge will be one of India's longest underpasses, stretching across 1.4 kilometers. Situated on the Madhya Pradesh-Maharashtra border, the project is designed to support wildlife movement and enhance conservation efforts in the area","h":"Madhya Pradesh-Maharashtra Border Eco-Underpass:"}],"id":"case-study-of-eco-bridge-a-k-a-eco-ducts:eg-main","v":"dad4c3","q":"Where is India&#x27;s long eco-underpass and what is it for?"}],"circle":"w"},{"id":"people-s-movements","subj":"s01","name":"People’s movements","cards":[{"path":[],"roles":["eg"],"rows":[{"t":"The <mark>Chipko<\/mark> Movement (1973) in Uttarakhand used non-violent resistance to stop deforestation, leading to a ban on commercial logging in the Himalayas."},{"t":"Inspired by it, the Appiko Movement (1983) in Karnataka promoted tree conservation through direct action."},{"t":"The Anti-Tehri Dam Movement (1980s–1990s) opposed the Tehri Dam over its severe environmental and social impacts."},{"t":"<mark>Narmada Bachao<\/mark> Andolan (1985–Present)"}],"id":"people-s-movements:eg-main","v":"204f26","q":"Name four people&#x27;s movements for the environment, with year and place."}],"circle":"g","pyq":["<b>2024 Q8 (10 marks):<\/b> What role do environmental NGOs and activists play in influencing Environmental Impact Assessment (EIA) outcomes for major projects in India? Cite four examples with all important details.","<b>2016 Q14 (12.5 marks):<\/b> Rehabilitation of human settlements is one of the important environmental impacts which always attracts controversy while planning major projects. Discuss the measures suggested for mitigation of this impact while proposing major developmental projects."]},{"id":"wpa-issues-and-features","subj":"s01","name":"WPA issues and features","cards":[{"path":[],"roles":["def"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Wildlife (Protection) Act, 1972 = India's main law for wild animals, plants and their habitats (amended 2022)<\/span><br><span class=\"li\">Art 48A (DPSP)<\/span><br><span class=\"li\">Art 51A(g)<\/span><br><span class=\"li\">Concurrent List<\/span><\/span>","h":"<b>Definition & India's status<\/b>:"},{"t":"The New Scheduling System (Post-2022 Amendment): The 2022 Amendment streamlined the schedules from six down to four, simplifying enforcement and legal proceedings:","h":"<b>Pillars / key features<\/b>:"}],"id":"wpa-issues-and-features:def-main","v":"7f0058","q":"What is the Wildlife (Protection) Act, its constitutional base, and the 2022 change to its schedules?"},{"path":[],"roles":["tbl"],"rows":[{"h":"Schedule I","t":"<span class=\"th\">Scope &amp; Protection Level<\/span> Highest Protection: Absolute protection with the highest penalties.<br><span class=\"th\">Examples<\/span> Tigers, Elephants, Lions"},{"h":"Schedule II","t":"<span class=\"th\">Scope &amp; Protection Level<\/span> High Protection: Significant species but with slightly lower penalties than Sch. I.<br><span class=\"th\">Examples<\/span> Various birds and reptiles"},{"h":"Schedule III","t":"<span class=\"th\">Scope &amp; Protection Level<\/span> Protected Plants: Specific flora species requiring conservation.<br><span class=\"th\">Examples<\/span> Red Sanders, Beddomes' Cycad"},{"h":"Schedule IV","t":"<span class=\"th\">Scope &amp; Protection Level<\/span> <mark>CITES<\/mark> Species: Species listed under the Convention on International Trade in Endangered Species.<br><span class=\"th\">Examples<\/span> Exotic birds/animals in trade"}],"table":1,"head":["Schedule","Scope & Protection Level","Examples"],"id":"wpa-issues-and-features:tbl-main","v":"e67c70","q":"The four WPA schedules after 2022: what does each protect, with examples?"},{"path":[],"roles":["def"],"rows":[{"t":"The Act provides a tiered approach to habitat protection, currently covering approximately 5.26% of India's landmass (now 5.71%, Mains 365):"},{"t":"No human activity or grazing is permitted. Highest level of restriction.","h":"National Parks (NPs):"},{"t":"Certain rights (grazing, collection of minor forest produce) can be allowed by the Chief Wildlife Warden.","h":"Wildlife Sanctuaries (WLS):"},{"t":"Publicly owned land acting as \"buffer zones\" or corridors between existing NPs/WLS.","h":"Conservation Reserves:"},{"t":"Private or community land where locals volunteer to protect biodiversity.","h":"Community Reserves:"}],"title":"Protected Areas (PA) Hierarchy","id":"wpa-issues-and-features:def-protected-areas-pa-hierarchy","v":"1ea0f9","q":"The four kinds of protected areas under the WPA, and what is allowed in each?"},{"path":[],"roles":["gov"],"rows":[{"t":"Chaired by the Prime Minister; the apex body for policy and project clearances in PAs.","h":"<mark>NBWL<\/mark> (National Board for Wildlife):"},{"t":"Oversees \"Project Tiger\" and management of Tiger Reserves.","h":"NTCA (National Tiger Conservation Authority):"},{"t":"Intelligence and enforcement agency for organized wildlife crime.","h":"WCCB (Wildlife Crime Control Bureau):"},{"t":"Regulatory body for all zoos and captive breeding standards.","h":"CZA (Central Zoo Authority):"}],"title":"Statutory Enforcement Bodies","id":"wpa-issues-and-features:gov-statutory-enforcement-bodies","v":"be4f3f","q":"Four bodies that enforce wildlife law, and what each does?"},{"path":[],"roles":["use","eg"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Success Figures: The Act has successfully increased flagship species—Tigers (3,682, up from 2,967) and Elephants are both on the rise.<\/span><br><span class=\"li\">PAs 5.71% with 106 National Parks (Dec 2024)<\/span><br><span class=\"li\">tigers >70% of world (Mar 2026)<\/span><br><span class=\"li\">22,446 elephants<\/span><br><span class=\"li\">TX2 met in 2018, 4 years early<\/span><\/span>","h":"<b>Significance<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Kaziranga (worked: zero rhino poaching in 2022, first time since 1977)<\/span><br><span class=\"li\"><mark>Great Indian Bustard<\/mark> (failed: Schedule I since 1972, yet only ~130 left, WII 2025)<\/span><\/span>","h":"<b>Examples<\/b>:"}],"id":"wpa-issues-and-features:use-main","v":"203533","q":"What has the WPA achieved in numbers, with one success and one failure?"},{"path":[],"roles":["gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\"><mark>Project Tiger<\/mark> (1973)<\/span><br><span class=\"li\">Project Elephant (1992)<\/span><br><span class=\"li\">Project Cheetah (2022)<\/span><\/span>","h":"<b>India's response<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">WCCB for wildlife crime<\/span><br><span class=\"li\"><mark>IBCA<\/mark> (HQ India)<\/span><br><span class=\"li\">IDWH scheme<\/span><br><span class=\"li\">DNA lab at WII<\/span><br><span class=\"li\">Project Tiger 50 years (2023)<\/span><\/span>","cont":1}],"id":"wpa-issues-and-features:gov-main","v":"442beb","q":"India&#x27;s wildlife programmes and bodies (eight)?"},{"path":[],"roles":["issue"],"rows":[{"sec":"A. Enforcement & Legal Gaps"},{"t":"Despite WCCB efforts, local trade remains a loophole. Evidence: The recent seizure of 100+ birds and turtles in Jalaun proves that grassroots enforcement is still weak.","h":"Illegal Trade:"},{"t":"There is a rise in \"enforcement abuses\" where private actors (like snake catchers) use unscientific methods or engage in price gouging. Kerala’s recent blacklisting of such catchers highlights the need for a standardized protocol.","h":"Unscientific Interventions:"},{"sec":"B. Human-Wildlife Conflict (HWC) & Federalism"},{"t":"Rising conflicts (boars, macaques) have led to State-Centre tensions. States like Keralademand the power to declare vermin for culling, but the Centre resists delegating this power to prevent ecological misuse.","h":"The \"Vermin\" Debate:"},{"t":"Poor management in cities like Gurgaon (e.g., illegal use of langurs to drive away monkeys) shows a lack of policy for wildlife outside traditional forests.","h":"Urban Wildlife:"},{"t":"<span class=\"lst\"><span class=\"li\">1,630 people killed by animals (ADSI 2024)<\/span><br><span class=\"li\">Kerala declared HWC a <mark>state-specific disaster<\/mark><\/span><br><span class=\"li\">human–elephant conflict rising (Jharkhand, West Bengal)<\/span><\/span>","h":"HWC:"},{"t":"<span class=\"lst\"><span class=\"li\">zoonoses (Nipah)<\/span><br><span class=\"li\">crop loss<\/span><br><span class=\"li\">retaliatory killing<\/span><\/span>","cont":1},{"sec":"C. Success vs. Carrying Capacity"},{"t":"Higher populations in a restricted 5% PA network inevitably lead to higher human-wildlife friction as animals move into human-dominated landscapes.","h":"The Dilemma:"},{"t":"<span class=\"lst\"><span class=\"li\">D. Other: ~10 mn ha forest lost a year (WWF)<\/span><br><span class=\"li\">rhinos, pangolins worst hit by wildlife crime (2024)<\/span><br><span class=\"li\">wildlife down 73% since 1970 (Living Planet Report)<\/span><\/span>"}],"title":"<b>Challenges<\/b>: Current Challenges & Critical Analysis","id":"wpa-issues-and-features:issue-challenges-current-challenges-critical-a","v":"f4af1f","q":"Where does wildlife protection fail today? Four problem areas."},{"path":[],"roles":["fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">wildlife <mark>corridors<\/mark> beyond the 5% PA network<\/span><br><span class=\"li\">a standard protocol for rescuers<\/span><br><span class=\"li\">clear Centre–State rules on vermin<\/span><br><span class=\"li\">stronger local enforcement<\/span><\/span>","h":"<b>Way forward<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">HWC: National HWC Mitigation Strategy & Action Plan 2021–26<\/span><br><span class=\"li\">SOPs (tiger, leopard, elephant)<\/span><br><span class=\"li\">early warnings (SMS, sensors, GPS collars)<\/span><\/span>","cont":1},{"t":"<span class=\"lst\"><span class=\"li\"><mark>bee-hive fences<\/mark>, solar fences<\/span><br><span class=\"li\">crops elephants avoid (chilli, citrus, ginger)<\/span><br><span class=\"li\">SC: ₹10 lakh for human deaths<\/span><\/span>","cont":1},{"t":"<span class=\"lst\"><span class=\"li\">landscape approach<\/span><br><span class=\"li\">NGOs (WPSI, WTI)<\/span><\/span>","cont":1}],"id":"wpa-issues-and-features:fix-main","v":"a47a34","q":"How do we fix wildlife protection and human–wildlife conflict?"}],"circle":"y"},{"id":"nwap","subj":"s01","name":"NWAP","cards":[{"path":[],"roles":["def","issue"],"rows":[{"t":"Landscape Approach, Mainstreaming Climate Resilience, People-centric Conservation, Integration with Development Planning(EIA), Focus on Marine Biodiversity"},{"t":"Non-binding in nature—lack of legal enforceability, Poor inter-departmental coordination, Human-wildlife conflict mitigation efforts remain fragmented and reactive, Inadequate funding and manpower for monitoring actions","h":"Issues w NWAP :"}],"id":"nwap:def-main","v":"50293e","q":"What does the National Wildlife Action Plan focus on, and where does it fall short?"}],"circle":"w"},{"id":"jan-vishwas-amendment-of-provisions-act","subj":"s01","name":"Jan Vishwas (Amendment of Provisions) Act, 2023","cards":[{"path":[],"roles":["def"],"rows":[{"t":"amends 42 central laws (incl. EPA 1986 and Air Act 1981) to replace jail with penalties for minor offences","h":"<b>Definition & India's status<\/b>:"},{"sec":"<b>Pillars / key features<\/b>"},{"t":"1. <mark>Decriminalized minor offences<\/mark>: Actions like polluting beyond limits or not furnishing required information are no longer criminal; they're now civil violations—with penalties."},{"t":"2. Set up Adjudicating Officers: Specialized officers handle violations and determine penalties instead of courts."},{"t":"3. Introduction of <mark>Environmental Protection Fund<\/mark>: Fines collected go directly into a dedicated fund used for environmental projects."}],"id":"jan-vishwas-amendment-of-provisions-act:def-main","v":"ec4772","q":"What did the Jan Vishwas Act 2023 change in environmental law, and how?"},{"path":[],"roles":["use","eg","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\"><mark>ease of doing business<\/mark><\/span><br><span class=\"li\">fewer cases in courts<\/span><\/span>","h":"<b>Significance<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">EPA Section 15 (2023: jail → penalty of ₹10,000 to ₹15 lakh, fixed by an <mark>adjudicating officer<\/mark>)<\/span><br><span class=\"li\">Water (Amendment) Act 2024 (same shift for the Water Act)<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"4. Jan Vishwas 2.0 is being planned to introduce to decorum other provisions around 250 with penalties to reduce compliance related delay and log cost","h":"<b>India's response<\/b>:"}],"id":"jan-vishwas-amendment-of-provisions-act:use-main","v":"325587","q":"Why decriminalise, what changed in the EPA and Water Act, and what is coming next?"},{"path":[],"roles":["issue","fix"],"rows":[{"sec":"<b>Challenges<\/b>: Issues"},{"t":"Supreme Court deems the Act “<mark>toothless<\/mark>” post amendments—criminal provisions dropped, enforcement stalled"},{"t":"polluted Futala Lake (Nagpur), palm tree felling in Bihar leading to lightning deaths; Even if an EIA report is negative-still go ahead is given, Persistent issues: illegal quarrying in Kerala forests, oil spill near Kochi, heavy metal air pollution in Delhi, state EIA not appointed on time.","h":"Ongoing environmental harms:"},{"t":"<span class=\"lst\"><span class=\"li\">fines high enough to deter<\/span><br><span class=\"li\">quick adjudication<\/span><br><span class=\"li\">keep criminal liability for serious harm<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"jan-vishwas-amendment-of-provisions-act:issue-main","v":"19bbd7","q":"Why is the decriminalised law called toothless, and how do we fix it?"}],"circle":"y"},{"id":"the-biological-diversity-act-2002","subj":"s01","name":"The Biological Diversity Act, 2002","cards":[{"path":[],"roles":["def","how"],"rows":[{"t":"Protects India’s plants, animals, and traditional knowledge by regulating access, preventing biopiracy, and ensuring fair benefit-sharing through a <mark>three-tier<\/mark> institutional framework: NBA 9National Biodiversity Authority), SBBs (State Biodiversity Boards)(28 in number), and BMCs (Biodiversity Management Committees) (1.4 lakh)."},{"t":"Promotes conservation (can be declared <mark>Biodiversity Heritage Sites<\/mark> (BHS) for protection eg Kaya Kalp Vriksh (Punjab) — a giant, old tree of cultural and ecological importance. Mangroves in Gujarat — preserved for their role in coastal protection and biodiversity.), sustainable use, and equitable sharing of benefits from biodiversity resources and promotes NGT working (eg. Nayar River case (June 2025))."},{"t":"<span class=\"lst\"><span class=\"li\">resource from an identifiable institution → 25–40% of ABS money to it, 60–75% to local communities via SBBs/UTBCs<\/span><br><span class=\"li\">from traders (origin unknown) → spent straight on conservation<\/span><br><span class=\"li\">digital records for traceability<\/span><\/span>","h":"NBA's new ABS framework:"},{"t":"BMCs keep People's Biodiversity Registers (local biodiversity + traditional knowledge)"}],"id":"the-biological-diversity-act-2002:def-main","v":"dd4601","q":"How does the Biological Diversity Act protect biodiversity and share its benefits?","read":1},{"path":[],"roles":["issue"],"rows":[{"t":"Recent amendments (2023) weakened enforcement by decriminalizing offences and exempting AYUSH practitioners, reducing local community benefits (The 2025 regulations set benefit-sharing rates from 0.2–0.6% for most resources and 5%+ for high-value ones, included <mark>Digital Sequence Information<\/mark> (DSI), reduced community shares to 85–90%, and let NBA/SBBs retain funds if providers are unknown)"},{"t":"The 2025 regulations expanded scope to digital genetic data but enforcement remains weak (especially Nagoya protocol (The Nagoya Protocol is an international agreement that ensures fair sharing of benefits when genetic resources (like plants or animals) are used."},{"t":"India struggles with its implementation due to weak enforcement, lack of awareness, and bureaucratic delays but the recent The Biological Diversity (Amendment) Act, 2023 modernizes India’s biodiversity laws by expanding resource definitions, easing research and traditional medicine use (Indian entities must register with NBA if research based patent), and shifting from jail terms to fines.","cont":1},{"t":"It also clarifies NBA and SBB roles, strengthens patent rules, and broadens exemptions for domestic users via exemptions for AYUSH therefore bringing it closer to Nagoya."},{"t":"Overall, India has strong laws and institutions but faces challenges in fair implementation and protecting tribal rights."}],"id":"the-biological-diversity-act-2002:issue-main","v":"435464","q":"How did the 2023 amendment and 2025 rules weaken or change the BD Act?","read":1},{"path":[],"roles":["eg"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Kani tribe, Kerala (1990s, worked: Jeevani drug from arogyapacha → licence fee and royalty shared with the tribe = early <mark>access and benefit sharing<\/mark> model)<\/span><br><span class=\"li\">Bt brinjal, Karnataka (2011, failed: NBA case against Mahyco/Monsanto for using local brinjal varieties without approval → dragged on for years = <mark>biopiracy<\/mark> hard to punish)<\/span><\/span>","h":"<b>Examples<\/b>:"}],"id":"the-biological-diversity-act-2002:eg-main","v":"48eb08","q":"One benefit-sharing success and one biopiracy case under the BD Act?"},{"path":[],"roles":["fact"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">TK examples: karez/surang bavi water harvesting (Bidar)<\/span><br><span class=\"li\">sacred groves (Khasi, Garo)<\/span><br><span class=\"li\">Soligas managing BRT Tiger Reserve<\/span><\/span>","h":"Genetic resources & TK:"},{"t":"<span class=\"lst\"><span class=\"li\">protected by <mark>TKDL<\/mark><\/span><br><span class=\"li\">Patents Act 1970<\/span><br><span class=\"li\">PPVFR Act 2001<\/span><br><span class=\"li\">GI Act 1999<\/span><\/span>","cont":1},{"t":"<span class=\"lst\"><span class=\"li\">AYUSH ministry<\/span><br><span class=\"li\">Yoga on UNESCO list<\/span><\/span>","cont":1},{"t":"problems: biopiracy, poor records, weak farmer rights","cont":1},{"t":"<span class=\"lst\"><span class=\"li\">way forward: pay TK holders<\/span><br><span class=\"li\">teach TK<\/span><br><span class=\"li\">ABS under Nagoya<\/span><\/span>","cont":1}],"title":"Genetic resources & TK:","id":"the-biological-diversity-act-2002:fact-genetic-resources-tk","v":"cc6c2d","q":"Examples of traditional knowledge, the laws that protect it, its problems and the way forward?"}],"circle":"g","pyq":["<b>2018 Q17 (15 marks):<\/b> How does biodiversity vary in India? How is the Biological Diversity Act,2002 helpful in conservation of flora and fauna?"]},{"id":"forests","subj":"s01","name":"Forests","cards":[{"path":[],"roles":["def","use"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Forest (21% of geographical area)<\/span><br><span class=\"li\">3rd in avg annual net gain (state of worlds forests report)<\/span><br><span class=\"li\">forest + tree cover <mark>25.17%<\/mark> (ISFR 2023; 24.62% in 2021)<\/span><br><span class=\"li\">~2% of world forest area (GFRA 2025)<\/span><\/span>","h":"<b>Definition & India's status<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">12000 tonnes of CO2 sink<\/span><br><span class=\"li\">livelihood to 275 million<\/span><br><span class=\"li\">carbon stock ~24,000 mt CO₂ worth ~$120 bn<\/span><br><span class=\"li\">shield against storms and floods (mangroves, coastal forests)<\/span><br><span class=\"li\">NTFPs (SOFO 2024)<\/span><\/span>","h":"<b>Significance<\/b>:"}],"id":"forests:def-main","v":"2ed270","q":"India&#x27;s forest and tree cover status, and why forests matter?"},{"path":[],"roles":["fact"],"rows":[{"sec":"Food and Agriculture Organization (FAO)’s Global Forest Resources Assessment (GFRA) 2025 released on 22 October 2025"},{"t":"9th position worldwide in terms of total forest area"},{"t":"3 rd in net gain"},{"t":"The total bamboo resource globally is estimated at 30.1 million ha, of which 21.2 million ha (70 percent) is in Asia, with India accounting for 11.8 million hectares","h":"Bamboo Plantations:"},{"t":"India ranks 5th globally with 831 thousand hectares of rubber plantations","h":"Rubber Plantations:"},{"t":"India, along with Indonesia, accounts for nearly 100% of Asia’s agroforestry area","h":"Agroforestry Area:"},{"t":"As per 2025 Forest Resources Assessment, the world’s forests acted as a net <mark>carbon sink<\/mark> during the 2021–2025 period, sequestering 3.6 billion tonnes of carbon dioxide (Gt CO2) annually on forest land."}],"id":"forests:fact-main","v":"ecb1a9","q":"What did FAO&#x27;s Global Forest Resources Assessment 2025 say about India and the world?"},{"path":[],"roles":["eg","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Sukhomajri, Haryana (1970s–80s, worked: village protected the Shivalik catchment in return for water and grass rights → model for <mark>Joint Forest Management<\/mark>)<\/span><br><span class=\"li\">Hasdeo Arand, Chhattisgarh (2022 on, failed: coal mining in dense forest despite gram sabha protests)<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">(green forest mission : increase by 5Mha )<\/span><br><span class=\"li\">( Miyazaki method of forest regeneration (regenerate based on specified locality)<\/span><br><span class=\"li\">Initiatives that led to this : National Mission for a Green India (GIM) (Aims to expand forest and tree cover by 5 million ha ), <mark>Mission LiFE<\/mark> (Lifestyle for Environment) (ek pedh ma ke naam)<\/span><\/span>","h":"<b>India's response<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">NDC: extra <mark>carbon sink<\/mark> of 3.5–4.0 bn t CO₂e by 2035 (from 2005)<\/span><br><span class=\"li\">Bonn Challenge 26 Mha by 2030<\/span><br><span class=\"li\">National Afforestation Programme<\/span><br><span class=\"li\">CAMPA<\/span><\/span>","cont":1}],"id":"forests:eg-main","v":"95a35d","q":"One community forest success, one failure, and India&#x27;s forest missions and targets?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">deforestation 3.3 % b/w 2001-2022<\/span><br><span class=\"li\">forest land diverted for mining (Hasdeo)<\/span><br><span class=\"li\">forest finance gap $216 bn to 2030 (UNEP 2025)<\/span><br><span class=\"li\">~77% of world's mines within 50 km of Key Biodiversity Areas<\/span><br><span class=\"li\">warming → more forest fires<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">native-species planting with survival audits<\/span><br><span class=\"li\">community forest rights<\/span><br><span class=\"li\"><mark>REDD+<\/mark> finance for standing forests (UNFCCC COP13)<\/span><\/span>","h":"<b>Way forward<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">restoration (rehabilitation, reclamation)<\/span><br><span class=\"li\">best practices (Japan's Forest Environment Tax, Congo Basin Forest Partnership)<\/span><br><span class=\"li\">rights-based approach<\/span><\/span>","cont":1}],"id":"forests:issue-main","v":"c4c529","q":"What is shrinking India&#x27;s forests, and what is the way forward?"}],"circle":"y"},{"id":"indian-forest-act-1927","subj":"s01","name":"Indian Forest Act, 1927","cards":[{"path":[],"roles":["def"],"rows":[{"t":"The Core Philosophy: This is a <mark>colonial-era law<\/mark>. Its primary goal was to extract timber and generate revenue by giving the State absolute monopoly over forests, viewing local tribes as obstacles.","h":"<b>Definition & India's status<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Classifies forests into <mark>Reserved, Protected, Village<\/mark>, and Private categories, giving the government strict control over forest resources and activities like logging and grazing.<\/span><br><span class=\"li\">It criminalizes unauthorized use with penalties and empowers forest officers to enforce laws and seize illegal property.<\/span><\/span>","h":"<b>Pillars / key features<\/b>:"}],"id":"indian-forest-act-1927:def-main","v":"15fffd","q":"What was the Indian Forest Act 1927 built for, and how does it classify forests?"},{"path":[],"roles":["use","eg","gov"],"rows":[{"t":"provides strong legal authority to prevent encroachment","h":"<b>Significance<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Draft IFA amendment, 2019 (failed: arms and immunity for forest officers → withdrawn Nov 2019 after tribal protests)<\/span><br><span class=\"li\">bamboo amendment, 2017 (worked: bamboo grown outside forests cut and sold without transit permits)<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"removal of bamboo classification as a tree in 2017 eases local use","h":"<b>India's response<\/b>:"}],"id":"indian-forest-act-1927:use-main","v":"a9c7ce","q":"What does the IFA still do well, one failed and one useful amendment?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">enforcement lapses (Over 10,000 acres recently encroached in Odisha’s Reserved Forests amid enforcement lapses.) have led to large-scale illegal activities and conflicts with tribal rights under the Forest Rights Act, 2006<\/span><br><span class=\"li\">The Act’s restrictions historically limited tribal economic benefits<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">align with <mark>FRA<\/mark> (Gram Sabha say)<\/span><br><span class=\"li\">digitise forest records<\/span><br><span class=\"li\">conservation over revenue<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"indian-forest-act-1927:issue-main","v":"68a45e","q":"Where does the IFA clash with forest dwellers, and how should it change?"}],"circle":"y"},{"id":"forest-conservation-act-1980","subj":"s01","name":"Forest (Conservation) Act, 1980","cards":[{"path":[],"roles":["def"],"rows":[{"t":"The Core Philosophy: Post-independence, India realized its forests were vanishing rapidly. This act shifted power from the States to the Center to stop the indiscriminate diversion of forest land for industries.","h":"<b>Definition & India's status<\/b>:"},{"t":"Requires central government approval for diverting forest land to non-forestry uses and mandates <mark>compensatory afforestation<\/mark>, wildlife clearance, and catchment protection.","h":"<b>Pillars / key features<\/b>:"},{"t":"It broadly defines “forest land,” includes recognition of tribal rights under the Forest Rights Act (FRA), and is enforced by MoEFCC with <mark>Gram Sabha<\/mark> and state oversight."}],"id":"forest-conservation-act-1980:def-main","v":"8f35f2","q":"Why was the Forest (Conservation) Act 1980 passed, and what does it require?"},{"path":[],"roles":["use","eg","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Positives include regulated forest land use and institutionalized compensatory afforestation (non-forest penalty was introduced)<\/span><br><span class=\"li\">CA: 85% of target met (2019–24, CEC) under CAF Act 2016 (<mark>CAMPA<\/mark>, from Godavarman)<\/span><\/span>","h":"<b>Significance<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\"><mark>T.N. Godavarman<\/mark> (1996, worked: SC read 'forest' by its dictionary meaning → FCA applied to all forests, not just recorded ones)<\/span><br><span class=\"li\">Gachibowli, Hyderabad (2025, failed): The Gachibowli case highlighted conflicts between urban development and ecological protection(The area lies near the KBR National Park <mark>Eco-Sensitive Zone<\/mark> (ESZ) and the Biodiversity Park, both critical urban green lungs.), leading to Supreme Court emphasizing ecological sanctity over convenience. (Re: Kancha Gachibowli Forest, State of Telangana)<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"The 2023 Amendment narrows forest land scope (Forest land now includes only areas recorded as forest on or after Oct 25, 1980, unless diverted by Dec 12, 1996.), introduces exemptions for strategic projects, allows eco-tourism and silviculture and safaris and surveys, and strengthens central authority.","h":"<b>India's response<\/b>:"}],"id":"forest-conservation-act-1980:use-main","v":"7c239d","q":"What has the FCA achieved, which cases shaped it, and what did the 2023 amendment change?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">issues involve poor survival rates of compensatory plants, uneven FRA implementation, and uncollected penalties for violations.<\/span><br><span class=\"li\">CA funds: late plans, many state approvals, short staff, misuse<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Future actions include ensuring genuine Gram Sabha consultations, improving compensatory afforestation quality, enforcing penalties, auditing forest diversion, and focusing on net ecological benefits.<\/span><br><span class=\"li\">geo-tag CA sites online (e-Green Watch, PARIVESH 2.0)<\/span><br><span class=\"li\">regular State CAMPA meetings<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"forest-conservation-act-1980:issue-main","v":"ecc1bb","q":"Where does the FCA fall short, and what should be done?"}],"circle":"y"},{"id":"forest-rights-act-2006","subj":"s01","name":"Forest Rights Act, 2006","cards":[{"path":[],"roles":["def","use"],"rows":[{"t":"Recognizes and restores individual and community rights of Scheduled Tribes and traditional forest dwellers over forest land and resources. It empowers Gram Sabhas to manage and conserve forests sustainably. The Act also overrides conflicting provisions of earlier laws like the Indian Forest Act, 1927.","h":"<b>Definition & India's status<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">undoes the <mark>historical injustice<\/mark> to forest dwellers (Act's preamble)<\/span><br><span class=\"li\">makes them partners in conservation<\/span><\/span>","h":"<b>Significance<\/b>:"}],"id":"forest-rights-act-2006:def-main","v":"b38646","q":"What rights does the FRA give, to whom, and why does it matter?"},{"path":[],"roles":["eg","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Case study : Mendha Lekha village in Maharashtra was the first to claim community forest rights under FRA, managing 1,800 hectares sustainably through Gram Sabha, boosting livelihoods and achieving zero deforestation.<\/span><br><span class=\"li\"><mark>Niyamgiri<\/mark>, Odisha (2013, worked: SC let <mark>gram sabhas<\/mark> decide → all 12 rejected Vedanta's bauxite mine)<\/span><br><span class=\"li\">SC eviction order, Feb 2019 (failed: ~11.8 lakh households with rejected claims ordered out → stayed within days; shows high wrongful rejection of claims)<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"FRA cells in tribal districts under Dharti Aaba Janjatiya Gram Utkarsh Abhiyan (2024) to clear pending claims","h":"<b>India's response<\/b>:"}],"id":"forest-rights-act-2006:eg-main","v":"d86785","q":"Two FRA successes, one failure, and what the government is doing about pending claims?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"Issues w it : CFR (<mark>Community Forest Resource<\/mark> rights. When a community files a CFR claim, they are making a formal, legal request to the government to recognize and restore their traditional rights to acces) claims pending in 65% of eligible villages (MoTA 2025 report), States like Madhya Pradesh and Odisha continue to bypass <mark>Gram Sabha<\/mark> during forest diversion clearance, Commercial plantation projects (e.g. oil palm in NE India, Palm Oil Plantation Row (Assam, 2024–25): Gram Sabha consent bypassed) are being approved without community consent (Assam Palm Oil Row (2024–25)), Legal evictions rise after denial of claims—over 20,000 families affected in Telangana and Chhattisgarh (2024–25), Lack of legal literacy.","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">time-bound disposal of claims<\/span><br><span class=\"li\">legal literacy camps<\/span><br><span class=\"li\"><mark>Gram Sabha consent<\/mark> before any diversion<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"forest-rights-act-2006:issue-main","v":"681f55","q":"Why is the FRA poorly implemented, and how do we fix it?","read":1}],"circle":"y"},{"id":"forest-conservation-amendment-act-2023","subj":"s01","name":"Forest (Conservation) Amendment Act, 2023:","cards":[{"path":[],"roles":["def","eg"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">amends the FCA 1980<\/span><br><span class=\"li\">renames it Van (Sanrakshan Evam Samvardhan) Adhiniyam, 1980<\/span><\/span>","h":"<b>Definition & India's status<\/b>:"},{"sec":"<b>Pillars / key features<\/b>: 1. Narrowing the Definition of a \"Forest\" (The Biggest Controversy)"},{"t":"In the landmark 1996 T.N. <mark>Godavarman<\/mark> Supreme Court case, the court ruled that the word \"forest\" must be understood according to its dictionary meaning, regardless of who owned the land or whether it was officially recorded as a forest by the government. This protected millions of hectares of unrecorded, natural forests (like the Aravallis, sacred groves, and mangroves).","h":"The Background:"},{"t":"The amendment explicitly reversed the Supreme Court's ruling. It stated that the strict protections of the Act now only apply to lands that were officially recorded as \"forest\" in government records on or after October 25, 1980.","h":"The 2023 Change:"},{"t":"<span class=\"lst\"><span class=\"li\">SC interim order, Feb 2024 (worked: states must keep the 1996 <mark>dictionary meaning<\/mark> of forest until deemed-forest records are ready)<\/span><br><span class=\"li\">Aravallis (failed: unrecorded Aravalli scrub forests in Haryana lose protection → see 🟢 ARAVALLIS)<\/span><\/span>","h":"<b>Examples<\/b>:"}],"id":"forest-conservation-amendment-act-2023:def-main","v":"eef730","q":"What did the 2023 amendment rename, how did it change the meaning of &quot;forest&quot;, and what has the SC said since?","read":1},{"path":[],"roles":["def","use"],"rows":[{"sec":"The 100-km Border Exemption (The Security vs. Ecology Debate)"},{"t":"The amendment completely exempts forest land located within 100 kilometers of international borders, the Line of Control (LoC), or the Line of Actual Control (LAC) if the land is needed for \"strategic linear projects of national importance\" (like highways, railways, or military infrastructure).","h":"The Change:"},{"t":"The Rationale: The government argued this is necessary for rapid troop movement and national security, especially given geopolitical tensions with China.","h":"<b>Significance<\/b>:"}],"id":"forest-conservation-amendment-act-2023:def-main-2","v":"9a2f7d","q":"What is the border exemption in the 2023 amendment, and the government&#x27;s reason for it?"},{"path":[],"roles":["issue","fix"],"rows":[{"sec":"<b>Challenges<\/b>"},{"t":"This effectively strips federal protection from nearly 28% of India's actual forest cover that happens to be unclassified or unrecorded. These lands can now be easily cleared by state governments or sold to private developers for real estate, mining, or industry without needing clearance from the Central Ministry (MoEFCC).","h":"The Impact:"},{"t":"If you draw a 100-km line inward from all of India's borders, you effectively swallow up almost the entire ecologically fragile North-East India, the high Himalayas, and the Andaman & Nicobar Islands. Environmentalists argue this gives a blank check to bulldoze some of the world's most sensitive biodiversity hotspots without any environmental impact assessments.","h":"The Impact (The Criticism):"},{"t":"<span class=\"lst\"><span class=\"li\">finish <mark>deemed-forest<\/mark> records state by state<\/span><br><span class=\"li\">keep the dictionary meaning till then<\/span><br><span class=\"li\">EIA even for border projects<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"forest-conservation-amendment-act-2023:issue-main","v":"d4c22f","q":"What does the 2023 amendment cost ecologically, and what is the way forward?"}],"circle":"y"},{"id":"the-van-sanrakshan-evam-samvardhan-amend","subj":"s01","name":"the Van (Sanrakshan Evam Samvardhan) Amendment Rules, 2025","cards":[{"path":[],"roles":["def"],"rows":[{"t":"Notified by MoEFCC in late 2025, amends the 2023 framework → heavily prioritizes \"ease of doing business,\" strategic infrastructure and resource security, though it has sparked considerable debate among ecologists. Here is the structured breakdown:","h":"<b>Definition & India's status<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">1. \"Working Permission\" for Linear Projects: earlier both Stage-I (in-principle) and Stage-II (final) clearances were needed before any work<\/span><br><span class=\"li\">The Change: states can grant \"working permission\" right after Stage-I for railway tracks, transmission lines, initial roadwork (not black-topping or concretization)<\/span><br><span class=\"li\">Impact: drastically speeds up mobilization of labor and site preparation<\/span><\/span>","h":"<b>Pillars / key features<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">2. The Critical Minerals Carve-Out: global race for lithium, cobalt<\/span><br><span class=\"li\">critical and strategic mineral mines (MMDR Act list) can raise <mark>Compensatory Afforestation<\/mark> (CA) over degraded forest land (at least double the diverted area)<\/span><br><span class=\"li\">EIA Exemption: no mandatory Public Consultation<\/span><\/span>"}],"id":"the-van-sanrakshan-evam-samvardhan-amend:def-main","v":"3cb197","q":"What do the Van Amendment Rules 2025 prioritise, and what changed for linear projects and critical minerals?","read":1},{"path":[],"roles":["def","eg"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">3. Dilution of CA Rigidity: CA land earlier had to be notified as \"Protected Forest\" (Indian Forest Act, 1927)<\/span><br><span class=\"li\">now optional, only mutated in revenue records to the Forest Department<\/span><br><span class=\"li\">\"land banking\"<\/span><br><span class=\"li\">states can use central afforestation schemes to meet CA targets<\/span><\/span>"},{"t":"<span class=\"lst\"><span class=\"li\">4. Extended Timelines & Offline Approvals: Stage-I validity 2 → 5 years<\/span><br><span class=\"li\">offline applications (bypassing PARIVESH) for defense, emergencies and vaguely defined \"projects of national importance\"<\/span><\/span>"},{"t":"<span class=\"lst\"><span class=\"li\">6. Allowing Commercial Activities (Eco-Tourism & Safaris): the 2023 amendment made zoos, safaris and eco-tourism \"forestry activities\"<\/span><br><span class=\"li\">states can clear trees for hotels, paved roads and safari infrastructure without central oversight<\/span><br><span class=\"li\">revenue, but concrete, noise pollution and human-wildlife conflict in pristine habitats (Eg. Aravalli issue)<\/span><\/span>"},{"t":"<span class=\"lst\"><span class=\"li\">critical, strategic and atomic mineral mines exempted from <mark>public hearings<\/mark> (Sep 2025)<\/span><br><span class=\"li\">\"public utility\" left undefined → diversions easier (Mongabay, Apr 2026)<\/span><\/span>","h":"<b>Examples<\/b>:"}],"id":"the-van-sanrakshan-evam-samvardhan-amend:def-main-2","v":"a94701","q":"What else do the 2025 rules relax: CA land, timelines, tourism? Recent examples?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">5. The Ecological Criticism: streamlines bottlenecks but severe red flags<\/span><br><span class=\"li\">Legal Shield Weakened (CA land without Protected Forest notification lacks the hard legal armor against future diversion)<\/span><br><span class=\"li\">Supreme Court Friction (bypasses the spirit of SC's early 2025 interim orders: no net reduction in actual, ground-level forest land)<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">notify CA land as Protected Forest<\/span><br><span class=\"li\">public consultation even for critical-mineral mines<\/span><br><span class=\"li\">all approvals on PARIVESH<\/span><br><span class=\"li\"><mark>no net loss<\/mark> of forest, as the SC asked<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"the-van-sanrakshan-evam-samvardhan-amend:issue-main","v":"2462d6","q":"Why are ecologists worried about the 2025 rules, and what should change?"}],"circle":"y"},{"id":"aravallis","subj":"s01","name":"ARAVALLIS","cards":[{"path":[],"roles":["def","use"],"rows":[{"t":"Oldest fold mountains (Pre-Cambrian, older than the Himalayas), ~692 km running south-west: Delhi → Haryana → Rajasthan → Gujarat"},{"t":"<span class=\"lst\"><span class=\"li\">wall stopping the Thar from moving east<\/span><br><span class=\"li\">minerals (Khetri copper)<\/span><br><span class=\"li\">culture (Dilwara temples)<\/span><br><span class=\"li\">people lived here since the Palaeolithic (Mangar Bani)<\/span><\/span>","h":"Why it matters:"}],"id":"aravallis:def-main","v":"1918fd","q":"What are the Aravallis, and why do they matter?"},{"path":[],"roles":["news","issue"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">SC in the <mark>Godavarman<\/mark> case asked for one definition (May 2024)<\/span><br><span class=\"li\">Nov 2025 SC accepted it: hill = 100 m above the surrounding land, range = 2+ hills within 500 m. Mining plan on the Saranda model (<mark>Go / No-Go<\/mark> zones)<\/span><br><span class=\"li\">Dec 2025 Centre bans new mining leases (except critical, strategic and atomic minerals)<\/span><br><span class=\"li\">Dec 2025 SC stays its own order after protests and orders a fresh review<\/span><\/span>","h":"Definition row:"},{"t":"<span class=\"lst\"><span class=\"li\">low hills lose protection → mining and construction → desert spreads<\/span><br><span class=\"li\">groundwater crisis<\/span><\/span>","h":"Why protests:"}],"id":"aravallis:news-main","v":"fb565e","q":"What is the Aravalli definition dispute, and why are people protesting?"},{"path":[],"roles":["issue","gov","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">minerals vs ecology<\/span><br><span class=\"li\">illegal construction (Aravalli safari, Haryana)<\/span><br><span class=\"li\">every state uses its own definition (in silos)<\/span><\/span>","h":"Challenges:"},{"t":"<span class=\"lst\"><span class=\"li\"><mark>Aravalli Green Wall<\/mark> (5 km buffer, 4 states)<\/span><br><span class=\"li\">Mangar Bani no-construction zone (Haryana 2016)<\/span><br><span class=\"li\">MC Mehta case (2002)<\/span><br><span class=\"li\">Save Aravalli Movement (Rajendra Singh → SC halted Sariska mining, 1990)<\/span><\/span>","h":"Protection:"},{"t":"<span class=\"lst\"><span class=\"li\">treat it as one continuous ridge<\/span><br><span class=\"li\">transparent data<\/span><br><span class=\"li\">strict mining bans in sensitive zones<\/span><\/span>","h":"Way forward:"}],"id":"aravallis:issue-main","v":"5c1977","q":"What threatens the Aravallis, what protects them, and what next?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">forest and land lost<\/span><br><span class=\"li\">acid mine drainage and heavy metals in water<\/span><br><span class=\"li\">groundwater falls<\/span><br><span class=\"li\">dust → lung disease<\/span><br><span class=\"li\">land subsidence and underground fires (Jharia)<\/span><\/span>","h":"MINING hazards:"},{"t":"<span class=\"lst\"><span class=\"li\">tailings dams can burst<\/span><br><span class=\"li\">tribal displacement<br>Eg: Jharia coal fires<\/span><\/span>","cont":1},{"t":"<span class=\"lst\"><span class=\"li\">Goa and Bellary iron ore (illegal mining, SC bans)<\/span><br><span class=\"li\">Aravallis (above info)<\/span><\/span>","cont":1},{"t":"<span class=\"lst\"><span class=\"li\">EIA<\/span><br><span class=\"li\">Go/No-Go zones<\/span><br><span class=\"li\">progressive and final mine closure plans<\/span><br><span class=\"li\">reclaim and afforest mined land<\/span><\/span>","h":"Remedies:"},{"t":"<span class=\"lst\"><span class=\"li\">DMF / PMKKKY (info also in RE toggle) for affected people<\/span><br><span class=\"li\">star rating of mines<\/span><br><span class=\"li\">drones and satellite checks on illegal mining<\/span><\/span>","cont":1}],"title":"MINING hazards:","id":"aravallis:issue-mining-hazards","v":"486245","q":"What harm does mining do, and what are the remedies?"},{"path":["Go / No-Go zones"],"roles":["gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Go / No-Go (MoEF + Coal Ministry, 2009–10): coal blocks in 9 coalfields split into \"Go\" (mining allowed) and \"No-Go\" (dense forest: >30% gross or >10% weighted forest cover)<\/span><br><span clas netic resources across borders","h":"<b>Definition & India's status<\/b>:"},{"t":"<mark>CITES<\/mark> (1973) protects endangered species by regulating international trade to prevent threats like poaching.","h":"<b>Pillars / key features<\/b>:"},{"t":"CMS (1979) conserves migratory species across borders through legal frameworks."},{"t":"The Man and Biosphere Programme (1971) fosters sustainable development via establishment of biosphere reserves"},{"t":"<span class=\"lst\"><span class=\"li\">PGRFA (plant genetic resources for food and agriculture) focuses on preserving plant genetic resources vital for food security and crop improvement.<\/span><br><span class=\"li\">ITPGRFA (2001, India a member): shares 64 crops and forages = ~80% of plant diet<\/span><br><span class=\"li\">Lima meeting (GB-11, 2025): benefit-sharing talks failed, DSI rules pushed to next meeting<\/span><br><span class=\"li\">India: protect sovereign rights<\/span><br><span class=\"li\">DSI risk = digital biopiracy (Cali Fund set up for it)<\/span><\/span>"}],"id":"international-conventions:def-main","v":"ef14d9","q":"The main biodiversity conventions and programmes, and what each does?"},{"path":[],"roles":["def"],"rows":[{"t":"The UN Convention on Biological Diversity (1992) promotes biodiversity conservation and sustainable use, including Access and Benefit Sharing. It also has COP, recent COP 15 adopted The <mark>Kunming-Montreal<\/mark> Global Biodiversity Framework (GBF), adopted in December 2022 at CBD COP 15, sets global goals to halt and reverse biodiversity loss by 2030, including conserving 30% of land and oceans, restoring 30% of degraded ecosystems, reducing invasive species and pollution by half, and cutting $500 billion in harmful subsidies."},{"t":"It emphasizes inclusive governance (rights of indigenous), equitable benefit-sharing, and mobilizing $200 billion annually for biodiversity. Called the \"<mark>Paris Agreement<\/mark> for Nature,\" it aims for a nature-positive future, with progress reviews at COP16 in 2024.","cont":1}],"id":"international-conventions:def-main-2","v":"4247db","q":"What does the CBD do, and what does the KMGBF adopted under it commit to?"},{"path":[],"roles":["eg","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">CITES CoP18, 2019 (worked: India got the star tortoise and smooth-coated otter moved to Appendix I)<\/span><br><span class=\"li\">CMS COP13, Gandhinagar 2020 (Great Indian Bustard, Asian elephant, Bengal florican added to Appendix I)<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">party to <mark>CITES<\/mark> (1976), CMS (1983; hosted CMS COP13, Gandhinagar 2020), CBD (1994)<\/span><br><span class=\"li\">18 biosphere reserves, most in UNESCO's MAB network<\/span><br><span class=\"li\">Wildlife Crime Control Bureau enforces CITES<\/span><\/span>","h":"<b>India's response<\/b>:"}],"id":"international-conventions:eg-main","v":"fecbcd","q":"Two convention wins for India, and which conventions India is party to?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">weak enforcement (illegal wildlife trade)<\/span><br><span class=\"li\">finance gap<\/span><br><span class=\"li\">targets not binding (Aichi missed)<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">matching domestic law (WPA Schedule IV = CITES)<\/span><br><span class=\"li\">finance for the South<\/span><br><span class=\"li\"><mark>benefit-sharing<\/mark> that reaches local communities<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"international-conventions:issue-main","v":"732fdb","q":"Why do biodiversity conventions underdeliver, and what would help?"}],"circle":"y"},{"id":"ecologically-sensitive-area","subj":"s01","name":"Ecologically sensitive area","cards":[{"path":[],"roles":["def","use"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Declared around protected areas under EPA<\/span><br><span class=\"li\">notifi ","h":"Examples of Sites in India:"},{"t":"Indore and Udaipur cities","h":"Examples of Wetland City Accreditation (WCA):"},{"t":"Ramsar sites where changes in ecological character have occurred, are occurring, or are likely to occur due to technological developments, pollution or other human interference. Examples: Loktak (Manipur) and Keoladeo National Park (Rajasthan)","h":"Montreux Record:"}],"id":"wetland-conservation:def-main","v":"2f516b","q":"Ramsar: when India joined, its sites (oldest, newest), wetland cities and the Montreux Record?"},{"path":[],"roles":["def","fact"],"rows":[{"t":"keep a wetland's ecological character while people use it (ecosystem approach + sustainable development)","h":"Wise use (Ramsar's core idea):"},{"t":"<span class=\"lst\"><span class=\"li\">parties do it via national plans<\/span><br><span class=\"li\">laws<\/span><br><span class=\"li\">management<\/span><br><span class=\"li\">public education<\/span><\/span>","cont":1},{"t":"India at Ramsar COP15 (Victoria Falls, Zimbabwe, 2025): resolution \"Promoting Sustainable Lifestyles for Wetlands\" (linked to Mission LiFE), backed by 172 countries"},{"t":"<span class=\"lst\"><span class=\"li\">Unwise use → 74% of J&K lakes vanished or shrank since 1967 (CAG)<\/span><br><span class=\"li\">native fish gone from Wular<\/span><br><span class=\"li\">fishers and houseboat owners lose income<\/span><br><span class=\"li\">heavy metals in fish<\/span><\/span>"}],"id":"wetland-conservation:def-main-2","v":"a17867","q":"What is Ramsar&#x27;s &quot;wise use&quot;, India&#x27;s resolution at COP15, and what unwise use looks like?"}],"circle":"g","pyq":["<b>2023 Q17 (15 marks):<\/b> Comment on the National Wetland Conservation Programme initiated by the Government of India and name a few India’s wetlands of international importance included in the Ramsar Sites.","<b>2018 Q7 (10 marks):<\/b> What is wetland? Explain the Ramsar concept of ‘wise use’ in the context of wetland conservation. Cite two examp
