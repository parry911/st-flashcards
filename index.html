UBAI)","cards":[{"path":[],"roles":["def","eg"],"rows":[{"t":"Dubai, UAE, Nov–Dec 2023 → first Global Stocktake","h":"<b>Definition & India's status<\/b>:"},{"sec":"<b>Pillars / key features<\/b> (Global Architecture & Outcomes)"},{"t":"This was the realization of the <mark>Paris Agreement<\/mark>'s built-in \"<mark>Ratchet Mechanism<\/mark>.\" The GST concluded that the world was severely off-track from the 1.5°C goal.","h":"The First <mark>Global Stocktake<\/mark> (GST):"},{"t":"For the first time in nearly 30 years of climate summits, the final text explicitly called for \"transitioning away from fossil fuels in energy systems, in a just, orderly and equitable manner.\" (This language is critical—it avoided the strict \"phase-out\" demanded by the West, accommodating developing nations).","h":"The \"UAE Consensus\":"},{"t":"A global pledge was introduced to triple renewable energy capacity (to roughly 11,000 GW) and double the global average annual rate of energy efficiency improvements by 2030.","h":"Tripling Renewables & Doubling Efficiency:"},{"t":"On Day 1, the Loss and Damage Fund (agreed upon at COP27) was officially operationalized and capitalized with initial pledges, a rare moment of immediate action.","h":"Early Win on Loss & Damage:"},{"t":"<span class=\"lst\"><span class=\"li\">L&D fund ~$700 mn pledged on Day 1 (vs hundreds of billions needed a year)<\/span><br><span class=\"li\">India and China stayed out of the tripling-renewables and <mark>Global Cooling Pledge<\/mark><\/span><\/span>","h":"<b>Examples<\/b>:"}],"id":"cop-28-dubai:def-main","v":"ba27f7","q":"COP28: the stocktake, the &quot;UAE Consensus&quot;, the pledges, and what happened on loss and damage?","read":1},{"path":[],"roles":["gov"],"rows":[{"sec":"<b>India's response<\/b> (India’s Strategic Stance & Diplomatic Gains)"},{"t":"India made a bold, calculated move. Despite having one of the world's fastest-growing renewable sectors, India (along with China) refused to sign the pledge to triple global renewable energy.","h":"Protecting Sovereign Energy Security:"},{"t":"The pledge contained hidden clauses aimed at halting investments in \"unabated coal power.\" India fiercely maintained that while it is committed to scaling renewables (already meeting its NDC targets early), it cannot compromise its baseload power requirements essential for rapid industrialization and poverty eradication.","h":"Why?"},{"t":"Moving beyond just \"carbon credits,\" India launched the Global Green Credit Portal. This is a massive paradigm shift. It creates a market-based incentive system that rewards broader ecological actions—like water conservation, afforestation, and waste management—not just carbon emission reductions.","h":"The Green Credit Initiative:"},{"t":"Signaling ultimate confidence in its climate trajectory, Prime Minister Modi officially offered to host COP33 in India in 2028.","h":"Pitching for Global Leadership:"},{"t":"Following its launch at the G20 in New Delhi earlier that year, India used COP28 to heavily promote the GBA, positioning biofuels as the essential bridge for the Global South's energy transition.","h":"Global Biofuel Alliance (GBA) Push:"}],"id":"cop-28-dubai:gov-main","v":"c2bc86","q":"What did India refuse at COP28 and why, and what did it launch and offer?","read":1},{"path":[],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">\"transition away\", not phase-out<\/span><br><span class=\"li\">loopholes (\"transitional fuels\" = gas, CCS)<\/span><br><span class=\"li\">L&D pledges small<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">turn the stocktake into stronger <mark>NDC 3.0<\/mark> (2025 round)<\/span><br><span class=\"li\">finance to match<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"cop-28-dubai:issue-main","v":"a0521e","q":"Where did COP28 fall short, and what next?"}],"circle":"y"},{"id":"cop-29-baku","subj":"s02","name":"COP 29 (BAKU)","cards":[{"path":[],"roles":["def"],"rows":[{"t":"1. COP 29 (Baku, 2024): The Finance COP & The Battle for Equity","h":"<b>Definition & India's status<\/b>:"},{"sec":"<b>Pillars / key features<\/b> (Global Architecture & Outcomes)"},{"t":"The primary mandate of Baku was to replace the notoriously unmet $100 billion/year target (set back in 2009) with a post-2025 finance framework.","h":"The New Collective Quantified Goal (<mark>NCQG<\/mark>):"},{"t":"After bitter negotiations, developed nations agreed to a target of mobilizing $300 billion annually by 2035. However, this figure controversially includes private sector investments and multilateral loans, rather than just direct public grants from wealthy nations.","h":"The $300 Billion Compromise:"},{"t":"After years of deadlock since the <mark>Paris Agreement<\/mark>, the summit finally adopted the rules for a centralized, UN-backed global carbon market. This mechanism allows countries and companies to trade carbon credits (representing emission reductions) to meet their climate targets, officially replacing the Kyoto-era CDM.","h":"Breakthrough on <mark>Article 6<\/mark>.4:"}],"id":"cop-29-baku:def-main","v":"9f1957","q":"COP29: what was the finance goal, the compromise, and the carbon-market breakthrough?"},{"path":[],"roles":["def","eg"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Enhanced Transparency Framework<\/span><br><span class=\"li\">first Biennial Transparency Reports completed<\/span><br><span class=\"li\">Baku Adaptation Roadmap launched<\/span><\/span>","h":"Also at COP29:"},{"t":"<span class=\"lst\"><span class=\"li\">Sharm el-Sheikh mitigation programme continued<\/span><br><span class=\"li\">Baku Workplan (indigenous peoples) renewed<\/span><br><span class=\"li\">Lima Gender and Climate Change Programme extended by 10 years<\/span><\/span>","cont":1},{"t":"<span class=\"lst\"><span class=\"li\">India's objection at the closing plenary (Chandni Raina: \"optical illusion\") → deal gavelled through anyway<\/span><br><span class=\"li\">Switzerland–Thailand (Bangkok e-buses), first <mark>Article 6.2<\/mark> credit transfer (Jan 2024)<\/span><\/span>","h":"<b>Examples<\/b>:"}],"id":"cop-29-baku:def-main-2","v":"f9b9b1","q":"What else came out of COP29, and two examples from it?"},{"path":[],"roles":["gov"],"rows":[{"sec":"<b>India's response<\/b> (India’s Strategic Stance & Diplomatic Masterstrokes)"},{"t":"The Voice of the Global South (LMDC & BASIC): India did not just negotiate for itself; it acted as the shield for the Like-Minded Developing Countries (LMDC) and the broader Global South, aggressively calling out the structural inequity of the final deal."},{"t":"India registered a fierce formal protest on the plenary floor, unequivocally rejecting the $300 billion pledge as an \"abysmally poor\" and \"paltry sum.\" India pointed out that delaying this target to 2035 severely undermines the urgency of the 2030 NDC targets.","h":"Calling Out the \"Optical Illusion\":"},{"t":"India fundamentally challenged the nature of the finance. It argued that forcing developing nations to take on market-rate loans to fund green transitions is not \"climate finance\"—it is a recipe for a widespread sovereign debt crisis. India demanded that the core of the NCQG must be concessional, grant-based public finance.","h":"Quality over Quantity (The Debt Trap Warning):"},{"t":"India maintained that based on independent economic assessments, the developing world requires at least $1.3 trillion annually to realistically transition away from fossil fuels, adapt to climate impacts, and cover loss and damage.","h":"The $1.3 Trillion Demand:"}],"id":"cop-29-baku:gov-main","v":"9fca9f","q":"How did India respond to the COP29 finance deal?","read":1},{"path":[],"roles":["gov","issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">$600 billion of the $1.3 trillion as grants or similar support<\/span><br><span class=\"li\">opposed changes to the Mitigation Work Programme, wanted the pre-2020 emission gap of developed countries recognised<\/span><br><span class=\"li\">just transition respecting developing countries' right to develop<\/span><br><span class=\"li\">opposed follow-up mechanisms for the Global Stocktake, wanted Party-submitted adaptation indicators<\/span><br><span class=\"li\">Global South voice via CDRI and ISA<\/span><\/span>","h":"India's stance also:"},{"t":"<span class=\"lst\"><span class=\"li\">$300 bn far below the $1.3 tn need<\/span><br><span class=\"li\">counts loans and private money<\/span><br><span class=\"li\">target only by 2035<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Baku-to-Belém Roadmap to $1.3 tn<\/span><br><span class=\"li\"><mark>concessional<\/mark> grant-based finance at the core<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"cop-29-baku:gov-main-2","v":"f2c9e3","q":"India&#x27;s other COP29 positions, the deal&#x27;s flaws, and the way forward?"},{"path":[],"roles":["news"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Declaration on Green Digital Action (GDA) adopted, Leveraging Digital Technologies: To support climate action<\/span><br><span class=\"li\">Mitigating the impact of Digitization on climate: Establishing metrics<\/span><br><span class=\"li\">Fostering Sustainable Innovation: By facilitating investments, (reasons : ICT sector is estimated to have accounted for 1.5– 3.2 % of global GHG emissions in 2020, Increase in online shoppers has led to a 30 % rise in digital-related waste from 2010 to 2022, reaching 10.5 million tonnes globally, In 2022, Global data centres alone consumed 460 terawatts hours (expected to double by 2026), Demand for minerals required for digitalisation like graphite, lithium, and cobalt could surge by 500 % to 2050.<\/span><\/span>","h":"<b>Extra (COP29 side outcome)<\/b>:"},{"t":"(Significance of digital tech in sustainable Dev: E.g., AI has been trained to measure changes in icebergs 10,000 times faster than a human, Informed decision making: Data analytics, Sustainable Design approaches: Stress on circular economy model, Promoting Open data sources (DPI’s like India Stack); Climate monitoring using AI, internet to mobilise opinion."}],"title":"<b>Extra (COP29 side outcome)<\/b>:","id":"cop-29-baku:news-extra-cop29-side-outcome","v":"a84aae","q":"What is the Declaration on Green Digital Action, and why does digital tech matter?"}],"circle":"y"},{"id":"cop-30-belem","subj":"s02","name":"COP 30 (BELEM)","cards":[{"path":[],"roles":["def"],"rows":[{"t":"Belém, Brazil, Nov 2025 → 10 years after Paris, held at the edge of the Amazon","h":"<b>Definition & India's status<\/b>:"},{"sec":"<b>Pillars / key features<\/b> (Global Architecture & Outcomes: The Belém Package)"},{"t":"A paradigm-shifting, $125 billion multilateral investment fund. Unlike previous grant-based models, the TFFF operates on market logic—creating a massive trust fund that pays dividends to tropical nations for successfully conserving their forests. Crucially, it mandates that 20% of all funds must go directly to Indigenous Peoples and Local Communities.","h":"The <mark>Tropical Forests Forever Facility<\/mark> (TFFF):"},{"t":"While previous COPs focused heavily on mitigation (cutting emissions), COP30 delivered a vital political signal to triple adaptation finance by 2035, recognizing that vulnerable nations are already suffering irreversible climate impacts.","h":"Tripling Adaptation Finance:"},{"t":"The <mark>Just Transition<\/mark> Mechanism (Belém Action Mechanism - BAM): Formalized a UN mechanism to ensure that the global shift away from fossil fuels is equitable. It guarantees technical and financial support so that workers and fossil-fuel-dependent communities in developing nations are not left behind during the green transition."},{"t":"The summit finalized a comprehensive set of 59 indicators to finally measure and track global progress on climate resilience (e.g., water security, infrastructure readiness).","h":"<mark>Global Goal on Adaptation<\/mark> (GGA) Indicators:"}],"id":"cop-30-belem:def-main","v":"f7411f","q":"COP30: TFFF, adaptation finance, just transition and adaptation indicators?","read":1},{"path":[],"roles":["def"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Belém Mission to 1.5°C (COP29–31 troika)<\/span><br><span class=\"li\">Baku-to-Belém Roadmap to $1.3 tn/yr by 2035<\/span><br><span class=\"li\">adaptation finance tripled to $120 bn/yr (within the $300 bn NCQG)<\/span><br><span class=\"li\">Baku Adaptation Roadmap 2026–28<\/span><br><span class=\"li\">Belém 4x Pledge on sustainable fuels by 2035 (India among launchers)<\/span><\/span>","h":"<mark>Belém Package<\/mark> (195 Parties):"},{"t":"<span class=\"lst\"><span class=\"li\">Belém Health Action Plan (first health adaptation plan, $300 mn)<\/span><br><span class=\"li\">PACT (coal transitions)<\/span><br><span class=\"li\">J-REDD+<\/span><br><span class=\"li\">Gender Action Plan<\/span><\/span>","cont":1},{"t":"<span class=\"lst\"><span class=\"li\">Systematic Observation Impact Bond (first bond for weather data; $200 mn for LDCs and SIDS)<\/span><br><span class=\"li\">Beat the Heat drive (72 nations in Global Cooling Pledge: cooling emissions −68% by 2050)<\/span><br><span class=\"li\">Food Waste Breakthrough (halve food waste by 2030)<\/span><br><span class=\"li\">No Organic Waste (methane from organic waste −30% by 2030)<\/span><br><span class=\"li\">Utilities for Net Zero Alliance (~$1 tn by 2030)<\/span><\/span>","h":"Also at Belém:"}],"title":"<mark>Belém Package<\/mark> (195 Parties):","id":"cop-30-belem:def-bel-m-package-195-parties","v":"75f366","q":"What is in the Belém Package, and what else was launched at Belém?"},{"path":[],"roles":["use","eg"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">pledges → implementation (\"COP of Implementation\", \"Forest COP\", 10 years of Paris)<\/span><br><span class=\"li\">TFFF = forest model not tied to carbon markets<\/span><br><span class=\"li\">$1.3 tn = biggest finance goal yet<\/span><br><span class=\"li\">all 195 Parties adopted the package<\/span><\/span>","h":"<b>Significance<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">TFFF launch (~$5.5 bn pledged: Norway up to $3 bn as loans, Brazil and Indonesia $1 bn each → far from the $125 bn goal)<\/span><br><span class=\"li\">53 countries endorsed the TFFF declaration<\/span><\/span>","h":"<b>Examples<\/b>:"}],"id":"cop-30-belem:use-main","v":"c0727f","q":"Why does COP30 matter, and how has the TFFF started?"},{"path":[],"roles":["gov"],"rows":[{"sec":"<b>India's response<\/b> (India’s Strategic Stance & Diplomatic Masterstrokes)"},{"t":"This is India's most critical diplomatic intervention at COP30. Utilizing the BRICS coalition, India launched a fierce condemnation of unilateral, extraterritorial trade measures—specifically targeting the European Union's Carbon Border Adjustment Mechanism (CBAM). India successfully framed these carbon taxes as \"disguised protectionism\" that violates the sacred principle of CBDR-RC by unfairly penalizing the exports of developing economies.","h":"Combating \"Disguised Protectionism\" (The CBAM Pushback):"},{"t":"India powerfully argued on the plenary floor that the Global North is using trade barriers to evade its historical financial responsibilities, essentially forcing the Global South to pay for the developed world's climate guilt.","h":"Defending Economic Sovereignty:"},{"t":"While not a tropical rainforest nation in the Amazonian sense, India strategically joined the TFFF as an Observer. India used this platform to highlight its own massive domestic success: creating an additional carbon sink of 2.29 billion tonnes of CO2  equivalent between 2005 and 2021 through expanded forest and tree cover.","h":"Strategic Observer in TFFF:"},{"t":"India strongly welcomed the new Just Transition Mechanism, reiterating that the burden of climate change mitigation cannot be shifted onto the shoulders of those who have the least historical responsibility for causing the problem.","h":"Championing the Just Transition:"}],"id":"cop-30-belem:gov-main","v":"8c6490","q":"India&#x27;s key interventions at COP30?","read":1},{"path":[],"roles":["gov","issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\"><mark>Article 9.1<\/mark> finance = legal duty of developed countries<\/span><br><span class=\"li\">asked for a clear definition of climate finance<\/span><br><span class=\"li\">\"COP of Adaptation\"<\/span><\/span>","h":"India's stance also:"},{"t":"<span class=\"lst\"><span class=\"li\">developed nations to reach net zero earlier<\/span><br><span class=\"li\">technology access is a right, not a bargaining tool (IPR barriers)<\/span><br><span class=\"li\">via G77+China, BASIC, LMDC<\/span><\/span>","cont":1},{"t":"<span class=\"lst\"><span class=\"li\">no fossil-fuel roadmap in the final text<\/span><br><span class=\"li\">adaptation tripling has no clear baseline<\/span><br><span class=\"li\">CBAM-type trade measures still coming<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Brazil-led fossil-fuel and deforestation roadmaps<\/span><br><span class=\"li\">NDC 3.0 with economy-wide absolute targets<\/span><br><span class=\"li\">finalise GGA indicators<\/span><\/span>","h":"<b>Way forward<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">CBDR to guide timelines and finance<\/span><br><span class=\"li\">fund the TFFF<\/span><br><span class=\"li\">finance on the <mark>Baku-to-Belém Roadmap<\/mark><\/span><\/span>","cont":1}],"id":"cop-30-belem:gov-main-2","v":"1c0ebe","q":"India&#x27;s other COP30 positions, what COP30 missed, and the way forward?"}],"circle":"y"},{"id":"impact-thinking-framework","subj":"s03","name":"Impact Thinking Framework","cards":[{"path":[],"roles":["def"],"rows":[{"t":"EEH (Environment, Economy, Health) Solutions: Recover, Recycle, Reuse, Finance, Governance Calculation: Green GDP = Net Domestic Product - (Cost of Depletion of Natural Resources + Cost of Degradation of Ecosystem)","h":"Impact Thinking Framework:"}],"id":"impact-thinking-framework:def-main","v":"b0e704","q":"What is the impact-thinking framework for any pollution answer, and how is green GDP calculated?"}]},{"id":"air","subj":"s03","name":"Air","cards":[{"path":["Relevance of Coal for India’s Energy Security"],"roles":["use"],"rows":[{"t":"Accounts for 55% of the country's energy need.","h":"Most abundant fossil fuel:"},{"t":"India’s electricity consumption is expected to triple by 2050 [International Energy Agency (IEA)]"},{"t":"India holds 107,727 million tons (MMst) of proven coal reserves as of 2016, ranking 5th in the world.","h":"Large indigenous availability:"},{"t":"Development of coal-producing region like Bihar; Creation of jobs; etc.","h":"Socio-economic relevance:"}],"id":"air:use-relevance-of-coal-for-india-s-energy-sec","v":"0af70c","q":"Why does coal still matter for India&#x27;s energy security?"},{"path":["Carbon Capture"],"roles":["def","use"],"rows":[{"t":"Pilot Carbon Capture Project at Vindhyachal commissioned by NTPC Ltd. with 20 Tonnes Per Day (TPD) capacity."},{"t":"<span class=\"lst\"><span class=\"li\">Budget 2026–27 ₹20,000 cr over 5 yrs<\/span><br><span class=\"li\">target 750 mtpa (NITI)<\/span><br><span class=\"li\">storage: enhanced oil recovery, coal-bed methane, saline aquifers, basalt<\/span><\/span>","h":"CCUS:"},{"t":"<span class=\"lst\"><span class=\"li\">hard-to-abate sectors (steel, cement, fertiliser)<\/span><br><span class=\"li\">blue hydrogen<\/span><br><span class=\"li\"><mark>net zero<\/mark> needs 11.4 Gt stored by 2070<\/span><\/span>","h":"Why:"}],"id":"air:def-carbon-capture","v":"928e6c","q":"What is India doing on carbon capture, and why do we need it?"},{"path":["Carbon Capture"],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">USD 100–150 bn cost<\/span><br><span class=\"li\">injection can trigger quakes<\/span><br><span class=\"li\">no law yet<\/span><br><span class=\"li\">little storage data<\/span><\/span>","h":"Challenges:"},{"t":"<span class=\"lst\"><span class=\"li\">national CCS rules<\/span><br><span class=\"li\">map storage basins<\/span><br><span class=\"li\">hub-and-cluster model<\/span><\/span>","h":"Way forward:"}],"id":"air:issue-carbon-capture","v":"5cc2e3","q":"What holds back carbon capture, and what should be done?"},{"path":["Air Pollution Statistics"],"roles":["cause","fact"],"rows":[{"t":"Why Indian air is so bad (factors: No rain in north except monsoon months, dust from that and Sahara, stubble burning, no master plan, unscientific waste disposal eg. Ghazipur landfill burning)"},{"t":"<span class=\"lst\"><span class=\"li\">India 6th most polluted country<\/span><br><span class=\"li\">66 of world's 100 worst cities<\/span><br><span class=\"li\">Loni (UP) worst city, Delhi worst capital<\/span><\/span>","h":"IQAir 2025:"},{"t":"<span class=\"lst\"><span class=\"li\">about 15% of Delhi deaths linked to air (2023)<\/span><br><span class=\"li\">about 9.5% of GDP lost (2022, Lancet 2025)<\/span><br><span class=\"li\">Surat emissions trading (2019) as best practice<\/span><\/span>","cont":1},{"t":"Bad air 2nd largest risk of death after BP (state of global air 2024); So2 and NO2 erode buildings (yellowing of Taj Mahal); <mark>urban heat island<\/mark> effect, acid rain"}],"id":"air:cause-air-pollution-statistics","v":"8b7c5e","q":"Why is India&#x27;s air so bad, how bad is it (IQAir 2025), and what does it cost?"},{"path":["Air Pollution Statistics"],"roles":["def"],"rows":[{"t":"coal/SO₂ + smoke + fog → grey haze, cold humid winters","h":"Classical smog:"},{"t":"NOx + VOCs (vehicles, industry) + strong sunlight → ground-level ozone → brown haze, warm sunny cities","h":"Photochemical smog:"},{"t":"Gothenburg Protocol (1999, under UNECE Convention on Long-Range Transboundary Air Pollution): emission ceilings for SO₂, NOx, VOCs and ammonia"}],"title":"SMOG TYPES AND GOTHENBURG PROTOCOL","id":"air:def-smog-types-and-gothenburg-protocol","v":"851f28","q":"Two types of smog and how each forms, and what the Gothenburg Protocol does?"},{"path":["Initiatives by India"],"roles":["gov"],"rows":[{"t":"Central government, states, and urban local bodies fund NCAP.","h":"Funds:"},{"t":"Reduce particulate pollution by 40% by 2026 (vs 2017) through city action plans and awareness and increased monitoring. It also promotes clean technologies, alternative fuels, and stronger enforcement of pollution laws.","h":"Functions:"},{"t":"CPCB leads monitoring; SPCBs and ULBs implement locally; MoEFCC oversees policy and funding.","h":"Functionaries:"},{"t":"Improve air quality in 131 non-attainment cities with multi-sector coordination.","h":"Goal:"},{"t":"focus too much on PM 10 and not PM 2.5, 1600 stations achieved from 25, use of funds is to settle dust by water sprinkling, root causes not addressed.","h":"Evaluation :"}],"title":"<mark>National Clean Air Programme<\/mark> (2019)","id":"air:gov-national-clean-air-programme-2019","v":"cc96e9","q":"NCAP: who funds it, its target, who runs it, its goal, and how it has done?"},{"path":["Initiatives by India"],"roles":["tbl"],"rows":[{"sec":"WHO AQG 2021 (first update since 2005, tighter for most pollutants):"},{"h":"PM2.5 annual (µg/m³)","t":"<span class=\"th\">2005<\/span> 10<br><span class=\"th\">2021<\/span> 5"},{"h":"PM2.5 24-hour","t":"<span class=\"th\">2005<\/span> 25<br><span class=\"th\">2021<\/span> 15"},{"h":"PM10 annual","t":"<span class=\"th\">2005<\/span> 20<br><span class=\"th\">2021<\/span> 15"},{"h":"PM10 24-hour","t":"<span class=\"th\">2005<\/span> 50<br><span class=\"th\">2021<\/span> 45"},{"h":"NO₂ annual","t":"<span class=\"th\">2005<\/span> 40<br><span class=\"th\">2021<\/span> 10"},{"t":"24-hour NO₂, peak-season ozone and 24-hour CO limits","h":"Also new:"},{"t":"PM2.5 annual 40 = 8x the new WHO level","h":"India's NAAQS (2009):"},{"t":"<span class=\"lst\"><span class=\"li\">target PM2.5 not just PM10<\/span><br><span class=\"li\">revise NAAQS<\/span><br><span class=\"li\">airshed / regional plans (not city by city)<\/span><\/span>","h":"NCAP changes needed:"},{"t":"<span class=\"lst\"><span class=\"li\">source apportionment in every city<\/span><br><span class=\"li\">health-based targets<\/span><br><span class=\"li\">more monitors in small towns and villages<\/span><\/span>","cont":1}],"table":1,"head":["Pollutant","2005","2021"],"id":"air:tbl-initiatives-by-india","v":"bc813a","q":"How did the WHO tighten air quality guidelines in 2021, and how far behind are India&#x27;s standards?"},{"path":["Initiatives by India"],"roles":["gov"],"rows":[{"t":"Safar portal (real time air pollution tracking)"},{"h":"Commission for Air Quality Management (CAQM)","t":"Graded Response Action Plan (GRAP)."},{"t":"Poor (201–300) → Very poor (301–400) → Severe (401–450) → Severe+ (450+)","h":"4 stages by AQI:"},{"t":"CAQM Act 2021 (replaced EPCA)"}],"id":"air:gov-initiatives-by-india","v":"fbf8e1","q":"What tools does India use for Delhi&#x27;s air: monitoring, CAQM, GRAP stages?"},{"path":["Initiatives by India"],"roles":["fact","cause"],"rows":[{"t":"costs the Indian economy approximately $36.8 billion (1.36% of GDP) annually"},{"t":"Over 3.3 crore registered vehicles spew NO2 and CO2"},{"t":"Unregulated dust contributes nearly 27% of PM2.5 levels","h":"Construction:"},{"t":"<span class=\"lst\"><span class=\"li\">secondary particles 27%<\/span><br><span class=\"li\">transport 23%<\/span><br><span class=\"li\">biomass burning 20%<\/span><br><span class=\"li\">dust 15%<\/span><br><span class=\"li\">industry 9% → about <mark>two-thirds of PM2.5 comes from outside Delhi<\/mark><\/span><\/span>","h":"Sources (CAQM):"},{"t":"<span class=\"lst\"><span class=\"li\">north-westerly winds bring dust<\/span><br><span class=\"li\">temperature inversion<\/span><br><span class=\"li\">low wind<\/span><br><span class=\"li\">stubble burning<\/span><\/span>","h":"Winter:"}],"title":"DELHI","id":"air:fact-delhi","v":"b26bc9","q":"Delhi&#x27;s air: what it costs, where the pollution comes from, and why winters are worst?"},{"path":["Initiatives by India"],"roles":["eg","fix"],"rows":[{"t":"china Beijing model, (cut its average from 144 to 92, 2015–2024)","h":"Global precedents :"},{"t":"<span class=\"lst\"><span class=\"li\">phase out old vehicles<\/span><br><span class=\"li\">EV/CNG transport<\/span><br><span class=\"li\">annual action plans for NCR states<\/span><br><span class=\"li\">cleaner industrial fuels<\/span><br><span class=\"li\">environmental compensation (polluter pays; SC, Lodhi Property case)<\/span><\/span>","h":"Fix:"}],"id":"air:eg-initiatives-by-india","v":"e4f996","q":"Which city cleaned its air and how, and what is the fix for Delhi?"},{"path":["SOLUTION TO AIR POLLUTION - ELECTRIC CARS/MOBILITY/TRANSPORT"],"roles":["how","gov"],"rows":[{"t":"1. vehicle-to-grid (V2G) technology, (use EV’s to send back energy to grid (earning income, better lasting batteries, useful for tackling demand highs)"},{"t":"2. PM E-DRIVE (2024, replaced FAME-II) gives subsidies for EVs and charging"},{"t":"<span class=\"lst\"><span class=\"li\">EV share 7.6% (2024) vs 30% by 2030 target (NITI)<\/span><br><span class=\"li\">India Electric Mobility Index (NITI + WRI): Delhi 1st (77), Maharashtra 2nd<\/span><\/span>"},{"t":"<span class=\"lst\"><span class=\"li\">PM E-DRIVE 2024<\/span><br><span class=\"li\">PM e-Bus Sewa (38,000+ buses)<\/span><br><span class=\"li\">GST on EVs 5%<\/span><\/span>","h":"Schemes:"}],"id":"air:how-solution-to-air-pollution-electric-cars","v":"fb79a4","q":"How are EVs being pushed in India: V2G, schemes, current share?"},{"path":["SOLUTION TO AIR POLLUTION - ELECTRIC CARS/MOBILITY/TRANSPORT"],"roles":["use","issue"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">about 3x less CO₂ even on today's grid<\/span><br><span class=\"li\">about 60% energy efficiency vs about 20% for petrol<\/span><br><span class=\"li\  plants located at coal pitheads.","<b>2025 Q7 (10 marks):<\/b> What is Carbon Capture, Utilization and Storage (CCUS)? What is the potential role of CCUS in tackling climate change?","<b>2023 Q15 (15 marks):<\/b> The adoption of electric vehicles is rapidly growing worldwide. How do electric vehicles contribute to reducing carbon emissions and what are the key benefits they offer compared to traditional combustion engine vehicles?"]},{"id":"water","subj":"s03","name":"Water","cards":[{"path":["Availability & Stress"],"roles":["fact"],"rows":[{"t":"18% pop but 4 % water reserves"},{"t":"<span class=\"lst\"><span class=\"li\">72% of India’s wastewater ends up in rivers and lakes (water reuse tech : membrane bioreactor (biological treatment and membrane filtration )<\/span><br><span class=\"li\">ultrafiltration<\/span><br><span class=\"li\">reverse osmosis<\/span><br><span class=\"li\">electrodialysis reversal<\/span><br><span class=\"li\">thermal evaporation)<\/span><\/span>"},{"t":"87% farms, 11% domestic","h":"Groundwater use:"},{"t":"Threat to 75 % of wheat and 65% of rice production (composite water management index Niti Aayog 2019)"},{"t":"Demand expected to double by 2030"},{"t":"Women and girls spend 200 million hours collecting water (UNICEF)"}],"id":"water:fact-availability-stress","v":"0f8ab5","q":"India&#x27;s water stress in numbers: share of water, wastewater, groundwater use, future demand?"},{"path":["Availability & Stress"],"roles":["fact","cause"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">over-exploited 10.8% (17.24% in 2017)<\/span><br><span class=\"li\">critical 2.97%<\/span><br><span class=\"li\">semi-critical 11.2%<\/span><\/span>","h":"CGWB 2025 (6,762 units):"},{"t":"<span class=\"lst\"><span class=\"li\">safe 73.2% (62.6% in 2017)<\/span><br><span class=\"li\">extraction 247.22 BCM<\/span><br><span class=\"li\">India = about 25% of world groundwater use, 87% for farms<\/span><\/span>","cont":1},{"t":"<span class=\"lst\"><span class=\"li\">cities seal recharge zones<\/span><br><span class=\"li\">1882 Easement Act ties water to land<\/span><br><span class=\"li\">climate (depletion may triple by 2080)<\/span><br><span class=\"li\">land subsidence in 5 megacities → steps: <mark>Atal Bhujal<\/mark><\/span><\/span>","h":"GW depletion causes:"},{"t":"<span class=\"lst\"><span class=\"li\">NAQUIM<\/span><br><span class=\"li\">Master Plan for Artificial Recharge 2020<\/span><br><span class=\"li\">IN-GRES → next: National Water Commission (<mark>Mihir Shah<\/mark>)<\/span><br><span class=\"li\">groundwater rights apart from land<\/span><\/span>","cont":1}],"title":"CGWB 2025 (6,762 units):","id":"water:fact-cgwb-2025-6-762-units","v":"11a080","q":"What does CGWB 2025 say about groundwater, why is it falling, and what is being done?"},{"path":["Availability & Stress"],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">28.3% of samples exceed a BIS limit<\/span><br><span class=\"li\">nitrate most widespread (Rajasthan, Tamil Nadu, Maharashtra)<\/span><br><span class=\"li\">fluoride (Rajasthan)<\/span><br><span class=\"li\">arsenic (Ganga–Brahmaputra plains)<\/span><\/span>","h":"GW pollution (CGWB 2025):"},{"t":"<span class=\"lst\"><span class=\"li\">uranium (Punjab, Haryana)<\/span><br><span class=\"li\">lead (Delhi) → blue-baby syndrome, fluorosis, cancers, kidney damage → fix: phytoremediation (arsenic)<\/span><br><span class=\"li\">Nalgonda technique (fluoride)<\/span><br><span class=\"li\">less nitrogen fertiliser<\/span><\/span>","cont":1},{"t":"<span class=\"lst\"><span class=\"li\">CC<\/span><br><span class=\"li\">AGRI<\/span><br><span class=\"li\">Unsustainbel use<\/span><br><span class=\"li\">indiscriminate festivals<\/span><\/span>","h":"Cause :"},{"t":"<span class=\"lst\"><span class=\"li\">20% households lack tap water connections<\/span><br><span class=\"li\">uranium pollution found in 12 states<\/span><br><span class=\"li\">low treatment capacity of sewage (18% only) bc high operational and capital costs<\/span><\/span>","cont":1},{"t":"<span class=\"lst\"><span class=\"li\">AI<\/span><br><span class=\"li\">GIS to site farm ponds and check dams<\/span><br><span class=\"li\">drones<\/span><br><span class=\"li\">IoT sensors<\/span><\/span>","h":"Water tech:"},{"t":"<span class=\"lst\"><span class=\"li\">drip/sprinkler<\/span><br><span class=\"li\">IN-GRES (CGWB)<\/span><br><span class=\"li\">GRACE satellite for groundwater<\/span><br><span class=\"li\"><mark>Ganga digital twin<\/mark> (NMCG)<\/span><\/span>","cont":1}],"title":"GW pollution (CGWB 2025):","id":"water:issue-gw-pollution-cgwb-2025","v":"1963e1","q":"What pollutes India&#x27;s groundwater, the deeper causes, and which tech can help?"},{"path":["Availability & Stress"],"roles":["def","cause","fix"],"rows":[{"t":"<mark>Water bankruptcy<\/mark> (UNU-INWEH report, world has entered it): long-term use > what nature refills → damage can't be undone"},{"t":"<span class=\"lst\"><span class=\"li\">\"current account\" = rivers, wetlands, reservoirs (refill yearly)<\/span><br><span class=\"li\">\"savings account\" = groundwater, glaciers, aquifers → both drained<\/span><\/span>","h":"Bank analogy:"},{"t":"Stress (reversible) → crisis (short shock: drought, flood) → bankruptcy (permanent)"},{"t":"<span class=\"lst\"><span class=\"li\">wetlands and floodplains converted<\/span><br><span class=\"li\">slow overuse ignored (~70% of major aquifers falling)<\/span><br><span class=\"li\">dams, cities and industry overbuilt<\/span><br><span class=\"li\">climate change<\/span><\/span>","h":"Why:"},{"t":"<span class=\"lst\"><span class=\"li\">18% of people, 4% of fresh water<\/span><br><span class=\"li\">per-capita availability → 1,140 m³ by 2050<\/span><br><span class=\"li\">70% of surface water polluted (NITI)<\/span><\/span>","h":"India:"},{"t":"<span class=\"lst\"><span class=\"li\">name bankruptcy in SDG 6 and Rio Conventions<\/span><br><span class=\"li\">satellite monitoring<\/span><br><span class=\"li\">basin-level diagnosis<\/span><br><span class=\"li\">water-thrifty farming and industry<\/span><\/span>","h":"Fix:"}],"id":"water:def-availability-stress","v":"d9ba30","q":"What is &quot;water bankruptcy&quot;, why has the world reached it, and the fix?"},{"path":["Availability & Stress"],"roles":["gov","issue","fix"],"rows":[{"t":"<mark>Urban water governance<\/mark> (Indore contaminated tap water crisis): water = State subject; inter-state rivers = Union (Art 262, ISRWD Act 1956, River Boards Act 1956)"},{"t":"<span class=\"lst\"><span class=\"li\">many agencies (Gurugram)<\/span><br><span class=\"li\">~38% of water lost as non-revenue water (leaks, theft)<\/span><br><span class=\"li\">Chennai 2019, Bengaluru 2024 crises<\/span><br><span class=\"li\">poor sewage treatment (Yamuna)<\/span><br><span class=\"li\">borewell and tanker dependence<\/span><\/span>","h":"Problems:"},{"t":"fluoride 1.5 mg/l, arsenic 0.05 mg/l, nitrate 45 mg/l","h":"BIS drinking-water limits (IS 10500):"},{"t":"Rajasthan's Mukhyamantri Jal Swavlamban Abhiyan (\"four waters\") → groundwater up ~4%","h":"Best practice:"},{"t":"<span class=\"lst\"><span class=\"li\">national urban wastewater reuse policy (100% treatment)<\/span><br><span class=\"li\">Integrated Urban Water Management<\/span><br><span class=\"li\">merge CWC and CGWB into a National Water Commission (Mihir Shah)<\/span><br><span class=\"li\">water budgeting<\/span><br><span class=\"li\">Jan Bhagidari<\/span><\/span>","h":"Way forward:"}],"id":"water:gov-availability-stress","v":"b78efb","q":"Why does urban water governance fail, and what works?"},{"path":["rivers"],"roles":["fact","cause","effect"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">CPCB 2025 = 296 polluted stretches on 271 rivers (Maharashtra most)<\/span><br><span class=\"li\">1+ toxic metal over limit at 112 of 434 CWC stations (2024)<\/span><\/span>","h":"RIVERS:"},{"t":"<span class=\"lst\"><span class=\"li\">untreated sewage (>60% enters rivers)<\/span><br><span class=\"li\">industry (sugar, paper, tanneries)<\/span><br><span class=\"li\">heavy metals (arsenic, chromium)<\/span><br><span class=\"li\">solid waste, farm runoff, microplastics<\/span><\/span>","h":"Sources:"},{"t":"<span class=\"lst\"><span class=\"li\">cholera, typhoid<\/span><br><span class=\"li\">eutrophication, dead zones<\/span><br><span class=\"li\">toxins in crops<\/span><br><span class=\"li\">~3% of GDP lost (World Bank)<\/span><\/span>","h":"Impact:"}],"id":"water:fact-rivers","v":"d3d78f","q":"How polluted are India&#x27;s rivers, from what, and with what impact?"},{"path":["rivers"],"roles":["gov","issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Art 21 clean-environment right (MC Mehta 1987)<\/span><br><span class=\"li\">Water Act 1974<\/span><br><span class=\"li\">EPA 1986<\/span><br><span class=\"li\">NGT<\/span><\/span>","h":"Law and schemes:"},{"t":"<span class=\"lst\"><span class=\"li\">Namami Gange<\/span><br><span class=\"li\">National River Conservation Plan<\/span><br><span class=\"li\">AMRUT<\/span><\/span>","cont":1},{"t":"<span class=\"lst\"><span class=\"li\">127 STPs working (Mar 2025)<\/span><br><span class=\"li\">CETPs for industry<\/span><br><span class=\"li\">but NGT (2022): untreated waste still in 60% of the Ganga<\/span><br><span class=\"li\">only 69% of funds used till 2024–25<\/span><\/span>","h":"Namami Gange (NMCG implements):"},{"t":"<span class=\"lst\"><span class=\"li\">Why earlier schemes faltered (Ganga Action Plan 1985, GAP-II, NGRBA): only sewage, not whole basin<\/span><br><span class=\"li\">states didn't run STPs after building them<\/span><br><span class=\"li\">no e-flow<\/span><br><span class=\"li\">weak industry checks<\/span><\/span>"},{"t":"<span class=\"lst\"><span class=\"li\">basin-level management with minimum e-flow (EU Water Framework Directive)<\/span><br><span class=\"li\">stronger, autonomous pollution boards<\/span><br><span class=\"li\">real-time AI tracking<\/span><\/span>","h":"Way forward:"}],"id":"water:gov-rivers","v":"df211c","q":"Laws and schemes for rivers, how Namami Gange is doing, why earlier plans failed, and what next?"},{"path":["rivers"],"roles":["issue","eg","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Industry dumps heavy metals (lead, mercury, chromium)<\/span><br><span class=\"li\">dyes, phenols<\/span><br><span class=\"li\">hot water<\/span><\/span>"},{"t":"<span class=\"lst\"><span class=\"li\">Kali river, UP (Muzaffarnagar–Meerut–Ghaziabad; sugar mills, distilleries, paper mills → black water, no aquatic life)<\/span><br><span class=\"li\">Noyyal and Bhavani, Tamil Nadu (Tiruppur dyeing units → farmland infertile, groundwater salty and toxic)<\/span><\/span>","h":"Cases:"},{"t":"<span class=\"lst\"><span class=\"li\">zero liquid discharge for textile units<\/span><br><span class=\"li\">CETPs<\/span><br><span class=\"li\">online effluent monitoring<\/span><\/span>","h":"Fix:"}],"title":"INDUSTRIAL RIVER POLLUTION","id":"water:issue-industrial-river-pollution","v":"b0b8c3","q":"What does industry dump into rivers, two examples, and the fix?"},{"path":["Schemes & Missions"],"roles":["gov"],"rows":[{"t":"National water mission (The National Water Mission (NWM) is funded by the Government of India through the Ministry of Jal Shakti, with additional support from state governments and external agencies when needed."},{"t":"Its key functions include promoting integrated water resource management, improving water use efficiency by 20%, encouraging rainwater harvesting and groundwater recharge, developing basin-level water plans, enhancing water data systems, raising public awareness, and addressing water scarcity and climate change impacts.","cont":1},{"t":"The Ministry of Jal Shakti leads policy and coordination, supported technically by the Central Water Commission. State Water Departments handle local implementation, while Basin Authorities manage river basins, with local bodies and communities actively participating in water conservation efforts.)","cont":1},{"t":"Jal Jeevan mission (The Jal Jeevan Mission (JJM) is funded by the Government of India with budget allocations from the Ministry of Jal Shakti, along with contributions from state governments and local bodies."},{"t":"Its main functions focus on providing potable tap water to every rural household by promoting sustainable water supply systems, enhancing water quality monitoring, encouraging community participation in water management, and ensuring operation and maintenance of water supply infrastructure.","cont":1},{"t":"The mission also emphasizes capacity building and awareness generation. The Ministry of Jal Shakti leads the policy direction and overall coordination, state governments are responsible for implementation and fund management, local bodies (like Panchayats) manage on-ground execution and community involvement, while technical agencies provide support for planning, monitoring, and capacity building.)","cont":1},{"t":"jal sanchay jan bhaghidari (community participation)"}],"id":"water:gov-schemes-missions","v":"6304b7","q":"What do the National Water Mission, Jal Jeevan Mission and Jal Sanchay do?","read":1},{"path":["Schemes & Missions"],"roles":["gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">PMKSY<\/span><br><span class=\"li\">mission Amrit Sarovar (The mission aims to construct and rejuvenate 75 water bodies in each district across the country, thereby fostering water conservation, ensuring sustainability, and reviving traditional community water bodies through public participation + As on March 2025, over 68,000 Sarovars have been completed, enhancing surface and groundwater availability across various regions. Under Mahatma Gandhi NREGS, over 46,000 Sarovars were constructed/rejuvenated)<\/span><\/span>"},{"t":"AMRUT 2.0 (Atal mission of rejuvenation and urban transformation) (Making cities “water secure” and providing functional water tap connections to all households, Funding: Outcome based funding to cities who will submit roadmap for outcomes to be achieved by them, will be done via establish circular economy of water + in 500 “AMRUT” cities."}],"id":"water:gov-schemes-missions-2","v":"6d84a6","q":"What do PMKSY, Amrit Sarovar and AMRUT 2.0 do?"},{"path":["Schemes & Missions"],"roles":["how","use","issue"],"rows":[{"t":"30 links = 14 Himalayan + 16 Peninsular","h":"National Perspective Plan 1980 (NWDA):"},{"t":"<span class=\"lst\"><span class=\"li\">moves water from surplus to deficit basins → drought and flood relief<\/span><br><span class=\"li\">more irrigation<\/span><br><span class=\"li\">hydropower<\/span><br><span class=\"li\">inland navigation<\/span><\/span>","h":"For:"},{"t":"<span class=\"lst\"><span class=\"li\">forests and wildlife drowned (Ken–Betwa: Panna Tiger Reserve; ~20,000 people affected)<\/span><br><span class=\"li\">less silt to deltas → delta sinking and seawater intrusion<\/span><br><span class=\"li\">costly, slow<\/span><br><span class=\"li\">states fight over water<\/span><\/span>","h":"Against:"},{"t":"Ken–Betwa = first link under NPP (MP + UP, Bundelkhand)"}],"title":"National Perspective Plan 1980 (NWDA):","id":"water:how-national-perspective-plan-1980-nwda","v":"1d6e26","q":"River interlinking: the plan, the case for it, the case against, and the first link?"},{"path":["Way Forward & Innovations"],"roles":["fix","eg"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">one water approach<\/span><br><span class=\"li\">same emissions trading apply to water<\/span><br><span class=\"li\">innovative agri practices<\/span><br><span class=\"li\">teleganas mission kakatiya (Launched in 2014, its primary goal was the restoration of 46,531 minor irrigation tanks to their original capacity. Core Strategy: De-silting tank beds, strengthening bunds, and repairing sluices/channels. It followed a decentralized approach, encouraging farmers to take the silt (rich in nutrients) to their fields. 2026 Evaluation: The program has been highly lauded in the Economic Survey 2026 for its synergy with the Kaleshwaram Project.)and Andhra Pradesh’s Neeru-chettu (Launched in 2015, this is a broader inter-departmental convergence mission (Water + Trees) aimed at making the state drought-proof. Core Strategy: Beyond just tank de-silting, it includes check dams, farm ponds, cascading tank systems, and massive afforestation (aiming for 33% green cover).<\/span><\/span>"},{"t":"While the program was a centerpiece of the 2014–2019 administration, it faced scrutiny and legal delays regarding pending payments and contractor bills.","h":"2026 Status:"},{"t":"As of February 2026, vigilance clearances have settled long-standing disputes, clearing hundreds of engineers of wrongdoing and allowing for the closure of old projects.","h":"Update:"},{"t":"Successfully repaired over 1.2 lakh structures and stabilized roughly 3.6 lakh acres. It is particularly noted for its success in the Rayalaseema region, where it helped mitigate extreme groundwater depletion.)","h":"Impact:"}],"id":"water:fix-way-forward-innovations","v":"ac94c3","q":"The way forward on water, and what Mission Kakatiya achieved?"},{"path":["Legislation"],"roles":["gov"],"rows":[{"t":"Water (Prevention and Control of Pollution) Act 1974 (amendment : Water (Prevention and Control of Pollution) (Manner of Holding Inquiry and Imposition of Penalty) rules, 2024. (The 2024 Amendment Act centralizes key powers like SPCB chairman nomination and industrial exemptions, introduces penalties for government departments’ violations, and empowers adjudicating officers to impose fines credited to the Environment Protection Fund"},{"t":"<span class=\"lst\"><span class=\"li\">drinking water and sanitation first<\/span><br><span class=\"li\">then water treated as an economic good<\/span><br><span class=\"li\">minimum ecological flow for rivers<\/span><br><span class=\"li\">basin-level planning<\/span><\/span>","h":"National Water Policy 2012 (earlier 1987, 2002):"},{"t":"<span class=\"lst\"><span class=\"li\">Water Regulatory Authority in each state<\/span><br><span class=\"li\">pricing to save water<\/span><br><span class=\"li\">national framework law<\/span><br><span class=\"li\">water-use efficiency<\/span><\/span>","cont":1},{"t":"<span class=\"lst\"><span class=\"li\">Draft NWP 2020 (Mihir Shah committee) still not adopted: shift from building dams to demand management<\/span><br><span class=\"li\">groundwater as common resource<\/span><\/span>"}],"id":"water:gov-legislation","v":"ee2a2c","q":"The Water Act, National Water Policy 2012, and what the 2020 draft wants to change?"}],"circle":"g","pyq":["<b>2025 Q13 (15 marks):<\/b> Examine the factors responsible for depleting groundwater in India. What are the steps taken by the government to mitigate such depletion of groundwater?","<b>2025 Q8 (10 marks):<\/b> Seawater intrusion in the coastal aquifers is a major concern in India. What are the causes of seawater intrusion and the remedial measures to combat this hazard?","<b>2024 Q7 (10 marks):<\/b> Industrial pollution of river water is a significant environmental issue in India. Discuss the various mitigation measures to deal with this problem and also the government’s initiative in this regard.","<b>2017 Q8 (10 marks):<\/b> Not many years ago, river linking was a concept but it is becoming reality in the country. Discuss the advantages of river linking and its possible impact on the environment.","<b>2015 Q15 (12.5 marks):<\/b> Discuss the Namami Gange and National Mission for Clean Ganga (NMCG) programmes and causes of mixed results from the previous schemes. What quantum leaps can help preserve the river Ganga better than incremental inputs?","<b>2013 Q20 (10 marks):<\/b> Enumerate the National Water Policy of India. Taking river Ganges as an example, discuss the strategies which may be adopted for river water pollution control and management. What are the legal provisions of management and handling of hazardous wastes in India?"]},{"id":"land-degradation","subj":"s03","name":"Land Degradation","cards":[{"path":[],"roles":["def","eg"],"rows":[{"t":"fall in land's biological or economic productivity (UNCCD); in drylands = <mark>desertification<\/mark> → India's figures in toggle 3","h":"<b>Definition & India's status<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Ralegan Siddhi, Maharashtra (worked: village watershed work revived groundwater and farms)<\/span><br><span class=\"li\">Punjab–Haryana canal areas (failed: over-irrigation → waterlogging and salinity)<\/span><\/span>","h":"<b>Examples<\/b>:"}],"id":"land-degradation:def-main","v":"c62bfc","q":"What is land degradation, with one success and one failure?"},{"path":["Significance: 1. Global Context & Impact"],"roles":["use"],"rows":[{"t":"Soils are the 2nd largest carbon pool (2,500 Gt) after oceans; essential for climate regulation.","h":"Carbon Sink:"},{"t":"~40% of global land is degraded (UNCCD 2024/25).","h":"Current Status:"},{"t":"95% of land could be degraded by 2050 if current trends continue (Global Environment Facility/UNESCO 2026).","h":"Projection:"},{"t":"Directly affects 3.2 billion people; drives migration and food insecurity.","h":"Human Impact:"}],"id":"land-degradation:use-significance-1-global-context-impact","v":"2c7099","q":"Why does land degradation matter globally? Four facts."},{"path":["Pillars / key features: 2. International Frameworks"],"roles":["def"],"rows":[{"t":"Launched the Riyadh Global Drought Resilience Partnership ($12B+ fund); focus on \"land tenure\" rights for local communities.","h":"UNCCD COP16 (Riyadh, 2024):"},{"t":"Global goal to restore 350 million hectares of degraded landscapes by 2030.","h":"<mark>Bonn Challenge<\/mark>:"},{"t":"Aiming to prevent, halt, and reverse the degradation of ecosystems worldwide.","h":"UN Decade on Ecosystem Restoration (2021–2030):"}],"id":"land-degradation:def-pillars-key-features-2-international-fra","v":"60feea","q":"Three international frameworks against land degradation?"},{"path":["India's response + challenges (causes): 3. India’s Commitments & Status"],"roles":["gov"],"rows":[{"t":"Restore 26 million hectares of degraded land by 2030 (Target 15.3 of SDGs).","h":"<mark>LDN Target<\/mark>:"},{"t":"India has restored approx. 9.8 million hectares since 2011 (as per MoEFCC/IUCN reports).","h":"Progress:"},{"t":"According to SOE Report 2026, India has breached the \"Land System Change\" and \"Biosphere Integrity\" boundaries.","h":"Planetary Boundaries:"},{"t":"NAPCC, Desertification & Land Degradation Atlas (by ISRO), Soil Health Card, PM-KSY (Per Drop More Crop), and Green Credit Program.","h":"Schemes:"}],"id":"land-degradation:gov-india-s-response-challenges-causes-3-ind","v":"10ca11","q":"India&#x27;s land restoration target, progress, status and schemes?"},{"path":["India's response + challenges (causes): 3. India’s Commitments & Status"],"roles":["cause","effect","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">~97.85 Mha (~29.7% of land) degraded (ISRO Desertification & Land Degradation Atlas, 2018–19 data)<\/span><br><span class=\"li\">Rajasthan, Maharashtra, Gujarat, Jharkhand worst<\/span><\/span>","h":"India:"},{"t":"<span class=\"lst\"><span class=\"li\">water erosion (biggest)<\/span><br><span class=\"li\">vegetation loss (deforestation, overgrazing)<\/span><br><span class=\"li\">wind erosion (Thar)<\/span><\/span>","h":"Causes:"},{"t":"<span class=\"lst\"><span class=\"li\">salinity and waterlogging from over-irrigation (Punjab, Haryana canals)<\/span><br><span class=\"li\">mining<\/span><br><span class=\"li\">shifting cultivation<\/span><\/span>","cont":1},{"t":"<span class=\"lst\"><span class=\"li\">lower yields<\/span><br><span class=\"li\">dust storms<\/span><br><span class=\"li\">silted reservoirs<\/span><br><span class=\"li\">rural distress and migration<\/span><\/span>","h":"Effects:"},{"t":"<span class=\"lst\"><span class=\"li\">watershed development (PMKSY-WDC)<\/span><br><span class=\"li\">afforestation (Green India Mission, <mark>Aravalli Green Wall<\/mark>)<\/span><br><span class=\"li\">Soil Health Card and less fertiliser<\/span><\/span>","h":"Remedies:"},{"t":"<span class=\"lst\"><span class=\"li\">agroforestry<\/span><br><span class=\"li\">grazing control<\/span><br><span class=\"li\">LDN target of 26 Mha by 2030<\/span><\/span>","cont":1}],"id":"land-degradation:cause-india-s-response-challenges-causes-3-ind","v":"f001b2","q":"How much of India is degraded, why, with what effects, and the remedies?"},{"path":["Way forward: 4. The \"Way Forward\" & Local Wisdom"],"roles":["fix"],"rows":[{"t":"Shifting from just \"planting trees\" to restoring the ecological functionality of the entire landscape.","h":"Forest Landscape Restoration (FLR):"},{"sec":"Local Techniques:"},{"t":"Sustainable \"slash-and-burn\" (swidden) agriculture that uses polyculture (maize, beans, squash).","h":"Milpa (Mayan):"},{"t":"Small pits to catch rain and concentrate nutrients.","h":"Zai Pits (Burkina Faso):"},{"t":"Addressing Lantana camara, which now occupies nearly 50% of India's forest/scrublands (SOE 2026).","h":"Invasive Species Management:"}],"id":"land-degradation:fix-way-forward-4-the-way-forward-local-wisd","v":"45d6ac","q":"Way forward on land: landscape restoration, local techniques, invasive species?"}],"circle":"y"},{"id":"plastic-pollution","subj":"s03","name":"Plastic Pollution","cards":[{"path":[],"roles":["def"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">4.12 million tonnes (CPCB’s Annual report)<\/span><br><span class=\"li\">world: >460 MMT made a year, ~20 MMT leaks into nature (WEF)<\/span><\/span>","h":"<b>Definition & India's status<\/b>:"},{"t":"Per capita plastic waste generation doubled over last 5 years"},{"t":"3rd globally in single use plastic"}],"id":"plastic-pollution:def-main","v":"42ba54","q":"How much plastic waste does India produce, and how is it trending?"},{"path":[],"roles":["tbl"],"rows":[{"sec":"<b>Pillars / key features<\/b>: Types of plastic :"},{"sec":"TABLE"},{"img":5},{"sec":"How to learn this table","tg":1},{"t":"Link the acronym directly to its most common use and a visual image:"},{"t":"Imagine a pet dog drinking from a plastic water bottle. It's everywhere, so it's Highly recyclable.","h":"PET:"},{"t":"You probably already know of PVC pipes from plumbing. Pipes are industrial, which can help you remember they often contain toxins and have Low recyclability.","h":"PVC:"},{"t":"Notice the double \"P\". Associate it with Tupperware. Tupperware goes in the microwave, which helps you remember it is heat resistant.","h":"PP (Polypropylene):"},{"t":"The word itself sounds exactly like Styrofoam. Styrofoam snaps and crumbles easily, helping you remember it is fragile, bulky, and has Very Low recyclability.","h":"PS (Polystyrene):"}],"id":"plastic-pollution:tbl-main","v":"be76a8","q":"The main types of plastic, and how to remember each?"},{"path":[],"roles":["eg","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Sikkim (worked: banned plastic bags in 1998 + bottled water curbs in Lachen)<\/span><br><span class=\"li\"><mark>single-use plastic ban<\/mark>, Jul 2022 (failed: weak enforcement, thin bags back in markets, few cheap alternatives)<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">see Measures below<\/span><br><span class=\"li\"><mark>PWM (Amendment) Rules 2026<\/mark>: producers, importers, brand owners must use more recycled plastic (packaging to IS 14534:2023)<\/span><br><span class=\"li\">Mandatory Jute Packaging Act 2010<\/span><br><span class=\"li\">National Dashboard on SUP<\/span><\/span>","h":"<b>India's response<\/b>:"}],"id":"plastic-pollution:eg-main","v":"ea479e","q":"One plastic-ban success, one failure, and India&#x27;s response?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">weak enforcement of the SUP ban<\/span><br><span class=\"li\">informal recycling<\/span><br><span class=\"li\">global plastics treaty talks stalled (INC adjourned without consensus)<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">bio-based/compostable only 1.5% of plastic<\/span><br><span class=\"li\">tariffs on plastics cut to 7.2%, alternatives (bamboo) still ~14.4%<\/span><br><span class=\"li\">microplastics harm health<\/span><\/span>","cont":1},{"t":"<span class=\"lst\"><span class=\"li\">strict <mark>EPR<\/mark> audits<\/span><br><span class=\"li\">cheap alternatives (REPLAN, compostables)<\/span><br><span class=\"li\">a global treaty that covers the whole life cycle<\/span><\/span>","h":"<b>Way forward<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">sector-based reforms<\/span><br><span class=\"li\">plastic data systems<\/span><br><span class=\"li\">synergy with BRS Conventions<\/span><\/span>","cont":1}],"id":"plastic-pollution:issue-main","v":"e38619","q":"Why is plastic pollution hard to beat, and the way forward?"},{"path":["India's response – Measures :"],"roles":["gov"],"rows":[{"t":"1. India has enforced the <mark>Plastic Waste Management<\/mark> Amendment Rules, 2021, banning certain single-use plastics from July 2022, and introduced the <mark>Extended Producer Responsibility<\/mark> (EPR) on Plastic Packaging, 2022, which holds producers, importers, and brand owners accountable for the entire lifecycle of plastic products."},{"t":"2. Further, the Plastic Waste Management (Amendment) Rules, 2024 assign Panchayats the responsibility to assess local plastic waste, while initiatives like Project REPLAN by KVIC focus on reducing plastic pollution,"},{"t":"3. private sector efforts include the India Plastics Pact (IPP) and Un-Plastic Collective (UPC) to promote sustainable plastic use."},{"t":"4. Plastic Parks have become a key part of India’s strategy to manage plastic waste, promote recycling, and support the chemical industry. Under the New Scheme of Petrochemicals, the government of India offers grant funding of up to 50% of the project cost, with a maximum limit of Rs. 40 crore per project. So far, 10 Plastic Parks have been approved across various states."}],"id":"plastic-pollution:gov-india-s-response-measures","v":"a677e6","q":"India&#x27;s four main plastic measures?","read":1}],"circle":"y"},{"id":"oil-spills","subj":"s03","name":"Oil Spills","cards":[{"path":[],"roles":["eg","gov","fix"],"rows":[{"t":"Philippine tanker near Manila, oil spill near Kerch strait, Mauritius Oil Spill (2020) involving the MV Wakashio","h":"Examples:"},{"t":"<span class=\"lst\"><span class=\"li\">Merchant shipping act 1958<\/span><br><span class=\"li\">world = MARPOL (international convention on prevention of pollution from ships) and UNCLOS<\/span><\/span>","h":"National initiatives:"},{"t":"<span class=\"lst\"><span class=\"li\"><mark>Bioremediation<\/mark> (eg oil zapper and oilivorous - S developed by TERI)<\/span><br><span class=\"li\">sorbents (eg. Milkweed plant’s fibre)<\/span><br><span class=\"li\">standard safe SOP<\/span><br><span class=\"li\">use of booms and skimmers<\/span><\/span>","h":"Way forward unique :"}],"id":"oil-spills:eg-main","v":"251256","q":"Three oil spill examples, the laws that apply, and unique fixes?"},{"path":[],"roles":["def","eg","issue"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">shipwrecks, fires, collisions, oil spills<\/span><br><span class=\"li\">new risks (hazardous chemicals, nuclear waste)<\/span><\/span>","h":"Maritime disasters:"},{"t":"<span class=\"lst\"><span class=\"li\">MSC ELSA 3 sank off Kochi<\/span><br><span class=\"li\">fire on MV Wan Hai 503 (Kerala coast), 2025<\/span><\/span>","h":"Recent:"},{"t":"<span class=\"lst\"><span class=\"li\">cargo not declared honestly<\/span><br><span class=\"li\">hazardous goods mishandled<\/span><br><span class=\"li\">tangled ownership (Liberian flag, German owner, Cyprus manager)<\/span><br><span class=\"li\">insurance disputes<\/span><\/span>","h":"Problems:"}],"title":"<b>Maritime disasters<\/b>","id":"oil-spills:def-maritime-disasters","v":"35cbfb","q":"What counts as a maritime disaster, recent cases off Kerala, and the problems behind them?"},{"path":[],"roles":["gov","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">IMO conventions (SOLAS 1974, IMDG Code, Ballast Water, Hong Kong ship recycling)<\/span><br><span class=\"li\">Merchant Shipping Act 1958<\/span><br><span class=\"li\">EPA 1986<\/span><br><span class=\"li\">National Oil Spill Disaster Contingency Plan (Coast Guard)<\/span><br><span class=\"li\">Admiralty Act 2017<\/span><\/span>","h":"Rules:"},{"t":"<span class=\"lst\"><span class=\"li\">enforce SOLAS<\/span><br><span class=\"li\">electronic cargo tracking<\/span><br><span class=\"li\">satellite detection (RISAT)<\/span><br><span class=\"li\"><mark>polluter pays<\/mark><\/span><\/span>","h":"Way forward:"}],"id":"oil-spills:gov-main","v":"67293f","q":"Which rules govern ship safety and spills, and the way forward?"}],"circle":"g","pyq":["<b>2023 Q8 (10 marks):<\/b> What is oil pollution? What are its impacts on the marine ecosystem? In what way is oil pollution particularly harmful for a country like India?"]},{"id":"solid-waste","subj":"s03","name":"Solid Waste","cards":[{"path":[],"roles":["fact","cause"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Annual waste generation 62 million tons<\/span><br><span class=\"li\">43 million tones collection<\/span><br><span class=\"li\">12 million tons treated (TERI)<\/span><\/span>"},{"t":"<span class=\"lst\"><span class=\"li\">165 Mt by 2030, 436 Mt by 2050<\/span><br><span class=\"li\">only 15–20% processed<\/span><\/span>","h":"Scale:"},{"t":"<span class=\"lst\"><span class=\"li\">inadequate segregation at source<\/span><br><span class=\"li\">under dev storage infra<\/span><br><span class=\"li\">low door to door collection<\/span><br><span class=\"li\">low municipal finance (low creditworthiness)<\/span><br><span class=\"li\">overlapping jurisdiction<\/span><\/span>","h":"Causes :"}],"id":"solid-waste:fact-main","v":"407377","q":"How much solid waste India makes and treats, where it&#x27;s heading, and why management fails?"},{"path":[],"roles":["gov"],"rows":[{"t":"<mark>SWM Rules 2026<\/mark> replaced the 2016 Rules (3-way → 4-stream segregation)","h":"Initiatives :"},{"t":"<span class=\"lst\"><span class=\"li\">4-stream segregation<\/span><br><span class=\"li\">bulk generators process wet waste or buy an EBWGR certificate<\/span><br><span class=\"li\">refuse-derived fuel to cement plants<\/span><\/span>","h":"SWM Rules 2026 (from 1 Apr 2026):"},{"t":"<span class=\"lst\"><span class=\"li\">yearly landfill audits<\/span><br><span class=\"li\">tourist user fee in hills and islands<\/span><br><span class=\"li\">polluter-pays compensation<\/span><\/span>","cont":1},{"t":"<span class=\"lst\"><span class=\"li\">C&D Waste Rules 2025<\/span><br><span class=\"li\">Contaminated Sites Rules 2025 (189 substances)<\/span><br><span class=\"li\">DRAP for about 8.8 cr t legacy waste<\/span><br><span class=\"li\">models: Indore, Anupam Colony (Delhi), SWaCH (Pune)<\/span><\/span>","h":"Also:"},{"t":"<span class=\"lst\"><span class=\"li\">SBA Urban 2.0<\/span><br><span class=\"li\">garbage free star rating protocol to access it<\/span><\/span>","h":"Schemes :"}],"id":"solid-waste:gov-main","v":"9ed18e","q":"What changed with the SWM Rules 2026, and other waste rules and schemes?"},{"path":[],"roles":["eg"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Mumbai and <mark>Bhopal<\/mark> used at scale waste processors and Bhopal use GPS for Door to door collection<\/span><br><span class=\"li\">CSIR-CMERI made advanced facility with advanced sequestration facilities<\/span><br><span class=\"li\">Bengaluru MC recommended cess on waste<\/span><\/span>"},{"t":"Indore best example"}],"id":"solid-waste:eg-main","v":"243734","q":"Which cities manage waste well, and how?"}],"circle":"g","pyq":["<b>2018 Q6 (10 marks):<\/b> What are the impediments in disposing the huge quantities of discarded solid wastes which are continuously being generated? How do we remove safely the toxic wastes that have been accumulating in our habitable environment?"]},{"id":"e-waste","subj":"s03","name":"E-Waste","cards":[{"path":[],"roles":["fact","issue"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">3rd largest after usa and china<\/span><br><span class=\"li\">2.76 MMT (2020) → 6.19 MMT (2024) → 14 MMT by 2030<\/span><br><span class=\"li\"><mark>formal recycling<\/mark> only 10% (world ~22%, USA 56%)<\/span><br><span class=\"li\">₹51,000 cr of materials lost (Paryavaran NITI Manthan)<\/span><\/span>"},{"t":"<span class=\"lst\"><span class=\"li\">precious metals are present in e waste (bio leaching: Bio-leaching is an advanced, eco-friendly form of <mark>bioremediation<\/mark> (specifically, biomining). It is the process of using specific, naturally occurring microorganisms (bacteria or fungi) to extract valuable metals from solid waste.)<\/span><br><span class=\"li\">very toxic (Lead (Pb), Mercury (Hg), and Cadmium will leach into groundwater + non biodegradable<\/span><\/span>","h":"Challenges Necessitating Action :"},{"t":"85 % is produced by unorganised sector"},{"t":"80% e waste by developed countries is set to developing counties"}],"id":"e-waste:fact-main","v":"95d1ca","q":"India&#x27;s e-waste in numbers, and why e-waste is a special problem?"},{"path":[],"roles":["gov"],"rows":[{"t":"E waste (management and handling) rules, 2011 (introduced concept of extended producer responsibility (producer cleans what he produces)"},{"t":"Introduced the concept of <mark>Producer Responsibility Organization<\/mark> (A Producer Responsibility Organisation (PRO) is a professional entity hired by companies (producers, brand owners, and importers) to help them meet their legal obligations under <mark>Extended Producer Responsibility<\/mark> (EPR).)","h":"E-Waste (Management) Rules, 2016:"},{"t":"E waste management rules (2022) (It introduced a centralized digital portal by the Central Pollution Control Board (CPCB) and created a market for EPR Certificates. Producers must now buy these certificates from registered recyclers to prove they have met their targets, completely digitizing and formalizing the sector. It also expanded the list of regulated items from 21 to 106.)"},{"t":"<span class=\"lst\"><span class=\"li\">Battery Waste Management Rules 2022<\/span><br><span class=\"li\">National Critical Mineral Mission (recycling Li-ion batteries, e-waste)<\/span><\/span>"}],"title":"India legislations and rules :","id":"e-waste:gov-india-legislations-and-rules","v":"441d32","q":"How have India&#x27;s e-waste rules evolved from 2011 to 2022?","read":1},{"path":[],"roles":["gov"],"rows":[{"t":"Controls the transboundary movement of hazardous wastes. It prevents developed nations from dumping their toxic waste (like old electronics) into developing nations. Includes e-waste","h":"Basel Convention (1989):"},{"t":"Aims to eliminate Persistent Organic Pollutants (POPs)—the \"Dirty Dozen\" chemicals (like DDT) that bioaccumulate in the food chain and take decades to break down","h":"Stockholm Convention (2001):"}],"id":"e-waste:gov-main","v":"e38360","q":"What do the Basel and Stockholm Conventions do?"},{"path":[],"roles":["issue","fix","eg"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">fake recyclers distort the EPR market<\/span><br><span class=\"li\">EPR covers only gold, copper, iron, aluminium<\/span><br><span class=\"li\">low skills and awareness<\/span><\/span>","h":"Issues:"},{"t":"<span class=\"lst\"><span class=\"li\">GST-linked verification<\/span><br><span class=\"li\">EPR for more metals and critical minerals<\/span><br><span class=\"li\">hydrometallurgy, AI-based recovery<\/span><br><span class=\"li\">train and certify informal workers<\/span><\/span>","h":"Way forward:"},{"t":"<span class=\"lst\"><span class=\"li\">Moradabad, UP (failed: brass city turned <mark>informal e-waste<\/mark> hub → circuit boards stripped with acid on the Ramganga banks → CSE 2015: river mercury 8x the Indian standard)<\/span><br><span class=\"li\">Kerala, Jul 2025 (worked: Haritha Karma Sena buys e-waste door to door at fixed rates → Clean Kerala Company → scientific disposal)<\/span><\/span>","h":"<b>Examples<\/b>:"}],"id":"e-waste:issue-main","v":"5a4c49","q":"What goes wrong in e-waste recycling, the fix, and two examples?"}],"circle":"g","pyq":["<b>2018 Q6 (10 marks):<\/b> What are the impediments in disposing the huge quantities of discarded solid wastes which are continuously being generated? How do we remove safely the toxic wastes that have been accumulating in our habitable environment?","<b>2013 Q20 (10 marks):<\/b> Enumerate the National Water Policy of India. Taking river Ganges as an example, discuss the strategies which may be adopted for river water pollution control and management. What are the legal provisions of management and handling of hazardous wastes in India?"]},{"id":"hazardous-and-biomedical-waste","subj":"s03","name":"HAZARDOUS and BIOMEDICAL WASTE","cards":[{"path":[],"roles":["def","gov","issue"],"rows":[{"t":"toxic, flammable, reactive or corrosive","h":"Hazardous waste:"},{"t":"<span class=\"lst\"><span class=\"li\">Hazardous and Other Wastes (Management & Transboundary Movement) Rules 2016 (under EPA) → SPCB authorisation for generators<\/span><br><span class=\"li\">categories with SOPs<\/span><br><span class=\"li\">duties for TSDF operators<\/span><\/span>","h":"Rule:"},{"t":"<span class=\"lst\"><span class=\"li\">few Treatment, Storage and Disposal Facilities (TSDFs)<\/span><br><span class=\"li\">people oppose new ones<\/span><br><span class=\"li\">informal recyclers without safety gear<\/span><br><span class=\"li\">illegal imports<\/span><\/span>","h":"Problems:"}],"title":"Hazardous waste:","id":"hazardous-and-biomedical-waste:def-hazardous-waste","v":"184677","q":"What is  that bioaccumulates in food chains.","h":"<b>Definition & India's status<\/b>:"},{"t":"<mark>Minamata Convention<\/mark> on Mercury (2013): treaty to curb mercury supply, reduce emissions, control products/processes, and support ASGM alternatives & remediation. Minamata Convention on Mercury","h":"<b>Pillars / key features<\/b>:"}],"id":"mercury-emissions:def-main","v":"c55a63","q":"What forms does mercury take, and what does the Minamata Convention do?"},{"path":[],"roles":["use","cause"],"rows":[{"t":"Why it matters (toxicity & persistence) : Neurotoxic, especially harmful to foetuses and young children (developmental delays, cognitive deficits), Bioaccumulates & biomagnifies in aquatic food webs → top predators and fish become human exposure pathways, Persists in environment; deposited far from sources (long-range atmospheric transport).","h":"<b>Significance<\/b>:"},{"sec":"Main sources"},{"t":"volcanic emissions, weathering of rocks, geothermal activity.","h":"Natural:"},{"t":"artisanal & small-scale gold mining (ASGM), coal-fired power plants (coal combustion), cement production, metal smelting/refining, waste incineration, some chemical factories and chlor-alkali operations (legacy plants), and improper disposal of mercury-containing products (thermometers, lamps, batteries).","h":"Anthropogenic (major):"}],"id":"mercury-emissions:use-main","v":"f8c6ef","q":"Why is mercury so harmful, and where does it come from?"},{"path":[],"roles":["eg","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Minamata disease (industrial methylmercury poisoning) → <mark>Minamata<\/mark>, Japan (1956: methylmercury from the Chisso factory → Minamata disease)<\/span><br><span class=\"li\">Kodaikanal, Tamil Nadu (2001, failed: HUL thermometer factory dumped mercury waste → workers sick, clean-up disputed for years)<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">ratified Minamata Convention (2018)<\/span><br><span class=\"li\">mercury limit for coal power plants (2015 norms)<\/span><br><span class=\"li\">mercury thermometers phased out of hospitals<\/span><\/span>","h":"<b>India's response<\/b>:"}],"id":"mercury-emissions:eg-main","v":"b49861","q":"Two mercury poisoning cases, and India&#x27;s response?"},{"path":[],"roles":["issue","fix"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">coal plants slow on pollution controls (FGD; Category C ~78% exempted, Jul 2025)<\/span><br><span class=\"li\">old contaminated sites (Kodaikanal)<\/span><\/span>","h":"<b>Challenges<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">emission controls and <mark>mercury monitoring<\/mark> at coal plants<\/span><br><span class=\"li\">clean up legacy sites<\/span><br><span class=\"li\">mercury-free products<\/span><\/span>","h":"<b>Way forward<\/b>:"}],"id":"mercury-emissions:issue-main","v":"4980c1","q":"What keeps mercury emissions high in India, and the fix?"}],"circle":"y","pyq":["<b>2014 Q15 (12.5 marks):<\/b> Environmental Impact Assessment studies are increasingly undertaken before a project is cleared by the Government. Discuss the environmental impacts of coal-fired thermal plants located at coal pitheads."]},{"id":"waste-to-wealth","subj":"s03","name":"Waste to Wealth","cards":[{"path":[],"roles":["how","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Can use anaerobic fermentation to produce biogas (methane and Co2)<\/span><br><span class=\"li\">incineration, gasification, pyrolysis for production of heat and light +<\/span><\/span>"},{"t":"Plastic schemes up above and 500 new Gobardhan (waste to wealth plants)"}],"id":"waste-to-wealth:how-main","v":"42caf2","q":"How can waste become energy or wealth?"}],"circle":"w"},{"id":"circular-economy","subj":"s03","name":"Circular Economy","cards":[{"path":[],"roles":["def","use"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Current 7.2 % of global economy is circular with declining trend (down from 9.1% in 2018)(circularity gap report 2023)<\/span><br><span class=\"li\">India: ~₹4,000 cr earned from scrap in Swachhata drives<\/span><br><span class=\"li\">could be a $2 tn market with 1 crore jobs by 2050<\/span><\/span>","h":"<b>Definition & India's status<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Need :, Resource circularity could save 11% of GDP and 30% by 2050 (eco survey 24-25)<\/span><br><span class=\"li\">from 1970 to 2015 20x increase in annual material consumption<\/span><br><span class=\"li\">resource dependency on imports<\/span><\/span>","h":"<b>Significance<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">less kharcha more incomes<\/span><br><span class=\"li\">reduced resource dependence<\/span><br><span class=\"li\">promotes green and clean production<\/span><\/span>","h":"Impact :"},{"t":"<span class=\"lst\"><span class=\"li\">ensures reusability<\/span><br><span class=\"li\">carbon neutral production<\/span><br><span class=\"li\">calls for resource efficiency<\/span><\/span>","cont":1}],"id":"circular-economy:def-main","v":"29992e","q":"How circular is the world economy, why does India need it, and what does it bring?"},{"path":[],"roles":["eg","gov"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Indore (worked: 6-way segregation + Asia's largest Bio-CNG plant on wet waste, 2022 → <mark>waste to wealth<\/mark>)<\/span><br><span class=\"li\">Alang, Gujarat (mixed: recycles ships at scale but worker safety and beach pollution; Hong Kong Convention in force 2025)<\/span><\/span>","h":"<b>Examples<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Initiatives : mission Life<\/span><br><span class=\"li\">SBA<\/span><br><span class=\"li\">National resource efficiency policy<\/span><br><span class=\"li\">EPR rules (e-waste, battery, 2022)<\/span><\/span>","h":"<b>India's response<\/b>:"},{"t":"<span class=\"lst\"><span class=\"li\">Steel Scrap Recycling Policy<\/span><br><span class=\"li\">NITI Circular Economy Cell<\/span><br><span class=\"li\"><mark>Jaipur Declarat
