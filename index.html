idered <b>somatic<\/b> therapy."}],"v":"7405de"}]},{"id":"health-and-tech","subj":"s05","name":"HEALTH AND TECH","cards":[{"id":"health-and-tech:main","path":[],"rows":[{"sec":"Traditional Medicine Landscape"},{"t":"<span class=\"lst\"><span class=\"li\">About 80% people use some form of traditional medicine<\/span><br><span class=\"li\">40% of Pharma products have natural basis ( eg. aspirin)<\/span><br><span class=\"li\"><u>Affordability is more of Trad<\/u> methods<\/span><\/span>"},{"sec":"Policy Support & Challenges"},{"h":"Intiatives to promote trad medicine :","t":"traditional knowledge digital library + National Ayush mission + Ayush mark certification + WHO global centre for trad medicine (in Jamnagar)"},{"h":"Challenges:","t":"But trad medicine no sci backing, limited collaboration between trad and allopathic medicine + category of herbal medicines vary in different mechanisms + biopiracy (patent without due recognition) so we have to"},{"t":"Second WHO Global Summit on Traditional Medicine held in New Delhi, India"}],"v":"21fefb"}]},{"id":"stem-cells","subj":"s05","name":"STEM CELLS","cards":[{"id":"stem-cells:main#1","path":[],"part":[1,4],"rows":[{"t":"Stem cells are the body’s “master cells.” They are special, unspecialized cells that have a unique ability to develop into many different types of specialized cells in the body."},{"t":"Think of them as “blank” cells that haven’t decided what they want to be when they grow up. They are a fundamental part of our bodies, acting as an internal repair system."},{"sec":"A stem cell has two unique properties:"},{"h":"Self-Renewal:","t":"It can divide and make endless copies of itself, creating more stem cells."},{"h":"Differentiation:","t":"It can be “activated” and change (differentiate) into a specialized cell with a specific job, such as a muscle cell, a red blood cell, a brain cell, or a skin cell."},{"sec":"What Are the Main Types of Stem Cells?"},{"t":"There are two main types, which are different based on their origin and their abilities."},{"h":"Embryonic Stem Cells :","t":"<br>Origin: These cells come from embryos that are 3 to 5 days old. Power: They are pluripotent (pluri = many). This is their most important feature. It means they can turn into any type of cell in the entire body. Use: This incredible flexibility makes them extremely valuable for research into how to grow new, healthy tissues to repair or replace damaged ones"},{"h":"Adult Stem Cells :","t":"Origin: These cells are found in small numbers in most adult tissues, such as your bone marrow, fat, and skin. Power: They are multipotent (multi = several). This means they are more limited. They can only turn into a few types of cells, usually those found in the tissue they come from. Example: An adult stem cell from your bone marrow can become any type of blood cell (red, white, or platelet), but it cannot become a brain cell or a skin cell."},{"t":"The Supreme Court (SC) has categorically barred medical practitioners from offering stem cell therapy (SCT) as a treatment for autism spectrum disorder (ASD)."}],"v":"cfcefa"},{"id":"stem-cells:main#2","path":[],"part":[2,4],"rows":[{"sec":"Why Are Stem Cells So Important in Medicine?"},{"t":"The ability of stem cells to differentiate into new, healthy tissue is what makes them a “holy grail” for medical research. This field is called regenerative medicine. The main goal is to use stem cells to repair or replace tissues and organs damaged by disease."},{"h":"Understanding Disease:","t":"By watching stem cells mature into, for example, heart cells, scientists can learn how heart disease develops and test new drugs on those cells in a lab."},{"h":"Tissue Regeneration:","t":"This is the most famous application. The idea is to guide stem cells to become the specific cells a patient needs."},{"h":"Parkinson’s Disease:","t":"Grow new brain cells that produce dopamine.<br>ஒ Type 1 Diabetes: Grow new insulin-producing cells for the pancreas."},{"h":"Heart Disease:","t":"Repair heart muscle damaged by a heart attack."},{"h":"Burn Victims:","t":"Grow new, healthy skin for grafting."},{"t":"The only stem cell therapy that is widely and currently in use is the bone marrow transplant. In this procedure, the patient’s diseased blood stem cells (in the bone marrow) are replaced with healthy ones, which then go on to rebuild the body’s entire blood and immune system."}],"v":"38c5a0"},{"id":"stem-cells:main#3","path":[],"part":[3,4],"table":1,"head":["Field","Development / Application","2025-26 High-Value Fact"],"rows":[{"h":"Ophthalmology","t":"<span class=\"th\">Development / Application<\/span> CALEC Therapy:  Cultivated Autologous Limbal Epithelial Cells for corneal repair.<br><span class=\"th\">2025-26 High-Value Fact<\/span> March 2025: Phase 1/2 trials reported >90% success in restoring sight for irreversible corneal damage."},{"h":"Diabetes","t":"<span class=\"th\">Development / Application<\/span> Islet Cell Transplants: Using iPSCs to create insulin-producing $ $-cells.<br><span class=\"th\">2025-26 High-Value Fact<\/span> World First (2025): Successful autologous iPSC-islet transplant in a Type-1 patient reported functional cure signals."},{"h":"Oncology","t":"<span class=\"th\">Development / Application<\/span> Off-the-shelf CAR-T: iPSC-derived immune cells for cancer.<br><span class=\"th\">2025-26 High-Value Fact<\/span> Move toward Allogeneic (universal) products, reducing costs and wait times compared to traditional CAR-T."},{"h":"Neurology","t":"<span class=\"th\">Development / Application<\/span> Dopaminergic Neurons: Replacing cells lost in Parkinson’s.<br><span class=\"th\">2025-26 High-Value Fact<\/span> Multiple Phase-1 trials (e.g., BlueRock, Aspen) advanced in 2025 for Parkinson’s and Spinal Cord injuries."},{"h":"Organoids","t":"<span class=\"th\">Development / Application<\/span> “Organ-on-a-chip”: 3D mini-organs.<br><span class=\"th\">2025-26 High-Value Fact<\/span> Used as the primary toxicology screen in 2026, significantly reducing reliance on animal testing for new drugs."}],"v":"60b0b1"},{"id":"stem-cells:main#4","path":[],"part":[4,4],"rows":[{"sec":"Regulatory & Policy Landscape (India 2026)"},{"t":"National Guidelines for Stem Cell Research (NGSCR) 2025: Jointly updated by ICMR and DBT."},{"h":"Major Structural Shift:","t":"Dissolution of the National Apex Committee (NAC-SCRT). Oversight is now centralized under the CDSCO (Drugs Controller General) for clinical trials and Institutional Ethics Committees."},{"h":"The “Prohibited” List:","t":"Human germline editing and reproductive cloning remain strictly banned."},{"h":"BioE3 Policy Connection:","t":"Stem cell manufacturing is now a pillar of the Biomanufacturing Hubs initiative to make India a “Bio-factory” for regenerative medicine."},{"sec":"Constraints & Ethics"},{"h":"Tumorigenicity:","t":"The risk that pluripotent cells might form tumors (Teratomas) if not fully differentiated."},{"h":"Immune Rejection:","t":"Even with iPSCs, “immune evasion” engineering is needed for universal (allogeneic) grafts."},{"h":"“Stem Cell Tourism”:","t":"The rise of unproven, expensive clinics claiming cures for autism or anti-aging without scientific backing remains a major regulatory headache."}],"v":"00fbe4"}]},{"id":"organ-transplantation-and-tissue","subj":"s05","name":"ORGAN TRANSPLANTATION and TISSUE","cards":[{"id":"organ-transplantation-and-tissue:main","path":[],"rows":[{"t":"grafting a human organ from a living or deceased person into another living person for therapy + Organ (kidney, liver, heart, lung, pancreas, intestine) vs Tissue (cornea, skin, bone, heart valves, blood vessels)"},{"t":"THOTA 1994 (Transplantation of Human Organs and Tissues Act) via 3 tier structure (Nat, St, Dist)"},{"t":"National Organ Transplant Program (NOTP) (central sector programme, access for needy citizens)"},{"h":"Challenges :","t":"deceased donation &lt; 1 per million population (Spain 52.6 pmp in 2024) + slow growth (donors incl. deceased 6,916 in 2014 → ~18,911 in 2024, NOTTO) + supply-demand mismatch (waitlist 89,839 as on 3 March 2026) + brain stem death is defined only in THOTA for organ donation, not in Registration of Births and Deaths Act 1969 + organ trafficking + family veto + few male donors (70-75% of donors are women)"},{"h":"way forward :","t":"opt-out model (presumed consent : deceased is presumed to have consented to organ removal) (England, Singapore) + Kerala model (1st state with clear clinical protocols for brain death certification) + digital registry for transparent allocation + faster transport (flight notes telling ATC an organ is on board, so the flight gets priority take-off & landing)"}],"v":"0f5153"}]},{"id":"organ-on-chip-technology","subj":"s05","name":"Organ-on-Chip Technology","cards":[{"id":"organ-on-chip-technology:main","path":[],"rows":[{"h":"ORGAN ON CHIP TECHNOLOGY :","t":"Definition & Working - basically a human organ by replicating its cells and using a membrane on a chip, aka (“New Approach Methods”) that mimic organ environment/disease in a chip-sized device; cells grow into 3D structures in micro-fluidic channels, with sensing for function evaluation."},{"h":"Advantages & Uses -","t":"More accurate than 2D cultures/animal tests for drug efficacy, precision therapeutics, human physiology simulation, and studying disease mechanisms. Key Components - Microfluidics (channelled cell delivery), Living cell tissues (arranged to mimic function), Drug delivery signals, and Sensing (track chip performance)."},{"h":"Indian Steps & Significance -","t":"Changes in New Drugs & Clinical Trials Rules 2019 to allow OoCs; initiatives like Phenome India Project (National Biobank inaugurated at the CSIR-Institute of Genomics and Integrative Biology (IGIB).) and Indian Cancer Genome Atlas for advancing precision medicine -promising in drug discovery and healthcare innovation."}],"v":"9f6a79"}]},{"id":"drug-quality","subj":"s05","name":"DRUG QUALITY","cards":[{"id":"drug-quality:main#1","path":[],"part":[1,2],"rows":[{"sec":"<b>Why in the news?<\/b>"},{"t":"Central Drugs Standard Control Organisation (CDSCO) directed manufacturers of 49 medicines to recall their products after samples were found to be “not of standard quality”."},{"sec":"<b>Regulation of drugs in India<\/b>"},{"h":"<b>CDSCO<\/b>:","t":"It regulates the quality, safety, and efficacy of drugs, medical devices, and cosmetics in India under the Drugs & Cosmetics Act, 1940 and Drugs and Cosmetics Rules, 1945."},{"h":"<b>Drugs and Cosmetics Act (DCA), 1940<\/b>:","t":"It regulates the import, manufacturing, sale, and distribution of drugs in India."},{"h":"<b>State Drug Regulatory Authorities (SDRAs)<\/b>:","t":"Responsible for licensing manufacturing establishments and surveillance over the sale of spurious drugs."},{"h":"<b>National Pharmaceutical Pricing Authority (NPPA)<\/b>:","t":"It revises the prices of controlled bulk drugs and also monitors the availability of drugs, identifies shortages."}],"v":"bffff7"},{"id":"drug-quality:main#2","path":[],"part":[2,2],"rows":[{"sec":"<b>Issues with drug quality in India<\/b>"},{"h":"<b>State-Level Authorities (SLAs)<\/b>:","t":"SLAs face challenges like ill-equipped testing labs, a paucity of drug inspectors, and poor understanding of rules."},{"h":"<b>Non-Compliance with Standards<\/b>:","t":"In 2023, just about 2,000 out of 10,500 manufacturing units were found to be compliant with WHO-Good Manufacturing Practices (GMP) standards."},{"h":"<b>Information Asymmetry<\/b>:","t":"Due to non-mention of time frame for completion of regulation stages, no centralised record keeping, and absence of a national database of manufacturers."},{"h":"<b>Limited reach of Pharmacovigilance<\/b>:","t":"Limited outreach among patients as well as healthcare professionals, with little or no information about measures taken after adverse drug reports."},{"sec":"<b>Measures taken to ensure quality of Drugs<\/b>"},{"h":"<b>‘Strengthening of States’ Drug Regulatory System (SSDRS)<\/b>:","t":"It envisages strengthening the laboratory infrastructure and up-gradation of existing State Drug Controller offices in states."},{"h":"<b>Amendment to DCA 1940<\/b>:","t":"Drugs & Cosmetics (Amendment) Act 2008 provides stringent penalties for the manufacture of spurious and adulterated drugs."},{"h":"<b>Amendments to Drugs and Cosmetics Rules, 1945<\/b>:","t":"Making inspection of manufacturing establishments mandatory by Central and State Drug Inspectors before the grant of a manufacturing license."},{"h":"<b>Revamping Pharmaceuticals Technology Upgradation Assistance Scheme (PTUAS)<\/b>:","t":"The government has extended eligibility to all pharmaceutical manufacturing units with a turnover below ₹500 crore."}],"v":"592d60"},{"id":"drug-quality:new-drugs-and-clinical-trials-amendment","path":["<b>New Drugs and Clinical Trials (Amendment) Rules, 2026<\/b>,"],"rows":[{"sec":"<b>1. The \"Prior Intimation\" System (Replacing Test Licenses)<\/b>"},{"h":"<b>Earlier:<\/b>","t":"Manufacturers had to wait for a formal \"Test License\" to manufacture small quantities of a new drug or unapproved Active Pharmaceutical Ingredient (API) for clinical trials, research, or testing."},{"h":"<b>Now:<\/b>","t":"For most low-risk drugs, this license requirement is replaced with a \"Prior Intimation\" mechanism. Manufacturers submit an online form (via the SUGAM portal) and, once acknowledged, can immediately proceed with manufacturing for research purposes."},{"h":"<i>Exception:<\/i>","t":"High-risk categories (narcotics, cytotoxic drugs, sex hormones, beta-lactams, and biologics with live microorganisms) still require strict prior permission."},{"sec":"<b>2. Slashed Approval Timelines<\/b>"},{"t":"For applications that still require formal regulatory approval from the Central Licensing Authority, the statutory processing time has been cut in half—from <b>90 working days down to 45 working days<\/b>."},{"sec":"<b>3. Streamlined BA/BE Studies<\/b>"},{"t":"Certain low-risk Bioavailability/Bioequivalence (BA/BE) studies no longer require prior permission to initiate. They have been shifted to the notification/intimation system. The government expects this single move to reduce the number of license applications by roughly 50%."},{"sec":"<b>4. Post-Approval Quality Changes (G.S.R. 97(E))<\/b>"},{"t":"The 2026 draft introduces a globally recognized, risk-based classification system for modifying a drug's manufacturing process after it has already been approved:"},{"h":"<b><u>Level I (Major) & Level II (Moderate)<\/u><\/b><b>:<\/b>","t":"Require prior regulatory approval."},{"h":"<b><u>Level III (Minor)<\/u><\/b><b>:<\/b>","t":"Can be implemented without prior approval and simply reported in an annual submission."},{"sec":"<b>5. Faster Ethics Committee Registration (G.S.R. 98(E))<\/b>"},{"t":"The <u>procedural step<\/u> of granting a \"Provisional Certificate\" for Ethics Committees has been omitted. The <u>CDSCO<\/u> can now grant direct final registration upon satisfactory scrutiny of the application, removing a major administrative bottleneck."}],"v":"4c1e63"}]},{"id":"fixed-dose-combination-drugs","subj":"s05","name":"FIXED DOSE COMBINATION DRUGS","cards":[{"id":"fixed-dose-combination-drugs:main","path":[],"rows":[{"sec":"<b>What are FDCs Drugs?<\/b>"},{"h":"<b>Definition<\/b>:","t":"FDCs refer to products containing two or more active ingredients, also referred to as cocktail drugs, used for a particular indication (as per Drugs & Cosmetics Rule 1945)."},{"h":"<b>Active Ingredient<\/b>:","t":"The biologically active component of a drug product (tablet, capsule, cream, injectable) that produces the intended effects."},{"h":"<b>Common Combinations<\/b>:","t":"Mostly FDCs are in combinations of cough, cold, and fever preparations; antimicrobials; vitamins and minerals, etc."},{"img":7},{"sec":"<b>Way Forward<\/b>"},{"h":"<b>Strong Punitive Action<\/b>:","t":"As suggested by the<u> Mashelkar Committee <\/u>(for regulatory infrastructure and the problem of spurious/substandard drugs) against those involved in drug-related cases of corruption."},{"h":"<b>Evidence-Driven Authorisation<\/b>:","t":"Require robust scientific evidence of FDC efficacy and safety to prevent unjustifiable combinations and enhance regulatory scrutiny."},{"h":"<b>Surveillance Systems<\/b>:","t":"Establish vigilant post-market monitoring mechanisms for prompt detection and resolution of FDC-related adverse effects, prioritising public safety."},{"h":"<b>Export Control Stringency<\/b>:","t":"Harmonise export policies with domestic regulations to prohibit the overseas export of domestically banned or restricted FDCs."}],"v":"83dae4"}]},{"id":"how-macrolides-work-mechanism-of-action","subj":"s05","name":"How Macrolides Work (Mechanism of Action)","cards":[{"id":"how-macrolides-work-mechanism-of-action:main","path":[],"rows":[{"t":"MACROLIDES antibiotics"},{"t":"Macrolides are a class of antibiotics used to treat a wide range of bacterial infections. They are a common alternative for people who are allergic to penicillin."},{"h":"Their name comes from their chemical structure:","t":"a large “macrocyclic” lactone ring."},{"t":"Macrolides stop bacteria from multiplying by interfering with their ability to make proteins."},{"h":"Target:","t":"They target the bacteria’s ribosome (specifically, the 50S ribosomal subunit), which is the “factory” that builds proteins."},{"h":"Action:","t":"The antibiotic binds to this factory and blocks the exit tunnel."},{"h":"Result:","t":"New proteins can’t be completed, and the protein “assembly line” grinds to a halt.<br>Without the ability to create new proteins, the bacteria can’t grow, repair themselves, or reproduce. This makes them bacteriostatic (they stop bacterial growth), allowing your body’s immune system to clear the infection. At very high doses, they can sometimes be bactericidal (they kill the bacteria)."}],"v":"cbed73"}]},{"id":"oral-rehydration-therapy","subj":"s05","name":"ORAL REHYDRATION THERAPY","cards":[{"id":"oral-rehydration-therapy:main#1","path":[],"part":[1,3],"rows":[{"sec":"<b>About Oral Rehydration Therapy (ORT)<\/b>"},{"t":"<b>ORT is the administration of appropriate solutions (glucose, sodium chloride, sodium bicarbonate, and potassium chloride or citrate) by mouth to prevent or correct dehydration.<\/b>"},{"sec":"<b>ORT consists of:<\/b>"},{"h":"<b>Rehydration:<\/b>","t":"Water and electrolytes are administered to replace losses."},{"h":"<b>Maintenance fluid therapy:<\/b>","t":"To take care of ongoing losses once rehydration is achieved (along with appropriate nutrition)."},{"sec":"<b>Treatment for:<\/b>"},{"h":"<b>Diarrhoea:<\/b>","t":"ORT has significantly reduced deaths from diarrheal diseases, with child mortality declining by two-thirds since 1990."},{"h":"<b>Cholera:<\/b>","t":"ORT is highly effective in reducing mortality from over 50% to less than 0.2% in cholera patients."},{"sec":"<b>Efficacy in Adults:<\/b>"},{"t":"The patients receiving the oral solution required 80% less intravenous fluids for cure in comparison to other techniques."},{"t":"It demonstrated that this low-cost intervention could effectively and safely reduce intravenous fluid needs."}],"v":"17f044"},{"id":"oral-rehydration-therapy:main#2","path":[],"part":[2,3],"rows":[{"sec":"<b>How ORT works?<\/b>"},{"t":"<b>ORT works because of the molecular mechanisms that govern sugar and sodium absorption inside the gut.<\/b>"},{"t":"<b>The cells that make up the lining of the gut have special receptors on their surfaces that allow them to actively absorb sugar molecules.<\/b>"},{"t":"<b>The increase in sugar and sodium inside the cells leads to increased absorption of water and chloride ions.<\/b>"},{"sec":"<b>Indian Initiatives<\/b>"},{"h":"<b>National Oral Rehydration Therapy Programme (1985):<\/b>","t":"Launched to promote the use of ORT to combat child mortality due to diarrhoea."},{"h":"<b>National Health Mission (NHM):<\/b>","t":"ORT is a critical component of NHM programs targeting childhood illnesses like diarrhoea and dehydration."},{"t":"<b>STOP Diarrhoea Campaign<\/b>"}],"v":"066c31"},{"id":"oral-rehydration-therapy:main#3","path":[],"part":[3,3],"rows":[{"sec":"<b>Global Initiatives<\/b>"},{"t":"<b>Oral rehydration solution (ORS) and zinc are recommended by the WHO and UNICEF to be used collectively to ensure the effective treatment of diarrhoea.<\/b>"},{"h":"<b>Global Task Force on Cholera Control (GTFCC):<\/b>","t":"Roadmap 2030."},{"h":"<b>GAVI, the Vaccine Alliance:<\/b>","t":"GAVI supports initiatives to prevent and treat diarrheal diseases, including the promotion of ORT."}],"v":"f31a95"}]},{"id":"common-infections-and-preventive-measure","subj":"s06","name":"COMMON INFECTIONS AND PREVENTIVE MEASURES","cards":[{"id":"common-infections-and-preventive-measure:main#1","path":[],"part":[1,10],"rows":[{"h":"<b>Authoritative guidance:<\/b>","t":"World Health Organization, Centers for Disease Control and Prevention, Ministry of Health and Family Welfare, National Centre for Disease Control."}],"v":"538d76"},{"id":"common-infections-and-preventive-measure:main#2","path":[],"part":[2,10],"rows":[{"sec":"<b>1) Common infections (one-line each) — what to remember<\/b>"},{"t":"<span class=\"lst\"><span class=\"li\"><b>Upper respiratory infections (common cold, influenza, RSV)<\/b> — highly transmissible via droplets/fomites.<\/span><br><span class=\"li\"><b>COVID-19 / SARS-CoV-2 variants<\/b> — still cause occasional outbreaks and need targeted responses.<\/span><\/span>"},{"t":"<b>Tuberculosis (TB)<\/b> — airborne, long-term public-health priority in India. (WHO Global TB Report 2025, India’s TB incidence (new cases emerging each year) reduced by 21%.)"},{"h":"Pulmonary TB:","t":"Most common form affecting the lungs"},{"h":"Extrapulmonary TB:","t":"Occurs outside the lungs,"},{"h":"Spinal TB (Pott’s disease):","t":"Affects the spine and can cause severe back pain"},{"t":"<b>Diarrhoeal diseases (rotavirus, cholera, typhoid, viral gastroenteritis, food-poisoning bacteria)<\/b> — faeco-oral transmission; major child morbidity/mortality driver."},{"t":"<span class=\"lst\"><span class=\"li\"><b>Vector-borne (malaria, dengue, chikungunya, JE)<\/b> — climate & breeding-site dependent.<\/span><br><span class=\"li\"><b>Sexually-transmitted infections (HIV, syphilis, chlamydia, gonorrhoea)<\/b> — sexual contact / vertical transmission risks.<\/span><br><span class=\"li\"><b>Urinary tract infections (UTI)<\/b> — common, esp. females and catheterised patients.<\/span><\/span>"},{"h":"HIV -","t":"A virus that attacks the body’s immune system, infecting and destroying CD4 cells (CD4 T lymphocytes), a type of white blood cells."}],"v":"1acf51"},{"id":"common-infections-and-preventive-measure:main#3","path":[],"part":[3,10],"rows":[{"t":"Lenacapavir is an antiretroviral medicine that is used for HIV prevention as a Pre-Exposure Prophylaxis or PrEP."},{"t":"PrEP is a medication that can reduce the risk of HIV infection for individuals who are HIV-negative but are at risk of contracting the virus."},{"h":"Trachoma -","t":"eye disease caused by the bacterium Chlamydia trachomatis."},{"t":"It is categorized as a Neglected Tropical Disease by the WHO."},{"h":"Impact:","t":"Irreversible blindness"},{"h":"Spread:","t":"Personal contact or through flies"},{"h":"Indian Initiative:","t":"Trachoma control program integrated under the National Program for Control of Blindness and Visual Impairment (NPCBVI)"}],"v":"ce873f"},{"id":"common-infections-and-preventive-measure:main#4","path":[],"part":[4,10],"rows":[{"sec":"HEPATITIS"},{"t":"Viral hepatitis (types A, B, C, D, and E) are major causes of acute liver infection."},{"t":"However, only hepatitis B, C, and D can lead to chronic infections with a higher risk of liver cirrhosis, failure or cancer."},{"sec":"Vaccine Availability"},{"t":"<span class=\"lst\"><span class=\"li\">There is no vaccine for Hepatitis C virus.<\/span><br><span class=\"li\">Hepatitis B vaccines provide protection from HDV infection.<\/span><br><span class=\"li\">Havisure is India’s first indigenous Hepatitis A vaccine.<\/span><\/span>"}],"v":"c416be"},{"id":"common-infections-and-preventive-measure:main#5","path":[],"part":[5,10],"rows":[{"sec":"MONKEYPOX"},{"h":"Type:","t":"Viral zoonotic disease caused by Monkeypox virus (Orthopoxvirus genus)."},{"h":"Transmission:","t":"Close contact with infected people, animals, or contaminated objects."},{"h":"Symptoms:","t":"Fever, headache, muscle aches, fatigue, swollen lymph nodes"},{"h":"Global Concern:","t":"Declared a Public Health Emergency of International Concern (PHEIC) by WHO."},{"t":"There is no proven treatment for Mpox."},{"h":"Diagnostic Test:","t":"RT-PCR (Reverse Transcription Polymerase Chain Reaction)"}],"v":"72e9f7"},{"id":"common-infections-and-preventive-measure:main#6","path":[],"part":[6,10],"rows":[{"sec":"HUMAN PAPILLOMAVIRUS (HPV)"},{"t":"<span class=\"lst\"><span class=\"li\">A common sexually transmitted infection which can affect the skin, genital area and throat.<\/span><br><span class=\"li\">In most cases the immune system clears HPV from the body.<\/span><\/span>"},{"t":"Persistent infection with high-risk HPV can cause abnormal cells to develop, which go on to become cancer."},{"t":"Cervical cancer is the most common type of cancer caused by HPV and only one preventable via vaccine."},{"h":"Treatment:","t":"There is currently no treatment for HPV infection."},{"t":"<span class=\"lst\"><span class=\"li\"><b>Skin & wound infections (Staphylococcus aureus, fungal infections)<\/b> — contact or opportunistic.<\/span><br><span class=\"li\"><b>Hospital-acquired infections (CLABSI, VAP, CAUTI, MRSA, C. difficile)<\/b> — facility-linked risks.<\/span><\/span>"}],"v":"246d8b"},{"id":"common-infections-and-preventive-measure:main#7","path":[],"part":[7,10],"table":1,"head":["Feature","Bacteria","Viruses"],"rows":[{"h":"<b>Type of organism<\/b>","t":"<span class=\"th\">Bacteria<\/span> <i>Living<\/i>, single-celled microorganisms<br><span class=\"th\">Viruses<\/span> <i>Non-living<\/i>infectious particles"},{"h":"<b>Cell structure<\/b>","t":"<span class=\"th\">Bacteria<\/span> Have a cell wall, cell membrane, cytoplasm, DNA (free-floating)<br><span class=\"th\">Viruses<\/span> No cell wall, no cell structure; just DNA or RNA inside a protein coat."},{"h":"<b>Reproduction<\/b>","t":"<span class=\"th\">Bacteria<\/span> Multiply<b>on their own<\/b>by cell division<br><span class=\"th\">Viruses<\/span> Can<b>only reproduce inside a living host cell<\/b>"},{"h":"<b>Examples<\/b>","t":"<span class=\"th\">Bacteria<\/span> Tuberculosis, Typhoid, Cholera, Pneumonia<br><span class=\"th\">Viruses<\/span> Flu (Influenza), COVID-19, Common Cold, HIV, Dengue"}],"v":"61911f"},{"id":"common-infections-and-preventive-measure:main#8","path":[],"part":[8,10],"rows":[{"sec":"<b>2) Core preventive measures (universal / cross-cutting)<\/b>"},{"h":"<b>Vaccination (primary prevention):<\/b>","t":"follow the national schedule for children/pregnant women and recommended adult vaccines (influenza, TT/Td, hepatitis where indicated). Vaccines reduce incidence/severity and interrupt transmission."},{"h":"<b>Hand hygiene & respiratory etiquette:<\/b>","t":"regular handwashing with soap or alcohol hand-rub, cover coughs/sneezes, stay home when ill — single most effective community measure."},{"h":"<b>Safe water, sanitation & food hygiene (WASH):<\/b>","t":"treat drinking water, safe food handling, toilets and sewage management to prevent diarrhoeal and enteric infections. (WASH underpins cholera/typhoid control.)"},{"h":"<b>Vector control & environmental management:<\/b>","t":"remove stagnant water, insecticide-treated nets, IRS, community mobilisation to prevent malaria/dengue."},{"h":"<b>Safe sex & STI control:<\/b>","t":"condoms, testing/treatment, antenatal screening to prevent mother-to-child transmission."},{"h":"<b>Antimicrobial stewardship:<\/b>","t":"rational antibiotic use (prescription only), diagnostics-led therapy to slow AMR."},{"h":"<b>Infection prevention & control (IPC) in healthcare:<\/b>","t":"standard precautions (hand hygiene, PPE when indicated), sterilisation, safe injection practices, isolation of infectious patients and biomedical waste management. Essential to prevent HAIs."},{"h":"<b>Ventilation & air quality (respiratory pathogens):<\/b>","t":"improve ventilation, use masks in high-risk settings during outbreaks; cleaner indoor air reduces airborne spread."}],"v":"fc70db"},{"id":"common-infections-and-preventive-measure:main#9","path":[],"part":[9,10],"rows":[{"sec":"<b>3) Practical, exam-friendly “do’s” (what to advise communities/patients)<\/b>"},{"t":"Keep routine immunisations up to date (children & pregnant women)."},{"h":"Wash hands:","t":"before eating, after toilet, after contact with sick people, after surface contact in public places."},{"t":"Use ORS and zinc for childhood diarrhoea; seek care for danger signs. (Prevents mortality.)"},{"h":"Use mosquito control:","t":"nets, larval source reduction, community campaigns during monsoon."},{"t":"Don’t self-medicate with antibiotics; complete prescribed courses and dispose of unused antibiotics safely."},{"h":"In hospitals:","t":"follow IPC checklists, immunise HCWs (hepatitis B, influenza where recommended) and monitor compliance."}],"v":"45075b"},{"id":"common-infections-and-preventive-measure:main#10","path":[],"part":[10,10],"rows":[{"sec":"<b>4) Priority measures for specific infections (short bullets)<\/b>"},{"h":"<b>TB:<\/b>","t":"early detection (symptom screening + rapid molecular tests), complete treatment, household contact tracing and BCG for neonates in high-risk settings."},{"h":"<b>Diarrhoeal diseases:<\/b>","t":"rotavirus vaccine for infants, safe water, ORS + zinc, cholera vaccine in outbreaks/at-risk populations."},{"h":"<b>Respiratory outbreaks (influenza/COVID/RSV):<\/b>","t":"vaccine where available, mask/use respiratory hygiene in outbreaks, genomic surveillance for variants."},{"h":"<b>Vector-borne:<\/b>","t":"integrated vector management, early case detection (malaria RDTs), community clean-ups."},{"h":"<b>STIs/HIV:<\/b>","t":"condoms, testing-and-treat, PPTCT (prevention of parent-to-child transmission) services."},{"sec":"<b>5) Systems & policy measures (what govt/health system must ensure)<\/b>"},{"t":"Strengthen routine immunisation (supply chains, session sites, catch-up campaigns)."},{"t":"Expand lab & genomic surveillance capacity (IDSP + genomic hubs) for early detection & variant tracking."},{"t":"<span class=\"lst\"><span class=\"li\">Implement national IPC core components in all health facilities (training, supplies, monitoring).<\/span><br><span class=\"li\">Run AMR stewardship and One-Health programmes linking human, animal and environment sectors.<\/span><\/span>"}],"v":"76b264"},{"id":"common-infections-and-preventive-measure:human-papillomavirus-hpv-vaccination-cam","path":["Human Papillomavirus (HPV) vaccination campaign"],"rows":[{"t":"free vaccines to approximately 1.15 crore 14-year-old girls."},{"t":"India's national program relies on Gardasil-4, a quadrivalent vaccine targeting types 6, 11, 16, and 18."},{"t":"India has also indigenously developed Cervavac, manufactured by the Serum Institute of India (SII),<br>The intensive campaign runs for 90 days, after which the vaccine will be available on routine immunization day"},{"t":"Prime Minister Shri Narendra Modi lauded National HPV Vaccination campaign as it achieves historic milestone of crossing 1 crore HPV vaccine doses, in less than nine months, covering nearly 87% of annual cohort of eligible girls."}],"v":"3c4313"}]},{"id":"preventive-measures-during-outbreaks","subj":"s06","name":"PREVENTIVE MEASURES DURING OUTBREAKS","cards":[{"id":"preventive-measures-during-outbreaks:main","path":[],"rows":[{"h":"Preventive measures during outbreaks -","t":"concise, exam-ready guidance"},{"h":"Short summary (one line):","t":"During an outbreak, combine rapid detection & surveillance, immediate non-pharmaceutical interventions (NPIs), targeted vaccination/testing/isolation, strong health-system preparedness, clear risk communication, and One-Health actions to stop transmission, protect vulnerable groups and maintain essential services."}],"v":"1b587b"},{"id":"preventive-measures-during-outbreaks:immediate-actions-first-72-hours","path":["<u>Immediate actions (first 72 hours)<\/u>"],"rows":[{"t":"Activate incident command / district rapid response team (public health + clinical + logistics + communication)."},{"h":"Epidemiological triage:","t":"confirm outbreak, define case definition, linelist cases, map spread (person/place/time)"},{"t":"Scale up testing & diagnostics (rapid tests + molecular where needed) and start contact tracing."},{"t":"Implement immediate NPIs in affected areas - mask use in crowded places, hand hygiene stations, temporary restrictions on mass gatherings if indicated."},{"h":"Protect health workers -","t":"ensure PPE, triage zones, IPC reinforcement"},{"h":"Risk communication -","t":"public brief within 24 hours with clear actions for public (what to do, where to seek care, do’s/don’ts)."}],"v":"94fb9f"},{"id":"preventive-measures-during-outbreaks:community-individual-measures","path":["<u>Community & individual measures<\/u>"],"rows":[{"h":"Vaccination:","t":"accelerate targeted vaccination drives if a vaccine exists (priority: frontline workers, elderly, comorbid)."},{"h":"Isolation & quarantine:","t":"isolate confirmed cases (home or facility depending on severity); quarantine close contacts for the recommended period with testing."},{"h":"Testing strategy:","t":"symptomatic → test; high-risk contacts → test even if asymptomatic; use repeat testing protocols as per disease."},{"h":"Masking & respiratory etiquette:","t":"promote well-fitting masks in indoor/crowded spaces; dispose/clean masks safely."},{"h":"Hand hygiene & surface cleaning:","t":"handwashing, alcohol rub; regular cleaning of high-touch surfaces."},{"h":"Stay-at-home guidance:","t":"symptomatic persons should stay home and seek testing/care; employers should offer paid sick leave to enable compliance."},{"h":"Vulnerable protection:","t":"shield elderly, immunocompromised, pregnant women; postpone non-essential visits to LTCFs."},{"t":"Safe burial/practice protocols when disease requires special handling."}],"v":"2a9cce"},{"id":"preventive-measures-during-outbreaks:health-facility-measures","path":["<u>Health-facility measures<\/u>"],"rows":[{"h":"Triage & separation:","t":"front-door screening, separate respiratory/ isolation zones, fast referral pathways."},{"h":"IPC enforcement:","t":"hand hygiene, N95/PPE use when required, environmental cleaning, waste management."},{"h":"Maintain essential services:","t":"plan workforce surge, elective care prioritisation, telemedicine for non-urgent care."},{"h":"Clinical guidance:","t":"distribute standard treatment protocols, oxygen/ critical care scaling plan, stockpile essential medicines and consumables."},{"h":"Healthcare worker welfare:","t":"vaccination, psychosocial support, roster rotation to prevent burnout."}],"v":"32a9a8"},{"id":"preventive-measures-during-outbreaks:surveillance-data-labs","path":["<u>Surveillance, data & labs<\/u>"],"rows":[{"h":"Enhanced surveillance:","t":"case reporting (IDSP-like), sentinel sites, syndromic surveillance in primary care."},{"h":"Genomic surveillance:","t":"sequence representative isolates to detect variants (if applicable)."},{"h":"Data dashboard & analytics:","t":"real-time case counts, hospital bed/ oxygen capacity, testing positivity - use to guide NPIs."},{"t":"Wastewater/environmental surveillance where relevant for early warning (e.g., poliovirus, SARS-CoV-2)."}],"v":"c8cf61"},{"id":"preventive-measures-during-outbreaks:non-pharmaceutical-interventions-npi-pol","path":["<u>Non-pharmaceutical interventions (NPI) policy levers<\/u>"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Targeted restrictions (microcontainment, temporary closure of highrisk venues) rather than blanket lockdowns when possible.<\/span><br><span class=\"li\">Mass gathering guidance based on local transmission & healthcare capacity.<\/span><br><span class=\"li\">Travel advisories & screening (domestic/international) proportional to risk.<\/span><\/span>"},{"h":"School/workplace protocols:","t":"cohorting, hybrid models, ventilation improvements, symptomatic leave policies."}],"v":"d29960"},{"id":"preventive-measures-during-outbreaks:one-health-animal-sector","path":["<u>One-Health & animal sector<\/u>"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Animal surveillance & culling (if zoonotic spillover), safe handling of sick animals, veterinary diagnostics.<\/span><br><span class=\"li\">Restrict wildlife markets/unsafe practices linked to zoonosis risk; coordinate human-animal health data sharing.<\/span><\/span>"}],"v":"5a0ecc"},{"id":"preventive-measures-during-outbreaks:risk-communication-community-engagement","path":["<u>Risk communication & community engagement<\/u>"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Clear, transparent messaging about risk level, protective actions, where/when to test and seek care.<\/span><br><span class=\"li\">Use trusted local leaders, media & social platforms to counter misinformation.<\/span><\/span>"},{"h":"Two-way feedback:","t":"hotlines and community reporting channels to learn barriers and adapt measures."}],"v":"3028a3"},{"id":"preventive-measures-during-outbreaks:supply-chain-logistics-legal","path":["<u>Supply chain, logistics & legal<\/u>"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Ensure supply chains for PPE, medicines, oxygen, vaccines and testing kits.<\/span><br><span class=\"li\">Mobilise temporary facilities (field hospitals, isolation centers) if needed.<\/span><br><span class=\"li\">Legal measures (public health orders) should be time-limited, proportional and rights-respecting.<\/span><\/span>"},{"h":"Financial protection:","t":"support for quarantined/isolated persons (food, wages) to improve compliance."}],"v":"953d20"},{"id":"preventive-measures-during-outbreaks:recovery-resilience-post-peak","path":["<u>Recovery & resilience (post-peak)<\/u>"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">Gradual lifting of restrictions based on data (falling cases, hospital capacity, vaccination).<\/span><br><span class=\"li\">After-action review to document lessons, update response plans.<\/span><br><span class=\"li\">Strengthen routine public-health functions (immunisation drives, lab networks, IPC) to prevent next outbreak.<\/span><\/span>"}],"v":"88c2c0"},{"id":"preventive-measures-during-outbreaks:practical-checklists","path":["<u>Practical checklists <\/u>"],"rows":[{"sec":"<i>For individuals (short DOs)<\/i>"},{"t":"<span class=\"lst\"><span class=\"li\">DO get vaccinated if eligible.<\/span><br><span class=\"li\">DO isolate if symptomatic; inform contacts.<\/span><br><span class=\"li\">DO wear mask in crowded/indoor spaces.<\/span><br><span class=\"li\">DO wash hands frequently and avoid touching face.<\/span><br><span class=\"li\">DO follow public health advisories on testing & care.<\/span><\/span>"},{"sec":"<i>For district admin (top 8)<\/i>"},{"t":"<span class=\"lst\"><span class=\"li\">Activate district incident command<\/span><br><span class=\"li\">Mobilise testing & lab capacity.<\/span><br><span class=\"li\">Map cases & contacts; implement microcontainment.<\/span><br><span class=\"li\">Protect and equip health workers.<\/span><br><span class=\"li\">Ensure oxygen/bed surge plans.<\/span><br><span class=\"li\">Manage risk communication daily.<\/span><br><span class=\"li\">Enforce targeted NPIs and essential-service continuity.<\/span><br><span class=\"li\">Coordinate with animal health (One-Health) if zoonotic.<\/span><\/span>"},{"sec":"<i>For hospitals (top 6)<\/i>"},{"t":"<span class=\"lst\"><span class=\"li\">Triage & isolate at entry.<\/span><br><span class=\"li\">IPC audit & PPE stock check.<\/span><br><span class=\"li\">Clinical pathway for severe cases (oxygen, ICU).<\/span><br><span class=\"li\">Staff rostering & backup.<\/span><br><span class=\"li\">Maintain essential non-COVID care.<\/span><br><span class=\"li\">Report data to surveillance system daily.<\/span><\/span>"},{"sec":"<i>Common pitfalls to avoid<\/i>"},{"t":"<span class=\"lst\"><span class=\"li\">Delayed testing & reporting → uncontrolled spread.<\/span><br><span class=\"li\">Blanket long lockdowns without social support → economic harm and non-compliance.<\/span><br><span class=\"li\">Poor communication → misinformation and panic.<\/span><br><span class=\"li\">Ignoring animal health signals in zoonotic outbreaks.<\/span><br><span class=\"li\">Inadequate protection of health workers → system collapse.<\/span><\/span>"}],"v":"11f08c"},{"id":"preventive-measures-during-outbreaks:6-line-pcs-gs-3-answer-template-use-in-e","path":["<i><b><u>6-line PCS/GS-3 answer template (use in exam)<\/u><\/b><\/i>"],"rows":[{"h":"Intro (1 line):","t":"Outbreak control requires rapid detection, interruption of transmission, protection of health systems and clear communication."},{"h":"Key public measures (2 lines):","t":"testing, isolation/quarantine, vaccination where available, hand hygiene, masking and targeted NPIs (microcontainment)."},{"h":"Health-system measures (1 line):","t":"triage/isolation, IPC, oxygen/bed surge and staff protection."},{"h":"Surveillance & One-Health (1 line):","t":"strengthen genomic surveillance and link with animal health for zoonoses."},{"h":"Conclusion (1 line):","t":"combine evidence-based NPIs, equitable social support and transparent communication to ensure effective, rightsrespecting outbreak control."}],"v":"df2870"}]},{"id":"immunity-and-vaccination","subj":"s06","name":"IMMUNITY AND VACCINATION","cards":[{"id":"immunity-and-vaccination:main#1","path":[],"part":[1,7],"rows":[{"sec":"<b><u>The Core Battleground: Immunity<\/u><\/b>"},{"t":"Immunity is the body’s defense matrix against pathogens (viruses, bacteria) and their toxins."}],"v":"da3ddd"},{"id":"immunity-and-vaccination:main#2","path":[],"part":[2,7],"table":1,"head":["Feature","Innate (Natural) Immunity","Adaptive (Acquired) Immunity"],"rows":[{"h":"<b>Origin<\/b>","t":"<span class=\"th\">Innate (Natural) Immunity<\/span> Present from birth.<br><span class=\"th\">Adaptive (Acquired) Immunity<\/span> Develops after exposure/vaccination."},{"h":"<b>Response<\/b>","t":"<span class=\"th\">Innate (Natural) Immunity<\/span> Immediate & Non-specific (attacks anything foreign).<br><span class=\"th\">Adaptive (Acquired) Immunity<\/span> Slow initial response, but Highly Specific."},{"h":"<b>Memory<\/b>","t":"<span class=\"th\">Innate (Natural) Immunity<\/span> No memory cells.<br><span class=\"th\">Adaptive (Acquired) Immunity<\/span> <b>Creates Memory Cells<\/b> (faster response next time)."},{"h":"<b>Components<\/b>","t":"<span class=\"th\">Innate (Natural) Immunity<\/span> Skin, stomach acid, macrophages, natural killer cells.<br><span class=\"th\">Adaptive (Acquired) Immunity<\/span> T-cells (Cell-mediated) & B-cells (Humoral/Antibodies)."}],"v":"d1b2aa"},{"id":"immunity-and-vaccination:main#3","path":[],"part":[3,7],"rows":[{"sec":"<u>Active vs. Passive Immunity (The Acquisition)<\/u>"},{"h":"Active Immunity (Your body does the work):","t":"The immune system generates its own antibodies and memory cells."},{"h":"Natural:","t":"Getting infected with measles and recovering."},{"h":"Artificial:","t":"Taking a vaccine. Provides long-term protection."},{"h":"Passive Immunity (Borrowed protection):","t":"Ready-made antibodies are given directly to the body. No memory cells are formed."},{"h":"Natural:","t":"Maternal antibodies passed through the placenta or breast milk."},{"h":"Artificial:","t":"Antiserum/Immunoglobulin therapy (e.g., Rabies or Snakebite antivenom). Provides immediate but short-term protection."}],"v":"34c7b8"},{"id":"immunity-and-vaccination:main#4","path":[],"part":[4,7],"table":1,"head":["Type","How it Works","Classic Examples","Pros / Cons"],"rows":[{"sec":"<u>The Vaccine Toolkit (How we trigger Active Immunity)<\/u>"},{"h":"<b>Live Attenuated<\/b>","t":"<span class=\"th\">How it Works<\/span> Weakened, harmless version of the live virus.<br><span class=\"th\">Classic Examples<\/span> BCG, OPV (Polio), MMR, Rotavirus.<br><span class=\"th\">Pros / Cons<\/span> <b>Pro:<\/b> Lifelong immunity.<br><br><br><b>Con:<\/b> Not for the immunocompromised."},{"h":"<b>Inactivated<\/b>","t":"<span class=\"th\">How it Works<\/span> Pathogen is killed via heat or chemicals.<br><span class=\"th\">Classic Examples<\/span> IPV (Polio), Rabies, Hepatitis A.<br><span class=\"th\">Pros / Cons<\/span> <b>Pro:<\/b> Very safe.<br><br><br><b>Con:<\/b> Needs booster doses."},{"h":"<b>Subunit / Recombinant<\/b>","t":"<span class=\"th\">How it Works<\/span> Uses only a specific piece (antigen) of the germ.<br><span class=\"th\">Classic Examples<\/span> Hepatitis B, HPV.<br><span class=\"th\">Pros / Cons<\/span> <b>Pro:<\/b> Extremely low side-effect risk."},{"h":"<b>Toxoid<\/b>","t":"<span class=\"th\">How it Works<\/span> Uses the <i>toxin<\/i> made by the germ, not the germ itself.<br><span class=\"th\">Classic Examples<\/span> Tetanus, Diphtheria.<br><span class=\"th\">Pros / Cons<\/span> <b>Pro:<\/b> Prevents toxin-based diseases."},{"h":"<b>mRNA<\/b>","t":"<span class=\"th\">How it Works<\/span> Gives cells genetic instructions to make a viral protein.<br><span class=\"th\">Classic Examples<\/span> COVID-19 (Pfizer/Moderna).<br><span class=\"th\">Pros / Cons<\/span> <b>Pro:<\/b> Rapid to develop and scale."}],"v":"3fba5e"},{"id":"immunity-and-vaccination:main#5","path":[],"part":[5,7],"table":1,"head":["Type","How it Works","Classic Examples","Pros / Cons"],"rows":[{"h":"Conjugate vaccine","t":"<span class=\"th\">How it Works<\/span> uses 2 specfic parts of a pathogen to enhance immune response<br><span class=\"th\">Classic Examples<\/span> eg zyvac TCV"},{"h":"recombinant vaccine","t":"<span class=\"th\">How it Works<\/span> small part of the disease causing bacterium or virus is used<br><span class=\"th\">Classic Examples<\/span> eg hepatitus B"},{"h":"ADFALCIVAX VACCINE","t":"<span class=\"th\">How it Works<\/span> Dual-Stage Targeting of Plasmodium falciparum (Deadliest malaria parasite Species): Unlike existing vaccines (RTS, S/AS01 (Mosquirix) and R21/Matrix-M) that target only one life stage; it targets two critical stages in parasite’s lifecycle i.e. Pre-erythrocytic (liver) stage and Transmission (sexual) stage."},{"h":"Oncolytic Vaccine Enteromix","t":"<span class=\"th\">How it Works<\/span> An Oncolytic vaccine uses oncolytic viruses (OVs) to directly kill cancer cells and stimulate an antitumor immune response.<br>Enteromix is based on a combination of fournon-pathogenic viruses that have the ability to destroy malignant cells and simultaneously activate the patient's antitumor immunity<br><span class=\"th\">Classic Examples<\/span> Personalized mRNA Vaccines"},{"h":"Self-amplifying mRNA (saRNA) Vaccine","t":"<span class=\"th\">How it Works<\/span> saRNA vaccines work by giving the body instructions to replicate mRNA needed to create the desired antigen<br><span class=\"th\">Classic Examples<\/span> potentially enhancing the immune response with lower doses compared to existing mRNA<br>vaccines."}],"v":"9271a8"},{"id":"immunity-and-vaccination:main#6","path":[],"part":[6,7],"rows":[{"sec":"<u>India’s Policy Push: High-Yield 2026 Updates (For Mains)<\/u>"},{"t":"If a question asks about the Universal Immunization Programme (UIP) or public health infrastructure, drop these immediate 2025-26 developments:"},{"h":"The Td Shift (Feb 2026):","t":"The Health Ministry officially replaced the legacy Tetanus Toxoid (TT) vaccine with the Td Vaccine (Tetanus & adult Diphtheria) in the UIP to broaden protection for adolescents and pregnant women."},{"h":"Nationwide HPV Rollout (March 2026):","t":"India launched a massive single-dose HPV vaccination campaign for 1.2 crore 14-year-old girls to eliminate cervical cancer. Currently utilizing Gardasil, the programme aims to eventually shift to India’s indigenous Cervavac."},{"h":"U-WIN Portal Integration:","t":"The digital registry for tracking vaccinations (similar to CoWIN) has now registered over 11 crore children. In 2026, it is being deeply integrated with the Ayushman Bharat Digital Mission (ABDM) and the POSHAN Tracker."},{"sec":"<u>Herd Immunity & Exam Answer Template<\/u>"},{"h":"Herd Immunity:","t":"When a critical mass of a population is immunized, the chain of transmission is broken, indirectly protecting those who cannot be vaccinated (e.g., newborns, immunocompromised"}],"v":"f2770a"},{"id":"immunity-and-vaccination:main#7","path":[],"part":[7,7],"rows":[{"sec":"global efforts"},{"t":"WHO member states held their first meeting of the Intergovernmental Working Group (IGWG) on the WHO Pandemic Agreement."},{"h":"UNIVERSAL IMMUNIZATION PROGRAMME (UIP) Coverage:","t":"Provides free immunization against 12 diseases"},{"t":"Under the National Rural Health Mission, the UIP has become a central component of India's public health efforts."},{"h":"Achievements:","t":"Polio-Free India and Neonatal tetanus elimination"},{"t":"WHO launched 3 By 35 Initiatives, aims to raise prices of any or all of three unhealthy products tobacco, alcohol, and sugary drinks by at least 50% through health taxes by 2035."}],"v":"542a98"},{"id":"immunity-and-vaccination:monoclonal-antibodies","path":["MONOCLONAL ANTIBODIES"],"rows":[{"t":"<b>Monoclonal antibodies (mAbs)<\/b> are laboratory-produced molecules engineered to act as substitute antibodies, designed to restore, enhance, or mimic the immune system's attack on disease-causing pathogens. Unlike naturally occurring antibodies, which are a diverse mix, mAbs are cloned from a single, specific white blood cell. This means they are designed to recognize and bind to one extremely specific target—known as an antigen—on the surface of a virus, bacteria, or cancer cell."},{"t":"This pinpoint accuracy has made them a cornerstone of modern precision medicine; they are widely used to flag cancer cells for destruction by the immune system, block the growth signals of tumors, neutralize infectious diseases, and manage autoimmune disorders by targeting specific inflammatory proteins."}],"v":"573714"}]},{"id":"anti-microbial-resistance","subj":"s06","name":"ANTI-MICROBIAL RESISTANCE","cards":[{"id":"anti-microbial-resistance:main","path":[],"rows":[{"t":"In 2023, approximately 1 in 6 bacterial infections worldwide was caused by antibiotic-resistant bacteria."},{"h":"India Related Finding:","t":"Around 41% of bloodstream infection reports came from China, India, and Pakistan combined."},{"t":"AMR occurs when bacteria, viruses, fungi, and parasites evolve to withstand the drugs designed to kill them."},{"h":"why threat ?","t":"Bacterial AMR was directly responsible for 1.27 million deaths in 2019, Resistant infections could cause an estimated $3 trillion in global GDP, Outpacing advances in modern medicine, Threat to Food Security, Spread of resistance genes: Creating a \"Silent Pandemic\", expected to cause over 39 million"},{"h":"national measures :","t":"Drugs and Cosmetics Rules, 1945: Antibiotics included in Schedule H1 (sold by only under registered medical professional), Red Line awareness campaign: Urging people not to use medicines marked with a red vertical line, National Action Plan on Antimicrobial Resistance 2.0 (2025-29):"},{"h":"global :","t":"WHO AWaRe (Access, Watch, Reserve): It is antibiotic book provides concise, evidence-based guidance"}],"v":"bec742"}]},{"id":"veterinary-and-animal-sciences-latest-de","subj":"s06","name":"Veterinary and Animal Sciences- latest developments.","cards":[{"id":"veterinary-and-animal-sciences-latest-de:main#1","path":[],"part":[1,3],"rows":[{"h":"AMR & One Health:","t":"The Policy Push"},{"h":"The Core Framework:","t":"<u>NAP-AMR 2.0 (2022-2026)<\/u>"},{"t":"India is currently in the late stages of the National Action Plan on AMR 2.0."},{"t":"The focus has shifted from “awareness” to “enforcement and surveillance” across three sectors: Human, Animal, and Environment."},{"h":"<u>One Health Integration<\/u>:","t":"Recognizing that antibiotic residues in poultry/dairy runoff lead to “Superbugs” in humans."},{"h":"Stewardship Drives:","t":"Moving beyond doctors to Veterinary Pharmacists and Feed Manufacturers to curb non-therapeutic use (growth promoters)."}],"v":"9b104b"},{"id":"veterinary-and-animal-sciences-latest-de:main#2","path":[],"part":[2,3],"rows":[{"sec":"The “3-Pronged” Alternative Strategy:"},{"h":"Preventative:","t":"Universal livestock vaccination (reducing the need for antibiotics)."},{"h":"Biological:","t":"Use of probiotics and bacteriophages."},{"h":"Biosecurity:","t":"Improved farm hygiene to stop infection at the source."},{"h":"Punjab Case Study:","t":"The “Ludhiana Model”"},{"h":"ADB-Funded Mission:","t":"A landmark collaboration where the Asian Development Bank (ADB) funded capacity-building for Punjab’s veterinary officers."},{"h":"Role of GADVASU:","t":"Guru Angad Dev Veterinary and Animal Sciences University acted as the knowledge partner, training vets on Diagnostic-led Prescription (testing before treating) rather than “blanket” antibiotic use."}],"v":"d754df"},{"id":"veterinary-and-animal-sciences-latest-de:main#3","path":[],"part":[3,3],"rows":[{"sec":"Animal Welfare & Climate Resilience"},{"sec":"The Climate-Livestock Paradox"},{"t":"Livestock is both a victim of climate change (heat stress) and a contributor (methane)."},{"h":"The Solution:","t":"Efficiency Gains. By using Genomic Selection to breed cows that produce more milk while eating less, we reduce the “Methane Intensity” (methane per liter of milk)."},{"h":"Heat-Tolerant Breeds:","t":"Focus on indigenous breeds (like Sahiwal in Punjab) that have natural thermoregulation genes compared to exotic Holsteins."},{"sec":"Welfare as a Trade Tool"},{"h":"Export Standards:","t":"To export buffalo meat or dairy to the EU/Middle East, India is aligning with OIE (World Organisation for Animal Health) standards on humane slaughter and “stress-free” transport."},{"h":"SOPs:","t":"Recent Ministry guidelines focus on “Shade-Water-Ventilation” protocols to prevent mass poultry mortality during Northwest India’s increasingly frequent heatwaves"}],"v":"f959e2"},{"id":"veterinary-and-animal-sciences-latest-de:one-health-mission","path":["ONE HEALTH MISSION"],"rows":[{"t":"A multi-sectorial initiative integrating human, livestock, wildlife and environmental health to strengthen coordinated surveillance, diagnostics and outbreak response"},{"h":"key pillar :","t":"R & D, clinical readiness, data integration, community engagement"},{"h":"need of the mission :","t":"Zoonotic Risk Mitigation, Pandemic Preparedness, Rise of Antimicrobial Resistance (AMR). Climate Change Impacts, Ecosystem Health"}],"v":"9e418c"}]},{"id":"trans-fat","subj":"s06","name":"TRANS-FAT:","cards":[{"id":"trans-fat:main#1","path":[],"part":[1,2],"rows":[{"sec":"<b>Key Findings of the Report<\/b>"},{"t":"The policies have improved the food environment for 46% of the world’s population (it was only 6% in 2018)."},{"t":"WHO’s ambitious target to fully eliminate trans-fat from the global food supply by the end of 2023 has not been fully met."},{"sec":"<b>About Fat<\/b>"},{"t":"Fatty acids, which are the building blocks of fat, are long chains of carbon and hydrogen atoms."},{"t":"Essential fatty acids are those needed by the human body that can only be obtained through food."},{"sec":"<b>About Trans-fat (or Trans-fatty Acids (TFA))<\/b>"},{"t":"They are considered the worst type of fats (bad fat)."},{"t":"<b>Types of Trans-fat (Natural (ruminant trans fats):<\/b> Occur naturally in meat and dairy and are not considered harmful and <b>Artificial:<\/b> Formed in an industrial process that adds hydrogen to vegetable oil, converting the liquid into a solid and resulting in partially hydrogenated oil (PHO)."},{"sec":"<b>Health Impacts<\/b>"},{"t":"<span class=\"lst\"><span class=\"li\">Raises the level of bad cholesterol and lowers the good cholesterol.<\/span><br><span class=\"li\">Linked to inflammation, overweight/obesity, high blood pressure, diabetes, etc.<\/span><\/span>"}],"v":"65f7ef"},{"id":"trans-fat:main#2","path":[],"part":[2,2],"rows":[{"sec":"<b>Steps Taken to Regulate Trans-fat<\/b>"},{"h":"<b>Initiative of FSSAI:<\/b>","t":"Trans-fat free logo, Heart Attack Rewind, Eat Right India Movement, etc."},{"t":"FSSAI capped the amount of trans fatty acids (TFA) in oils and fats to 3% for 2021 and 2% by 2022."},{"h":"<b>REPLACE action framework by WHO (2018):<\/b>","t":"Provides a strategic approach to eliminating industrially produced trans-fat from national food supplies."},{"sec":"<b>Challenges in Eliminating Trans-fat<\/b>"},{"h":"<b>High demand in the food industry:<\/b>","t":"Trans-fat is cheaper compared to its alternatives."},{"h":"<b>Poor enforcement of policies:<\/b>","t":"Many unregistered firms are using them in different ways."},{"h":"<b>Consumer preferences:<\/b>","t":"Growing inclination towards processed food poses a challenge for governments and health regulators."},{"sec":"<b>Way Forward to Reduce Use of Trans-fats<\/b>"},{"h":"<b>Policies:<\/b>","t":"Countries must strengthen enforcement mechanisms to qualify for the WHO Validation Certificate."},{"h":"<b>Healthier Alternative:<\/b>","t":"Partially Hydrogenated Oils (PHOs) in foods can be replaced by oils rich in Polyunsaturated Fatty Acids (PUFA). E.g., safflower, corn, sunflower, soybean, peanut, etc."}],"v":"ab5ceb"}]},{"id":"ultra-processed-food","subj":"s06","name":"ULTRA PROCESSED FOOD","cards":[{"id":"ultra-processed-food:main","path":[],"rows":[{"t":"They are industrial formulations, usually high in fat, sugar and salt (HFSS), containing cosmetic additives such as emulsifiers, stabilisers, colourants and flavouring agents. E.g., noodles, biscuits, chips etc."},{"t":"They are low in dietary fibre, protein and micronutrients and are designed for convenience, long shelf life and hyper-palatability."},{"h":"intiatives to minimize :","t":"Consumer Protection Act, 2019, FSSAI limits Trans fatty acids (TFA. Revised (2024) Dietary Guidelines"},{"h":"sol :","t":"Economic Survey 2025 proposed health tax on UPFs, stricter labelling, marketing restrictions., Recognise UPFs as a Public Health Risk, Front-of-Pack Warning Labels, Regulate Corporate Influence, Restrict UPFs in Public Institutions:"}],"v":"df7ac6"}]},{"id":"non-communicable-diseases","subj":"s06","name":"NON-COMMUNICABLE DISEASES","cards":[{"id":"non-communicable-diseases:main#1","path":[],"part":[1,4],"rows":[{"sec":"The Epidemic of Non-Communicable Diseases (NCDs) in India"},{"t":"<b>1. The Core Phenomenon: \"The Epidemiological Transition\"<\/b> India is undergoing a rapid epidemiological transition. Historically, the public health system was designed to fight communicable/infectious diseases (like TB, Malaria, and Cholera). Today, due to rapid urbanization, increased life expectancy, and changing lifestyles, the primary cause of mortality has aggressively shifted to NCDs, which now account for over 60% of all deaths in India."},{"t":"<b>2. The \"Big Four\" (and the Emerging Fifth)<\/b> According to the WHO, the NCD burden is primarily driven by four major disease groups:"},{"h":"<b>Cardiovascular Diseases (CVDs):<\/b>","t":"Heart attacks and strokes (the highest killer)."},{"h":"<b>Chronic Respiratory Diseases (CRDs):<\/b>","t":"Asthma and Chronic Obstructive Pulmonary Disease (COPD), severely exacerbated by India's air pollution crisis."},{"sec":"<b>Cancers.<\/b>"},{"h":"<b>Diabetes:<\/b>","t":"India is often referred to as the \"Diabetes Capital of the World.\""}],"v":"b55fb2"},{"id":"non-communicable-diseases:main#2","path":[],"part":[2,4],"rows":[{"sec":"DIABITIES AND ITS TYPES"},{"t":"Malnutrition-related diabetes has been officially recognized and named “type 5 diabetes”"},{"h":"Type 1:","t":"Autoimmune destruction of insulin-producing beta cells that prevents your pancreas from making insulin"},{"h":"Type 2:","t":"Mainly caused by obesity and over nutrition (Body does not use insulin well)."},{"h":"Gestational:","t":"Occurs with high blood glucose during pregnancy and can cause complications for bothmother and child"}],"v":"c3ab7b"},{"id":"non-communicable-diseases:main#3","path":[],"part":[3,4],"rows":[{"sec":"<i>(Note: Mental Health is increasingly being recognized as the critical fifth pillar of NCDs).<\/i>"},{"t":"<b>3. The Risk Factors<\/b> Examiners look for a clear distinction between what can and cannot be controlled:"},{"h":"<b>Modifiable Behavioral Risk Factors:<\/b>","t":"Diets high in trans fats, ultra-processed foods, free sugars, and sodium; physical inactivity; tobacco use; and harmful alcohol consumption."},{"h":"<b>Metabolic Risk Factors:<\/b>","t":"Raised blood pressure (hypertension), obesity, and raised blood glucose."},{"h":"<b>Non-Modifiable Risk Factors:<\/b>","t":"Age, genetics, and family history."},{"t":"<b>4. The Socio-Economic Impact (The Analytical Core)<\/b> This is where you earn your marks. The NCD epidemic is not just a health crisis; it is an economic one."},{"h":"<b>Threat to the Demographic Dividend:<\/b>","t":"Unlike in Western nations where NCDs primarily affect the elderly, in India, a massive percentage of NCD deaths occur prematurely (between the ages of 30 and 69). This strikes at the heart of India's working-age population, blunting its economic productivity."}],"v":"40ce70"},{"id":"non-communicable-diseases:main#4","path":[],"part":[4,4],"rows":[{"h":"<b>Catastrophic Health Expenditure:<\/b>","t":"NCDs require chronic, lifelong management. This leads to massive Out-Of-Pocket Expenditure (OOPE) for families. A sudden cancer diagnosis or stroke is one of the leading causes of families falling back below the poverty line."},{"h":"<b>Overburdening Infrastructure:<\/b>","t":"India's primary healthcare centers (PHCs) were traditionally geared toward maternal health and immunization. The NCD surge forces patients into already overcrowded tertiary care hospitals (like AIIMS or PGI) for advanced treatments like dialysis or chemotherapy."},{"t":"<b>5. Government Interventions (The Way Forward)<\/b> Always conclude with how the state is responding:"},{"h":"<b>NP-NCD:<\/b>","t":"The National Programme for Prevention and Control of Non-Communicable Diseases (recently renamed and expanded to include diseases like non-alcoholic fatty liver disease)."},{"h":"<b>Ayushman Bharat Health and Wellness Centres (AB-HWCs):<\/b>","t":"Shifting the focus to <i>preventive<\/i> care by conducting massive population-level screenings for hypertension, diabetes, and common cancers at the village level."},{"h":"<b>FSSAI Initiatives:<\/b>","t":"\"Eat Right India\" and strict regulations capping industrial trans fats at 2%."}],"v":"543016"}]},{"id":"obesity","subj":"s06","name":"OBESITY","cards":[{"id":"obesity:main#1","path":[],"part":[1,2],"rows":[{"sec":"<b>Why in the News?<\/b>"},{"t":"Prime Minister stated that in 2022, one in eight people globally is living with obesity, with cases among children and adolescents (5 to 19 years) having quadrupled."},{"sec":"<b>About Obesity<\/b>"},{"t":"Defined as an abnormal or excessive fat accumulation that presents a risk to health (World Health Organisation)."},{"t":"Body Mass Index (BMI) is used to classify obesity. BMI 30 or above is classified as obese."},{"sec":"<b>Status of Obesity in India as per NFHS-5 (2019-2021)<\/b>"},{"t":"Overall, 24% of women and 23% of men are overweight or obese."},{"t":"Child (under 5 years) overweight rates increased from 2.1% to 3.4% between 2015-16 and 2019-21."}],"v":"200fd3"},{"id":"obesity:main#2","path":[],"part":[2,2],"rows":[{"sec":"<b>Factors Driving Obesity in India<\/b>"},{"h":"High-Calorie, Low-Nutrient Diets:","t":"Increased consumption of refined carbohydrates, saturated fats, and easy access to processed foods."},{"h":"Sedentary Lifestyles:","t":"Long sitting hours, excessive screen time, minimal movement in daily routines, etc."},{"h":"Use of Genetically Modified Crops:","t":"Altered food composition, impacting metabolism and weight gain."},{"img":8},{"h":"drugs :","t":"The drug semaglutide, marketed under the brand name Wegovy, will be available in the form of injections."},{"t":"Semaglutide, works as an appetite suppressant by imitating a hormone called glucagon-like peptide-<br>1 (GLP-1)."},{"t":"recently its patent expired making it cheaper"},{"t":"GLP-1 is an intestinal hormone released after eating, and usually makes people feel fuller."}],"v":"e119d4"}]},{"id":"nanotech","subj":"s07","name":"NANOTECH","cards":[{"id":"nanotech:main#1","path":[],"part":[1,3],"rows":[{"sec":"Definition & Scope"},{"h":"Definition and Scope:","t":"Nanotechnology functions by manipulating matter at the atomic scale, based on the principle that a material’s properties—such as strength, conductivity, or durability—are determined by the precise arrangement of its atoms."},{"t":"Much like a car requires its individual parts to be correctly positioned to function, scientists engineer these atomic structures to optimize performance, eliminating flaws like brittleness or energy inefficiency."},{"t":"By working at this minute level, often tapping into unique quantum effects, researchers can create entirely new materials with advanced capabilities, ranging from shatter-proof glass to targeted drug delivery systems, effectively redesigning the building blocks of matter to solve complex problems."},{"h":"Formally :","t":"Nanotechnology involves the design, production, and application of materials and devices at the nanoscale (1-100 nm). It enables manipulation of atoms and molecules to create structures with novel properties.<br>India’s Position"},{"t":"Since 2016, India has maintained the 3rd position globally for scientific publications in nanoscience and technology<br>Sectoral Applications"},{"h":"Major Applications:","t":"Nanotechnology is used in diverse sectors like energy (efficient solar panels, battery tech), food (nanobiosensers pathogen detection), water management (nano enabled reverse osmosis advanced filtration), electronics (carbon nanotubes can replace silicon in semiconductors), health (nanomedicines, diagnostics), and environment (pollutant detection).<br>Policy Support"},{"h":"Key Initiatives:","t":"Indian government has launched schemes such as the Nano Science and Technology Initiative (NSTI, 2002). (to promote R&D in nanotech) and the Mission on Nano Science and Technology (Nano Mission, 2007) and nano science and tech in punjab (1st)."},{"sec":"Key Concerns"},{"h":"Challenges :","t":"Health & Environmental Concerns: Nanoparticles can cause acute inflammatory reactions, Lack of Skilled Workforce: Low enrollment in nanotechnology education, High Costs and Limited Private Sector Participation, Ethical Issues: Potential misuse, such as in warfare and privacy invasion"},{"img":9}],"v":"8bbc63"},{"id":"nanotech:main#2","path":[],"part":[2,3],"rows":[{"sec":"NANOTECH IN AGRICULTURE  Innovations"},{"t":"Applications Nanotechnology can be applied to agriculture in various ways, including creating nano-fertilizers and nano-pesticides that reduce toxicity and improve nutrient uptake. It is also used in food processing through <u>nano emulsions <\/u>to extend shelf-life and in edible coatings to reduce post-harvest losses. Nanotechnology also helps in crop breeding by enabling precise gene manipulation at the nanoscale<br>Implementation Barriers"},{"h":"Challenges :","t":"The implementation of nanotech in agriculture faces several challenges, such as the high cost of technology, with agricultural drones costing between Rs 4-5 lakh, low digital literacy, fragmented landholdings Government Programs"},{"h":"Initiatives:","t":"National Agricultural Innovation Project (NAIP) (initiated projects to explore nanotech applications in this sector) + Indian Council for Agriculture Research (ICAR) conducts skill development programs, and IFFCO has established a Nano Fertilizer Plant (NFP) in Phulpur, Prayagraj"},{"sec":"NANOTECH IN HEALTHCARE  Medical Advances"},{"t":"Nanotech is used in clinical investigations, such as using gold nanoparticles to detect specific nucleic acid sequences, and for creating potential cancer treatments. It also provides better imaging tools for earlier disease diagnosis and personalized treatment. In drug delivery, nanotech materials can protect drugs from degradation and control their release. Furthermore, it assists in gene sequencing by helping to design and engineer advanced nanopore (A nanopore is an extremely small hole, only a few nanometers in size. This can be a natural protein channel, like those found in cell membranes) materials<br>Risks & Strategy"},{"h":"Challenges :","t":"free radicals (They are molecules that can cause harm to body cells when created by certain nanoparticles, such as those made of cobalt and chromium) can harm body cells + acute inflammatory reaction as the immune system identifies them as “invader” particles + high cost of development and implementation"},{"t":"Way forward is meticulous design and frequent trails + dedicated authority"}],"v":"f1bce7"},{"id":"nanotech:main#3","path":[],"part":[3,3],"rows":[{"sec":"NANOTECH IN DEFENCE"},{"sec":"Military Applications"},{"h":"Nano-Sensors:","t":"These sensors are used to detect chemical and biological weapons. Nano-devices can also be used to detect or decrease radioactivity"},{"h":"Body Armor:","t":"Nanoparticles of silicon dioxide are used in a liquid polymer that hardens on ballistic impact, a technology known as Shear Thickening Fluid"},{"h":"Advanced Weapons/Equipment:","t":"Nanotechnology is being used to modify materials like aluminum so it performs like titanium but without the added weight"},{"h":"Health Aid:","t":"Nanomedicines and nano-bandages are being developed for wound healing"},{"sec":"<b><u>Ethical & Security Concerns<\/u><\/b>"},{"h":"Challenges :","t":"Nanowars: The widespread availability of nano-weapons could lead to a new age of destruction, also referred to as “nanowars” + Misuse: These devices could be used for criminal activity and terrorist attacks + Regulation: The development of medical applications to improve soldier performance requires careful regulation"}],"v":"b0b454"}]},{"id":"graphene","subj":"s07","name":"GRAPHENE","cards":[{"id":"graphene:main","path":[],"rows":[{"sec":"Material Properties"},{"h":"Meaning :","t":"Graphene is an allotrope of carbon, discovered in 2004 by Geim and Novoselov. It is a single, 2D layer of carbon atoms arranged in a hexagonal lattice. Its production methods include Chemical Vapor Deposition, graphite cleavage, exfoliation, and hydrogen arc discharge. China and Brazil are the leading producers, with India producing about onetwentieth of China’s output."},{"h":"Characteristics :","t":"Graphene possesses several key properties that make it a highly valuable material. It is exceptionally strong, being 200 times stronger than steel, yet it is also six times lighter. Graphene is transparent, as it absorbs only 2.3% of light, which is ideal for displays and solar cells. It is also impermeable, blocking all gases including hydrogen and helium. The material exhibits unique quantum effects, useful in fields like metrology and quantum computing"},{"sec":"Industrial Uses"},{"h":"Uses :","t":"In electronics, it can be used to create faster and more efficient semiconductors, potentially replacing silicon. It is also used in nanoporous membranes for water filtration and desalination. In the biomedical field, it finds use in tissue engineering, drug delivery, and biosensors. Graphene can enhance energy storage through its use in high-capacity batteries and supercapacitors. For environmental purposes, its ability to absorb liquids makes it useful for cleanup. In defense, its strength makes it suitable for armor and ballistic protection"},{"sec":"Indian Initiatives & Hurdles"},{"h":"Intiatives:","t":"Graphene-Aurora program aims to bridge the gap between research and development (R&D) and commercialization + India Innovation Centre for Graphene (IICG) has been set up in Kerala + India Graphene Engineering and Innovation Centre (IGEIC) was launched under the vision of Viksit Bharat@2047"},{"h":"Challenges:","t":"The main challenge to its commercialisation is the adoption rate and the fact that silicone just works and the market doesn’t easily displace something that works for something that is 50% better it should be better in all respects not to say that it hasn’t come far from its discovery in 2004, companies like vorbeck materials + high cost + manuf integration + lack of standardisation"}],"v":"54d8f6"}]},{"id":"nanozymes","subj":"s07","name":"NANOZYMES","cards":[{"id":"nanozymes:main","path":[],"rows":[{"t":"Nanozymes are a class of nanomaterials that possess intrinsic, enzyme-like catalytic activity, effectively acting as stable and low-cost artificial enzymes."},{"t":"Unlike natural enzymes, which are fragile proteins sensitive to temperature and pH , nanozymes (often made of metal oxides, noble metals, or carbon materials) are highly robust, durable, and easier to manufacture."},{"t":"They work by mimicking the function of natural enzymes, such as peroxidase or catalase, to speed up chemical reactions, which has led to a surge in applications, including developing highly sensitive biosensors for medical diagnostics, creating new therapies for diseases by regulating oxidative stress, degrading environmental pollutants, and acting as potent antibacterial agents."}],"v":"34cbe8"}]},{"id":"space-economy-significance","subj":"s08","name":"SPACE ECONOMY & SIGNIFICANCE","cards":[{"id":"space-economy-significance:general","path":["general"],"rows":[{"t":"India’s space economy is valued at $8.4 billion aims to grow this to $44 billion by 2033,, making up 2% of the global space market. It has significantly contributed to the nation’s economy and job growth, with a contribution of 20,000 crore to GDP in the last decade and the creation of 96,000 jobs"},{"t":"India’s space program is crucial for national security and has significant socioeconomic benefits. It plays a key role in digitization through systems like NavIC (Navigation with Indian Constellation), which provides India with a regional navigation system and ensures self-reliance. Additionally, missions like Chandrayaan-3 and Earth Observation Satellites (EOS-08) contribute to scientific research and disaster management. + Swavimta scheme leverages satellites for transparent land record + Space diplomacy (NASA-ISRO convergence on NISAR)"},{"t":"Space for Viksit Bharat 2047 (Lok Sabha held a special discussion on it) : every sector problem has a space solution → Agriculture (erratic monsoon, poor crop forecasting) : INSAT-3D/3DR for weather forecasting + Resourcesat for crop monitoring and yield estimation + Infrastructure : PM Gati Shakti uses ISRO imagery & spatial tools to integrate Bharatmala, Sagarmala, railways + Disaster : ISRO's Disaster Management Support (DMS) Programme (real-time monitoring, early warning, post-disaster assessment) + Education : EDUSAT (distance education broadcasting) + Transparency : geo-tagging of MGNREGA assets (stops leakages) + Water : Bhuvan–SRISHTI geoportal monitors watershed (IWMP) projects"},{"h":"Space makes India Vishwabandhu :","t":"NISAR = \"India's scientific handshake with the world\" + Regional leadership : South Asia Satellite (GSAT-9) for South Asia (except Pakistan) + Data sharing : Chandrayaan-3 datasets open on PRADAN (Policy based data Retrieval, Analytics, Dissemination and Notification system) + Capacity building : UNNATI (UNispace Nanosatellite Assembly & Training by ISRO) trains other countries on nanosatellites + Humanitarian : ISRO is a member of COSPAS–SARSAT (international satellite-based search and rescue system)"},{"h":"Reasons of success :","t":"bottom up approach + Despite having limited resources, ISRO has achieved remarkable success through cost-effective, indigenous missions. For example, the Mars Orbiter Mission cost only $74 million, a fraction of NASA’s mission budget. About 95% of space components in Indian rockets are indigenously developed. Partnerships and collaborations with other space agencies like ESA and CNES have also been a key to its success"}],"v":"544355"},{"id":"space-economy-significance:space-challenges","path":["SPACE CHALLENGES"],"rows":[{"t":"The sector still faces several challenges, including a heavy dependence on imported components like semiconductors. The absence of an Indian Space Quality Standard can lead to inconsistencies and reduced trust in domestically produced parts. The space program also faces increasing competition from private companies globally and a shortage of skilled workforce to meet the demands of an expanding program"}],"v":"7ab495"},{"id":"space-economy-significance:future-missions","path":["FUTURE MISSIONS"],"rows":[{"t":"India’s key future space missions include Chandrayaan-4, which aims to bring rock and soil samples back from the moon; the Gaganyaan Mission, India’s first human spaceflight; the Bharatiya Antariksh Station, a planned space station to be operational by 2035 ; the Venus Orbiter Mission (Shukrayaan) to study Venus’s atmosphere; and the Lunar Polar Exploration Mission in collaboration with JAXA to explore the Moon’s South Pole region"}],"v":"91fcbd"},{"id":"space-economy-significance:privatization-in-space","path":["PRIVATIZATION IN SPACE"],"rows":[{"t":"India’s space economy is projected to grow significantly, reaching a valuation of $50 billion and a 10% share of the global commercial space economy by 2030 , largely driven by privatization, Could free up ISRO for more R&D type stuff + privatisation will keep ISRO competitive. How aims to achieve this ? IN-SPACe, an autonomous agency, was established to support private players. & New Space India Limited (NSIL) handles ISRO’s commercial activities and 100% FDI in manufacturing components but it is plagues because of multiplicity of regulations + risky nature of industry and limited access to launch vehicles"},{"t":"Pixxel successfully launched three new Firefly satellites aboard the SpaceX NAOS Falcon 9 mission completing the first phase of its commercial constellation."},{"t":"PixxelSpace India-led Consortium has won the IN-SPACe proposal to build India’s first fully indigenous commercial Earth Observation Satellite System (EOSS) under PPP model"}],"v":"faff01"},{"id":"space-economy-significance:key-projects-technologies-related-to-spa#1","path":["KEY PROJECTS & TECHNOLOGIES RELATED TO SPACE"],"part":[1,4],"rows":[{"t":"(eg subhanshu Shukla in AXIOM-4) ( 4th private astronaut mission (NASA + ISRO + AXIOM) (India, Poland, and Hungary.) ( aims to achieve via this mission :"},{"h":"Crop growth:","t":"Study impact of microgravity on 6 crop seed varieties for future space farming"},{"t":"<span class=\"lst\"><span class=\"li\">Cyanobacteria ( Cyanobacteria are aquatic bacteria that can photosynthesize): Observe growth and activity<\/span><br><span class=\"li\">Space Microalgae (potential as food)<\/span><br><span class=\"li\">myogensis (muscle loss study )<\/span><\/span>"},{"t":"development of gqgayaan’s mission ( will use GSLV MARK III (3 stage rocket ( 2 solid fuel booster (Solid propellant (solid rocket fuel) is a mixture of fuel + oxidizer bound together in a solid grain. Once ignited, it burns in a controlled way, producing hot gases expelled through a nozzle to generate thrust)"},{"h":"2 nd stage :","t":"2 liquid fuelled Vikas 2 engine"},{"h":"3rd stage :","t":"CE-20 indigenous cryogenic engine (liquid H2 and O2 as fuel) t
