ywords FAME"},{"sec":"FAME I (2015)"},{"sec":"Focused on:"},{"t":"<span class=\"lst\"><span class=\"li\">EV technology<\/span><br><span class=\"li\">pilot projects<\/span><\/span>"},{"sec":"FAME II (2019-2024)"},{"t":"<b>₹10,000 crore<\/b>","h":"Budget:"},{"sec":"Targets included:"},{"t":"<span class=\"lst\"><span class=\"li\">7,000 e-buses<\/span><br><span class=\"li\">5 lakh e-3-wheelers<\/span><br><span class=\"li\">10 lakh e-2-wheelers<\/span><br><span class=\"li\">55,000 electric cars.<\/span><\/span>"}],"title":"FAME I and II","id":"electric-vehicles:gov-fame-i-and-ii","v":"f5fa62"},{"path":["PM E-DRIVE Scheme (2024)"],"roles":["gov"],"rows":[{"t":"<b>₹10,900 crore<\/b>","h":"Budget:"},{"sec":"Focus:"},{"t":"<span class=\"lst\"><span class=\"li\">electric buses<\/span><br><span class=\"li\">trucks<\/span><br><span class=\"li\">ambulances<\/span><br><span class=\"li\">charging infrastructure<\/span><br><span class=\"li\">battery manufacturing.<\/span><\/span>"},{"sec":"PLI for Advanced Chemistry Cell Batterie","tg":1},{"sec":"Goal:"},{"t":"build <b>50 GWh battery manufacturing capacity<\/b>."},{"sec":"what are ACC","tg":1},{"t":"<b>Advanced Chemistry Cell (ACC) batteries<\/b> are <b>next-generation rechargeable batteries that store electrical energy using advanced chemical technologies<\/b>."},{"t":"<span class=\"lst\"><span class=\"li\">Lithium-Ion Batteries (Most Common)<\/span><br><span class=\"li\">Solid-State Batteries (Next Generation)<\/span><br><span class=\"li\">Sodium-Ion Batteries<\/span><br><span class=\"li\">Lithium-Sulfur Batteries<\/span><br><span class=\"li\">Metal-Air Batteries<\/span><\/span>"}],"title":"PM E-DRIVE Scheme (2024)","id":"electric-vehicles:gov-pm-e-drive-scheme-2024","v":"556bc8"}]},{"id":"hydrogen-production","subj":"s11","name":"HYDROGEN PRODUCTION","cards":[{"path":[],"roles":["tbl"],"rows":[{"h":"<b>Green<\/b>","t":"<span class=\"th\">Source Material<\/span> Water<br><span class=\"th\">Production Process<\/span> Electrolysis (Renewable power)<br><span class=\"th\">Carbon Emissions<\/span> Zero"},{"h":"<b>Blue<\/b>","t":"<span class=\"th\">Source Material<\/span> Natural Gas<br><span class=\"th\">Production Process<\/span> SMR + Carbon Capture (CCS)<br><span class=\"th\">Carbon Emissions<\/span> Low"},{"h":"<b>Grey<\/b>","t":"<span class=\"th\">Source Material<\/span> Natural Gas<br><span class=\"th\">Production Process<\/span> Steam Methane Reforming (SMR)<br><span class=\"th\">Carbon Emissions<\/span> High"},{"h":"<b>Black/Brown<\/b>","t":"<span class=\"th\">Source Material<\/span> Coal / Lignite<br><span class=\"th\">Production Process<\/span> Gasification<br><span class=\"th\">Carbon Emissions<\/span> Very High"},{"h":"<b>Pink<\/b>","t":"<span class=\"th\">Source Material<\/span> Water<br><span class=\"th\">Production Process<\/span> Electrolysis (Nuclear power)<br><span class=\"th\">Carbon Emissions<\/span> Zero"},{"h":"<b>Turquoise<\/b>","t":"<span class=\"th\">Source Material<\/span> Natural Gas<br><span class=\"th\">Production Process<\/span> Methane Pyrolysis<br><span class=\"th\">Carbon Emissions<\/span> Solid Carbon (No $CO_2$)"}],"table":1,"head":["Hydrogen Type","Source Material","Production Process","Carbon Emissions"],"id":"hydrogen-production:tbl-main","v":"7a7fd6"}]},{"id":"hyperloop-technology","subj":"s11","name":"HYPERLOOP TECHNOLOGY","cards":[{"path":[],"roles":["def","how"],"rows":[{"t":"he technology significantly builds on “gravity vacuum tube,” “gravity vacuum transit,” or “high-speed tube transportation. meaning : there’s a magnetic levitation (maglev) train system that uses one set of magnets to repel cars so that they hover above a track and another set of magnets to propel them forward over the track."},{"t":"It enables the theoretical speed of 1,200 km/h."},{"img":19}],"title":"Technology Overview","id":"hyperloop-technology:def-technology-overview","v":"054333"},{"path":[],"roles":["use","issue"],"rows":[{"t":"High Speed: Over 1000 km/h, Eliminates human error, 10-30 sec intervals arrival, Less affected by weather, Easier tunnels, smaller stations, Carries large containers, cuts truck emissions, 2-3 times more efficient, uses maglev and low-pressure design, stores electricity","h":"Adv :"},{"sec":"Implementation Challenges"},{"t":"~$25-$27 million per mile (excluding land costs) as per NASA, Fire inside pods is a major risk despite fire-resistant tubes, Vacuum Maintenance, Lateral/vertical acceleration >2 m/s² can cause motion sickness.","h":"Issues :"}],"title":"Advantages","id":"hyperloop-technology:use-advantages","v":"b282f4"}]},{"id":"desalination-technology","subj":"s11","name":"DESALINATION TECHNOLOGY","cards":[{"path":[],"roles":["news","how"],"rows":[{"t":"Recently IIT Madra developed a graphene based desalination tech : Freshwater scarcity is a growing global issue, with less than 0.05% of water easily accessible, making desalination an important solution.","h":"IIT Madras graphene-based tech:"},{"t":"IIT Bombay researchers have developed a DualSided Superhydrophobic Laser-Induced Graphene (DSLIG) Evaporator that improves solar desalination by combining solar and electric heating to maintain consistent temperatures and using superhydrophobic surfaces to prevent salt buildup, enhancing efficiency. Made from a layered polymer and laser-engraved graphene, DSLIG can treat highly saline water and industrial wastewater, with performance improving when multiple evaporators are stacked."},{"t":"Its low carbon footprint, cost-effectiveness, and durability make it promising for large-scale sustainable desalination, though further field testing and funding are needed before industrial deployment."}],"title":"IIT Bombay Innovation","id":"desalination-technology:news-iit-bombay-innovation","v":"3f6367"},{"path":[],"roles":["how","fix"],"rows":[{"t":"Desalination converts seawater or brackish water into fresh water, addressing the global shortage where only 0.06% of water is easily accessible.","h":"General Desalination:"},{"t":"IIT Bombay scientists developed a lotus leaf-inspired hydrophobic graphene solar evaporator that uses sunlight to efficiently evaporate water."},{"t":"thermal methods (flash or multi-effect evaporation) heat water to collect vapor, effective for highsalinity seawater but costly, and membrane methods (reverse osmosis, electrodialysis) filter water, are eco-friendlier, but may face fouling and incomplete TDS removal. Examples include Lakshadweep’s Low Temperature Thermal Desalination and Nemmeli RO Plant, Tamil Nadu.","h":"Two main approaches exist:"},{"t":"Scalable deployment, supportive policies, and ongoing research are key to ensuring equitable access to clean water."}],"title":"General Approaches","id":"desalination-technology:how-general-approaches","v":"4519df"}]},{"id":"biochemical-oxygen-demand","subj":"s11","name":"BIOCHEMICAL OXYGEN DEMAND","cards":[{"path":[],"roles":["def"],"rows":[{"t":"Biochemical Oxygen Demand (BOD) is a measure of the amount of dissolved oxygen that aerobic bacteria (microorganisms that need oxygen to live) consume to break down organic matter in a sample of water. BOD is one of the most common ways to gauge the quality of water, especially in rivers, lakes, and wastewater treatment plants."},{"t":"A high BOD level means there is a lot of organic pollution (like sewage, manure, or industrial waste) in the water. Bacteria will multiply rapidly to feed on this waste, consuming a large amount of the water’s dissolved oxygen in the process. This “robs” fish, plants, and other aquatic organisms of the oxygen they need to survive, which can lead to “dead zones.”","h":"High BOD (Bad):"},{"t":"A low BOD level indicates that the water is clean and contains little organic waste. This means there is more dissolved oxygen available for a healthy, balanced aquatic ecosystem","h":"Low BOD (Good):"}],"id":"biochemical-oxygen-demand:def-main","v":"83dfa3"}]},{"id":"intellectual-property-rights-ipr","subj":"s12","name":"Intellectual Property Rights (IPR)","cards":[{"path":[],"roles":["def"],"rows":[{"t":"IPR are the rights given to persons over the creations of their minds. They usually give the creator an exclusive right over the use of his/her creation for a certain period of time.","h":"Definition:"},{"t":"8 types of IPR are covered under IPR Policy Management (IPRPM) framework: (i) Patents, (ii) Trade mark, (iii) Industrial Designs, (iv) Copyrights, (v) Geographical Indications, (vi) Semiconductor Integrated Circuit Layout Design, (vii) Trade Secret, and (viii) Plant Varieties."},{"t":"Controller General of Patents, Designs and Trademarks which is under the control of the Department of Industrial Policy and Promotion (DIPP), Ministry of Commerce and Industry.","h":"Administered by:"},{"t":"Act on Layout-Design of Integrated Circuits is administered by Ministry of Electronics and Information Technology (MeitY)."},{"t":"Ministry of Agriculture administers the Act on Plant Variety"}],"id":"intellectual-property-rights-ipr:def-main","v":"7e7ab1"},{"path":[],"roles":["news"],"rows":[{"t":"India’s Intellectual Property (IP) filings rose by 44% in the last 5 years, led by a 380% surge in Geographical Indications.","h":"Why in the news?"},{"sec":"Reasons for Increase in IP Boom"},{"t":"Legal & Procedural Simplification of IP laws & rules: E.g. Patent examination timeline reduced from 48 months to 31 months and mandatory e-submission for patent documents."},{"t":"IP offices have been digitised with a comprehensive e-filing system, leading to over 95% of applications being filed online.","h":"Modernisation of IP Offices:"},{"h":"International standards:","t":"E.g. adoption of international classification under Locarno Agreement for Industrial Designs. Locarno Agreement is an international agreement under the World Intellectual Property Organisation (WIPO) signed in 1968."},{"t":"E.g. SPRIHA Scheme aims to integrate IPR education into higher learning institutions across the country.","h":"Awareness & Capacity Building:"},{"t":"To recognise and reward the top achievers for their IP creations and commercialisation.","h":"National Intellectual Property (IP) Awards:"},{"t":"Fee Concessions ( 10% fee reduction for online filings), Digital initiatives (IP Sarthi Chatbot for applicant support and IP Dashboard to provide real-time IP data), and use of AI and Machine Learning, etc.","h":"Other:"},{"img":20}],"title":"IPR","id":"intellectual-property-rights-ipr:news-ipr","v":"72573c"},{"path":[],"roles":["tbl"],"rows":[{"t":"Details of legal and regulatory considerations for different IP areas:"},{"h":"Geographical Indication (GI)","t":"<span class=\"th\">Subject<\/span> Goods      bearing       unique characteristics     due     to geographical linkage - agricultural goods, natural goods, manufactured goods, handicrafts and foodstuff.<br><span class=\"th\">Legal Provision<\/span> Geographical Indications Act 1999 & GI Rules 2002 amended in 2020.<br><span class=\"th\">Term of Protection<\/span> 10 years, Renewed for 10 years on payment of additional fees"},{"h":"Design","t":"<span class=\"th\">Subject<\/span> New or original designs<br>(Ornamental / visual appearance discernible to the human eye) which can be replicated industrially.<br><span class=\"th\">Legal Provision<\/span> The Design Act, 2000 & Designs (Amendment) Rules 2021<br><span class=\"th\">Term of Protection<\/span> 10 + 5 years"},{"h":"Patents","t":"<span class=\"th\">Subject<\/span> Must qualify requirements of being novel, Inventive and having industrial utility.<br><span class=\"th\">Legal Provision<\/span> The Patents Act, 1970 & Patent Rules, 2003 (Amended in 2014, 2016, 2017, 2019, 2020 and 2021)<br><span class=\"th\">Term of Protection<\/span> 20 years"},{"h":"Copyright","t":"<span class=\"th\">Subject<\/span> Creative, artistic, literary, Musical and audio-visual works<br><span class=\"th\">Legal Provision<\/span> The Copyrights Act, 1957 &Copyrights Rules 2013 amended in 2021.<br><span class=\"th\">Term of Protection<\/span> Author- Lifetime+ 60 years;<br>Producers - 60 years<br>Performers- 50 years;"},{"h":"Trademarks","t":"<span class=\"th\">Subject<\/span> Protects    brand    name, logo, and design for a business or commercial enterprise.<br><span class=\"th\">Legal Provision<\/span> The Trade Marks Act, 1999 & Trademark Rules 2017<br><span class=\"th\">Term of Protection<\/span> 10 years; renewed for 10 years  on payment      of additional fees"},{"h":"Semiconductor Integrated Circuits Layout-Designs (SICLD)","t":"<span class=\"th\">Subject<\/span> A layout of transistors and other circuitry elements including lead wires connecting such elements and expressed in any manner in semiconductor integrated circuits.<br><span class=\"th\">Legal Provision<\/span> The Semiconductor Integrated Circuits Layout- Design Act, 2000 & Rules, 2001.<br><span class=\"th\">Term of Protection<\/span> 10 years"},{"h":"Trade Secret","t":"<span class=\"th\">Subject<\/span> Confidential information having commercial value.<br><span class=\"th\">Legal Provision<\/span> Common Law approach (covered through Contract Act, IP Act, and Copyright etc.)<br><span class=\"th\">Term of Protection<\/span> Till the time confidentiality is safeguarded."},{"h":"Plant Varieties","t":"<span class=\"th\">Subject<\/span> Traditional varieties and landraces, all developed varieties (non-traditional and non-landrace) in trade/use for older than 1 year and not older than 15 years or 18 years (in case of trees and vines), and new plant varieties.<br><span class=\"th\">Legal Provision<\/span> Protection of Plant Varieties and Farmers Rights Act (PPVFRA), 2001<br><span class=\"th\">Term of Protection<\/span> 6-10 years."}],"table":1,"head":["IPR Area","Subject","Legal Provision","Term of Protection"],"id":"intellectual-property-rights-ipr:tbl-main","v":"efe1f7"},{"path":[],"roles":["issue"],"rows":[{"t":"India spends a mere 0.7% of its GDP on R&D, significantly lower than countries like China (2.1%) and Brazil (1.3%).","h":"Low Research and Development (R&D) Spending:"},{"h":"Patent Disputes and Evergreening:","t":"The pharmaceutical sector often faces issues related to patent evergreening, where companies make minor modifications to existing drugs to extend their patent life. Section 3(d) of the Patents Act, 1970, prevents this, leading to disputes with multinational corporations."},{"h":"Compulsory Licensing Concerns:","t":"In the pharmaceutical sector, the government can allow the production of patented products (e.g., medicines) without the patent holder’s consent While this ensures access to essential medicines, it has led to tensions with global pharmaceutical companies."},{"h":"IP Financing in Nascent Stage:","t":"Due to lack of awareness, complexities in IP valuation, reliance on traditional tangible assets, and vulnerability of IP as collateral. IP financing is the use of IP assets (trade marks, design rights, patents and copyright) to gain access to credit."},{"t":"Unlike countries like the USA, India lacks a clear provision for marking products as “patent pending,” which could deter competitors and act as a marketing tool.","h":"Ambiguity of “Patent Pending” Status:"},{"t":"Delays in IPR Granting and Backlog, Weak Enforcement of IPR Laws, Commercialization Gap (High filings don’t guarantee successful market-ready products) etc.","h":"Other:"}],"title":"Challenges related to IPR in India:","id":"intellectual-property-rights-ipr:issue-challenges-related-to-ipr-in-india","v":"086b8b"},{"path":[],"roles":["fix"],"rows":[{"t":"To address new and emerging trends in innovation, identify implementation gaps, and incorporate changes for expanding innovation ecosystem and IP financing.","h":"Holistic Review of National IPR Policy:"},{"t":"To formulate and implement their own IPR policies, focusing on awareness, innovation in educational institutions, establishing State-level Innovation Councils, and curbing IP crimes.","h":"Strengthen State Government Participation:"},{"t":"Improve coordination between law enforcement, customs, and IP offices and provide specialized IPR training. Establish more specialized IPR courts with technically trained judges.","h":"Strengthening Enforcement Mechanisms:"},{"t":"Establish a dedicated IP fund to support initiatives fostering IP culture in remote and traditional knowledge-rich regions, such as tribal belts, hilly, and North-East states.","h":"Create IP Fund:"},{"t":"Enhancing International Collaboration e.g. Cooperate with global IP bodies (e.g., WIPO) and adopt best practices."},{"t":"Ensuring that trade agreement’s IP provisions balance innovation, public health, and national interest."},{"t":"Promoting Innovation & Research through R&D incentives (tax breaks, grants), Strengthening Cyber security & Digital IPR Protection to combat online piracy, enhance IP awareness through educational initiatives etc.","h":"Other:"}],"title":"Way Forward","id":"intellectual-property-rights-ipr:fix-way-forward","v":"fe10fc"}]},{"id":"2024-nobel-medicine","subj":"s13","name":"2024 NOBEL MEDICINE","cards":[{"path":[],"roles":["news"],"rows":[{"t":"In 2024, the Nobel Prize in Medicine went to Victor Ambrose and Gary Ruvkun for discovering microRNAs-tiny RNA molecules that control gene expression after transcription (when DNA is copied into mRNA) but before translation (when mRNA is used to make proteins)."},{"t":"By binding to specific mRNAs, microRNAs block protein production, adding a new layer of control to the usual DNA → transcription → mRNA → translation → protein process. They help explain how cells with the same DNA can become different types (like muscle or skin), and when they malfunction, they can cause diseases like cancer."},{"t":"This discovery has opened the door to treatments that target or mimic these molecules, offering hope for curing illnesses and aiding tissue regeneration.<br>Key Processes"},{"t":"Transcription → The process where a gene’s DNA sequence is copied into messenger RNA (mRNA)."},{"t":"Translation → The process where mRNA is read by ribosomes to build a protein."}],"title":"Discovery Overview","id":"2024-nobel-medicine:news-discovery-overview","v":"902a93"}]},{"id":"2024-nobel-chemistry","subj":"s13","name":"2024 NOBEL CHEMISTRY","cards":[{"path":[],"roles":["news"],"rows":[{"t":"Proteins are chains of amino acids that fold into specific 3-dimensional shapes - and those shapes decide what the protein does in the body.","h":"David Baker’s finding :"},{"t":"David Baker showed that instead of waiting for nature, we can design useful proteins from scratch: use computer models to pick an amino-acid sequence that should fold into a desired shape, write the matching artificial gene, put that gene into bacteria to produce the protein, then test and refine it in the lab (1st one was ‘Top7’ in 2003.)."},{"t":"His approach (using computational design tools like Rosetta plus experimental validation) turned computer blueprints into real molecules and produced entirely new enzymes, therapeutic candidates, vaccine components, nanomaterials and biosensors that didn’t exist in nature and use in industries like healthcare, pharmacy etc."},{"t":"Knowing a protein’s 3D shape is crucial because structure = function, but finding that shape from the sequence used to be slow and difficult. Demis Hassabis and John Jumper built AlphaFold 2, a deep-learning AI that learned how sequences map to shapes by training on thousands of known structures; given just an aminoacid sequence it now predicts the protein’s 3D structure with nearexperimental accuracy in hours or minutes.","h":"Demis Hassabis and John Jumper :"},{"t":"That dramatic speed and accuracy lets researchers find structures for millions of proteins, accelerate drug and vaccine work, and, together with design methods like Baker’s, both read nature’s designs and write new ones","cont":1}],"title":"Protein Design Breakthrough","id":"2024-nobel-chemistry:news-protein-design-breakthrough","v":"ff6ad5"}]},{"id":"2025-nobel-medicine","subj":"s13","name":"2025 NOBEL MEDICINE","cards":[{"path":[],"roles":["pic"],"rows":[{"t":"to Mary E. Brunkow, Fred Ramsdell and shimon sakaguchi"},{"img":21}],"id":"2025-nobel-medicine:pic-main","v":"34eba5"}]},{"id":"2025-nobel-physics","subj":"s13","name":"2025 NOBEL PHYSICS","cards":[{"path":[],"roles":["pic"],"rows":[{"img":22}],"id":"2025-nobel-physics:pic-main","v":"559ba5"}]},{"id":"2025-nobel-chemistry","subj":"s13","name":"2025 NOBEL CHEMISTRY","cards":[{"path":[],"roles":["pic"],"rows":[{"img":23}],"id":"2025-nobel-chemistry:pic-main","v":"0a26bf"}]},{"id":"2026-fields-medal","subj":"s13","name":"2026 Fields medal","cards":[{"path":[],"roles":["news"],"rows":[{"t":"For over a century, mathematicians and physicists sought to mathematically connect the microscopic behavior of individual molecules (such as gas particles bouncing off each other) to the large-scale fluid equations used in engineering. This ties back to David Hilbert's famous list of 23 problems meant to define 20th-century mathematics.","h":"<b>The Problem:<\/b>"},{"t":"Deng provided a rigorous mathematical derivation of the <b>Boltzmann equation<\/b> <i>(the foundational mathematical equation that describes how the physical properties of a gas, such as temperature, pressure, and velocity, change when its microscopic particles collide)<\/i> directly from the mechanics of hard-sphere particle collisions in <b>rarefied gases<\/b> <i>(a gas that is at a very low pressure or density, meaning its molecules are widely spaced apart and rarely interact except when colliding)<\/i>. His work builds a firm bridge between probability, particle interactions, and macroscopic fluid flows.","h":"<b>The Breakthrough:<\/b>"},{"sec":"2. John Pardon: Counting Curves and Unlocking Geometry"},{"t":"<b>Symplectic geometry<\/b> <i>(a branch of mathematics that studies spaces equipped with a mathematical structure used to measure areas and volumes, particularly useful in classical mechanics)<\/i> describes how physical systems move and change over time (such as planets orbiting stars or rocks rolling down hills).","h":"<b>The Problem:<\/b>"},{"t":"A major challenge in modern geometry and string theory involved finding reliable ways to count geometric curves on complex multi-dimensional spaces known as <b>Calabi–Yau 3-folds<\/b> <i>(special six-dimensional geometric shapes used in theoretical physics and string theory to describe the hidden dimensions of space)<\/i>.","cont":1},{"t":"Pardon successfully proved the 20-year-old <b>MNOP conjecture<\/b> <i>(a specific mathematical prediction or educated guess regarding how to count curves on Calabi–Yau spaces using two entirely different advanced frameworks)<\/i>, demonstrating that two completely different methods used by physicists and mathematicians to count these curves yield the exact same result.","h":"<b>The Breakthrough:<\/b>"},{"t":"His novel approaches to <b>virtual fundamental cycles<\/b> <i>(a sophisticated algebraic tool used to properly measure and count geometric objects when the standard ways of measuring break down or intersect poorly)<\/i> and spaces of geometric structures also advanced <b>knot theory<\/b> <i>(the mathematical study of closed, tangled loops in three-dimensional space)<\/i> and <b>manifold topology<\/b> <i>(the study of the properties of geometrical shapes that are preserved through continuous deformations, like stretching or bending, without tearing)<\/i>."}],"title":"1. Yu Deng: Connecting Microscopic Particles to Macroscopic Physics","id":"2026-fields-medal:news-1-yu-deng-connecting-microscopic-particl","v":"b1875d"},{"path":[],"roles":["news"],"rows":[{"t":"Number theory studies the fundamental properties of whole numbers, while <b>algebraic geometry<\/b> <i>(a branch of mathematics that studies geometric shapes defined by polynomial equations, bridging algebra and geometry)<\/i> uses geometric shapes to analyze equations. Translating insights between these fields is notoriously difficult because many geometric shapes are jagged, wild, or structurally incompatible with standard calculus and arithmetic.","h":"<b>The Problem:<\/b>"},{"t":"Tsimerman made history by importing <b>o-minimality<\/b> <i>(a framework from mathematical logic designed to eliminate infinite, wild, or pathological sets by ensuring shapes can be broken down into a finite number of well-behaved, smooth pieces)<\/i> into arithmetic and complex algebraic geometry.","h":"<b>The Breakthrough:<\/b>"},{"t":"Using this framework, he played a central role in proving several major structural hypotheses, most notably <b>Griffiths' conjecture<\/b> <i>(a famous mathematical prediction about how geometric shapes change and vary systematically across families of equations)<\/i> and the <b>André-Oort conjecture<\/b> <i>(a major prediction in number theory about where special points lie on complex algebraic curves and surfaces)<\/i>.","cont":1},{"sec":"4. Hong Wang: Solving the 3D Kakeya Conjecture"},{"t":"The <b>Kakeya problem<\/b> <i>(a famous geometric puzzle first posed by Japanese mathematician Soichi Kakeya in 1917 concerning the smallest space needed to reverse the direction of a line segment)<\/i> asks a deceptively simple question: Imagine a needle lying on a flat surface; what is the absolute minimum amount of area required to rotate that needle so that it ends up pointing in every single direction?","h":"<b>The Problem:<\/b>"},{"t":"While solved for 2D planes decades ago, extending the puzzle to 3D space proved exceptionally difficult, lacking a full solution for half a century.","cont":1},{"t":"Alongside Joshua Zahl, Wang published a massive 127-page solution resolving the three-dimensional Kakeya conjecture. Her deep contributions to <b>harmonic analysis<\/b> <i>(an advanced branch of mathematics that studies how complex functions can be broken down into simpler wave-like components, extending the ideas of Fourier series)<\/i> and <b>geometric measure theory<\/b> <i>(the study of the geometric properties of subsets of space, such as their length, area, and volume, using advanced calculus)<\/i> provide crucial analytical tools used across signal processing, image reconstruction, and advanced spatial mathematics.","h":"<b>The Breakthrough:<\/b>"}],"title":"3. Jacob Tsimerman: \"Taming\" Wild Shapes in Number Theory","id":"2026-fields-medal:news-3-jacob-tsimerman-taming-wild-shapes-in","v":"7eee3c"}]},{"id":"deepak-dhar-and-the-dirac-medal","subj":"s13","name":"Deepak Dhar and the Dirac Medal","cards":[{"path":[],"roles":["news"],"rows":[{"t":"The Dirac Medal.","h":"<b>The Award:<\/b>"},{"t":"The International Centre for Theoretical Physics (ICTP) in Trieste, Italy, announced annually on the birthday of British physicist Paul A.M. Dirac.","h":"<b>Awarded By:<\/b>"},{"t":"Given to physicists for outstanding contributions to theoretical physics, specifically excluding existing Nobel laureates, Fields Medallists, or Wolf Prize laureates.","h":"<b>Purpose:<\/b>"},{"t":"Deepak Dhar (shared with Bernard Derrida, Marc Mézard, and Haim Sompolinsky). He is the second Indian to win this medal, following string theorist Ashoke Sen in 2012.","h":"<b>The Winner:<\/b>"}],"title":"Award & Recognition Overview","id":"deepak-dhar-and-the-dirac-medal:news-award-recognition-overview","v":"9ec606"},{"path":[],"roles":["news"],"rows":[{"t":"Statistical Physics & Abelian Sandpiles","h":"The Core Science:"},{"t":"Dhar's work centers on statistical mechanics, which studies how the collective behavior of vast numbers of particles creates large-scale patterns.","h":"<b>The Field:<\/b>"},{"t":"Proposed in the late 1980s, this principle describes systems that naturally organize into a delicately balanced critical state where tiny nudges can trigger effects of any size (like earthquakes, forest fires, or species extinction).","h":"<b>Self-Organized Criticality:<\/b>"},{"sec":"<b>The Abelian Sandpile Model:<\/b>"},{"t":"Developed by Dhar and his collaborators as a mathematical framework for self-organized criticality."},{"t":"No matter what sequence grains topple and cascade in, the sandpile always settles into the exact same final shape.","h":"<b>What 'Abelian' means:<\/b>"},{"t":"Dhar’s key insight allowed physicists to calculate exact answers and predict the final shape of these unstable systems.","h":"<b>Significance:<\/b>"},{"t":"Used to model earthquakes, forest fires, neural network bursts in the brain, and financial market fluctuations.","h":"<b>Real-World Applications:<\/b>"}],"title":"The Core Science:","id":"deepak-dhar-and-the-dirac-medal:news-the-core-science","v":"f8ba36"}]}],"pin":{"lead":"any new tech would have these problems :","heads":["Adaptability","digital divide","tech savvy","interoperability","risk (social, privacy, power etc.)"],"niche":"if tech is really niche then ethical concerns especially if biotech related","vd":"<b>The Vigyan Dhara Scheme<\/b>, approved by the Union Cabinet, unifies three umbrella schemes to strengthen India’s Science, Technology, and Innovation (STI) ecosystem. It aims to build human resources, expand R&D capacity, and promote gender parity in science and technology. Running from 2021-22 to 2025-26, it supports indigenous innovation, international collaboration, and India’s goal to be a global STI leader."},"title":"S&amp;T Flashcards","subtitle":"Science and Tech · 13 subjects · 79 topics","img":{"0":"img/00.jpg","1":"img/01.png","2":"img/02.jpg","3":"img/03.jpg","4":"img/04.jpg","5":"img/05.jpg","6":"img/06.jpg","7":"img/07.png","8":"img/08.jpg","9":"img/09.jpg","10":"img/10.jpg","11":"img/11.jpg","12":"img/12.jpg","13":"img/13.png","14":"img/14.png","15":"img/15.png","16":"img/16.png","17":"img/17.jpg","18":"img/18.jpg","19":"img/19.jpg","20":"img/20.jpg","21":"img/21.jpg","22":"img/22.jpg","23":"img/23.jpg"}},env:{"subjects":[{"id":"s01","name":"1. CONSERVATION"},{"id":"s02","name":"2. Climate Change"},{"id":"s03","name":"3. Pollution"},{"id":"s04","name":"4. RENEWABLE ENERGY"},{"id":"s05","name":"5. DISASTER MANAGEMENT"},{"id":"s06","name":"6. ENVIRONoMENTAL IMPACT ASSESSMENT (EIA)"}],"topics":[{"id":"overview","subj":"s01","name":"Overview","cards":[{"path":[],"roles":["fact"],"rows":[{"t":"20% foresrts are under protection of state departments more than the Aichi target 11 (The Aichi Biodiversity Targets are a set of 20 global goals established in 2010 to combat the loss of biodiversity. They were part of the Strategic Plan for Biodiversity 2011–2020, adopted by the parties of the Convention on Biological Diversity (CBD) during the COP10 summit in Nagoya, Aichi Prefecture, Japan.) (target 11 : This is often considered the most famous Aichi Target. It aimed to protect: 17% of terrestrial and inland water areas 10% of coastal and marine area)"}],"id":"overview:fact-main","v":"d41ca3","q":"What share of India&#x27;s forests is under protection, and how does it compare with Aichi Target 11?"},{"path":[],"roles":["def"],"rows":[{"t":"<span class=\"lst\"><span class=\"li\">the most individuals (or resource use) an area can support for ever without degrading its resources (Exceeded → resources run down (aquifers, rivers, grass)<\/span><br><span class=\"li\">sudden population crash<\/span><br><span class=\"li\">overshoot lowers the area's future capacity (overfished lake never gets its fish back even after fishing stops)<\/span><\/span>","h":"Carrying capacity :"},{"t":"<span class=\"lst\"><span class=\"li\">Used in planning: carrying-capacity studies for hill towns (SC asked Himalayan states for one, 2023)<\/span><br><span class=\"li\">caps on tourists and vehicles<\/span><br><span class=\"li\">basis for EIA and master plans (eg. Joshimath sinking 2023 = capacity ignored)<\/span><\/span>","cont":1}],"title":"Carrying capacity :","id":"overview:def-carrying-capacity","v":"cfefed","q":"What is carrying capacity, what happens when it is crossed, and how is it used in planning?"},{"path":[],"roles":["eg","gov"],"rows":[{"t":"<span class=\"ls
