<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S&amp;T Flashcards</title>
<style>
/*CSS_GS3*/
/* ---------- S&T additions ---------- */
:root{--st:#0f6e78;--st-soft:#e0f0f1;--sec:#55565c}
@media (prefers-color-scheme: dark){:root{--st:#62c6cf;--st-soft:#17302f;--sec:#b3b5bb}}
.chip.st{color:var(--st);background:var(--st-soft)}
.chip.tbl{color:var(--data);background:var(--data-soft)}
.crumb{font-size:12.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-top:22px;line-height:1.4}
.crumb .sep{opacity:.6;margin:0 4px}
.front .ttl.q{margin-top:6px}
.partline{font-size:13.5px;color:var(--ink2);margin-top:2px}
.partline b{font-weight:600}
.sec{font-size:13px;font-weight:700;color:var(--sec);letter-spacing:.01em;margin:10px 2px 0;line-height:1.4}
.sec:first-child{margin-top:0}
.rw .hd{color:var(--st);text-transform:none;letter-spacing:0;font-size:14px;font-weight:650}
.rw .hd.tb{color:var(--data)}
.rw.s0 .body.hb .hd{margin:1px 0 0}
.ln .th{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink3);margin-right:4px}
.pic{margin:6px 0 2px;text-align:center}
.pic.big img{max-height:none}
.pic img{max-width:100%;max-height:420px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:zoom-in}
.vid{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;margin:4px 2px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;z-index:20;padding:16px;cursor:zoom-out}
.lightbox.on{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;background:#fff}
.lst{display:block}.lst>br{display:none}
.lst .li{display:block;position:relative;padding:2px 0 2px 14px}
.lst .li:before{content:"";position:absolute;left:2px;top:.78em;width:5px;height:5px;border-radius:50%;background:var(--ink3)}
.lst .li2{margin-left:16px}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:auto}
.chip.role{font-size:12px;padding:3px 9px}
.chip.def{color:var(--define);background:var(--define-soft)} .chip.how{color:var(--st);background:var(--st-soft)}
.chip.use{color:var(--for);background:var(--for-soft)} .chip.issue{color:var(--against);background:var(--against-soft)}
.chip.fix{color:var(--value);background:var(--value-soft)} .chip.gov{color:var(--accent);background:var(--accent-soft)}
.chip.news{color:var(--data);background:var(--data-soft)} .chip.fact{color:var(--ink2);background:var(--strip)}
.chip.tbl{color:var(--data);background:var(--data-soft)} .chip.pic{color:var(--st);background:var(--st-soft)}
.cnt{font-size:12px;color:var(--ink3);font-weight:600;margin-left:2px}
.cueline{font-size:14px;color:var(--ink2);margin-top:8px;line-height:1.5}
.cueline .dot{color:var(--ink3)}
.sec.tg{color:var(--st);text-transform:uppercase;letter-spacing:.04em;font-size:12px}
.rw.cont{margin-top:-4px}
.rw.cont .n{opacity:.55}
.headrow{font-size:12px;color:var(--ink3);margin:-4px 0 10px}

/* deck switch (S&T | Environment & DM) */
.deckbar{display:inline-flex;background:var(--strip);border-radius:999px;padding:3px;gap:2px;margin:2px 0 8px}
.deckbar button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.deckbar button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* Environment & DM: section list with tap-to-open topics, circle filter, PYQ star */
mark{background:#d6efd9;color:inherit;border-radius:3px;padding:0 2px}
@media (prefers-color-scheme: dark){mark{background:#234a2e}}
.chip.eg{color:var(--for);background:var(--for-soft)} .chip.cause{color:var(--against);background:var(--against-soft)} .chip.effect{color:var(--value);background:var(--value-soft)}
.envnav{display:flex;flex-direction:column;gap:8px}
.navrow{display:flex;gap:8px;align-items:center}
.navbtn{flex:1 1 auto;min-width:0;display:flex;justify-content:space-between;align-items:center;gap:8px;font:inherit;font-size:13.5px;border:0;background:var(--strip);color:var(--ink);border-radius:10px;padding:8px 10px;text-align:left;cursor:pointer}
.navbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbtn .car{flex:0 0 auto;color:var(--ink3);font-size:11px}
.circ{display:inline-flex;background:var(--strip);border-radius:10px;padding:3px;gap:2px;flex:0 0 auto}
.circ button{border:0;background:transparent;border-radius:8px;padding:5px 8px;font-size:14px;line-height:1;cursor:pointer;opacity:.35;filter:grayscale(1)}
.circ button.on{background:var(--card);opacity:1;filter:none;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.navpanel{display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:62vh;overflow:auto;padding:4px 0}
.navpanel.on{display:block}
.nv{display:flex;align-items:baseline;gap:8px;padding:9px 14px;cursor:pointer;font-size:14px;border-top:1px solid var(--line)}
.nv:first-child{border-top:0}
.nv span{flex:1 1 auto;min-width:0}
.nv small{flex:0 0 auto;font-size:12px;color:var(--ink3)}
.nv i{font-style:normal;color:var(--ink3);font-size:11px}
.nv.sec{font-weight:650}
.nv.sec.open{background:var(--strip)}
.nv.sec.open small{color:var(--accent)}
.nv.tp{padding-left:28px;border-top:0;font-size:13.5px;padding-top:7px;padding-bottom:7px}
.nv.cur{color:var(--accent)}
.nv.whole{font-weight:600;color:var(--accent)}
.nv .st{color:#c9a227;font-weight:700}
.star{border:0;background:#fbf3d6;color:#8a6516;border-radius:999px;padding:3px 9px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
@media (prefers-color-scheme: dark){.star{background:#3a3218;color:#e3c66a}}
.pq{margin:6px 0 0;padding:0;list-style:none}
.pq li{padding:9px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.5}
.pq li:first-child{border-top:0}
.pyqside{display:none;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px 10px}
.pyqside h3,#qbox h3{margin:0 0 4px;font-family:var(--serif);font-size:16px}
.pyqside .x{float:right;border:0;background:none;color:var(--ink3);font-size:20px;line-height:1;cursor:pointer;padding:0 0 0 8px}
@media (min-width:1400px){.pyqside{position:fixed;top:64px;right:calc(50vw + 370px);width:min(380px,calc(50vw - 400px));max-height:calc(100vh - 150px);overflow:auto}}
.pin .kw{font-size:14.5px;line-height:1.55;color:var(--ink)}
.readn{display:inline-block;margin-top:4px;font-size:13px;color:var(--ink2);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 11px}
.pin .kw b{font-family:var(--serif);font-size:17px}

/* pinned issue heads from the page title */
.pin{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin:0 0 14px;font-size:14px;line-height:1.5}
.pin summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;gap:8px;align-items:baseline}
.pin summary::-webkit-details-marker{display:none}
.pin summary .one{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.pin summary .tw{flex:0 0 auto;font-size:12px;color:var(--ink3)}
.pin[open] summary .one{display:none} .pin[open] summary{justify-content:flex-end}
.pin[open] summary .tw:after{content:"hide"} .pin:not([open]) summary .tw:after{content:"show"}
.pin .in{padding:0 16px 14px}
.pin .lead{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.35;color:var(--ink)}
.pin ul{margin:8px 0 0;padding:0;list-style:none}
.pin li{padding:6px 0 6px 14px;border-top:1px solid var(--line);position:relative;font-size:15px;font-weight:600;color:var(--ink)}
.pin li:first-child{border-top:0}
.pin li:before{content:"";position:absolute;left:0;top:14px;width:6px;height:6px;border-radius:50%;background:var(--st)}
.pin .niche{margin-top:8px;padding:9px 11px;border-radius:10px;background:var(--st-soft);color:var(--ink);font-size:14px}
.pin .vd{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink3);line-height:1.5}
.pin .vd b{color:var(--ink2)}
/* wide screens: the box sits beside the card and stays on screen */
@media (min-width:1060px){
  .wrap{max-width:none;width:680px;margin-left:calc(50vw - 530px);margin-right:0}
  .actions .in{max-width:648px;margin-left:calc(50vw - 530px)}
  .pin{position:fixed;top:64px;left:calc(50vw + 190px);width:340px;max-height:calc(100vh - 150px);overflow:auto;margin:0}
  .pin summary{display:none}
  .pin .in{padding:16px 18px 16px}
}
@media (min-width:1400px){
  .wrap{margin-left:auto;margin-right:auto}
  .actions .in{margin-left:auto;margin-right:auto}
  .pin{left:calc(50vw + 370px);width:min(380px,calc(50vw - 400px))}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="deckbar" id="deckbar"><button data-d="st">S&amp;T</button><button data-d="env">Environment &amp; DM</button></div>
  <header><h1 id="title">S&amp;T Flashcards</h1><span class="sub" id="subtitle"></span></header>
  <div class="controls">
    <div class="selrow">
      <select id="subjSel" aria-label="Subject"></select>
      <select id="topicSel" aria-label="Topic"></select>
    </div>
    <div class="envnav" id="envNav" style="display:none">
      <div class="navrow"><button class="navbtn" id="navBtn"><span id="navLbl">All sections</span><span class="car">▼</span></button>
        <div class="circ" id="circRow"><button data-c="g" title="Learn">🟢</button><button data-c="y" title="Answer-ready">🟡</button><button data-c="w" title="Skip">⚪</button></div></div>
      <div class="navpanel" id="navPanel"></div>
    </div>
    <div class="row">
      <div class="seg" id="modeSeg">
        <button data-v="order">In order</button><button data-v="topics">Shuffle topics</button><button data-v="all">Shuffle all</button><button data-v="smart">Smart</button>
      </div>
    </div>
    <div class="progress">
      <div class="bar"><i class="k" id="pk"></i><i class="m" id="pm"></i></div>
      <span class="legend"><b id="nk">0</b> known · <b id="nm">0</b> missed · <b id="nn">0</b> new</span>
      <button class="toggle" id="missTgl">Missed only</button>
    </div>
  </div>
  <details class="pin" id="pin"><summary><span class="one" id="pinOne"></span><span class="tw"></span></summary><div class="in" id="pinIn"></div></details>
  <div id="stage"></div>
  <div class="foot">
    <button class="linkbtn" id="progBtn">Progress by subject</button>
    <button class="linkbtn" id="syncBtn">Sync across devices</button>
    <button class="linkbtn" id="resetBtn">Reset progress</button>
  </div>
</div>
<div class="actions"><div class="in" id="actions"></div></div>
<div class="toast" id="toast"></div>
<div class="lightbox" id="lightbox"><img id="lbImg" alt=""></div>
<div class="modal" id="modal"><div class="box">
  <h3>Reset progress?</h3>
  <p>This clears every card's known and missed status and your place in the deck. It cannot be undone.</p>
  <div class="row"><button class="btn ghost" id="mCancel">Cancel</button><button class="btn miss" style="flex:0 0 auto" id="mOk">Reset</button></div>
</div></div>
<div class="modal" id="smodal"><div class="box sync" id="sbox"></div></div>
<div class="modal" id="qmodal"><div class="box wide sheet" id="qbox"></div></div>
<div class="pyqside" id="pyqSide"></div>
<div class="modal" id="pmodal"><div class="box wide sheet" id="pbox"></div></div>
<script>
const DECKS={st:/*DATA*/,env:/*ENVDATA*/};
</script>
<script>
(function(){
"use strict";
let DK="st"; try{ if(DECKS.env&&localStorage.getItem("deckpick.v1")==="env") DK="env"; }catch(e){}
const DECK=DECKS[DK], ENV=DK==="env";
const KEY=ENV?"envdeck.v1":"stdeck.v1";
const CIRC={g:"🟢",y:"🟡",w:"⚪"}, UNIT=ENV?"section":"subject";
const BUILD="/*BUILD*/";
const $=s=>document.querySelector(s);
const SUBJ={}; DECK.subjects.forEach(s=>SUBJ[s.id]=s.name);
const IMG=DECK.img||{};

/* ---------- deck switch: each deck keeps its own place, progress and schedule ---------- */
(function deckbar(){
  const el=$("#deckbar"); if(!DECKS.env){ el.style.display="none"; return; }
  if(ENV) document.title="Environment & DM Flashcards";
  el.querySelectorAll("button").forEach(b=>{ b.classList.toggle("on",b.dataset.d===DK);
    b.onclick=()=>{ if(b.dataset.d===DK) return; try{localStorage.setItem("deckpick.v1",b.dataset.d);}catch(e){} location.reload(); }; });
})();
/* ---------- pinned box (word for word from the notes) ---------- */
const PINKEY=ENV?"envpin.v1":"stpin.v1";
(function pin(){
  const P=DECK.pin, el=$("#pin");
  if(ENV){ $("#pinOne").textContent="Keywords to use · PARFREII";
    $("#pinIn").innerHTML=`<div class="kw">${P.kw}</div><div class="vd">${P.pf}</div>`; }
  else{
  $("#pinOne").textContent=P.heads.join(", ");
  $("#pinIn").innerHTML=`<div class="lead">${P.lead}</div><ul>${P.heads.map(h=>`<li>${h}</li>`).join("")}</ul><div class="niche">${P.niche}</div><div class="vd">${P.vd}</div>`;
  }
  let open=null; try{open=localStorage.getItem(PINKEY);}catch(e){}
  el.open=open===null?false:open==="1";
  el.addEventListener("toggle",()=>{ if(matchMedia("(min-width:1060px)").matches) return; try{localStorage.setItem(PINKEY,el.open?"1":"0");}catch(e){} });
  const wide=()=>{ if(matchMedia("(min-width:1060px)").matches) el.open=true; else{ let o=null; try{o=localStorage.getItem(PINKEY);}catch(e){} el.open=o==="1"; } };
  wide(); matchMedia("(min-width:1060px)").addEventListener("change",wide);
})();

/* ---------- build cards ---------- */
const cards={}, groups=[];
DECK.topics.forEach(t=>{
  const g={key:t.id,subj:t.subj,name:t.name,ids:[],circle:t.circle||null,pyq:(t.pyq||[]).length};
  t.cards.forEach(c=>{
    const nrow=c.rows.filter(r=>"t" in r).length;
    cards[c.id]={id:c.id,topic:t,payload:c,count:nrow};
    g.ids.push(c.id);
  });
  groups.push(g);
});

/* ---------- state ---------- */
let S=load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.v===1) return s;}catch(e){}
  return {v:1,subj:"all",topic:"all",mode:"order",missed:false,queue:null,pos:0,st:{},back:false};
}
let lastSig=null;
const placeSig=()=>[S.subj,S.topic,S.mode,S.missed,S.pos,S.round,(S.queue||[]).length,(S.queue||[])[0],(S.queue||[])[S.pos]].join("|");
function save(){const sig=placeSig(); if(sig!==lastSig){ if(lastSig!==null){S.at=Date.now(); setTimeout(()=>{try{queueSync();}catch(e){}},0);} lastSig=sig; }
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const isMissed=id=>S.st[id]&&S.st[id].s==="m";
function circOK(g){ if(!ENV||!g.circle) return true; return !(S.circ&&S.circ[g.circle]===false); }   /* topics with no circle always show */
function scopeGroups(){ return groups.filter(g=>(S.subj==="all"||g.subj===S.subj)&&(S.topic==="all"?circOK(g):g.key===S.topic)); }
function filteredGroups(){ return scopeGroups().map(g=>{let ids=g.ids; if(S.missed) ids=ids.filter(isMissed); return {key:g.key,ids};}).filter(g=>g.ids.length); }
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
/* Smart order: weakest first, then cards due for review, new cards mixed in, well-known cards last.
   A known card comes due again after 1, 3, 7, 14, 30 or 60 days, longer the more often you've got it right. */
const DAY=864e5, GAPS=[1,3,7,14,30,60];
function smartQueue(ids){
  const now=Date.now(), weak=[], due=[], fresh=[], later=[];
  ids.forEach(id=>{const o=S.st[id];
    if(!o||!o.s){ fresh.push(id); return; }
    if(o.s==="m"){ weak.push([id,-(o.miss/Math.max(1,o.seen)),o.t||0]); return; }
    const strength=Math.max(1,(o.seen-o.miss)-o.miss), gap=GAPS[Math.min(strength,GAPS.length)-1]*DAY, over=(now-(o.t||0))/gap;
    (over>=1?due:later).push([id,-over]); });
  weak.sort((a,b)=>a[1]-b[1]||a[2]-b[2]); due.sort((a,b)=>a[1]-b[1]); later.sort((a,b)=>a[1]-b[1]);
  const rev=weak.concat(due).map(x=>x[0]), q=[]; let i=0,j=0;
  while(i<rev.length||j<fresh.length){ for(let k=0;k<2&&i<rev.length;k++) q.push(rev[i++]); if(j<fresh.length) q.push(fresh[j++]); }
  S.dueN=q.length; return q.concat(later.map(x=>x[0]));
}
function buildQueue(){
  let gs=filteredGroups(), q;
  if(S.mode==="order"){ q=gs.flatMap(g=>g.ids); }
  else if(S.mode==="topics"){
    gs=shuffle(gs); const miss=gs.filter(g=>g.ids.some(isMissed)), rest=gs.filter(g=>!g.ids.some(isMissed));
    q=miss.concat(rest).flatMap(g=>g.ids);
  } else if(S.mode==="smart"){ q=smartQueue(gs.flatMap(g=>g.ids)); }
  else { const all=shuffle(gs.flatMap(g=>g.ids)); q=all.filter(isMissed).concat(all.filter(i=>!isMissed(i))); }
  if(S.mode!=="smart") S.dueN=null;
  S.queue=q; S.round=1; S.pos=0; S.back=false; save();
}
function validQueue(){return Array.isArray(S.queue)&&S.queue.every(id=>cards[id]);}
if(Array.isArray(S.queue)&&S.queue.length&&!validQueue()){ /* cards removed in a deck update: skip them, keep your place */
  const gone=S.queue.slice(0,S.pos).filter(id=>!cards[id]).length;
  S.queue=S.queue.filter(id=>cards[id]); S.pos=Math.max(0,Math.min(S.pos-gone,S.queue.length));
}
if(S.subj!=="all"&&!SUBJ[S.subj]){S.subj="all";S.topic="all";}
if(S.topic!=="all"&&!groups.some(g=>g.key===S.topic)) S.topic="all";
if(!validQueue()||!S.queue.length) buildQueue();

/* ---------- reveal state ---------- */
let R=null;
function resetReveal(c){
  const rows=c.payload.rows, idx=[]; rows.forEach((r,i)=>{ if("t" in r) idx.push(i); });
  R={id:c.id,idx,steps:idx.map(()=>0),pre:idx.map(()=>false),marks:idx.map(()=>null)};
  const rec=S.st[c.id], r=rec&&rec.r&&(!rec.v||rec.v===c.payload.v)&&rec.v?rec.r:null;
  if(r&&r.some(x=>x===0)){ R.part=true; r.forEach((x,i)=>{ if(x===1&&i<R.steps.length){ R.steps[i]=1; R.pre[i]=true; } }); }
}
const allDone=()=>!R||R.steps.every(s=>s>=1);

/* ---------- render ---------- */
function counts(ids){let k=0,m=0; ids.forEach(id=>{const s=S.st[id]; if(s&&s.s==="k")k++; else if(s&&s.s==="m")m++;}); return {k,m,n:ids.length-k-m,t:ids.length};}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function render(){
  $("#title").innerHTML=DECK.title; $("#subtitle").textContent=DECK.subtitle+" · "+BUILD;
  document.querySelectorAll("#modeSeg button").forEach(b=>b.classList.toggle("on",b.dataset.v===S.mode));
  if(ENV){ document.querySelector(".selrow").style.display="none"; $("#envNav").style.display=""; renderNavBar(); }
  else{
  const ss=$("#subjSel"); ss.innerHTML='<option value="all">All subjects</option>'+DECK.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join(""); ss.value=S.subj;
  const tops=S.subj==="all"?[]:groups.filter(g=>g.subj===S.subj);
  const ts=$("#topicSel"); ts.innerHTML='<option value="all">All topics</option>'+tops.map(g=>`<option value="${g.key}">${esc(g.name.replace(/<[^>]+>/g,""))}</option>`).join(""); ts.value=S.topic; ts.disabled=tops.length<2; ts.style.display=tops.length<2?"none":"";
  }
  const scopeIds=scopeGroups().flatMap(g=>g.ids); const c0=counts(scopeIds);
  $("#nk").textContent=c0.k;$("#nm").textContent=c0.m;$("#nn").textContent=c0.n;
  $("#pk").style.width=(c0.t?c0.k/c0.t*100:0)+"%"; $("#pm").style.width=(c0.t?c0.m/c0.t*100:0)+"%";
  const mt=$("#missTgl"); mt.classList.toggle("on",S.missed); mt.textContent=S.missed?"Missed only ✓":"Missed only"; mt.disabled=!S.missed&&c0.m===0;
  const stage=$("#stage");
  sidePYQ();
  if(!S.queue.length){ stage.innerHTML=`<div class="card"><div class="done"><h2>No cards here</h2><p>${S.missed?"Nothing is marked missed in this selection.":"Pick another subject or topic."}</p></div></div>`; actions([]); return; }
  if(S.pos>=S.queue.length){ renderDone(stage); return; }
  const c=cards[S.queue[S.pos]];
  if(!R||R.id!==c.id) resetReveal(c);

  $("#sOff").onclick=()=>{SY=null; saveSY(); closeSync(); syncLabel("Sync across devices"); toast("Sync off on this device");};
}
$("#syncBtn").onclick=()=>{ if(!SY) setupSheet(); else if(/fix/.test(st8)) setupSheet(); else if(/retry/.test(st8)) syncNow(); else onSheet(); };
$("#smodal").onclick=e=>{if(e.target.id==="smodal") closeSync();};
document.addEventListener("visibilitychange",()=>{ if(!SY) return; if(document.visibilityState==="visible") syncNow(); else if(sTimer) syncNow(); });
syncLabel(SY?"Syncing…":"Sync across devices"); if(SY) syncNow();
setInterval(()=>{ if(SY&&document.visibilityState==="visible"&&!sTimer&&!syncing) syncNow(); },20000);
$("#pmodal").onclick=e=>{if(e.target.id==="pmodal") $("#pmodal").classList.remove("on");};
$("#resetBtn").onclick=()=>$("#modal").classList.add("on");
$("#mCancel").onclick=()=>$("#modal").classList.remove("on");
$("#mOk").onclick=()=>{const keep={subj:S.subj,topic:S.topic,mode:S.mode}; S={v:1,...keep,missed:false,queue:null,pos:0,st:{},back:false,resetAt:Date.now()}; queueSync(); buildQueue(); R=null; $("#modal").classList.remove("on"); render(); toast("Progress reset");};
let tt; function toast(m){const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),1600);}
document.addEventListener("keydown",e=>{
  if($("#lightbox").classList.contains("on")){ if(e.key==="Escape"||e.key===" "||e.key==="Enter"){e.preventDefault(); $("#lightbox").classList.remove("on");} return; }
  if($("#modal").classList.contains("on")||$("#pmodal").classList.contains("on")||$("#smodal").classList.contains("on")||$("#qmodal").classList.contains("on")) return;
  if(e.target.tagName==="SELECT"||e.target.tagName==="INPUT"||e.target.tagName==="SUMMARY") return;
  if(!S.queue.length||S.pos>=S.queue.length) return;
  if(e.key===" "||e.key==="Enter"){e.preventDefault(); if(!S.back) flip(); else if(!nextStep()) unflip(); }
  else if(S.back&&(e.key==="1"||e.key==="m")) grade("m");
  else if(S.back&&(e.key==="2"||e.key==="g")) grade("k");
  else if(S.back&&e.key==="a") showAll();
  else if(e.key==="ArrowLeft") prev();
  else if(e.key==="ArrowRight") next();
});
/* ---------- Environment & DM: section list (tap a section to open its topics), circle filter, PYQ star ---------- */
let OPEN=null;
function navLabel(){ if(S.topic!=="all"){ const g=groups.find(x=>x.key===S.topic); if(g) return (g.circle?CIRC[g.circle]+" ":"")+strip(g.name); }
  return S.subj==="all"?"All sections":SUBJ[S.subj]; }
function renderNavBar(){
  $("#navLbl").textContent=navLabel();
  document.querySelectorAll("#circRow button").forEach(b=>b.classList.toggle("on",!(S.circ&&S.circ[b.dataset.c]===false)));
  if($("#navPanel").classList.contains("on")) renderNav();
}
function renderNav(){
  const all=groups.filter(circOK).reduce((n,g)=>n+g.ids.length,0);
  const rows=[`<div class="nv all${S.subj==="all"?" cur":""}" data-a="all"><span>All sections</span><small>${all} cards</small></div>`];
  DECK.subjects.forEach(s=>{
    const ts=groups.filter(g=>g.subj===s.id&&circOK(g)), open=OPEN===s.id;
    rows.push(`<div class="nv sec${open?" open":""}${S.subj===s.id&&S.topic==="all"?" cur":""}" data-s="${s.id}"><span>${esc(s.name)}</span><small>${ts.length} topics</small><i>${open?"▲":"▼"}</i></div>`);
    if(open) rows.push(`<div class="nv tp whole${S.subj===s.id&&S.topic==="all"?" cur":""}" data-w="${s.id}"><span>Whole section</span><small>${ts.reduce((n,g)=>n+g.ids.length,0)}</small></div>`);
    if(open) ts.forEach(g=>rows.push(`<div class="nv tp${S.topic===g.key?" cur":""}" data-t="${g.key}"><span>${g.circle?CIRC[g.circle]+" ":""}${esc(strip(g.name))}${g.pyq?' <b class="st">★</b>':""}</span><small>${g.ids.length}</small></div>`));
  });
  const p=$("#navPanel"); p.innerHTML=rows.join("");
  p.querySelectorAll(".nv").forEach(el=>el.onclick=e=>{ e.stopPropagation();
    if(el.dataset.a){ closeNav(); S.subj="all"; S.topic="all"; rebuild("All sections"); }
    else if(el.dataset.s){ OPEN=OPEN===el.dataset.s?null:el.dataset.s; renderNav();   /* tap opens the topics, tap again folds them */
      if(OPEN) p.querySelector('[data-s="'+OPEN+'"]').scrollIntoView({block:"nearest"}); }
    else if(el.dataset.w){ closeNav(); S.subj=el.dataset.w; S.topic="all"; rebuild(SUBJ[S.subj]); }
    else if(el.dataset.t){ const g=groups.find(x=>x.key===el.dataset.t); closeNav(); S.subj=g.subj; S.topic=g.key; rebuild(strip(g.name)); }
  });
}
function closeNav(){ $("#navPanel").classList.remove("on"); }
if(ENV){
  $("#navBtn").onclick=e=>{ e.stopPropagation(); const p=$("#navPanel"); if(p.classList.contains("on")){ closeNav(); return; }
    OPEN=S.subj==="all"?null:S.subj; renderNav(); p.classList.add("on"); };
  document.addEventListener("click",e=>{ if(!e.target.closest("#envNav")) closeNav(); });
  document.querySelectorAll("#circRow button").forEach(b=>b.onclick=()=>{ const c=b.dataset.c; S.circ=Object.assign({g:true,y:true,w:true},S.circ||{});
    if(S.circ[c]&&["g","y","w"].filter(k=>S.circ[k]).length===1){ toast("Keep at least one"); return; }
    S.circ[c]=!S.circ[c]; rebuild("Showing "+["g","y","w"].filter(k=>S.circ[k]).map(k=>CIRC[k]).join(" ")); });
}
const pyqHTML=t=>`<h3>★ PYQs · ${esc(strip(t.name))}</h3><ul class="pq">${t.pyq.map(q=>`<li>${q}</li>`).join("")}</ul>`;
const WIDEQ="(min-width:1400px)";
function bindStar(c){ document.querySelectorAll("[data-pyq]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); openPYQ(c.topic); }); }
function openPYQ(t){
  if(matchMedia(WIDEQ).matches){ S.pyqSide=true; save(); sidePYQ(); return; }
  $("#qbox").innerHTML=pyqHTML(t)+`<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn ghost" id="qClose">Close</button></div>`;
  $("#qmodal").classList.add("on"); $("#qClose").onclick=()=>$("#qmodal").classList.remove("on");
}
function sidePYQ(){
  const el=$("#pyqSide"); if(!ENV){ el.style.display="none"; return; }
  const c=S.queue&&S.pos<S.queue.length?cards[S.queue[S.pos]]:null, t=c&&c.topic;
  const show=!!(S.pyqSide&&matchMedia(WIDEQ).matches&&t&&t.pyq&&t.pyq.length);
  el.style.display=show?"block":"none"; if(!show) return;
  el.innerHTML=`<button class="x" id="qx" aria-label="Close">×</button>`+pyqHTML(t);
  $("#qx").onclick=()=>{ S.pyqSide=false; save(); sidePYQ(); };
}
$("#qmodal").onclick=e=>{ if(e.target.id==="qmodal") $("#qmodal").classList.remove("on"); };
matchMedia(WIDEQ).addEventListener("change",sidePYQ);
$("#progBtn").textContent="Progress by "+UNIT;
render();
})();
</script>
</body>
